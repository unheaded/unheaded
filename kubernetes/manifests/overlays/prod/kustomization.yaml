apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pin a real release tag in prod. Override registry/tag for your environment.
images:
  - name: ghcr.io/stevenrbellis/unheaded/wotan
    newTag: v1.0.0
  - name: ghcr.io/stevenrbellis/unheaded/gateway
    newTag: v1.0.0

replicas:
  - name: monad
    count: 2
  - name: sophia
    count: 2
  - name: gateway
    count: 2
  - name: dashboard-backend
    count: 2

patches:
  # The edge is a real cloud LoadBalancer in prod (mirrors haproxy-edge host ports).
  - path: edge-loadbalancer.yaml
