apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: unheaded
  labels:
    app.kubernetes.io/name: clickhouse
    kingdom.tier: observability
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - { name: http, port: 8123, targetPort: 8123 }
    - { name: native, port: 9000, targetPort: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: unheaded
  labels:
    app.kubernetes.io/name: clickhouse
    kingdom.tier: observability
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        kingdom.tier: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.12
          ports:
            - { name: http, containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          env:
            - { name: CLICKHOUSE_DB, value: unheaded_logs }
            - { name: CLICKHOUSE_USER, value: unheaded }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: unheaded-secrets, key: CLICKHOUSE_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            # ClickHouse writes to several runtime paths; ro-rootfs not feasible here.
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
          readinessProbe:
            exec: { command: ["clickhouse-client", "--query", "SELECT 1"] }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "200m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
