# Prometheus scrapes /metrics on every workload. Allow ingress from the
# observability tier to all pods; allow Prometheus egress to all pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: unheaded
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              kingdom.tier: observability
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-egress
  namespace: unheaded
spec:
  podSelector:
    matchLabels:
      kingdom.tier: observability
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
