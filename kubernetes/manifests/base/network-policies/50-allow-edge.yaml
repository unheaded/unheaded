# The edge (loadbalancers/haproxy-edge, `kingdom.role: edge`) may reach the
# gateway and the published apps; the gateway may fan out to the core
# services. The HAProxy Kubernetes Ingress Controller and the Ingress object
# were removed 2026-11-03 (Stevie); there is no cross-namespace edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-to-published
  namespace: unheaded
spec:
  podSelector:
    matchLabels:
      kingdom.published: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              kingdom.role: edge
        - podSelector:
            matchLabels:
              kingdom.role: gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-egress
  namespace: unheaded
spec:
  podSelector:
    matchLabels:
      kingdom.role: edge
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: unheaded
spec:
  podSelector:
    matchLabels:
      kingdom.role: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
