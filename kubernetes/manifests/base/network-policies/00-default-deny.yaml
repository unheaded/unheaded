# Default-deny ALL ingress + egress in the namespace. Mirrors the NixOS
# "DENY ALL, explicit allow only" firewall baseline (CLAUDE.md Network Policies).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: unheaded
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
