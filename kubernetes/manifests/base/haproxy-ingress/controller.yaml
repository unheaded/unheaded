#
# HAProxy Kubernetes Ingress Controller — the Kingdom's on-prem edge.
#
# WHY THIS REPLACES the standalone `loadbalancers/haproxy-edge`: that was plain
# HAProxy in a container with a hand-written config and a host-port collision
# (edge + gateway both wanted 21443). Running HAProxy AS the ingress controller
# converges the edge and the `Ingress` resource into one: it watches Ingresses
# and reprograms HAProxy automatically, terminates TLS from per-Ingress Secrets,
# and routes to ClusterIP Services internally — no port collision.
#
# ON-PREM / HARD-WAY EXPOSURE: no cloud LoadBalancer. A NodePort Service binds
# the external Doom-Range ports (21080/21443/21404), all within the control
# plane's `--service-node-port-range=3000-32767` (see BUILD-PLAN). For a true
# every-node edge, convert to a DaemonSet with hostPort (overlay note in docs).
#
# HARDENING: the controller's frontends bind 8080/8443/1024/1042 — all >1023 —
# so it needs NO NET_BIND_SERVICE and stays PSA `restricted`. `readOnlyRootFile-
# system` is left false: the controller writes its generated HAProxy config at
# runtime (the one relaxation; tighten to RO-root + emptyDir once validated).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-kubernetes-ingress
  namespace: haproxy-controller
  labels:
    app.kubernetes.io/name: haproxy-kubernetes-ingress
    kingdom.role: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy-kubernetes-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haproxy-kubernetes-ingress
    spec:
      serviceAccountName: haproxy-kubernetes-ingress
      # Spread the two replicas across nodes so a node loss doesn't drop the edge.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: haproxy-kubernetes-ingress
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy-ingress
          # Pin to the latest verified release:
          # github.com/haproxytech/kubernetes-ingress/releases
          image: haproxytech/kubernetes-ingress:3.1
          args:
            - --configmap=haproxy-controller/haproxy-kubernetes-ingress
            - --ingress.class=haproxy
            - --disable-config-snippets=all   # defense-in-depth: no raw HAProxy snippets from Ingress annotations
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]   # no NET_BIND_SERVICE — all bind ports are >1023
          ports:
            - { name: http,    containerPort: 8080 }
            - { name: https,   containerPort: 8443 }
            - { name: stat,    containerPort: 1024 }
            - { name: healthz, containerPort: 1042 }
          env:
            - { name: TZ, value: "Etc/UTC" }
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: POD_IP,        valueFrom: { fieldRef: { fieldPath: status.podIP } } }
          livenessProbe:
            httpGet: { path: /healthz, port: 1042 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 1042 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
# NodePort Service: the on-prem external entry point. External clients reach the
# edge at <any-node-ip>:21443 (HTTPS) / :21080 (HTTP); kube-proxy load-balances
# across the controller replicas. The targetPort names map to the >1023 frontends.
apiVersion: v1
kind: Service
metadata:
  name: haproxy-kubernetes-ingress
  namespace: haproxy-controller
  labels:
    app.kubernetes.io/name: haproxy-kubernetes-ingress
    kingdom.role: edge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: haproxy-kubernetes-ingress
  ports:
    - { name: http,  port: 80,   targetPort: http,  nodePort: 21080 }
    - { name: https, port: 443,  targetPort: https, nodePort: 21443 }
    - { name: stat,  port: 1024, targetPort: stat,  nodePort: 21404 }
