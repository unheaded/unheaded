  007_grants.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — Cross-Database CONNECT Grants
    -- Run against each database to grant CONNECT where needed.

    -- All app_* users can CONNECT to unheaded_config (read config)
    DO $$
    BEGIN
        IF current_database() = 'unheaded_config' THEN
            EXECUTE 'GRANT CONNECT ON DATABASE unheaded_config TO app_kanban';
            EXECUTE 'GRANT CONNECT ON DATABASE unheaded_config TO app_timeguru';
            EXECUTE 'GRANT CONNECT ON DATABASE unheaded_config TO app_zhen';
            -- Grant SELECT on config tables to app users
            GRANT USAGE ON SCHEMA public TO app_kanban, app_timeguru, app_zhen;
            GRANT SELECT ON kingdom_config, service_registry TO app_kanban, app_timeguru, app_zhen;
        END IF;
    END $$;

    -- ops_reader can CONNECT to unheaded_app (dashboard reads tasks)
    DO $$
    BEGIN
        IF current_database() = 'unheaded_app' THEN
            EXECUTE 'GRANT CONNECT ON DATABASE unheaded_app TO ops_reader';
            GRANT USAGE ON SCHEMA public TO ops_reader;
            GRANT SELECT ON kanban_tasks, timeline_milestones, zhen_conversations TO ops_reader;
        END IF;
    END $$;
  008_zhen_memories.sql: |
    -- Zhen memories: cached good answers for future similarity matching
    -- Table: zhen_memories in unheaded_app database
    -- User: app_zhen (existing)

    -- Applied to unheaded_app (db/migrations/MANIFEST).

    CREATE TABLE IF NOT EXISTS zhen_memories (
        id          BIGSERIAL PRIMARY KEY,
        question    TEXT NOT NULL,
        answer      TEXT NOT NULL,
        embedding   BYTEA,
        source      VARCHAR(100) DEFAULT 'user',
        model       VARCHAR(50),
        created_at  TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_zhen_memories_created
        ON zhen_memories (created_at DESC);

    -- Grant access to app_zhen
    GRANT SELECT, INSERT, UPDATE, DELETE ON zhen_memories TO app_zhen;
    GRANT USAGE, SELECT ON SEQUENCE zhen_memories_id_seq TO app_zhen;
  009_zhen_actions.sql: |
    -- Zhen Champion Agent: Action log and snapshot tables
    -- Tables: zhen_actions, zhen_action_snapshots in unheaded_app database
    -- User: app_zhen (existing, expanded grants)
    -- ADR: ADR-019-zhen-champion-agent.md

    -- Applied to unheaded_app (db/migrations/MANIFEST).

    -- ==========================================================================
    -- zhen_actions — The Action Log
    -- Every operation Zhen performs or plans to perform. Rewindable history.
    -- No DELETE allowed. Actions are permanent records.
    -- ==========================================================================

    CREATE TABLE IF NOT EXISTS zhen_actions (
        id              BIGSERIAL PRIMARY KEY,
        session_id      VARCHAR(64) NOT NULL,
        action_type     VARCHAR(50) NOT NULL
            CHECK (action_type IN (
                -- File operations
                'file.read', 'file.write', 'file.patch',
                -- Config generation
                'config.nginx.generate', 'config.haproxy.generate',
                'config.yaml.edit', 'config.validate',
                -- Kanban operations
                'kanban.create', 'kanban.update', 'kanban.assign',
                'kanban.move', 'kanban.comment',
                -- Knowledge operations
                'corpus.teach', 'corpus.search', 'memory.remember', 'memory.forget',
                -- Service operations
                'service.health_check', 'service.status',
                -- Query operations
                'query.rag', 'query.followup'
                -- More to be added as capabilities grow
            )),
        status          VARCHAR(20) NOT NULL DEFAULT 'planned'
            CHECK (status IN ('planned', 'executing', 'completed', 'failed', 'reverted')),

        -- What Zhen intends to do (written BEFORE execution)
        intent          TEXT NOT NULL,           -- Human-readable description
        parameters      JSONB DEFAULT '{}',     -- Structured parameters for the action

        -- What happened (written AFTER execution)
        result          JSONB DEFAULT '{}',     -- Structured result
        result_summary  TEXT DEFAULT '',         -- Human-readable outcome
        error           TEXT DEFAULT '',         -- Error message if failed

        -- Revert info
        revertable      BOOLEAN DEFAULT FALSE,  -- Can this action be undone?
        reverted_by     BIGINT,                 -- ID of the action that reverted this one
        reverts_action  BIGINT,                 -- If this action IS a revert, which action it undoes

        -- Provenance
        triggered_by    VARCHAR(20) DEFAULT 'user'
            CHECK (triggered_by IN ('user', 'zhen', 'schedule', 'hook')),
        model           VARCHAR(50) DEFAULT '', -- Which model made the decision
        confidence      REAL DEFAULT 0.0,       -- Model's confidence in the action (0-1)

        -- Timing
        planned_at      TIMESTAMPTZ DEFAULT NOW(),
        started_at      TIMESTAMPTZ,
        completed_at    TIMESTAMPTZ,
        elapsed_ms      INTEGER DEFAULT 0,

        -- Trace
        trace_id        VARCHAR(64) DEFAULT '', -- Correlation ID across actions
        parent_action   BIGINT                  -- If this action was spawned by another
    );

    CREATE INDEX IF NOT EXISTS idx_zhen_actions_session ON zhen_actions(session_id);
    CREATE INDEX IF NOT EXISTS idx_zhen_actions_type ON zhen_actions(action_type);
    CREATE INDEX IF NOT EXISTS idx_zhen_actions_status ON zhen_actions(status);
    CREATE INDEX IF NOT EXISTS idx_zhen_actions_planned ON zhen_actions(planned_at DESC);
    CREATE INDEX IF NOT EXISTS idx_zhen_actions_trace ON zhen_actions(trace_id);

    -- ==========================================================================
    -- zhen_action_snapshots — The Before-State Archive
    -- Append-only. Stores the state BEFORE Zhen changes something.
    -- No UPDATE, no DELETE. The before-state is sacred.
    -- ==========================================================================

    CREATE TABLE IF NOT EXISTS zhen_action_snapshots (
        id              BIGSERIAL PRIMARY KEY,
        action_id       BIGINT NOT NULL REFERENCES zhen_actions(id),
        resource_type   VARCHAR(50) NOT NULL
            CHECK (resource_type IN (
                'file', 'kanban_task', 'config', 'memory',
                'corpus_chunk', 'service_state'
            )),
        resource_id     TEXT NOT NULL,           -- File path, task ID, config key, etc.
        content_before  TEXT,                    -- Full content before change
        content_after   TEXT,                    -- Full content after change (filled post-execution)
        metadata        JSONB DEFAULT '{}',     -- File permissions, timestamps, etc.
        snapshot_at     TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_zhen_snapshots_action ON zhen_action_snapshots(action_id);
    CREATE INDEX IF NOT EXISTS idx_zhen_snapshots_resource ON zhen_action_snapshots(resource_type, resource_id);

    -- ==========================================================================
    -- Grants for app_zhen
    -- zhen_actions: SELECT, INSERT, UPDATE (no DELETE — actions are permanent)
    -- zhen_action_snapshots: SELECT, INSERT (append-only, no UPDATE/DELETE)
    -- ==========================================================================

    GRANT SELECT, INSERT, UPDATE ON zhen_actions TO app_zhen;
    GRANT USAGE, SELECT ON SEQUENCE zhen_actions_id_seq TO app_zhen;

    GRANT SELECT, INSERT ON zhen_action_snapshots TO app_zhen;
    GRANT USAGE, SELECT ON SEQUENCE zhen_action_snapshots_id_seq TO app_zhen;
  010_zhen_conversations.sql: |
    -- 010_zhen_conversations.sql
    -- WAVE15 Phase 3: explicit migration for zhen_conversations.
    --
    -- The Python web UI (raft/zhen_app.py:_pg_log) has been writing against
    -- this table since pre-WAVE15 but no migration existed; the table was
    -- assumed to be created out-of-band or it silently failed (graceful-
    -- degrade: zhen_app.py keeps working without PG). Phase 3 codifies the
    -- schema so the writes are durable + queryable + indexed.
    --
    -- Schema mirrors the column list the Python's INSERT statement uses:
    --   session_id, role, content, sources (jsonb), model,
    --   tokens_input, tokens_output, elapsed_ms
    -- + computed search_vector (tsvector) for full-text recall used by
    --   /api/v1/conversations/search and the "recall <topic>" command.

    -- Applied to unheaded_app (db/migrations/MANIFEST).

    CREATE TABLE IF NOT EXISTS zhen_conversations (
        id              BIGSERIAL PRIMARY KEY,
        session_id      TEXT NOT NULL,
        role            VARCHAR(20) NOT NULL CHECK (role IN ('user', 'assistant')),
        content         TEXT NOT NULL,
        sources         JSONB DEFAULT '[]'::jsonb,
        model           VARCHAR(64),
        tokens_input    INTEGER DEFAULT 0,
        tokens_output   INTEGER DEFAULT 0,
        elapsed_ms      INTEGER DEFAULT 0,
        -- Generated FTS column. websearch_to_tsquery() in /api/v1/conversations/search
        -- queries this directly. Generated-stored is automatic + indexed.
        search_vector   tsvector
                        GENERATED ALWAYS AS (to_tsvector('english', content)) STORED,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    -- GIN on the tsvector — required for websearch_to_tsquery to scale
    -- beyond a few hundred rows.
    CREATE INDEX IF NOT EXISTS idx_zhen_conversations_search
        ON zhen_conversations USING GIN (search_vector);

    -- Recent-conversations queries (the "list last N" UI pattern) hit this.
    CREATE INDEX IF NOT EXISTS idx_zhen_conversations_session_created
        ON zhen_conversations (session_id, created_at DESC);

    -- Time-range queries for `recall <topic> [--days=N]` and similar.
    CREATE INDEX IF NOT EXISTS idx_zhen_conversations_created
        ON zhen_conversations (created_at DESC);

    -- Permissions: app_zhen is the writer + reader (the Python UI).
    -- ops_zhen + config_zhen don't touch this table; do not grant.
    GRANT SELECT, INSERT ON zhen_conversations TO app_zhen;
    GRANT USAGE, SELECT ON SEQUENCE zhen_conversations_id_seq TO app_zhen;

    -- Phase 3 H3 testing: the test_memory_poison fixture seeds and cleans
    -- up zhen_memories rows tagged source='poison'. We don't add anything
    -- to zhen_memories here; just note the pattern.

    -- Idempotent: re-running this migration is a no-op (CREATE IF NOT EXISTS).
  011_zhen_actions_relax_constraints.sql: |
    -- 011_zhen_actions_relax_constraints.sql
    --
    -- Migration 009 set CHECK constraints on zhen_actions.action_type and
    -- .triggered_by enumerating the action-type vocabulary as it stood
    -- when the table was first designed. The cmd/zhen-agentd daemon and
    -- pkg/champion gate emit a wider set:
    --
    --   action_type:
    --     tool_call_attempt
    --     tool_call_user_confirmed
    --     tool_call_confirmed_destructive_blocked
    --     tool_call_confirmed_path_denied
    --     runbook.execute        (was named differently in 009 — was missing entirely)
    --     denied_destructive
    --     denied_untrusted_justification
    --     ... (the list grows as new tools are added in pkg/champion/dispatch.go)
    --
    --   triggered_by:
    --     direct       (from /api/v1/tool/exec, browser-clicked actions)
    --     zhen-agent   (CLI binary)
    --     zhen-agentd  (daemon)
    --
    -- The daemon's pkg/champion code is the authoritative source of valid
    -- values; rigid CHECK constraints in PG cause INSERTs to silently fail
    -- because pgstore.LogAction wraps the error in fmt.Errorf and the
    -- caller (champion.logAction) intentionally doesn't surface it (so that
    -- audit-log failures don't break the main mutation path).
    --
    -- Decision: drop the CHECK constraints on action_type and triggered_by.
    -- Keep the status CHECK (status values are stable + small).
    --
    -- Idempotent: ALTER TABLE ... DROP CONSTRAINT IF EXISTS.

    -- Applied to unheaded_app (db/migrations/MANIFEST).

    ALTER TABLE zhen_actions
        DROP CONSTRAINT IF EXISTS zhen_actions_action_type_check;

    ALTER TABLE zhen_actions
        DROP CONSTRAINT IF EXISTS zhen_actions_triggered_by_check;

    -- The status check stays — completed/failed/planned/etc are stable.
  012_huginn_reader.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — huginn_reader monitoring user
    -- Read-only access to pg_monitor views for huginn DB health metrics.
    -- Run as superuser: psql -U unheaded -f huginn_reader.sql
    -- No password here: db/init.sh sets it from HUGINN_READER_PASSWORD.

    CREATE USER huginn_reader CONNECTION LIMIT 3;

    -- pg_monitor grants access to pg_stat_*, pg_stat_activity, pg_stat_replication
    GRANT pg_monitor TO huginn_reader;

    -- Allow connecting to each database
    GRANT CONNECT ON DATABASE unheaded     TO huginn_reader;
    GRANT CONNECT ON DATABASE unheaded_app TO huginn_reader;
    GRANT CONNECT ON DATABASE unheaded_ops TO huginn_reader;
    GRANT CONNECT ON DATABASE unheaded_config TO huginn_reader;
  013_compliance_config.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — compliance desired state (unheaded_config), ADR-099 amended.
    --
    -- Profiles and host bindings are the source of truth here; the YAML under
    -- compliance/ is their Genesis seed and read-only fallback. Fixes, controls
    -- and frameworks are authored in the repository (they run as root or are
    -- pinned by tests) and only mirrored here, each with the sha256 of the repo
    -- content so a reader can tell a stale or edited mirror from the real one.
    -- No new users: config_admin writes, config_reader reads (002/005).

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- APPEND-ONLY GUARD (history tables: no UPDATE, no DELETE, not even the owner)
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE OR REPLACE FUNCTION compliance_append_only()
    RETURNS TRIGGER AS $$
    BEGIN
        RAISE EXCEPTION '% is append-only', TG_TABLE_NAME;
    END;
    $$ LANGUAGE plpgsql;

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- MIRRORS OF REPO-AUTHORED DEFINITIONS (written by `compliance-evidence well sync`)
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE compliance_fixes (
        id         VARCHAR(40) PRIMARY KEY CHECK (id ~ '^[a-z0-9][a-z0-9-]{0,39}$'),
        title      TEXT NOT NULL,
        class      VARCHAR(20) NOT NULL,
        risk       VARCHAR(10) NOT NULL CHECK (risk IN ('none', 'low', 'medium', 'high')),
        controls   TEXT[] NOT NULL DEFAULT '{}',
        closes     TEXT[] NOT NULL DEFAULT '{}',
        body       JSONB NOT NULL,
        sha256     CHAR(64) NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
        synced_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE compliance_controls (
        id         VARCHAR(40) PRIMARY KEY,
        title      TEXT NOT NULL,
        body       JSONB NOT NULL,
        sha256     CHAR(64) NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
        synced_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE compliance_frameworks (
        id         VARCHAR(60) PRIMARY KEY,
        title      TEXT NOT NULL,
        body       JSONB NOT NULL,
        sha256     CHAR(64) NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
        synced_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- PROFILES (which fixes are on) — source of truth
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE compliance_profiles (
        name         VARCHAR(40) PRIMARY KEY CHECK (name ~ '^[a-z0-9][a-z0-9-]{0,39}$'),
        description  TEXT NOT NULL DEFAULT '',
        all_fixes    BOOLEAN NOT NULL DEFAULT FALSE,
        fixes        TEXT[] NOT NULL DEFAULT '{}',
        updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_by   TEXT NOT NULL CHECK (length(trim(updated_by)) > 0),
        CHECK (NOT (all_fixes AND cardinality(fixes) > 0))
    );

    -- An array cannot carry a foreign key: refuse a profile naming a fix the
    -- mirror does not have (seed the fixes first).
    CREATE OR REPLACE FUNCTION compliance_profile_fixes_exist()
    RETURNS TRIGGER AS $$
    DECLARE
        missing TEXT;
    BEGIN
        SELECT f INTO missing FROM unnest(NEW.fixes) AS f
         WHERE f NOT IN (SELECT id FROM compliance_fixes) LIMIT 1;
        IF missing IS NOT NULL THEN
            RAISE EXCEPTION 'profile % turns on unknown fix %', NEW.name, missing;
        END IF;
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE TRIGGER trg_compliance_profiles_fixes
        BEFORE INSERT OR UPDATE ON compliance_profiles
        FOR EACH ROW EXECUTE FUNCTION compliance_profile_fixes_exist();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- HOST BINDINGS (profile + ADR-098 mode per host) — source of truth, every
    -- change recorded with who and why (change-management evidence, CM-3)
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE compliance_host_bindings (
        host           VARCHAR(63) PRIMARY KEY CHECK (host ~ '^[a-z0-9][a-z0-9-]{0,62}$'),
        profile        VARCHAR(40) NOT NULL REFERENCES compliance_profiles(name)
                           ON UPDATE RESTRICT ON DELETE RESTRICT,
        -- Only audit until ADR-098's enforcing gate (LICH-012 run, 7-day soak,
        -- zero host findings, Stevie's sign-off) is met; widening this CHECK is
        -- itself a reviewed migration.
        mode           VARCHAR(10) NOT NULL DEFAULT 'audit' CHECK (mode IN ('audit')),
        overrides      JSONB NOT NULL DEFAULT '{}',
        updated_at     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_by     TEXT NOT NULL CHECK (length(trim(updated_by)) > 0),
        change_reason  TEXT NOT NULL CHECK (length(trim(change_reason)) > 0)
    );

    CREATE TABLE compliance_host_bindings_history (
        id             BIGSERIAL PRIMARY KEY,
        host           VARCHAR(63) NOT NULL,
        old_profile    VARCHAR(40),
        new_profile    VARCHAR(40) NOT NULL,
        old_mode       VARCHAR(10),
        new_mode       VARCHAR(10) NOT NULL,
        old_overrides  JSONB,
        new_overrides  JSONB NOT NULL,
        changed_by     TEXT NOT NULL,
        change_reason  TEXT NOT NULL,
        changed_at     TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX idx_compliance_bindings_history_host ON compliance_host_bindings_history(host, changed_at DESC);

    CREATE OR REPLACE FUNCTION compliance_binding_history()
    RETURNS TRIGGER AS $$
    BEGIN
        IF TG_OP = 'UPDATE' THEN
            INSERT INTO compliance_host_bindings_history
                (host, old_profile, new_profile, old_mode, new_mode, old_overrides, new_overrides, changed_by, change_reason)
            VALUES (NEW.host, OLD.profile, NEW.profile, OLD.mode, NEW.mode, OLD.overrides, NEW.overrides,
                    NEW.updated_by, NEW.change_reason);
        ELSE
            INSERT INTO compliance_host_bindings_history
                (host, new_profile, new_mode, new_overrides, changed_by, change_reason)
            VALUES (NEW.host, NEW.profile, NEW.mode, NEW.overrides, NEW.updated_by, NEW.change_reason);
        END IF;
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION compliance_binding_touch()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE TRIGGER trg_compliance_bindings_touch
        BEFORE UPDATE ON compliance_host_bindings
        FOR EACH ROW EXECUTE FUNCTION compliance_binding_touch();

    CREATE TRIGGER trg_compliance_bindings_history
        AFTER INSERT OR UPDATE ON compliance_host_bindings
        FOR EACH ROW EXECUTE FUNCTION compliance_binding_history();

    CREATE TRIGGER trg_compliance_bindings_history_append_only
        BEFORE UPDATE OR DELETE ON compliance_host_bindings_history
        FOR EACH ROW EXECUTE FUNCTION compliance_append_only();

    -- A binding is never deleted: a host leaving is a change to profile 'none'.
    CREATE TRIGGER trg_compliance_bindings_no_delete
        BEFORE DELETE ON compliance_host_bindings
        FOR EACH ROW EXECUTE FUNCTION compliance_append_only();

    -- TRUNCATE fires no row trigger: guard it per statement, or the owner could
    -- empty the history in one command.
    CREATE TRIGGER trg_compliance_bindings_history_no_truncate
        BEFORE TRUNCATE ON compliance_host_bindings_history
        FOR EACH STATEMENT EXECUTE FUNCTION compliance_append_only();
    CREATE TRIGGER trg_compliance_bindings_no_truncate
        BEFORE TRUNCATE ON compliance_host_bindings
        FOR EACH STATEMENT EXECUTE FUNCTION compliance_append_only();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- GRANTS
    -- ═══════════════════════════════════════════════════════════════════════════════
    GRANT USAGE, SELECT ON SEQUENCE compliance_host_bindings_history_id_seq TO config_admin;

    GRANT SELECT, INSERT, UPDATE, DELETE ON
        compliance_fixes, compliance_controls, compliance_frameworks, compliance_profiles
        TO config_admin;
    GRANT SELECT, INSERT, UPDATE ON compliance_host_bindings TO config_admin;
    -- History is written by the trigger; config_admin may read it, never edit it.
    GRANT SELECT, INSERT ON compliance_host_bindings_history TO config_admin;

    GRANT SELECT ON
        compliance_fixes, compliance_controls, compliance_frameworks, compliance_profiles,
        compliance_host_bindings, compliance_host_bindings_history
        TO config_reader;
  014_compliance_ops.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — compliance records (unheaded_ops), ADR-098/099 amended.
    --
    -- What happened, not what is wanted: the apply journal (hash-chained,
    -- append-only), findings triage with its history, and evidence records.
    -- The YAML register and var/compliance/evidence.json stay as seed and
    -- read-only fallback. No new users: ops_writer appends, ops_reader reads.

    CREATE OR REPLACE FUNCTION compliance_append_only()
    RETURNS TRIGGER AS $$
    BEGIN
        RAISE EXCEPTION '% is append-only', TG_TABLE_NAME;
    END;
    $$ LANGUAGE plpgsql;

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- APPLY JOURNAL — every plan/apply/undo of a fix on a host. Rows arrive from
    -- the hosts' local journal.jsonl, pulled by the collector over SSH (The Well
    -- stays on loopback). hash = sha256(previous_hash || canonical row), checked
    -- on ingest; a broken chain is a critical finding, never repaired.
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE compliance_apply_journal (
        id             BIGSERIAL PRIMARY KEY,
        host           VARCHAR(63) NOT NULL CHECK (host ~ '^[a-z0-9][a-z0-9-]{0,62}$'),
        host_seq       BIGINT NOT NULL CHECK (host_seq > 0),
        fix_id         VARCHAR(40) NOT NULL,
        fix_sha256     CHAR(64) NOT NULL CHECK (fix_sha256 ~ '^[0-9a-f]{64}$'),
        model_commit   VARCHAR(64) NOT NULL DEFAULT '',
        action         VARCHAR(10) NOT NULL CHECK (action IN ('plan', 'apply', 'undo')),
        outcome        VARCHAR(10) NOT NULL CHECK (outcome IN ('success', 'failure', 'refused', 'restored')),
        backup_dir     TEXT NOT NULL DEFAULT '',
        operator       TEXT NOT NULL CHECK (length(trim(operator)) > 0),
        -- backfilled: written from remediate.sh's state directories after the
        -- fact (2026-10-01 applies), not by the executor at the time.
        backfilled     BOOLEAN NOT NULL DEFAULT FALSE,
        at             TIMESTAMPTZ NOT NULL,
        previous_hash  CHAR(64) NOT NULL CHECK (previous_hash ~ '^[0-9a-f]{64}$'),
        hash           CHAR(64) NOT NULL CHECK (hash ~ '^[0-9a-f]{64}$'),
        ingested_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        UNIQUE (host, host_seq),
        UNIQUE (hash)
    );

    CREATE INDEX idx_compliance_journal_host_fix ON compliance_apply_journal(host, fix_id, at DESC);

    CREATE TRIGGER trg_compliance_journal_append_only
        BEFORE UPDATE OR DELETE ON compliance_apply_journal
        FOR EACH ROW EXECUTE FUNCTION compliance_append_only();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- FINDINGS TRIAGE — one row per register entry (key = evidence-source key or
    -- FND-NNN). entry holds the full RegisterEntry as the Go loader validates it;
    -- the columns repeat what is queried and constrained.
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE compliance_findings (
        key             TEXT PRIMARY KEY CHECK (length(key) BETWEEN 1 AND 300),
        severity        VARCHAR(10) NOT NULL CHECK (severity IN ('critical', 'high', 'medium', 'low')),
        class           VARCHAR(20) NOT NULL,
        host            VARCHAR(63) NOT NULL DEFAULT '',
        step            INTEGER NOT NULL CHECK (step >= 1),  -- as crosswalk.validateEntry
        lockout         VARCHAR(10) NOT NULL CHECK (lockout IN ('none', 'low', 'high')),
        opened          DATE NOT NULL,
        accepted_on     DATE,
        accepted_until  DATE,
        entry           JSONB NOT NULL,
        updated_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_by      TEXT NOT NULL CHECK (length(trim(updated_by)) > 0),
        change_reason   TEXT NOT NULL CHECK (length(trim(change_reason)) > 0),
        -- ADR-098: an acceptance is capped at 90 days and must be re-decided.
        CHECK ((accepted_on IS NULL) = (accepted_until IS NULL)),
        CHECK (accepted_until IS NULL OR accepted_until <= accepted_on + 90)
    );

    CREATE INDEX idx_compliance_findings_severity ON compliance_findings(severity);
    CREATE INDEX idx_compliance_findings_host ON compliance_findings(host);

    CREATE TABLE compliance_findings_history (
        id             BIGSERIAL PRIMARY KEY,
        key            TEXT NOT NULL,
        op             VARCHAR(10) NOT NULL CHECK (op IN ('INSERT', 'UPDATE', 'DELETE')),
        old_entry      JSONB,
        new_entry      JSONB,
        changed_by     TEXT NOT NULL,
        change_reason  TEXT NOT NULL,
        changed_at     TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX idx_compliance_findings_history_key ON compliance_findings_history(key, changed_at DESC);

    -- A finding row is deleted when its evidence passes (resolved); the
    -- history keeps who removed it and why.
    CREATE OR REPLACE FUNCTION compliance_finding_history()
    RETURNS TRIGGER AS $$
    BEGIN
        IF TG_OP = 'DELETE' THEN
            INSERT INTO compliance_findings_history (key, op, old_entry, changed_by, change_reason)
            VALUES (OLD.key, TG_OP, OLD.entry,
                    coalesce(current_setting('compliance.actor', true), current_user),
                    coalesce(current_setting('compliance.reason', true), 'resolved'));
            RETURN OLD;
        END IF;
        INSERT INTO compliance_findings_history (key, op, old_entry, new_entry, changed_by, change_reason)
        VALUES (NEW.key, TG_OP, CASE WHEN TG_OP = 'UPDATE' THEN OLD.entry END, NEW.entry,
                NEW.updated_by, NEW.change_reason);
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION compliance_finding_touch()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE TRIGGER trg_compliance_findings_touch
        BEFORE UPDATE ON compliance_findings
        FOR EACH ROW EXECUTE FUNCTION compliance_finding_touch();

    CREATE TRIGGER trg_compliance_findings_history
        AFTER INSERT OR UPDATE OR DELETE ON compliance_findings
        FOR EACH ROW EXECUTE FUNCTION compliance_finding_history();

    CREATE TRIGGER trg_compliance_findings_history_append_only
        BEFORE UPDATE OR DELETE ON compliance_findings_history
        FOR EACH ROW EXECUTE FUNCTION compliance_append_only();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- EVIDENCE — collector records (crosswalk.Record). Readers take the latest per
    -- source; old rows age out by retention policy, never by edit.
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE compliance_evidence (
        id           BIGSERIAL PRIMARY KEY,
        source_key   TEXT NOT NULL CHECK (length(source_key) BETWEEN 1 AND 300),
        verdict      VARCHAR(10) NOT NULL CHECK (verdict IN ('pass', 'fail')),
        observed_at  TIMESTAMPTZ NOT NULL,
        commit       VARCHAR(64) NOT NULL DEFAULT '',
        detail       TEXT NOT NULL DEFAULT '' CHECK (length(detail) <= 4000),
        ingested_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX idx_compliance_evidence_latest ON compliance_evidence(source_key, observed_at DESC);

    CREATE TRIGGER trg_compliance_evidence_no_update
        BEFORE UPDATE ON compliance_evidence
        FOR EACH ROW EXECUTE FUNCTION compliance_append_only();

    -- TRUNCATE fires no row trigger: guard it per statement on every
    -- append-only table, or the owner could empty one in a single command.
    CREATE TRIGGER trg_compliance_journal_no_truncate
        BEFORE TRUNCATE ON compliance_apply_journal
        FOR EACH STATEMENT EXECUTE FUNCTION compliance_append_only();
    CREATE TRIGGER trg_compliance_findings_history_no_truncate
        BEFORE TRUNCATE ON compliance_findings_history
        FOR EACH STATEMENT EXECUTE FUNCTION compliance_append_only();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- GRANTS
    -- ═══════════════════════════════════════════════════════════════════════════════
    GRANT USAGE, SELECT ON SEQUENCE
        compliance_apply_journal_id_seq, compliance_findings_history_id_seq, compliance_evidence_id_seq
        TO ops_writer;

    -- Journal and evidence: append only. Findings: triage may change and
    -- resolve rows; their history is trigger-written and read-only.
    GRANT SELECT, INSERT ON compliance_apply_journal, compliance_evidence TO ops_writer;
    GRANT SELECT, INSERT, UPDATE, DELETE ON compliance_findings TO ops_writer;
    GRANT SELECT, INSERT ON compliance_findings_history TO ops_writer;

    GRANT SELECT ON
        compliance_apply_journal, compliance_findings, compliance_findings_history, compliance_evidence
        TO ops_reader;
  015_ops_history_append_only.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — append-only history in unheaded_ops (W-05).
    --
    -- audit_events (the Anamnesis log) and service_health_transitions are
    -- history: rows are added, never changed. 004 granted ops_writer UPDATE and
    -- DELETE on both, and nothing stopped the owner. Same pattern as 014's
    -- compliance tables: writers get INSERT/SELECT only, and triggers refuse
    -- UPDATE, DELETE and TRUNCATE for everyone, owner included (a superuser can
    -- still drop the trigger; that is DDL, visible in the ledger and the log).
    -- Retention will drop time partitions (W-15), never delete rows.
    --
    -- Re-runnable: CREATE OR REPLACE throughout, REVOKE of an absent grant is a
    -- no-op.

    CREATE OR REPLACE FUNCTION well_append_only()
    RETURNS TRIGGER AS $$
    BEGIN
        RAISE EXCEPTION '% is append-only', TG_TABLE_NAME;
    END;
    $$ LANGUAGE plpgsql;

    REVOKE UPDATE, DELETE, TRUNCATE ON audit_events, service_health_transitions FROM ops_writer;

    CREATE OR REPLACE TRIGGER trg_audit_events_append_only
        BEFORE UPDATE OR DELETE ON audit_events
        FOR EACH ROW EXECUTE FUNCTION well_append_only();
    -- TRUNCATE fires no row trigger: guard it per statement.
    CREATE OR REPLACE TRIGGER trg_audit_events_no_truncate
        BEFORE TRUNCATE ON audit_events
        FOR EACH STATEMENT EXECUTE FUNCTION well_append_only();

    CREATE OR REPLACE TRIGGER trg_service_health_transitions_append_only
        BEFORE UPDATE OR DELETE ON service_health_transitions
        FOR EACH ROW EXECUTE FUNCTION well_append_only();
    CREATE OR REPLACE TRIGGER trg_service_health_transitions_no_truncate
        BEFORE TRUNCATE ON service_health_transitions
        FOR EACH STATEMENT EXECUTE FUNCTION well_append_only();
  016_config_history_append_only.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — append-only history in unheaded_config (W-05).
    --
    -- kingdom_config_history is written by 005's track_config_change() trigger,
    -- which runs as the role changing kingdom_config (config_admin), so that role
    -- keeps INSERT. 005 also granted it UPDATE and DELETE: revoked here, and
    -- triggers refuse UPDATE, DELETE and TRUNCATE for everyone, owner included.
    -- Same pattern as 013 and 015. Re-runnable.

    CREATE OR REPLACE FUNCTION well_append_only()
    RETURNS TRIGGER AS $$
    BEGIN
        RAISE EXCEPTION '% is append-only', TG_TABLE_NAME;
    END;
    $$ LANGUAGE plpgsql;

    REVOKE UPDATE, DELETE, TRUNCATE ON kingdom_config_history FROM config_admin;

    CREATE OR REPLACE TRIGGER trg_kingdom_config_history_append_only
        BEFORE UPDATE OR DELETE ON kingdom_config_history
        FOR EACH ROW EXECUTE FUNCTION well_append_only();
    CREATE OR REPLACE TRIGGER trg_kingdom_config_history_no_truncate
        BEFORE TRUNCATE ON kingdom_config_history
        FOR EACH STATEMENT EXECUTE FUNCTION well_append_only();
  017_app_drop_duplicate_indexes.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — duplicate indexes on zhen_conversations (W-14), unheaded_app.
    --
    -- 003 creates idx_zhen_created and idx_zhen_search; 010's CREATE TABLE IF
    -- NOT EXISTS is skipped but its CREATE INDEX IF NOT EXISTS lines are not, so
    -- every bootstrap ends with idx_zhen_conversations_created and
    -- idx_zhen_conversations_search as exact copies. Every insert pays for both.
    -- Drop 010's copy only where 003's is present, so a Well created some
    -- other way never loses its only index. Small table: a plain DROP under the
    -- runner's lock_timeout is fine.

    DO $$
    BEGIN
        IF to_regclass('public.idx_zhen_created') IS NOT NULL THEN
            DROP INDEX IF EXISTS idx_zhen_conversations_created;
        END IF;
        IF to_regclass('public.idx_zhen_search') IS NOT NULL THEN
            DROP INDEX IF EXISTS idx_zhen_conversations_search;
        END IF;
    END $$;
  018_config_bindings_profile_index.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — index the compliance_host_bindings(profile) foreign key
    -- (W-19), unheaded_config. Without it, deleting or renaming a profile scans
    -- every binding under lock. Tiny table: no CONCURRENTLY needed.

    CREATE INDEX IF NOT EXISTS idx_compliance_host_bindings_profile
        ON compliance_host_bindings (profile);
  019_config_history_all_changes.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — kingdom_config history records every change (W-18),
    -- unheaded_config.
    --
    -- 005's trigger fired on UPDATE only: a key created or deleted left no
    -- trace. Now INSERT, UPDATE (when the value changes) and DELETE each add a
    -- history row with the operation. The reason comes from the session
    -- setting well.change_reason when the writer sets it
    -- (SET LOCAL well.change_reason = '...'); making it required waits until
    -- every writer sets it (pkg/database/config_store.go does not yet).
    -- Adding `op` with a constant default is a catalog-only change on PG 11+.

    ALTER TABLE kingdom_config_history
        ADD COLUMN IF NOT EXISTS op TEXT NOT NULL DEFAULT 'UPDATE'
            CHECK (op IN ('INSERT', 'UPDATE', 'DELETE'));

    CREATE OR REPLACE FUNCTION track_config_change()
    RETURNS TRIGGER AS $$
    DECLARE
        reason TEXT := coalesce(current_setting('well.change_reason', true), '');
    BEGIN
        IF TG_OP = 'INSERT' THEN
            INSERT INTO kingdom_config_history (key, old_value, new_value, changed_by, change_reason, op, changed_at)
            VALUES (NEW.key, NULL, NEW.value, NEW.updated_by, reason, TG_OP, now());
            RETURN NEW;
        ELSIF TG_OP = 'UPDATE' THEN
            INSERT INTO kingdom_config_history (key, old_value, new_value, changed_by, change_reason, op, changed_at)
            VALUES (OLD.key, OLD.value, NEW.value, NEW.updated_by, reason, TG_OP, now());
            RETURN NEW;
        END IF;
        INSERT INTO kingdom_config_history (key, old_value, new_value, changed_by, change_reason, op, changed_at)
        VALUES (OLD.key, OLD.value, NULL, current_user, reason, TG_OP, now());
        RETURN OLD;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_kingdom_config_history ON kingdom_config;
    CREATE TRIGGER trg_kingdom_config_history
        AFTER UPDATE ON kingdom_config
        FOR EACH ROW
        WHEN (OLD.value IS DISTINCT FROM NEW.value)
        EXECUTE FUNCTION track_config_change();
    CREATE OR REPLACE TRIGGER trg_kingdom_config_history_insert_delete
        AFTER INSERT OR DELETE ON kingdom_config
        FOR EACH ROW
        EXECUTE FUNCTION track_config_change();
  020_app_adopt_startup_ddl.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — adopt objects only startup DDL created (W-03, ERDA 3.3/3.4),
    -- unheaded_app.
    --
    -- pkg/champion/pgstore/schema.sql creates three zhen_actions indexes when
    -- the champion starts, and the live zhen_conversations (built by 010's
    -- shape) has created_at NOT NULL, which 003 lacks. Putting them here makes
    -- the ledger the one place that defines them, so a fresh Well and the live
    -- one end in the same shape and the startup DDL can be deleted later.
    -- zhen_actions and zhen_conversations are small: plain CREATE INDEX under
    -- the runner's lock_timeout. No row has a NULL created_at (it defaults to
    -- now() everywhere).

    CREATE INDEX IF NOT EXISTS zhen_actions_session_id_idx ON zhen_actions (session_id);
    CREATE INDEX IF NOT EXISTS zhen_actions_planned_at_idx ON zhen_actions (planned_at DESC);
    CREATE INDEX IF NOT EXISTS zhen_actions_type_status_idx ON zhen_actions (action_type, status);

    ALTER TABLE zhen_conversations ALTER COLUMN created_at SET NOT NULL;
  021_app_drop_zhen_actions_duplicate_indexes.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — zhen_actions duplicate indexes (W-14), unheaded_app.
    --
    -- 020 adopted the champion's startup indexes, but two are exact copies of
    -- 009's: zhen_actions_session_id_idx = idx_zhen_actions_session and
    -- zhen_actions_planned_at_idx = idx_zhen_actions_planned. The live Well had
    -- both pairs since the champion first started. Drop the copies only where
    -- 009's twin exists. zhen_actions_type_status_idx (action_type, status) is
    -- a different index and stays. 020 is applied on the live Well, so it is
    -- corrected here rather than edited.

    DO $$
    BEGIN
        IF to_regclass('public.idx_zhen_actions_session') IS NOT NULL THEN
            DROP INDEX IF EXISTS zhen_actions_session_id_idx;
        END IF;
        IF to_regclass('public.idx_zhen_actions_planned') IS NOT NULL THEN
            DROP INDEX IF EXISTS zhen_actions_planned_at_idx;
        END IF;
    END $$;
  022_ops_audit_events_one_taxonomy.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — one audit taxonomy (W-04), unheaded_ops.
    --
    -- 004's audit_events had its own event types ('auth.login', ...), severity
    -- 'warn' and outcomes 'denied'/'error', and nothing ever wrote to it.
    -- pkg/audit, the code that produces audit events, uses another:
    -- types authentication/authorization/configuration/data_access/system,
    -- severity info/warning/error/critical, outcome success/failure/pending.
    -- Stevie 2026-10-15: pick one. The table now follows pkg/audit, column for
    -- column with pkg/audit/storage, so that package can write it.
    --
    -- The table is replaced only when empty (it is, on every Well as of
    -- 2026-10-15); with rows this refuses and needs a data migration instead.
    -- 015's append-only triggers and grants are re-created.

    DO $$
    BEGIN
        IF EXISTS (SELECT 1 FROM audit_events) THEN
            RAISE EXCEPTION 'audit_events has rows: migrate them to the pkg/audit taxonomy instead of replacing the table';
        END IF;
    END $$;

    DROP TABLE audit_events;

    CREATE TABLE audit_events (
        id              TEXT PRIMARY KEY,
        occurred_at     TIMESTAMPTZ NOT NULL,
        event_type      TEXT NOT NULL
            CHECK (event_type IN ('authentication', 'authorization', 'configuration', 'data_access', 'system')),
        severity        TEXT NOT NULL
            CHECK (severity IN ('info', 'warning', 'error', 'critical')),
        action          TEXT NOT NULL CHECK (action <> ''),
        outcome         TEXT NOT NULL
            CHECK (outcome IN ('success', 'failure', 'pending')),
        actor_id        TEXT,
        actor_type      TEXT,
        actor_name      TEXT,
        resource_id     TEXT,
        resource_type   TEXT,
        source_ip       TEXT,
        source_service  TEXT,
        request_id      TEXT,
        details         JSONB NOT NULL DEFAULT '{}',
        previous_hash   TEXT NOT NULL DEFAULT '',
        hash            CHAR(64) NOT NULL CHECK (hash ~ '^[0-9a-f]{64}$'),
        signature       TEXT NOT NULL DEFAULT '',
        recorded_at     TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Time range and per-actor queries; event_type and severity have a
    -- handful of values each and are not worth an index of their own (W-14).
    CREATE INDEX idx_audit_events_occurred_at ON audit_events (occurred_at DESC);
    CREATE INDEX idx_audit_events_actor_id ON audit_events (actor_id) WHERE actor_id IS NOT NULL;

    CREATE OR REPLACE TRIGGER trg_audit_events_append_only
        BEFORE UPDATE OR DELETE ON audit_events
        FOR EACH ROW EXECUTE FUNCTION well_append_only();
    CREATE OR REPLACE TRIGGER trg_audit_events_no_truncate
        BEFORE TRUNCATE ON audit_events
        FOR EACH STATEMENT EXECUTE FUNCTION well_append_only();

    GRANT SELECT, INSERT ON audit_events TO ops_writer;
    GRANT SELECT ON audit_events TO ops_reader;
