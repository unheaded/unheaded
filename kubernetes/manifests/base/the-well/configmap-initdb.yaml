#
# GENERATED by scripts/well/render-k8s-initdb.py from db/: do not edit.
# The same init.sh, MANIFEST, ledger and migrations compose uses (ADR-101).
# Role passwords come from the the-well-users secret via init.sh (\getenv).

apiVersion: v1
kind: ConfigMap
metadata:
  name: the-well-initdb
  namespace: unheaded
data:
  init.sh: |
    #!/bin/bash
    # SPDX-License-Identifier: GPL-3.0-or-later
    # The Well — ordered initialisation for the three-database split.
    #
    # This is the ONLY file mounted into /docker-entrypoint-initdb.d. The migrations
    # live at /migrations and are applied from here, in order, each against the
    # database it belongs to.
    #
    # The migrations directory MUST NOT be mounted into /docker-entrypoint-initdb.d.
    # Postgres's entrypoint runs every *.sql it finds there itself, alphabetically,
    # against POSTGRES_DB — which applies the per-database schemas to the wrong
    # database and aborts on the first collision, before ever reaching this script.
    # See docs/adr/ADR-091-the-well-initdb-ordering.md.
    set -e

    MIGRATIONS=/migrations

    # The superuser is POSTGRES_USER, not `postgres` — with POSTGRES_USER set, the
    # image creates that role and no `postgres` role exists to connect as.
    psql_su() { psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" "$@"; }

    echo "=== The Well — Initializing databases ==="

    # db/migrations/MANIFEST says which file runs against which database, in
    # order; the well-migrate runner reads the same file for an existing Well (ADR-101).
    # Each file is recorded in its database's well_schema_migrations ledger with
    # its sha256, mode initdb, so a fresh Well starts with a complete ledger.
    # Lines: `<database> <file> [notx] [superuser]`, `skip <file>`, blank, or #
    # comments. (notx only matters to the runner: psql -f already sends each
    # statement alone.) Like the runner, a file runs as its database's owner
    # role once that owner is not a superuser (025), unless flagged superuser.
    ledgers=" "
    record() { # database file
      case "$ledgers" in *" $1 "*) ;; *)
        psql_su -d "$1" -q -f "$MIGRATIONS/LEDGER.sql"
        ledgers="$ledgers$1 " ;;
      esac
      sum="$(sha256sum "$MIGRATIONS/$2" | cut -d' ' -f1)"
      psql_su -d "$1" -q -v f="$2" -v h="$sum" <<'SQL'
    INSERT INTO well_schema_migrations (filename, sha256, mode) VALUES (:'f', :'h', 'initdb');
    SQL
    }
    # 012 (applied everywhere, so unchangeable) grants CONNECT on the pre-split
    # database `unheaded`, retired 2026-10-15 (ERDA 3.6). It exists only while
    # this script runs: made empty here, dropped after the manifest. This runs
    # on an empty volume only, so nothing else can be in it.
    psql_su -d postgres -q -c 'CREATE DATABASE unheaded'
    exec 3<"$MIGRATIONS/MANIFEST"
    while read -r db file flags <&3; do
      case "$db" in ''|'#'*|skip) continue ;; esac
      echo "The Well: $file -> $db"
      set -- -f "$MIGRATIONS/$file"
      case " $flags " in *" superuser "*) ;; *)
        owner="$(psql_su -d "$db" -Atq -c "SELECT r.rolname FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba WHERE d.datname = current_database() AND NOT r.rolsuper")"
        if [ -n "$owner" ]; then set -- -c "SET ROLE \"$owner\"" "$@"; fi ;;
      esac
      psql_su -d "$db" "$@"
      record "$db" "$file"
    done
    exec 3<&-
    psql_su -d postgres -q -c 'DROP DATABASE unheaded'

    # Role passwords come from the environment, never from the migrations (W-07).
    # \getenv reads the variable inside psql, so the value is neither on a command
    # line nor interpolated into SQL text; :'pw' quotes it as a literal. An unset
    # or empty variable leaves the role without a password: it cannot log in
    # until one is set (ALTER ROLE ... PASSWORD), and there is no default.
    # The server still receives the statement with the password in it: this
    # session neither logs it (log_statement = 'ddl' in db/postgresql.conf) nor
    # keeps it in pg_stat_statements, which pg_monitor (huginn_reader) reads.
    set_password() { # role env-var
      if [ -z "$(printenv "$2" || true)" ]; then
        echo "The Well: $2 unset, role $1 has no password (cannot log in yet)"
        return
      fi
      psql_su -d postgres -q <<SQL
    \\getenv pw $2
    SET log_statement = 'none';
    SET log_min_duration_statement = -1;
    SET log_min_error_statement = 'panic';
    SET pg_stat_statements.track_utility = off;
    ALTER ROLE $1 PASSWORD :'pw';
    SQL
    }
    set_password app_kanban     APP_KANBAN_PASSWORD
    set_password app_timeguru   APP_TIMEGURU_PASSWORD
    set_password app_zhen       APP_ZHEN_PASSWORD
    set_password ops_writer     OPS_WRITER_PASSWORD
    set_password ops_reader     OPS_READER_PASSWORD
    set_password config_admin   CONFIG_ADMIN_PASSWORD
    set_password config_reader  CONFIG_READER_PASSWORD
    set_password huginn_reader  HUGINN_READER_PASSWORD
    set_password well_backup    WELL_BACKUP_PASSWORD

    echo "=== The Well — Ready ==="
  MANIFEST: |
    # SPDX-License-Identifier: GPL-3.0-or-later
    # The Well — migration order and routing (ADR-101).
    #
    #   <database> <file> [notx] [superuser]
    #                                apply <file> to <database>, in this order
    #   skip <file>                  in this directory, deliberately never applied
    #
    # Read by db/init.sh (empty volume) and well-migrate (an existing Well);
    # each records what it ran in that database's well_schema_migrations ledger.
    # Cluster-level files (roles, databases, grants on databases) run against,
    # and are recorded in, `postgres`. notx: statement by statement outside a
    # transaction (CREATE DATABASE cannot run in one). Once 025 gives a
    # database a non-superuser owner, its files run as that owner (SET ROLE),
    # so what they create belongs to it; superuser: keep the superuser.
    #
    # Never edit a file once it is applied anywhere: the ledger holds its
    # sha256 and well-migrate refuses to run past the difference. Add a new one.

    postgres         002_create_databases.sql   notx
    unheaded_app     003_app_schema.sql
    unheaded_ops     004_ops_schema.sql
    unheaded_config  005_config_schema.sql
    unheaded_config  006_seed_data.sql
    unheaded_app     007_grants.sql
    unheaded_ops     007_grants.sql
    unheaded_config  007_grants.sql
    unheaded_app     008_zhen_memories.sql
    unheaded_app     009_zhen_actions.sql
    unheaded_app     010_zhen_conversations.sql
    unheaded_app     011_zhen_actions_relax_constraints.sql
    postgres         012_huginn_reader.sql
    unheaded_config  013_compliance_config.sql
    unheaded_ops     014_compliance_ops.sql
    unheaded_ops     015_ops_history_append_only.sql
    unheaded_config  016_config_history_append_only.sql
    unheaded_app     017_app_drop_duplicate_indexes.sql
    unheaded_config  018_config_bindings_profile_index.sql
    unheaded_config  019_config_history_all_changes.sql
    unheaded_app     020_app_adopt_startup_ddl.sql
    unheaded_app     021_app_drop_zhen_actions_duplicate_indexes.sql
    unheaded_ops     022_ops_audit_events_one_taxonomy.sql
    postgres         023_well_backup_role.sql
    unheaded_ops     024_ops_drop_health_hourly.sql
    postgres         025_well_owner_roles.sql
    unheaded_app     026_owner_takes_objects.sql  superuser
    unheaded_ops     026_owner_takes_objects.sql  superuser
    unheaded_config  026_owner_takes_objects.sql  superuser
    postgres         027_stats_and_backup_settings.sql
    unheaded_config  028_config_change_reason_required.sql
    postgres         029_template1_no_public_connect.sql
    unheaded_ops     030_ops_llm_requests.sql
    unheaded_app     031_app_zhen_pending_confirmations.sql
    unheaded_app     032_app_zhen_agent_runs.sql

    # The pre-split single-database schema, superseded by 003/004/005: applying
    # it would put a fourth copy of kanban_tasks, timeline_milestones and
    # zhen_conversations in the maintenance database (ADR-091).
    skip 001_initial_schema.sql
  LEDGER.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — migration ledger (ADR-101). Not a migration: db/init.sh and
    -- well-migrate (ADR-101) apply it to each database before recording anything
    -- there. Idempotent.
    --
    -- One row per migration file applied to this database, with the sha256 of
    -- the file as it ran. mode: initdb (db/init.sh on an empty volume), apply
    -- (well-migrate), baseline (recorded without running, after a shape diff
    -- showed the schema already matches). Append-only, like 013-016's history.

    CREATE TABLE IF NOT EXISTS well_schema_migrations (
        filename    TEXT PRIMARY KEY CHECK (filename ~ '^[0-9]{3}_[a-z0-9_]+\.sql$'),
        sha256      CHAR(64) NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
        mode        TEXT NOT NULL CHECK (mode IN ('initdb', 'apply', 'baseline')),
        applied_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        applied_by  TEXT NOT NULL DEFAULT current_user
    );

    CREATE OR REPLACE FUNCTION well_append_only()
    RETURNS TRIGGER AS $$
    BEGIN
        RAISE EXCEPTION '% is append-only', TG_TABLE_NAME;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE TRIGGER trg_well_schema_migrations_append_only
        BEFORE UPDATE OR DELETE ON well_schema_migrations
        FOR EACH ROW EXECUTE FUNCTION well_append_only();
    CREATE OR REPLACE TRIGGER trg_well_schema_migrations_no_truncate
        BEFORE TRUNCATE ON well_schema_migrations
        FOR EACH STATEMENT EXECUTE FUNCTION well_append_only();

    REVOKE ALL ON well_schema_migrations FROM PUBLIC;
  002_create_databases.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — Database and User Creation (run as postgres superuser)
    --
    -- Roles are created without passwords: no credential lives in this file.
    -- db/init.sh sets each one from its environment variable (APP_KANBAN_PASSWORD,
    -- ...); a role whose variable is unset cannot log in with a password.
    CREATE DATABASE unheaded_app;
    CREATE DATABASE unheaded_ops;
    CREATE DATABASE unheaded_config;
    CREATE USER app_kanban;
    CREATE USER app_timeguru;
    CREATE USER app_zhen;
    CREATE USER ops_writer;
    CREATE USER ops_reader;
    CREATE USER config_admin;
    CREATE USER config_reader;
  003_app_schema.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — Application Database Schema (unheaded_app)

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- UPDATED_AT TRIGGER
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE OR REPLACE FUNCTION update_updated_at()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- KANBAN TASKS
    -- ═══════════════════════════════════════════════════════════════════════════════
    -- This DDL mirrors pkg/database/kanban_store.go EnsureSchema() column for
    -- column. The code path is authoritative: it runs CREATE TABLE IF NOT EXISTS
    -- plus ADD COLUMN IF NOT EXISTS on every kanban-app and zhen-agentd start, and
    -- the live board's rows were created under it.
    --
    -- Until 2026-09-21 this file defined a different table (BIGSERIAL id,
    -- priority/tags/assignee/sort_order, no type/owner/progress). Nothing ever
    -- read that shape: the ADR-091 initdb bug misfiled the schema, so kanban-app
    -- created its own table in the maintenance database and never met this one.
    -- Once init.sh routed this file into unheaded_app correctly, a clean volume
    -- would have handed kanban a table it could not INSERT into
    -- (`column "type" does not exist`). Keep the two definitions in lockstep.
    CREATE TABLE kanban_tasks (
        id          TEXT PRIMARY KEY,
        guid        UUID NOT NULL DEFAULT gen_random_uuid(),
        title       TEXT NOT NULL,
        description TEXT NOT NULL DEFAULT '',
        status      TEXT NOT NULL DEFAULT 'todo',
        type        TEXT NOT NULL DEFAULT 'task',
        owner       TEXT NOT NULL DEFAULT '',
        progress    INTEGER NOT NULL DEFAULT 0 CHECK (progress >= 0 AND progress <= 100),
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at  TIMESTAMPTZ,
        archived_at TIMESTAMPTZ,
        commits     JSONB DEFAULT '[]'
    );

    CREATE INDEX idx_kanban_tasks_status ON kanban_tasks(status);
    CREATE UNIQUE INDEX idx_kanban_tasks_guid ON kanban_tasks(guid);
    CREATE INDEX idx_kanban_created_at ON kanban_tasks(created_at DESC);
    CREATE INDEX idx_kanban_deleted_at ON kanban_tasks(deleted_at) WHERE deleted_at IS NOT NULL;

    CREATE TRIGGER trg_kanban_tasks_updated_at
        BEFORE UPDATE ON kanban_tasks
        FOR EACH ROW EXECUTE FUNCTION update_updated_at();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- TIMELINE MILESTONES
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE timeline_milestones (
        id             BIGSERIAL PRIMARY KEY,
        sprint         VARCHAR(20) NOT NULL,
        phase          VARCHAR(50) DEFAULT '',
        title          TEXT NOT NULL,
        description    TEXT DEFAULT '',
        status         VARCHAR(20) NOT NULL DEFAULT 'planned'
            CHECK (status IN ('planned', 'in-progress', 'completed', 'deferred')),
        progress_pct   SMALLINT DEFAULT 0 CHECK (progress_pct BETWEEN 0 AND 100),
        target_date    DATE,
        completed_date DATE,
        depends_on     BIGINT[] DEFAULT '{}',
        tags           TEXT[] DEFAULT '{}',
        created_at     TIMESTAMPTZ DEFAULT NOW(),
        updated_at     TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX idx_timeline_sprint ON timeline_milestones(sprint);
    CREATE INDEX idx_timeline_status ON timeline_milestones(status);
    CREATE INDEX idx_timeline_phase ON timeline_milestones(phase);
    CREATE INDEX idx_timeline_target_date ON timeline_milestones(target_date);

    CREATE TRIGGER trg_timeline_milestones_updated_at
        BEFORE UPDATE ON timeline_milestones
        FOR EACH ROW EXECUTE FUNCTION update_updated_at();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- ZHEN CONVERSATIONS
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE zhen_conversations (
        id             BIGSERIAL PRIMARY KEY,
        session_id     VARCHAR(64) NOT NULL,
        role           VARCHAR(10) NOT NULL
            CHECK (role IN ('user', 'assistant', 'system')),
        content        TEXT NOT NULL,
        sources        JSONB DEFAULT '[]',
        model          VARCHAR(100) DEFAULT '',
        tokens_input   INTEGER DEFAULT 0,
        tokens_output  INTEGER DEFAULT 0,
        elapsed_ms     INTEGER DEFAULT 0,
        feedback       VARCHAR(20) DEFAULT '',
        created_at     TIMESTAMPTZ DEFAULT NOW(),
        search_vector  TSVECTOR GENERATED ALWAYS AS (to_tsvector('english', content)) STORED
    );

    CREATE INDEX idx_zhen_session ON zhen_conversations(session_id);
    CREATE INDEX idx_zhen_created ON zhen_conversations(created_at DESC);
    CREATE INDEX idx_zhen_role ON zhen_conversations(role);
    CREATE INDEX idx_zhen_model ON zhen_conversations(model);
    CREATE INDEX idx_zhen_search ON zhen_conversations USING GIN(search_vector);

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- GRANTS
    -- ═══════════════════════════════════════════════════════════════════════════════
    GRANT USAGE ON SCHEMA public TO app_kanban, app_timeguru, app_zhen;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_kanban, app_timeguru, app_zhen;

    -- app_kanban: SELECT on all, full CRUD on kanban_tasks
    GRANT SELECT ON kanban_tasks, timeline_milestones, zhen_conversations TO app_kanban;
    GRANT INSERT, UPDATE, DELETE ON kanban_tasks TO app_kanban;

    -- app_timeguru: SELECT on all, full CRUD on timeline_milestones
    GRANT SELECT ON kanban_tasks, timeline_milestones, zhen_conversations TO app_timeguru;
    GRANT INSERT, UPDATE, DELETE ON timeline_milestones TO app_timeguru;

    -- app_zhen: SELECT on all, full CRUD on zhen_conversations
    GRANT SELECT ON kanban_tasks, timeline_milestones, zhen_conversations TO app_zhen;
    GRANT INSERT, UPDATE, DELETE ON zhen_conversations TO app_zhen;
  004_ops_schema.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — Operations Database Schema (unheaded_ops)

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- SERVICE HEALTH — CURRENT STATE (UPSERT target)
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE service_health_current (
        service_name    VARCHAR(50) NOT NULL,
        host            VARCHAR(50) NOT NULL DEFAULT 'west',
        status          VARCHAR(10) NOT NULL DEFAULT 'unknown'
            CHECK (status IN ('healthy', 'degraded', 'unhealthy', 'unknown')),
        port            INTEGER,
        response_time_ms INTEGER,
        uptime_seconds  BIGINT DEFAULT 0,
        details         JSONB DEFAULT '{}',
        last_check      TIMESTAMPTZ DEFAULT NOW(),
        PRIMARY KEY (service_name, host)
    );

    CREATE INDEX idx_health_current_status ON service_health_current(status);

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- SERVICE HEALTH — STATE TRANSITIONS (append-only log)
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE service_health_transitions (
        id              BIGSERIAL PRIMARY KEY,
        service_name    VARCHAR(50) NOT NULL,
        host            VARCHAR(50) NOT NULL DEFAULT 'west',
        old_status      VARCHAR(10) NOT NULL,
        new_status      VARCHAR(10) NOT NULL,
        response_time_ms INTEGER,
        reason          TEXT DEFAULT '',
        details         JSONB DEFAULT '{}',
        transition_at   TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX idx_health_transitions_service ON service_health_transitions(service_name, host);
    CREATE INDEX idx_health_transitions_at ON service_health_transitions(transition_at DESC);
    CREATE INDEX idx_health_transitions_new_status ON service_health_transitions(new_status);

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- SERVICE HEALTH — HOURLY AGGREGATES
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE service_health_hourly (
        service_name     VARCHAR(50) NOT NULL,
        host             VARCHAR(50) NOT NULL DEFAULT 'west',
        hour             TIMESTAMPTZ NOT NULL,
        checks_total     INTEGER DEFAULT 0,
        checks_healthy   INTEGER DEFAULT 0,
        checks_degraded  INTEGER DEFAULT 0,
        checks_unhealthy INTEGER DEFAULT 0,
        avg_response_ms  REAL DEFAULT 0,
        max_response_ms  INTEGER DEFAULT 0,
        min_response_ms  INTEGER DEFAULT 0,
        PRIMARY KEY (service_name, host, hour)
    );

    CREATE INDEX idx_health_hourly_hour ON service_health_hourly(hour DESC);

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- AUDIT EVENTS (Anamnesis — tamper-evident append-only log)
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE audit_events (
        id              VARCHAR(255) PRIMARY KEY,
        event_at        TIMESTAMPTZ DEFAULT NOW(),
        event_type      VARCHAR(50) NOT NULL
            CHECK (event_type IN (
                'auth.login', 'auth.logout', 'auth.failed',
                'config.create', 'config.update', 'config.delete',
                'deploy.start', 'deploy.complete', 'deploy.rollback',
                'service.start', 'service.stop', 'service.restart', 'service.crash',
                'security.alert', 'security.violation', 'security.scan',
                'kingdom.startup', 'kingdom.shutdown', 'kingdom.mode_change',
                'data.export', 'data.import', 'data.purge'
            )),
        severity        VARCHAR(10) NOT NULL DEFAULT 'info'
            CHECK (severity IN ('debug', 'info', 'warn', 'error', 'critical')),
        action          TEXT DEFAULT '',
        outcome         VARCHAR(10) DEFAULT 'success'
            CHECK (outcome IN ('success', 'failure', 'denied', 'error')),
        actor_id        TEXT DEFAULT '',
        actor_type      VARCHAR(20) DEFAULT '',
        actor_name      TEXT DEFAULT '',
        resource_id     TEXT DEFAULT '',
        resource_type   VARCHAR(50) DEFAULT '',
        source_ip       INET,
        source_service  VARCHAR(50) DEFAULT '',
        trace_id        VARCHAR(64) DEFAULT '',
        details         JSONB DEFAULT '{}',
        previous_hash   VARCHAR(128) DEFAULT '',
        hash            VARCHAR(128) DEFAULT '',
        created_at      TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX idx_audit_event_at ON audit_events(event_at DESC);
    CREATE INDEX idx_audit_event_type ON audit_events(event_type);
    CREATE INDEX idx_audit_severity ON audit_events(severity);
    CREATE INDEX idx_audit_actor_id ON audit_events(actor_id);
    CREATE INDEX idx_audit_resource_type ON audit_events(resource_type);
    CREATE INDEX idx_audit_trace_id ON audit_events(trace_id);
    CREATE INDEX idx_audit_source_service ON audit_events(source_service);

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- GRANTS
    -- ═══════════════════════════════════════════════════════════════════════════════
    GRANT USAGE ON SCHEMA public TO ops_writer, ops_reader;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ops_writer;

    -- ops_writer: full CRUD on all ops tables
    GRANT SELECT, INSERT, UPDATE, DELETE ON
        service_health_current, service_health_transitions, service_health_hourly, audit_events
        TO ops_writer;

    -- ops_reader: SELECT only
    GRANT SELECT ON
        service_health_current, service_health_transitions, service_health_hourly, audit_events
        TO ops_reader;
  005_config_schema.sql: |
    -- SPDX-License-Identifier: GPL-3.0-or-later
    -- The Well — Configuration Database Schema (unheaded_config)

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- UPDATED_AT TRIGGER
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE OR REPLACE FUNCTION update_updated_at()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- KINGDOM CONFIGURATION (key-value with typed values)
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE kingdom_config (
        key          VARCHAR(200) PRIMARY KEY,
        value        JSONB NOT NULL,
        value_type   VARCHAR(20) DEFAULT 'string'
            CHECK (value_type IN ('string', 'integer', 'float', 'boolean', 'array', 'object')),
        description  TEXT DEFAULT '',
        category     VARCHAR(50) DEFAULT 'general'
            CHECK (category IN ('general', 'network', 'security', 'observability', 'services', 'runtime')),
        is_sensitive BOOLEAN DEFAULT FALSE,
        updated_at   TIMESTAMPTZ DEFAULT NOW(),
        updated_by   TEXT DEFAULT 'system'
    );

    CREATE INDEX idx_config_category ON kingdom_config(category);
    CREATE INDEX idx_config_sensitive ON kingdom_config(is_sensitive) WHERE is_sensitive = TRUE;

    CREATE TRIGGER trg_kingdom_config_updated_at
        BEFORE UPDATE ON kingdom_config
        FOR EACH ROW EXECUTE FUNCTION update_updated_at();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- KINGDOM CONFIG HISTORY (change tracking — append-only)
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE kingdom_config_history (
        id           BIGSERIAL PRIMARY KEY,
        key          VARCHAR(200) NOT NULL,
        old_value    JSONB,
        new_value    JSONB,
        changed_by   TEXT DEFAULT 'system',
        change_reason TEXT DEFAULT '',
        changed_at   TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX idx_config_history_key ON kingdom_config_history(key);
    CREATE INDEX idx_config_history_changed_at ON kingdom_config_history(changed_at DESC);

    -- Config change tracking trigger
    CREATE OR REPLACE FUNCTION track_config_change()
    RETURNS TRIGGER AS $$
    BEGIN
        INSERT INTO kingdom_config_history (key, old_value, new_value, changed_by, changed_at)
        VALUES (OLD.key, OLD.value, NEW.value, NEW.updated_by, NOW());
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE TRIGGER trg_kingdom_config_history
        AFTER UPDATE ON kingdom_config
        FOR EACH ROW
        WHEN (OLD.value IS DISTINCT FROM NEW.value)
        EXECUTE FUNCTION track_config_change();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- SERVICE REGISTRY
    -- ═══════════════════════════════════════════════════════════════════════════════
    CREATE TABLE service_registry (
        service_name    VARCHAR(50) PRIMARY KEY,
        display_name    TEXT NOT NULL,
        description     TEXT DEFAULT '',
        port            INTEGER NOT NULL,
        grpc_port       INTEGER,
        protocol        VARCHAR(10) DEFAULT 'http'
            CHECK (protocol IN ('http', 'grpc', 'both')),
        host_default    VARCHAR(100) DEFAULT 'localhost',
        layer           SMALLINT DEFAULT 4
            CHECK (layer BETWEEN 0 AND 5),
        dependencies    TEXT[] DEFAULT '{}',
        health_endpoint VARCHAR(100) DEFAULT '/health',
        config          JSONB DEFAULT '{}',
        enabled         BOOLEAN DEFAULT TRUE,
        registered_at   TIMESTAMPTZ DEFAULT NOW(),
        updated_at      TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX idx_registry_layer ON service_registry(layer);
    CREATE INDEX idx_registry_enabled ON service_registry(enabled);
    CREATE INDEX idx_registry_protocol ON service_registry(protocol);

    CREATE TRIGGER trg_service_registry_updated_at
        BEFORE UPDATE ON service_registry
        FOR EACH ROW EXECUTE FUNCTION update_updated_at();

    -- ═══════════════════════════════════════════════════════════════════════════════
    -- GRANTS
    -- ═══════════════════════════════════════════════════════════════════════════════
    GRANT USAGE ON SCHEMA public TO config_admin, config_reader;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO config_admin;

    -- config_admin: full CRUD on all config tables
    GRANT SELECT, INSERT, UPDATE, DELETE ON
        kingdom_config, kingdom_config_history, service_registry
        TO config_admin;

    -- config_reader: SELECT only
    GRANT SELECT ON
        kingdom_config, kingdom_config_history, service_registry
        TO config_reader;
