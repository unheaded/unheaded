apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: the-well
  namespace: unheaded
  labels:
    app.kubernetes.io/name: the-well
    kingdom.armor: the-well
spec:
  serviceName: the-well
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: the-well
  template:
    metadata:
      labels:
        app.kubernetes.io/name: the-well
        kingdom.armor: the-well
        kingdom.role: persistent-memory
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # postgres user in the postgres:16-alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: unheaded }
            - { name: POSTGRES_USER, value: unheaded }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: unheaded-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          envFrom:
            - secretRef: { name: the-well-users }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "unheaded"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "unheaded"] }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
      volumes:
        - name: initdb
          configMap: { name: the-well-initdb, defaultMode: 0755 }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
