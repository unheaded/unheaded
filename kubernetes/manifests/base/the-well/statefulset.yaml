apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: the-well
  namespace: unheaded
  labels:
    app.kubernetes.io/name: the-well
    kingdom.armor: the-well
spec:
  serviceName: the-well
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: the-well
  template:
    metadata:
      labels:
        app.kubernetes.io/name: the-well
        kingdom.armor: the-well
        kingdom.role: persistent-memory
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # postgres user in the postgres:16-alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          # The repo's server configuration, as compose runs it (ERDA 4.1):
          # TLS 1.3 only with the certificate from the the-well-tls secret,
          # hba rules from db/pg_hba.k8s.conf.
          args: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: postgres }  # no extra database (ERDA 3.6)
            - { name: POSTGRES_USER, value: unheaded }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: unheaded-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          envFrom:
            - secretRef: { name: the-well-users }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # As compose: init.sh alone in initdb.d, migrations at /migrations
            # (ADR-091, ADR-101). One ConfigMap, rendered from db/.
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
            - { name: migrations, mountPath: /migrations }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            # Two files, not the directory: the TLS secret mounts beside them.
            - { name: config, mountPath: /etc/postgresql/postgresql.conf, subPath: postgresql.conf, readOnly: true }
            - { name: config, mountPath: /etc/postgresql/pg_hba.conf, subPath: pg_hba.conf, readOnly: true }
            - { name: tls, mountPath: /etc/postgresql/tls, readOnly: true }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "unheaded", "-d", "postgres"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "unheaded", "-d", "postgres"] }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
      volumes:
        - name: initdb
          configMap:
            name: the-well-initdb
            defaultMode: 0755
            items: [{ key: init.sh, path: 00-init.sh }]
        - name: migrations
          configMap: { name: the-well-initdb, defaultMode: 0444 }
        - name: run
          emptyDir: {}
        - name: config
          configMap: { name: the-well-config, defaultMode: 0444 }
        # Create from scripts/well/make-tls.sh's output (keys never enter the
        # repo; WELL_TLS_EXTRA_DNS=the-well,the-well.unheaded.svc adds the
        # service names, for sslmode=verify-full):
        # kubectl -n unheaded create secret generic the-well-tls
        #   --from-file=server.crt --from-file=server.key --from-file=ca.crt
        # Root-owned, group 70 (fsGroup), 0440: PostgreSQL accepts a
        # root-owned key its group can read.
        - name: tls
          secret: { secretName: the-well-tls, defaultMode: 0440 }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
