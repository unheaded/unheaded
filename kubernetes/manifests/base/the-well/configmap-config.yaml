# GENERATED by scripts/well/render-k8s-initdb.py from db/: do not edit.
# db/postgresql.conf (the one compose uses) and db/pg_hba.k8s.conf. The
# certificate it names comes from the the-well-tls secret (ERDA 4.2).

apiVersion: v1
kind: ConfigMap
metadata:
  name: the-well-config
  namespace: unheaded
data:
  postgresql.conf: |
    # SPDX-License-Identifier: GPL-3.0-or-later
    # The Well — server configuration (ERDA 4.1). Mounted read-only at
    # /etc/postgresql/postgresql.conf and selected with
    # `postgres -c config_file=...` (docker-compose.yml). Anything not set here
    # is PostgreSQL's default, not the image's postgresql.conf.
    #
    # Sized for the compose limit: 256M memory, 0.5 CPU. Memory budget:
    # shared_buffers 64MB + up to 50 backends x a few MB + autovacuum < 256M
    # (typically under 10 backends are open).

    # --- Connections ---------------------------------------------------------
    listen_addresses = '*'          # inside the container; compose publishes 127.0.0.1 only
    port = 5432
    max_connections = 50            # budget: docs/architecture/THE_WELL_OPERATIONS.md (ERDA 4.5)
    superuser_reserved_connections = 3
    hba_file = '/etc/postgresql/pg_hba.conf'

    # --- Authentication and TLS ---------------------------------------------
    password_encryption = scram-sha-256
    ssl = on
    # Private CA and server certificate from scripts/well/make-tls.sh, kept
    # outside the repo (/etc/unheaded/well-tls on the host).
    ssl_cert_file = '/etc/postgresql/tls/server.crt'
    ssl_key_file = '/etc/postgresql/tls/server.key'
    ssl_ca_file = '/etc/postgresql/tls/ca.crt'
    ssl_min_protocol_version = 'TLSv1.3'

    # --- Memory --------------------------------------------------------------
    shared_buffers = 64MB
    effective_cache_size = 160MB
    work_mem = 2MB
    maintenance_work_mem = 32MB
    jit = off                       # small box, short queries: JIT only costs memory

    # --- WAL -----------------------------------------------------------------
    wal_level = replica             # keeps WAL archiving (PITR, ERDA 1.5) one setting away
    max_wal_size = 1GB
    min_wal_size = 80MB

    # --- Statistics ----------------------------------------------------------
    shared_preload_libraries = 'pg_stat_statements'   # extension in `postgres` (027)
    pg_stat_statements.max = 1000
    pg_stat_statements.track = top
    track_io_timing = on

    # --- Timeouts ------------------------------------------------------------
    # No global statement_timeout: well-migrate sets its own per migration and
    # backups may run long. Idle transactions hold back vacuum; well_backup
    # (whose snapshot-exporting session waits while pg_dump runs) is exempt by
    # a role setting (027).
    idle_in_transaction_session_timeout = 60s

    # --- Logging (stdout; Vector ships container logs, ADR-092) --------------
    log_line_prefix = '%m [%p] %q%u@%d '
    log_timezone = 'UTC'
    timezone = 'UTC'
    log_connections = on
    log_disconnections = on
    log_statement = 'ddl'
    log_min_duration_statement = 500ms
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = 10s
  pg_hba.conf: |
    # SPDX-License-Identifier: GPL-3.0-or-later
    # The Well's client authentication on Kubernetes (ERDA 4.2). db/pg_hba.conf
    # is compose's: it names the compose network (172.28.1.0/24), which means
    # nothing in a cluster. Same rules otherwise: TLS only, SCRAM only, and the
    # superuser `unheaded` never over the network (in the pod, over the local
    # socket, for init.sh and operator `kubectl exec`). Which pods may connect at
    # all is the NetworkPolicy's job; this file decides how. Rendered into the
    # the-well-config ConfigMap by scripts/well/render-k8s-initdb.py.
    #
    # Pods connect from the cluster's pod network, which is private address
    # space on every distribution (kind 10.244/16, k3s 10.42/16, Calico
    # 192.168/16, IPv6 ULA): RFC 1918 + fd00::/8, never the internet. Network
    # logins reach the four Well databases by name, not template1/postgres.
    #
    # TYPE   DATABASE                                         USER      ADDRESS         METHOD
    local    all                                              all                       trust
    host     all                                              unheaded  all             reject
    hostssl  unheaded,unheaded_app,unheaded_config,unheaded_ops  all       10.0.0.0/8      scram-sha-256
    hostssl  unheaded,unheaded_app,unheaded_config,unheaded_ops  all       172.16.0.0/12   scram-sha-256
    hostssl  unheaded,unheaded_app,unheaded_config,unheaded_ops  all       192.168.0.0/16  scram-sha-256
    hostssl  unheaded,unheaded_app,unheaded_config,unheaded_ops  all       fd00::/8        scram-sha-256
    host     all                                              all       all             reject
