apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanban-app
  namespace: unheaded
  labels:
    app.kubernetes.io/name: kanban-app
    kingdom.armor: meta-moment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kanban-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanban-app
        kingdom.armor: meta-moment
        kingdom.role: kanban
        kingdom.bus-client: "true"
        kingdom.well-client: "true"
        kingdom.published: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-wotan
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -T2 -O- http://wotan:18000/health >/dev/null 2>&1; do echo waiting-for-wotan; sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
        - name: wait-for-the-well
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z the-well 5432; do echo waiting-for-the-well; sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: kanban-app
          image: ghcr.io/stevenrbellis/unheaded/kanban-app:dev
          ports:
            - { name: http, containerPort: 20001 }
          envFrom:
            - configMapRef: { name: unheaded-shared }
          env:
            - { name: PORT, value: "20001" }
            - { name: TIMEGURU_ADDR, value: "timeguru:19000" }
            - { name: DATA_DIR, value: "/data" }
            - { name: WELL_HOST, value: "the-well" }
            - { name: WELL_PORT, value: "5432" }
            - { name: WELL_USER, value: "app_kanban" }
            - { name: WELL_DB, value: "unheaded_app" }
            - { name: WELL_SSLMODE, value: "disable" }
            - name: WELL_PASSWORD
              valueFrom: { secretKeyRef: { name: the-well-users, key: APP_KANBAN_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /ready, port: 20001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 20001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "500m", memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
        - name: data
          emptyDir: { sizeLimit: 64Mi }
