# Suricata is a host IDS that captures raw packets: hostNetwork, and it STARTS
# as root. It does not RUN as root. Measured on kind 2026-09-25:
#
#   - runAsUser 16782 does not work. With allowPrivilegeEscalation: false
#     (no_new_privs), a non-root process never receives the added
#     capabilities, and capture fails with EPERM.
#   - So the container starts as root and Suricata drops itself (--user,
#     via libcap-ng) to the image's suricata user, uid 998. Every thread ends
#     up uid 998 with CapEff = NET_ADMIN|NET_RAW|SYS_NICE and an EMPTY
#     bounding set. SETUID/SETGID/SETPCAP exist only for that drop; NET_ADMIN
#     cannot go, because Suricata's drop code insists on retaining it.
#
# The manifest never ran before this. Three defects, each fatal on its own:
#   - the image entrypoint copies and chowns files as root, which fails under
#     drop: ALL (no CHOWN/DAC_OVERRIDE), so `command` bypasses it;
#   - the config lacked the %YAML 1.1 header (see the ConfigMap);
#   - AF_PACKET has no "any" pseudo-interface ("No such device"), and node
#     interface names vary, so capture is pcap on "any".
#
# Not yet 16782 (the uids registry): the image's user is 998, and Suricata
# resolves --user by name. See pendingHardening in pkg/uids/uids_test.go.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suricata
  namespace: unheaded
  labels:
    app.kubernetes.io/name: suricata
    kingdom.role: ids
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: suricata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suricata
        kingdom.role: ids
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: suricata
          # Pinned by digest (the multi-arch index: amd64 + arm64). The tag is for
          # readers; the runtime pulls the digest. `7.0` was a floating tag that
          # was rebuilt on 2026-09-24, so the image under test could change
          # without the manifest changing. This digest is the one every test of
          # this manifest ran against (kind, scripts/check-suricata-rules.sh),
          # and `7.0.17` resolved to it on 2026-09-25. To update: check the new
          # digest with `docker buildx imagetools inspect jasonish/suricata:<v>`,
          # then run scripts/check-suricata-rules.sh before committing.
          image: jasonish/suricata:7.0.17@sha256:6cdc29e813473d3747e41f12c854f5fff8464b98386e4a67b7cea41ebf2c0e08
          command: ["/usr/bin/suricata"]
          args: ["-c", "/etc/suricata/suricata.yaml", "--pcap=any",
                 "--user", "suricata", "--group", "suricata"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW", "SYS_NICE", "SETUID", "SETGID", "SETPCAP"]
          volumeMounts:
            - { name: config, mountPath: /etc/suricata }
            - { name: logs, mountPath: /var/log/suricata }
            - { name: run, mountPath: /var/run/suricata }
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
      tolerations:
        - { operator: Exists }
      volumes:
        - { name: config, configMap: { name: suricata-config } }
        - { name: logs, emptyDir: { sizeLimit: 512Mi } }
        - { name: run, emptyDir: {} }
