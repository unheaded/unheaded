# PLACEHOLDERS ONLY — never commit real secrets. Override per-overlay or via
# an external secret manager (SOPS/age, Sealed Secrets, External Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: unheaded-secrets
  namespace: unheaded
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGEME-postgres"
  GRAFANA_ADMIN_PASSWORD: "CHANGEME-grafana"
  GRAFANA_SECRET_KEY: "CHANGEME-32-characters-secret-key"
  CLICKHOUSE_PASSWORD: "CHANGEME-clickhouse"
---
apiVersion: v1
kind: Secret
metadata:
  name: the-well-users
  namespace: unheaded
type: Opaque
stringData:
  # The Well — service-scoped roles (002 + 012); db/init.sh sets each password from these
  APP_KANBAN_PASSWORD: "CHANGEME-kanban"
  APP_TIMEGURU_PASSWORD: "CHANGEME-timeguru"
  APP_ZHEN_PASSWORD: "CHANGEME-zhen"
  APP_AUTH_PASSWORD: "CHANGEME-auth"
  OPS_WRITER_PASSWORD: "CHANGEME-ops-writer"
  OPS_READER_PASSWORD: "CHANGEME-ops-reader"
  CONFIG_ADMIN_PASSWORD: "CHANGEME-config-admin"
  CONFIG_READER_PASSWORD: "CHANGEME-config-reader"
  HUGINN_READER_PASSWORD: "CHANGEME-huginn-reader"
  RETENTION_RUNNER_PASSWORD: "CHANGEME-retention-runner"
