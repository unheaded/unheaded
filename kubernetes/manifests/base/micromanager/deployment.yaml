apiVersion: apps/v1
kind: Deployment
metadata:
  name: micromanager
  namespace: unheaded
  labels:
    app.kubernetes.io/name: micromanager
    kingdom.armor: war-room
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: micromanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: micromanager
        kingdom.armor: war-room
        kingdom.role: execution
        kingdom.bus-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-wotan
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -T2 -O- http://wotan:18000/health >/dev/null 2>&1; do echo waiting-for-wotan; sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: micromanager
          image: ghcr.io/stevenrbellis/unheaded/micromanager:dev
          command: ["/app/micromanager", "-port", "19003"]
          ports:
            - { name: http, containerPort: 19003 }
          envFrom:
            - configMapRef: { name: unheaded-shared }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /ready, port: 19003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 19003 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "500m", memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
        - name: data
          emptyDir: { sizeLimit: 64Mi }
