apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: unheaded
  labels:
    app.kubernetes.io/name: gateway
    kingdom.armor: shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        kingdom.armor: shield
        kingdom.role: gateway
        kingdom.bus-client: "true"
        kingdom.published: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-wotan
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -T2 -O- http://wotan:18000/health >/dev/null 2>&1; do echo waiting-for-wotan; sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: gateway
          image: ghcr.io/stevenrbellis/unheaded/gateway:dev
          ports:
            - { name: http,  containerPort: 21000 }
            - { name: https, containerPort: 21443 }
          envFrom:
            - configMapRef: { name: unheaded-shared }
          env:
            # GATEWAY_HTTP_PORT is the name services/gateway/config reads;
            # GATEWAY_PORT was never looked up by anything.
            - { name: GATEWAY_HTTP_PORT, value: "21000" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # 21000/21443 are >1024 (Doom Range) — no NET_BIND_SERVICE needed.
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /ready, port: 21000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 21000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
