# Hardening exception: promtail mounts host log dirs (read-only) to tail
# container stdout.
#
# This previously left runAsUser unset, so promtail inherited the image
# default and ran as root — with hostPath mounts of /var/log/pods and
# /var/lib/docker/containers. Root plus a host mount of every container's logs
# is the widest identity in the telemetry tier, and it was the only one not
# pinned. It now runs as its own dedicated UID from pkg/uids.
#
# NOTE for WEST/EAST rollout: /var/log/pods entries are often root-owned, so a
# non-root promtail may need the host log group added via supplementalGroups
# (node-dependent). If log ingestion goes quiet after this change, that is the
# cause — fix it with a supplemental group, not by reverting to root.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: unheaded
  labels:
    app.kubernetes.io/name: promtail
    kingdom.tier: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        kingdom.tier: observability
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 16704
        runAsGroup: 16704
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: promtail
          image: grafana/promtail:2.9.0
          args: ["-config.file=/etc/promtail/config.yml"]
          ports:
            - { name: http, containerPort: 9080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
            - { name: containers, mountPath: /var/lib/docker/containers, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "250m", memory: 128Mi }
      tolerations:
        - { operator: Exists }
      volumes:
        - { name: config, configMap: { name: promtail-config } }
        - { name: pods, hostPath: { path: /var/log/pods } }
        - { name: containers, hostPath: { path: /var/lib/docker/containers } }
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 64Mi } }
