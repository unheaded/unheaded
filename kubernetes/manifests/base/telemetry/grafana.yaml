apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: unheaded
  labels:
    app.kubernetes.io/name: grafana
    kingdom.tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        kingdom.tier: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: GF_PATHS_DATA, value: /tmp/grafana }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: unheaded-secrets, key: GRAFANA_ADMIN_PASSWORD } }
            - name: GF_SECURITY_SECRET_KEY
              valueFrom: { secretKeyRef: { name: unheaded-secrets, key: GRAFANA_SECRET_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: unheaded
  labels:
    app.kubernetes.io/name: grafana
    kingdom.tier: observability
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
