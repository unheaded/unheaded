# Hardening exception: node-exporter needs host PID + host /proc,/sys to read
# node metrics. It still runs nonroot, drops all caps, and is read-only.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: unheaded
  labels:
    app.kubernetes.io/name: node-exporter
    kingdom.tier: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        kingdom.tier: observability
    spec:
      hostPID: true
      hostNetwork: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:9100
          ports:
            - { name: metrics, containerPort: 9100, hostPort: 9100 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: sys, mountPath: /host/sys, readOnly: true }
            - { name: root, mountPath: /host/root, mountPropagation: HostToContainer, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: 32Mi }
            limits: { cpu: "250m", memory: 128Mi }
      tolerations:
        - { operator: Exists }
      volumes:
        - { name: proc, hostPath: { path: /proc } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: root, hostPath: { path: / } }
