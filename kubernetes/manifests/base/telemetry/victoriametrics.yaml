apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics-data
  namespace: unheaded
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: unheaded
  labels:
    app.kubernetes.io/name: victoriametrics
    kingdom.tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
        kingdom.tier: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 16703
        fsGroup: 16703
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.99.0
          args: ["--storageDataPath=/victoria-metrics-data", "--retentionPeriod=90d", "--httpListenAddr=:8428"]
          ports:
            - { name: http, containerPort: 8428 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /victoria-metrics-data }
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: data
          persistentVolumeClaim: { claimName: victoriametrics-data }
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: unheaded
  labels:
    app.kubernetes.io/name: victoriametrics
    kingdom.tier: observability
spec:
  selector:
    app.kubernetes.io/name: victoriametrics
  ports:
    - { name: http, port: 8428, targetPort: 8428 }
