apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply to the whole Kingdom unless a component overrides it.
namespace: unheaded

commonLabels:
  app.kubernetes.io/part-of: unheaded

resources:
  # --- foundation ---
  - namespace
  - config
  - network-policies
  # --- stateful core ---
  - the-well
  - wotan
  # --- core services ---
  - monad
  - sophia
  - timeguru
  - architect
  - captain
  - micromanager
  - cuirass
  - dashboard-backend
  - kanban-app
  - gateway
  # --- edge / load balancing ---
  - loadbalancers
  # --- observability ---
  - telemetry
  - logging
  # --- security ---
  # suricata/ is PARKED (2026-09-25), not deployed by default: nothing
  # consumes its alerts, and the Monad rules duplicate what the eBPF data plane
  # already does in-kernel. An IDS belongs at the edge, bolted on when there is
  # a use for one. The manifests still work and scripts/check-suricata-rules.sh
  # still tests them; to deploy anyway: kubectl apply -k base/suricata.
  # See docs/research/FUTURE_INTEGRATIONS.md.
