apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wotan
  namespace: unheaded
  labels:
    app.kubernetes.io/name: wotan
    kingdom.armor: fae-chamber
spec:
  serviceName: wotan-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wotan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wotan
        kingdom.armor: fae-chamber
        kingdom.role: message-bus
        kingdom.bus-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wotan
          image: ghcr.io/stevenrbellis/unheaded/wotan:dev
          # The binary defines -http-port and -grpc-port as ints. --http-addr /
          # --grpc-addr are not flags it has, and Go's flag package exits 2 on an
          # unknown one — this pod crash-looped. Same mistake as the systemd unit.
          args: ["--http-port", "18000", "--grpc-port", "18001"]
          ports:
            - { name: http, containerPort: 18000 }
            - { name: grpc, containerPort: 18001 }
          envFrom:
            - configMapRef: { name: unheaded-shared }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # Doom-Range ports (>1024) need no NET_BIND_SERVICE.
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /var/lib/wotan }
          readinessProbe:
            httpGet: { path: /ready, port: 18000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 18000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
