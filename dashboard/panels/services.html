<!-- Services Tab Panel -->
<!-- Displays all configured Unheaded services with their status, configuration, and management actions -->
<div class="panel panel-services" id="panel-services">
  <div class="panel-header">
    <h2 class="panel-title">Services</h2>
    <div class="panel-controls">
      <button class="btn btn-secondary btn-sm" id="btn-refresh-services" title="Refresh service list">
        Refresh
      </button>
      <span class="text-secondary text-xs" id="services-last-updated">Last updated: --:--:--</span>
    </div>
  </div>

  <div class="panel-body">
    <!-- Filter and Sort Controls -->
    <div class="services-toolbar">
      <div class="toolbar-section">
        <!-- Search input -->
        <div class="form-group form-inline">
          <label for="services-search" class="label-sm">Search:</label>
          <input
            type="text"
            id="services-search"
            class="input input-sm"
            placeholder="Filter by name..."
            autocomplete="off"
          />
        </div>

        <!-- Tier filter dropdown -->
        <div class="form-group form-inline">
          <label for="services-tier-filter" class="label-sm">Tier:</label>
          <select id="services-tier-filter" class="select select-sm">
            <option value="">All Tiers</option>
            <option value="control">Control Plane</option>
            <option value="infrastructure">Infrastructure</option>
            <option value="presentation">Presentation</option>
            <option value="application">Application</option>
          </select>
        </div>

        <!-- Health status filter -->
        <div class="form-group form-inline">
          <label for="services-health-filter" class="label-sm">Status:</label>
          <select id="services-health-filter" class="select select-sm">
            <option value="">All Services</option>
            <option value="healthy">Healthy Only</option>
            <option value="unhealthy">Unhealthy Only</option>
          </select>
        </div>
      </div>

      <div class="toolbar-section">
        <!-- Sort dropdown -->
        <div class="form-group form-inline">
          <label for="services-sort" class="label-sm">Sort by:</label>
          <select id="services-sort" class="select select-sm">
            <option value="name">Service Name</option>
            <option value="tier">Deployment Tier</option>
            <option value="health">Health Status</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Services Summary Stats -->
    <div class="services-summary">
      <div class="summary-stat">
        <span class="stat-label">Total Services:</span>
        <span class="stat-value" id="stat-total-services">0</span>
      </div>
      <div class="summary-stat">
        <span class="stat-label">Healthy:</span>
        <span class="stat-value stat-healthy" id="stat-healthy-services">0</span>
      </div>
      <div class="summary-stat">
        <span class="stat-label">Unhealthy:</span>
        <span class="stat-value stat-unhealthy" id="stat-unhealthy-services">0</span>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="services-empty-state" style="display: none;">
      <div class="empty-state-icon">⚙️</div>
      <h3 class="empty-state-title">No Services Configured</h3>
      <p class="empty-state-message">
        No services found. Place <code>config.yaml</code> files in <code>/opt/unheaded/&lt;service&gt;/</code> to register services.
      </p>
      <p class="empty-state-hint text-secondary">
        Services will be automatically discovered and loaded when their configurations are present.
      </p>
    </div>

    <!-- Services Grid -->
    <div class="services-grid" id="services-grid">
      <!-- Service cards dynamically generated here -->
    </div>
  </div>
</div>

<!-- Service Card Template (hidden, used for cloning) -->
<template id="service-card-template">
  <div class="service-card">
    <div class="card-header">
      <div class="header-title-section">
        <h3 class="card-title service-name"></h3>
        <div class="badge-container">
          <span class="badge badge-tier"></span>
          <span class="badge badge-protocol"></span>
          <span class="badge badge-health"></span>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-icon btn-action-menu" title="Service actions" aria-label="Service actions">
          ⋮
        </button>
      </div>
    </div>

    <div class="card-body">
      <!-- Service metadata -->
      <div class="metadata-section">
        <div class="metadata-row">
          <span class="label">Port:</span>
          <span class="value service-port"></span>
        </div>
        <div class="metadata-row">
          <span class="label">HTTP Port:</span>
          <span class="value service-http-port"></span>
        </div>
        <div class="metadata-row">
          <span class="label">Version:</span>
          <span class="value service-version"></span>
        </div>
      </div>

      <!-- Description -->
      <div class="description-section">
        <p class="service-description"></p>
      </div>

      <!-- Health Details (collapsible) -->
      <details class="health-details">
        <summary class="summary-header">Health Details</summary>
        <div class="health-info">
          <div class="health-row">
            <span class="label">Status:</span>
            <span class="value service-health-status"></span>
          </div>
          <div class="health-row">
            <span class="label">Last Check:</span>
            <span class="value service-last-check"></span>
          </div>
          <div class="health-row">
            <span class="label">Latency:</span>
            <span class="value service-latency"></span>
          </div>
          <div class="health-row">
            <span class="label">Check Interval:</span>
            <span class="value service-check-interval"></span>
          </div>
          <div class="health-row">
            <span class="label">Consecutive Failures:</span>
            <span class="value service-failures"></span>
          </div>
          <div class="health-message service-health-message" style="display: none;">
            <span class="label">Message:</span>
            <span class="value"></span>
          </div>
        </div>
      </details>

      <!-- Runtime Config (collapsible) -->
      <details class="runtime-details">
        <summary class="summary-header">Runtime Config</summary>
        <div class="runtime-info">
          <div class="runtime-row">
            <span class="label">Binary:</span>
            <code class="value service-binary"></code>
          </div>
          <div class="runtime-row" style="display: none;">
            <span class="label">Arguments:</span>
            <code class="value service-args"></code>
          </div>
          <div class="runtime-row">
            <span class="label">Restart Policy:</span>
            <span class="value service-restart-policy"></span>
          </div>
          <div class="runtime-row">
            <span class="label">Replicas:</span>
            <span class="value service-replicas"></span>
          </div>
        </div>
      </details>

      <!-- Dependencies (collapsible, if any) -->
      <details class="dependencies-details" style="display: none;">
        <summary class="summary-header">Dependencies</summary>
        <div class="dependencies-list">
          <ul class="service-dependencies"></ul>
        </div>
      </details>
    </div>

    <div class="card-footer">
      <div class="footer-actions">
        <button class="btn btn-secondary btn-xs" data-action="view-config" title="View configuration file">
          View Config
        </button>
        <button class="btn btn-secondary btn-xs" data-action="view-logs" title="View service logs">
          View Logs
        </button>
        <button class="btn btn-secondary btn-xs" data-action="restart" title="Restart service">
          Restart
        </button>
      </div>
    </div>
  </div>
</template>

<!-- JavaScript for Services Panel Functionality -->
<script>
  (function() {
    const SERVICES_ENDPOINT = '/api/v1/services';
    const REFRESH_INTERVAL = 30000; // 30 seconds

    let allServices = [];
    let refreshTimer = null;

    // Initialize the services panel
    function init() {
      const gridContainer = document.getElementById('services-grid');
      const emptyState = document.getElementById('services-empty-state');

      if (!gridContainer || !emptyState) {
        console.error('Services panel elements not found');
        return;
      }

      // Event listeners
      document.getElementById('btn-refresh-services')?.addEventListener('click', loadServices);
      document.getElementById('services-search')?.addEventListener('input', filterAndSort);
      document.getElementById('services-tier-filter')?.addEventListener('change', filterAndSort);
      document.getElementById('services-health-filter')?.addEventListener('change', filterAndSort);
      document.getElementById('services-sort')?.addEventListener('change', filterAndSort);

      // Initial load
      loadServices();

      // Auto-refresh
      refreshTimer = setInterval(loadServices, REFRESH_INTERVAL);
    }

    // Load services from API
    function loadServices() {
      fetch(SERVICES_ENDPOINT)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data => {
          allServices = data.services || [];
          updateSummaryStats(data);
          filterAndSort();
          updateLastUpdated(data.updated_at);
        })
        .catch(error => {
          console.error('Failed to load services:', error);
          showEmptyState('Failed to load services');
        });
    }

    // Update summary statistics
    function updateSummaryStats(data) {
      document.getElementById('stat-total-services').textContent = data.total || 0;
      document.getElementById('stat-healthy-services').textContent = data.healthy || 0;
      document.getElementById('stat-unhealthy-services').textContent = data.unhealthy || 0;
    }

    // Update last updated timestamp
    function updateLastUpdated(timestamp) {
      const el = document.getElementById('services-last-updated');
      if (el && timestamp) {
        const date = new Date(timestamp);
        el.textContent = `Last updated: ${date.toLocaleTimeString()}`;
      }
    }

    // Filter and sort services
    function filterAndSort() {
      const searchTerm = (document.getElementById('services-search')?.value || '').toLowerCase();
      const tierFilter = document.getElementById('services-tier-filter')?.value || '';
      const healthFilter = document.getElementById('services-health-filter')?.value || '';
      const sortBy = document.getElementById('services-sort')?.value || 'name';

      let filtered = allServices.filter(service => {
        const matchesSearch = service.config.service.name.includes(searchTerm) ||
                             service.config.service.display_name.toLowerCase().includes(searchTerm);
        const matchesTier = !tierFilter || service.config.deployment.tier === tierFilter;
        const matchesHealth = !healthFilter ||
                             (healthFilter === 'healthy' && service.status.healthy) ||
                             (healthFilter === 'unhealthy' && !service.status.healthy);

        return matchesSearch && matchesTier && matchesHealth;
      });

      // Sort
      filtered.sort((a, b) => {
        switch (sortBy) {
          case 'name':
            return a.config.service.name.localeCompare(b.config.service.name);
          case 'tier':
            return a.config.deployment.tier.localeCompare(b.config.deployment.tier);
          case 'health':
            return (b.status.healthy ? 1 : 0) - (a.status.healthy ? 1 : 0);
          default:
            return 0;
        }
      });

      renderServices(filtered);
    }

    // Render service cards
    function renderServices(services) {
      const gridContainer = document.getElementById('services-grid');
      const emptyState = document.getElementById('services-empty-state');
      const template = document.getElementById('service-card-template');

      if (!gridContainer || !template) return;

      gridContainer.innerHTML = '';

      if (services.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      services.forEach(service => {
        const card = template.content.cloneNode(true);
        const config = service.config;
        const status = service.status;

        // Set service name
        card.querySelector('.service-name').textContent = config.service.display_name || config.service.name;

        // Set badges
        const tierBadge = card.querySelector('.badge-tier');
        tierBadge.textContent = config.deployment.tier;

        const protocolBadge = card.querySelector('.badge-protocol');
        protocolBadge.textContent = config.network.protocol.toUpperCase();

        const healthBadge = card.querySelector('.badge-health');
        healthBadge.textContent = status.healthy ? 'healthy' : 'degraded';
        healthBadge.classList.add(status.healthy ? 'healthy' : 'unhealthy');

        // Set metadata
        card.querySelector('.service-port').textContent = config.network.port;
        card.querySelector('.service-http-port').textContent = config.network.http_port;
        card.querySelector('.service-version').textContent = config.service.version;

        // Set description
        card.querySelector('.service-description').textContent = config.service.description || 'No description provided';

        // Set health details
        card.querySelector('.service-health-status').textContent = status.healthy ? 'Healthy' : 'Unhealthy';
        card.querySelector('.service-last-check').textContent = new Date(status.last_check).toLocaleTimeString();
        card.querySelector('.service-latency').textContent = `${status.latency}ms`;
        card.querySelector('.service-check-interval').textContent = config.health.check_interval;
        card.querySelector('.service-failures').textContent = status.consecutive_failures;

        if (status.message) {
          const msgEl = card.querySelector('.service-health-message');
          msgEl.style.display = 'block';
          msgEl.querySelector('.value').textContent = status.message;
        }

        // Set runtime config
        card.querySelector('.service-binary').textContent = config.runtime.binary;
        card.querySelector('.service-restart-policy').textContent = config.deployment.restart_policy;
        card.querySelector('.service-replicas').textContent = config.deployment.replicas;

        if (config.runtime.args && config.runtime.args.length > 0) {
          const argsRow = card.querySelector('[class*="runtime-row"]');
          if (argsRow) {
            const argsDisplay = argsRow.querySelector('.service-args');
            if (argsDisplay) {
              argsDisplay.textContent = config.runtime.args.join(' ');
              argsRow.style.display = 'flex';
            }
          }
        }

        // Set dependencies
        if (config.deployment.depends_on && config.deployment.depends_on.length > 0) {
          const depDetails = card.querySelector('.dependencies-details');
          depDetails.style.display = 'block';
          const depList = card.querySelector('.service-dependencies');
          depList.innerHTML = config.deployment.depends_on
            .map(dep => `<li>${dep}</li>`)
            .join('');
        }

        // Add action listeners
        const actions = card.querySelectorAll('[data-action]');
        actions.forEach(btn => {
          btn.addEventListener('click', () => handleAction(btn.dataset.action, config.service.name));
        });

        gridContainer.appendChild(card);
      });
    }

    // Handle card actions
    function handleAction(action, serviceName) {
      switch (action) {
        case 'view-config':
          console.log(`View config for ${serviceName}`);
          alert(`View config: /opt/unheaded/${serviceName}/config.yaml`);
          break;
        case 'view-logs':
          console.log(`View logs for ${serviceName}`);
          alert(`View logs for ${serviceName} - would navigate to logs panel`);
          break;
        case 'restart':
          if (confirm(`Restart service: ${serviceName}?`)) {
            console.log(`Restart ${serviceName}`);
            alert(`Restart initiated for ${serviceName}`);
          }
          break;
      }
    }

    // Show empty state
    function showEmptyState(message) {
      const emptyState = document.getElementById('services-empty-state');
      const gridContainer = document.getElementById('services-grid');
      if (emptyState && gridContainer) {
        gridContainer.innerHTML = '';
        emptyState.querySelector('.empty-state-message').textContent = message;
        emptyState.style.display = 'block';
      }
    }

    // Cleanup on panel removal
    function cleanup() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
      }
    }

    // Initialize on load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', cleanup);
  })();
</script>
