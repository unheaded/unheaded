; The Dockerfile's default all-in-one stage (development only): every
; service under one supervisord, copied to /etc/supervisor.d/unheaded.ini.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:wotan]
command=/app/wotan
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:timeguru]
command=/app/timeguru
autostart=true
autorestart=true
