# =============================================================================
# WireGuard Configuration — EAST (Staging Host)
# =============================================================================
# Unheaded Kingdom IPv6 Overlay
# Host: EAST (P2P 192.168.13.1)
# Overlay: fd00:dead:beef::2/64
#
# IMPORTANT: Replace <PLACEHOLDER> values with real keys before deploying.
#            Use scripts/wireguard/setup-wireguard.sh for automated deployment.
#            NEVER commit real private keys to Git.
# =============================================================================

[Interface]
Address = fd00:dead:beef::2/64
ListenPort = 51820
PrivateKey = <EAST_PRIVATE_KEY>

# Enable IPv6 forwarding for overlay traffic and add /48 route
PostUp = ip -6 route add fd00:dead:beef::/48 dev %i; sysctl -w net.ipv6.conf.all.forwarding=1; sysctl -w net.ipv6.conf.%i.forwarding=1
PostDown = ip -6 route del fd00:dead:beef::/48 dev %i; sysctl -w net.ipv6.conf.all.forwarding=0; sysctl -w net.ipv6.conf.%i.forwarding=0

[Peer]
# WEST (192.168.13.2)
PublicKey = <WEST_PUBLIC_KEY>
PresharedKey = <PRESHARED_KEY>
AllowedIPs = fd00:dead:beef::1/128, fd00:dead:beef:0:1::/80
Endpoint = 192.168.13.2:51820
PersistentKeepalive = 25
