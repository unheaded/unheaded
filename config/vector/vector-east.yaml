# SPDX-License-Identifier: GPL-3.0-or-later
# East's log shipper (ADR-092 step 8, M-082): east runs no compose stack, so
# Vector runs there as a host unit (deploy/systemd/vector-east.service) and
# ships east's journal to west's ClickHouse over the P2P link (west is
# 192.168.13.2, east 192.168.13.1).
#
# The transforms block is a verbatim copy of config/vector/vector.yaml's;
# scripts/test-vector-config.sh fails if the two differ, so both hosts count
# and store lines the same way. Only sources, sinks and paths differ here.
#
# Needs, in the host window (E-D): ClickHouse on west listening on
# 192.168.13.2:8123 as well as loopback, and reachable from east only
# (nft); CLICKHOUSE_PASSWORD in /etc/unheaded/vector/vector-east.env (0600,
# root; systemd reads it before dropping to unheaded-vector).
api:
  enabled: false

# StateDirectory=vector in the unit; the disk buffer lives here too.
data_dir: /var/lib/vector

sources:
  journal:
    type: journald
    journal_directory: /var/log/journal
    current_boot_only: false
    extra_args: ["--merge"]

  vector_metrics:
    type: internal_metrics

transforms:
  journal_rows:
    type: remap
    inputs:
      - journal
    source: |
      prio = to_int(.PRIORITY) ?? 6
      level = if prio <= 0 { "emerg" } else if prio == 1 { "alert" } else if prio == 2 { "crit" } else if prio == 3 { "err" } else if prio == 4 { "warning" } else if prio == 5 { "notice" } else if prio == 6 { "info" } else { "debug" }
      facility = to_int(.SYSLOG_FACILITY) ?? -1
      audit = facility == 4 || facility == 10 || ."_TRANSPORT" == "audit"
      # The systemd unit names a service; for sudo, sshd sessions and
      # systemd itself it is user@N.service, session-N.scope or init.scope,
      # and the syslog identifier says more.
      unit = string(."_SYSTEMD_UNIT") ?? ""
      if unit == "" || starts_with(unit, "user@") || starts_with(unit, "session-") || unit == "init.scope" {
        unit = string(.SYSLOG_IDENTIFIER) ?? string(."_COMM") ?? unit
      }
      # Docker's journald driver: dockerd writes the entry, so _SYSTEMD_UNIT
      # is docker.service; the container name says which service it was.
      container = string(.CONTAINER_NAME) ?? ""
      if container != "" { unit = container }
      if unit == "" { unit = "unknown" }
      message = string(.message) ?? encode_json(.message)
      # One journal entry, for ClickHouse's dedupe (Vector drops __CURSOR
      # from events): boot, monotonic microseconds, and the message.
      entry = (string(."_BOOT_ID") ?? "") + ":" + (string(."__MONOTONIC_TIMESTAMP") ?? "") + ":" + to_string(seahash(message))
      ts = .timestamp
      host = string(.host) ?? "unknown"
      rest = .
      rest = remove!(rest, ["message"])
      rest = remove!(rest, ["timestamp"])
      rest = remove!(rest, ["host"])
      rest = remove!(rest, ["source_type"])
      # Docker driver bookkeeping: per-line counters and the 64-hex id
      # (CONTAINER_ID keeps the short one).
      for_each(["CONTAINER_ID_FULL", "CONTAINER_LOG_EPOCH", "CONTAINER_LOG_ORDINAL", "CONTAINER_PARTIAL_ID", "CONTAINER_PARTIAL_ORDINAL", "CONTAINER_PARTIAL_LAST"]) -> |_i, k| {
        rest = remove!(rest, [k])
      }
      retention = if audit { "audit" } else { "operational" }
      # Lines the syslog relay wrote for a device (ADR-124; answer #18 of
      # 2026-11-09). Their unit is the relay for every one, and their
      # facility and hostname are the sender's claim: a sender that picks
      # facility 4 or 10 must not file its line as audit, and a device's
      # "Failed password" must not count as west's. The relay's own stamps
      # decide instead, from the device's sources.yaml row: UNHEADED_SOURCE
      # is the unit, UNHEADED_SOURCE_HOST the host, UNHEADED_RETENTION the
      # class. Only the relay can write them: _SYSTEMD_UNIT and _TRANSPORT
      # are journald's own, and the relay's own log lines arrive on stdout,
      # so they stay west's. A stamp that is missing or malformed files the
      # line as audit (never shorten evidence) under host and unit unknown.
      if (string(."_SYSTEMD_UNIT") ?? "") == "unheaded-syslog-relay.service" && (string(."_TRANSPORT") ?? "") == "journal" {
        rest.relay_host = host
        unit = string(.UNHEADED_SOURCE) ?? ""
        if !match(unit, r'^[a-z0-9][A-Za-z0-9._/:@-]{0,127}$') { unit = "unknown" }
        host = string(.UNHEADED_SOURCE_HOST) ?? ""
        if !match(host, r'^(west|east|pihole|device:[0-9A-Za-z.:-]{1,64}|unknown)$') { host = "unknown" }
        retention = if (string(.UNHEADED_RETENTION) ?? "") == "operational" { "operational" } else { "audit" }
      }
      . = {
        "timestamp": ts,
        "host": host,
        "source": "journald",
        "unit": unit,
        "level": level,
        "retention": retention,
        "message": message,
        "entry": entry,
        "fields": encode_json(rest)
      }

  # Log-volume and auth-failure SLIs (ADR-100 Phase 3). Lines are counted,
  # never stored for this: the metric carries host, unit, level and a fixed
  # failure kind, not message text. Alerts: monitoring/prometheus/rules/logs.yml.
  journal_volume:
    type: remap
    inputs:
      - journal_rows
    source: |
      unit = string(.unit) ?? "unknown"
      # Transient units (run-u123.service, docker-<64 hex>.scope) would add
      # a series per instance; count them as one.
      if starts_with(unit, "run-") || match(unit, r'[0-9a-f]{12,}') {
        unit = "transient"
      }
      msg = string(.message) ?? ""
      # Fixed patterns only; the message itself never leaves this transform.
      auth = ""
      if match(msg, r'^(Failed (password|publickey|keyboard-interactive/pam) for|Invalid user |Connection closed by invalid user )') {
        auth = "ssh"
      } else if match(msg, r'incorrect password attempts?') {
        auth = "sudo"
      } else if match(msg, r'^pam_unix\([^)]*:auth\): authentication failure') {
        auth = "pam"
      }
      . = {
        "host": string(.host) ?? "unknown",
        "unit": unit,
        "level": string(.level) ?? "info",
        "bytes": strlen(msg),
        "auth": auth
      }

  journal_volume_metrics:
    type: log_to_metric
    inputs:
      - journal_volume
    metrics:
      - type: counter
        field: unit
        namespace: unheaded
        name: log_lines_total
        tags: {host: "{{host}}", unit: "{{unit}}", level: "{{level}}"}
      - type: counter
        field: bytes
        increment_by_value: true
        namespace: unheaded
        name: log_bytes_total
        tags: {host: "{{host}}", unit: "{{unit}}", level: "{{level}}"}

  journal_auth_failures:
    type: filter
    inputs:
      - journal_volume
    condition: '.auth != ""'

  journal_auth_metrics:
    type: log_to_metric
    inputs:
      - journal_auth_failures
    metrics:
      - type: counter
        field: auth
        namespace: unheaded
        name: auth_failures_total
        tags: {host: "{{host}}", unit: "{{unit}}", kind: "{{auth}}"}

  # SSH logins by source (M-203, detection.yml SSHLoginNewSource). Read
  # from the raw journal, not journal_rows: there the unit can come from
  # SYSLOG_IDENTIFIER, which any local user sets with logger(1). Only an
  # sshd running as root counts. Metadata only: the login name (operator
  # accounts), the source address (LAN or P2P today) and the auth method;
  # the line itself never leaves the transform. A name or address that does
  # not look like one is counted as "invalid", so a crafted line cannot mint
  # arbitrary label values.
  journal_ssh:
    type: filter
    inputs:
      - journal
    condition: |
      comm = string(."_COMM") ?? ""
      (comm == "sshd" || comm == "sshd-session") && (string(."_UID") ?? "") == "0" && match(string(.message) ?? "", r'^Accepted [a-z0-9/-]+ for \S+ from \S+ port [0-9]+')

  journal_ssh_accepted:
    type: remap
    inputs:
      - journal_ssh
    drop_on_abort: true
    source: |
      p = parse_regex(string(.message) ?? "", r'^Accepted (?P<method>[a-z0-9/-]+) for (?P<user>\S+) from (?P<src>\S+) port [0-9]+') ?? {}
      if !exists(p.user) { abort }
      user = string(p.user) ?? ""
      if !match(user, r'^[a-z_][a-z0-9_-]{0,31}$') { user = "invalid" }
      src = string(p.src) ?? ""
      if !match(src, r'^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9a-fA-F:.]{2,45})$') { src = "invalid" }
      method = string(p.method) ?? ""
      if !match(method, r'^(publickey|password|keyboard-interactive(/pam)?|hostbased|gssapi-with-mic)$') { method = "other" }
      . = {
        "host": string(.host) ?? "unknown",
        "user": user,
        "src": src,
        "method": method
      }

  journal_ssh_metrics:
    type: log_to_metric
    inputs:
      - journal_ssh_accepted
    metrics:
      - type: counter
        field: user
        namespace: unheaded
        name: ssh_accepted_total
        tags: {host: "{{host}}", user: "{{user}}", src: "{{src}}", method: "{{method}}"}

  # Host events for the indicator-of-compromise audit (S-WATCH-TRUE Phase 9,
  # D-18; read by runbooks/security/ioc-audit.yaml). Counted by kind:
  #   account       useradd, usermod, userdel, groupadd, groupmod, groupdel,
  #                 gpasswd, passwd, chpasswd, chage, systemd-sysusers
  #                 (op = the tool, user = the account or group it named)
  #   sudo_command  a command sudo ran (user = who, runas = as whom)
  #   cron_edit     a crontab replaced or deleted (user = who, runas = whose)
  #   kernel        class oom_kill, segfault or module_untrusted (op = the
  #                 module's name for module_untrusted)
  # One counter, unheaded_host_events_total{host, kind, op, class, user,
  # runas}; a label a kind does not use is empty. The line itself never
  # leaves the transform: no directory, no command line, no victim process.
  # A name that does not look like an account name is counted as "invalid",
  # so a crafted line cannot mint label values.
  #
  # Read from the raw journal, on fields journald sets itself wherever it
  # has them. Kernel lines: _TRANSPORT kernel and facility kern (a process
  # that writes into /dev/kmsg has another facility). The account tools:
  # _UID 0, which the kernel hands journald with the line, and the program's
  # name. sudo, crontab, passwd, gpasswd and chage are set-id programs that
  # log under the uid of whoever ran them, so _UID 0 cannot be asked of
  # them; they are taken on the program's name and, when journald has it,
  # on _EXE, the path of the program.
  #
  # The program's name is _COMM. journald reads _COMM and _EXE from
  # /proc/<pid> when the line arrives, and a program that logs and exits at
  # once is often gone by then: on west (2026-11-15) a `crontab -` replace
  # arrived with _COMM and no _EXE, another line with neither, and one sudo
  # command in two lacked both. So:
  #   _EXE present   it must be the installed program's path; anything else
  #                  is dropped (the forgery this field can catch);
  #   _EXE absent    the line is taken on _COMM;
  #   both absent    the line is taken on SYSLOG_IDENTIFIER.
  # A _COMM that is present and names another program is dropped whatever
  # the identifier says.
  #
  # The trade, chosen on purpose: a real edit is not missed, and a local
  # account can forge a set-id line. A process that names itself crontab
  # (or passes logger -t crontab) and exits before journald looks is
  # counted, so such an account can raise a false cron_edit, sudo_command
  # or passwd count. It cannot hide a real one, and it cannot make a
  # root-only event (useradd, usermod, a kernel line): those need _UID 0.
  # The audit treats a count here as a reason to read the journal on that
  # host, where _UID and _PID tell the two apart; it is not proof by itself.
  # The stronger source for crontab is an audit watch on the cron spool
  # (auditd names the file and the uid, and a process cannot forge it). It
  # belongs with S-EVIDENCE-RUNS's lab-audited profile and is parked there,
  # not built here.
  #
  # One change, one count where the tool logs several lines: groupadd's two
  # file lines, usermod's shadow-group line, useradd's own group line and
  # the kernel's other lines about one out-of-memory kill are dropped.
  # Tests: tests/host_events.yaml.
  journal_host:
    type: filter
    inputs:
      - journal
    condition: |
      exe = string(."_EXE") ?? ""
      # The program: _COMM, or the syslog identifier when the process was
      # gone before journald read its name.
      prog = string(."_COMM") ?? ""
      if prog == "" { prog = string(.SYSLOG_IDENTIFIER) ?? "" }
      kernel = (string(."_TRANSPORT") ?? "") == "kernel" && (string(.SYSLOG_FACILITY) ?? "") == "0"
      root = (string(."_UID") ?? "") == "0" && includes(["useradd", "usermod", "userdel", "groupadd", "groupmod", "groupdel", "gpasswd", "passwd", "chpasswd", "chage", "systemd-sysuser", "systemd-sysusers", "sudo", "crontab"], prog)
      # Set-id programs, any sender: the installed path when journald saw
      # one, the name alone when the process was already gone.
      setid = (prog == "sudo" && includes(["", "/usr/bin/sudo", "/usr/lib/cargo/bin/sudo"], exe)) || (prog == "crontab" && includes(["", "/usr/bin/crontab"], exe)) || (prog == "passwd" && includes(["", "/usr/bin/passwd"], exe)) || (prog == "gpasswd" && includes(["", "/usr/bin/gpasswd"], exe)) || (prog == "chage" && includes(["", "/usr/bin/chage"], exe))
      kernel || root || setid

  journal_host_events:
    type: remap
    inputs:
      - journal_host
    drop_on_abort: true
    source: |
      msg = string(.message) ?? ""
      # As in journal_host: the syslog identifier stands in for a _COMM
      # journald could not read. The journal keeps 15 characters of a
      # process name; the identifier has all of it.
      comm = string(."_COMM") ?? ""
      if comm == "" { comm = string(.SYSLOG_IDENTIFIER) ?? "" }
      if comm == "systemd-sysusers" { comm = "systemd-sysuser" }
      kind = ""
      op = ""
      class = ""
      user = ""
      runas = ""
      if (string(."_TRANSPORT") ?? "") == "kernel" {
        kind = "kernel"
        if match(msg, r'^(Out of memory|Memory cgroup out of memory): Killed process [0-9]+ ') {
          class = "oom_kill"
        } else if match(msg, r'^.{1,16}\[[0-9]+\]: segfault at [0-9a-f]+ ip ') {
          class = "segfault"
        } else {
          p = parse_regex(msg, r'^(?P<n>[A-Za-z0-9_]+): (loading out-of-tree module taints kernel\.|module verification failed: signature and/or required key missing - tainting kernel)$') ?? {}
          if !exists(p.n) { abort }
          class = "module_untrusted"
          op = string(p.n) ?? ""
          if !match(op, r'^[a-z0-9_]{1,32}$') { op = "invalid" }
        }
      } else if comm == "sudo" {
        # "<user> : [TTY=x ; ]PWD=<dir> ; USER=<runas> ; COMMAND=<line>".
        # A refusal puts its reason before TTY= and is not matched.
        p = parse_regex(msg, r'^\s*(?P<n>\S+) :\s+(TTY=\S+ ; )?PWD=') ?? {}
        if !exists(p.n) || !contains(msg, " ; COMMAND=") { abort }
        kind = "sudo_command"
        user = string(p.n) ?? ""
        # The directory and the command are the caller's text and may carry
        # " ; USER=" themselves: only a line with exactly one is believed.
        parts = split(msg, " ; USER=")
        runas = "invalid"
        if length(parts) == 2 {
          r = parse_regex(string(parts[1]) ?? "", r'^(?P<n>[^ ;]+) ;') ?? {}
          runas = string(r.n) ?? "invalid"
        }
        if !match(runas, r'^[a-z_][a-z0-9_-]{0,31}$') { runas = "invalid" }
      } else if comm == "crontab" {
        # "(who) REPLACE (whose)". BEGIN EDIT, END EDIT and LIST change nothing.
        p = parse_regex(msg, r'^\((?P<n>[^)]*)\) (REPLACE|DELETE) \((?P<o>[^)]*)\)$') ?? {}
        if !exists(p.n) { abort }
        kind = "cron_edit"
        user = string(p.n) ?? ""
        runas = string(p.o) ?? ""
        if !match(runas, r'^[a-z_][a-z0-9_-]{0,31}$') { runas = "invalid" }
      } else {
        kind = "account"
        op = comm
        p = {}
        if comm == "useradd" {
          p = parse_regex(msg, r'^new user: name=(?P<n>[^,]*),') ?? {}
        } else if comm == "userdel" {
          p = parse_regex(msg, r'^delete user \x27(?P<n>[^\x27]*)\x27') ?? {}
        } else if comm == "usermod" {
          if starts_with(msg, "pam_") || contains(msg, "shadow group") { abort }
          p = parse_regex(msg, r'\x27(?P<n>[^\x27]*)\x27') ?? {"n": ""}
        } else if comm == "groupadd" {
          p = parse_regex(msg, r'^new group: name=(?P<n>[^,]*),') ?? {}
        } else if comm == "groupdel" {
          p = parse_regex(msg, r'^group \x27(?P<n>[^\x27]*)\x27 removed$') ?? {}
        } else if comm == "groupmod" {
          p = parse_regex(msg, r'^group changed in /etc/group \(group (?P<n>[^/]*)/') ?? {}
        } else if comm == "gpasswd" {
          p = parse_regex(msg, r'^user (?P<n>\S+) (added|removed) by \S+ (to|from) group \S+$') ?? parse_regex(msg, r'^members of group (?P<n>\S+) set by ') ?? {}
        } else if comm == "passwd" {
          p = parse_regex(msg, r'^pam_unix\(passwd:chauthtok\): password changed for (?P<n>\S+)$') ?? parse_regex(msg, r'^password for \x27(?P<n>[^\x27]*)\x27 changed by ') ?? {}
        } else if comm == "chpasswd" {
          p = parse_regex(msg, r'^pam_unix\(chpasswd:chauthtok\): password changed for (?P<n>\S+)$') ?? {}
        } else if comm == "chage" {
          p = parse_regex(msg, r'^changed password expiry for (?P<n>\S+)$') ?? {}
        } else if comm == "systemd-sysuser" {
          op = "systemd-sysusers"
          p = parse_regex(msg, r'^Creating (user|group) \x27(?P<n>[^\x27]*)\x27') ?? {}
        }
        if !exists(p.n) { abort }
        user = string(p.n) ?? ""
      }
      if kind != "kernel" && !match(user, r'^[a-z_][a-z0-9_-]{0,31}$') { user = "invalid" }
      . = {
        "host": string(.host) ?? "unknown",
        "kind": kind,
        "op": op,
        "class": class,
        "user": user,
        "runas": runas
      }

  journal_host_metrics:
    type: log_to_metric
    inputs:
      - journal_host_events
    metrics:
      - type: counter
        field: kind
        namespace: unheaded
        name: host_events_total
        tags: {host: "{{host}}", kind: "{{kind}}", op: "{{op}}", class: "{{class}}", user: "{{user}}", runas: "{{runas}}"}

  # Secrets that a process printed to the journal (an uhk_ API key, a
  # bearer token, a PGPASSWORD) are masked before the row leaves the host
  # (S-LOW-FRUIT Phase 7). Tests: tests/redact.yaml. A doubled dollar sign is
  # a literal one (Vector interpolates environment variables in this file).
  redact_secrets:
    type: remap
    inputs:
      - journal_rows
    source: |
      if is_string(.message) {
        m = string!(.message)
        m = replace(m, r'uhk_[A-Za-z0-9]{16,}', "uhk_[REDACTED]")
        m = replace(m, r'(?i)\b(bearer|token|password|pgpassword)([=: ]+)\S+', "$$1$$2[REDACTED]")
        .message = m
      }

sinks:
  clickhouse:
    type: clickhouse
    inputs:
      - redact_secrets
    endpoint: "http://192.168.13.2:8123"
    database: "unheaded_logs"
    table: "logs"
    date_time_best_effort: true
    auth:
      strategy: "basic"
      user: "unheaded"
      password: "${CLICKHOUSE_PASSWORD}"   # EnvironmentFile; no default credential
    batch:
      max_events: 1000
      timeout_secs: 5
    # The P2P link or west can be down for a while: hold up to 256 MiB on
    # disk instead of dropping, then apply backpressure to the journal
    # source (the journal itself is the next buffer, capped by journald-caps).
    buffer:
      type: disk
      max_size: 268435488
      when_full: block

  # Scraped from west over the P2P link (job vector-east): the same
  # "stopped shipping" alerts as west. Bound to east's P2P address only.
  prometheus:
    type: prometheus_exporter
    inputs:
      - vector_metrics
      - journal_volume_metrics
      - journal_auth_metrics
      - journal_ssh_metrics
      - journal_host_metrics
    address: "192.168.13.1:9598"
    flush_period_secs: 86400
