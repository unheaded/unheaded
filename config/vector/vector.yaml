# SPDX-License-Identifier: GPL-3.0-or-later
# Ships the host's journal (every unit, plus auth, sudo, PAM and kernel
# audit records) to ClickHouse unheaded_logs.logs (ADR-092 step 8; schema
# and retention in config/clickhouse/schema/001-logs.sql).
#
# Container stdout of first-party services ships too, without the Docker
# socket (root on the host, 1e9b9eeb): docker-compose.yml logs them with
# the journald driver, so their lines arrive here as journal entries
# carrying CONTAINER_NAME, and unit is the container name (ADR-092 step 1,
# amended 2026-10-27). Third-party containers keep json-file caps.
api:
  enabled: true
  address: "0.0.0.0:8686"

# journald cursor; a volume, so a restart resumes. Not /var/lib/vector: the
# image ships that directory root-owned, and Docker copies its ownership onto
# an empty volume mounted there.
data_dir: /var/lib/unheaded-vector

sources:
  journal:
    type: journald
    journal_directory: /var/log/journal
    # Every boot, and resume across them. current_boot_only alone is not
    # enough: `journalctl --follow` starts at the current boot even with
    # --after-cursor in an earlier one (systemd 252 in the image and 257 on
    # the hosts, tested 2026-10-19), dropping the shutdown sequence logged
    # after Vector stopped. --merge makes it resume at the cursor.
    current_boot_only: false
    extra_args: ["--merge"]

  # Vector's own counters (events read, sent, errors per component), for the
  # "host stopped shipping" alert (monitoring/prometheus/rules/logs.yml).
  vector_metrics:
    type: internal_metrics

transforms:
  journal_rows:
    type: remap
    inputs:
      - journal
    source: |
      prio = to_int(.PRIORITY) ?? 6
      level = if prio <= 0 { "emerg" } else if prio == 1 { "alert" } else if prio == 2 { "crit" } else if prio == 3 { "err" } else if prio == 4 { "warning" } else if prio == 5 { "notice" } else if prio == 6 { "info" } else { "debug" }
      facility = to_int(.SYSLOG_FACILITY) ?? -1
      audit = facility == 4 || facility == 10 || ."_TRANSPORT" == "audit"
      # The systemd unit names a service; for sudo, sshd sessions and
      # systemd itself it is user@N.service, session-N.scope or init.scope,
      # and the syslog identifier says more.
      unit = string(."_SYSTEMD_UNIT") ?? ""
      if unit == "" || starts_with(unit, "user@") || starts_with(unit, "session-") || unit == "init.scope" {
        unit = string(.SYSLOG_IDENTIFIER) ?? string(."_COMM") ?? unit
      }
      # Docker's journald driver: dockerd writes the entry, so _SYSTEMD_UNIT
      # is docker.service; the container name says which service it was.
      container = string(.CONTAINER_NAME) ?? ""
      if container != "" { unit = container }
      if unit == "" { unit = "unknown" }
      message = string(.message) ?? encode_json(.message)
      # One journal entry, for ClickHouse's dedupe (Vector drops __CURSOR
      # from events): boot, monotonic microseconds, and the message.
      entry = (string(."_BOOT_ID") ?? "") + ":" + (string(."__MONOTONIC_TIMESTAMP") ?? "") + ":" + to_string(seahash(message))
      ts = .timestamp
      host = string(.host) ?? "unknown"
      rest = .
      rest = remove!(rest, ["message"])
      rest = remove!(rest, ["timestamp"])
      rest = remove!(rest, ["host"])
      rest = remove!(rest, ["source_type"])
      # Docker driver bookkeeping: per-line counters and the 64-hex id
      # (CONTAINER_ID keeps the short one).
      for_each(["CONTAINER_ID_FULL", "CONTAINER_LOG_EPOCH", "CONTAINER_LOG_ORDINAL", "CONTAINER_PARTIAL_ID", "CONTAINER_PARTIAL_ORDINAL", "CONTAINER_PARTIAL_LAST"]) -> |_i, k| {
        rest = remove!(rest, [k])
      }
      retention = if audit { "audit" } else { "operational" }
      # Lines the syslog relay wrote for a device (ADR-124; answer #18 of
      # 2026-11-09). Their unit is the relay for every one, and their
      # facility and hostname are the sender's claim: a sender that picks
      # facility 4 or 10 must not file its line as audit, and a device's
      # "Failed password" must not count as west's. The relay's own stamps
      # decide instead, from the device's sources.yaml row: UNHEADED_SOURCE
      # is the unit, UNHEADED_SOURCE_HOST the host, UNHEADED_RETENTION the
      # class. Only the relay can write them: _SYSTEMD_UNIT and _TRANSPORT
      # are journald's own, and the relay's own log lines arrive on stdout,
      # so they stay west's. A stamp that is missing or malformed files the
      # line as audit (never shorten evidence) under host and unit unknown.
      if (string(."_SYSTEMD_UNIT") ?? "") == "unheaded-syslog-relay.service" && (string(."_TRANSPORT") ?? "") == "journal" {
        rest.relay_host = host
        unit = string(.UNHEADED_SOURCE) ?? ""
        if !match(unit, r'^[a-z0-9][A-Za-z0-9._/:@-]{0,127}$') { unit = "unknown" }
        host = string(.UNHEADED_SOURCE_HOST) ?? ""
        if !match(host, r'^(west|east|pihole|device:[0-9A-Za-z.:-]{1,64}|unknown)$') { host = "unknown" }
        retention = if (string(.UNHEADED_RETENTION) ?? "") == "operational" { "operational" } else { "audit" }
      }
      . = {
        "timestamp": ts,
        "host": host,
        "source": "journald",
        "unit": unit,
        "level": level,
        "retention": retention,
        "message": message,
        "entry": entry,
        "fields": encode_json(rest)
      }

  # Log-volume and auth-failure SLIs (ADR-100 Phase 3). Lines are counted,
  # never stored for this: the metric carries host, unit, level and a fixed
  # failure kind, not message text. Alerts: monitoring/prometheus/rules/logs.yml.
  journal_volume:
    type: remap
    inputs:
      - journal_rows
    source: |
      unit = string(.unit) ?? "unknown"
      # Transient units (run-u123.service, docker-<64 hex>.scope) would add
      # a series per instance; count them as one.
      if starts_with(unit, "run-") || match(unit, r'[0-9a-f]{12,}') {
        unit = "transient"
      }
      msg = string(.message) ?? ""
      # Fixed patterns only; the message itself never leaves this transform.
      auth = ""
      if match(msg, r'^(Failed (password|publickey|keyboard-interactive/pam) for|Invalid user |Connection closed by invalid user )') {
        auth = "ssh"
      } else if match(msg, r'incorrect password attempts?') {
        auth = "sudo"
      } else if match(msg, r'^pam_unix\([^)]*:auth\): authentication failure') {
        auth = "pam"
      }
      . = {
        "host": string(.host) ?? "unknown",
        "unit": unit,
        "level": string(.level) ?? "info",
        "bytes": strlen(msg),
        "auth": auth
      }

  journal_volume_metrics:
    type: log_to_metric
    inputs:
      - journal_volume
    metrics:
      - type: counter
        field: unit
        namespace: unheaded
        name: log_lines_total
        tags: {host: "{{host}}", unit: "{{unit}}", level: "{{level}}"}
      - type: counter
        field: bytes
        increment_by_value: true
        namespace: unheaded
        name: log_bytes_total
        tags: {host: "{{host}}", unit: "{{unit}}", level: "{{level}}"}

  journal_auth_failures:
    type: filter
    inputs:
      - journal_volume
    condition: '.auth != ""'

  journal_auth_metrics:
    type: log_to_metric
    inputs:
      - journal_auth_failures
    metrics:
      - type: counter
        field: auth
        namespace: unheaded
        name: auth_failures_total
        tags: {host: "{{host}}", unit: "{{unit}}", kind: "{{auth}}"}

  # SSH logins by source (M-203, detection.yml SSHLoginNewSource). Read
  # from the raw journal, not journal_rows: there the unit can come from
  # SYSLOG_IDENTIFIER, which any local user sets with logger(1). Only an
  # sshd running as root counts. Metadata only: the login name (operator
  # accounts), the source address (LAN or P2P today) and the auth method;
  # the line itself never leaves the transform. A name or address that does
  # not look like one is counted as "invalid", so a crafted line cannot mint
  # arbitrary label values.
  journal_ssh:
    type: filter
    inputs:
      - journal
    condition: |
      comm = string(."_COMM") ?? ""
      (comm == "sshd" || comm == "sshd-session") && (string(."_UID") ?? "") == "0" && match(string(.message) ?? "", r'^Accepted [a-z0-9/-]+ for \S+ from \S+ port [0-9]+')

  journal_ssh_accepted:
    type: remap
    inputs:
      - journal_ssh
    drop_on_abort: true
    source: |
      p = parse_regex(string(.message) ?? "", r'^Accepted (?P<method>[a-z0-9/-]+) for (?P<user>\S+) from (?P<src>\S+) port [0-9]+') ?? {}
      if !exists(p.user) { abort }
      user = string(p.user) ?? ""
      if !match(user, r'^[a-z_][a-z0-9_-]{0,31}$') { user = "invalid" }
      src = string(p.src) ?? ""
      if !match(src, r'^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9a-fA-F:.]{2,45})$') { src = "invalid" }
      method = string(p.method) ?? ""
      if !match(method, r'^(publickey|password|keyboard-interactive(/pam)?|hostbased|gssapi-with-mic)$') { method = "other" }
      . = {
        "host": string(.host) ?? "unknown",
        "user": user,
        "src": src,
        "method": method
      }

  journal_ssh_metrics:
    type: log_to_metric
    inputs:
      - journal_ssh_accepted
    metrics:
      - type: counter
        field: user
        namespace: unheaded
        name: ssh_accepted_total
        tags: {host: "{{host}}", user: "{{user}}", src: "{{src}}", method: "{{method}}"}

  # Secrets that a process printed to the journal (an uhk_ API key, a
  # bearer token, a PGPASSWORD) are masked before the row leaves the host
  # (S-LOW-FRUIT Phase 7). Tests: tests/redact.yaml. A doubled dollar sign is
  # a literal one (Vector interpolates environment variables in this file).
  redact_secrets:
    type: remap
    inputs:
      - journal_rows
    source: |
      if is_string(.message) {
        m = string!(.message)
        m = replace(m, r'uhk_[A-Za-z0-9]{16,}', "uhk_[REDACTED]")
        m = replace(m, r'(?i)\b(bearer|token|password|pgpassword)([=: ]+)\S+', "$$1$$2[REDACTED]")
        .message = m
      }

  # What the well_logs sink may carry (the measured week, S-E1-LIVE Step
  # 279): west's own rows only. A row the syslog relay filed for a device
  # (Pi-hole DNS queries, LAN devices) names clients and what they looked
  # up; config/logging/sources.yaml promises those reach ClickHouse and
  # nowhere else, so they stop here. Such a row always carries relay_host
  # in fields (journal_rows above). West only, like the sink: vector-east.yaml
  # has neither. Tests: tests/well.yaml.
  well_rows:
    type: filter
    inputs:
      - redact_secrets
    condition:
      type: vrl
      source: '!contains(string!(.fields), "\"relay_host\":")'

sinks:
  clickhouse:
    type: clickhouse
    inputs:
      - redact_secrets
    endpoint: "http://clickhouse:8123"
    database: "unheaded_logs"
    table: "logs"
    date_time_best_effort: true
    auth:
      strategy: "basic"
      user: "unheaded"
      password: "${CLICKHOUSE_PASSWORD}"   # from compose; no default credential
    # A dead ClickHouse must not lose audit rows or fill the disk
    # (S-LOW-FRUIT Phase 7, MoatGhost: block, never drop, on the audit
    # stream). The disk buffer holds 256 MiB (Vector's floor); when it is
    # full Vector stops reading the journal, journald keeps everything, and
    # Vector catches up once the sink is back. Alerts: rules/logs.yml.
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    request:
      timeout_secs: 10
      retry_max_duration_secs: 60

  # The measured week (S-E1-LIVE Evening 16, Step 279; ADR-117): west's own
  # rows (well_rows above), after the same redaction, also go to
  # cmd/logstore-writer, which inserts them into The Well
  # (unheaded_ops.log_events, 14 days). That copy is derived; ClickHouse
  # above stays the record. So this sink, and this sink only, drops when it
  # cannot keep up: a memory buffer of 5,000 rows, drop_newest, bounded
  # retries, no acknowledgements. A stopped, refusing or silent writer costs
  # rows in the Well copy and nothing else: the other sink still gets every
  # row (scripts/test-vector-config.sh runs this block against a writer that
  # never answers). West only: vector-east.yaml has no such sink. Off
  # switch: delete this block and well_rows, `docker compose up -d vector`.
  well_logs:
    type: http
    inputs:
      - well_rows
    uri: "https://logstore-writer:19140/ingest"
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    auth:
      strategy: "bearer"
      token: "${LOGSTORE_INGEST_TOKEN}"   # from compose; no default credential
    tls:
      ca_file: /etc/vector/tls/ca.pem
    healthcheck:
      enabled: false
    acknowledgements:
      enabled: false
    batch:
      max_events: 500
      max_bytes: 4194304
      timeout_secs: 5
    buffer:
      type: memory
      max_events: 5000
      when_full: drop_newest
    request:
      concurrency: 1
      timeout_secs: 10
      retry_attempts: 3
      retry_max_duration_secs: 10

  # Scraped by monitoring/prometheus as job vector. compose publishes it on
  # the docker0 gateway only (host.docker.internal), not on the LAN.
  prometheus:
    type: prometheus_exporter
    inputs:
      - vector_metrics
      - journal_volume_metrics
      - journal_auth_metrics
      - journal_ssh_metrics
    address: "0.0.0.0:9598"
    # A series not updated within this many seconds is dropped. The default
    # (60) drops a unit that logs less than once a minute, which would read
    # as a counter reset and hide exactly the silence the alerts look for.
    flush_period_secs: 86400
