# Akira targets for the compose stack: the four services on the `data`
# network, by compose DNS name and in-container port. (Akira's built-in
# defaults are for a bare-metal host: localhost and the Doom Range ports.)
targets:
  - {name: wotan,        host: wotan,             port: 18000}
  - {name: timeguru,     host: timeguru,          port: 19000}
  - {name: dashboard,    host: dashboard-backend, port: 20000}
  - {name: kanban,       host: kanban-app,        port: 20001}
# S-IRON-GATE Phase 10 (ADR-034 Phase 7): cert expiry as an exec check,
# hourly, as the hosts run it; a certificate issued short is noticed within
# the hour (ADR-147, Developer D8: every 30 s cost 2,880 interpreter starts a
# day in a 0.10-core container). The image carries the runner and runbook
# (Dockerfile, akira stage); docker-compose.yml mounts each service's
# certificate (never a key) and the CA under /etc/unheaded/tls-watch/.
  - name: cert-expiry
    type: exec
    argv: ["/usr/bin/python3", "-B", "/usr/share/unheaded/scripts/run-runbook.py", "/usr/share/unheaded/runbooks/pki/akira-cert-expiry-check.yaml"]
    interval: 1h
    timeout: 30s
    env: {UNHEADED_TLS_DIR: /etc/unheaded/tls-watch}
