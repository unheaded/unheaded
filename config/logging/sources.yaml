    canary: http-get
    owner: sentinel
    status: gap
    note: "pihole/webserver-log through the relay (imfile Tag=pihole-web, Step 150); admin UI access = audit"
  # The container's journal: imjournal forwards each unit under its own tag,
  # so this row takes every line from the address that no tag row above names.
  - id: pihole/journal
    host: pihole
    kind: syslog-device
    match: 10.10.20.252
    retention: operational
    max_silence: 24h
    canary: "none: container journal; unit lifecycle"
    owner: sentinel
    status: gap
    note: "D3 (Phase 6): rsyslog imjournal -> relay. Was kind lxd-journal (match pihole) until 2026-11-09; the relay is how it ships"
