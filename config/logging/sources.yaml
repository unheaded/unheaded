#
# Every log source that should exist, with how to prove it ships (S-LOG-HARVEST
# Phase 1, inventory taken 2026-11-03 on west, east and the Pi-hole container).
# The static gate (pkg/logsources) fails CI when a unit, compose service or host
# has no entry here; docs/policy/log-sources.md explains the fields.
#
# kind:      journal-unit | journal-container | file | lxd-file | lxd-journal | syslog-device
# match:     unit name, container name, path, or sender IP
# retention: audit | operational (docs/policy/retention-policy-v1-2026-05-06.md: audit logs 90 d
#            online + 1 y archive; operational 90 d; the Pi-hole query DB keeps 91 d itself)
# status:    shipped | gap | blocked:<D#|FND-#> | excluded:<reason>
# canary:    logger | http-get | dns-query | none: <reason>
#
# Privacy (Step 28): pihole/pihole-log and lan/dns-queries name every LAN client
# and every domain it looks up; the nginx access logs carry client IPs. Both are
# personal data under the retention policy. They ship to ClickHouse on west
# (loopback only, one database user) and nowhere else.
#
# Stale lxdbr0 neighbours 10.10.20.66/.128/.234 (2026-10-30 IOC sweep: leases of
# deleted containers) are not sources.

schema: unheaded.logging.sources/v1

sources:
  - id: west/kernel
    host: west
    kind: journal-unit
    match: kernel
    retention: audit
    max_silence: 24h
    canary: "none: the kernel ring is not provoked on purpose"
    owner: architect
    status: "blocked:FND-001"
  - id: west/ssh
    host: west
    kind: journal-unit
    match: ssh.service
    retention: audit
    max_silence: 7d
    canary: "none: logins are human events; the window is the expectation"
    owner: sentinel
    status: "blocked:FND-001"
  - id: west/auditd
    host: west
