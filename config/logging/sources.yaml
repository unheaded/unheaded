    note: "D3: rsyslog imfile -> relay at 10.10.20.1 (Phase 6). PERSONAL DATA: every LAN client and every name it looks up"
  - id: pihole/ftl-log
    host: pihole
    kind: lxd-file
    match: /var/log/pihole/FTL.log
    retention: operational
    max_silence: 24h
    canary: "none: FTL events"
    owner: sentinel
