syntax = "proto3";

package chat;

option go_package = "github.com/unheaded/chat/proto;chatpb";

import "google/protobuf/timestamp.proto";

service TopicStream {
  // Server-side streaming: subscribe to topics matching a pattern
  rpc StreamTopics(TopicStreamRequest) returns (stream TopicEvent);

  // Publish a message to a topic
  rpc PublishTopic(TopicPublishRequest) returns (TopicPublishResponse);

  // Health/keepalive
  rpc TopicPing(TopicPingRequest) returns (TopicPongResponse);
}

message TopicStreamRequest {
  string topic_pattern = 1;
  string subscriber_id = 2;
  string display_name = 3;
  int64 since_seq = 4;
  string node_id = 5;
  map<string, string> metadata = 6;
}

message TopicEvent {
  string message_id = 1;
  string topic = 2;
  string sender_id = 3;
  int64 seq = 4;
  google.protobuf.Timestamp created_at = 5;
  bytes payload = 6;
  TopicEventType type = 7;
  string node_id = 8;
  // ML-DSA-65 signature fields (ADR-043 hard condition #2)
  bytes signature = 9;
  bytes public_key = 10;
  string algorithm = 11;
}

enum TopicEventType {
  TOPIC_MESSAGE_PUBLISHED = 0;
  TOPIC_MESSAGE_DELETED = 1;
  TOPIC_SUBSCRIPTION_ADDED = 2;
}

message TopicPublishRequest {
  string topic = 1;
  string sender_id = 2;
  bytes payload = 3;
  map<string, string> metadata = 4;
  // ML-DSA-65 signature fields (ADR-043 hard condition #2)
  bytes signature = 5;
  bytes public_key = 6;
  string algorithm = 7;
}

message TopicPublishResponse {
  string message_id = 1;
  int64 seq = 2;
  google.protobuf.Timestamp created_at = 3;
}

message TopicPingRequest {
  google.protobuf.Timestamp timestamp = 1;
  string node_id = 2;
}

message TopicPongResponse {
  google.protobuf.Timestamp timestamp = 1;
  string status = 2;
  int64 active_streams = 3;
  int64 total_topics = 4;
}
