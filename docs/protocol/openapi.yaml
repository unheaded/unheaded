openapi: 3.0.3
info:
  title: Unheaded Kingdom API
  description: |
    Consolidated API specification for all Unheaded Kingdom microservices.

    The Unheaded platform provides production-ready infrastructure automation
    with eBPF-based observability, immutable NixOS infrastructure, and a
    service mesh built on the Wotan message bus.

    Each service runs on its own port and exposes the common endpoints
    (/health, /ready, /metrics) plus service-specific REST API endpoints.
  version: 2.0.0
  contact:
    name: Unheaded
    email: stevie@bellis.tech
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html

# Ports are the Doom Range assignments from pkg/ports/ports.go, which is the
# single source of truth. The pre-Port-Authority 808x ports that were here
# listed dead endpoints for every service, and gave dashboard-backend and
# kanban-app the same one.
servers:
  - url: http://localhost:19000
    description: Timeguru (timeline tracking)
  - url: http://localhost:20000
    description: Dashboard Backend (metrics aggregation)
  - url: http://localhost:20001
    description: Kanban App (project board)

tags:
  - name: common
    description: Common endpoints shared by all services (/health, /ready, /metrics)
  - name: timeguru
    description: |
      Timeline tracking service (port 8082). Manages the project timeline,
      phases, milestones, and provides real-time updates via SSE. Supports
      JSON, YAML, and Markdown output formats.
  - name: dashboard-backend
    description: |
      Dashboard backend service (port 8080). Aggregates metrics, health
      status, events, traces, and packet flows from all Kingdom services.
      Provides REST API and WebSocket streaming.
  - name: kanban-app
    description: |
      Kanban application service (port 8080). Serves the project Kanban
      board with task CRUD operations, timeline integration, and real-time
      updates via SSE/WebSocket.
  - name: shield
    description: |
      Shield eBPF status and control service. Manages ingress/egress BPF programs,
      status monitoring, and dynamic program reloading for kernel-space packet processing.
  - name: anamnesis
    description: |
      Anamnesis event observability service. Provides access to protocol-level events,
      ring buffer data, flow statistics, and packet telemetry for network analysis.
  - name: kingdom
    description: |
      Kingdom Mode state management service. Provides state machine transitions,
      health checks, and lifecycle management for Kingdom Mode deployment.

paths:
  # ===========================================================================
  # COMMON ENDPOINTS (all services)
  # ===========================================================================
  /health:
    get:
      summary: Health check
      description: |
        Returns the health status of the service. All services expose this
        endpoint. Returns 200 if the service is running.
      tags:
        - common
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    status: healthy
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ready:
    get:
      summary: Readiness check
      description: |
        Returns whether the service is ready to accept traffic. Returns 200
        when all internal checks pass, 503 otherwise. Used by load balancers
        and orchestration systems.
      tags:
        - common
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /metrics:
    get:
      summary: Prometheus metrics
      description: |
        Returns Prometheus-compatible metrics for the service. Each service
        exposes its own set of counters, gauges, and histograms.
      tags:
        - common
      responses:
        "200":
          description: Prometheus metrics in text exposition format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP service_http_requests_total Total HTTP requests
                  # TYPE service_http_requests_total counter
                  service_http_requests_total 42

  # ===========================================================================
  # TIMEGURU ENDPOINTS (port 8082)
  # ===========================================================================
  /timeline:
    get:
      summary: Get timeline (with format negotiation)
      description: |
        Returns the project timeline. Supports multiple output formats via
        the `format` query parameter or the `Accept` header. Also available
        at `/api/v1/timeline`.
      tags:
        - timeguru
      parameters:
        - name: format
          in: query
          required: false
          description: |
            Output format. Overrides the Accept header if provided.
          schema:
            type: string
            enum: [json, yaml, yml, markdown, md]
            default: json
        - name: Accept
          in: header
          required: false
          description: |
            Content negotiation. Supported: application/json, application/yaml,
            text/yaml, text/markdown.
          schema:
            type: string
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
            application/yaml:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
            text/markdown:
              schema:
                type: string
        "404":
          description: Timeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeguruErrorResponse"

  /api/v1/timeline:
    get:
      summary: Get timeline (API v1)
      description: |
        API v1 endpoint for timeline data. Identical to `/timeline` with
        full format negotiation support.
      tags:
        - timeguru
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, yaml, yml, markdown, md]
            default: json
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "404":
          description: Timeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeguruErrorResponse"

  /api/v1/timeline/tasks:
    get:
      summary: Get timeline as Kanban tasks
      description: |
        Transforms timeline milestones and phases into Kanban-friendly task
        format for the frontend board. Each milestone becomes a task card,
        and sub-tasks are created for milestone tasks.
      tags:
        - timeguru
      responses:
        "200":
          description: Kanban tasks derived from the timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksResponse"
        "404":
          description: Timeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeguruErrorResponse"

  /api/v1/timeline/stream:
    get:
      summary: Timeline SSE stream
      description: |
        Server-Sent Events endpoint for real-time timeline updates. Sends
        initial tasks on connect, then polls for changes every 5 seconds.
        Heartbeat sent every 30 seconds.

        Event types:
        - `connected` - Initial connection confirmation
        - `tasks` - Full task list on connect
        - `update` - Updated task list when timeline changes
        - `heartbeat` - Keep-alive ping
      tags:
        - timeguru
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: connected
                  data: {"message":"Connected to timeline stream","service":"timeguru"}

                  event: tasks
                  data: {"tasks":[...],"total_count":5}

  /milestones:
    get:
      summary: Get all milestones
      description: Returns all milestones from the current timeline. Also available at `/api/v1/milestones`.
      tags:
        - timeguru
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestonesResponse"
        "404":
          description: Timeline not found

  /api/v1/milestones:
    get:
      summary: Get all milestones (API v1)
      tags:
        - timeguru
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestonesResponse"

  /milestones/{id}/update:
    post:
      summary: Update milestone
      description: |
        Updates a milestone's progress and status. Also available at
        `/api/v1/milestones/{id}/update`.
      tags:
        - timeguru
      parameters:
        - name: id
          in: path
          required: true
          description: Milestone ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMilestoneRequest"
      responses:
        "200":
          description: Milestone updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestone:
                    $ref: "#/components/schemas/Milestone"
                  message:
                    type: string
                    example: milestone updated successfully
        "400":
          description: Invalid progress or status
        "404":
          description: Milestone not found

  # ===========================================================================
  # DASHBOARD BACKEND ENDPOINTS (port 8080)
  # ===========================================================================
  /api/v1/metrics:
    get:
      summary: Get aggregated metrics
      description: |
        Returns aggregated metrics scraped from all Kingdom services.
        The dashboard backend periodically scrapes /metrics from each service.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Aggregated metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/metrics/query:
    post:
      summary: Query specific metrics
      description: |
        Queries metrics by name, labels, and time range. Supports both
        RFC3339 timestamps and Go duration strings (e.g., "1h", "30m").
      tags:
        - dashboard-backend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricsQueryRequest"
      responses:
        "200":
          description: Matching metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/v1/services:
    get:
      summary: List service statuses
      description: |
        Returns the health and metrics status of all monitored Kingdom
        services with uptime percentages and latency data.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Service status list
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceStatus"
                  total:
                    type: integer
                  healthy:
                    type: integer
                  degraded:
                    type: integer
                  unhealthy:
                    type: integer
                  overall_status:
                    type: string

  /api/v1/services/{name}:
    get:
      summary: Get service details
      description: Returns detailed health and metrics information for a specific service.
      tags:
        - dashboard-backend
      parameters:
        - name: name
          in: path
          required: true
          description: Service name
          schema:
            type: string
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  health:
                    type: object
                  metrics:
                    type: object
        "404":
          description: Service not found

  /api/v1/events:
    get:
      summary: Get recent events
      description: |
        Returns recent events from all Kingdom services, with optional
        filtering by type, severity, and source.
      tags:
        - dashboard-backend
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/v1/events/summary:
    get:
      summary: Get event summary
      description: Returns an aggregated summary of events by type and severity.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Event summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/health:
    get:
      summary: System health overview
      description: |
        Returns the overall system health including per-service health
        status, counts of healthy/degraded/unhealthy services.
      tags:
        - dashboard-backend
        - kanban-app
      responses:
        "200":
          description: System health overview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/health/{name}:
    get:
      summary: Service health details
      description: |
        Returns detailed health information for a specific service
        including health history from the last hour.
      tags:
        - dashboard-backend
      parameters:
        - name: name
          in: path
          required: true
          description: Service name
          schema:
            type: string
      responses:
        "200":
          description: Service health with history
          content:
            application/json:
              schema:
                type: object
                properties:
                  health:
                    type: object
                  history:
                    type: array
                    items:
                      type: object
        "404":
          description: Service not found

  /api/v1/flows:
    get:
      summary: Get packet flow info
      description: |
        Returns information about the packet flow generator and how to
        connect to the real-time WebSocket stream.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Packet flow status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: active
                  ws_endpoint:
                    type: string
                    example: /ws
                  description:
                    type: string
                  flow_rate_ms:
                    type: integer

  /api/v1/traces:
    get:
      summary: Query traces
      description: |
        Queries distributed trace data. Requires the trace collector to
        be connected. Returns empty results if trace collector is not
        available.
      tags:
        - dashboard-backend
      parameters:
        - name: service
          in: query
          required: false
          schema:
            type: string
        - name: start_time
          in: query
          required: false
          description: RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: false
          description: RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: min_duration
          in: query
          required: false
          description: Go duration string (e.g., "100ms", "1s")
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: has_error
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Trace query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceQueryResult"

  /api/v1/traces/{id}:
    get:
      summary: Get trace by ID
      tags:
        - dashboard-backend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trace details
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Trace not found
        "503":
          description: Trace collector not available

  /api/v1/aggregated:
    get:
      summary: Get all aggregated data
      description: |
        Returns a combined view of metrics, health, events, and stream
        status from all sources.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Aggregated data from all sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  metrics:
                    type: object
                  health:
                    type: object
                  events:
                    type: object
                  stream:
                    type: object

  /api/v1/aggregated/metrics:
    get:
      summary: Get aggregated metrics
      description: Returns aggregated metrics from scraper and internal aggregator.
      tags:
        - dashboard-backend
      parameters:
        - name: since
          in: query
          required: false
          description: Go duration string or RFC3339 timestamp
          schema:
            type: string
      responses:
        "200":
          description: Aggregated metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/aggregated/health:
    get:
      summary: Get aggregated health
      description: Returns aggregated health from internal monitor and external health aggregator.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Aggregated health data
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  internal:
                    type: object
                  aggregated_health:
                    type: object
                  overall:
                    type: string

  /api/v1/stream:
    get:
      summary: Real-time metrics stream (WebSocket)
      description: |
        WebSocket endpoint for real-time streaming of metrics, health
        updates, traces, events, and packet flows. Supports filtering
        by message type, service name, and severity level via query
        parameters.
      tags:
        - dashboard-backend
        - kanban-app
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated message types to filter (metrics, health, trace, event, flow)
          schema:
            type: string
        - name: services
          in: query
          required: false
          description: Comma-separated service names to filter
          schema:
            type: string
        - name: min_level
          in: query
          required: false
          description: Minimum severity level (info, warning, error, critical)
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade

  /ws:
    get:
      summary: WebSocket for real-time updates
      description: |
        WebSocket endpoint for real-time data streaming. Broadcasts
        packet flows, health updates, and events to all connected clients.
      tags:
        - dashboard-backend
        - kanban-app
      responses:
        "101":
          description: WebSocket upgrade

  /ws/metrics:
    get:
      summary: WebSocket for metrics streaming
      description: Dedicated WebSocket endpoint for metrics data streaming.
      tags:
        - dashboard-backend
      responses:
        "101":
          description: WebSocket upgrade

  # ===========================================================================
  # KANBAN APP ENDPOINTS (port 8080)
  # ===========================================================================
  /api/v1/tasks:
    get:
      summary: Get all tasks
      description: Returns all kanban tasks with count.
      tags:
        - kanban-app
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/KanbanTask"
                  count:
                    type: integer
    post:
      summary: Create a task
      description: Creates a new kanban task via the Wotan-integrated TaskManager.
      tags:
        - kanban-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanTask"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/KanbanTask"
        "400":
          description: Validation error
        "409":
          description: Task already exists
    put:
      summary: Update a task
      description: Updates an existing kanban task.
      tags:
        - kanban-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanTask"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/KanbanTask"
        "400":
          description: Validation error
        "404":
          description: Task not found
    delete:
      summary: Delete a task
      description: Deletes a kanban task by ID (passed as query parameter).
      tags:
        - kanban-app
      parameters:
        - name: id
          in: query
          required: true
          description: Task ID to delete
          schema:
            type: string
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  task_id:
                    type: string
        "400":
          description: Missing task ID
        "404":
          description: Task not found

  /api/v1/tasks/{id}:
    get:
      summary: Get task by ID
      tags:
        - kanban-app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanTask"
        "404":
          description: Task not found
    put:
      summary: Update task by ID
      tags:
        - kanban-app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanTask"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/KanbanTask"
        "404":
          description: Task not found
    delete:
      summary: Delete task by ID
      tags:
        - kanban-app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  task_id:
                    type: string
        "404":
          description: Task not found

  /api/v1/timeline:
    get:
      summary: Get kanban timeline
      description: |
        Returns the current timeline data from Timeguru via the
        Wotan-integrated TaskManager.
      tags:
        - kanban-app
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                type: object
                properties:
                  timeline:
                    $ref: "#/components/schemas/Timeline"
        "503":
          description: Timeline not available (Wotan not connected)

  /api/v1/timeline/cards:
    get:
      summary: Get timeline as kanban cards
      description: |
        Returns timeline data converted to kanban task cards. Falls back to
        regular tasks if no timeline data is available.
      tags:
        - kanban-app
      responses:
        "200":
          description: Timeline cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/KanbanTask"
                  count:
                    type: integer
                  source:
                    type: string
                    example: timeline

  # ===========================================================================
  # SHIELD eBPF STATUS AND CONTROL ENDPOINTS
  # ===========================================================================
  /api/v1/shield/status:
    get:
      summary: Get Shield eBPF program status
      description: Returns the current status of all loaded eBPF programs (XDP, TC, kprobes)
      tags:
        - shield
      responses:
        "200":
          description: Shield status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [operational, degraded, offline]
                  programs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShieldProgramStatus"
                  last_update:
                    type: string
                    format: date-time

  /api/v1/shield/programs:
    get:
      summary: List all Shield eBPF programs
      description: Returns detailed information about all running BPF programs
      tags:
        - shield
      responses:
        "200":
          description: BPF programs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShieldProgram"

  /api/v1/shield/reload:
    post:
      summary: Reload Shield eBPF programs
      description: Triggers a reload of eBPF programs with zero-downtime hot-swap
      tags:
        - shield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                programs:
                  type: array
                  items:
                    type: string
                  description: List of program names to reload (empty = all)
      responses:
        "200":
          description: Reload initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: reloading
                  request_id:
                    type: string

  # ===========================================================================
  # ANAMNESIS EVENT ENDPOINTS
  # ===========================================================================
  /api/v1/anamnesis/events:
    get:
      summary: Get Anamnesis events
      description: Query ring buffer events with optional filtering
      tags:
        - anamnesis
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: event_type
          in: query
          schema:
            type: string
            description: Filter by event type (BIRTH, COMPUTED, DEATH, ANOMALY, CHAOS)
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnamnesisEvent"
                  total_count:
                    type: integer

  /api/v1/anamnesis/events/{flow_label}:
    get:
      summary: Get events for a specific flow
      description: Query all events associated with a specific flow label
      tags:
        - anamnesis
      parameters:
        - name: flow_label
          in: path
          required: true
          schema:
            type: string
            format: hex
            description: 128-bit flow label in hex format
      responses:
        "200":
          description: Flow events
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow_label:
                    type: string
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnamnesisEvent"
                  event_count:
                    type: integer

  /api/v1/anamnesis/stats:
    get:
      summary: Get Anamnesis event statistics
      description: Returns event counts, rates, and anomaly statistics
      tags:
        - anamnesis
      responses:
        "200":
          description: Event statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  events_per_second:
                    type: number
                  event_breakdown:
                    type: object
                    additionalProperties:
                      type: integer
                  anomalies_detected:
                    type: integer
                  last_update:
                    type: string
                    format: date-time

  # ===========================================================================
  # KINGDOM MODE ENDPOINTS
  # ===========================================================================
  /api/v1/kingdom/state:
    get:
      summary: Get Kingdom Mode state
      description: Returns current Kingdom Mode deployment state machine status
      tags:
        - kingdom
      responses:
        "200":
          description: Kingdom state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum: [IDLE, ACTIVE, CLOSING, CLOSED]
                  deployment_ring:
                    type: string
                  transition_count:
                    type: integer
                  last_transition:
                    type: string
                    format: date-time

  /api/v1/kingdom/state/transition:
    post:
      summary: Trigger Kingdom Mode state transition
      description: Initiates a state machine transition with validation
      tags:
        - kingdom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_state
              properties:
                target_state:
                  type: string
                  enum: [IDLE, ACTIVE, CLOSING, CLOSED]
                reason:
                  type: string
      responses:
        "200":
          description: Transition initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  previous_state:
                    type: string
                  target_state:
                    type: string
                  transition_id:
                    type: string
        "400":
          description: Invalid state transition

  /api/v1/kingdom/health:
    get:
      summary: Get Kingdom Mode health
      description: Returns health metrics for Kingdom Mode deployment
      tags:
        - kingdom
      responses:
        "200":
          description: Kingdom health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, critical]
                  ring_buffer_usage:
                    type: number
                    format: percentage
                  active_flows:
                    type: integer
                  error_rate:
                    type: number
                    format: percentage

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  schemas:
    # -------------------------------------------------------------------------
    # Common schemas
    # -------------------------------------------------------------------------
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ready
        ready:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string

    # -------------------------------------------------------------------------
    # Timeguru schemas
    # -------------------------------------------------------------------------
    Timeline:
      type: object
      properties:
        version:
          type: string
        last_updated:
          type: string
          format: date-time
        status:
          type: string
        vision:
          type: string
        phases:
          type: array
          items:
            $ref: "#/components/schemas/Phase"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        metadata:
          type: object
          additionalProperties:
            type: string

    Phase:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [planned, in_progress, completed]
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        progress:
          type: integer
          minimum: 0
          maximum: 100
        description:
          type: string
        milestones:
          type: array
          items:
            type: string

    Milestone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, blocked]
        eta:
          type: string
          format: date-time
        progress:
          type: integer
          minimum: 0
          maximum: 100
        owner:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        description:
          type: string
        tasks:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string

    TimelineResponse:
      type: object
      properties:
        timeline:
          $ref: "#/components/schemas/Timeline"

    MilestonesResponse:
      type: object
      properties:
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"

    UpdateMilestoneRequest:
      type: object
      required:
        - progress
        - status
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [pending, in_progress, completed, blocked]

    KanbanTask:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          maxLength: 200
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        status:
          type: string
          enum: [todo, in-progress, done]
        type:
          type: string
          enum: [milestone, feature, task, bug, tech-debt, epic]
        owner:
          type: string
        due_date:
          type: string
          format: date
        progress:
          type: integer
          minimum: 0
          maximum: 100
        phase:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/KanbanTask"
        total_count:
          type: integer

    TimeguruErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: string

    # -------------------------------------------------------------------------
    # Dashboard Backend schemas
    # -------------------------------------------------------------------------
    MetricsQueryRequest:
      type: object
      properties:
        name:
          type: string
          description: Metric name to query
        labels:
          type: object
          additionalProperties:
            type: string
          description: Label key-value pairs to filter by
        since:
          type: string
          description: RFC3339 timestamp for start of range
        since_duration:
          type: string
          description: Go duration string (e.g., "1h", "30m")

    TraceQueryResult:
      type: object
      properties:
        traces:
          type: array
          items:
            type: object
        total:
          type: integer
        has_more:
          type: boolean
        message:
          type: string
          description: Status message when trace collector is not available

    ServiceStatus:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        last_check:
          type: string
          format: date-time
        uptime_percent:
          type: number
          format: double
        consecutive_successes:
          type: integer
        consecutive_failures:
          type: integer
        average_latency_ms:
          type: integer
        metrics_status:
          type: string
        metrics_count:
          type: integer

    StreamMessage:
      type: object
      properties:
        type:
          type: string
          enum: [metrics, health, trace, event, flow]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: object

    # Shield eBPF Schemas
    ShieldProgramStatus:
      type: object
      properties:
        name:
          type: string
          description: Program name (xdp_ingress, tc_egress, kprobe_lifecycle)
        status:
          type: string
          enum: [loaded, unloaded, error]
        load_time:
          type: string
          format: date-time
        packet_count:
          type: integer
        error_count:
          type: integer
        attached_to:
          type: string
          description: Kernel hook (xdp, tc, kprobe)

    ShieldProgram:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [xdp, tc, kprobe]
        status:
          type: string
          enum: [active, inactive]
        size_bytes:
          type: integer
        load_time:
          type: string
          format: date-time
        maps:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              entries:
                type: integer
        metrics:
          type: object
          additionalProperties:
            type: integer

    # Anamnesis Event Schemas
    AnamnesisEvent:
      type: object
      properties:
        timestamp_ns:
          type: integer
          format: uint64
          description: Nanosecond timestamp
        event_type:
          type: string
          enum: [BIRTH, COMPUTED, DEATH, ANOMALY, CHAOS, ROLLBACK]
        flow_label:
          type: string
          format: hex
        hop_index:
          type: integer
        input_monad:
          type: string
          format: hex
          description: 20-byte Monad before hop
        output_monad:
          type: string
          format: hex
          description: 20-byte Monad after hop
        trace_id:
          type: string
          format: hex
        wotan_addr:
          type: string
          format: hex
          description: Wotan memory address accessed
        wotan_value:
          type: string
          format: hex
          description: Value read/written

    # Kingdom Mode Schemas
    KingdomState:
      type: object
      properties:
        state:
          type: string
          enum: [IDLE, ACTIVE, CLOSING, CLOSED]
        state_code:
          type: integer
          minimum: 0
          maximum: 3
        transition_history:
          type: array
          items:
            type: object
            properties:
              from_state:
                type: string
              to_state:
                type: string
              timestamp:
                type: string
                format: date-time
              reason:
                type: string
