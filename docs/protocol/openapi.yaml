openapi: 3.0.3
info:
  title: Unheaded Kingdom API
  description: |
    Consolidated API specification for all Unheaded Kingdom microservices.

    The Unheaded platform provides production-ready infrastructure automation
    with eBPF-based observability, immutable NixOS infrastructure, and a
    service mesh built on the Wotan message bus.

    Each service runs on its own port and exposes the common endpoints
    (/health, /ready, /metrics) plus service-specific REST API endpoints.
  version: 2.0.0
  contact:
    name: Unheaded
    email: stevie@bellis.tech
  license:
    name: Proprietary

servers:
  - url: http://localhost:8082
    description: Timeguru (timeline tracking)
  - url: http://localhost:8083
    description: Captain (strategy service)
  - url: http://localhost:8084
    description: Architect (design service)
  - url: http://localhost:8085
    description: Micromanager (execution service)
  - url: http://localhost:8086
    description: Monad (state management)
  - url: http://localhost:8087
    description: Sophia (knowledge graph)
  - url: http://localhost:8080
    description: Dashboard Backend (metrics aggregation)
  - url: http://localhost:8080
    description: Kanban App (project board)

tags:
  - name: common
    description: Common endpoints shared by all services (/health, /ready, /metrics)
  - name: timeguru
    description: |
      Timeline tracking service (port 8082). Manages the project timeline,
      phases, milestones, and provides real-time updates via SSE. Supports
      JSON, YAML, and Markdown output formats.
  - name: captain
    description: |
      Strategy and leadership service (port 8083). Tracks executive decisions,
      project vision, and strategic planning.
  - name: architect
    description: |
      Infrastructure and design service (port 8084). Maintains infrastructure
      topology, network design, and architecture decision records (ADRs).
  - name: micromanager
    description: |
      Execution and task management service (port 8085). Manages sprint
      backlogs, task creation, updates, and sprint status tracking.
  - name: monad
    description: |
      Unified state management service (port 8086). Provides functional
      composition, operation execution (query/mutation/effect), and
      transactional consistency.
  - name: sophia
    description: |
      Knowledge graph and wisdom service (port 8087). Manages knowledge
      as subject-predicate-object triples, generates insights, and provides
      decision recommendations.
  - name: dashboard-backend
    description: |
      Dashboard backend service (port 8080). Aggregates metrics, health
      status, events, traces, and packet flows from all Kingdom services.
      Provides REST API and WebSocket streaming.
  - name: kanban-app
    description: |
      Kanban application service (port 8080). Serves the project Kanban
      board with task CRUD operations, timeline integration, and real-time
      updates via SSE/WebSocket.
  - name: shield
    description: |
      Shield eBPF status and control service. Manages ingress/egress BPF programs,
      status monitoring, and dynamic program reloading for kernel-space packet processing.
  - name: anamnesis
    description: |
      Anamnesis event observability service. Provides access to protocol-level events,
      ring buffer data, flow statistics, and packet telemetry for network analysis.
  - name: kingdom
    description: |
      Kingdom Mode state management service. Provides state machine transitions,
      health checks, and lifecycle management for Kingdom Mode deployment.

paths:
  # ===========================================================================
  # COMMON ENDPOINTS (all services)
  # ===========================================================================
  /health:
    get:
      summary: Health check
      description: |
        Returns the health status of the service. All services expose this
        endpoint. Returns 200 if the service is running.
      tags:
        - common
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    status: healthy
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ready:
    get:
      summary: Readiness check
      description: |
        Returns whether the service is ready to accept traffic. Returns 200
        when all internal checks pass, 503 otherwise. Used by load balancers
        and orchestration systems.
      tags:
        - common
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /metrics:
    get:
      summary: Prometheus metrics
      description: |
        Returns Prometheus-compatible metrics for the service. Each service
        exposes its own set of counters, gauges, and histograms.
      tags:
        - common
      responses:
        "200":
          description: Prometheus metrics in text exposition format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP service_http_requests_total Total HTTP requests
                  # TYPE service_http_requests_total counter
                  service_http_requests_total 42

  # ===========================================================================
  # TIMEGURU ENDPOINTS (port 8082)
  # ===========================================================================
  /timeline:
    get:
      summary: Get timeline (with format negotiation)
      description: |
        Returns the project timeline. Supports multiple output formats via
        the `format` query parameter or the `Accept` header. Also available
        at `/api/v1/timeline`.
      tags:
        - timeguru
      parameters:
        - name: format
          in: query
          required: false
          description: |
            Output format. Overrides the Accept header if provided.
          schema:
            type: string
            enum: [json, yaml, yml, markdown, md]
            default: json
        - name: Accept
          in: header
          required: false
          description: |
            Content negotiation. Supported: application/json, application/yaml,
            text/yaml, text/markdown.
          schema:
            type: string
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
            application/yaml:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
            text/markdown:
              schema:
                type: string
        "404":
          description: Timeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeguruErrorResponse"

  /api/v1/timeline:
    get:
      summary: Get timeline (API v1)
      description: |
        API v1 endpoint for timeline data. Identical to `/timeline` with
        full format negotiation support.
      tags:
        - timeguru
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, yaml, yml, markdown, md]
            default: json
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "404":
          description: Timeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeguruErrorResponse"

  /api/v1/timeline/tasks:
    get:
      summary: Get timeline as Kanban tasks
      description: |
        Transforms timeline milestones and phases into Kanban-friendly task
        format for the frontend board. Each milestone becomes a task card,
        and sub-tasks are created for milestone tasks.
      tags:
        - timeguru
      responses:
        "200":
          description: Kanban tasks derived from the timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksResponse"
        "404":
          description: Timeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeguruErrorResponse"

  /api/v1/timeline/stream:
    get:
      summary: Timeline SSE stream
      description: |
        Server-Sent Events endpoint for real-time timeline updates. Sends
        initial tasks on connect, then polls for changes every 5 seconds.
        Heartbeat sent every 30 seconds.

        Event types:
        - `connected` - Initial connection confirmation
        - `tasks` - Full task list on connect
        - `update` - Updated task list when timeline changes
        - `heartbeat` - Keep-alive ping
      tags:
        - timeguru
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: connected
                  data: {"message":"Connected to timeline stream","service":"timeguru"}

                  event: tasks
                  data: {"tasks":[...],"total_count":5}

  /milestones:
    get:
      summary: Get all milestones
      description: Returns all milestones from the current timeline. Also available at `/api/v1/milestones`.
      tags:
        - timeguru
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestonesResponse"
        "404":
          description: Timeline not found

  /api/v1/milestones:
    get:
      summary: Get all milestones (API v1)
      tags:
        - timeguru
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestonesResponse"

  /milestones/{id}/update:
    post:
      summary: Update milestone
      description: |
        Updates a milestone's progress and status. Also available at
        `/api/v1/milestones/{id}/update`.
      tags:
        - timeguru
      parameters:
        - name: id
          in: path
          required: true
          description: Milestone ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMilestoneRequest"
      responses:
        "200":
          description: Milestone updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestone:
                    $ref: "#/components/schemas/Milestone"
                  message:
                    type: string
                    example: milestone updated successfully
        "400":
          description: Invalid progress or status
        "404":
          description: Milestone not found

  # ===========================================================================
  # CAPTAIN ENDPOINTS (port 8083)
  # ===========================================================================
  /api/v1/vision:
    get:
      summary: Get project vision
      description: Returns the current project vision statement, title, and goals.
      tags:
        - captain
      responses:
        "200":
          description: Vision data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptainResponseEnvelope"
              example:
                success: true
                data:
                  title: "Production-ready infrastructure in hours, not months"
                  statement: "Unheaded delivers the complete suit of armor for modern SaaS applications"
                  goals:
                    - "eBPF observability"
                    - "Immutable infrastructure"
                  updated_at: "2026-02-03T12:00:00Z"
        "500":
          description: Internal error

  /api/v1/strategy:
    get:
      summary: Get strategic plan
      description: Returns the current strategic execution plan with phases and timelines.
      tags:
        - captain
      responses:
        "200":
          description: Strategy data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptainResponseEnvelope"
        "500":
          description: Internal error

  /api/v1/decisions:
    get:
      summary: List decisions
      description: Returns a paginated list of strategic decisions.
      tags:
        - captain
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptainResponseEnvelope"
    post:
      summary: Create a decision
      description: Records a new strategic executive decision.
      tags:
        - captain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptainDecision"
      responses:
        "201":
          description: Decision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptainResponseEnvelope"
        "400":
          description: Validation error
        "415":
          description: Content-Type must be application/json

  /api/v1/decisions/{id}:
    get:
      summary: Get a specific decision
      tags:
        - captain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Decision details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptainResponseEnvelope"
        "404":
          description: Decision not found
    patch:
      summary: Update decision status
      description: Updates the status of an existing decision (pending, approved, rejected, archived).
      tags:
        - captain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, approved, rejected, archived]
      responses:
        "200":
          description: Decision updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptainResponseEnvelope"
        "400":
          description: Validation error

  # ===========================================================================
  # ARCHITECT ENDPOINTS (port 8084)
  # ===========================================================================
  /infrastructure:
    get:
      summary: Get infrastructure state
      description: |
        Returns the complete infrastructure state including all registered
        services and architecture decisions.
      tags:
        - architect
      responses:
        "200":
          description: Infrastructure state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectSuccessResponse"
        "500":
          description: Infrastructure state not initialized

  /infrastructure/services:
    post:
      summary: Add infrastructure service
      description: Registers a new service in the infrastructure topology.
      tags:
        - architect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchitectService"
      responses:
        "201":
          description: Service added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectSuccessResponse"
        "400":
          description: Validation error
        "415":
          description: Content-Type must be application/json

  /network:
    get:
      summary: Get network topology
      description: Returns the complete network topology including all nodes.
      tags:
        - architect
      responses:
        "200":
          description: Network topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectSuccessResponse"
        "500":
          description: Network state not initialized

  /network/nodes:
    post:
      summary: Add network node
      description: Adds a new node to the network topology.
      tags:
        - architect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkNode"
      responses:
        "201":
          description: Node added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectSuccessResponse"
        "400":
          description: Validation error
        "415":
          description: Content-Type must be application/json

  /design:
    get:
      summary: Get design decisions
      description: Returns all recorded architecture decision records (ADRs).
      tags:
        - architect
      responses:
        "200":
          description: List of architecture decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectSuccessResponse"
    post:
      summary: Log design decision
      description: Records a new architecture decision.
      tags:
        - architect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchitectureDecision"
      responses:
        "201":
          description: Decision logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectSuccessResponse"
        "400":
          description: Validation error
        "415":
          description: Content-Type must be application/json

  # ===========================================================================
  # MICROMANAGER ENDPOINTS (port 8085)
  # ===========================================================================
  /api/v1/backlog:
    get:
      summary: Get sprint backlog
      description: Returns all tasks in the sprint backlog.
      tags:
        - micromanager
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/MicromanagerTaskResponse"
                  count:
                    type: integer
                  status:
                    type: string
                    example: success

  /api/v1/tasks:
    post:
      summary: Create task
      description: Creates a new execution task in the sprint backlog.
      tags:
        - micromanager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicromanagerTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicromanagerTaskResponse"
        "400":
          description: Validation error
        "415":
          description: Content-Type must be application/json

  /api/v1/tasks/{id}:
    put:
      summary: Update task
      description: Updates an existing task's properties (title, status, priority, description, assignee).
      tags:
        - micromanager
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                status:
                  type: string
                  enum: [pending, in_progress, completed, blocked]
                priority:
                  type: integer
                  minimum: 1
                  maximum: 5
                description:
                  type: string
                assignee:
                  type: string
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicromanagerTaskResponse"
        "400":
          description: Validation error
        "404":
          description: Task not found

  /api/v1/sprint/status:
    get:
      summary: Get sprint status
      description: Returns a summary of the current sprint with task counts by status.
      tags:
        - micromanager
      responses:
        "200":
          description: Sprint status summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
                  in_progress:
                    type: integer
                  completed:
                    type: integer
                  blocked:
                    type: integer
                  total:
                    type: integer
                  status:
                    type: string
                    example: success

  # ===========================================================================
  # MONAD ENDPOINTS (port 8086)
  # ===========================================================================
  /api/v1/operations:
    get:
      summary: List recent operations
      description: Returns a list of recent operations sorted by start time (most recent first).
      tags:
        - monad
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: List of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonadResponseEnvelope"
    post:
      summary: Execute an operation
      description: |
        Executes a single operation. The operation type determines the handler:
        - `query`: Read-only queries
        - `mutation`: State-changing operations
        - `effect`: Side effects (external calls, events)
      tags:
        - monad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteOperationRequest"
      responses:
        "200":
          description: Operation executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonadResponseEnvelope"
        "400":
          description: Validation or operation error
        "415":
          description: Content-Type must be application/json

  /api/v1/operations/{id}:
    get:
      summary: Get operation detail
      description: Retrieves a specific operation by ID.
      tags:
        - monad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonadResponseEnvelope"
        "404":
          description: Operation not found

  /api/v1/transactions:
    post:
      summary: Execute a transaction
      description: |
        Executes a composed set of operations as a transaction with ACID-like
        guarantees. If any operation fails, the transaction is rolled back.
      tags:
        - monad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteTransactionRequest"
      responses:
        "200":
          description: Transaction committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonadResponseEnvelope"
        "400":
          description: Validation or transaction error
        "415":
          description: Content-Type must be application/json

  /api/v1/stats:
    get:
      summary: Get service statistics
      description: |
        Returns service statistics. Available on Monad (port 8086) and
        Sophia (port 8087). Each service returns its own stats format.
      tags:
        - monad
        - sophia
      responses:
        "200":
          description: Service statistics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ===========================================================================
  # SOPHIA ENDPOINTS (port 8087)
  # ===========================================================================
  /api/v1/knowledge:
    get:
      summary: Query knowledge base
      description: |
        Searches Sophia's knowledge base using various query types.
        Results can be filtered by subject, predicate, object, minimum
        confidence, and query type.
      tags:
        - sophia
      parameters:
        - name: type
          in: query
          required: false
          description: Query type
          schema:
            type: string
            enum: [exact, semantic, graph, infer]
            default: exact
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - name: predicate
          in: query
          required: false
          schema:
            type: string
        - name: object
          in: query
          required: false
          schema:
            type: string
        - name: text
          in: query
          required: false
          description: Free-text search (used with semantic query type)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
        - name: min_confidence
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
      responses:
        "200":
          description: Knowledge query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SophiaResponseEnvelope"
    post:
      summary: Learn new knowledge
      description: |
        Adds a new knowledge triple (subject-predicate-object) to Sophia's
        knowledge base. Knowledge is indexed by subject, predicate, and type
        for efficient retrieval.
      tags:
        - sophia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnRequest"
      responses:
        "201":
          description: Knowledge learned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SophiaResponseEnvelope"
        "400":
          description: Validation error
        "415":
          description: Content-Type must be application/json

  /api/v1/insights:
    get:
      summary: Get insights
      description: Returns insights generated from knowledge analysis and inference.
      tags:
        - sophia
      responses:
        "200":
          description: Insights summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SophiaResponseEnvelope"

  /api/v1/decide:
    post:
      summary: Get decision recommendation
      description: |
        Provides a decision recommendation by scoring options against
        weighted factors. Returns the recommended option with reasoning
        and confidence score.
      tags:
        - sophia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequest"
      responses:
        "200":
          description: Decision recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SophiaResponseEnvelope"
              example:
                success: true
                data:
                  decision:
                    id: d-123456789-1
                    question: "Which database to use?"
                    recommendation: opt-postgres
                    reasoning: "Option 'PostgreSQL' scored highest..."
                    confidence: 0.85
                meta:
                  request_id: sophia_1
                  duration_ms: 5
                  timestamp: "2026-02-03T12:00:00Z"
        "400":
          description: Validation error
        "415":
          description: Content-Type must be application/json

  # ===========================================================================
  # DASHBOARD BACKEND ENDPOINTS (port 8080)
  # ===========================================================================
  /api/v1/metrics:
    get:
      summary: Get aggregated metrics
      description: |
        Returns aggregated metrics scraped from all Kingdom services.
        The dashboard backend periodically scrapes /metrics from each service.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Aggregated metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/metrics/query:
    post:
      summary: Query specific metrics
      description: |
        Queries metrics by name, labels, and time range. Supports both
        RFC3339 timestamps and Go duration strings (e.g., "1h", "30m").
      tags:
        - dashboard-backend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricsQueryRequest"
      responses:
        "200":
          description: Matching metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/v1/services:
    get:
      summary: List service statuses
      description: |
        Returns the health and metrics status of all monitored Kingdom
        services with uptime percentages and latency data.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Service status list
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceStatus"
                  total:
                    type: integer
                  healthy:
                    type: integer
                  degraded:
                    type: integer
                  unhealthy:
                    type: integer
                  overall_status:
                    type: string

  /api/v1/services/{name}:
    get:
      summary: Get service details
      description: Returns detailed health and metrics information for a specific service.
      tags:
        - dashboard-backend
      parameters:
        - name: name
          in: path
          required: true
          description: Service name
          schema:
            type: string
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  health:
                    type: object
                  metrics:
                    type: object
        "404":
          description: Service not found

  /api/v1/events:
    get:
      summary: Get recent events
      description: |
        Returns recent events from all Kingdom services, with optional
        filtering by type, severity, and source.
      tags:
        - dashboard-backend
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/v1/events/summary:
    get:
      summary: Get event summary
      description: Returns an aggregated summary of events by type and severity.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Event summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/health:
    get:
      summary: System health overview
      description: |
        Returns the overall system health including per-service health
        status, counts of healthy/degraded/unhealthy services.
      tags:
        - dashboard-backend
        - kanban-app
      responses:
        "200":
          description: System health overview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/health/{name}:
    get:
      summary: Service health details
      description: |
        Returns detailed health information for a specific service
        including health history from the last hour.
      tags:
        - dashboard-backend
      parameters:
        - name: name
          in: path
          required: true
          description: Service name
          schema:
            type: string
      responses:
        "200":
          description: Service health with history
          content:
            application/json:
              schema:
                type: object
                properties:
                  health:
                    type: object
                  history:
                    type: array
                    items:
                      type: object
        "404":
          description: Service not found

  /api/v1/flows:
    get:
      summary: Get packet flow info
      description: |
        Returns information about the packet flow generator and how to
        connect to the real-time WebSocket stream.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Packet flow status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: active
                  ws_endpoint:
                    type: string
                    example: /ws
                  description:
                    type: string
                  flow_rate_ms:
                    type: integer

  /api/v1/traces:
    get:
      summary: Query traces
      description: |
        Queries distributed trace data. Requires the trace collector to
        be connected. Returns empty results if trace collector is not
        available.
      tags:
        - dashboard-backend
      parameters:
        - name: service
          in: query
          required: false
          schema:
            type: string
        - name: start_time
          in: query
          required: false
          description: RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: false
          description: RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: min_duration
          in: query
          required: false
          description: Go duration string (e.g., "100ms", "1s")
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: has_error
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Trace query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceQueryResult"

  /api/v1/traces/{id}:
    get:
      summary: Get trace by ID
      tags:
        - dashboard-backend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trace details
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Trace not found
        "503":
          description: Trace collector not available

  /api/v1/aggregated:
    get:
      summary: Get all aggregated data
      description: |
        Returns a combined view of metrics, health, events, and stream
        status from all sources.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Aggregated data from all sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  metrics:
                    type: object
                  health:
                    type: object
                  events:
                    type: object
                  stream:
                    type: object

  /api/v1/aggregated/metrics:
    get:
      summary: Get aggregated metrics
      description: Returns aggregated metrics from scraper and internal aggregator.
      tags:
        - dashboard-backend
      parameters:
        - name: since
          in: query
          required: false
          description: Go duration string or RFC3339 timestamp
          schema:
            type: string
      responses:
        "200":
          description: Aggregated metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/aggregated/health:
    get:
      summary: Get aggregated health
      description: Returns aggregated health from internal monitor and external health aggregator.
      tags:
        - dashboard-backend
      responses:
        "200":
          description: Aggregated health data
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  internal:
                    type: object
                  aggregated_health:
                    type: object
                  overall:
                    type: string

  /api/v1/stream:
    get:
      summary: Real-time metrics stream (WebSocket)
      description: |
        WebSocket endpoint for real-time streaming of metrics, health
        updates, traces, events, and packet flows. Supports filtering
        by message type, service name, and severity level via query
        parameters.
      tags:
        - dashboard-backend
        - kanban-app
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated message types to filter (metrics, health, trace, event, flow)
          schema:
            type: string
        - name: services
          in: query
          required: false
          description: Comma-separated service names to filter
          schema:
            type: string
        - name: min_level
          in: query
          required: false
          description: Minimum severity level (info, warning, error, critical)
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade

  /ws:
    get:
      summary: WebSocket for real-time updates
      description: |
        WebSocket endpoint for real-time data streaming. Broadcasts
        packet flows, health updates, and events to all connected clients.
      tags:
        - dashboard-backend
        - kanban-app
      responses:
        "101":
          description: WebSocket upgrade

  /ws/metrics:
    get:
      summary: WebSocket for metrics streaming
      description: Dedicated WebSocket endpoint for metrics data streaming.
      tags:
        - dashboard-backend
      responses:
        "101":
          description: WebSocket upgrade

  # ===========================================================================
  # KANBAN APP ENDPOINTS (port 8080)
  # ===========================================================================
  /api/v1/tasks:
    get:
      summary: Get all tasks
      description: Returns all kanban tasks with count.
      tags:
        - kanban-app
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/KanbanTask"
                  count:
                    type: integer
    post:
      summary: Create a task
      description: Creates a new kanban task via the Wotan-integrated TaskManager.
      tags:
        - kanban-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanTask"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/KanbanTask"
        "400":
          description: Validation error
        "409":
          description: Task already exists
    put:
      summary: Update a task
      description: Updates an existing kanban task.
      tags:
        - kanban-app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanTask"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/KanbanTask"
        "400":
          description: Validation error
        "404":
          description: Task not found
    delete:
      summary: Delete a task
      description: Deletes a kanban task by ID (passed as query parameter).
      tags:
        - kanban-app
      parameters:
        - name: id
          in: query
          required: true
          description: Task ID to delete
          schema:
            type: string
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  task_id:
                    type: string
        "400":
          description: Missing task ID
        "404":
          description: Task not found

  /api/v1/tasks/{id}:
    get:
      summary: Get task by ID
      tags:
        - kanban-app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanTask"
        "404":
          description: Task not found
    put:
      summary: Update task by ID
      tags:
        - kanban-app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanTask"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/KanbanTask"
        "404":
          description: Task not found
    delete:
      summary: Delete task by ID
      tags:
        - kanban-app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  task_id:
                    type: string
        "404":
          description: Task not found

  /api/v1/timeline:
    get:
      summary: Get kanban timeline
      description: |
        Returns the current timeline data from Timeguru via the
        Wotan-integrated TaskManager.
      tags:
        - kanban-app
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                type: object
                properties:
                  timeline:
                    $ref: "#/components/schemas/Timeline"
        "503":
          description: Timeline not available (Wotan not connected)

  /api/v1/timeline/cards:
    get:
      summary: Get timeline as kanban cards
      description: |
        Returns timeline data converted to kanban task cards. Falls back to
        regular tasks if no timeline data is available.
      tags:
        - kanban-app
      responses:
        "200":
          description: Timeline cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/KanbanTask"
                  count:
                    type: integer
                  source:
                    type: string
                    example: timeline

  # ===========================================================================
  # SHIELD eBPF STATUS AND CONTROL ENDPOINTS
  # ===========================================================================
  /api/v1/shield/status:
    get:
      summary: Get Shield eBPF program status
      description: Returns the current status of all loaded eBPF programs (XDP, TC, kprobes)
      tags:
        - shield
      responses:
        "200":
          description: Shield status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [operational, degraded, offline]
                  programs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShieldProgramStatus"
                  last_update:
                    type: string
                    format: date-time

  /api/v1/shield/programs:
    get:
      summary: List all Shield eBPF programs
      description: Returns detailed information about all running BPF programs
      tags:
        - shield
      responses:
        "200":
          description: BPF programs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShieldProgram"

  /api/v1/shield/reload:
    post:
      summary: Reload Shield eBPF programs
      description: Triggers a reload of eBPF programs with zero-downtime hot-swap
      tags:
        - shield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                programs:
                  type: array
                  items:
                    type: string
                  description: List of program names to reload (empty = all)
      responses:
        "200":
          description: Reload initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: reloading
                  request_id:
                    type: string

  # ===========================================================================
  # ANAMNESIS EVENT ENDPOINTS
  # ===========================================================================
  /api/v1/anamnesis/events:
    get:
      summary: Get Anamnesis events
      description: Query ring buffer events with optional filtering
      tags:
        - anamnesis
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: event_type
          in: query
          schema:
            type: string
            description: Filter by event type (BIRTH, COMPUTED, DEATH, ANOMALY, CHAOS)
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnamnesisEvent"
                  total_count:
                    type: integer

  /api/v1/anamnesis/events/{flow_label}:
    get:
      summary: Get events for a specific flow
      description: Query all events associated with a specific flow label
      tags:
        - anamnesis
      parameters:
        - name: flow_label
          in: path
          required: true
          schema:
            type: string
            format: hex
            description: 128-bit flow label in hex format
      responses:
        "200":
          description: Flow events
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow_label:
                    type: string
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnamnesisEvent"
                  event_count:
                    type: integer

  /api/v1/anamnesis/stats:
    get:
      summary: Get Anamnesis event statistics
      description: Returns event counts, rates, and anomaly statistics
      tags:
        - anamnesis
      responses:
        "200":
          description: Event statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  events_per_second:
                    type: number
                  event_breakdown:
                    type: object
                    additionalProperties:
                      type: integer
                  anomalies_detected:
                    type: integer
                  last_update:
                    type: string
                    format: date-time

  # ===========================================================================
  # KINGDOM MODE ENDPOINTS
  # ===========================================================================
  /api/v1/kingdom/state:
    get:
      summary: Get Kingdom Mode state
      description: Returns current Kingdom Mode deployment state machine status
      tags:
        - kingdom
      responses:
        "200":
          description: Kingdom state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum: [IDLE, ACTIVE, CLOSING, CLOSED]
                  deployment_ring:
                    type: string
                  transition_count:
                    type: integer
                  last_transition:
                    type: string
                    format: date-time

  /api/v1/kingdom/state/transition:
    post:
      summary: Trigger Kingdom Mode state transition
      description: Initiates a state machine transition with validation
      tags:
        - kingdom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_state
              properties:
                target_state:
                  type: string
                  enum: [IDLE, ACTIVE, CLOSING, CLOSED]
                reason:
                  type: string
      responses:
        "200":
          description: Transition initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  previous_state:
                    type: string
                  target_state:
                    type: string
                  transition_id:
                    type: string
        "400":
          description: Invalid state transition

  /api/v1/kingdom/health:
    get:
      summary: Get Kingdom Mode health
      description: Returns health metrics for Kingdom Mode deployment
      tags:
        - kingdom
      responses:
        "200":
          description: Kingdom health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, critical]
                  ring_buffer_usage:
                    type: number
                    format: percentage
                  active_flows:
                    type: integer
                  error_rate:
                    type: number
                    format: percentage

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  schemas:
    # -------------------------------------------------------------------------
    # Common schemas
    # -------------------------------------------------------------------------
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ready
        ready:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string

    # -------------------------------------------------------------------------
    # Timeguru schemas
    # -------------------------------------------------------------------------
    Timeline:
      type: object
      properties:
        version:
          type: string
        last_updated:
          type: string
          format: date-time
        status:
          type: string
        vision:
          type: string
        phases:
          type: array
          items:
            $ref: "#/components/schemas/Phase"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        metadata:
          type: object
          additionalProperties:
            type: string

    Phase:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [planned, in_progress, completed]
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        progress:
          type: integer
          minimum: 0
          maximum: 100
        description:
          type: string
        milestones:
          type: array
          items:
            type: string

    Milestone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, blocked]
        eta:
          type: string
          format: date-time
        progress:
          type: integer
          minimum: 0
          maximum: 100
        owner:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        description:
          type: string
        tasks:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string

    TimelineResponse:
      type: object
      properties:
        timeline:
          $ref: "#/components/schemas/Timeline"

    MilestonesResponse:
      type: object
      properties:
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"

    UpdateMilestoneRequest:
      type: object
      required:
        - progress
        - status
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [pending, in_progress, completed, blocked]

    KanbanTask:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          maxLength: 200
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        status:
          type: string
          enum: [todo, in-progress, done]
        type:
          type: string
          enum: [milestone, feature, task, bug, tech-debt, epic]
        owner:
          type: string
        due_date:
          type: string
          format: date
        progress:
          type: integer
          minimum: 0
          maximum: 100
        phase:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/KanbanTask"
        total_count:
          type: integer

    TimeguruErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: string

    # -------------------------------------------------------------------------
    # Captain schemas
    # -------------------------------------------------------------------------
    CaptainDecision:
      type: object
      required:
        - title
        - content
        - owner
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 500
        content:
          type: string
          maxLength: 10000
        owner:
          type: string
          maxLength: 200
        priority:
          type: integer
          minimum: 0
          maximum: 3
          description: "0=Low, 1=Medium, 2=High, 3=Critical"
        status:
          type: string
          enum: [pending, approved, rejected, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CaptainVision:
      type: object
      properties:
        title:
          type: string
        statement:
          type: string
        goals:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time

    CaptainStrategy:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        phases:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              timeline:
                type: string
        updated_at:
          type: string
          format: date-time

    CaptainResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
            duration_ms:
              type: integer
            timestamp:
              type: string
              format: date-time

    # -------------------------------------------------------------------------
    # Architect schemas
    # -------------------------------------------------------------------------
    ArchitectService:
      type: object
      required:
        - service_id
        - name
      properties:
        service_id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
        address:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NetworkNode:
      type: object
      required:
        - node_id
        - name
      properties:
        node_id:
          type: string
        name:
          type: string
        type:
          type: string
          description: "container, service, gateway, etc."
        cidr:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ArchitectureDecision:
      type: object
      required:
        - title
        - description
      properties:
        decision_id:
          type: string
        title:
          type: string
        description:
          type: string
        component:
          type: string
        status:
          type: string
          enum: [proposed, approved, implemented, deprecated]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    InfrastructureState:
      type: object
      properties:
        services:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ArchitectService"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/ArchitectureDecision"

    NetworkTopology:
      type: object
      properties:
        nodes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NetworkNode"

    ArchitectSuccessResponse:
      type: object
      properties:
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Micromanager schemas
    # -------------------------------------------------------------------------
    MicromanagerTaskRequest:
      type: object
      required:
        - title
        - priority
        - owner
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5
        assignee:
          type: string
        owner:
          type: string
        tags:
          type: array
          items:
            type: string
        due_date:
          type: string
          format: date

    MicromanagerTaskResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, blocked]
        priority:
          type: integer
          minimum: 1
          maximum: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        assignee:
          type: string
        owner:
          type: string
        tags:
          type: array
          items:
            type: string
        due_date:
          type: string
          format: date-time

    MicromanagerErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer

    # -------------------------------------------------------------------------
    # Monad schemas
    # -------------------------------------------------------------------------
    ExecuteOperationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        type:
          type: string
          enum: [query, mutation, effect]
          default: query
        input:
          type: object
          description: Arbitrary input data for the operation

    ExecuteTransactionRequest:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExecuteOperationRequest"

    Operation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [query, mutation, effect, composed]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        input:
          type: object
        output:
          type: object
        error:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in nanoseconds
        metadata:
          type: object
          additionalProperties: true
        parent_id:
          type: string
        children:
          type: array
          items:
            type: string

    MonadResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
            duration_ms:
              type: integer
            timestamp:
              type: string
              format: date-time

    # -------------------------------------------------------------------------
    # Sophia schemas
    # -------------------------------------------------------------------------
    Knowledge:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [fact, inference, heuristic, pattern, constraint, goal]
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        source:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        embeddings:
          type: array
          items:
            type: number
            format: double
        relations:
          type: array
          items:
            type: string

    LearnRequest:
      type: object
      required:
        - subject
        - predicate
        - object
      properties:
        type:
          type: string
          enum: [fact, inference, heuristic, pattern, constraint, goal]
          default: fact
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        source:
          type: string
        metadata:
          type: object
          additionalProperties: true

    DecideRequest:
      type: object
      required:
        - question
        - options
      properties:
        question:
          type: string
        options:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SophiaOption"
        factors:
          type: array
          items:
            $ref: "#/components/schemas/SophiaFactor"
        context:
          type: object
          additionalProperties: true

    SophiaOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        score:
          type: number
          format: double
        pros:
          type: array
          items:
            type: string
        cons:
          type: array
          items:
            type: string

    SophiaFactor:
      type: object
      properties:
        name:
          type: string
        weight:
          type: number
          format: double
        value:
          type: number
          format: double
        importance:
          type: string

    SophiaDecision:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/SophiaOption"
        recommendation:
          type: string
        reasoning:
          type: string
        confidence:
          type: number
          format: double
        factors:
          type: array
          items:
            $ref: "#/components/schemas/SophiaFactor"
        created_at:
          type: string
          format: date-time
        context:
          type: object
          additionalProperties: true

    SophiaInsight:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        description:
          type: string
        confidence:
          type: number
          format: double
        evidence:
          type: array
          items:
            type: string
        impact:
          type: string
          enum: [low, medium, high]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    SophiaResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
            duration_ms:
              type: integer
            timestamp:
              type: string
              format: date-time

    # -------------------------------------------------------------------------
    # Dashboard Backend schemas
    # -------------------------------------------------------------------------
    MetricsQueryRequest:
      type: object
      properties:
        name:
          type: string
          description: Metric name to query
        labels:
          type: object
          additionalProperties:
            type: string
          description: Label key-value pairs to filter by
        since:
          type: string
          description: RFC3339 timestamp for start of range
        since_duration:
          type: string
          description: Go duration string (e.g., "1h", "30m")

    TraceQueryResult:
      type: object
      properties:
        traces:
          type: array
          items:
            type: object
        total:
          type: integer
        has_more:
          type: boolean
        message:
          type: string
          description: Status message when trace collector is not available

    ServiceStatus:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        last_check:
          type: string
          format: date-time
        uptime_percent:
          type: number
          format: double
        consecutive_successes:
          type: integer
        consecutive_failures:
          type: integer
        average_latency_ms:
          type: integer
        metrics_status:
          type: string
        metrics_count:
          type: integer

    StreamMessage:
      type: object
      properties:
        type:
          type: string
          enum: [metrics, health, trace, event, flow]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: object

    # Shield eBPF Schemas
    ShieldProgramStatus:
      type: object
      properties:
        name:
          type: string
          description: Program name (xdp_ingress, tc_egress, kprobe_lifecycle)
        status:
          type: string
          enum: [loaded, unloaded, error]
        load_time:
          type: string
          format: date-time
        packet_count:
          type: integer
        error_count:
          type: integer
        attached_to:
          type: string
          description: Kernel hook (xdp, tc, kprobe)

    ShieldProgram:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [xdp, tc, kprobe]
        status:
          type: string
          enum: [active, inactive]
        size_bytes:
          type: integer
        load_time:
          type: string
          format: date-time
        maps:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              entries:
                type: integer
        metrics:
          type: object
          additionalProperties:
            type: integer

    # Anamnesis Event Schemas
    AnamnesisEvent:
      type: object
      properties:
        timestamp_ns:
          type: integer
          format: uint64
          description: Nanosecond timestamp
        event_type:
          type: string
          enum: [BIRTH, COMPUTED, DEATH, ANOMALY, CHAOS, ROLLBACK]
        flow_label:
          type: string
          format: hex
        hop_index:
          type: integer
        input_monad:
          type: string
          format: hex
          description: 20-byte Monad before hop
        output_monad:
          type: string
          format: hex
          description: 20-byte Monad after hop
        trace_id:
          type: string
          format: hex
        wotan_addr:
          type: string
          format: hex
          description: Wotan memory address accessed
        wotan_value:
          type: string
          format: hex
          description: Value read/written

    # Kingdom Mode Schemas
    KingdomState:
      type: object
      properties:
        state:
          type: string
          enum: [IDLE, ACTIVE, CLOSING, CLOSED]
        state_code:
          type: integer
          minimum: 0
          maximum: 3
        transition_history:
          type: array
          items:
            type: object
            properties:
              from_state:
                type: string
              to_state:
                type: string
              timestamp:
                type: string
                format: date-time
              reason:
                type: string
