      WELL_SSLROOTCERT: "${WELL_SSLROOTCERT:-}"   # /etc/unheaded/well-tls/ca.crt, mounted below
    volumes:
      - ./configs/certs/dev/kanban-app:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      - ${WELL_TLS_DIR:-/etc/unheaded/well-tls}/ca.crt:/etc/unheaded/well-tls/ca.crt:ro   # The Well's CA, the certificate only
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - kanban-data:/data   # named volume; /data was a tmpfs, so writes vanished with the container
    ports:
      - "127.0.0.1:20001:20001"
      - "${UNHEADED_GATEWAY_BIND:-172.17.0.1}:20001:20001"   # VictoriaMetrics scrape; see victoria
      - "${UNHEADED_LAN_BIND:-127.0.0.4}:20001:20001"   # see dashboard-backend
    networks:
