# =============================================================================
# docker-compose.yml — Unheaded Kingdom Dev Stack
# =============================================================================
# WHAT: Full-stack development environment for Unheaded
# WHY:  E2E integration testing, service mesh validation, eBPF dev
# WHO:  Architect (owner), Developer (consumer)
# DECISION: S26 Open Question — Docker for dev, LXD for prod (reconcile in Age 2)
# =============================================================================
# USAGE:
#   docker compose up -d                    # Start all services
#   docker compose up -d traefik victoria   # Start infra only
#   docker compose ps                       # Check status
#   docker compose logs -f <service>        # Tail logs
#   docker compose down                     # Stop all
#   docker compose down -v                  # Stop + remove volumes (DESTRUCTIVE)
# =============================================================================

name: unheaded-dev

# =============================================================================
# NETWORK FABRIC (Dev approximation of EVPN-VXLAN)
# =============================================================================
networks:
  # Control plane network — service discovery, config, health
  control:
    driver: bridge
    ipam:
      config:
        - subnet: fd00:unhe:ctrl::/64
        - subnet: 172.28.0.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-ctrl
    labels:
      kingdom.tier: "control-plane"
      kingdom.fabric: "control"

  # Data plane network — service-to-service traffic
  data:
    driver: bridge
    ipam:
      config:
        - subnet: fd00:unhe:data::/64
        - subnet: 172.28.1.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-data
    labels:
      kingdom.tier: "data-plane"
      kingdom.fabric: "data"

  # Observability network — metrics, logs, traces (isolated)
  observe:
    driver: bridge
    ipam:
      config:
        - subnet: fd00:unhe:obs::/64
        - subnet: 172.28.2.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-obs
    labels:
      kingdom.tier: "observability"
      kingdom.fabric: "observe"

# =============================================================================
# VOLUMES (persistent dev data)
# =============================================================================
volumes:
  clickhouse-data:
    labels:
      kingdom.component: "logging"
  victoria-data:
    labels:
      kingdom.component: "metrics"
  traefik-certs:
    labels:
      kingdom.component: "gateway"

# =============================================================================
# SERVICES
# =============================================================================
services:

  # =========================================================================
  # TIER 0: GATEWAY (Shield / Edge Defense)
  # =========================================================================
  traefik:
    image: traefik:v3.3
    container_name: unheaded-traefik
    restart: unless-stopped
    command:
      # --- API & Dashboard ---
      - "--api.dashboard=true"
      - "--api.insecure=true"  # Dev only — disable in prod
      # --- Entrypoints ---
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http3"  # HTTP/3 + QUIC
      - "--entrypoints.grpc.address=:50051"
      # --- Provider ---
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=unheaded-dev_data"
      # --- Logging ---
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
      # --- Metrics ---
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS + HTTP/3 (QUIC)
      - "443:443/udp" # QUIC UDP
      - "50051:50051" # gRPC
      - "8080:8080"   # Traefik dashboard (dev only)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/certs"
    networks:
      - control
      - data
      - observe
    labels:
      kingdom.armor: "shield"
      kingdom.role: "gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 1: OBSERVABILITY (Whispering Void / Vambraces)
  # =========================================================================

  # --- Metrics: VictoriaMetrics (Prometheus-compatible, efficient) ---
  victoria:
    image: victoriametrics/victoria-metrics:v1.108.1
    container_name: unheaded-victoria
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-data"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
      - "-selfScrapeInterval=15s"
    ports:
      - "8428:8428"  # Prometheus-compatible API
    volumes:
      - victoria-data:/victoria-data
    networks:
      - observe
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "metrics"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8428/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # --- Logging: ClickHouse (fast ingest, SQL queries) ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: unheaded-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: unheaded_logs
      CLICKHOUSE_USER: unheaded
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native TCP
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - observe
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "logging"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # --- Log Pipeline: Vector (eBPF events → ClickHouse) ---
  vector:
    image: timberio/vector:0.43.1-debian
    container_name: unheaded-vector
    restart: unless-stopped
    volumes:
      - ./config/vector/vector.yaml:/etc/vector/vector.yaml:ro
    networks:
      - observe
      - data
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "log-pipeline"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vector", "top", "--interval", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 2: DASHBOARD (Visor / Crest)
  # =========================================================================

  # --- Grafana for dev visualization (supplements custom dashboards) ---
  grafana:
    image: grafana/grafana:11.5.1
    container_name: unheaded-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
    ports:
      - "3001:3000"  # 3001 to avoid conflict with Fiber on :3000
    networks:
      - observe
    labels:
      kingdom.armor: "visor"
      kingdom.role: "dashboard-dev"
      traefik.enable: "false"  # Internal only
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 3: DNS (Helm) — Dev CoreDNS for service discovery
  # =========================================================================
  coredns:
    image: coredns/coredns:1.12.0
    container_name: unheaded-coredns
    restart: unless-stopped
    volumes:
      - ./config/coredns/Corefile:/etc/coredns/Corefile:ro
    ports:
      - "5353:53/udp"   # DNS (non-privileged port for dev)
      - "5353:53/tcp"
    networks:
      - control
      - data
    labels:
      kingdom.armor: "helm"
      kingdom.role: "dns"
    command: ["-conf", "/etc/coredns/Corefile"]
    healthcheck:
      test: ["CMD", "dig", "@localhost", "health.unheaded.local", "+short", "+time=2"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

# =============================================================================
# LABELS LEGEND
# =============================================================================
# kingdom.armor   = Which armor piece this maps to
# kingdom.role    = Specific function within that armor
# kingdom.tier    = Architecture tier (control-plane, data-plane, observability)
# kingdom.fabric  = Network fabric membership
# =============================================================================
