# =============================================================================
# docker-compose.yml — Unheaded Kingdom Dev Stack
# =============================================================================
# WHAT: Full-stack development environment for Unheaded
# WHY:  E2E integration testing, service mesh validation, eBPF dev
# WHO:  Architect (owner), Developer (consumer)
# DECISION: S26 Open Question — Docker for dev, LXD for prod (reconcile in Age 2)
# =============================================================================
# USAGE:
#   docker compose up -d                    # Start all services
#   docker compose up -d traefik victoria   # Start infra only
#   docker compose ps                       # Check status
#   docker compose logs -f <service>        # Tail logs
#   docker compose down                     # Stop all
#   docker compose down -v                  # Stop + remove volumes (DESTRUCTIVE)
# =============================================================================

name: unheaded-dev

# =============================================================================
# NETWORK FABRIC (Dev approximation of EVPN-VXLAN)
# =============================================================================
networks:
  # Control plane network — service discovery, config, health
  control:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-ctrl
    labels:
      kingdom.tier: "control-plane"
      kingdom.fabric: "control"

  # Data plane network — service-to-service traffic
  data:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-data
    labels:
      kingdom.tier: "data-plane"
      kingdom.fabric: "data"

  # Observability network — metrics, logs, traces (isolated)
  observe:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-obs
    labels:
      kingdom.tier: "observability"
      kingdom.fabric: "observe"

# =============================================================================
# VOLUMES (persistent dev data)
# =============================================================================
volumes:
  postgres-data:
    labels:
      kingdom.component: "the-well"
  clickhouse-data:
    labels:
      kingdom.component: "logging"
  victoria-data:
    labels:
      kingdom.component: "metrics"
  traefik-certs:
    labels:
      kingdom.component: "gateway"
  # mTLS certificates volume — generated by scripts/gen-dev-certs.sh
  # Mount into services when UNHEADED_TLS_ENABLED=true
  # Example service volume mount:
  #   volumes:
  #     - ./dev-certs:/etc/unheaded/tls:ro
  # Example service environment:
  #   environment:
  #     UNHEADED_TLS_ENABLED: "true"
  #     UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
  #     UNHEADED_TLS_CERT: /etc/unheaded/tls/<service>.pem
  #     UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/<service>-key.pem
  #     UNHEADED_TLS_MTLS_ENABLED: "true"

# =============================================================================
# SERVICES
# =============================================================================
services:

  # =========================================================================
  # TIER 0: GATEWAY (Shield / Edge Defense)
  # =========================================================================
  traefik:
    image: traefik:v3.3
    container_name: unheaded-traefik
    restart: unless-stopped
    command:
      # --- API & Dashboard ---
      - "--api.dashboard=true"
      - "--api.insecure=true"  # Dev only — disable in prod
      # --- Entrypoints ---
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http3"  # HTTP/3 + QUIC
      - "--entrypoints.grpc.address=:50051"
      # --- Provider ---
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=unheaded-dev_data"
      # --- Logging ---
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
      # --- Ping / Health ---
      - "--ping=true"
      - "--ping.entryPoint=web"
      # --- Metrics ---
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS + HTTP/3 (QUIC)
      - "443:443/udp" # QUIC UDP
      - "50051:50051" # gRPC
      - "21000:21000"   # Traefik dashboard (dev only)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/certs"
    networks:
      - control
      - data
      - observe
    labels:
      kingdom.armor: "shield"
      kingdom.role: "gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 1: OBSERVABILITY (Whispering Void / Vambraces)
  # =========================================================================

  # --- Metrics: VictoriaMetrics (Prometheus-compatible, efficient) ---
  victoria:
    image: victoriametrics/victoria-metrics:v1.108.1
    container_name: unheaded-victoria
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-data"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
      - "-selfScrapeInterval=15s"
      - "-promscrape.config=/etc/victoria/scrape.yml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8428:8428"  # Prometheus-compatible API
    volumes:
      - victoria-data:/victoria-data
      - ./config/victoria/scrape.yml:/etc/victoria/scrape.yml:ro
    networks:
      - observe
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "metrics"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8428/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # --- The Well: PostgreSQL (Kingdom Persistent Memory) ---
  postgres:
    image: postgres:16-alpine
    container_name: unheaded-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unheaded
      POSTGRES_USER: unheaded
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unheaded_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - data
    labels:
      kingdom.armor: "the-well"
      kingdom.role: "persistent-memory"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unheaded"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # --- Logging: ClickHouse (fast ingest, SQL queries) ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: unheaded-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: unheaded_logs
      CLICKHOUSE_USER: unheaded
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native TCP
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - observe
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "logging"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # --- Log Pipeline: Vector (eBPF events → ClickHouse) ---
  vector:
    image: timberio/vector:0.43.1-debian
    container_name: unheaded-vector
    restart: unless-stopped
    volumes:
      - ./config/vector/vector.yaml:/etc/vector/vector.yaml:ro
    networks:
      - observe
      - data
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "log-pipeline"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vector", "top", "--interval", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 2: DASHBOARD (Visor / Crest)
  # =========================================================================

  # --- Grafana for dev visualization (supplements custom dashboards) ---
  grafana:
    image: grafana/grafana:11.5.1
    container_name: unheaded-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
    volumes:
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/unheaded-kingdom-dashboard.json:/var/lib/grafana/dashboards/unheaded-kingdom.json:ro
    ports:
      - "3001:3000"  # 3001 to avoid conflict with Fiber on :3000
    networks:
      - observe
    labels:
      kingdom.armor: "visor"
      kingdom.role: "dashboard-dev"
      traefik.enable: "false"  # Internal only
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 3: DNS (Helm) — Dev CoreDNS for service discovery
  # =========================================================================
  coredns:
    image: coredns/coredns:1.12.0
    container_name: unheaded-coredns
    restart: unless-stopped
    volumes:
      - ./config/coredns/Corefile:/etc/coredns/Corefile:ro
    ports:
      - "5353:53/udp"   # DNS (non-privileged port for dev)
      - "5353:53/tcp"
    networks:
      - control
      - data
    labels:
      kingdom.armor: "helm"
      kingdom.role: "dns"
    command: ["-conf", "/etc/coredns/Corefile"]
    healthcheck:
      test: ["CMD", "dig", "@localhost", "health.unheaded.local", "+short", "+time=2"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # =========================================================================
  # TIER 4: APPLICATION SERVICES (Kingdom Core)
  # =========================================================================

  # --- Wotan: Message Bus (Fae Chamber) ---
  wotan:
    build:
      context: .
      target: wotan
    container_name: unheaded-wotan
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=64M
    environment:
      LOG_LEVEL: info
    ports:
      - "18001:18001"     # gRPC streaming
      - "18000:18000"     # HTTP REST API
    volumes:
      - /var/log/unheaded/wotan:/var/log/unheaded:rw
    networks:
      - control
      - data
    labels:
      kingdom.armor: "fae-chamber"
      kingdom.role: "message-bus"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:18000/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # --- Timeguru: Timeline Service (Oracle's Antre) ---
  timeguru:
    build:
      context: .
      target: timeguru
    container_name: unheaded-timeguru
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M
      - /app/data:size=64M
      - /app/references:size=16M
    environment:
      PORT: "19000"
      WOTAN_ADDR: "wotan:18000"
    ports:
      - "19000:19000"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "oracle"
      kingdom.role: "timeline"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19000/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # --- Captain: Strategy Service (Commander's Quarters) ---
  captain:
    build:
      context: .
      target: captain
    container_name: unheaded-captain
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M
      - /data:size=64M
    environment:
      HTTP_ADDR: "0.0.0.0:19002"
      WOTAN_ADDR: "wotan:18001"
      DATA_PATH: "/data"
    ports:
      - "19002:19002"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "commander"
      kingdom.role: "strategy"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19002/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Architect: ADR Service (Sage's Lair) ---
  architect:
    build:
      context: .
      target: architect
    container_name: unheaded-architect
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M
      - /data:size=64M
    environment:
      WOTAN_ADDR: "wotan:18000"
    command: ["/app/architect", "-addr", ":19001"]
    ports:
      - "19001:19001"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "sage"
      kingdom.role: "adr"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19001/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Micromanager: Task Execution (War Room) ---
  micromanager:
    build:
      context: .
      target: micromanager
    container_name: unheaded-micromanager
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M
      - /data:size=64M
    command: ["/app/micromanager", "-port", "19003"]
    ports:
      - "19003:19003"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "war-room"
      kingdom.role: "execution"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19003/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Monad: Unified State Management ---
  monad:
    build:
      context: .
      target: monad
    container_name: unheaded-monad
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M
      - /data:size=64M
    environment:
      MONAD_PORT: "19004"
      WOTAN_ADDR: "wotan:18000"
    ports:
      - "19004:19004"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "monad"
      kingdom.role: "state-management"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19004/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Sophia: Knowledge Graph ---
  sophia:
    build:
      context: .
      target: sophia
    container_name: unheaded-sophia
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M
      - /data:size=64M
    environment:
      SOPHIA_LISTEN_ADDR: ":19005"
      WOTAN_ADDR: "wotan:18000"
    ports:
      - "19005:19005"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "sophia"
      kingdom.role: "knowledge-graph"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19005/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Dashboard Backend: The Visor (Observability Dashboard) ---
  dashboard-backend:
    build:
      context: .
      target: dashboard-backend
    container_name: unheaded-dashboard
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M
      - /data:size=64M
    environment:
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"
      SERVICES_FILE: "/etc/unheaded/services.txt"
    volumes:
      - ./config/dashboard/services.txt:/etc/unheaded/services.txt:ro
    command: ["--listen", ":20000", "--wotan", "wotan:18000", "--wotan-grpc-addr", "wotan:18001", "--ws-allowed-origins", "*"]
    ports:
      - "20000:20000"
    networks:
      - data
      - observe
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "visor"
      kingdom.role: "dashboard"
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "PathPrefix(`/dashboard`)"
      traefik.http.services.dashboard.loadbalancer.server.port: "20000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:20000/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # --- Kanban App: The Meta Moment (Self-Hosting Proof) ---
  kanban-app:
    build:
      context: .
      target: kanban-app
    container_name: unheaded-kanban
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M
      - /data:size=64M
    environment:
      PORT: "20001"
      WOTAN_ADDR: "wotan:18000"
      TIMEGURU_ADDR: "timeguru:19000"
      DATA_DIR: "/data"
    ports:
      - "20001:20001"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
      timeguru:
        condition: service_healthy
    labels:
      kingdom.armor: "meta-moment"
      kingdom.role: "kanban"
      traefik.enable: "true"
      traefik.http.routers.kanban.rule: "PathPrefix(`/kanban`)"
      traefik.http.services.kanban.loadbalancer.server.port: "20001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:20001/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Cuirass: Control Plane Daemon ---
  cuirass:
    build:
      context: .
      target: cuirass
    container_name: unheaded-cuirass
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=64M
    environment:
      HTTP_ADDR: ":19006"
      WOTAN_ADDR: "wotan:18000"
    ports:
      - "19006:19006"
    volumes:
      - /var/lib/unheaded:/var/lib/unheaded:rw
      - /var/log/unheaded/cuirass:/var/log/unheaded:rw
    networks:
      - control
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "cuirass"
      kingdom.role: "control-plane"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19006/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

# =============================================================================
# LABELS LEGEND
# =============================================================================
# kingdom.armor   = Which armor piece this maps to
# kingdom.role    = Specific function within that armor
# kingdom.tier    = Architecture tier (control-plane, data-plane, observability)
# kingdom.fabric  = Network fabric membership
# =============================================================================
