  # --- Dashboard Backend: The Visor (Observability Dashboard) ---
  dashboard-backend:
    logging: *journald-logging
    build:
      context: .
      target: dashboard-backend
    container_name: unheaded-dashboard
    user: "16728:16728"   # pkg/uids
    secrets: [svc_key_dashboard-backend]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_dashboard-backend (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M
      - /data:size=64M
    environment:
      # S-IRON-GATE Phase 8 (FND-017): TLS 1.3, Strict hybrid ML-KEM, on every
      # listener and link; material from scripts/gen-dev-certs.sh (this
      # service's own dir only). No mTLS: identity is the service token.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/dashboard-backend.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/dashboard-backend-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
      AUTH_KEY_FILE: /run/secrets/svc_key_dashboard-backend   # ADR-103
      # S-IRON-GATE Phase 6: the browser's backend-for-frontend (pkg/bff).
      # People log in at /auth/login against the issuer and hold only an
      # HttpOnly, Secure session cookie; every /api/ call and WebSocket
      # needs one (or a service token from AUTH_ALLOW_CALLERS). The issuer
      # is https, verified against the dev CA (Phase 8).
      AUTH_ENABLED: "true"
      AUTH_ISSUER_URL: "https://auth:19020"
      AUTH_ALLOW_CALLERS: "unheaded-cli"
      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"
      SERVICES_FILE: "/etc/unheaded/services.txt"
      HOST_PROC: "/host/proc"   # kept for the (now-fallback) local reader; host metrics come from huginn
      # Soft ceiling for the Go GC, under the 768M cgroup limit below. Without
      # it the GC goal is 2x live heap, which sat above the cgroup limit and
      # the kernel OOM-killed the container mid-cycle (2026-09-21). With it the
      # runtime collects harder instead of dying.
      GOMEMLIMIT: "600MiB"
      # Akira's health reports into The Well (ERDA 5.5) as the scoped writer;
      # no default password (compose refuses to start without it).
      WELL_HOST: "postgres"
      WELL_USER: "ops_writer"
      WELL_PASSWORD: "${OPS_WRITER_PASSWORD:?set OPS_WRITER_PASSWORD in .env (credentials are not stored in this repo)}"
      WELL_DB: "unheaded_ops"
      WELL_SSLMODE: "${WELL_SSLMODE:-require}"   # pg_hba accepts TLS only (ERDA 4.2); verify-full needs the CA below
      WELL_SSLROOTCERT: "${WELL_SSLROOTCERT:-}"   # /etc/unheaded/well-tls/ca.crt, mounted below
    volumes:
      - ./configs/certs/dev/dashboard-backend:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      - ${WELL_TLS_DIR:-/etc/unheaded/well-tls}/ca.crt:/etc/unheaded/well-tls/ca.crt:ro   # The Well's CA, the certificate only
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - ./config/dashboard/services.txt:/etc/unheaded/services.txt:ro
      - /proc:/host/proc:ro
      - /etc/hostname:/host/etc/hostname:ro
      # ADR-097 compliance crosswalk: catalog + evidence (cmd/compliance-evidence
      # writes var/compliance on the host). Read-only: the page never writes.
      - ./compliance:/opt/unheaded/compliance:ro
      - ./var/compliance:/opt/unheaded/var/compliance:ro
    # No --ws-allowed-origins: the WS server defaults to a same-origin check
    # (Origin host == request Host), which works from localhost, the LAN IP, and
    # any future reverse proxy. A literal "*" here is NOT allow-all — isOriginAllowed
    # does exact matching, so "*" silently denies every real browser origin.
    command: ["--listen", ":20000", "--wotan", "wotan:18000", "--wotan-grpc-addr", "wotan:18001", "--compliance-root", "/opt/unheaded"]
    ports:
      # The nav links in the dashboard and kanban pages name the host's LAN
      # address. Set UNHEADED_LAN_BIND to that address to keep them working;
      # unset, a browser on another host comes in through Traefik's /dashboard
      # and /kanban. Unset, it falls to a spare loopback address (see victoria).
      - "127.0.0.1:20000:20000"
      - "${UNHEADED_GATEWAY_BIND:-172.17.0.1}:20000:20000"   # VictoriaMetrics scrape; see victoria
      - "${UNHEADED_OVERLAY_BIND:-127.0.0.3}:20000:20000"   # Prometheus scrape; see victoria
      - "${UNHEADED_LAN_BIND:-127.0.0.4}:20000:20000"
    networks:
      - data
      - observe
    depends_on:
      wotan:
        condition: service_healthy
      auth:
        condition: service_healthy
    labels:
      kingdom.armor: "visor"
      kingdom.role: "dashboard"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "20000"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

  # --- Kanban App: The Meta Moment (Self-Hosting Proof) ---
  kanban-app:
    logging: *journald-logging
