  # --- Akira: consensus health (ADR-029) ---
  # Checks every service each 30 s, publishes its reports to Wotan's
  # system.health.reports, tallies all reporters' votes into CLAUDE.md's
  # severity bands and publishes changes to system.health.consensus.
  # Detection only: no --remediate here (remediation would need the Docker
  # socket, and a failing service should stay visibly down while building).
  akira:
    logging: *journald-logging
    build:
      context: .
      target: akira
    container_name: unheaded-akira
    user: "16731:16731"   # pkg/uids
    secrets: [svc_key_akira]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_akira (scripts/gen-dev-keys.sh)
    environment:
      # S-IRON-GATE Phase 8 (FND-017): TLS 1.3, Strict hybrid ML-KEM, on every
      # listener and link; material from scripts/gen-dev-certs.sh (this
      # service's own dir only). No mTLS: identity is the service token.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/akira.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/akira-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
      AUTH_KEY_FILE: /run/secrets/svc_key_akira   # ADR-103: also Akira's Wotan identity
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      # S-IRON-GATE Phase 6 recipe: every route but /health /ready /metrics and
      # the GET consensus read /api/v1/status needs a service token. No service
      # calls Akira's API, so no caller is allowed (a token is 403).
      AUTH_ENABLED: "true"
      AUTH_ALLOW_CALLERS: ""
      # S-IRON-GATE Phase 9: system.health.consensus/.remediate are signed
      # topics. No HEALTH_SIGNING_KEY_FILE here (configs/wotan.yaml enrols no
      # key either), so Akira publishes its reports but not those two;
      # GET /api/v1/status still serves the consensus.
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16M
    command: ["--config", "/etc/unheaded/akira.yaml", "--wotan", "wotan:18000", "--node", "${KINGDOM_NODE:-west}"]
    volumes:
      - ./configs/certs/dev/akira:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - ./config/akira/akira.yaml:/etc/unheaded/akira.yaml:ro
      # S-IRON-GATE Phase 10: what the cert-expiry exec check reads. Each
      # listener's certificate file and the CA, never a key or a whole
      # service directory (those are 0750 to their own uid). File mounts
      # follow gen-dev-certs.sh re-issues: cert-gen rewrites in place.
      - ./configs/certs/dev/ca.pem:/etc/unheaded/tls-watch/ca.pem:ro
      - ./configs/certs/dev/akira/akira.pem:/etc/unheaded/tls-watch/akira/akira.pem:ro
      - ./configs/certs/dev/architect/architect.pem:/etc/unheaded/tls-watch/architect/architect.pem:ro
      - ./configs/certs/dev/auth/auth.pem:/etc/unheaded/tls-watch/auth/auth.pem:ro
      - ./configs/certs/dev/captain/captain.pem:/etc/unheaded/tls-watch/captain/captain.pem:ro
      - ./configs/certs/dev/cuirass/cuirass.pem:/etc/unheaded/tls-watch/cuirass/cuirass.pem:ro
      - ./configs/certs/dev/dashboard-backend/dashboard-backend.pem:/etc/unheaded/tls-watch/dashboard-backend/dashboard-backend.pem:ro
      - ./configs/certs/dev/kanban-app/kanban-app.pem:/etc/unheaded/tls-watch/kanban-app/kanban-app.pem:ro
      - ./configs/certs/dev/micromanager/micromanager.pem:/etc/unheaded/tls-watch/micromanager/micromanager.pem:ro
      - ./configs/certs/dev/monad/monad.pem:/etc/unheaded/tls-watch/monad/monad.pem:ro
      - ./configs/certs/dev/sophia/sophia.pem:/etc/unheaded/tls-watch/sophia/sophia.pem:ro
      - ./configs/certs/dev/sword/sword.pem:/etc/unheaded/tls-watch/sword/sword.pem:ro
      - ./configs/certs/dev/timeguru/timeguru.pem:/etc/unheaded/tls-watch/timeguru/timeguru.pem:ro
      - ./configs/certs/dev/wotan/wotan.pem:/etc/unheaded/tls-watch/wotan/wotan.pem:ro
    ports:
      - "127.0.0.1:19100:19100"
      - "${UNHEADED_GATEWAY_BIND:-172.17.0.1}:19100:19100"   # VictoriaMetrics scrape; see victoria
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.role: "health"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "19100"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

