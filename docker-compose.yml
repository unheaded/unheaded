  # Detection only: no --remediate here (remediation would need the Docker
  # socket, and a failing service should stay visibly down while building).
  akira:
    logging: *journald-logging
    build:
      context: .
      target: akira
    container_name: unheaded-akira
    user: "16731:16731"   # pkg/uids
    secrets: [svc_key_akira]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_akira (scripts/gen-dev-keys.sh)
    environment:
      AUTH_KEY_FILE: /run/secrets/svc_key_akira   # ADR-103; AUTH_ENABLED is set per service in S-IRON-GATE Phases 5-7
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16M
    command: ["--config", "/etc/unheaded/akira.yaml", "--wotan", "wotan:18000", "--node", "${KINGDOM_NODE:-west}"]
    volumes:
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
