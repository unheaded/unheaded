# =============================================================================
# docker-compose.yml — Unheaded Kingdom Dev Stack
# =============================================================================
# WHAT: Full-stack development environment for Unheaded
# WHY:  E2E integration testing, service mesh validation, eBPF dev
# WHO:  Architect (owner), Developer (consumer)
# DECISION: S26 Open Question — Docker for dev, LXD for prod (reconcile in Age 2)
# =============================================================================
# USAGE:
#   docker compose up -d                    # Start all services
#   docker compose up -d traefik victoria   # Start infra only
#   docker compose ps                       # Check status
#   docker compose logs -f <service>        # Tail logs
#   docker compose down                     # Stop all
#   docker compose down -v                  # Stop + remove volumes (DESTRUCTIVE)
# =============================================================================

name: unheaded-dev

# =============================================================================
# NETWORK FABRIC (Dev approximation of EVPN-VXLAN)
# =============================================================================
# WireGuard IPv6 Overlay Integration (S77):
#   The Kingdom overlay uses fd00:dead:beef::/48 over WireGuard (wg0).
#   WEST = fd00:dead:beef::1, EAST = fd00:dead:beef::2.
#
#   For containers needing cross-host overlay access:
#     Option A: network_mode: host (simplest, container uses host's wg0)
#     Option B: Add IPv6 routing via host — overlay routes are installed by
#               wg-quick PostUp rules. Containers on the 'data' network can
#               reach fd00:dead:beef::/48 through the host routing table.
#     Option C: macvlan on wg0 (advanced, per-container overlay addresses)
#
#   Docker IPv6 pool narrowed to fd00:dead:beef:0:d::/80 to avoid conflict
#   with the overlay /48. Update /etc/docker/daemon.json:
#     { "ipv6": true, "fixed-cidr-v6": "fd00:dead:beef:0:d::/80" }
# =============================================================================
# Container stdout for first-party services (thirteen, with auth) goes to the host journal (ADR-092
# step 1, as amended 2026-10-27): Vector's journald source ships it with the
# host's own units (unit = CONTAINER_NAME), and journald's SystemMaxUse /
# RuntimeMaxUse (compliance fix journald-caps, in every host profile) is the
# one cap. No Docker socket for Vector. Third-party images, and Vector
# itself (it must not ingest its own output), keep json-file 3x10MB caps.
x-logging-journald: &journald-logging
  driver: journald
  options: { tag: "{{.Name}}" }

networks:
  # Control plane network — service discovery, config, health
  control:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-ctrl
    labels:
      kingdom.tier: "control-plane"
      kingdom.fabric: "control"

  # Data plane network — service-to-service traffic
  data:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-data
    labels:
      kingdom.tier: "data-plane"
      kingdom.fabric: "data"

  # Observability network — metrics, logs, traces (isolated)
  observe:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-obs
    labels:
      kingdom.tier: "observability"
      kingdom.fabric: "observe"

  # Scrape network: VictoriaMetrics only (ADR-117). The half of
  # config/victoria/scrape.yml that came from Prometheus names overlay
  # addresses (fd00:dead:beef::/48 on wg0): host units that bind the overlay,
  # and everything on the second host. The three networks above are IPv4
  # only and cannot reach them; changing one of those would recreate every
  # container on it, so the scraper gets a network of its own.
  scrape:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        # 172.28.3.0/24 is the monitoring stack, .4 docker/wireguard, .5 sophia-eye.
        - subnet: 172.28.6.0/24
        # In the daemon's fixed-cidr-v6 (fd00:d0c0:e700::/48), outside the
        # overlay's /48, so it can never shadow an overlay route.
        - subnet: fd00:d0c0:e706::/64
    driver_opts:
      com.docker.network.bridge.name: br-unhe-scrape
    labels:
      kingdom.tier: "observability"
      kingdom.fabric: "scrape"

# =============================================================================
# VOLUMES (persistent dev data)
# =============================================================================
volumes:
  postgres-data:
    labels:
      kingdom.component: "the-well"
  clickhouse-data:
    labels:
      kingdom.component: "logging"
  vector-data:
    labels:
      kingdom.component: "logging"
  victoria-data:
    labels:
      kingdom.component: "metrics"
  # VictoriaMetrics' admin key (made by volume-init), outside its data volume.
  victoria-auth:
    labels:
      kingdom.component: "metrics"
  traefik-certs:
    labels:
      kingdom.component: "gateway"
  cuirass-state:
  sword-data:
  captain-data:
  architect-data:
  micromanager-data:
  kanban-data:
    labels:
      kingdom.component: "control-plane"
  # Service auth and TLS material: docs/battle-plans/S-IRON-GATE-battle-plan.md
  # (keys: secrets: below, ADR-103; TLS on every link: Phase 8, scripts/gen-dev-certs.sh).

# Service keys (ADR-103, S-IRON-GATE Phase 2): one Ed25519 private key per
# first-party service, made by scripts/gen-dev-keys.sh into configs/keys/dev
# (gitignored). Docker keeps the host file's owner and mode: run the script
# once with sudo so each key belongs to its service's uid.
secrets:
  svc_key_wotan:
    file: ./configs/keys/dev/wotan.key
  svc_key_timeguru:
    file: ./configs/keys/dev/timeguru.key
  svc_key_captain:
    file: ./configs/keys/dev/captain.key
  svc_key_architect:
    file: ./configs/keys/dev/architect.key
  svc_key_micromanager:
    file: ./configs/keys/dev/micromanager.key
  svc_key_akira:
    file: ./configs/keys/dev/akira.key
  svc_key_monad:
    file: ./configs/keys/dev/monad.key
  svc_key_sophia:
    file: ./configs/keys/dev/sophia.key
  svc_key_dashboard-backend:
    file: ./configs/keys/dev/dashboard-backend.key
  svc_key_kanban-app:
    file: ./configs/keys/dev/kanban-app.key
  svc_key_unheaded-daemon:
    file: ./configs/keys/dev/unheaded-daemon.key
  svc_key_sword:
    file: ./configs/keys/dev/sword.key
  svc_key_unheaded-auth:
    file: ./configs/keys/dev/unheaded-auth.key

# =============================================================================
# SERVICES
# =============================================================================
services:

  # =========================================================================
  # TIER 0: GATEWAY (Shield / Edge Defense)
  # =========================================================================
  traefik:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is the only copy: container stdout does not ship (ADR-092 step 8).
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: traefik:v3.3.7@sha256:2cd5cc75530c8d07ae0587c743d23eb30cae2436d07017a5ff78498b1a43d09f
    container_name: unheaded-traefik
    user: "16784:16784"   # pkg/uids; ports above 1024 inside, no capabilities
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    command:
      # --- API & Dashboard ---
      - "--api.dashboard=true"
      - "--api.insecure=true"  # Dev only — disable in prod
      # --- Entrypoints ---
      # Unprivileged ports inside: traefik runs as its own uid with no
      # capabilities; compose maps the host's 80/443 onto them.
      - "--entrypoints.web.address=:8000"
      - "--entrypoints.websecure.address=:8443"
      - "--entrypoints.websecure.http3"  # HTTP/3 + QUIC
      - "--entrypoints.grpc.address=:50051"
      # --- Provider ---
      # Routes from a file, not the Docker socket (config/traefik/dynamic.yml).
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # --- Logging ---
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
      # --- Ping / Health ---
      - "--ping=true"
      - "--ping.entryPoint=web"
      # --- Metrics ---
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--entrypoints.metrics.address=:8082"
      # --- Dashboard entrypoint (api.insecure serves the dashboard here; matches the 21000 port map) ---
      - "--entrypoints.traefik.address=:21000"
    ports:
      # Host ports are env-overridable (see .env) so the edge can coexist with a
      # host LB already on 80/443 (e.g. WEST's HAProxy). Defaults preserve 80/443.
      # Every other publish in this file names an internal address; this edge
      # is the door from outside the host, so it binds all interfaces on
      # purpose (docs/security/compose-publish-allowlist.txt). TRAEFIK_BIND
      # narrows it. No router uses the gRPC entrypoint, so it stays on loopback.
      - "${TRAEFIK_BIND:-0.0.0.0}:${TRAEFIK_HTTP_PORT:-80}:8000"         # HTTP
      - "${TRAEFIK_BIND:-0.0.0.0}:${TRAEFIK_HTTPS_PORT:-443}:8443"      # HTTPS + HTTP/3 (QUIC)
      - "${TRAEFIK_BIND:-0.0.0.0}:${TRAEFIK_HTTPS_PORT:-443}:8443/udp"  # QUIC UDP
      - "127.0.0.1:${TRAEFIK_GRPC_PORT:-50051}:50051"   # gRPC
      - "127.0.0.1:21000:21000"   # Traefik dashboard (dev only) — loopback: operator-local, not LAN
    volumes:
      - "./config/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
      - "./configs/certs/dev/ca.pem:/etc/traefik/tls/ca.pem:ro"   # S-IRON-GATE Phase 8: backends are https
      - "traefik-certs:/certs"
    networks:
      - control
      - data
      - observe
    labels:
      kingdom.armor: "shield"
      kingdom.role: "gateway"
    healthcheck:
      # `traefik healthcheck` CLI can't read CLI-flag ping config; probe the ping endpoint directly.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 1: OBSERVABILITY (Whispering Void / Vambraces)
  # =========================================================================

  # --- Metrics: VictoriaMetrics (Prometheus-compatible, efficient) ---
  # --- One-shot: named volumes owned by their service's uid (pkg/uids) ---
  # A fresh named volume is root-owned, and the services below never run as
  # root. This runs once per `up`, chowns a volume only while its top is not yet
  # owned by its service, and exits. Root, but only CAP_CHOWN and
  # CAP_DAC_READ_SEARCH (to walk the old owner's dirs), no network, read-only.
  volume-init:
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: alpine:3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    container_name: unheaded-volume-init
    user: "0:0"   # pkg/uids exception (rootByDesign in pkg/uids/compose_test.go)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    network_mode: none
    restart: "no"
    command:
      - sh
      - -ec
      - |
        own() { [ "$$(stat -c %u:%g "$$2")" = "$$1" ] || chown -R "$$1" "$$2"; }
        own 16703:16703 /volumes/victoria
        own 16707:16707 /volumes/clickhouse
        own 16706:16706 /volumes/vector
        # VictoriaMetrics' admin key, made once: delete_series, snapshots,
        # force merge, cache reset, reload, pprof and flags need it (8428 is
        # published, and those endpoints had no auth). root:16703, 0440, so
        # only victoria reads it and this one-shot can always recreate it.
        # Operator use: docker exec unheaded-victoria cat /victoria-auth/admin.key
        k=/volumes/victoria-auth
        [ -s "$$k/admin.key" ] || (umask 077; od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >"$$k/admin.key")
        chown 0:16703 "$$k" "$$k/admin.key"
        chmod 0750 "$$k"
        chmod 0440 "$$k/admin.key"
    volumes:
      - victoria-data:/volumes/victoria
      - victoria-auth:/volumes/victoria-auth
      - clickhouse-data:/volumes/clickhouse
      - vector-data:/volumes/vector

  victoria:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is the only copy: container stdout does not ship (ADR-092 step 8).
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    container_name: unheaded-victoria
    user: "16703:16703"   # pkg/uids; volume-init chowns its data volume
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-data"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
      - "-selfScrapeInterval=15s"
      - "-promscrape.config=/etc/victoria/scrape.yml"
      # VictoriaMetrics dials and listens on IPv4 only unless told otherwise.
      # Without this every overlay target in scrape.yml fails to connect
      # (proved in a throwaway container, 2026-11-11: 12 of 27 up without, 21 with).
      - "-enableTCP6"
      # Admin endpoints need the key volume-init made (writes, queries and
      # /metrics stay open: huginn and the scrapers use them).
      - "-deleteAuthKey=file:///victoria-auth/admin.key"
      - "-snapshotAuthKey=file:///victoria-auth/admin.key"
      - "-forceMergeAuthKey=file:///victoria-auth/admin.key"
      - "-forceFlushAuthKey=file:///victoria-auth/admin.key"
      - "-search.resetCacheAuthKey=file:///victoria-auth/admin.key"
      - "-reloadAuthKey=file:///victoria-auth/admin.key"
      - "-pprofAuthKey=file:///victoria-auth/admin.key"
      - "-configAuthKey=file:///victoria-auth/admin.key"
      - "-flagsAuthKey=file:///victoria-auth/admin.key"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # The write API feeds the SLO guards in Sword and chaos, so it is never on
      # the LAN. Loopback serves this host; the two lines below reach the peers.
      # UNHEADED_P2P_BIND=192.168.13.2 lets east's huginn push here, and
      # UNHEADED_OVERLAY_BIND=[fd00:dead:beef::1] lets Prometheus on either host
      # remote-write here and scrape wotan, cuirass and the dashboard. Set them
      # on the host that runs this stack (.env, or the victoria Ansible role).
      # Unset, they fall to spare loopback addresses, because docker will not
      # start a container whose published address does not exist.
      # config/victoria/scrape.yml reaches its targets at host.docker.internal,
      # docker0's gateway, so each of those services publishes its metrics port
      # there too: off the LAN, and held by check-scrape-publish.sh.
      # UNHEADED_GATEWAY_BIND if a host's docker0 differs.
      - "127.0.0.1:8428:8428"  # Prometheus-compatible API
      - "${UNHEADED_P2P_BIND:-127.0.0.2}:8428:8428"
      - "${UNHEADED_OVERLAY_BIND:-127.0.0.3}:8428:8428"
    volumes:
      - victoria-data:/victoria-data
      - victoria-auth:/victoria-auth:ro
      - ./config/victoria/scrape.yml:/etc/victoria/scrape.yml:ro
      - ./configs/certs/dev/ca.pem:/etc/victoria/tls/ca.pem:ro   # S-IRON-GATE Phase 8: scrapes are https
    networks:
      - observe
      - scrape   # IPv6, for the overlay targets in scrape.yml; see networks: above
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "metrics"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/-/healthy"]  # 127.0.0.1, not 'localhost': the answer must not depend on -enableTCP6
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # --- The Well: PostgreSQL (Kingdom Persistent Memory) ---
  postgres:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is the only copy: container stdout does not ship (ADR-092 step 8).
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: postgres:16.15-alpine  # exact tag (ADR-102): minor upgrades only after a restore drill
    container_name: unheaded-postgres
    user: "70:70"   # the image's postgres uid (owns PGDATA): no root entrypoint
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/run/postgresql:size=1M,uid=70,gid=70,mode=0775   # owned by postgres: the entrypoint chmods it
      - /tmp:size=64M
    restart: unless-stopped
    environment:
      # No database beyond the manifest's (ERDA 3.6): the legacy `unheaded`
      # database was retired 2026-10-15.
      POSTGRES_DB: postgres
      POSTGRES_USER: unheaded
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (credentials are not stored in this repo)}"
      # Fresh volumes only; the live Well was switched offline with
      # pg_checksums --enable (ERDA 4.3).
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Service-role passwords, read once by db/init.sh on an empty volume
      # (W-07). Unset = that role cannot log in; there is no default.
      APP_KANBAN_PASSWORD: ${APP_KANBAN_PASSWORD:-}
      APP_TIMEGURU_PASSWORD: ${APP_TIMEGURU_PASSWORD:-}
      APP_ZHEN_PASSWORD: ${APP_ZHEN_PASSWORD:-}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      OPS_WRITER_PASSWORD: ${OPS_WRITER_PASSWORD:-}
      OPS_READER_PASSWORD: ${OPS_READER_PASSWORD:-}
      CONFIG_ADMIN_PASSWORD: ${CONFIG_ADMIN_PASSWORD:-}
      CONFIG_READER_PASSWORD: ${CONFIG_READER_PASSWORD:-}
      HUGINN_READER_PASSWORD: ${HUGINN_READER_PASSWORD:-}
      RETENTION_RUNNER_PASSWORD: ${RETENTION_RUNNER_PASSWORD:-}
      LOG_WRITER_PASSWORD: ${LOG_WRITER_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — host clients use localhost, containers use docker DNS; keeps The Well off the LAN
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # db/init.sh is the ONLY thing in initdb.d. Mounting db/migrations there
      # too made postgres's entrypoint run every *.sql itself, alphabetically,
      # against POSTGRES_DB — the per-database schemas landed in the wrong
      # database and init failed on the first collision. Nesting the second
      # mount inside the first also made docker create the mountpoint through to
      # the host, littering db/migrations/ with a root-owned empty init.sh.
      - ./db/migrations:/migrations:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # ERDA Phase 4: the repo's server config and pg_hba (TLS only, data
      # network only), and TLS material from scripts/well/make-tls.sh,
      # which lives outside the repo.
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${WELL_TLS_DIR:-/etc/unheaded/well-tls}:/etc/postgresql/tls:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - data
    labels:
      kingdom.armor: "the-well"
      kingdom.role: "persistent-memory"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unheaded -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # --- Logging: ClickHouse (fast ingest, SQL queries) ---
  clickhouse:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is the only copy: container stdout does not ship (ADR-092 step 8).
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: clickhouse/clickhouse-server:24.12.6.70@sha256:a65ca89ddbe8e04a05036dd7d7110a203256293b407b9359130ed5e4333f45ff
    container_name: unheaded-clickhouse
    user: "16707:16707"   # pkg/uids (not the image's 101: that is _chrony on the host); volume-init chowns the data volume
    depends_on:
      volume-init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /etc/clickhouse-server/users.d:uid=16707,gid=16707,size=1M   # entrypoint writes the CLICKHOUSE_USER file here
      - /var/log/clickhouse-server:uid=16707,gid=16707,size=16M      # unused: config/clickhouse/logger.xml logs to the console
      - /tmp:size=64M
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: unheaded_logs
      CLICKHOUSE_USER: unheaded
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env - credentials are not stored in this repo}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"  # HTTP interface — loopback only (off the LAN)
      - "127.0.0.1:9000:9000"  # Native TCP — loopback only (off the LAN)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/logger.xml:/etc/clickhouse-server/config.d/logger.xml:ro
      - ./config/clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    networks:
      - observe
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "logging"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # --- Log Pipeline: Vector (eBPF events → ClickHouse) ---
  # Applies config/clickhouse/schema/*.sql on every `up` (idempotent), so an
  # existing clickhouse-data volume gets new tables too; an initdb script
  # would only ever run on an empty one.
  clickhouse-schema:
    logging:
      driver: "json-file"
      options: { max-size: "1m", max-file: "1" }
    image: clickhouse/clickhouse-server:24.12.6.70@sha256:a65ca89ddbe8e04a05036dd7d7110a203256293b407b9359130ed5e4333f45ff
    container_name: unheaded-clickhouse-schema
    user: "16708:16708"   # pkg/uids
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=8M
    restart: "no"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env - credentials are not stored in this repo}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for f in /schema/*.sql; do
          clickhouse-client --host clickhouse --user unheaded --multiquery < "$$f"
        done
    volumes:
      - ./config/clickhouse/schema:/schema:ro
    networks:
      - observe
    depends_on:
      clickhouse:
        condition: service_healthy

  # Ships the host journal to ClickHouse (config/vector/vector.yaml, ADR-092
  # step 8). Reads /var/log/journal through the journal's adm ACL (gid 4 on
  # Debian/Ubuntu; west and east checked 2026-10-19). The cursor lives on
  # vector-data so a restart resumes instead of re-reading the journal.
  vector:
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: timberio/vector:0.43.1-debian@sha256:0e3603f594a85628536d50aa2fd91128d6518b4967e23f35fd9771817633a743
    container_name: unheaded-vector
    user: "16706:16706"   # pkg/uids; volume-init chowns its data volume
    group_add:
      - "4"   # adm: read the host journal
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env - credentials are not stored in this repo}
      # The well_logs sink's bearer token for logstore-writer (the measured week).
      LOGSTORE_INGEST_TOKEN: ${LOGSTORE_INGEST_TOKEN:?set LOGSTORE_INGEST_TOKEN in .env - credentials are not stored in this repo}
    restart: unless-stopped
    volumes:
      - ./config/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./configs/certs/dev/ca.pem:/etc/vector/tls/ca.pem:ro   # the dev CA, to verify logstore-writer
      - /var/log/journal:/var/log/journal:ro
      - vector-data:/var/lib/unheaded-vector
    # Vector's metrics for monitoring/prometheus (job vector, rules/logs.yml).
    # On docker0's gateway (what host.docker.internal resolves to), not on
    # the LAN; VECTOR_METRICS_BIND if a host's docker0 differs.
    ports:
      - "${VECTOR_METRICS_BIND:-172.17.0.1}:9598:9598"
    networks:
      - observe
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "log-pipeline"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      clickhouse-schema:
        condition: service_completed_successfully
    healthcheck:
      disable: true  # image has no wget/curl and `vector top` needs a TTY; vector verified running via logs
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 2: DASHBOARD (Visor / Crest)
  # =========================================================================

  # --- Grafana: the Kingdom's only one (ADR-117). Supplements the custom dashboards. ---
  grafana:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is the only copy: container stdout does not ship (ADR-092 step 8).
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: grafana/grafana:11.5.1@sha256:5781759b3d27734d4d548fcbaf60b1180dbf4290e708f01f292faa6ae764c5e6
    container_name: unheaded-grafana
    user: "16701:16701"   # pkg/uids; state on tmpfs (it had no volume: dashboards come from provisioning)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256M
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env - credentials are not stored in this repo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_PATHS_DATA: /tmp
      GF_PATHS_PLUGINS: /tmp/plugins
      GF_PATHS_LOGS: /tmp/log
      # 11.x fetches two app plugins from grafana.com at every start (Loki
      # explore, Pyroscope; found in /tmp/plugins on west, 2026-11-11). No
      # dashboard uses a plugin: nothing is downloaded at run time.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # The provider file and the dashboards it loads (kingdom/) are one mount.
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      # 3001 to avoid conflict with Fiber on :3000. Traefik has no Grafana route,
      # so a browser on another host needs UNHEADED_LAN_BIND (see dashboard-backend).
      - "127.0.0.1:3001:3000"
      - "${UNHEADED_LAN_BIND:-127.0.0.4}:3001:3000"
    networks:
      - observe
    labels:
      kingdom.armor: "visor"
      kingdom.role: "dashboard-dev"
      traefik.enable: "false"  # Internal only
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # =========================================================================
  # TIER 3: DNS (Helm) — Dev CoreDNS for service discovery
  # =========================================================================
  coredns:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is the only copy: container stdout does not ship (ADR-092 step 8).
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: coredns/coredns:1.12.4@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1
    container_name: unheaded-coredns
    user: "16785:16785"   # pkg/uids; listens on 1053 (config/coredns/Corefile)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Not to bind (1053 is unprivileged): the image's /coredns carries this file
    # capability, and exec of such a file fails when it is outside the bounding set.
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    volumes:
      - ./config/coredns/Corefile:/etc/coredns/Corefile:ro
    ports:
      # Host-published only (other containers use Docker's internal DNS, not this).
      # Override in .env to dodge a host already on 5353 (macOS Bonjour / Pi-hole).
      - "127.0.0.1:${COREDNS_PORT:-5353}:1053/udp"
      - "127.0.0.1:${COREDNS_PORT:-5353}:1053/tcp"
    networks:
      - control
      - data
    labels:
      kingdom.armor: "helm"
      kingdom.role: "dns"
    command: ["-conf", "/etc/coredns/Corefile"]
    healthcheck:
      disable: true  # scratch image has no dig/wget to probe with; DNS resolution verified functional
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # =========================================================================
  # TIER 4: APPLICATION SERVICES (Kingdom Core)
  # =========================================================================

  # --- Wotan: Message Bus (Fae Chamber) ---
  wotan:
    logging: *journald-logging
    build:
      context: .
      target: wotan
    container_name: unheaded-wotan
    user: "16720:16720"   # pkg/uids
    secrets: [svc_key_wotan]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_wotan (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M
    # Wotan reads its log level from --log-level only; a LOG_LEVEL env var
    # here was never read.
    # Admin endpoints (/api/v1/admin/*) are off by default. To turn them on,
    # put WOTAN_ADMIN_API_KEY in /etc/unheaded/wotan/wotan.env (0600, see
    # deploy/systemd/wotan.env.example) and add "--admin"; with --admin and
    # no key Wotan exits rather than refusing every admin call:
    #   command: [..., "--admin"]
    # TLS (S-IRON-GATE Phase 8): Wotan takes its certificate from flags; HTTP
    # 18000 serves the Preferred profile, gRPC 18001 Strict (ADR-105). The
    # UNHEADED_TLS_* env below is for its healthcheck and outgoing clients.
    command: ["--log-level", "info", "--enable-tls", "--tls-cert", "/etc/unheaded/tls/wotan.pem", "--tls-key", "/etc/unheaded/tls/wotan-key.pem"]
    env_file:
      # WOTAN_ADMIN_API_KEY; 0600 on the host, never in the repo.
      - path: /etc/unheaded/wotan/wotan.env
        required: false
    environment:
      # S-IRON-GATE Phase 8 (FND-017): TLS 1.3, Strict hybrid ML-KEM, on every
      # listener and link; material from scripts/gen-dev-certs.sh (this
      # service's own dir only). No mTLS: identity is the service token.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/wotan.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/wotan-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
      AUTH_KEY_FILE: /run/secrets/svc_key_wotan   # ADR-103
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      # S-IRON-GATE Phase 7 (ADR-103 §6): every HTTP request and gRPC call
      # needs a service token for aud=wotan from one of these identities
      # (every binary that calls wotanClient.InitServiceIdentity; the list is
      # checked by services/wotan/cmd/wotan/allowlist_test.go). Auto-approve
      # then keys on the token's verified sub (configs/wotan.yaml).
      AUTH_ENABLED: "true"
      AUTH_ALLOW_CALLERS: "akira,anomaly,architect,captain,chaos-controller,dashboard-backend,ebpf-collector,gateway,heimdall,kanban-app,kev-poller,micromanager,monad,perf-benchmark,shield,sophia,sword,timeguru,trace-collector,unheaded-baseline,unheaded-cli,unheaded-daemon,zhen-agentd,zhen-claude"
      WOTAN_TOPIC_CONFIG: /etc/wotan/wotan.yaml   # auto-approve allowlist; without it every subscriber stays pending_approval
      # Under the 256M limit so the GC works harder before the kernel OOM-kills.
      # Payload is bounded by --buffer-bytes (8 MiB per room) and, for every
      # room together, --buffer-bytes-total (64 MiB): per-room budgets alone
      # let ~50 log topics hold 290 MiB of heap (OOM-killed 2026-10-18).
      GOMEMLIMIT: "200MiB"
    ports:
      - "127.0.0.1:18001:18001"     # gRPC streaming
      - "127.0.0.1:18000:18000"     # HTTP REST API
      - "${UNHEADED_GATEWAY_BIND:-172.17.0.1}:18000:18000"   # VictoriaMetrics scrape; see victoria
      - "${UNHEADED_OVERLAY_BIND:-127.0.0.3}:18000:18000"   # Prometheus scrape; see victoria
    volumes:
      - ./configs/certs/dev/wotan:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - /var/log/unheaded/wotan:/var/log/unheaded:rw
      - ./configs/wotan.yaml:/etc/wotan/wotan.yaml:ro
    networks:
      - control
      - data
    labels:
      kingdom.armor: "fae-chamber"
      kingdom.role: "message-bus"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "18000"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # --- Timeguru: Timeline Service (Oracle's Antre) ---
  timeguru:
    logging: *journald-logging
    build:
      context: .
      target: timeguru
    container_name: unheaded-timeguru
    user: "16722:16722"   # pkg/uids
    secrets: [svc_key_timeguru]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_timeguru (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M,uid=16722,gid=16722
      - /data:size=64M,uid=16722,gid=16722
    environment:
      # S-IRON-GATE Phase 8 (FND-017): TLS 1.3, Strict hybrid ML-KEM, on every
      # listener and link; material from scripts/gen-dev-certs.sh (this
      # service's own dir only). No mTLS: identity is the service token.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/timeguru.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/timeguru-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
      AUTH_KEY_FILE: /run/secrets/svc_key_timeguru   # ADR-103
      # S-IRON-GATE Phase 6: every route but /health /ready /metrics needs a
      # service token; kanban-app reads the timeline with its own, and it and
      # micromanager may write.
      AUTH_ENABLED: "true"
      AUTH_ALLOW_CALLERS: "kanban-app,micromanager"
      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      PORT: "19000"
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"   # default is localhost:18001 — inside a container that is nobody, and the stream client never falls back to HTTP
      DB_PATH: "/data/timeguru.db"
      # The timeline IS the Meta Moment: kanban renders what timeguru publishes
      # on timeline.updates. Until 2026-09-21 nothing was mounted here, so the
      # container logged "timeline file not found", served INTERNAL_ERROR on
      # /timeline, and kanban showed "No timeline data available yet" — the
      # self-hosting proof was dark in the very stack meant to demonstrate it.
      # references/ is the Git source of truth and stays read-only; the
      # JSON/YAML/TOML mirrors regenerate on the tmpfs, not in the tree.
      TIMELINE_PATH: "/references/timeline.md"
      SYNC_DIR: "/data/sync"
    volumes:
      - ./configs/certs/dev/timeguru:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - ./references:/references:ro
    ports:
      - "127.0.0.1:19000:19000"
      - "${UNHEADED_GATEWAY_BIND:-172.17.0.1}:19000:19000"   # VictoriaMetrics scrape; see victoria
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "oracle"
      kingdom.role: "timeline"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "19000"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # --- Captain: Strategy Service (Commander's Quarters) ---
  captain:
    logging: *journald-logging
    build:
      context: .
      target: captain
    container_name: unheaded-captain
    user: "16724:16724"   # pkg/uids
    secrets: [svc_key_captain]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_captain (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M
    environment:
      # S-IRON-GATE Phase 8 (FND-017): TLS 1.3, Strict hybrid ML-KEM, on every
      # listener and link; material from scripts/gen-dev-certs.sh (this
      # service's own dir only). No mTLS: identity is the service token.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/captain.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/captain-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
      AUTH_KEY_FILE: /run/secrets/svc_key_captain   # ADR-103
      # S-IRON-GATE Phase 6: every route but /health /ready /metrics needs a
      # service token from one of these callers (none calls the API today).
      AUTH_ENABLED: "true"
      AUTH_ALLOW_CALLERS: "architect,micromanager"
      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      HTTP_ADDR: "0.0.0.0:19002"
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"   # default is localhost:18001 — inside a container that is nobody, and the stream client never falls back to HTTP
      DATA_PATH: "/data"
    volumes:
      - ./configs/certs/dev/captain:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - captain-data:/data   # named volume; /data was a tmpfs, so writes vanished with the container
    ports:
      - "127.0.0.1:19002:19002"
      - "${UNHEADED_GATEWAY_BIND:-172.17.0.1}:19002:19002"   # VictoriaMetrics scrape; see victoria
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "commander"
      kingdom.role: "strategy"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "19002"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Architect: ADR Service (Sage's Lair) ---
  architect:
    logging: *journald-logging
    build:
      context: .
      target: architect
    container_name: unheaded-architect
    user: "16723:16723"   # pkg/uids
    secrets: [svc_key_architect]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_architect (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
