          cpus: "0.5"

  # unheaded-auth, the built-in OIDC issuer (ADR-103 §3, S-IRON-GATE Phase 4):
  # password login, 15-minute EdDSA tokens, JWKS. No host port: the
  # BFFs reach it on the data network at https://auth:19020 (TLS 1.3,
  # hybrid ML-KEM only, certificate from scripts/gen-dev-certs.sh; S-IRON-GATE
  # Phase 8 replaced -dev-plaintext). The users file and key come from
  # scripts/gen-dev-keys.sh (gitignored; run it with sudo so uid 16735 can
  # read both). Reload users: docker compose kill -s HUP auth.
  auth:
    logging: *journald-logging
    build:
      context: .
      target: unheaded-auth
    container_name: unheaded-auth
    user: "16735:16735"   # pkg/uids
    secrets: [svc_key_unheaded-auth]   # ADR-103: the issuer's signing key (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16M
    command: ["-listen", ":19020", "-issuer-url", "https://auth:19020", "-key-file", "/run/secrets/svc_key_unheaded-auth", "-users-file", "/etc/unheaded/auth/users.json", "-audiences", "unheaded,dashboard-backend,kanban-app,zhen-agentd"]
    environment:
      # S-IRON-GATE Phase 8 (FND-017): TLS 1.3, Strict hybrid ML-KEM, on every
      # listener and link; material from scripts/gen-dev-certs.sh (this
      # service's own dir only). No mTLS: identity is the service token.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/auth.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/auth-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
    volumes:
      - ./configs/certs/dev/auth:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      # Long form: a missing file is an error, not a directory Docker creates.
      - type: bind
        source: ./configs/auth/dev-users.json
        target: /etc/unheaded/auth/users.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - data
    labels:
      kingdom.component: "control-plane"
      kingdom.role: "auth"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "19020"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          # argon2id: 64 MiB per login, at most two at once.
          memory: 256M
          cpus: "0.5"

  # logstore-writer, the measured week's second copy of the host journal rows
  # (S-E1-LIVE Evening 16, Steps 279 and 281; ADR-117). Vector posts the rows
  # it already ships to ClickHouse, after the same redaction, to /ingest;
  # this inserts them into unheaded_ops.log_events as log_writer (INSERT and
  # one function, migration 048). ClickHouse stays the record. No host port:
  # Vector and VictoriaMetrics reach it on the observe network, it reaches
  # The Well on data. Off switch: remove Vector's well_logs sink, then
  # `docker compose stop logstore-writer`.
  logstore-writer:
    logging: *journald-logging
    build:
      context: .
      target: logstore-writer
    container_name: unheaded-logstore-writer
    user: "16756:16756"   # pkg/uids
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # TLS 1.3 with the dev CA, like every listener. Preferred, not Strict:
      # the pinned Vector links OpenSSL 3.0, which has no X25519MLKEM768, so
      # a Strict listener would refuse the one client this has. Strict comes
      # back with a Vector built on OpenSSL 3.5 or later.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_PROFILE: "preferred"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/logstore-writer.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/logstore-writer-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
      # What Vector must present as a bearer token; at least 32 bytes, or the
      # writer refuses to start.
      LOGSTORE_INGEST_TOKEN: "${LOGSTORE_INGEST_TOKEN:?set LOGSTORE_INGEST_TOKEN in .env (credentials are not stored in this repo)}"
      WELL_HOST: "postgres"
      WELL_PORT: "5432"
      WELL_USER: "log_writer"
      WELL_PASSWORD: "${LOG_WRITER_PASSWORD:?set LOG_WRITER_PASSWORD in .env (credentials are not stored in this repo)}"
      WELL_DB: "unheaded_ops"
      WELL_SSLMODE: "${WELL_SSLMODE:-require}"   # pg_hba accepts TLS only (ERDA 4.2); verify-full needs the CA below
      WELL_SSLROOTCERT: "${WELL_SSLROOTCERT:-}"   # /etc/unheaded/well-tls/ca.crt, mounted below
      # Under the 192M limit, so the GC works harder before the kernel kills.
      # Two batches of at most 8 MiB are in memory at once.
      GOMEMLIMIT: "150MiB"
    volumes:
      - ./configs/certs/dev/logstore-writer:/etc/unheaded/tls:ro   # this service's cert, key and the CA
      - ${WELL_TLS_DIR:-/etc/unheaded/well-tls}/ca.crt:/etc/unheaded/well-tls/ca.crt:ro   # The Well's CA, the certificate only
    networks:
      - data
      - observe
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "log-store-writer"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "19140"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"

  # Sword, the deploy service (S-REAL-STEEL Phase 8, D-09). Off by default
  # (profile "deploy"): it needs CUIRASS_API_KEY from a host env file that
  # is not in the repo, and it refuses to start without one. A deploy
  # window starts it by name: docker compose up -d sword.
  sword:
    logging: *journald-logging
    profiles: ["deploy"]
    build:
      context: .
      target: sword
    container_name: unheaded-sword
    user: "16746:16746"   # pkg/uids
    secrets: [svc_key_sword]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_sword (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16M
    env_file:
      # CUIRASS_API_KEY, AUTH_API_KEYS; 0600 on the host, never in the repo.
      - path: /etc/unheaded/sword/sword.env
        required: false
    environment:
      # S-IRON-GATE Phase 8 (FND-017): TLS 1.3, Strict hybrid ML-KEM, on every
      # listener and link; material from scripts/gen-dev-certs.sh (this
      # service's own dir only). No mTLS: identity is the service token.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/sword.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/sword-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
      AUTH_KEY_FILE: /run/secrets/svc_key_sword   # ADR-103; also mints its tokens for Cuirass
      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      HTTP_ADDR: ":19011"
      AUTH_ENABLED: "true"
      # S-IRON-GATE Phase 6: deployments need a service token from one of
      # these callers (or an operator key); before this list was set, every
      # service token got 403.
      AUTH_ALLOW_CALLERS: "unheaded-cli"
      CUIRASS_URL: "https://cuirass:19006"   # Phase 8: the cert names cuirass
      # Deployment history in The Well (unheaded_ops.deploy_history, migration
      # 039, S-WELL-SPRING Phase 2) as the scoped writer. Sword refuses to start
      # while 039 is not applied: apply it before rebuilding this service. The
      # first start on an empty Well imports /data/sword.json once.
      WELL_HOST: "postgres"
      WELL_USER: "ops_writer"
      WELL_PASSWORD: "${OPS_WRITER_PASSWORD:?set OPS_WRITER_PASSWORD in .env (credentials are not stored in this repo)}"
      WELL_DB: "unheaded_ops"
      WELL_SSLMODE: "${WELL_SSLMODE:-require}"   # pg_hba accepts TLS only (ERDA 4.2); verify-full needs the CA below
      WELL_SSLROOTCERT: "${WELL_SSLROOTCERT:-}"   # /etc/unheaded/well-tls/ca.crt, mounted below
      SWORD_DATA_DIR: "/data"
      VM_URL: "http://victoria:8428"
      SWORD_SLO_POLICY: "/etc/unheaded/sword/policy.yaml"
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"
    ports:
      - "127.0.0.1:19011:19011"
      - "${UNHEADED_GATEWAY_BIND:-172.17.0.1}:19011:19011"   # VictoriaMetrics scrape; see victoria
    volumes:
      - ${WELL_TLS_DIR:-/etc/unheaded/well-tls}/ca.crt:/etc/unheaded/well-tls/ca.crt:ro   # The Well's CA, the certificate only
      - ./configs/certs/dev/sword:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - sword-data:/data
      - ./observability/alerting/policy.yaml:/etc/unheaded/sword/policy.yaml:ro
    networks:
      - control
      - data
      - observe
    depends_on:
      cuirass:
        condition: service_healthy
      postgres:
        condition: service_started
    labels:
      kingdom.armor: "sword"
      kingdom.role: "deploy"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "19011"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

# =============================================================================
# LABELS LEGEND
# =============================================================================
# kingdom.armor   = Which armor piece this maps to
# kingdom.role    = Specific function within that armor
# kingdom.tier    = Architecture tier (control-plane, data-plane, observability)
# kingdom.fabric  = Network fabric membership
# =============================================================================
