      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      PORT: "20001"
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"   # default is localhost:18001 — inside a container that is nobody, and the stream client never falls back to HTTP
      TIMEGURU_ADDR: "timeguru:19000"
      DATA_DIR: "/data"
      WELL_HOST: "postgres"
      WELL_PORT: "5432"
      # The scoped role, never the superuser (FND-008, ERDA W-02): CRUD on
      # kanban_tasks only; the table comes from db/migrations, not startup DDL.
      WELL_USER: "app_kanban"
      WELL_PASSWORD: "${APP_KANBAN_PASSWORD:?set APP_KANBAN_PASSWORD in .env (credentials are not stored in this repo)}"
      WELL_DB: "unheaded_app"
      WELL_SSLMODE: "require"   # pg_hba accepts TLS only (ERDA 4.2)
    volumes:
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - kanban-data:/data   # named volume; /data was a tmpfs, so writes vanished with the container
    ports:
      - "20001:20001"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
      timeguru:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      kingdom.armor: "meta-moment"
      kingdom.role: "kanban"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:20001/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Cuirass: Control Plane Daemon ---
  cuirass:
    logging: *journald-logging
    build:
      context: .
      target: cuirass
    container_name: unheaded-cuirass
    user: "16740:16740"   # pkg/uids
    secrets: [svc_key_unheaded-daemon]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_unheaded-daemon (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M
    environment:
      AUTH_KEY_FILE: /run/secrets/svc_key_unheaded-daemon   # ADR-103
      # S-IRON-GATE Phase 5: writes need a service token from an allowlisted
      # caller (reads under /api/v1/info and /api/v1/state stay open).
      AUTH_ENABLED: "true"
      AUTH_ALLOW_CALLERS: "sword,unheaded-cli,dashboard-backend"
      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      HEALTH_REPORT_SERVICE: cuirass        # its name on Akira's ballot in this stack (config/akira/akira.yaml)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      HTTP_ADDR: ":19006"
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"   # default is localhost:18001 — inside a container that is nobody, and the stream client never falls back to HTTP
    ports:
      - "19006:19006"
    volumes:
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - cuirass-state:/var/lib/unheaded   # its own volume (owned 16740 from the image), not the host's whole /var/lib/unheaded
      - /var/log/unheaded/cuirass:/var/log/unheaded:rw
    networks:
      - control
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "cuirass"
      kingdom.role: "control-plane"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19006/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # unheaded-auth, the built-in OIDC issuer (ADR-103 §3, S-IRON-GATE Phase 4):
  # password login, 15-minute EdDSA tokens, JWKS. No host port: the
  # dashboard BFF reaches it on the data network. Dev only: plain HTTP
  # (-dev-plaintext) until TLS lands (Phase 8); services' JWKS verifiers
  # accept plain http to loopback only, so nothing verifies its tokens over
  # this network before then. The users file and key come from
  # scripts/gen-dev-keys.sh (gitignored; run it with sudo so uid 16735 can
  # read both). Reload users: docker compose kill -s HUP auth.
  auth:
    logging: *journald-logging
    build:
      context: .
      target: unheaded-auth
    container_name: unheaded-auth
    user: "16735:16735"   # pkg/uids
    secrets: [svc_key_unheaded-auth]   # ADR-103: the issuer's signing key (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16M
    command: ["-listen", ":19020", "-issuer-url", "http://auth:19020", "-key-file", "/run/secrets/svc_key_unheaded-auth", "-users-file", "/etc/unheaded/auth/users.json", "-dev-plaintext"]
    volumes:
      # Long form: a missing file is an error, not a directory Docker creates.
      - type: bind
        source: ./configs/auth/dev-users.json
        target: /etc/unheaded/auth/users.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - data
    labels:
      kingdom.component: "control-plane"
      kingdom.role: "auth"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19020/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          # argon2id: 64 MiB per login, at most two at once.
          memory: 256M
          cpus: "0.5"

  # Sword, the deploy service (S-REAL-STEEL Phase 8, D-09). Off by default
  # (profile "deploy"): it needs CUIRASS_API_KEY from a host env file that
  # is not in the repo, and it refuses to start without one. A deploy
  # window starts it by name: docker compose up -d sword.
  sword:
    logging: *journald-logging
    profiles: ["deploy"]
    build:
      context: .
      target: sword
    container_name: unheaded-sword
    user: "16746:16746"   # pkg/uids
    secrets: [svc_key_sword]   # ADR-103: own Ed25519 key at /run/secrets/svc_key_sword (scripts/gen-dev-keys.sh)
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16M
    env_file:
      # CUIRASS_API_KEY, AUTH_API_KEYS; 0600 on the host, never in the repo.
      - path: /etc/unheaded/sword/sword.env
        required: false
    environment:
      AUTH_KEY_FILE: /run/secrets/svc_key_sword   # ADR-103; AUTH_ENABLED is set per service in S-IRON-GATE Phases 5-7
      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      HTTP_ADDR: ":19011"
      AUTH_ENABLED: "true"
      CUIRASS_URL: "http://cuirass:19006"
      SWORD_DATA_DIR: "/data"
      VM_URL: "http://victoria:8428"
      SWORD_SLO_POLICY: "/etc/unheaded/sword/policy.yaml"
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"
    ports:
      - "19011:19011"
    volumes:
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - sword-data:/data
      - ./observability/alerting/policy.yaml:/etc/unheaded/sword/policy.yaml:ro
    networks:
      - control
      - data
      - observe
    depends_on:
      cuirass:
        condition: service_healthy
    labels:
      kingdom.armor: "sword"
      kingdom.role: "deploy"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19011/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

# =============================================================================
# LABELS LEGEND
# =============================================================================
# kingdom.armor   = Which armor piece this maps to
# kingdom.role    = Specific function within that armor
# kingdom.tier    = Architecture tier (control-plane, data-plane, observability)
# kingdom.fabric  = Network fabric membership
# =============================================================================
