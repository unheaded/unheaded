# =============================================================================
# docker-compose.yml — Unheaded Kingdom Dev Stack
# =============================================================================
# WHAT: Full-stack development environment for Unheaded
# WHY:  E2E integration testing, service mesh validation, eBPF dev
# WHO:  Architect (owner), Developer (consumer)
# DECISION: S26 Open Question — Docker for dev, LXD for prod (reconcile in Age 2)
# =============================================================================
# USAGE:
#   docker compose up -d                    # Start all services
#   docker compose up -d traefik victoria   # Start infra only
#   docker compose ps                       # Check status
#   docker compose logs -f <service>        # Tail logs
#   docker compose down                     # Stop all
#   docker compose down -v                  # Stop + remove volumes (DESTRUCTIVE)
# =============================================================================

name: unheaded-dev

# =============================================================================
# NETWORK FABRIC (Dev approximation of EVPN-VXLAN)
# =============================================================================
# WireGuard IPv6 Overlay Integration (S77):
#   The Kingdom overlay uses fd00:dead:beef::/48 over WireGuard (wg0).
#   WEST = fd00:dead:beef::1, EAST = fd00:dead:beef::2.
#
#   For containers needing cross-host overlay access:
#     Option A: network_mode: host (simplest, container uses host's wg0)
#     Option B: Add IPv6 routing via host — overlay routes are installed by
#               wg-quick PostUp rules. Containers on the 'data' network can
#               reach fd00:dead:beef::/48 through the host routing table.
#     Option C: macvlan on wg0 (advanced, per-container overlay addresses)
#
#   Docker IPv6 pool narrowed to fd00:dead:beef:0:d::/80 to avoid conflict
#   with the overlay /48. Update /etc/docker/daemon.json:
#     { "ipv6": true, "fixed-cidr-v6": "fd00:dead:beef:0:d::/80" }
# =============================================================================
networks:
  # Control plane network — service discovery, config, health
  control:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-ctrl
    labels:
      kingdom.tier: "control-plane"
      kingdom.fabric: "control"

  # Data plane network — service-to-service traffic
  data:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-data
    labels:
      kingdom.tier: "data-plane"
      kingdom.fabric: "data"

  # Observability network — metrics, logs, traces (isolated)
  observe:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
    driver_opts:
      com.docker.network.bridge.name: br-unhe-obs
    labels:
      kingdom.tier: "observability"
      kingdom.fabric: "observe"

# =============================================================================
# VOLUMES (persistent dev data)
# =============================================================================
volumes:
  postgres-data:
    labels:
      kingdom.component: "the-well"
  clickhouse-data:
    labels:
      kingdom.component: "logging"
  victoria-data:
    labels:
      kingdom.component: "metrics"
  traefik-certs:
    labels:
      kingdom.component: "gateway"
  cuirass-state:
    labels:
      kingdom.component: "control-plane"
  # mTLS certificates volume — generated by scripts/gen-dev-certs.sh
  # Mount into services when UNHEADED_TLS_ENABLED=true
  # Example service volume mount:
  #   volumes:
  #     - ./dev-certs:/etc/unheaded/tls:ro
  # Example service environment:
  #   environment:
  #     UNHEADED_TLS_ENABLED: "true"
  #     UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
  #     UNHEADED_TLS_CERT: /etc/unheaded/tls/<service>.pem
  #     UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/<service>-key.pem
  #     UNHEADED_TLS_MTLS_ENABLED: "true"

# =============================================================================
# SERVICES
# =============================================================================
services:

  # =========================================================================
  # TIER 0: GATEWAY (Shield / Edge Defense)
  # =========================================================================
  traefik:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: traefik:v3.3.7
    container_name: unheaded-traefik
    user: "16784:16784"   # pkg/uids; ports above 1024 inside, no capabilities
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    command:
      # --- API & Dashboard ---
      - "--api.dashboard=true"
      - "--api.insecure=true"  # Dev only — disable in prod
      # --- Entrypoints ---
      # Unprivileged ports inside: traefik runs as its own uid with no
      # capabilities; compose maps the host's 80/443 onto them.
      - "--entrypoints.web.address=:8000"
      - "--entrypoints.websecure.address=:8443"
      - "--entrypoints.websecure.http3"  # HTTP/3 + QUIC
      - "--entrypoints.grpc.address=:50051"
      # --- Provider ---
      # Routes from a file, not the Docker socket (config/traefik/dynamic.yml).
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # --- Logging ---
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
      # --- Ping / Health ---
      - "--ping=true"
      - "--ping.entryPoint=web"
      # --- Metrics ---
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--entrypoints.metrics.address=:8082"
      # --- Dashboard entrypoint (api.insecure serves the dashboard here; matches the 21000 port map) ---
      - "--entrypoints.traefik.address=:21000"
    ports:
      # Host ports are env-overridable (see .env) so the edge can coexist with a
      # host LB already on 80/443 (e.g. WEST's HAProxy). Defaults preserve 80/443.
      - "${TRAEFIK_HTTP_PORT:-80}:8000"         # HTTP
      - "${TRAEFIK_HTTPS_PORT:-443}:8443"      # HTTPS + HTTP/3 (QUIC)
      - "${TRAEFIK_HTTPS_PORT:-443}:8443/udp"  # QUIC UDP
      - "${TRAEFIK_GRPC_PORT:-50051}:50051"   # gRPC
      - "127.0.0.1:21000:21000"   # Traefik dashboard (dev only) — loopback: operator-local, not LAN
    volumes:
      - "./config/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
      - "traefik-certs:/certs"
    networks:
      - control
      - data
      - observe
    labels:
      kingdom.armor: "shield"
      kingdom.role: "gateway"
    healthcheck:
      # `traefik healthcheck` CLI can't read CLI-flag ping config; probe the ping endpoint directly.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 1: OBSERVABILITY (Whispering Void / Vambraces)
  # =========================================================================

  # --- Metrics: VictoriaMetrics (Prometheus-compatible, efficient) ---
  # --- One-shot: named volumes owned by their service's uid (pkg/uids) ---
  # A fresh named volume is root-owned, and the services below never run as
  # root. This runs once per `up`, chowns a volume only while its top is not yet
  # owned by its service, and exits. Root, but only CAP_CHOWN and
  # CAP_DAC_READ_SEARCH (to walk the old owner's dirs), no network, read-only.
  volume-init:
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: alpine:3.24
    container_name: unheaded-volume-init
    user: "0:0"   # pkg/uids exception (rootByDesign in pkg/uids/compose_test.go)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    network_mode: none
    restart: "no"
    command:
      - sh
      - -ec
      - |
        own() { [ "$$(stat -c %u:%g "$$2")" = "$$1" ] || chown -R "$$1" "$$2"; }
        own 16703:16703 /volumes/victoria
        own 16707:16707 /volumes/clickhouse
    volumes:
      - victoria-data:/volumes/victoria
      - clickhouse-data:/volumes/clickhouse

  victoria:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: victoriametrics/victoria-metrics:v1.108.1
    container_name: unheaded-victoria
    user: "16703:16703"   # pkg/uids; volume-init chowns its data volume
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-data"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
      - "-selfScrapeInterval=15s"
      - "-promscrape.config=/etc/victoria/scrape.yml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8428:8428"  # Prometheus-compatible API
    volumes:
      - victoria-data:/victoria-data
      - ./config/victoria/scrape.yml:/etc/victoria/scrape.yml:ro
    networks:
      - observe
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "metrics"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/-/healthy"]  # 127.0.0.1: 'localhost' resolves to ::1 where VM isn't listening
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # --- The Well: PostgreSQL (Kingdom Persistent Memory) ---
  postgres:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: postgres:16.15-alpine  # exact tag (ADR-102): minor upgrades only after a restore drill
    container_name: unheaded-postgres
    user: "70:70"   # the image's postgres uid (owns PGDATA): no root entrypoint
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/run/postgresql:size=1M
      - /tmp:size=64M
    restart: unless-stopped
    environment:
      # No database beyond the manifest's (ERDA 3.6): the legacy `unheaded`
      # database was retired 2026-10-15.
      POSTGRES_DB: postgres
      POSTGRES_USER: unheaded
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (credentials are not stored in this repo)}"
      # Fresh volumes only; the live Well was switched offline with
      # pg_checksums --enable (ERDA 4.3).
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Service-role passwords, read once by db/init.sh on an empty volume
      # (W-07). Unset = that role cannot log in; there is no default.
      APP_KANBAN_PASSWORD: ${APP_KANBAN_PASSWORD:-}
      APP_TIMEGURU_PASSWORD: ${APP_TIMEGURU_PASSWORD:-}
      APP_ZHEN_PASSWORD: ${APP_ZHEN_PASSWORD:-}
      OPS_WRITER_PASSWORD: ${OPS_WRITER_PASSWORD:-}
      OPS_READER_PASSWORD: ${OPS_READER_PASSWORD:-}
      CONFIG_ADMIN_PASSWORD: ${CONFIG_ADMIN_PASSWORD:-}
      CONFIG_READER_PASSWORD: ${CONFIG_READER_PASSWORD:-}
      HUGINN_READER_PASSWORD: ${HUGINN_READER_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — host clients use localhost, containers use docker DNS; keeps The Well off the LAN
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # db/init.sh is the ONLY thing in initdb.d. Mounting db/migrations there
      # too made postgres's entrypoint run every *.sql itself, alphabetically,
      # against POSTGRES_DB — the per-database schemas landed in the wrong
      # database and init failed on the first collision. Nesting the second
      # mount inside the first also made docker create the mountpoint through to
      # the host, littering db/migrations/ with a root-owned empty init.sh.
      - ./db/migrations:/migrations:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # ERDA Phase 4: the repo's server config and pg_hba (TLS only, data
      # network only), and TLS material from scripts/well/make-tls.sh,
      # which lives outside the repo.
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${WELL_TLS_DIR:-/etc/unheaded/well-tls}:/etc/postgresql/tls:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - data
    labels:
      kingdom.armor: "the-well"
      kingdom.role: "persistent-memory"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unheaded -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # --- Logging: ClickHouse (fast ingest, SQL queries) ---
  clickhouse:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: clickhouse/clickhouse-server:24.12.6.70
    container_name: unheaded-clickhouse
    user: "16707:16707"   # pkg/uids (not the image's 101: that is _chrony on the host); volume-init chowns the data volume
    depends_on:
      volume-init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /etc/clickhouse-server/users.d:uid=16707,gid=16707,size=1M   # entrypoint writes the CLICKHOUSE_USER file here
      - /var/log/clickhouse-server:uid=16707,gid=16707,size=16M      # unused: config/clickhouse/logger.xml logs to the console
      - /tmp:size=64M
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: unheaded_logs
      CLICKHOUSE_USER: unheaded
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env - credentials are not stored in this repo}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"  # HTTP interface — loopback only (off the LAN)
      - "127.0.0.1:9000:9000"  # Native TCP — loopback only (off the LAN)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/logger.xml:/etc/clickhouse-server/config.d/logger.xml:ro
    networks:
      - observe
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "logging"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # --- Log Pipeline: Vector (eBPF events → ClickHouse) ---
  vector:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: timberio/vector:0.43.1-debian
    container_name: unheaded-vector
    user: "16706:16706"   # pkg/uids
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/lib/vector:uid=16706,gid=16706,size=64M   # data_dir (checkpoints)
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env - credentials are not stored in this repo}
    restart: unless-stopped
    volumes:
      - ./config/vector/vector.yaml:/etc/vector/vector.yaml:ro
    networks:
      - observe
      - data
    labels:
      kingdom.armor: "vambraces"
      kingdom.role: "log-pipeline"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      disable: true  # image has no wget/curl and `vector top` needs a TTY; vector verified running via logs
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # =========================================================================
  # TIER 2: DASHBOARD (Visor / Crest)
  # =========================================================================

  # --- Grafana for dev visualization (supplements custom dashboards) ---
  grafana:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: grafana/grafana:11.5.1
    container_name: unheaded-grafana
    user: "16701:16701"   # pkg/uids; state on tmpfs (it had no volume: dashboards come from provisioning)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256M
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env - credentials are not stored in this repo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_PATHS_DATA: /tmp
      GF_PATHS_PLUGINS: /tmp/plugins
      GF_PATHS_LOGS: /tmp/log
    volumes:
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"  # 3001 to avoid conflict with Fiber on :3000
    networks:
      - observe
    labels:
      kingdom.armor: "visor"
      kingdom.role: "dashboard-dev"
      traefik.enable: "false"  # Internal only
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # =========================================================================
  # TIER 3: DNS (Helm) — Dev CoreDNS for service discovery
  # =========================================================================
  coredns:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    image: coredns/coredns:1.12.0
    container_name: unheaded-coredns
    user: "16785:16785"   # pkg/uids; listens on 1053 (config/coredns/Corefile)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Not to bind (1053 is unprivileged): the image's /coredns carries this file
    # capability, and exec of such a file fails when it is outside the bounding set.
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    volumes:
      - ./config/coredns/Corefile:/etc/coredns/Corefile:ro
    ports:
      # Host-published only (other containers use Docker's internal DNS, not this).
      # Override in .env to dodge a host already on 5353 (macOS Bonjour / Pi-hole).
      - "${COREDNS_PORT:-5353}:1053/udp"
      - "${COREDNS_PORT:-5353}:1053/tcp"
    networks:
      - control
      - data
    labels:
      kingdom.armor: "helm"
      kingdom.role: "dns"
    command: ["-conf", "/etc/coredns/Corefile"]
    healthcheck:
      disable: true  # scratch image has no dig/wget to probe with; DNS resolution verified functional
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # =========================================================================
  # TIER 4: APPLICATION SERVICES (Kingdom Core)
  # =========================================================================

  # --- Wotan: Message Bus (Fae Chamber) ---
  wotan:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    build:
      context: .
      target: wotan
    container_name: unheaded-wotan
    user: "16720:16720"   # pkg/uids
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M
    environment:
      LOG_LEVEL: info
      WOTAN_TOPIC_CONFIG: /etc/wotan/wotan.yaml   # auto-approve allowlist; without it every subscriber stays pending_approval
    ports:
      - "18001:18001"     # gRPC streaming
      - "18000:18000"     # HTTP REST API
    volumes:
      - /var/log/unheaded/wotan:/var/log/unheaded:rw
      - ./configs/wotan.yaml:/etc/wotan/wotan.yaml:ro
    networks:
      - control
      - data
    labels:
      kingdom.armor: "fae-chamber"
      kingdom.role: "message-bus"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:18000/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # --- Timeguru: Timeline Service (Oracle's Antre) ---
  timeguru:
    logging:
      # ADR-092: the cap lives here, not in an untracked host daemon.json.
      # 3x10MB is a local buffer; Vector ships stdout to ClickHouse.
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    build:
      context: .
      target: timeguru
    container_name: unheaded-timeguru
    user: "16722:16722"   # pkg/uids
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M,uid=16722,gid=16722
      - /data:size=64M,uid=16722,gid=16722
    environment:
      PORT: "19000"
      WOTAN_ADDR: "wotan:18000"
      WOTAN_GRPC_ADDR: "wotan:18001"   # default is localhost:18001 — inside a container that is nobody, and the stream client never falls back to HTTP
      DB_PATH: "/data/timeguru.db"
      # The timeline IS the Meta Moment: kanban renders what timeguru publishes
      # on timeline.updates. Until 2026-09-21 nothing was mounted here, so the
      # container logged "timeline file not found", served INTERNAL_ERROR on
      # /timeline, and kanban showed "No timeline data available yet" — the
      # self-hosting proof was dark in the very stack meant to demonstrate it.
      # references/ is the Git source of truth and stays read-only; the
      # JSON/YAML/TOML mirrors regenerate on the tmpfs, not in the tree.
      TIMELINE_PATH: "/references/timeline.md"
      SYNC_DIR: "/data/sync"
    volumes:
      - ./references:/references:ro
    ports:
      - "19000:19000"
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
