    command: ["-port", "19003"]
    volumes:
      - ./configs/certs/dev/micromanager:/etc/unheaded/tls:ro   # Phase 8: this service's cert, key and the CA
      - ./configs/trust.d/dev:/etc/unheaded/trust.d:ro   # ADR-103: every service's public key
      - micromanager-data:/data   # named volume; /data was a tmpfs, so writes vanished with the container
    ports:
      - "127.0.0.1:19003:19003"
      - "${UNHEADED_GATEWAY_BIND:-172.17.0.1}:19003:19003"   # VictoriaMetrics scrape; see victoria
    networks:
      - data
    depends_on:
      wotan:
        condition: service_healthy
    labels:
      kingdom.armor: "war-room"
      kingdom.role: "execution"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "19003"]   # https with the CA (cmd/healthprobe)
      interval: 10s
      timeout: 5s
      retries: 5
