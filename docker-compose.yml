      AUTH_ENABLED: "true"
      AUTH_ALLOW_CALLERS: "captain,architect"
      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      MICROMANAGER_DATA_DIR: "/data"   # its state file; state was memory-only, lost on every restart
      # micromanager was the only service with no WOTAN_* env, so it ran in
