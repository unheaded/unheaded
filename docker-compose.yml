    tmpfs:
      - /tmp:size=32M
    environment:
      # S-IRON-GATE Phase 8 (FND-017): TLS 1.3, Strict hybrid ML-KEM, on every
      # listener and link; material from scripts/gen-dev-certs.sh (this
      # service's own dir only). No mTLS: identity is the service token.
      UNHEADED_TLS_ENABLED: "true"
      UNHEADED_TLS_CA_CERT: /etc/unheaded/tls/ca.pem
      UNHEADED_TLS_CERT: /etc/unheaded/tls/architect.pem
      UNHEADED_TLS_KEY_FILE: /etc/unheaded/tls/architect-key.pem
      UNHEADED_TLS_MTLS_ENABLED: "false"
      AUTH_KEY_FILE: /run/secrets/svc_key_architect   # ADR-103
      # S-IRON-GATE Phase 6: every route but /health /ready /metrics needs a
      # service token from one of these callers (none calls the API today).
      AUTH_ENABLED: "true"
      AUTH_ALLOW_CALLERS: "captain,micromanager"
      KINGDOM_NODE: ${KINGDOM_NODE:-west}   # host on its system.health.reports votes (pkg/healthreport, ADR-029)
      AUTH_TRUST_DIR: /etc/unheaded/trust.d
      ARCHITECT_DATA_DIR: "/data"   # its state file; state was memory-only, lost on every restart
      WOTAN_ADDR: "wotan:18000"
