version: '3.8'

services:
  # ============================================================================
  # NATS Message Bus (foundational service)
  # ============================================================================
  wotan:
    image: unheaded-wotan:${VERSION:-dev}
    container_name: unheaded-wotan
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::101
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_PORT: "4222"
      NATS_HTTP_PORT: "8222"
      UNHEADED_ROLE: ${UNHEADED_HOST_ROLE:-forge}
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 1G
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8222"
      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - wotan-data:/var/lib/wotan

  # ============================================================================
  # Core Protocol Services
  # ============================================================================
  monad:
    image: unheaded-monad:${VERSION:-dev}
    container_name: unheaded-monad
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::102
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: "nats://wotan:4222"
      MONAD_PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      wotan:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5000"
      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - monad-data:/var/lib/monad

  sophia:
    image: unheaded-sophia:${VERSION:-dev}
    container_name: unheaded-sophia
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::103
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: "nats://wotan:4222"
      SOPHIA_PORT: "5001"
    ports:
      - "5001:5001"
    depends_on:
      wotan:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5001"
      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - sophia-data:/var/lib/sophia

  anamnesis:
    image: unheaded-anamnesis:${VERSION:-dev}
    container_name: unheaded-anamnesis
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::104
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: "nats://wotan:4222"
      ANAMNESIS_PORT: "5002"
    ports:
      - "5002:5002"
    depends_on:
      wotan:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5002"
      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - anamnesis-data:/var/lib/anamnesis

  # ============================================================================
  # Core Daemons
  # ============================================================================
  shield:
    image: unheaded-shield:${VERSION:-dev}
    container_name: unheaded-shield
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::201
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: "nats://wotan:4222"
      SHIELD_PORT: "6000"
    ports:
      - "6000:6000"
    depends_on:
      monad:
        condition: service_healthy
      sophia:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6000"
      prometheus.io/path: "/metrics"
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    cap_add:
      - BPF
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    privileged: false
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - shield-data:/var/lib/shield

  unheaded-daemon:
