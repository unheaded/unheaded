      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - lore-data:/var/lib/lore

  busboy:
    image: unheaded-busboy:${VERSION:-dev}
    container_name: unheaded-busboy
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::603
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: "nats://wotan:4222"
      BUSBOY_PORT: "8010"
    ports:
      - "8010:8010"
    depends_on:
      unheaded-daemon:
