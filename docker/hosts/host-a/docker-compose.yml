#
# host-a ("The Forge") — Docker deployment
#
# STATUS: THIS STACK HAS NEVER BEEN ABLE TO START. Use the LXD path instead —
# lxd/containers/ and lxd/profiles/unheaded-firewall.yaml are complete and are
# the deployment route that actually works for this tier.
#
# Two blockers, both present since this file was created (695d0ba4, 2026-02-26):
#
#   1. INVALID COMPOSE. `shield` and `unheaded-daemon` each declare BOTH
#      `network_mode: host` AND a `networks:` block with a static IPv6.
#      Those are mutually exclusive, so `docker compose config` refuses the
#      project outright — nothing parses, let alone runs.
#
#      Which one is correct is a real decision, not a typo: shield's
#      cap_add [BPF, NET_ADMIN, SYS_ADMIN, SYS_RESOURCE] exists to attach XDP,
#      and XDP in a container netns can only see the veth, not the host NIC.
#      But host mode also breaks `NATS_URL: nats://wotan:4222` (no Docker DNS in
#      the host namespace) and makes the `ports:` mappings meaningless.
#      It is an exposure change either way — it is not being guessed here.
#
#   2. MISSING BUILD CONTEXTS. `opnsense` -> ../firewall/opnsense and
#      `frr` -> ../firewall/frr. docker/hosts/firewall/ has never existed in
#      this repo. routing/frr/Dockerfile does exist, but it is not a drop-in
#      replacement: it does `COPY . /src/frr` and builds FRR from upstream
#      source, so it needs a context containing the FRR source tree
#      (its own comment says ~/tmp/frr-master/), not the config directory.
#
# See "D11" in docs/battle-plans/STAGING-LADDER-DECISIONS.md. Left in place
# rather than deleted: it is the record of the intended Docker topology, and
# every service definition below except the ones named above is sound.
version: '3.8'
services:
  opnsense:
    build:
      context: ../firewall/opnsense
      dockerfile: Dockerfile
    container_name: unheaded-opnsense
    hostname: opnsense-forge
    restart: unless-stopped
    privileged: true
    devices:
    - /dev/kvm:/dev/kvm
    networks:
      wan:
        ipv4_address: ${OPNSENSE_WAN_IP:-192.168.1.2}
      unheaded:
        ipv4_address: 10.20.0.1
    volumes:
    - opnsense-images:/images
    - opnsense-data:/var/lib/opnsense
    - ${OPNSENSE_IMG_PATH:-${HOME}/tmp/opnsense/OPNsense-26.1.2-serial-amd64.img.bz2}:/images/opnsense.img.bz2:ro
    environment:
      OPNSENSE_MEM: ${OPNSENSE_MEM:-4096}
      OPNSENSE_CPUS: ${OPNSENSE_CPUS:-4}
    cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_ADMIN
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - nc -z 10.20.0.1 443 || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '8080'
      prometheus.io/path: /metrics
      unheaded.role: firewall
      unheaded.tier: ingress
  frr:
    build:
      context: ../firewall/frr
      dockerfile: Dockerfile
    container_name: unheaded-frr
    hostname: frr-forge
    restart: unless-stopped
    privileged: false
    networks:
    - unheaded
    cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_ADMIN
    - NET_BROADCAST
    security_opt:
    - no-new-privileges:false
    volumes:
    - frr-data:/etc/frr
    - frr-run:/var/run/frr
    - ${FRR_CONF:-./../../../routing/frr/frr.conf}:/etc/frr/frr.conf:ro
    depends_on:
      opnsense:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - vtysh
      - -c
      - show bgp summary
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '2601'
      unheaded.role: routing
      unheaded.tier: ingress
  wotan:
    image: unheaded-wotan:${VERSION:-dev}
    container_name: unheaded-wotan
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::101
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_PORT: '4222'
      NATS_HTTP_PORT: '8222'
      UNHEADED_ROLE: ${UNHEADED_HOST_ROLE:-forge}
    ports:
    - 4222:4222
    - 8222:8222
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8222/healthz
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 1G
    labels:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '8222'
      prometheus.io/path: /metrics
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    volumes:
    - wotan-data:/var/lib/wotan
