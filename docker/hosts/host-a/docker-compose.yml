  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: unheaded-prometheus
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::701
    ports:
      - "9090:9090"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    container_name: unheaded-victoriametrics
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::702
    ports:
      - "8428:8428"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=${VM_RETENTION_PERIOD:-90d}"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8428/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  loki:
    image: grafana/loki:2.9.0
    container_name: unheaded-loki
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::703
    ports:
      - "3100:3100"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  grafana:
    image: grafana/grafana:10.4.0
    container_name: unheaded-grafana
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::704
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:-changeme32characterssecretkey!!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_THEME_DEFAULT_DARK_MODE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  ebpf-exporter:
    image: unheaded-ebpf-exporter:${VERSION:-dev}
    container_name: unheaded-ebpf-exporter
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::705
