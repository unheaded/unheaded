    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8010"
      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - busboy-data:/var/lib/busboy

  kingdom:
    image: unheaded-kingdom:${VERSION:-dev}
