      unheaded-daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8011"
      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - kingdom-data:/var/lib/kingdom

  blackmage:
    image: unheaded-blackmage:${VERSION:-dev}
    container_name: unheaded-blackmage
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::605
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: "nats://wotan:4222"
      BLACKMAGE_PORT: "8012"
    ports:
      - "8012:8012"
    depends_on:
      unheaded-daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
