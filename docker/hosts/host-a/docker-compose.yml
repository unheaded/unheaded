    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::604
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: "nats://wotan:4222"
      KINGDOM_PORT: "8011"
    ports:
