      prometheus.io/scrape: "true"
      prometheus.io/port: "8012"
      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_RAW
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - blackmage-data:/var/lib/blackmage

  moatghost:
    image: unheaded-moatghost:${VERSION:-dev}
    container_name: unheaded-moatghost
    restart: unless-stopped
    networks:
      unheaded:
        ipv6_address: fd00:dead:beef:1::606
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: "nats://wotan:4222"
      MOATGHOST_PORT: "8013"
    ports:
