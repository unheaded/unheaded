          memory: 512M
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8013"
      prometheus.io/path: "/metrics"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - moatghost-data:/var/lib/moatghost

  # ============================================================================
