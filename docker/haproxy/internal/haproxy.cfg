# ============================================================================
# HAProxy INTERNAL — Service-to-Service Load Balancer
# Routes traffic from edge HAProxy to per-app Nginx sidecars.
# Port: 21081 (service traffic) / 21405 (stats+metrics)
# ============================================================================

global
    log stdout format raw local0 info
    maxconn 30000
    nbthread 2

    tune.bufsize 16384
    tune.maxrewrite 4096

    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor
    retries 3

    timeout connect 3s
    timeout client  15s
    timeout server  15s
    timeout http-request 5s
    timeout http-keep-alive 3s
    timeout queue   15s
    timeout tunnel  3600s

    # --- JSON log format for Loki/Promtail ---
    log-format '{"timestamp":"%Ts.%ms","client":"%ci:%cp","frontend":"%f","backend":"%b","server":"%s","status":%ST,"bytes_read":%B,"time_request":%TR,"time_queue":%Tw,"time_connect":%Tc,"time_response":%Tr,"time_total":%Ta,"retries":%rc,"trace_id":"%[req.hdr(X-Trace-Id)]"}'

# ============================================================================
# STATS + PROMETHEUS METRICS
# ============================================================================
frontend stats
    bind *:21405
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

    http-request use-service prometheus-exporter if { path /metrics }
    monitor-uri /healthz

# ============================================================================
# SERVICE FRONTEND — Receives from Edge HAProxy
# ============================================================================
frontend fe_services
    bind *:21081
    mode http

    # --- Propagate trace ID ---
    http-request set-header X-Forwarded-By haproxy-internal

    # --- ACLs for service routing ---
    # Gnostic services
    acl is_wotan       path_beg /api/wotan
    acl is_monad       path_beg /api/monad
    acl is_sophia      path_beg /api/sophia
    acl is_anamnesis   path_beg /api/anamnesis

    # Royal Court
    acl is_timeguru    path_beg /api/timeguru
    acl is_captain     path_beg /api/captain
    acl is_micromanager path_beg /api/micromanager
    acl is_architect   path_beg /api/architect

    # Applications
    acl is_dashboard   path_beg /dashboard /doom
    acl is_kanban      path_beg /kanban

    # Control plane
    acl is_cuirass     path_beg /control /api/cuirass
    acl is_gateway     path_beg /api/gateway

    # WebSocket
    acl is_websocket   hdr(Upgrade) -i websocket

    # --- Route to per-app Nginx sidecars ---
    use_backend be_wotan        if is_wotan
    use_backend be_monad        if is_monad
    use_backend be_sophia       if is_sophia
    use_backend be_anamnesis    if is_anamnesis
    use_backend be_timeguru     if is_timeguru
    use_backend be_captain      if is_captain
    use_backend be_micromanager if is_micromanager
    use_backend be_architect    if is_architect
    use_backend be_dashboard    if is_dashboard
    use_backend be_kanban       if is_kanban
    use_backend be_cuirass      if is_cuirass
    use_backend be_gateway      if is_gateway

    default_backend be_gateway

# ============================================================================
# BACKENDS — Each points to per-app Nginx sidecar
# Pattern: Nginx sidecar on <service>-nginx:<port>
# ============================================================================

# --- Gnostic Services ---
backend be_wotan
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server wotan-nginx-1 nginx-wotan:18080 check

backend be_monad
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server monad-nginx-1 nginx-monad:19080 check

backend be_sophia
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server sophia-nginx-1 nginx-sophia:19081 check

backend be_anamnesis
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server anamnesis-nginx-1 nginx-anamnesis:19082 check

# --- Royal Court ---
backend be_timeguru
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server timeguru-nginx-1 nginx-timeguru:19090 check

backend be_captain
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server captain-nginx-1 nginx-captain:19091 check

backend be_micromanager
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server micromanager-nginx-1 nginx-micromanager:19092 check

backend be_architect
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server architect-nginx-1 nginx-architect:19093 check

# --- Applications ---
backend be_dashboard
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    timeout tunnel 3600s
    default-server inter 3s fall 3 rise 2

    server dashboard-nginx-1 nginx-dashboard:20080 check

backend be_kanban
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server kanban-nginx-1 nginx-kanban:20081 check

# --- Control Plane ---
backend be_cuirass
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 2 rise 3 maxconn 32

    server cuirass-nginx-1 nginx-cuirass:17080 check

backend be_gateway
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server gateway-nginx-1 nginx-gateway:21090 check
