# ============================================================================
# HAProxy EDGE — Network Ingress Load Balancer
# The Pauldrons' outer shell. First thing packets hit after the wire.
# Port: 21080 (HTTP) / 21443 (HTTPS+HTTP/3) / 21404 (stats+metrics)
# ============================================================================

global
    log stdout format raw local0 info
    maxconn 50000
    nbthread 4
    cpu-map auto:1/1-4 0-3

    # --- TLS ---
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.3 no-tls-tickets
    tune.ssl.default-dh-param 4096

    # --- Performance ---
    tune.bufsize 32768
    tune.maxrewrite 8192
    tune.http.maxhdr 128

    # --- Stats socket for runtime API ---
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    # --- Prometheus ---
    # Built-in Prometheus exporter endpoint
    # Requires HAProxy 2.4+ compiled with PROMEX
    module-path /usr/lib/haproxy
    # If promex not compiled in, we use stats CSV scraper instead

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    retries 3

    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue   30s
    timeout tunnel  3600s

    # --- Log format: JSON for Loki/Promtail ---
    log-format '{"timestamp":"%Ts.%ms","client":"%ci:%cp","frontend":"%f","backend":"%b","server":"%s","status":%ST,"bytes_read":%B,"time_request":%TR,"time_queue":%Tw,"time_connect":%Tc,"time_response":%Tr,"time_total":%Ta,"retries":%rc,"server_queue":%sq,"backend_queue":%bq,"http_method":"%HM","http_uri":"%HU","http_version":"%HV","ssl_version":"%sslv","ssl_cipher":"%sslc","trace_id":"%[req.hdr(X-Trace-Id)]"}'

    # --- Default error files ---
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ============================================================================
# STATS + PROMETHEUS METRICS FRONTEND
# ============================================================================
frontend stats
    bind *:21404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats admin if LOCALHOST

    # Prometheus metrics endpoint (HAProxy 2.4+ native)
    http-request use-service prometheus-exporter if { path /metrics }

    # Health check endpoint for upstream monitoring
    monitor-uri /healthz

# ============================================================================
# HTTP FRONTEND — Redirect to HTTPS
# ============================================================================
frontend fe_http
    bind *:21080
    mode http

    # ACME challenge passthrough
    acl is_acme path_beg /.well-known/acme-challenge/
    use_backend be_acme if is_acme

    # Everything else → HTTPS
    http-request redirect scheme https code 301 unless is_acme

# ============================================================================
# HTTPS FRONTEND — Main Edge Ingress
# ============================================================================
frontend fe_https
    bind *:21443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    mode http

    # --- Security Headers ---
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "0"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"

    # --- Trace ID injection (if not already present) ---
    unique-id-format %[uuid()]
    unique-id-header X-Trace-Id
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]

    # --- Rate limiting ---
    # Stick table: track request rate per source IP
    stick-table type ip size 200k expire 30s store http_req_rate(10s),conn_cur,bytes_out_rate(60s)
    http-request track-sc0 src
    # Deny if > 100 req/10s from single IP
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    # Tarpit slow attackers
    http-request tarpit if { sc_http_req_rate(0) gt 200 }

    # --- Connection limits ---
    http-request deny deny_status 429 if { sc_conn_cur(0) gt 50 }

    # --- ACLs for path-based routing ---
    acl is_api        path_beg /api/
    acl is_dashboard  path_beg /dashboard /doom
    acl is_kanban     path_beg /kanban
    acl is_websocket  hdr(Upgrade) -i websocket
    acl is_grpc       req.hdr(Content-Type) -m beg application/grpc
    acl is_control    path_beg /control /api/cuirass

    # --- Strict rate limit on control plane ---
    http-request deny deny_status 429 if is_control { sc_http_req_rate(0) gt 10 }

    # --- Backend selection ---
    use_backend be_internal_grpc    if is_grpc
    use_backend be_internal_ws      if is_websocket
    use_backend be_internal_control if is_control
    use_backend be_internal_api     if is_api
    use_backend be_internal_kanban  if is_kanban
    use_backend be_internal_dash    if is_dashboard

    default_backend be_internal_api

# ============================================================================
# BACKENDS — All point to HAProxy Internal LBs
# ============================================================================

backend be_internal_api
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200

    # Circuit breaker: mark down after 3 consecutive failures
    default-server inter 5s fall 3 rise 2 maxconn 256

    server haproxy-internal-1 haproxy-internal:21081 check

backend be_internal_control
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 maxconn 64

    server haproxy-internal-1 haproxy-internal:21081 check

backend be_internal_dash
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 maxconn 128

    server haproxy-internal-1 haproxy-internal:21081 check

backend be_internal_kanban
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 maxconn 128

    server haproxy-internal-1 haproxy-internal:21081 check

backend be_internal_ws
    mode http
    balance roundrobin
    option httpchk GET /healthz
    timeout tunnel 3600s
    timeout server 3600s
    default-server inter 5s fall 3 rise 2 maxconn 512

    server haproxy-internal-1 haproxy-internal:21081 check

backend be_internal_grpc
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 proto h2

    server haproxy-internal-1 haproxy-internal:21081 check

backend be_acme
    mode http
    server acme 127.0.0.1:8080
