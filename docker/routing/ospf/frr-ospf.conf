! FRR OSPFv3 Configuration — Unheaded Kingdom — Alternate Routing Option A
! Use: When BGP EVPN is too complex (simple 2-host, no EVPN, no AS numbers)
! Activate: scripts/routing/select-routing.sh ospf
!
! CRITICAL: OSPFv3 is transparent to IPv6 extension headers.
! Monad HbH (HOPOPT nexthdr 0x00) passes through routing layer untouched.
!
! SPDX-License-Identifier: MIT
! Copyright (c) 2024-2026 Steven Bellis. All rights reserved.

frr version 10.0
frr defaults traditional
hostname unheaded-forge
log syslog informational
log timestamp precision 6
service integrated-vtysh-config
!
! --- OSPFv3 Configuration ---
ipv6 forwarding
!
interface lo
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 passive
!
interface wg0
 ! WireGuard east-west: MTU 1380 < 1500, must ignore MTU mismatch
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 cost 10
 ipv6 ospf6 hello-interval 5
 ipv6 ospf6 dead-interval 20
 ipv6 ospf6 retransmit-interval 5
 ipv6 ospf6 transmit-delay 1
 ! MTU mismatch on WireGuard — essential for adjacency
 ipv6 ospf6 mtu-ignore
 ! BFD for fast failover (300ms detection)
 ipv6 ospf6 bfd
!
interface br-unheaded
 ! LAN bridge: passive (no hellos to containers, just advertise prefix)
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 cost 1
 ipv6 ospf6 passive
!
router ospf6
 router-id 10.20.255.1
 ! ECMP — allow multiple equal-cost paths
 maximum-paths 4
 ! Redistribute connected (loopback, LAN bridge, WireGuard)
 redistribute connected
 !
 area 0.0.0.0 range fd00:dead:beef::/48
 area 0.0.0.0 range 10.20.0.0/16
!
! BFD daemon configuration
bfd
 peer fd00:dead:beef::2 interface wg0
  receive-interval 300
  transmit-interval 300
  detect-multiplier 3
  label "ospf-wg0-peer"
 !
!
end
