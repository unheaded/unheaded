version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: unheaded-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - unheaded-telemetry
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=unheaded"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    container_name: unheaded-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - ./victoriametrics/flags.conf:/etc/victoriametrics/flags.conf:ro
      - victoriametrics-data:/victoria-metrics-data
    command:
      - '--config.file=/etc/victoriametrics/flags.conf'
    networks:
      - unheaded-telemetry
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=unheaded"

  loki:
    image: grafana/loki:2.9.0
    container_name: unheaded-loki
    ports:
      - "3100:3100"
      - "9096:9096"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - unheaded-telemetry
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=unheaded"

  promtail:
    image: grafana/promtail:2.9.0
    container_name: unheaded-promtail
    ports:
      - "9080:9080"
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - unheaded-telemetry
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=unheaded"

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: unheaded-node-exporter
    ports:
      - "9100:9100"
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.pressure'
      - '--collector.systemd'
      - '--collector.processes'
      - '--collector.filesystem'
      - '--collector.meminfo'
      - '--collector.netdev'
      - '--collector.netstat'
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=unheaded"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: unheaded-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_LOG_LEVEL=warn
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - victoriametrics
      - loki
    networks:
      - unheaded-telemetry
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=unheaded"

volumes:
  prometheus-data:
    driver: local
  victoriametrics-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  unheaded-telemetry:
    driver: bridge
