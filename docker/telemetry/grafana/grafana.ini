[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_port = 3000
http_addr = 0.0.0.0
domain = localhost
root_url = http://localhost:3000
serve_from_sub_path = false

[security]
admin_user = admin
admin_password = admin
secret_key = Ue0EpH8YGFm2nH8mK9pL5xC3vB1jQ6wR8sT0uV2yW4
disable_brute_force_login_protection = false
cookie_secure = false
cookie_samesite = lax

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[auth.proxy]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/files/01_host_overview.json
min_refresh_interval = 1s

[feature_toggles]
enable = ngalert,traceToMetrics

[unified_alerting]
enabled = true
execute_alerts = true
evaluation_timeout = 30s
notification_timeout = 30s
alerting_max_annotations = 113

[log]
level = warn
format = console

[plugins]
allow_unsigned_plugins = grafana-clock-panel,grafana-simple-json-datasource

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[sessions]
cookie_name = grafana_session
cookie_secure = false
cookie_update_interval = 1m
cookie_max_age = 604800

[analytics]
reporting_enabled = false
check_for_updates = true

[date_formats]
full_date_format = YYYY-MM-DD HH:mm:ss
interval_second_format = HH:mm:ss
interval_minute_format = HH:mm
interval_hour_format = MM/DD HH:mm
interval_day_format = MM/DD
interval_month_format = YYYY-MM
interval_year_format = YYYY
