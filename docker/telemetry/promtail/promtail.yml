server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 10s
    batchsize: 1048576

scrape_configs:
  # The host journal (read-only bind, adm group). Replaces docker_sd_configs on
  # the Docker socket, which made promtail root on the host. Container stdout
  # appears here once Docker logs through journald (ADR-092 step 8, open).
  - job_name: journal
    journal:
      path: /var/log/journal
      max_age: 12h
      labels:
        host: unheaded
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      - source_labels: ['__journal_container_name']
        target_label: container
      - source_labels: ['__journal_syslog_identifier']
        target_label: service
      - source_labels: ['__journal_priority_keyword']
        target_label: priority

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            msg: msg
            ts: ts
            error: error
            trace_id: trace_id
      
      # Extract level as label
      - labels:
          level:
      
      # Parse timestamp
      - timestamp:
          source: ts
          format: RFC3339Nano
          fallbacks:
            - RFC3339
            - RFC822
            - unix_ms
            - unix
      
      # Parse multi-line logs (stack traces, etc.)
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}T'

