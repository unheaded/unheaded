global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    kingdom: unheaded
    host: forge

# Load rules files
rule_files:
  - /etc/prometheus/rules/*.yml

# Remote write to VictoriaMetrics
remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config:
      capacity: 10000
      max_shards: 200
      min_shards: 1
      max_samples_per_send: 1000
      min_backoff: 30ms
      max_backoff: 100ms

# Scrape configurations
scrape_configs:
  # Unheaded services were found through docker_sd_configs on the Docker socket,
  # which this stack never mounted into prometheus (and which is root on the
  # host). List scrape targets statically instead.

  # Node exporter
  - job_name: node-exporter
    static_configs:
      - targets: ['host.docker.internal:9100']  # node-exporter is on the host network

  # eBPF exporter
  - job_name: ebpf-exporter
    static_configs:
      - targets: ['host.docker.internal:9435']

  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # VictoriaMetrics self-scrape
  - job_name: victoriametrics
    static_configs:
      - targets: ['victoriametrics:8428']

# Alerting (commented out for future use)
