# docker/wireguard/docker-compose.wireguard.yml — WireGuard east-west bridge

version: '3.8'

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: unheaded-wireguard
    # Root by necessity (pkg/uids pendingHardening: a non-root uid gets CapEff 0
    # and EPERM creating the link). Bounded instead: measured 2026-10-20 on west
    # with this image, the tunnel needs NET_ADMIN, and s6's init needs CHOWN,
    # SETUID, SETGID and DAC_OVERRIDE to hand /config to PUID; FOWNER and
    # SYS_MODULE are not needed (west's kernel has wireguard loaded).
    read_only: true
    tmpfs:
      - /run:exec
      - /tmp
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      # No PUID/PGID: with a read-only root the image cannot rewrite its
      # /etc/passwd and ignores them, so /config belongs to its built-in abc,
      # 911:1001 (no account on west or east, 2026-10-20). Was PUID 1000 =
      # govan on the hosts.
      - TZ=UTC
      - SERVERURL=${WG_SERVERURL:-auto}
      - SERVERPORT=51820
      - PEERS=${WG_PEERS:-1}
      - PEERDNS=auto
      - INTERNAL_SUBNET=fd00:dead:beef::/48
      - ALLOWEDIPS=fd00:dead:beef::/48
      - LOG_CONFS=false
    volumes:
      - ./config:/config
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      - unheaded
    labels:
      app: unheaded
      component: network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wg", "show", "all", "peers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  unheaded:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        # was 172.20.0.0/16, which overlaps kind and netbox-docker on west
        - subnet: 172.28.4.0/24
          gateway: 172.28.4.1
        - subnet: "fd00:dead:cafe::/64"
          gateway: "fd00:dead:cafe::1"
