# =============================================================================
# docker-compose.loadbalancers.yml — HAProxy + Nginx Load Balancer Stack
# =============================================================================
# WHAT: Load balancing and reverse proxy infrastructure for Unheaded
# WHY:  Edge routing, internal load balancing, per-service request distribution
# WHO:  Operator (owner), Developer (consumer for local dev)
# DECISION: HAProxy for edge/internal TCP+HTTP, Nginx for per-service HTTP
# =============================================================================
# Each service: own uid (pkg/uids, 16747-16754), read-only root, cap_drop ALL,
# no-new-privileges; all listeners are above 1024. Relative paths resolve from
# the project directory, which is the repo root (the first -f file's).
# KNOWN BROKEN (2026-10-20, not fixed here): both haproxy.cfg files fail
# `haproxy -c` on 2.9 (module-path, missing /etc/haproxy/errors/*, log-format
# fetches in TCP context), the edge's TLS bind needs /etc/haproxy/certs, and
# nginx-gateway.conf proxies to a gateway service the stack does not run.
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker/docker-compose.loadbalancers.yml up -d
#   docker compose -f docker-compose.yml -f docker/docker-compose.loadbalancers.yml ps
#   docker compose -f docker-compose.yml -f docker/docker-compose.loadbalancers.yml logs -f haproxy-edge
# =============================================================================

version: '3.8'

services:

  # =========================================================================
  # EDGE LOAD BALANCER (HAProxy)
  # =========================================================================
  haproxy-edge:
    image: haproxy:2.9.15-alpine
    container_name: unheaded-haproxy-edge
    restart: unless-stopped
    user: "16747:16747"
    read_only: true
    tmpfs:
      - /var/run:uid=16747,gid=16747   # stats socket
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "21080:21080"   # HTTP ingress
      - "21443:21443"   # HTTPS ingress
      - "21404:21404"   # Metrics/healthcheck
    volumes:
      - ./docker/haproxy/edge/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - control
      - data
    labels:
      kingdom.armor: "pauldrons"
      kingdom.role: "edge-lb"
      prometheus.io/scrape: "true"
      prometheus.io/port: "21404"
      prometheus.io/path: "/metrics"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:21404/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "512M"

  # =========================================================================
  # INTERNAL LOAD BALANCER (HAProxy)
  # =========================================================================
  haproxy-internal:
    image: haproxy:2.9.15-alpine
    container_name: unheaded-haproxy-internal
    restart: unless-stopped
    user: "16748:16748"
    read_only: true
    tmpfs:
      - /var/run:uid=16748,gid=16748   # stats socket
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "21081:21081"   # Internal HTTP load balancing
      - "21405:21405"   # Metrics/healthcheck
    volumes:
      - ./docker/haproxy/internal/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - control
      - data
    labels:
      kingdom.armor: "pauldrons"
      kingdom.role: "internal-lb"
      prometheus.io/scrape: "true"
      prometheus.io/port: "21405"
      prometheus.io/path: "/metrics"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:21405/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "256M"

  # =========================================================================
  # PER-SERVICE LOAD BALANCERS (Nginx)
  # =========================================================================

  # --- Nginx for Wotan (Message Bus) ---
  nginx-wotan:
    image: nginx:1.25.5-alpine
    container_name: unheaded-nginx-wotan
    restart: unless-stopped
    user: "16749:16749"
    read_only: true
    tmpfs:
      - /var/run:uid=16749,gid=16749   # pid
      - /var/cache/nginx:uid=16749,gid=16749   # client/proxy temp
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx/nginx-wotan.conf:/etc/nginx/nginx.conf:ro
    networks:
      - data
    labels:
      kingdom.armor: "pauldrons"
      kingdom.role: "app-lb"
      prometheus.io/scrape: "true"
      prometheus.io/port: "18080"
      prometheus.io/path: "/stub_status"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - wotan
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

  # --- Nginx for Monad (State Management) ---
  nginx-monad:
    image: nginx:1.25.5-alpine
    container_name: unheaded-nginx-monad
    restart: unless-stopped
    user: "16750:16750"
    read_only: true
    tmpfs:
      - /var/run:uid=16750,gid=16750   # pid
      - /var/cache/nginx:uid=16750,gid=16750   # client/proxy temp
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx/nginx-monad.conf:/etc/nginx/nginx.conf:ro
    networks:
      - data
    labels:
      kingdom.armor: "pauldrons"
      kingdom.role: "app-lb"
      prometheus.io/scrape: "true"
      prometheus.io/port: "19080"
      prometheus.io/path: "/stub_status"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:19080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - monad
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

  # --- Nginx for Sophia (Knowledge Graph) ---
  nginx-sophia:
    image: nginx:1.25.5-alpine
    container_name: unheaded-nginx-sophia
    restart: unless-stopped
    user: "16751:16751"
    read_only: true
    tmpfs:
      - /var/run:uid=16751,gid=16751   # pid
      - /var/cache/nginx:uid=16751,gid=16751   # client/proxy temp
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx/nginx-sophia.conf:/etc/nginx/nginx.conf:ro
    networks:
      - data
    labels:
      kingdom.armor: "pauldrons"
      kingdom.role: "app-lb"
      prometheus.io/scrape: "true"
      prometheus.io/port: "19081"
      prometheus.io/path: "/stub_status"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:19081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - sophia
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

  # --- Nginx for Dashboard Backend ---
  nginx-dashboard:
    image: nginx:1.25.5-alpine
    container_name: unheaded-nginx-dashboard
    restart: unless-stopped
    user: "16752:16752"
    read_only: true
    tmpfs:
      - /var/run:uid=16752,gid=16752   # pid
      - /var/cache/nginx:uid=16752,gid=16752   # client/proxy temp
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx/nginx-dashboard.conf:/etc/nginx/nginx.conf:ro
    networks:
      - data
    labels:
      kingdom.armor: "pauldrons"
      kingdom.role: "app-lb"
      prometheus.io/scrape: "true"
      prometheus.io/port: "20080"
      prometheus.io/path: "/stub_status"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:20080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - dashboard-backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

  # --- Nginx for Kanban ---
  nginx-kanban:
    image: nginx:1.25.5-alpine
    container_name: unheaded-nginx-kanban
    restart: unless-stopped
    user: "16753:16753"
    read_only: true
    tmpfs:
      - /var/run:uid=16753,gid=16753   # pid
      - /var/cache/nginx:uid=16753,gid=16753   # client/proxy temp
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx/nginx-kanban.conf:/etc/nginx/nginx.conf:ro
    networks:
      - data
    labels:
      kingdom.armor: "pauldrons"
      kingdom.role: "app-lb"
      prometheus.io/scrape: "true"
      prometheus.io/port: "20081"
      prometheus.io/path: "/stub_status"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:20081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - kanban-app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

  # --- Nginx for Gateway ---
  nginx-gateway:
    image: nginx:1.25.5-alpine
    container_name: unheaded-nginx-gateway
    restart: unless-stopped
    user: "16754:16754"
    read_only: true
    tmpfs:
      - /var/run:uid=16754,gid=16754   # pid
      - /var/cache/nginx:uid=16754,gid=16754   # client/proxy temp
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx/nginx-gateway.conf:/etc/nginx/nginx.conf:ro
    networks:
      - data
    labels:
      kingdom.armor: "pauldrons"
      kingdom.role: "app-lb"
      prometheus.io/scrape: "true"
      prometheus.io/port: "21090"
      prometheus.io/path: "/stub_status"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:21090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # No depends_on: docker-compose.yml has no gateway service (compose
    # refused the whole project). nginx-gateway.conf's upstream needs one.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

# =============================================================================
# NETWORKS: control and data come from docker-compose.yml. Declaring them
# here as `external: true` made the merged project look for networks literally
# named control/data, which do not exist; this file adds none of its own.
# =============================================================================

# =============================================================================
# LABELS LEGEND
# =============================================================================
# kingdom.armor   = pauldrons (arm armor — load balancing layer)
# kingdom.role    = Specific function (edge-lb, internal-lb, app-lb)
# prometheus.io/* = Prometheus scrape configuration
# =============================================================================
