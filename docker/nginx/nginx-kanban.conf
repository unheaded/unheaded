# ============================================================================
# Nginx Per-App Sidecar Load Balancer — kanban
# ============================================================================
# Service: kanban
# Listen: 20081
# Upstream: kanban:20001
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # --- Logging: JSON for Loki/Promtail ---
    log_format json_combined escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"trace_id":"$http_x_trace_id",'
            '"service":"kanban"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # --- Performance ---
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # --- Buffers ---
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    # --- Gzip ---
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    application/grpc;

    # --- Upstream: actual service backend(s) ---
    upstream kanban_backend {
        least_conn;
        keepalive 32;

        server kanban:20001 max_fails=3 fail_timeout=10s;
        # Add more servers here for horizontal scaling:
        # server kanban-2:20001 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 20081;
        server_name _;

        # --- Stub status for Prometheus nginx-exporter ---
        location /stub_status {
            stub_status;
            allow 172.16.0.0/12;    # Docker networks
            allow 10.0.0.0/8;       # Internal networks
            allow fd00::/8;         # IPv6 ULA
            allow 127.0.0.1;
            deny all;
        }

        # --- Health check endpoint ---
        location /health {
            proxy_pass http://kanban_backend/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;
        }

        # --- Metrics passthrough (service's own /metrics) ---
        location /metrics {
            proxy_pass http://kanban_backend/metrics;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # --- Main proxy ---
        location / {
            proxy_pass http://kanban_backend;

            # --- Headers ---
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id        $http_x_trace_id;
            proxy_set_header X-Service-Hop     "nginx-kanban";

            # --- Timeouts ---
            proxy_connect_timeout 5s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;

            # --- WebSocket support ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # --- Circuit breaker: next upstream on failure ---
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }

    # --- WebSocket upgrade map ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
