[package]
name        = "monad-cpu-ebpf"
description = "Unheaded Protocol — MBC fetch-decode-execute CPU for Doom-over-IPv6 PoC"
version.workspace   = true
edition.workspace   = true
publish.workspace   = true

[[bin]]
name = "monad-cpu-ebpf"
path = "src/main.rs"

[features]
default = []
# doom-debug: per-PC render-chain tracing diagnostic (D_Display,
# R_RenderPlayerView, R_DrawPlanes, ...) in the execute loop.
# Originally always-on. Kernel 6.17 BPF verifier exhausts
# state-pruning when all the per-PC checks compile in. Kept behind
# a feature so Doom debugging still works
# (`cargo build --features doom-debug`).
doom-debug = []
# ascend-linux: enables the ABI v2 opcodes added in Phase 0
# (FENCE, MRET, SRET, LR.W, SC.W) per ADR-067 §5. xv6/uClinux/Linux
# need MRET for M→S transition + atomics for SMP. Default off so
# Doom and similar lighter workloads load cleanly on kernel 6.17;
# build with `--features ascend-linux` for kernel-boot paths.
# Forwards to monad-common so MbcCpuState picks up the per-process
# rv2mbc_base field (136→144 bytes) in this configuration (ADR-077).
ascend-linux = ["monad-common/ascend-linux"]
# Phase 1.2 pre-work (ADR-074). All three are NO-OPs today;
# they exist so the pair-call can build all variants for verifier measurement.
# Pair-call landed 2026-05-12: Option A chosen. Option B/C stubs kept for
# regression measurement and as documentation of the path-not-taken.
phase12-option-a = []  # per-task pgd (CHOSEN per ADR-074 Decision 2026-05-12)
phase12-option-b = []  # ASID-tagged shared pgd (stub for measurement)
phase12-option-c = []  # priv_level + pid hybrid (stub for measurement)
# large-image: grow the code store (ROM_MAP + RV2MBC_MAP) for Linux-class
# kernel images. Phase 2 code-store option A (grow-maps) per the capacity
# audit (references/phase2-preflight-capacity-audit-2026-07-02.md). Default
# OFF so Doom/xv6 keep the small maps (no extra locked memory, byte-identical
# behavior). Enable for a uClinux/Linux build once its MBC image exceeds the
# small-image ROM_MAP. Map max_entries is a compile-time const, so this is a
# feature, not a runtime knob. Verifier cost is zero (map size does not affect
# verified instructions); only locked memory grows.
large-image = []

[dependencies]
aya-ebpf.workspace     = true
aya-log-ebpf.workspace = true
monad-common.workspace = true
