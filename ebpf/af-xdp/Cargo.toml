[package]
name = "af-xdp"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false
repository = "https://github.com/unheaded-kingdom/ebpf"
authors = ["Unheaded Contributors"]
autobenches = false

[dependencies]
af-xdp-common = { path = "../af-xdp-common" }

[workspace]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

# Userspace crate — override eBPF-style aggressive profiles
[profile.dev]
lto = false

[profile.release]
lto = "thin"

[[bin]]
name = "af-xdp-bench"
path = "benches/main.rs"
