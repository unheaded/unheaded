# Cargo configuration for eBPF programs
# THE WHISPERING VOID requires special build settings

[build]
# Target BPF bytecode (requires nightly + bpf-linker)
target = "bpfel-unknown-none"

[unstable]
# Enable build-std for no_std targets
build-std = ["core"]

[target.bpfel-unknown-none]
# Use bpf-linker (cargo install bpf-linker) for linking BPF objects.
# bpf-linker consumes LLVM bitcode from rustc and produces BPF ELF.
linker = "bpf-linker"

# Optimization flags for BPF
rustflags = [
    # Optimize for size (important for BPF verifier)
    "-C", "opt-level=3",
    # BTF debug info — required for tail calls with subprograms (kernel 6.17+)
    "-C", "debuginfo=2",
    # Pass --btf to bpf-linker for BTF section generation
    "-C", "link-arg=--btf",
    # Link-time optimization (required for BPF — bpf-linker does final codegen)
    "-C", "lto=true",
    # Single codegen unit for better optimization
    "-C", "codegen-units=1",
    # Disable frame pointers
    "-C", "force-frame-pointers=no",
]

[target.bpfel-unknown-none.env]
# LLVM target triple
CARGO_CFG_BPF_TARGET_ARCH = "bpfel"

[alias]
# Convenient aliases for building
bpf = "build --release"
bpf-debug = "build"

# Build individual programs
build-packet-marker = "build --release -p packet-marker"
build-flow-tracker = "build --release -p flow-tracker"
build-latency-probe = "build --release -p latency-probe"
build-syscall-tracer = "build --release -p syscall-tracer"
