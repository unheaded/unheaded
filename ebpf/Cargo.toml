[workspace]
resolver = "2"
members = [
    # --- Observability Layer (existing) ---
    "common",
    "packet-marker",
    "flow-tracker",
    "latency-probe",
    "syscall-tracer",
    # --- Protocol Foundation (Layer 0 + Layer 1) ---
    "monad-common",
    "shield-ebpf",
    "hop-ebpf",
    "yaldabaoth-ebpf",
    "monad-cpu-ebpf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false
repository = "https://github.com/unheaded-kingdom/ebpf"
authors = ["Unheaded Contributors"]

[workspace.dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
unheaded-common = { path = "common" }
monad-common = { path = "monad-common" }

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
codegen-units = 1
strip = true
