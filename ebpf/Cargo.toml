[workspace]
resolver = "2"
members = [
    "common",
    "packet-marker",
    "flow-tracker",
    "latency-probe",
    "syscall-tracer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/unheaded-kingdom/ebpf"

[workspace.dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
unheaded-common = { path = "common" }

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
codegen-units = 1
strip = true
