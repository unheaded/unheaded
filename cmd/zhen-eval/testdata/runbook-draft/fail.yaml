# Fails check-runbooks --one (approved, multi-line shell without set -euo,
# rm -rf in a shell step) and the requirements (no health URL, a restart);
# the dry run itself passes.
apiVersion: runbook/v1
kind: Runbook
metadata:
  name: demo-check
  description: Check the demo service
  owner: zhenai
  estimated_duration: 1m
  risk: low
  requires_sudo: true
  status: approved
  authored_by: zhen-local
  reviewed_by: ""
  approved_by: zhen
  approved_at: "2026-10-27"
steps:
  - name: restart
    action: shell
    command: |
      sudo systemctl restart demo
      rm -rf /var/lib/demo/cache
