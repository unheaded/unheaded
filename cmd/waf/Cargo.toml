[package]
name = "shield"
version = "0.1.0"
edition = "2021"
description = "THE SHIELD - WAF/Gateway for the Unheaded Kingdom"
authors = ["The Unheaded Kingdom"]

[dependencies]
# Async runtime - acceptable per Sacred Law
tokio = { version = "1", features = ["full"] }

# HTTP server - quasi-standard, acceptable per Sacred Law
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# TLS - rustls is the pure-Rust choice
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"

# TOML parsing - minimal, pure Rust
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Regex for pattern matching - pure Rust, no PCRE
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
