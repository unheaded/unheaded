[package]
name = "ebpf-programs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "packet-counter"
path = "src/packet_counter.rs"

[[bin]]
name = "tcp-latency"
path = "src/tcp_latency.rs"

[dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
ebpf-common = { path = "../common" }

[profile.release]
opt-level = "s"    # Optimize for size — BPF programs have instruction limits
lto = true
codegen-units = 1
debug = false
strip = true
