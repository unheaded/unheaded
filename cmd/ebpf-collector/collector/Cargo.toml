[package]
name = "collector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "collector"
path = "src/main.rs"

[dependencies]
aya = "0.13"
ebpf-common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Wotan service tokens (ADR-103 §6): EdDSA, the format Go's pkg/auth mints.
# Path crate; its ring and base64 are versions already in this lockfile.
unheaded-svc-token = { path = "../../../crates/svc-token" }

[build-dependencies]
tonic-build = "0.12"
