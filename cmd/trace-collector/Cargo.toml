[package]
name = "trace-collector"
version = "0.1.0"
edition = "2021"
authors = ["Unheaded Kingdom Infrastructure Team"]
description = "THE WHISPERING VOID - Ultra-lean eBPF event collector"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "sync", "time", "signal", "macros"] }

# gRPC
tonic = { version = "0.10", features = ["gzip", "tls"] }
prost = "0.12"
prost-types = "0.12"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Metrics
prometheus = "0.13"
hyper = { version = "1.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Low-level Linux interfaces
libc = "0.2"
nix = { version = "0.27", features = ["mman", "ioctl", "poll"] }
memmap2 = "0.9"

# Lock-free data structures
crossbeam = { version = "0.8", features = ["crossbeam-channel", "crossbeam-queue"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
bytes = "1.5"
parking_lot = "0.12"
once_cell = "1.19"
pin-project = "1.1"
hostname = "0.3"
flate2 = "1.0"

[build-dependencies]
tonic-build = "0.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.release.package."*"]
opt-level = 3
