[package]
name = "trace-collector"
version = "0.1.0"
edition = "2021"
authors = ["Unheaded Kingdom Infrastructure Team"]
description = "THE WHISPERING VOID - Ultra-lean eBPF event collector"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "sync", "time", "signal", "macros"] }

# gRPC
# ADR-066 (2026-05-08): tonic 0.10 → 0.12 closes RUSTSEC-2026-0098/0099/0104 + RUSTSEC-2024-0437.
tonic = { version = "0.12", features = ["gzip", "tls"] }
prost = "0.13"
prost-types = "0.13"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Metrics
# ADR-066: bumped 0.13 → 0.14 to drop legacy protobuf 2.28 (RUSTSEC-2024-0437);
# default-features = false disables the protobuf encoder we don't use (text format only).
prometheus = { version = "0.14", default-features = false, features = ["process"] }
hyper = { version = "1.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Low-level Linux interfaces
libc = "0.2"
nix = { version = "0.27", features = ["mman", "ioctl", "poll"] }
memmap2 = "0.9"

# Lock-free data structures
crossbeam = { version = "0.8", features = ["crossbeam-channel", "crossbeam-queue"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
bytes = "1.5"
parking_lot = "0.12"
once_cell = "1.19"
pin-project = "1.1"
hostname = "0.3"
flate2 = "1.0"
regex = "1.10"
fastrand = "2.0"

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.release.package."*"]
opt-level = 3
