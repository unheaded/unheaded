# SPDX-License-Identifier: GPL-3.0-or-later
# cmd/upc-bootctl — UPC kernel image loader + boot dispatcher.
# ASCEND-LINUX Phase 1.1 deliverable per
# references/battle-plan-ascend-linux-2026-05-08.md.

[package]
name = "upc-bootctl"
version = "0.1.0"
edition = "2021"
authors = ["Unheaded Kingdom Infrastructure Team"]
description = "Boot kernel images (xv6, uClinux, full Linux) into the UPC"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "upc-bootctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
monad-common = { path = "../../ebpf/monad-common" }
xv6-mbc = { path = "../../crates/xv6-mbc" }
# Epic 1.2.3 (ADR-080): the shared UPC guest-load contract. upc-bootctl builds a
# Workload per userland program and routes ROM_MAP/RV2MBC_MAP population through
# upc_api::load, so validation + the map-write loop live in one place.
upc-api = { path = "../../crates/upc-api" }
# Phase 2 — live BPF integration
aya = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
# No `rustls-tls`: the only request is a POST to http://<host>:<port> on the
# local tty-bridge (src/tty_bridge.rs). ADR-105.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Phase 1.3 ADR-075 §Security #1 — SHA-256 over .rv2mbc bytes so the
# build pipeline (or an env-var-supplied hash) can pin the integrity
# of the RV→MBC translation map. Without this, an attacker-supplied
# .rv2mbc could redirect every indirect branch in the loaded image.
sha2 = "0.10"
