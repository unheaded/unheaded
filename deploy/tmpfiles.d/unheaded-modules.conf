# Where a module's fragments live while its switch is on (ADR-149).
#
# The directory must exist before Docker mounts it into a container
# (Prometheus, VictoriaMetrics, dashboard-backend, kanban-app), or Docker
# makes it itself, as root. It is owned by the account of the switch's
# oneshot (unheaded-zhen-module.service, unheaded-modules), the only writer;
# every reader needs only the 0755.
#
#   sudo install -m 0644 deploy/tmpfiles.d/unheaded-modules.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/unheaded-modules.conf
#
#Type Path                  Mode User             Group            Age
d     /run/unheaded/modules 0755 unheaded-modules unheaded-modules -
