# The Zhen web UI's socket directory (ADR-138, S-ZHEN-FRONT D-05).
#
# Owner: the app's account, the only one that creates the socket. Group: the
# front's own, with the setgid bit, so the socket is born in that group and
# the app gives it 0660 (UMask=0007). Mode 2750: no other account reaches the
# directory. Neither account is in the other's group.
#
#   sudo install -m 0644 deploy/tmpfiles.d/unheaded-zhen-ui.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/unheaded-zhen-ui.conf
#
#Type Path                  Mode User              Group                  Age
d     /run/unheaded-zhen-ui 2750 unheaded-zhen-app unheaded-zhen-ui-front -
