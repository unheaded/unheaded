# Generated from compliance/remediation/fixes.yaml (ADR-099) by
# `go run ./cmd/compliance-evidence ansible`. Do not edit; edit the model.
# apparmor-enforce: AppArmor profiles shipped in complain mode put in enforce (CIS 1.3.1.4)
- block:
    - ansible.builtin.stat:
        path: /etc/apparmor.d/Xorg
      name: Is /etc/apparmor.d/Xorg there
      register: uh_apparmor_enforce_1_1_stat
    - ansible.builtin.stat:
        path: /etc/apparmor.d/disable/Xorg
      name: Is Xorg disabled by the operator
      register: uh_apparmor_enforce_1_1_disabled
    - ansible.builtin.stat:
        path: /etc/apparmor.d/force-complain/Xorg
      name: Is Xorg forced to complain by the operator
      register: uh_apparmor_enforce_1_1_complain
    - ansible.builtin.assert:
        fail_msg: profile Xorg is in /etc/apparmor.d/disable or force-complain; not enforcing it
        that:
          - not uh_apparmor_enforce_1_1_disabled.stat.exists
          - not uh_apparmor_enforce_1_1_complain.stat.exists
      name: Xorg is the operator's to leave as it is
      when: uh_apparmor_enforce_1_1_stat.stat.exists
    - ansible.builtin.command:
        argv:
          - aa-enforce
          - /etc/apparmor.d/Xorg
      changed_when: true
      name: Enforce Xorg
      when: uh_apparmor_enforce_1_1_stat.stat.exists
  name: apparmor-enforce
  rescue:
    - ansible.builtin.fail:
        msg: apparmor-enforce failed; profiles aa-enforce already rewrote stay in enforce (unheaded-remediate undo restores them)
      name: Fail after restoring
