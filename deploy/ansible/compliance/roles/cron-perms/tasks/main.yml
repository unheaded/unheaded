    - ansible.builtin.file:
        group: root
        mode: "0700"
        owner: root
        path: /etc/cron.hourly
      name: Mode 0700 root:root on /etc/cron.hourly
      when: uh_cron_perms_2_1_stat.stat.exists
    - ansible.builtin.stat:
        path: /etc/cron.daily
      name: Is /etc/cron.daily there
      register: uh_cron_perms_2_2_stat
    - ansible.builtin.file:
        group: root
        mode: "0700"
        owner: root
        path: /etc/cron.daily
      name: Mode 0700 root:root on /etc/cron.daily
      when: uh_cron_perms_2_2_stat.stat.exists
    - ansible.builtin.stat:
        path: /etc/cron.weekly
      name: Is /etc/cron.weekly there
      register: uh_cron_perms_2_3_stat
    - ansible.builtin.file:
        group: root
        mode: "0700"
        owner: root
        path: /etc/cron.weekly
      name: Mode 0700 root:root on /etc/cron.weekly
      when: uh_cron_perms_2_3_stat.stat.exists
    - ansible.builtin.stat:
        path: /etc/cron.monthly
      name: Is /etc/cron.monthly there
      register: uh_cron_perms_2_4_stat
    - ansible.builtin.file:
        group: root
        mode: "0700"
        owner: root
        path: /etc/cron.monthly
      name: Mode 0700 root:root on /etc/cron.monthly
      when: uh_cron_perms_2_4_stat.stat.exists
    - ansible.builtin.stat:
        path: /etc/cron.d
      name: Is /etc/cron.d there
      register: uh_cron_perms_2_5_stat
    - ansible.builtin.file:
        group: root
        mode: "0700"
        owner: root
        path: /etc/cron.d
      name: Mode 0700 root:root on /etc/cron.d
      when: uh_cron_perms_2_5_stat.stat.exists
    - ansible.builtin.copy:
        backup: true
        content: |
          {{ (['root'] + (ansible_facts.getent_group['sudo'][2].split(',') | select | list)) | unique | join('\n') }}
        dest: /etc/cron.allow
        group: crontab
        mode: "0640"
        owner: root
      name: Write /etc/cron.allow (root and group sudo)
      register: uh_cron_perms_3_v1
    - ansible.builtin.file:
        path: /etc/cron.deny
        state: absent
      name: Remove /etc/cron.deny
  name: cron-perms
