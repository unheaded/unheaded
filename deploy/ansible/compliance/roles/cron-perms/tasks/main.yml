# cron-perms: Scheduled-job files root-only; cron.allow lists root and the sudo group
- ansible.builtin.getent:
    database: group
    key: sudo
  name: Members of group sudo
- block:
    - ansible.builtin.stat:
        path: /etc/crontab
      name: Is /etc/crontab there
      register: uh_cron_perms_1_1_stat
    - ansible.builtin.file:
        group: root
        mode: "0600"
        owner: root
        path: /etc/crontab
      name: Mode 0600 root:root on /etc/crontab
      when: uh_cron_perms_1_1_stat.stat.exists
    - ansible.builtin.stat:
        path: /etc/cron.hourly
      name: Is /etc/cron.hourly there
