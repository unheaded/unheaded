apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-runtime
  namespace: unheaded-armory
  labels:
    app: helm-runtime
    tier: armory
    component: container-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helm-runtime
  template:
    metadata:
      labels:
        app: helm-runtime
        tier: armory
    spec:
      serviceAccountName: helm-runtime
      priorityClassName: unheaded-critical
      securityContext:
        # Dedicated run-as identity from pkg/uids. runAsNonRoot alone stops
        # root but leaves the UID to whatever the image declares, so two
        # services can silently share one and file ownership tells an
        # auditor nothing about which of them wrote what.
        runAsUser: 16743
        runAsGroup: 16743
        fsGroup: 16743
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: helm-runtime
        image: ghcr.io/unheaded/helm-runtime:0.1.0-alpha
        resources:
          requests: { memory: "256Mi", cpu: "200m" }
          limits: { memory: "1Gi", cpu: "1000m" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        livenessProbe:
          httpGet: { path: /healthz, port: http }
        readinessProbe:
          httpGet: { path: /readyz, port: http }
