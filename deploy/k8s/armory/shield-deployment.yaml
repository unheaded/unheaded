apiVersion: apps/v1
kind: Deployment
metadata:
  name: shield
  namespace: unheaded-armory
  labels:
    app: shield
    tier: armory
    component: waf
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shield
  template:
    metadata:
      labels:
        app: shield
        tier: armory
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
    spec:
      serviceAccountName: shield
      priorityClassName: unheaded-critical
      automountServiceAccountToken: false
      securityContext:
        # Dedicated run-as identity from pkg/uids. runAsNonRoot alone stops
        # root but leaves the UID to whatever the image declares, so two
        # services can silently share one and file ownership tells an
        # auditor nothing about which of them wrote what.
        runAsUser: 16745
        runAsGroup: 16745
        fsGroup: 16745
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: shield
        image: unheaded/shield:0.1.0-alpha
        resources:
          requests: { memory: "128Mi", cpu: "200m" }
          limits: { memory: "512Mi", cpu: "500m" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        - containerPort: 9090
          name: grpc
        - containerPort: 2112
          name: metrics
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 10
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          initialDelaySeconds: 5
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: shield
