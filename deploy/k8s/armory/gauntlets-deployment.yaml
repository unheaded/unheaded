apiVersion: apps/v1
kind: Deployment
metadata:
  name: gauntlets
  namespace: unheaded-armory
  labels:
    app: gauntlets
    tier: armory
    component: scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gauntlets
  template:
    metadata:
      labels:
        app: gauntlets
        tier: armory
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
    spec:
      serviceAccountName: gauntlets
      priorityClassName: unheaded-critical
      automountServiceAccountToken: false
      securityContext:
        # Dedicated run-as identity from pkg/uids. runAsNonRoot alone stops
        # root but leaves the UID to whatever the image declares, so two
        # services can silently share one and file ownership tells an
        # auditor nothing about which of them wrote what.
        runAsUser: 16741
        runAsGroup: 16741
        fsGroup: 16741
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gauntlets
        image: unheaded/gauntlets:latest
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "512Mi", cpu: "500m" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        - containerPort: 2112
          name: metrics
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          initialDelaySeconds: 5
          periodSeconds: 10
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: gauntlets
