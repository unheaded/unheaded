apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuirass
  namespace: unheaded-armory
  labels:
    app: cuirass
    tier: armory
    component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cuirass
  template:
    metadata:
      labels:
        app: cuirass
        tier: armory
    spec:
      serviceAccountName: cuirass
      priorityClassName: unheaded-critical
      automountServiceAccountToken: false
      securityContext:
        # Dedicated run-as identity from pkg/uids. runAsNonRoot alone stops
        # root but leaves the UID to whatever the image declares, so two
        # services can silently share one and file ownership tells an
        # auditor nothing about which of them wrote what.
        runAsUser: 16740
        runAsGroup: 16740
        fsGroup: 16740
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cuirass
        image: unheaded/cuirass:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: cuirass
