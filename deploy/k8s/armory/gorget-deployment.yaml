apiVersion: apps/v1
kind: Deployment
metadata:
  name: gorget
  namespace: unheaded-armory
  labels:
    app: gorget
    tier: armory
    component: secret-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gorget
  template:
    metadata:
      labels:
        app: gorget
        tier: armory
    spec:
      serviceAccountName: gorget
      priorityClassName: unheaded-critical
      automountServiceAccountToken: true
      securityContext:
        # Dedicated run-as identity from pkg/uids. runAsNonRoot alone stops
        # root but leaves the UID to whatever the image declares, so two
        # services can silently share one and file ownership tells an
        # auditor nothing about which of them wrote what.
        runAsUser: 16742
        runAsGroup: 16742
        fsGroup: 16742
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gorget
        image: unheaded/gorget:0.1.0-alpha
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "256Mi", cpu: "250m" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          initialDelaySeconds: 5
          periodSeconds: 10
