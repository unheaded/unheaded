apiVersion: apps/v1
kind: Deployment
metadata:
  name: anamnesis
  namespace: unheaded-gnostic
  labels: { app: anamnesis, tier: gnostic, component: event-history }
spec:
  replicas: 2
  selector:
    matchLabels: { app: anamnesis }
  template:
    metadata:
      labels: { app: anamnesis, tier: gnostic }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "2112" }
    spec:
      serviceAccountName: anamnesis
      automountServiceAccountToken: false
      # Dedicated run-as identity from pkg/uids. runAsNonRoot alone stops root
      # but leaves the UID to whatever the image declares, so two services can
      # silently share one.
      securityContext: { runAsUser: 16760, runAsGroup: 16760, fsGroup: 16760, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: anamnesis
        image: unheaded/anamnesis:latest
        resources:
          requests: { memory: "256Mi", cpu: "200m" }
          limits: { memory: "1Gi", cpu: "1000m" }
        securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
        ports:
        - { containerPort: 8080, name: http }
        - { containerPort: 9090, name: grpc }
        - { containerPort: 2112, name: metrics }
