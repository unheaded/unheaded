apiVersion: apps/v1
kind: Deployment
metadata:
  name: kenoma
  namespace: unheaded-gnostic
  labels: { app: kenoma, tier: gnostic, component: actual-state }
spec:
  replicas: 2
  selector:
    matchLabels: { app: kenoma }
  template:
    metadata:
      labels: { app: kenoma, tier: gnostic }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "2112" }
    spec:
      serviceAccountName: kenoma
      automountServiceAccountToken: false
      # Dedicated run-as identity from pkg/uids. runAsNonRoot alone stops root
      # but leaves the UID to whatever the image declares, so two services can
      # silently share one.
      securityContext: { runAsUser: 16761, runAsGroup: 16761, fsGroup: 16761, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: kenoma
        image: ghcr.io/unheaded/kenoma:0.1.0-alpha
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "512Mi", cpu: "500m" }
        securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
        ports:
        - { containerPort: 8080, name: http }
        - { containerPort: 9090, name: grpc }
        - { containerPort: 2112, name: metrics }
