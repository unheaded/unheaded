apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: whispering-void-collector
  namespace: unheaded-ebpf
  labels:
    app: void-collector
    tier: ebpf
spec:
  selector:
    matchLabels:
      app: void-collector
  template:
    metadata:
      labels:
        app: void-collector
        tier: ebpf
    spec:
      serviceAccountName: void-collector
      hostNetwork: true
      hostPID: false
      priorityClassName: unheaded-critical
      # Runs as a dedicated UID, not root (trivy KSV-0012 / KSV-0118).
      #
      # Loading BPF no longer requires UID 0 on this host — verified rather
      # than assumed:
      #   kernel 6.17.0-41           (CAP_BPF/CAP_PERFMON exist since 5.8)
      #   unprivileged_bpf_disabled = 0
      # so the capabilities already granted below are sufficient without root.
      #
      # If BPF load regresses it appears as a verifier or permission error at
      # program load, NOT as anything obviously security-shaped — check
      # /proc/sys/kernel/unprivileged_bpf_disabled and the kernel version
      # before assuming the manifest is wrong.
      securityContext:
        runAsNonRoot: true
        runAsUser: 16780
        runAsGroup: 16780
        fsGroup: 16780
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: ghcr.io/unheaded/void-collector:0.1.0-alpha
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          privileged: false
          # Loading BPF programs with CAP_BPF/CAP_PERFMON does not require
          # gaining privileges beyond the caps already granted, so this costs
          # nothing here and closes trivy KSV-0001.
          allowPrivilegeEscalation: false
          capabilities:
            add: ["BPF", "PERFMON", "NET_ADMIN"]
            drop: ["ALL"]
        volumeMounts:
        - name: bpf-maps
          mountPath: /sys/fs/bpf
        - name: debugfs
          mountPath: /sys/kernel/debug
          readOnly: true
        ports:
        - containerPort: 9091
          name: grpc
        - containerPort: 2112
          name: metrics
      volumes:
      - name: bpf-maps
        hostPath:
          path: /sys/fs/bpf
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      tolerations:
      - effect: NoSchedule
        operator: Exists
