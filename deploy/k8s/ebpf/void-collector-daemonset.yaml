apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: whispering-void-collector
  namespace: unheaded-ebpf
  labels:
    app: void-collector
    tier: ebpf
spec:
  selector:
    matchLabels:
      app: void-collector
  template:
    metadata:
      labels:
        app: void-collector
        tier: ebpf
    spec:
      serviceAccountName: void-collector
      hostNetwork: true
      hostPID: false
      priorityClassName: unheaded-critical
      # Pod-level context (trivy KSV-0118). seccompProfile only, deliberately.
      #
      # runAsUser is NOT set here. This collector needs CAP_BPF and CAP_PERFMON,
      # and whether those work for a non-root UID depends on kernel version and
      # the BPF operations used — asserting an unvalidated UID risks silently
      # breaking eBPF load on WEST/EAST. The capabilities are already tightly
      # scoped (privileged:false, drop ALL, add only BPF/PERFMON/NET_ADMIN),
      # which is the control that matters most here.
      #
      # TODO(WEST): validate a dedicated UID from pkg/uids against a live BPF
      # load, then pin runAsUser/runAsGroup here as the other tiers do.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: ghcr.io/unheaded/void-collector:0.1.0-alpha
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          privileged: false
          capabilities:
            add: ["BPF", "PERFMON", "NET_ADMIN"]
            drop: ["ALL"]
        volumeMounts:
        - name: bpf-maps
          mountPath: /sys/fs/bpf
        - name: debugfs
          mountPath: /sys/kernel/debug
          readOnly: true
        ports:
        - containerPort: 9091
          name: grpc
        - containerPort: 2112
          name: metrics
      volumes:
      - name: bpf-maps
        hostPath:
          path: /sys/fs/bpf
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      tolerations:
      - effect: NoSchedule
        operator: Exists
