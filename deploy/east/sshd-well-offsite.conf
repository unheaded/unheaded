# East: the account west copies The Well's backup sets to (ERDA 1.2).
# Install as /etc/ssh/sshd_config.d/60-unheaded-well-offsite.conf (see
# deploy/systemd/unheaded-well-offsite.service for the whole procedure).
#
# well-backup-copy has a nologin shell; internal-sftp needs none. Key only,
# chrooted to the copies (root-owned; sets/ is the account's), and the SFTP
# server refuses remove, rename and links, so the sender can add sets but
# never take one away. east prunes with its own timer.
Match User well-backup-copy
    AuthenticationMethods publickey
    PasswordAuthentication no
    ChrootDirectory /var/backups/unheaded-well-west
    ForceCommand internal-sftp -u 0077 -P remove,rmdir,rename,posix-rename,hardlink,symlink
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
# End the Match block here, whatever is read after this file.
Match all
