apiVersion: unheaded/v1
kind: ShieldRuleSet
metadata:
  name: sophia-eye
  namespace: applications
  tier: application
  annotations:
    description: "Sophia's Eye - AI Model Stack network security rules"
    maintained-by: "Infrastructure Team"
    last-updated: "2025-02-24"
    version: "1.0.0"
spec:
  kingdom-mode: ACTIVE
  default-action: DENY
  log-dropped-traffic: true
  enable-ebpf-tracing: true

rules:
  # ============================================================================
  # INGRESS RULES - Allow only inference requests from Unheaded fabric
  # ============================================================================

  - id: allow-inference-deepseek-ingress
    name: "Allow inference requests to DeepSeek-R1 model"
    description: "vLLM DeepSeek-R1 7B inference endpoint"
    direction: ingress
    source:
      - network: unheaded-fabric  # VXLAN 172.16.0.0/12
        allow-all-hosts: true
    destination:
      port: 20100
      protocol: tcp
    action: ALLOW
    trace: true
    trace-labels:
      model: "deepseek-r1-7b"
      service: "sophia-eye"
      endpoint-type: "inference"
    rate-limit:
      enabled: true
      requests-per-second: 100
      burst: 200
    timeout: 120s
    priority: 100

  - id: allow-inference-qwen-ingress
    name: "Allow inference requests to Qwen coder model"
    description: "vLLM Qwen 2.5 Coder 7B inference endpoint"
    direction: ingress
    source:
      - network: unheaded-fabric
        allow-all-hosts: true
    destination:
      port: 20101
      protocol: tcp
    action: ALLOW
    trace: true
    trace-labels:
      model: "qwen2.5-coder-7b"
      service: "sophia-eye"
      endpoint-type: "inference"
    rate-limit:
      enabled: true
      requests-per-second: 80
      burst: 160
    timeout: 120s
    priority: 100

  - id: allow-sophia-gateway-ingress
    name: "Allow requests to Sophia's Eye gateway"
    description: "Main gateway endpoint for Protocol API integration"
    direction: ingress
    source:
      - network: unheaded-fabric
        allow-all-hosts: true
    destination:
      port: 20105
      protocol: tcp
    action: ALLOW
    trace: true
    trace-labels:
      service: "sophia-eye"
      endpoint-type: "gateway"
    rate-limit:
      enabled: true
      requests-per-second: 200
      burst: 400
    timeout: 120s
    priority: 100

  - id: allow-webui-ingress
    name: "Allow requests to Open WebUI dashboard"
    description: "Web interface for model testing and monitoring"
    direction: ingress
    source:
      - network: unheaded-fabric
        allow-all-hosts: true
    destination:
      port: 20107
      protocol: tcp
    action: ALLOW
    trace: true
    trace-labels:
      service: "sophia-eye"
      endpoint-type: "webui"
    timeout: 30s
    priority: 100

  - id: allow-metrics-ingress
    name: "Allow Prometheus metrics scraping"
    description: "Expose metrics for observability stack"
    direction: ingress
    source:
      - network: unheaded-fabric
        allow-hosts:
          - "bare-metal"  # Only prometheus scraper
    destination:
      port: 20106
      protocol: tcp
    action: ALLOW
    trace: false  # High volume, don't trace
    timeout: 10s
    priority: 105

  - id: allow-admin-console
    name: "Allow admin access to WebUI"
    description: "Infrastructure team dashboard access"
    direction: ingress
    source:
      - network: unheaded-fabric
        allow-hosts:
          - "admin-terminal"
          - "monitoring-dashboard"
    destination:
      port: 20107
      protocol: tcp
    action: ALLOW
    trace: true
    trace-labels:
      admin-access: "true"
    timeout: 30s
    priority: 110

  # ============================================================================
  # INTERNAL CONTAINER NETWORKING - Service-to-service communication
  # ============================================================================

  - id: allow-qdrant-http-internal
    name: "Allow internal Qdrant HTTP access"
    description: "vLLM and gateway services query vector database"
    direction: ingress
    source:
      - container-network: sophia-eye
        allow-services:
          - vllm-deepseek
          - vllm-qwen
          - sophia-gateway
          - embeddings-bge
    destination:
      port: 20102
      protocol: tcp
    action: ALLOW
    trace: false  # High volume, internal only
    timeout: 30s
    priority: 101

  - id: allow-qdrant-grpc-internal
    name: "Allow internal Qdrant gRPC access"
    description: "gRPC interface for vector database operations"
    direction: ingress
    source:
      - container-network: sophia-eye
        allow-services:
          - vllm-deepseek
          - vllm-qwen
          - sophia-gateway
    destination:
      port: 20103
      protocol: tcp
    action: ALLOW
    trace: false
    timeout: 30s
    priority: 101

  - id: allow-embeddings-internal
    name: "Allow internal BGE-M3 embeddings access"
    description: "Text embedding service used by gateway and RAG pipeline"
    direction: ingress
    source:
      - container-network: sophia-eye
        allow-services:
          - sophia-gateway
          - open-webui
    destination:
      port: 20104
      protocol: tcp
    action: ALLOW
    trace: false
    timeout: 10s
    priority: 101

  - id: allow-vllm-internal-communication
    name: "Allow vLLM internal worker communication"
    description: "vLLM distributed inference worker coordination"
    direction: ingress
    source:
      - container-network: sophia-eye
        allow-services:
          - vllm-deepseek
          - vllm-qwen
    destination:
      port-range:
        min: 8000
        max: 8010
      protocol: tcp
    action: ALLOW
    trace: false
    timeout: 10s
    priority: 101

  # ============================================================================
  # EGRESS RULES - Outbound traffic to Unheaded infrastructure
  # ============================================================================

  - id: allow-protocol-api-egress
    name: "Allow Protocol API calls to bare metal"
    description: "Sophia gateway registers services and records inference events"
    direction: egress
    source:
      - container-network: sophia-eye
        allow-services:
          - sophia-gateway
    destination:
      host: bare-metal
      port: 17100
      protocol: tcp
    action: ALLOW
    trace: true
    trace-labels:
      egress-type: "protocol-api"
      critical: "true"
    timeout: 5s
    retry-policy:
      max-retries: 3
      backoff-multiplier: 2
    priority: 100

  - id: allow-wotan-metrics-egress
    name: "Allow Wotan observability reporting"
    description: "Send inference metrics to Wotan message bus"
    direction: egress
    source:
      - container-network: sophia-eye
        allow-services:
          - sophia-gateway
    destination:
      host: bare-metal
      port: 18001
      protocol: tcp
    action: ALLOW
    trace: true
    trace-labels:
      egress-type: "wotan"
      observability: "true"
    timeout: 3s
    priority: 100

  - id: allow-dns-resolution
    name: "Allow DNS queries for service discovery"
    description: "Resolve bare-metal hostname and external services"
    direction: egress
    source:
      - container-network: sophia-eye
        allow-all-services: true
    destination:
      port: 53
      protocol: udp
    action: ALLOW
    trace: false
    timeout: 2s
    priority: 200

  - id: allow-ntp-sync
    name: "Allow NTP time synchronization"
    description: "Keep clock synchronized for tracing accuracy"
    direction: egress
    source:
      - container-network: sophia-eye
        allow-all-services: true
    destination:
      port: 123
      protocol: udp
    action: ALLOW
    trace: false
    timeout: 5s
    priority: 200

  # ============================================================================
  # VXLAN TUNNEL RULES - Cross-subnet fabric communication
  # ============================================================================

  - id: allow-vxlan-encapsulation
    name: "Allow VXLAN encapsulation to bare metal"
    description: "UDP 4789 for EVPN-VXLAN tunnel establishment"
    direction: egress
    source:
      - host: gaming-desktop
    destination:
      host: bare-metal
      port: 4789
      protocol: udp
    action: ALLOW
    trace: true
    trace-labels:
      infrastructure: "vxlan"
    priority: 50

  - id: allow-vxlan-return
    name: "Allow VXLAN return traffic"
    description: "Return path for VXLAN tunnel"
    direction: ingress
    source:
      - host: bare-metal
    destination:
      port: 4789
      protocol: udp
    action: ALLOW
    trace: true
    trace-labels:
      infrastructure: "vxlan"
    priority: 50

  # ============================================================================
  # DENY RULES - Explicit denials with logging
  # ============================================================================

  - id: deny-unauthorized-inference
    name: "Deny unauthorized inference requests"
    description: "Block inference requests from sources outside fabric"
    direction: ingress
    source:
      - except-network: unheaded-fabric
    destination:
      port-range:
        min: 20100
        max: 20105
      protocol: tcp
    action: DENY
    log: true
    log-level: warning
    priority: 10

  - id: deny-external-qdrant-access
    name: "Deny external vector database access"
    description: "Qdrant must not be accessible from internet"
    direction: ingress
    source:
      - except-network: unheaded-fabric
    destination:
      port-range:
        min: 20102
        max: 20103
      protocol: tcp
    action: DENY
    log: true
    log-level: critical
    alert: true
    priority: 10

  - id: deny-unauthorized-egress
    name: "Deny unauthorized egress traffic"
    description: "Block all outbound traffic except explicitly allowed"
    direction: egress
    source:
      - container-network: sophia-eye
        allow-all-services: true
    destination:
      - except-list:
          - bare-metal:17100
          - bare-metal:18001
          - 53
          - 123
    action: DENY
    log: true
    log-level: info
    priority: 5

  - id: deny-lateral-movement
    name: "Deny lateral movement to other services"
    description: "Prevent container from reaching other application tiers"
    direction: egress
    source:
      - container-network: sophia-eye
        allow-all-services: true
    destination:
      - network: unheaded-fabric
        except-hosts:
          - bare-metal
    action: DENY
    log: true
    log-level: warning
    alert: true
    priority: 15

  - id: default-deny-all
    name: "Default deny all other traffic"
    description: "Catch-all deny rule for undefined traffic"
    direction:
      - ingress
      - egress
    action: DENY
    log: true
    log-level: debug
    priority: 1

  # ============================================================================
  # ANOMALY DETECTION RULES - Behavioral security
  # ============================================================================

  - id: detect-port-scanning
    name: "Detect port scanning attempts"
    description: "Alert on rapid connection attempts to multiple ports"
    direction: ingress
    detection:
      type: anomaly
      pattern: "sequential-port-connections"
      threshold: 5
      window: 10s
    action: ALERT
    log: true
    log-level: critical
    priority: 20

  - id: detect-ddos-pattern
    name: "Detect potential DDoS pattern"
    description: "High volume of requests from single source"
    direction: ingress
    detection:
      type: anomaly
      pattern: "request-volume"
      threshold: 1000
      window: 1s
      source-specific: true
    action: RATE_LIMIT
    rate-limit:
      requests-per-second: 100
      burst: 150
    log: true
    log-level: warning
    priority: 20

  - id: detect-data-exfiltration
    name: "Detect potential data exfiltration"
    description: "Alert on large egress transfers to unauthorized destinations"
    direction: egress
    detection:
      type: anomaly
      pattern: "high-volume-transfer"
      threshold: 1024  # MB
      window: 60s
    action: ALERT
    log: true
    log-level: critical
    alert: true
    priority: 20

  # ============================================================================
  # METRICS AND OBSERVABILITY
  # ============================================================================

metrics:
  enabled: true
  export-interval: 60s
  dimensions:
    - rule_id
    - action
    - direction
    - source_network
    - destination_port
    - timestamp

  exported-metrics:
    - packets_allowed
    - packets_denied
    - bytes_allowed
    - bytes_denied
    - connection_count
    - connection_duration_p50
    - connection_duration_p95
    - connection_duration_p99
    - anomaly_detections
    - rate_limit_triggers

alerting:
  enabled: true
  alert-threshold: 10  # Alert after 10 denied packets
  alert-destinations:
    - wotan
    - anamnesis
  alert-channels:
    - dashboard
    - slack  # Optional: configure in unheaded-core
    - email  # Optional: configure in unheaded-core

# ============================================================================
# POLICY GROUPS - Reusable rule collections
# ============================================================================

policy-groups:
  inference-service:
    description: "Common rules for inference endpoints"
    rules:
      - allow-inference-deepseek-ingress
      - allow-inference-qwen-ingress
      - allow-sophia-gateway-ingress

  internal-services:
    description: "Service-to-service communication"
    rules:
      - allow-qdrant-http-internal
      - allow-qdrant-grpc-internal
      - allow-embeddings-internal

  infrastructure:
    description: "Infrastructure traffic"
    rules:
      - allow-protocol-api-egress
      - allow-wotan-metrics-egress
      - allow-vxlan-encapsulation

# ============================================================================
# EXCEPTIONS AND OVERRIDES
# ============================================================================

exceptions:
  - name: "Emergency admin access"
    description: "Temporary override for infrastructure team"
    enabled: false  # Must be explicitly enabled
    rule-override: "default-deny-all"
    conditions:
      - source: "admin-terminal"
      - mfa-verified: true
    duration: 3600  # 1 hour auto-expire
    audit-required: true

  - name: "Maintenance window"
    description: "Temporary rule relaxation for updates"
    enabled: false
    rule-override:
      - deny-unauthorized-egress
    conditions:
      - maintenance-window-active: true
    duration: 7200  # 2 hour auto-expire
    approval-required: true

# ============================================================================
# COMPLIANCE AND AUDIT
# ============================================================================

compliance:
  frameworks:
    - iso27001
    - soc2
    - pci-dss

  required-logging: true
  log-retention-days: 90
  log-encryption: true

  audit-trail:
    enabled: true
    immutable: true
    centralized-storage: "anamnesis"

security:
  threat-model: "zero-trust"
  mfa-for-exceptions: true
  encryption-tls: "1.3"
  certificate-validation: true

endpoints:
  metrics-export: "http://bare-metal:18001/shield/metrics"
  logs-export: "http://bare-metal:17100/api/anamnesis/logs"
  alerts-export: "http://bare-metal:18001/alerts/ingest"
