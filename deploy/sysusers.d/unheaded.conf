# SPDX-License-Identifier: GPL-3.0-or-later
# One system account per service: no shell, no home, no password, and no
# group shared with another service (sysusers(5) "u" makes a same-name group).
# A unit's User= must be listed here (scripts/check-systemd-units.sh).
#
#   sudo install -m 0644 deploy/sysusers.d/unheaded.conf /etc/sysusers.d/
#   sudo systemd-sysusers
#
