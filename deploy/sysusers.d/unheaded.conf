# SPDX-License-Identifier: GPL-3.0-or-later
# One system account per service: no shell, no home, no password, and no
# group shared with another service (sysusers(5) "u" makes a same-name group).
# A unit's User= must be listed here (scripts/check-systemd-units.sh).
#
#   sudo install -m 0644 deploy/sysusers.d/unheaded.conf /etc/sysusers.d/
#   sudo systemd-sysusers
#
#Type Name                   ID  GECOS                                   Home Shell
u     unheaded-wotan         -   "Unheaded Wotan message bus"            /    /usr/sbin/nologin
u     unheaded-timeguru      -   "Unheaded timeguru"                     /    /usr/sbin/nologin
u     unheaded-architect     -   "Unheaded architect"                    /    /usr/sbin/nologin
u     unheaded-captain       -   "Unheaded captain"                      /    /usr/sbin/nologin
u     unheaded-micromanager  -   "Unheaded micromanager"                 /    /usr/sbin/nologin
u     unheaded-monad         -   "Unheaded monad"                        /    /usr/sbin/nologin
u     unheaded-sophia        -   "Unheaded sophia"                       /    /usr/sbin/nologin
u     unheaded-dashboard     -   "Unheaded dashboard backend"            /    /usr/sbin/nologin
u     unheaded-kanban        -   "Unheaded kanban"                       /    /usr/sbin/nologin
u     unheaded-daemon        -   "Unheaded control plane daemon"         /    /usr/sbin/nologin
u     unheaded-akira         -   "Unheaded Akira health monitor"         /    /usr/sbin/nologin
