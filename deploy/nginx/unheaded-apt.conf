# The signed apt repository on west (ADR-026, S-IRON-GATE Phase 14).
# reprepro keeps /var/lib/apt-repo on west; this serves only what apt
# needs: dists/, pool/ and the public key. conf/, db/ and incoming/ (and
# anything else) answer 403. Workers run as the `nginx` account
# (deploy/sysusers.d/unheaded.conf; `user nginx;` in /etc/nginx/nginx.conf).
#
#   sudo install -m 0644 deploy/nginx/unheaded-apt.conf /etc/nginx/sites-enabled/unheaded-apt.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Plain HTTP on purpose: apt checks every file against the signed
# InRelease, so the transport adds no integrity. Loopback, the west-east
# point-to-point link (east reaches it at 192.168.13.2) and the LAN address
# (Stevie, 2026-11-03: LAN machines may install from it; it is HTTP, not
# HTTPS). Never 0.0.0.0.
server {
    listen 127.0.0.1:18888;
    listen 192.168.13.2:18888;
    listen 192.168.69.184:18888;
    server_name _;
    root /var/lib/apt-repo;
    autoindex off;
    server_tokens off;

    location / {
        deny all;
    }
    location /dists/ {
    }
    location /pool/ {
    }
    location = /unheaded-apt.gpg {
        default_type application/pgp-keys;
    }

    access_log /var/log/nginx/unheaded-apt.access.log;
    error_log /var/log/nginx/unheaded-apt.error.log;
}
