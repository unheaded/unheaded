# Unheaded (2026-11-09, Stevie): nginx binds 192.168.13.2 (the point-to-point link
# to east, apt repo :18888), which can come up after network-online.target.
# Retry every 5 s, up to 60 tries, instead of failing the boot.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=60

[Service]
Restart=on-failure
RestartSec=5s
