# S-WEST-GROUND (ADR-147 decision 11). Install on west as
# /etc/systemd/system/docker.service.d/10-unheaded-data.conf, then
# `systemctl daemon-reload` (Phase 5, after the five data binds are in /etc/fstab).
#
# Docker does not start unless the five database mounts are in place: without this
# a failed volume would let the stores start on the old copies underneath.
# Remove this file (and daemon-reload) BEFORE any unmount of the binds, or the
# unmount takes Docker down with it (plan Appendix A, E3).
[Unit]
RequiresMountsFor=/var/lib/docker/volumes/unheaded-dev_postgres-data/_data /var/lib/docker/volumes/unheaded-dev_clickhouse-data/_data /var/lib/docker/volumes/unheaded-dev_victoria-data/_data /var/lib/docker/volumes/monitoring_prometheus_data/_data /var/lib/docker/volumes/unheaded-dev_vector-data/_data
