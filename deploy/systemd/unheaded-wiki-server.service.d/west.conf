# West only: boot ordering for the wiki unit. West's drop-in adds a listener on
# the docker gateway address (VictoriaMetrics scrapes host.docker.internal),
# and that address exists only once dockerd has created docker0.
# 2026-11-12: without this ordering the unit crash-looped 15 times at boot
# (bind: cannot assign requested address) until dockerd created the bridge
# about 3 minutes later.
#
# This file is the part of west's drop-in that the repository can hold. The
# installed /etc/systemd/system/unheaded-wiki-server.service.d/west.conf is
# these lines plus a [Service] section kept on the host only (the bind mount
# of the checkout's wiki/, the --listen addresses and their IPAddressAllow
# lines: they name that host's checkout path and LAN address). Do not install
# this file over the host's: merge the [Unit] section into it.

[Unit]
After=docker.service
# The gateway listener that the host's ExecStart adds, written where the
# repository can read it: VictoriaMetrics scrapes it at
# host.docker.internal:20002, and scripts/check-scrape-publish.sh wants every
# such target to have a listener there. systemd ignores X- options. Keep it in
# step with the host's --listen 172.17.0.1:20002.
X-Unheaded-Listen=172.17.0.1:20002
