# Installed as /etc/systemd/system/<unit>.d/10-start-limit.conf on hosts
# whose installed unit files have drifted from deploy/systemd/ (ADR-147,
# S-SEE-AND-SURVIVE Phase 14). The installed units keep their own RestartSec,
# 5 s, 10 s or 30 s on west (systemctl show, 2026-11-15), so one file must fit
# all three: 180 starts ride out the 15-minute boot window at 5 s (30 min at
# 10 s, 90 min at 30 s), and 180 x 30 s = 90 min stays under the 2 h interval,
# so the limit still trips (scripts/check-unit-start-limits.sh's two rules;
# review 2026-11-15, REV-3). Not for a unit with RestartSec over 39 s.
[Unit]
StartLimitIntervalSec=2h
StartLimitBurst=180
