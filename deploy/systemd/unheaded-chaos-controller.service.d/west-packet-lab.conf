# West only: the S-REAL-STEEL Phase 13 packet lab attaches yaldabaoth-ebpf
# to the lab veth (steel<N>-h) and writes CHAOS_TARGETS, which needs CAP_BPF
# on top of CAP_NET_ADMIN. Not for east (systemd faults only, E3).
#   sudo install -D -m 0644 deploy/systemd/unheaded-chaos-controller.service.d/west-packet-lab.conf \
#     /etc/systemd/system/unheaded-chaos-controller.service.d/west-packet-lab.conf

[Service]
AmbientCapabilities=CAP_NET_ADMIN CAP_BPF
CapabilityBoundingSet=CAP_NET_ADMIN CAP_BPF
