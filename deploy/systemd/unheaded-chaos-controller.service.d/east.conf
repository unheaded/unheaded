# East only: the chaos-controller on east runs the systemd injector and
# nothing else (S-REAL-STEEL Phase 12, E3). It needs NO Linux capabilities:
# it stops/kills/starts units through systemctl, authorized by a polkit rule
# (deploy/polkit/60-unheaded-chaos.rules), never by CAP_NET_ADMIN/CAP_BPF.
# This drop-in strips the capabilities the base unit grants for west's netem
# and packet lab. Do NOT install the west packet-lab drop-in on east.
#   installed by scripts/install-chaos-east.sh to
#   /etc/systemd/system/unheaded-chaos-controller.service.d/east.conf

[Service]
# Empty assignments reset the base unit's values: no ambient capabilities and
# an empty bounding set, so the process can hold no capability at all.
AmbientCapabilities=
CapabilityBoundingSet=
