#
# West's settings for the daily IOC audit (DECISION-PACK-2026-11-18 row 40).
# Install as /etc/systemd/system/unheaded-ioc-audit.service.d/west.conf, then
# `systemctl daemon-reload`.
#
# IOC_KNOWN_MODULES: spl, Ubuntu's ZFS from linux-modules-*, loads at every
#   boot and the kernel calls it out-of-tree; named here it is a note, not an
#   indicator. Any other out-of-tree or unsigned module still fails the run.
# IOC_OPERATOR_NETS: narrowed from every private range to the networks
#   operators log in from: the house LAN (wlp17s0, 192.168.69.128/25), the
#   link to east (enp16s0, 192.168.13.0/30) and the WireGuard overlay
#   (fd00:dead:beef::/64). A login from anywhere else, loopback included, is
#   an indicator. Every SSH login of the 21 days before 2026-11-22 came from
#   the LAN.
[Service]
Environment="IOC_KNOWN_MODULES=spl"
Environment="IOC_OPERATOR_NETS=192.168.69.128/25 192.168.13.0/30 fd00:dead:beef::/64"
