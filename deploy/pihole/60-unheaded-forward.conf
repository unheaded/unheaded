# Pi-hole container (LXD, west) -> the syslog relay on west (ADR-124,
# S-LOG-HARVEST Step 150). rsyslog core only: imfile and omfwd ship with the
# rsyslog package already in the container.
#
#   lxc file push deploy/pihole/60-unheaded-forward.conf pihole/etc/rsyslog.d/60-unheaded-forward.conf --mode 0644
#   lxc exec pihole -- rsyslogd -N1          # validate before the restart
#   lxc exec pihole -- systemctl restart rsyslog
#
# Three files are followed, one tag each. The relay names the sources.yaml
# row from the sender address and the tag (pihole/dns, pihole/ftl,
# pihole/web); every other line from the container lands on pihole/journal.
#
# The file lines go to the relay only (their own ruleset), so the DNS log,
# which is personal data, is not copied into /var/log/syslog here.
#
# rsyslog runs as `syslog`; the files are pihole:pihole 0640. The account
# needs the group once (Step 155): usermod -aG pihole syslog. Do not chmod
# the files, Pi-hole's logrotate re-creates them.
#
# What can still go missing, and where it would show:
#   - A first start begins at the end of each file (freshStartTail). What
#     was written before is brought in by scripts/pihole-history.sh.
#   - The relay drops above 200 lines a second from one sender (burst 1000;
#     unheaded_syslog_relay_dropped_total{reason="rate"}). The DNS log has
#     reached 800 in a second and 14,500 in a minute, so the queue below
#     sends at most 150 a second and holds the rest.
#   - While the relay is away the queue fills to 4500 lines and imfile stops
#     reading. The files hold the rest. A file rotated away five times
#     (pihole.log: five days) before the relay returns is not read.
#   - rsyslog stopped while the relay is away: the queue is written to
#     /var/spool/rsyslog and sent after the next start. The batch in hand
#     (up to 15 lines) can be lost, and rsyslog logs about one line per
#     queued line on the way down.
#   - The relay restarted: TCP has no acknowledgement, so lines already
#     written to the socket can be lost, and a batch can arrive twice.
#   - After a crash rsyslog resumes from the last saved position (every 1000
#     lines): some lines twice, none lost.
#   Lost lines are still in the files; scripts/pihole-history.sh loads what
#   the relay did not ship.
#
# Tested 2026-11-10 with rsyslogd 8.2504.0 on made-up lines (burst, relay
# down, relay restart, rsyslog restart with the relay up and down). The
# container runs 8.2312.0: `rsyslogd -N1` there (Step 153) is the first check
# on that version.

module(load="imfile")

input(type="imfile" File="/var/log/pihole/pihole.log" Tag="pihole-dns"
      Severity="info" Facility="local5" ruleset="unheaded-files"
      freshStartTail="on" reopenOnTruncate="on" PersistStateInterval="1000")
input(type="imfile" File="/var/log/pihole/FTL.log" Tag="pihole-ftl"
      Severity="info" Facility="local5" ruleset="unheaded-files"
      freshStartTail="on" reopenOnTruncate="on" PersistStateInterval="1000")
input(type="imfile" File="/var/log/pihole/webserver.log" Tag="pihole-web"
      Severity="info" Facility="local5" ruleset="unheaded-files"
      freshStartTail="on" reopenOnTruncate="on" PersistStateInterval="1000")

# rsyslog.conf turns this on, and it would fold identical lines into "message
# repeated N times". Every query is its own line here. Actions defined after
# this point inherit it.
$RepeatedMsgReduction off

# File lines. 15 lines every 100 ms is the 150 a second. The action has no
# queue of its own, so while the relay is away the worker waits and this
# queue fills. At 4500 lines imfile is made to wait: the file is the buffer.
# The disk part (queue.filename) is only for shutdown: the high watermark
# sits above the delay mark, so a running rsyslog never spills to disk. With
# the watermark at its default the disk queue held lines back until shutdown.
# Keep queue.size well above 1024: imfile hands over up to 1024 lines at once
# and a smaller queue never starts its worker.
ruleset(name="unheaded-files"
        queue.type="LinkedList" queue.size="5000"
        queue.fullDelayMark="4500" queue.lightDelayMark="4000"
        queue.highWatermark="4990"
        queue.filename="unheaded-files" queue.maxDiskSpace="64m"
        queue.saveOnShutdown="on"
        queue.dequeueBatchSize="15" queue.dequeueSlowdown="100000") {
    action(type="omfwd" name="unheaded-files"
           Target="10.10.20.1" Port="514" Protocol="tcp"
           TCP_Framing="octet-counted"
           Template="RSYSLOG_SyslogProtocol23Format"
           action.resumeRetryCount="-1" action.resumeInterval="5")
}

# The container's own syslog (units, sshd, cron). Its own queue, in memory,
# 30 a second, and a full queue (10,000 lines) drops at once: local logging
# must never wait on the relay.
action(type="omfwd" name="unheaded-syslog"
       Target="10.10.20.1" Port="514" Protocol="tcp"
       TCP_Framing="octet-counted"
       Template="RSYSLOG_SyslogProtocol23Format"
       queue.type="LinkedList" queue.size="10000" queue.timeoutEnqueue="0"
       queue.dequeueBatchSize="3" queue.dequeueSlowdown="100000"
       action.resumeRetryCount="-1" action.resumeInterval="5")
