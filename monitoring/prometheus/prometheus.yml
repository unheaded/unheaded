# Prometheus configuration - Primary observability host (Forge, host-a)
# Unheaded Kingdom infrastructure
# License: MIT, Copyright (c) 2024-2026 Stevie Bellis

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "unheaded"
    env: "production"

scrape_configs:
  # Self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Node exporters on both hosts
  - job_name: node_exporter
    static_configs:
      - targets:
          - '[fd00:dead:beef::1]:9100'
          - '[fd00:dead:beef::2]:9100'

  # Unheaded daemon metrics (job = binary name). West runs it in docker-compose.yml as cuirass
  # (published on 19006), east as unheaded-unheaded-daemon on 17000. These
  # were :9090 on both, which is this Prometheus on west and nothing on east.
  - job_name: unheaded-daemon
    metrics_path: /metrics
    static_configs:
      - targets: ['[fd00:dead:beef::1]:19006']
        labels: {host: west}
      - targets: ['[fd00:dead:beef::2]:17000']
        labels: {host: east}

  # Huginn (host metrics agent, ADR-084) on west: it also serves the Well's
  # backup/offsite/drill textfile metrics that rules/well.yml alerts on. It
  # pushes to VictoriaMetrics, which evaluates no rules; scraped here so the
  # Well alerts have data.
  - job_name: huginn
    static_configs:
      - targets: ['[fd00:dead:beef::1]:9110']
        labels: {host: west}

  # FRR exporter (host-a only)
  - job_name: frr_exporter
    static_configs:
      - targets:
          - '[fd00:dead:beef::1]:9342'

  # BIRD exporter (host-b only)
  - job_name: bird_exporter
    static_configs:
      - targets:
          - '[fd00:dead:beef::2]:9324'

  # Routing health checks
  - job_name: routing_health
    metrics_path: /metrics
    static_configs:
      - targets:
          - '[fd00:dead:beef::1]:8080'
          - '[fd00:dead:beef::2]:8080'

  # Doom Range services (16666-16689)
  - job_name: doom_services
    static_configs:
      # Protocol services
      - targets: ['[fd00:dead:beef::1]:16666']
        labels:
          service: "protocol-api"
      - targets: ['[fd00:dead:beef::1]:16667']
        labels:
          service: "dashboard-backend"
      - targets: ['[fd00:dead:beef::1]:16668']
        labels:
          service: "monad"
      - targets: ['[fd00:dead:beef::1]:16669']
        labels:
          service: "sophia"
      - targets: ['[fd00:dead:beef::1]:16670']
        labels:
          service: "anamnesis"
      - targets: ['[fd00:dead:beef::1]:16672']
        labels:
          service: "shield"
      - targets: ['[fd00:dead:beef::1]:16673']
        labels:
          service: "timeguru-svc"
      - targets: ['[fd00:dead:beef::1]:16674']
        labels:
          service: "captain-svc"
      - targets: ['[fd00:dead:beef::1]:16675']
        labels:
          service: "micromanager-svc"
      - targets: ['[fd00:dead:beef::1]:16676']
        labels:
          service: "architect-svc"
      - targets: ['[fd00:dead:beef::1]:16677']
        labels:
          service: "developer-svc"
      - targets: ['[fd00:dead:beef::1]:16678']
        labels:
          service: "blackmage-svc"
      - targets: ['[fd00:dead:beef::1]:16679']
        labels:
          service: "moatghost-svc"
      - targets: ['[fd00:dead:beef::1]:16680']
        labels:
          service: "busboy-svc"
      - targets: ['[fd00:dead:beef::1]:16681']
        labels:
          service: "lore-svc"
      - targets: ['[fd00:dead:beef::1]:16682']
        labels:
          service: "kingdom-svc"
      - targets: ['[fd00:dead:beef::1]:16683']
        labels:
          service: "rfceditor-svc"
      - targets: ['[fd00:dead:beef::1]:16684']
        labels:
          service: "calendar-svc"
      - targets: ['[fd00:dead:beef::1]:16685']
        labels:
          service: "scientist-svc"
      - targets: ['[fd00:dead:beef::1]:16686']
        labels:
          service: "warmonger-svc"
      - targets: ['[fd00:dead:beef::1]:16687']
        labels:
          service: "librarian-svc"
      - targets: ['[fd00:dead:beef::1]:16688']
        labels:
          service: "barrister-svc"
      - targets: ['[fd00:dead:beef::1]:16689']
        labels:
          service: "unheaded-daemon"

  # eBPF trace collector, one per host (host unit unheaded-trace-collector,
  # /metrics on 16671 = pkg/ports.TraceCollectorMetrics); alerts in
  # rules/collector.yml. 16671 used to sit in doom_services above labelled
  # "wotan", so the collector was scraped under the wrong name and never
  # on east.
  - job_name: trace-collector
    static_configs:
      - targets: ['[fd00:dead:beef::1]:16671']
        labels: {host: west}
      - targets: ['[fd00:dead:beef::2]:16671']
        labels: {host: east}

  # CISA KEV feed poller, one per host (ADR-055); alerts in rules/threat-feeds.yml
  - job_name: kev-poller
    static_configs:
      - targets:
          - '[fd00:dead:beef::1]:19120'
          - '[fd00:dead:beef::2]:19120'

  # heimdall-daemon drift publish counters + scan duration (M-085), one per
  # host. Its -metrics-addr defaults to 127.0.0.1:19101, which this
  # container cannot reach: a host that runs it for this scrape passes
  # -metrics-addr '[fd00:dead:beef::N]:19101'. No unit runs it on either
  # host yet (2026-10-27), so both targets read up == 0 until one does.
  - job_name: heimdall
    static_configs:
      - targets: ['[fd00:dead:beef::1]:19101']
        labels: {host: west}
      - targets: ['[fd00:dead:beef::2]:19101']
        labels: {host: east}

  # Vector's own counters (ADR-092 step 8); alerts in rules/logs.yml.
  # docker-compose.yml publishes 9598 on the docker0 gateway only.
  - job_name: vector
    static_configs:
      - targets: ['host.docker.internal:9598']

  # Dashboard backend, one per host (host metrics + service metrics). The
  # dashboard SLO (observability/alerting/policy.yaml) is up on both.
  - job_name: dashboard-backend
    static_configs:
      - targets:
          - '[fd00:dead:beef::1]:20000'
          - '[fd00:dead:beef::2]:20000'
        labels:
          service: "dashboard-backend"

  # Wotan, one per host; the wotan SLO is up on both.
  - job_name: wotan
    static_configs:
      - targets:
          - '[fd00:dead:beef::1]:18000'
          - '[fd00:dead:beef::2]:18000'
        labels:
          service: "wotan"

  # alert-mailer (same compose network): its own counters, and the
  # dead-man's switch gauge unheaded_heartbeat_last_seen_timestamp_seconds
  # that rules/heartbeat.yml alerts on (present only with HEARTBEAT_HOSTS).
  - job_name: alert-mailer
    static_configs:
      # No host target label: the gauge's own host label names the watched
      # host, and a target label would rename it to exported_host.
      - targets: ['alert-mailer:19130']

remote_write:
  - url: 'http://[fd00:dead:beef::1]:8428/api/v1/write'
    queue_config:
      max_samples_per_send: 10000

rule_files:
  - 'rules/*.yml'

# Where firing rules go. Without this block Prometheus evaluated every rule
# and sent nothing anywhere (2026-10-20): Alertmanager, and the email path
# behind it (FND-001), never saw an alert. scripts/monitoring/
# test-alertmanager-email.sh proves a firing rule arrives.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
