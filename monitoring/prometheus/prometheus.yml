# Prometheus configuration - west
# Unheaded Kingdom infrastructure
#
# What this Prometheus is for since 2026-11-11 (ADR-117): it evaluates the
# alert and recording rules (rules/*.yml) and hands firing alerts to
# Alertmanager. It scrapes the targets those rules read, keeps 30 days, and
# is not the metrics store: VictoriaMetrics in docker-compose.yml scrapes the
# same targets itself (config/victoria/scrape.yml) and is what Grafana reads.
# A job added here for a rule needs the same job there for a dashboard.
# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (c) 2024-2026 Stevie Bellis.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "unheaded"
    env: "production"

scrape_configs:
  # Self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Node exporters on both hosts
  - job_name: node_exporter
    static_configs:
      - targets:
          - '[fd00:dead:beef::1]:9100'
          - '[fd00:dead:beef::2]:9100'

  # Unheaded daemon metrics (job = binary name). West runs it in docker-compose.yml as cuirass
  # (published on 19006), east as unheaded-unheaded-daemon on 17000. These
  # were :9090 on both, which is this Prometheus on west and nothing on east.
  - job_name: unheaded-daemon
    metrics_path: /metrics
    tls_config: {ca_file: /etc/prometheus-tls/ca.pem, server_name: localhost}
    static_configs:
      - targets: ['[fd00:dead:beef::1]:19006']
        labels: {host: west, __scheme__: https}
      - targets: ['[fd00:dead:beef::2]:17000']
        labels: {host: east}

  # Huginn (host metrics agent, ADR-084) on west: it also serves the Well's
  # backup/offsite/drill textfile metrics that rules/well.yml alerts on. It
  # pushes to VictoriaMetrics, which evaluates no rules; scraped here so the
  # Well alerts have data. huginn binds loopback unless HUGINN_LISTEN in
  # /etc/huginn.env names the overlay address too.
  - job_name: huginn
    static_configs:
      - targets: ['[fd00:dead:beef::1]:9110']
        labels: {host: west}

  # Four jobs left this file on 2026-11-11 (ADR-117): frr_exporter,
  # bird_exporter, routing_health and doom_services (23 targets on the old
  # 16666-16689 port block). Nothing listens on any of them on either host
  # and no rule reads them: 27 targets that had only ever read up == 0.
  # docs/sweeps/ONE-GRAFANA-INVENTORY-2026-11-11.md lists each.

  # eBPF trace collector, one per host (host unit unheaded-trace-collector,
  # /metrics on 16671 = pkg/ports.TraceCollectorMetrics); alerts in
  # rules/collector.yml. The unit binds loopback unless TRACE_METRICS_ADDR in
  # /etc/unheaded/trace-collector.env names the overlay address too.
  - job_name: trace-collector
    static_configs:
      - targets: ['[fd00:dead:beef::1]:16671']
        labels: {host: west}
      - targets: ['[fd00:dead:beef::2]:16671']
        labels: {host: east}

  # CISA KEV feed poller, one per host (ADR-055); alerts in rules/threat-feeds.yml
  - job_name: kev-poller
    static_configs:
      - targets:
          - '[fd00:dead:beef::1]:19120'
          - '[fd00:dead:beef::2]:19120'

  # heimdall-daemon drift publish counters + scan duration (M-085), one per
  # host. Its -metrics-addr defaults to 127.0.0.1:19101, which this
  # container cannot reach: a host that runs it for this scrape passes
  # -metrics-addr '[fd00:dead:beef::N]:19101'. No unit runs it on either
  # host yet (2026-10-27), so both targets read up == 0 until one does.
  - job_name: heimdall
    static_configs:
      - targets: ['[fd00:dead:beef::1]:19101']
        labels: {host: west}
      - targets: ['[fd00:dead:beef::2]:19101']
        labels: {host: east}

  # Vector's own counters (ADR-092 step 8); alerts in rules/logs.yml.
  # docker-compose.yml publishes 9598 on the docker0 gateway only.
  - job_name: vector
    static_configs:
      - targets: ['host.docker.internal:9598']

  # Native syslog relay on west (ADR-124); alerts in rules/logs.yml. The unit
  # binds this overlay address as well as loopback, because this container
  # cannot reach loopback. Reads up == 0 until Step 141 installs the relay.
  - job_name: syslog-relay
    static_configs:
      - targets: ['[fd00:dead:beef::1]:9599']
        labels: {host: west}

  # Dashboard backend, one per host (host metrics + service metrics). The
  # dashboard SLO (observability/alerting/policy.yaml) is up on both.
  - job_name: dashboard-backend
    tls_config: {ca_file: /etc/prometheus-tls/ca.pem, server_name: localhost}
    static_configs:
      - targets: ['[fd00:dead:beef::1]:20000']
        labels: {service: "dashboard-backend", __scheme__: https}
      - targets: ['[fd00:dead:beef::2]:20000']
        labels: {service: "dashboard-backend"}

  # Wotan: west only until east's debs are upgraded (Evening 10B); east's
  # 1.0.0 unit crash-loops on a flag, which would burn this SLO from day one.
  - job_name: wotan
    tls_config: {ca_file: /etc/prometheus-tls/ca.pem, server_name: localhost}
    static_configs:
      - targets: ['[fd00:dead:beef::1]:18000']
        labels: {service: "wotan", __scheme__: https}

  # zhen-agentd on west: its API stays on 127.0.0.1:20111; -metrics-addr
  # (env ZHEN_METRICS_ADDR) serves /metrics alone on the WireGuard address,
  # same port number. zhen_scheduler_heartbeat_timestamp_seconds feeds
  # rules/zhen.yml (ZhenSchedulerStalled). Reads up == 0 until the unit
  # runs with -scheduler -metrics-addr (S-CHAMPION-HARDENING E4).
  - job_name: zhen-agentd
    static_configs:
      - targets: ['[fd00:dead:beef::1]:20111']
        labels: {host: west}

  # alert-mailer (same compose network): its own counters, and the
  # dead-man's switch gauge unheaded_heartbeat_last_seen_timestamp_seconds
  # that rules/heartbeat.yml alerts on (present only with HEARTBEAT_HOSTS).
  - job_name: alert-mailer
    static_configs:
      # No host target label: the gauge's own host label names the watched
      # host, and a target label would rename it to exported_host.
      - targets: ['alert-mailer:19130']

# Only what VictoriaMetrics cannot get for itself goes over: rule results
# (recorded series all have a colon in the name; ALERTS and ALERTS_FOR_STATE
# are the alert states) and the two jobs only this container can reach.
# The SLO dashboard, pkg/sloguard and the compliance evidence read slo:*
# there. Everything else is scraped there directly; forwarding it too stored
# each series twice under two instance names.
remote_write:
  - url: 'http://[fd00:dead:beef::1]:8428/api/v1/write'
    queue_config:
      max_samples_per_send: 10000
    write_relabel_configs:
      - source_labels: [__name__, job]
        separator: ';'
        regex: '([^;]*:[^;]*|ALERTS|ALERTS_FOR_STATE);.*|[^;]*;(alert-mailer|prometheus)'
        action: keep

rule_files:
  - 'rules/*.yml'

# Where firing rules go. Without this block Prometheus evaluated every rule
# and sent nothing anywhere (2026-10-20): Alertmanager, and the email path
# behind it (FND-001), never saw an alert. scripts/monitoring/
# test-alertmanager-email.sh proves a firing rule arrives.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
