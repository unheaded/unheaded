# Prometheus alert rules - AlertPipelineHeartbeat, always firing (ADR-100 section 4)
# Unheaded Kingdom infrastructure
# License: GPL-3.0-or-later, Copyright (c) 2024-2026 Stevie Bellis
#
# AlertPipelineHeartbeat is always firing, and firing is the healthy state.
# It is urgency none, so it never mails anyone: it is the proof, on
# Alertmanager's page (ssh -L 9093:127.0.0.1:9093 west) and in Grafana, that
# Prometheus is evaluating rules and Alertmanager is receiving them. If it is
# missing there, the alerting path is broken and nothing else on the page
# can be trusted, quiet or not. Named Watchdog until 2026-11-11 (Stevie: the
# name said nothing about what it was).
#
# A host that stops reporting at all is heartbeat.yml's HeartbeatMissing.

groups:
  - name: alert-pipeline-heartbeat
    interval: 1m
    rules:
      - alert: AlertPipelineHeartbeat
        expr: vector(1)
        labels:
          severity: none
          urgency: none
        annotations:
          summary: "Heartbeat: alerts are reaching Alertmanager (healthy while firing)"
          description: "Always firing, on purpose. If this alert is missing from Alertmanager, rule evaluation or delivery is broken."
          runbook_url: "runbooks/observe/heartbeat-missing.yaml"
