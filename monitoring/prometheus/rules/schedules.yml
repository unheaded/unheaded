# Prometheus alert rules - the platform's own schedules (ADR-149)
# Unheaded Kingdom infrastructure
# License: GPL-3.0-or-later, Copyright (c) 2024-2026 Stevie Bellis
#
# Platform checks run on systemd timers the platform owns, never inside a
# module (ADR-147 decision 15 (a)): unheaded-health-sweep.timer every 6 hours
# and unheaded-ioc-audit.timer daily. Each run goes through
# scripts/monitoring/platform-schedule.sh, which writes
# unheaded_schedule_last_run_timestamp_seconds, _last_exit_code and
# _last_success_timestamp_seconds{schedule} to the textfile directory, and
# Huginn forwards them. The success time survives a failed run; for a check
# that has never succeeded it is the first run's time, so the clock starts at
# install. A host that was off has no fresh run; back up, the timer's
# Persistent= runs the missed check at boot, and the 30m hold lets that run
# land before anything fires.
#
# The IOC audit (runbooks/security/ioc-audit.yaml) fails its run when it finds
# an indicator and when it could not see: three days without a success is
# IOCAuditNotSucceeding (Stevie, 2026-11-12: "alarm if fails for n+ days";
# n = 3). The health sweep (runbooks/observe/service-health-sweep.yaml) fails
# when a service of this host's targets file does not answer /health: a day
# without a success is HealthSweepNotSucceeding.

groups:
  - name: schedules
    interval: 1m
    rules:
      - alert: IOCAuditNotSucceeding
        expr: |
          time() - max by (host, schedule) (unheaded_schedule_last_success_timestamp_seconds{schedule="ioc-audit"}) > 3 * 86400
        for: 30m
        labels:
          severity: warning
          urgency: none
        annotations:
          summary: "The daily indicator-of-compromise audit has not succeeded for over 3 days"
          description: "Every ioc-audit run since then failed or none ran: it kept finding an indicator, or it could not see (VictoriaMetrics or journal shipping down). Read `journalctl -u unheaded-ioc-audit`, or run the runbook by hand"
          runbook_url: "runbooks/security/ioc-audit.yaml"

      - alert: HealthSweepNotSucceeding
        expr: |
          time() - max by (host, schedule) (unheaded_schedule_last_success_timestamp_seconds{schedule="service-health-sweep"}) > 86400
        for: 30m
        labels:
          severity: warning
          urgency: none
        annotations:
          summary: "The health sweep has not succeeded for over a day"
          description: "Every run since then failed or none ran: a service on this host does not answer /health, or the timer stopped. Read journalctl -u unheaded-health-sweep"
          runbook_url: "runbooks/observe/service-health-sweep.yaml"
