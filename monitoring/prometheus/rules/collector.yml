# Prometheus alert rules - the eBPF trace collector (M-084)
# Unheaded Kingdom infrastructure
# License: GPL-3.0-or-later, Copyright (c) 2024-2026 Stevie Bellis
#
# unheaded-trace-collector (cmd/trace-collector-go) runs on west and east as
# a host unit and serves /metrics on 16671 (pkg/ports.TraceCollectorMetrics);
# the trace-collector job in prometheus.yml scrapes both. It loads the XDP/TC
# programs and publishes Anamnesis events to Wotan, so when it is down the
# dashboard's flow and latency views go empty without anything else failing.
#
# TraceCollectorDown is promoted to a ticket in observability/alerting/
# policy.yaml (no SLO covers the collector). TraceCollectorHighLatency is a
# cause, recorded only: trace_publisher_flush_duration_seconds is the time to
# flush one batch to Wotan, so it is usually Wotan being slow. Until
# 2026-11-15 it read trace_collector_batch_latency_seconds, which nothing
# observes (count 0 for 14 days; S-WATCH-TRUE, ADR-147 SSV-12).
#
# heimdall's two rules were removed 2026-11-15 (S-WATCH-TRUE, W2, answered
# 2026-11-12): no host runs heimdall-daemon. A rule returns with its producer and a test
# (decision 25). Runbooks kept.

groups:
  - name: trace-collector
    interval: 1m
    rules:
      - alert: TraceCollectorDown
        expr: up{job="trace-collector"} == 0
        for: 5m
        labels:
          severity: warning
          urgency: none
        annotations:
          summary: "Trace collector on {{ $labels.host }} is not answering"
          description: "{{ $labels.instance }} has failed every scrape for 5 minutes: no eBPF events reach Wotan from {{ $labels.host }}"
          runbook_url: "runbooks/observe/trace-collector-down.yaml"

      # Share of flushes to Wotan over 100 ms, only while flushes happen. The
      # histogram is trace_publisher_flush_duration_seconds (top bucket 0.1 s);
      # trace_collector_batch_latency_seconds was never observed (S-WATCH-TRUE).
      - alert: TraceCollectorHighLatency
        expr: |
          (
            sum by (job, instance, host) (rate(trace_publisher_flush_duration_seconds_count[10m]))
            - sum by (job, instance, host) (rate(trace_publisher_flush_duration_seconds_bucket{le="0.1"}[10m]))
          )
          / sum by (job, instance, host) (rate(trace_publisher_flush_duration_seconds_count[10m])) > 0.01
          and sum by (job, instance, host) (rate(trace_publisher_flush_duration_seconds_count[10m])) > 0
        for: 15m
        labels:
          severity: warning
          urgency: none
        annotations:
          summary: "Trace collector on {{ $labels.host }}: over 1% of flushes to Wotan take over 100 ms"
          description: "Over 10m, more than 1% of {{ $labels.instance }}'s flushes to Wotan were slower than 100 ms; Wotan is slow or the collector is backlogged"
          runbook_url: "runbooks/observe/high-latency.yaml"
