# promtool test rules zhen_test.yml (from this directory)
rule_files:
  - ../zhen.yml
evaluation_interval: 1m
tests:
  # The scheduler ticks every minute for 30m, then its ticker sticks: the
  # gauge is still scraped but keeps the 30m value. Quiet while it beats
  # and for 15m after; past 15m stale and the 1m hold, it fires.
  - interval: 1m
    input_series:
      - series: 'zhen_scheduler_heartbeat_timestamp_seconds{job="zhen-agentd",instance="[fd00:dead:beef::1]:20111"}'
        values: '0+60x30 1800x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ZhenSchedulerStalled
        exp_alerts: []
      - eval_time: 46m
        alertname: ZhenSchedulerStalled
        exp_alerts: []
      - eval_time: 48m
        alertname: ZhenSchedulerStalled
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: zhen-agentd, instance: "[fd00:dead:beef::1]:20111"}
            exp_annotations:
              summary: "Zhen's scheduler has not ticked for over 15 minutes"
              description: "No zhen_scheduler_heartbeat_timestamp_seconds from zhen-agentd, or its last tick is stale: scheduled runbooks are not running (zhen-agentd down, started without -scheduler, or its ticker stuck)"
              runbook_url: "runbooks/observe/zhen-scheduler-stalled.yaml"

  # zhen-agentd runs without -scheduler (or is not scraped): the gauge never
  # appears. It fires once the 1m hold passes.
  - interval: 1m
    input_series:
      - series: 'up{job="zhen-agentd",instance="[fd00:dead:beef::1]:20111"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 0m
        alertname: ZhenSchedulerStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: ZhenSchedulerStalled
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: zhen-agentd}
            exp_annotations:
              summary: "Zhen's scheduler has not ticked for over 15 minutes"
              description: "No zhen_scheduler_heartbeat_timestamp_seconds from zhen-agentd, or its last tick is stale: scheduled runbooks are not running (zhen-agentd down, started without -scheduler, or its ticker stuck)"
              runbook_url: "runbooks/observe/zhen-scheduler-stalled.yaml"

  # The daemon stops at 10m: the series ends. Within the 15m window it is
  # neither absent nor (once the 5m lookback drops it) stale-valued; after
  # 15m without a sample it is absent and fires. A restart clears it.
  - interval: 1m
    input_series:
      - series: 'zhen_scheduler_heartbeat_timestamp_seconds{job="zhen-agentd",instance="[fd00:dead:beef::1]:20111"}'
        values: '0+60x10 _x20 1860+60x10'
    alert_rule_test:
      - eval_time: 20m
        alertname: ZhenSchedulerStalled
        exp_alerts: []
      - eval_time: 27m
        alertname: ZhenSchedulerStalled
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: zhen-agentd}
            exp_annotations:
              summary: "Zhen's scheduler has not ticked for over 15 minutes"
              description: "No zhen_scheduler_heartbeat_timestamp_seconds from zhen-agentd, or its last tick is stale: scheduled runbooks are not running (zhen-agentd down, started without -scheduler, or its ticker stuck)"
              runbook_url: "runbooks/observe/zhen-scheduler-stalled.yaml"
      - eval_time: 35m
        alertname: ZhenSchedulerStalled
        exp_alerts: []

  # ioc-audit last succeeded at t=0 and the daemon keeps exporting that. Up
  # to three days it is quiet; past three days it waits out the 30m hold,
  # then fires. A success at 74h (the gauge moves to then) clears it. The
  # other job's gauge is as old and does not fire: the alarm is this job's.
  - interval: 1m
    input_series:
      - series: 'zhen_scheduler_job_last_success_timestamp_seconds{job="zhen-agentd",instance="[fd00:dead:beef::1]:20111",schedule="ioc-audit"}'
        values: '0x4440 266400x120'
      - series: 'zhen_scheduler_job_last_success_timestamp_seconds{job="zhen-agentd",instance="[fd00:dead:beef::1]:20111",schedule="service-health-sweep"}'
        values: '0x4560'
    alert_rule_test:
      - eval_time: 71h
        alertname: IOCAuditNotSucceeding
        exp_alerts: []
      - eval_time: 72h20m
        alertname: IOCAuditNotSucceeding
        exp_alerts: []
      - eval_time: 73h
        alertname: IOCAuditNotSucceeding
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: zhen-agentd, instance: "[fd00:dead:beef::1]:20111", schedule: ioc-audit}
            exp_annotations:
              summary: "The daily indicator-of-compromise audit has not succeeded for over 3 days"
              description: "Every ioc-audit run since then failed or none ran: it kept finding an indicator, or it could not see (VictoriaMetrics or journal shipping down). Read the newest scheduled-run card in Review, or run the runbook by hand"
              runbook_url: "runbooks/security/ioc-audit.yaml"
      - eval_time: 75h
        alertname: IOCAuditNotSucceeding
        exp_alerts: []

  # The host was off for five days: no series, no alarm. Back up, the gauge
  # still says five days ago for the minutes until the catch-up run lands;
  # the 30m hold keeps that from firing.
  - interval: 1m
    input_series:
      - series: 'zhen_scheduler_job_last_success_timestamp_seconds{job="zhen-agentd",instance="[fd00:dead:beef::1]:20111",schedule="ioc-audit"}'
        values: '0x10 _x7180 0x3 432180x60'
    alert_rule_test:
      - eval_time: 100h
        alertname: IOCAuditNotSucceeding
        exp_alerts: []
      - eval_time: 7193m
        alertname: IOCAuditNotSucceeding
        exp_alerts: []
      - eval_time: 7240m
        alertname: IOCAuditNotSucceeding
        exp_alerts: []
