# promtool test rules collector_test.yml (from this directory)
rule_files:
  - ../collector.yml
evaluation_interval: 1m
tests:
  # East's collector stops answering at 5m; west never does. Five minutes
  # of failed scrapes fire, four do not.
  - interval: 1m
    input_series:
      - series: 'up{job="trace-collector",instance="[fd00:dead:beef::1]:16671",host="west"}'
        values: '1x20'
      - series: 'up{job="trace-collector",instance="[fd00:dead:beef::2]:16671",host="east"}'
        values: '1x4 0x16'
    alert_rule_test:
      - eval_time: 9m
        alertname: TraceCollectorDown
        exp_alerts: []
      - eval_time: 10m
        alertname: TraceCollectorDown
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: trace-collector, instance: "[fd00:dead:beef::2]:16671", host: east}
            exp_annotations:
              summary: "Trace collector on east is not answering"
              description: "[fd00:dead:beef::2]:16671 has failed every scrape for 5 minutes: no eBPF events reach Wotan from east"
              runbook_url: "runbooks/observe/trace-collector-down.yaml"

  # West: 5% of flushes over 100 ms; east: 0.2%; a third collector flushes
  # nothing. Only west fires, and only after 15m (ADR-147 SSV-12).
  - interval: 1m
    input_series:
      - series: 'trace_publisher_flush_duration_seconds_count{job="trace-collector",instance="w",host="west",topic="traces.flow"}'
        values: '0+100x40'
      - series: 'trace_publisher_flush_duration_seconds_bucket{job="trace-collector",instance="w",host="west",topic="traces.flow",le="0.1"}'
        values: '0+95x40'
      - series: 'trace_publisher_flush_duration_seconds_count{job="trace-collector",instance="e",host="east",topic="traces.flow"}'
        values: '0+1000x40'
      - series: 'trace_publisher_flush_duration_seconds_bucket{job="trace-collector",instance="e",host="east",topic="traces.flow",le="0.1"}'
        values: '0+998x40'
      - series: 'trace_publisher_flush_duration_seconds_count{job="trace-collector",instance="i",host="idle",topic="traces.flow"}'
        values: '0x40'
      - series: 'trace_publisher_flush_duration_seconds_bucket{job="trace-collector",instance="i",host="idle",topic="traces.flow",le="0.1"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: TraceCollectorHighLatency
        exp_alerts: []
      - eval_time: 26m
        alertname: TraceCollectorHighLatency
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: trace-collector, instance: w, host: west}
            exp_annotations:
              summary: "Trace collector on west: over 1% of flushes to Wotan take over 100 ms"
              description: "Over 10m, more than 1% of w's flushes to Wotan were slower than 100 ms; Wotan is slow or the collector is backlogged"
              runbook_url: "runbooks/observe/high-latency.yaml"
