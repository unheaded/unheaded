# promtool test rules compliance_test.yml (from this directory)
rule_files:
  - ../compliance.yml
evaluation_interval: 1m
tests:
  # Fresh Prometheus: every open finding is there from the first sample and
  # there is no hour-old register to compare with. Nothing is "new".
  - interval: 1m
    input_series:
      - series: 'unheaded_compliance_finding{key="a",host="west",severity="high"}'
        values: '1x120'
      - series: 'unheaded_compliance_finding{key="b",host="west",severity="low"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 10m
        alertname: ComplianceNewFinding
        exp_alerts: []
      - eval_time: 10m
        alertname: ComplianceNewSevereFinding
        exp_alerts: []
      - eval_time: 90m
        alertname: ComplianceNewFinding
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unheaded_compliance_report_ok'
        values: '1x10 0x10'
      - series: 'unheaded_compliance_finding{key="host-sshd:east:x",host="east",severity="high"}'
        values: '_x70 1x100'
      # The register is never empty: an old finding there all along.
      - series: 'unheaded_compliance_finding{key="host-probe:west:old",host="west",severity="low"}'
        values: '1x170'
      - series: 'unheaded_compliance_acceptances_expired'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 18m
        alertname: ComplianceReportBroken
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none}
            exp_annotations:
              summary: "Findings register cannot be built"
              description: "dashboard-backend could not read the catalog, register or evidence; the finding count is not trustworthy until fixed"
              runbook_url: "runbooks/security/compliance-evidence.yaml"
      - eval_time: 75m
        alertname: ComplianceNewSevereFinding
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none, key: "host-sshd:east:x", host: east}
            exp_annotations:
              summary: "New high finding: host-sshd:east:x"
              description: "host-sshd:east:x on east started failing within the last hour"
              runbook_url: "runbooks/security/compliance-evidence.yaml"
      # Still failing an hour later: no longer new (it pages once, not forever).
      - eval_time: 135m
        alertname: ComplianceNewSevereFinding
        exp_alerts: []
      - eval_time: 8m
        alertname: ComplianceAcceptanceExpired
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none}
            exp_annotations:
              summary: "1 risk acceptance(s) expired"
              description: "Fix the finding or re-decide the acceptance in compliance/findings/register.yaml"
              runbook_url: "runbooks/security/compliance-evidence.yaml"

  # ComplianceWellFallback: fires on a regression from The Well, never on
  # the expected state before The Well is seeded.
  - interval: 1m
    input_series:
      - series: 'unheaded_compliance_source{kind="register",source="well"}'
        values: '1x30 0x40'
      - series: 'unheaded_compliance_source{kind="register",source="yaml-fallback"}'
        values: '0x30 1x40'
      # Evidence never came from The Well: fallback is expected, no alert.
      - series: 'unheaded_compliance_source{kind="evidence",source="well"}'
        values: '0x70'
      - series: 'unheaded_compliance_source{kind="evidence",source="file-fallback"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 40m
        alertname: ComplianceWellFallback
        exp_alerts: []
      - eval_time: 50m
        alertname: ComplianceWellFallback
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, kind: register, source: yaml-fallback}
            exp_annotations:
              summary: "Compliance register served from fallback (yaml-fallback)"
              description: "The Well served compliance register in the last 24h; the dashboard has read it from the repo files for 15m, so changes made in The Well are not shown"
              runbook_url: "runbooks/observe/compliance-well-fallback.yaml"
  # Back on The Well: the alert clears.
  - interval: 1m
    input_series:
      - series: 'unheaded_compliance_source{kind="register",source="well"}'
        values: '1x10 0x20 1x30'
      - series: 'unheaded_compliance_source{kind="register",source="yaml-fallback"}'
        values: '0x10 1x20 0x30'
    alert_rule_test:
      - eval_time: 50m
        alertname: ComplianceWellFallback
        exp_alerts: []

