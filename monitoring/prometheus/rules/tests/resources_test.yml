# promtool test rules resources_test.yml (from this directory)
# ADR-147 decisions 12 and 20 (S-SEE-AND-SURVIVE Phase 7).
rule_files:
  - ../resources.yml
evaluation_interval: 1m
tests:
  # 1. Memory "full" 0.2 s/s on ::1 fires; 0.05 s/s on ::2 does not.
  - interval: 1m
    input_series:
      - series: 'node_pressure_memory_stalled_seconds_total{job="node_exporter",instance="[fd00:dead:beef::1]:9100"}'
        values: '0+12x30'
      - series: 'node_pressure_memory_stalled_seconds_total{job="node_exporter",instance="[fd00:dead:beef::2]:9100"}'
        values: '0+3x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostMemoryPressure
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none, job: node_exporter, instance: "[fd00:dead:beef::1]:9100"}
            exp_annotations:
              summary: "Memory pressure on [fd00:dead:beef::1]:9100: all tasks stalled over 10% of the time"
              description: "PSI memory full over 5m has been above 10% for 10 minutes (west's 5-day peak was 0.5%). Every service on the host slows at once."
              runbook_url: "runbooks/observe/host-pressure.yaml"

  # 2. Swap-in 2,000 pages/s fires; 100 does not.
  - interval: 1m
    input_series:
      - series: 'node_vmstat_pswpin{job="node_exporter",instance="[fd00:dead:beef::1]:9100"}'
        values: '0+120000x40'
      - series: 'node_vmstat_pswpin{job="node_exporter",instance="[fd00:dead:beef::2]:9100"}'
        values: '0+6000x40'
    alert_rule_test:
      - eval_time: 26m
        alertname: HostSwapping
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: node_exporter, instance: "[fd00:dead:beef::1]:9100"}
            exp_annotations:
              summary: "[fd00:dead:beef::1]:9100 swaps in over 1,000 pages a second"
              description: "Swap-in over 10m has been above 1,000 pages/s for 15 minutes (west's 5-day peak was 327)."
              runbook_url: "runbooks/observe/host-pressure.yaml"

  # 3. 87.5% of 4 GiB used fires after 30m; a host without swap does not.
  - interval: 1m
    input_series:
      - series: 'node_memory_SwapTotal_bytes{job="node_exporter",instance="[fd00:dead:beef::1]:9100"}'
        values: '4294967296x40'
      - series: 'node_memory_SwapFree_bytes{job="node_exporter",instance="[fd00:dead:beef::1]:9100"}'
        values: '536870912x40'
      - series: 'node_memory_SwapTotal_bytes{job="node_exporter",instance="[fd00:dead:beef::2]:9100"}'
        values: '0x40'
      - series: 'node_memory_SwapFree_bytes{job="node_exporter",instance="[fd00:dead:beef::2]:9100"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: HostSwapNearFull
        exp_alerts: []
      - eval_time: 35m
        alertname: HostSwapNearFull
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: node_exporter, instance: "[fd00:dead:beef::1]:9100"}
            exp_annotations:
              summary: "Swap on [fd00:dead:beef::1]:9100 is over 80% used"
              description: "Swap has been over 80% used for 30 minutes; past it the next allocation is a memory kill."
              runbook_url: "runbooks/observe/host-pressure.yaml"

  # 4 and 5. I/O "full" 0.4 s/s and CPU "some" 0.6 s/s fire after 30m; I/O
  # 0.1 s/s does not.
  - interval: 1m
    input_series:
      - series: 'node_pressure_io_stalled_seconds_total{job="node_exporter",instance="[fd00:dead:beef::1]:9100"}'
        values: '0+24x60'
      - series: 'node_pressure_io_stalled_seconds_total{job="node_exporter",instance="[fd00:dead:beef::2]:9100"}'
        values: '0+6x60'
      - series: 'node_pressure_cpu_waiting_seconds_total{job="node_exporter",instance="[fd00:dead:beef::1]:9100"}'
        values: '0+36x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: HostIOPressure
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: node_exporter, instance: "[fd00:dead:beef::1]:9100"}
            exp_annotations:
              summary: "I/O pressure on [fd00:dead:beef::1]:9100: all tasks stalled on I/O over 30% of the time"
              description: "PSI io full over 15m has been above 30% for 30 minutes (west's 5-day peak was 13%, p95 4.3%)."
              runbook_url: "runbooks/observe/host-pressure.yaml"
      - eval_time: 50m
        alertname: HostCPUPressure
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: node_exporter, instance: "[fd00:dead:beef::1]:9100"}
            exp_annotations:
              summary: "CPU pressure on [fd00:dead:beef::1]:9100: tasks waited for a CPU over 50% of the time"
              description: "PSI cpu some over 15m has been above 50% for 30 minutes (west's 5-day peak was 2.1%)."
              runbook_url: "runbooks/observe/host-pressure.yaml"

  # 6. 66 C against a 70 C mark fires; 60 C does not; a sensor with no
  # critical mark never does. The alert carries the labels the rule matches
  # on (instance, chip, sensor) and no job: a one-to-one `on (...)` keeps
  # only those.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{job="node_exporter",instance="[fd00:dead:beef::2]:9100",chip="pci0000:00_0000:00:18_3",sensor="temp1"}'
        values: '66x20'
      - series: 'node_hwmon_temp_crit_celsius{job="node_exporter",instance="[fd00:dead:beef::2]:9100",chip="pci0000:00_0000:00:18_3",sensor="temp1"}'
        values: '70x20'
      - series: 'node_hwmon_temp_celsius{job="node_exporter",instance="[fd00:dead:beef::2]:9100",chip="pci0000:00_0000:00:18_3",sensor="temp2"}'
        values: '60x20'
      - series: 'node_hwmon_temp_crit_celsius{job="node_exporter",instance="[fd00:dead:beef::2]:9100",chip="pci0000:00_0000:00:18_3",sensor="temp2"}'
        values: '70x20'
      - series: 'node_hwmon_temp_celsius{job="node_exporter",instance="[fd00:dead:beef::2]:9100",chip="nvme_nvme0",sensor="temp3"}'
        values: '90x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: HostTemperatureNearCritical
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, instance: "[fd00:dead:beef::2]:9100", chip: "pci0000:00_0000:00:18_3", sensor: temp1}
            exp_annotations:
              summary: "pci0000:00_0000:00:18_3 temp1 on [fd00:dead:beef::2]:9100 is within 5 C of its critical mark"
              description: "The sensor has read within 5 C of node_hwmon_temp_crit_celsius for 10 minutes."
              runbook_url: "runbooks/observe/host-temperature.yaml"

  # 6b. SliceTasksNearMax (M-210.4): user-1000.slice at 3,500 of 4,096 fires
  # after 5m; system.slice at 1,000 of 4,096 does not; a capped service (not
  # a slice) at 95 of 100 does not.
  - interval: 1m
    input_series:
      - series: 'huginn_cgroup_pids{job="huginn",host="west",cgroup="user.slice/user-1000.slice"}'
        values: '3500x10'
      - series: 'huginn_cgroup_pids_max{job="huginn",host="west",cgroup="user.slice/user-1000.slice"}'
        values: '4096x10'
      - series: 'huginn_cgroup_pids{job="huginn",host="west",cgroup="system.slice"}'
        values: '1000x10'
      - series: 'huginn_cgroup_pids_max{job="huginn",host="west",cgroup="system.slice"}'
        values: '4096x10'
      - series: 'huginn_cgroup_pids{job="huginn",host="west",cgroup="system.slice/x.service"}'
        values: '95x10'
      - series: 'huginn_cgroup_pids_max{job="huginn",host="west",cgroup="system.slice/x.service"}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: SliceTasksNearMax
        exp_alerts: []
      - eval_time: 6m
        alertname: SliceTasksNearMax
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: huginn, host: west, cgroup: user.slice/user-1000.slice}
            exp_annotations:
              summary: "user.slice/user-1000.slice on west holds over 80% of its task cap"
              description: "huginn_cgroup_pids over huginn_cgroup_pids_max has been above 0.8 for 5 minutes. At the cap every fork in the slice is refused."
              runbook_url: "runbooks/observe/host-pressure.yaml"

  # 7. A failed unit fires after 5m.
  - interval: 1m
    input_series:
      - series: 'unheaded_unit_failed{job="huginn",host="west",unit="unheaded-wiki-server.service"}'
        values: '1x10'
      - series: 'unheaded_unit_failed{job="huginn",host="west",unit="unheaded-kev-poller.service"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: UnitFailed
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none, job: huginn, host: west, unit: unheaded-wiki-server.service}
            exp_annotations:
              summary: "Unit unheaded-wiki-server.service on west has failed"
              description: "systemd gave up on it; nothing restarts it. systemctl status unheaded-wiki-server.service; reset-failed only after the cause is fixed."
              runbook_url: "runbooks/observe/unit-restart.yaml"

  # 8. Three restarts in four minutes fire at once; a count that stays at
  # 15 (restarts long ago, e.g. at boot) does not.
  - interval: 1m
    input_series:
      - series: 'unheaded_unit_restarts{job="huginn",host="west",unit="unheaded-wiki-server.service"}'
        values: '0 0 1 2 3 3 3'
      - series: 'unheaded_unit_restarts{job="huginn",host="west",unit="unheaded-vor.service"}'
        values: '15x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: UnitRestartLoop
        exp_alerts: []
      - eval_time: 4m
        alertname: UnitRestartLoop
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: huginn, host: west, unit: unheaded-wiki-server.service}
            exp_annotations:
              summary: "Unit unheaded-wiki-server.service on west restarted 3 or more times in 30 minutes"
              description: "NRestarts is climbing: it fails and systemd starts it again. journalctl -u unheaded-wiki-server.service -n 50."
              runbook_url: "runbooks/observe/unit-restart.yaml"

  # 9a. host_state.prom last written at time 0: stale from 6m, firing at 11m.
  - interval: 1m
    input_series:
      - series: 'unheaded_host_state_last_run_timestamp_seconds{job="huginn",host="west"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: HostStateStale
        exp_alerts: []
      - eval_time: 12m
        alertname: HostStateStale
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: huginn, host: west}
            exp_annotations:
              summary: "Container and unit state on west is stale or Docker does not answer"
              description: "host_state.prom is over 5 minutes old, or the last run could not reach Docker. Until it is fresh, ContainerStopped and UnitFailed cannot fire."
              runbook_url: "runbooks/observe/monitoring-path.yaml"

  # 9b. Docker does not answer: firing after 5m.
  - interval: 1m
    input_series:
      - series: 'unheaded_host_state_docker_ok{job="huginn",host="west"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostStateStale
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, job: huginn, host: west}
            exp_annotations:
              summary: "Container and unit state on west is stale or Docker does not answer"
              description: "host_state.prom is over 5 minutes old, or the last run could not reach Docker. Until it is fresh, ContainerStopped and UnitFailed cannot fire."
              runbook_url: "runbooks/observe/monitoring-path.yaml"
