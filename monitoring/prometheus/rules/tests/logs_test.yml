# promtool test rules logs_test.yml (from this directory)
rule_files:
  - ../logs.yml
evaluation_interval: 1m
tests:
  # Shipping 10 entries a minute for 60m, then the sink stops sending.
  # increase() over 30m reaches 0 at 90m; with for: 15m it fires at 105m.
  - interval: 1m
    input_series:
      - series: 'vector_component_sent_events_total{instance="host.docker.internal:9598",job="vector",component_id="clickhouse",component_kind="sink"}'
        values: '0+10x60 600x60'
      - series: 'up{instance="host.docker.internal:9598",job="vector"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: JournalNotShipping
        exp_alerts: []
      - eval_time: 100m
        alertname: JournalNotShipping
        exp_alerts: []
      - eval_time: 106m
        alertname: JournalNotShipping
        exp_alerts:
          - exp_labels: {severity: critical, instance: "host.docker.internal:9598"}
            exp_annotations:
              summary: "host.docker.internal:9598 has shipped no journal entries to ClickHouse for 45m"
              description: "Audit records are not leaving the host; docker logs unheaded-vector, and check clickhouse is up"
      - eval_time: 106m
        alertname: VectorDown
        exp_alerts: []

  # Sink errors every minute from 10m: warning after 15m of that.
  # Scrapes stop at 61m: VectorDown after 10m.
  - interval: 1m
    input_series:
      - series: 'vector_component_errors_total{instance="west",job="vector",component_id="clickhouse",component_kind="sink"}'
        values: '0x10 1+1x50'
      - series: 'up{instance="west",job="vector"}'
        values: '1x60 0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: JournalShipErrors
        exp_alerts: []
      - eval_time: 30m
        alertname: JournalShipErrors
        exp_alerts:
          - exp_labels: {severity: warning, instance: west}
            exp_annotations:
              summary: "Vector on west keeps failing to write to ClickHouse"
              description: "15 sink errors in 15m; Vector retries, so rows may be late rather than lost"
      - eval_time: 69m
        alertname: VectorDown
        exp_alerts: []
      - eval_time: 72m
        alertname: VectorDown
        exp_alerts:
          - exp_labels: {severity: warning, instance: west, job: vector}
            exp_annotations:
              summary: "Vector on west is not answering /metrics"
              description: "The journal is not shipping while it is down; docker compose ps vector"
