# promtool test rules well_test.yml (from this directory)
rule_files:
  - ../well.yml
evaluation_interval: 1m
tests:
  # A backup at t=0 and never again: late after 26h (+45m), missing after 50h.
  - interval: 1m
    input_series:
      - series: 'unheaded_well_backup_last_success_timestamp_seconds{host="west"}'
        values: '0x3100'
      - series: 'unheaded_well_offsite_last_success_timestamp_seconds{host="west"}'
        values: '0x3100'
      - series: 'unheaded_well_drill_last_success_timestamp_seconds{host="west"}'
        values: '0x13000'
      - series: 'huginn_textfile_rejected_lines{host="west",file="well_backup.prom"}'
        values: '0x19 2x60'
    alert_rule_test:
      - eval_time: 25h
        alertname: WellBackupLate
        exp_alerts: []
      - eval_time: 27h
        alertname: WellBackupLate
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west}
            exp_annotations:
              summary: "No backup of The Well on west for over a day"
              description: "Last good set 1d 3h 0m 0s ago; see journalctl -u unheaded-well-backup"
              runbook_url: "runbooks/data/postgresql-backup-restore.yaml"
      - eval_time: 27h
        alertname: WellBackupMissing
        exp_alerts: []
      - eval_time: 51h
        alertname: WellBackupMissing
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none, host: west}
            exp_annotations:
              summary: "No backup of The Well on west for two nights"
              description: "Last good set 2d 3h 0m 0s ago; a restore now would lose more than two days"
              runbook_url: "runbooks/data/postgresql-backup-restore.yaml"
      - eval_time: 27h
        alertname: WellOffsiteLate
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west}
            exp_annotations:
              summary: "No backup set of The Well copied to east for over a day"
              description: "Last copy 1d 3h 0m 0s ago; see journalctl -u unheaded-well-offsite"
              runbook_url: "runbooks/data/postgresql-backup-restore.yaml"
      - eval_time: 7d
        alertname: WellDrillLate
        exp_alerts: []
      - eval_time: 9d
        alertname: WellDrillLate
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west}
            exp_annotations:
              summary: "No passing restore drill of The Well for over a week"
              description: "Last pass 9d 0h 0m 0s ago; an untested backup is a hope, see journalctl -u unheaded-well-drill"
              runbook_url: "runbooks/data/postgresql-backup-restore.yaml"
      - eval_time: 40m
        alertname: HuginnTextfileRejected
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west, file: well_backup.prom}
            exp_annotations:
              summary: "well_backup.prom on west has malformed lines"
              description: "huginn dropped 2 line(s); whatever wrote the file is broken"
              runbook_url: "runbooks/data/postgresql-backup-restore.yaml"
      - eval_time: 30m
        alertname: WellBackupMetricsMissing
        exp_alerts: []
  # West off for two days, then boots: the stale timestamp is back for 20m
  # until the Persistent= catch-up backup and copy land. No alert.
  - interval: 1m
    input_series:
      - series: 'unheaded_well_backup_last_success_timestamp_seconds{host="west"}'
        values: '_x3000 0x20 181200x60'
      - series: 'unheaded_well_offsite_last_success_timestamp_seconds{host="west"}'
        values: '_x3000 0x20 181200x60'
    alert_rule_test:
      - eval_time: 50h15m
        alertname: WellBackupLate
        exp_alerts: []
      - eval_time: 50h15m
        alertname: WellBackupMissing
        exp_alerts: []
      - eval_time: 50h15m
        alertname: WellOffsiteLate
        exp_alerts: []
  # Nothing at all: the metrics-missing alert.
  - interval: 1m
    input_series:
      - series: 'up{job="x"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: WellBackupMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none}
            exp_annotations:
              summary: "No backup metrics for The Well"
              description: "huginn has no textfile_dir, cannot read /var/lib/unheaded/textfile, or no backup has ever succeeded"
              runbook_url: "runbooks/data/postgresql-backup-restore.yaml"
