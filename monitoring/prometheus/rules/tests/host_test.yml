# promtool test rules host_test.yml (from this directory)
rule_files:
  - ../host.yml
evaluation_interval: 1m
tests:
  # East stops answering at 5m; west never does. 2m of failed scrapes fire.
  - interval: 1m
    input_series:
      - series: 'up{job="node_exporter",instance="[fd00:dead:beef::1]:9100"}'
        values: '1x20'
      - series: 'up{job="node_exporter",instance="[fd00:dead:beef::2]:9100"}'
        values: '1x4 0x16'
    alert_rule_test:
      - eval_time: 6m
        alertname: NodeExporterDown
        exp_alerts: []
      - eval_time: 8m
        alertname: NodeExporterDown
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none, job: node_exporter, instance: "[fd00:dead:beef::2]:9100"}
            exp_annotations:
              summary: "Node exporter down on [fd00:dead:beef::2]:9100"
              description: "Cannot scrape node_exporter from [fd00:dead:beef::2]:9100: the host is down, or for east the WireGuard overlay is"
              runbook_url: "runbooks/network/network-diagnostics.yaml"

  # Disk thresholds and the 24h projection; a half-full disk stays quiet.
  - interval: 1m
    input_series:
      - series: 'host_disk_total_bytes{host="west",mount="/",device="/dev/sda1"}'
        values: '100x200'
      - series: 'host_disk_avail_bytes{host="west",mount="/",device="/dev/sda1"}'
        values: '5x200'
      - series: 'host_disk_total_bytes{host="west",mount="/var",device="/dev/sdb"}'
        values: '100x200'
      - series: 'host_disk_avail_bytes{host="west",mount="/var",device="/dev/sdb"}'
        values: '20-0.05x200'
      - series: 'host_disk_total_bytes{host="east",mount="/",device="/dev/sdc"}'
        values: '100x200'
      - series: 'host_disk_avail_bytes{host="east",mount="/",device="/dev/sdc"}'
        values: '50x200'
    alert_rule_test:
      - eval_time: 15m
        alertname: HostDiskAlmostFull
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west, mount: "/", device: "/dev/sda1"}
            exp_annotations:
              summary: "/ on west under 10% free"
              description: "/ (/dev/sda1) has 5% left"
              runbook_url: "runbooks/infra/storage-health.yaml"
      # 5% is not under 3%.
      - eval_time: 15m
        alertname: HostDiskFull
        exp_alerts: []
      - eval_time: 120m
        alertname: HostDiskFillsWithin24h
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west, mount: "/var", device: "/dev/sdb"}
            exp_annotations:
              summary: "/var on west fills within 24h at this rate"
              description: "/var (/dev/sdb) is under 25% free and its 6h trend reaches zero within a day"
              runbook_url: "runbooks/infra/storage-health.yaml"

  # A logger in a loop: the projection fires while 8.5% is still free.
  - interval: 1m
    input_series:
      - series: 'huginn_log_fs_size_bytes{host="west",path="/var/log"}'
        values: '10000x60'
      - series: 'huginn_log_fs_avail_bytes{host="west",path="/var/log"}'
        values: '1000-5x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: LogFilesystemFillsWithin6h
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none, host: west, path: "/var/log"}
            exp_annotations:
              summary: "Filesystem holding /var/log on west fills within 6h"
              description: "At the last hour's rate the filesystem is full within 6h; a runaway logger is the usual cause (ADR-092 section 6)"
              runbook_url: "runbooks/observe/log-rotation.yaml"
      - eval_time: 30m
        alertname: LogFilesystemLow
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west, path: "/var/log"}
            exp_annotations:
              summary: "Filesystem holding /var/log on west under 15% free"
              description: "8.5% left; check huginn_log_dir_bytes for the service filling it"
              runbook_url: "runbooks/observe/log-rotation.yaml"

  # Per-service volume: one over budget, one growing at 2 MiB/s, one quiet.
  - interval: 1m
    input_series:
      - series: 'huginn_log_dir_bytes{host="west",dir="wotan"}'
        values: '2147483648x60'
      - series: 'huginn_log_dir_bytes{host="west",dir="doom"}'
        values: '0+125829120x60'
      - series: 'huginn_log_dir_bytes{host="west",dir="zhen"}'
        values: '104857600x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: LogDirOverBudget
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west, dir: wotan}
            exp_annotations:
              summary: "/var/log/unheaded/wotan on west over 1 GB"
              description: "2GiB, above ADR-092's per-service rotation budget; treat as a defect in the service, not a capacity problem"
              runbook_url: "runbooks/observe/log-rotation.yaml"
          # doom has grown past 1 GB by now too.
          - exp_labels: {severity: warning, urgency: none, host: west, dir: doom}
            exp_annotations:
              summary: "/var/log/unheaded/doom on west over 1 GB"
              description: "4.688GiB, above ADR-092's per-service rotation budget; treat as a defect in the service, not a capacity problem"
              runbook_url: "runbooks/observe/log-rotation.yaml"
      - eval_time: 40m
        alertname: LogDirRunaway
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west, dir: doom}
            exp_annotations:
              summary: "/var/log/unheaded/doom on west growing over 1 MiB/s"
              description: "Growing 2MiB/s for 15m; rate-limit the log line at its source (ADR-092 section 6)"
              runbook_url: "runbooks/observe/log-rotation.yaml"

  # Unreadable after being readable fires; never readable stays quiet.
  - interval: 1m
    input_series:
      - series: 'huginn_log_root_ok{host="west"}'
        values: '1x30 0x40'
      - series: 'huginn_log_root_ok{host="east"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: LogRootUnreadable
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west}
            exp_annotations:
              summary: "huginn can no longer read /var/log/unheaded on west"
              description: "Log directory sizes are unknown; the directory was removed or its permissions changed"
              runbook_url: "runbooks/observe/log-rotation.yaml"

  # AIDE (S-EVIDENCE-RUNS DE1). The check runs once a week and leaves its
  # numbers in a textfile, so each series is flat between runs. A new diff
  # is reported for the day after the run that first saw it, then the alert
  # is quiet: the diff is still one findings row (aide-unreviewed), not a
  # line in every digest.
  - interval: 1m
    input_series:
      # West: the run at t=0 saw a diff nobody had seen.
      - series: 'unheaded_aide_new_diff{host="west"}'
        values: '1x2000'
      - series: 'unheaded_aide_last_run_timestamp_seconds{host="west"}'
        values: '0x2000'
      # East: an old diff is still pending; this run saw nothing new.
      - series: 'unheaded_aide_new_diff{host="east"}'
        values: '0x2000'
      - series: 'unheaded_aide_changed_entries{host="east"}'
        values: '7x2000'
      - series: 'unheaded_aide_last_run_timestamp_seconds{host="east"}'
        values: '0x2000'
    alert_rule_test:
      - eval_time: 10m
        alertname: AIDEChangeDetected
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west}
            exp_annotations:
              summary: "AIDE found a change on west it had not seen before"
              description: "The weekly check found files that differ from the database. It is reported once; the diff stays pending until a person reads it: sudo unheaded-aide review"
              runbook_url: "runbooks/security/aide-change-review.yaml"
      - eval_time: 23h
        alertname: AIDEChangeDetected
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west}
            exp_annotations:
              summary: "AIDE found a change on west it had not seen before"
              description: "The weekly check found files that differ from the database. It is reported once; the diff stays pending until a person reads it: sudo unheaded-aide review"
              runbook_url: "runbooks/security/aide-change-review.yaml"
      # A day after the run: reported once, not every day until the next run.
      - eval_time: 25h
        alertname: AIDEChangeDetected
        exp_alerts: []
      - eval_time: 10m
        alertname: AIDECheckStale
        exp_alerts: []

  # No check for over eight days (the timer is weekly, with up to six hours
  # of delay). A host with no AIDE series at all stays quiet: it has no
  # database yet.
  - interval: 1m
    input_series:
      - series: 'unheaded_aide_last_run_timestamp_seconds{host="west"}'
        values: '0x11700'
      - series: 'unheaded_aide_new_diff{host="west"}'
        values: '0x11700'
    alert_rule_test:
      - eval_time: 191h
        alertname: AIDECheckStale
        exp_alerts: []
      - eval_time: 194h
        alertname: AIDECheckStale
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, host: west}
            exp_annotations:
              summary: "No AIDE check on west for over 8 days"
              description: "The last completed check is 8d 2h 0m 0s old; unheaded-aide-check.timer did not run it, or every run since has failed"
              runbook_url: "runbooks/security/aide-check-stale.yaml"
      - eval_time: 194h
        alertname: AIDEChangeDetected
        exp_alerts: []
