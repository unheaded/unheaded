# promtool test rules threat-feeds_test.yml (from this directory)
rule_files:
  - ../threat-feeds.yml
evaluation_interval: 1m
tests:
  # A good pull at t=0 and none after: stale past 6h (+15m), expired past 7d.
  - interval: 1m
    input_series:
      - series: 'unheaded_kev_last_success_timestamp_seconds{instance="west:19120",job="kev-poller"}'
        values: '0x11000'
    alert_rule_test:
      - eval_time: 6h
        alertname: KEVFeedStale
        exp_alerts: []
      - eval_time: 6h20m
        alertname: KEVFeedStale
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, instance: "west:19120", job: kev-poller}
            exp_annotations:
              summary: "CISA KEV catalog on west:19120 not refreshed for 6h"
              description: "Last good pull 6h 20m 0s ago; GET /api/v1/kev on the poller shows the last error"
      - eval_time: 7d
        alertname: KEVFeedExpired
        exp_alerts: []
      - eval_time: 7d20m
        alertname: KEVFeedExpired
        exp_alerts:
          - exp_labels: {severity: critical, urgency: none, instance: "west:19120", job: kev-poller}
            exp_annotations:
              summary: "CISA KEV catalog on west:19120 older than 7 days (ADR-052)"
              description: "Last good pull 7d 0h 20m 0s ago; the threat register is past its freshness limit"

  # Pulling fine (timestamp keeps up): never stale. Scrapes stop at 61m:
  # KEVPollerDown after 15m of that.
  - interval: 1m
    input_series:
      - series: 'unheaded_kev_last_success_timestamp_seconds{instance="east:19120",job="kev-poller"}'
        values: '0+60x120'
      - series: 'up{instance="east:19120",job="kev-poller"}'
        values: '1x60 0x60'
    alert_rule_test:
      - eval_time: 119m
        alertname: KEVFeedStale
        exp_alerts: []
      - eval_time: 70m
        alertname: KEVPollerDown
        exp_alerts: []
      - eval_time: 80m
        alertname: KEVPollerDown
        exp_alerts:
          - exp_labels: {severity: warning, urgency: none, instance: "east:19120", job: kev-poller}
            exp_annotations:
              summary: "kev-poller on east:19120 is not answering /metrics"
              description: "ADR-055 requires it always on; systemctl status unheaded-kev-poller"
