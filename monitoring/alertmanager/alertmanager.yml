# Alertmanager: the stock configuration. Its only receiver is null, so
# alerts reach nobody (FND-001). Email delivery is rendered from
# /etc/unheaded/alertmanager.env by scripts/monitoring/render-alertmanager.sh
# into rendered/alertmanager.yml, selected with ALERTMANAGER_CONFIG_FILE in
# monitoring/.env.
#
# Unheaded Kingdom infrastructure
# License: MIT, Copyright (c) 2024-2026 Stevie Bellis

global:
  resolve_timeout: 5m

route:
  receiver: 'null'
  group_by: ['alertname', 'host']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'null'

inhibit_rules: []
