global:
  resolve_timeout: 5m

route:
  receiver: 'null'
  group_by: ['alertname', 'host']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'null'

inhibit_rules: []

