# GENERATED by go run ./cmd/alert-policy from observability/alerting/policy.yaml. Do not edit.
# No secrets here: Alertmanager hands page and ticket alerts to alert-mailer,
# which owns the SMTP login, the daily cap, the digest and dry-run.
global:
  resolve_timeout: 5m
route:
  receiver: none
  group_by:
    - urgency
  group_wait: 1m
  group_interval: 5m
  repeat_interval: 24h
  routes:
    - receiver: page
      group_wait: 2m
      group_interval: 5m
      repeat_interval: 12h
      matchers:
        - alertname="HeartbeatMissing"
        - urgency="none"
    - receiver: ticket
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 24h
      matchers:
        - alertname="TraceCollectorDown"
        - urgency="none"
    - receiver: page
      group_wait: 2m
      group_interval: 5m
      repeat_interval: 12h
      matchers:
        - urgency="page"
    - receiver: ticket
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 24h
      matchers:
        - urgency="ticket"
inhibit_rules:
  - source_matchers:
      - urgency="page"
    target_matchers:
      - urgency="ticket"
    equal:
      - slo
receivers:
  - name: none
  - name: page
    webhook_configs:
      - url: http://alert-mailer:19130/v1/alerts/page
        send_resolved: true
        max_alerts: 50
  - name: ticket
    webhook_configs:
      - url: http://alert-mailer:19130/v1/alerts/ticket
        send_resolved: true
        max_alerts: 50
