apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090   # the compose service; localhost is Grafana itself
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://[fd00:dead:beef::1]:8428
    editable: true
