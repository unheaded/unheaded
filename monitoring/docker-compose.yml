# Unheaded Kingdom — Monitoring Stack
# Deploy on host-a alongside existing services
# Usage: docker compose -f monitoring/docker-compose.yml up -d
#
# License: MIT, Copyright (c) 2024-2026 Stevie Bellis

version: "3.9"

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        # 172.20.0.0/16 overlapped kind and netbox-docker on west (2026-10-20);
        # the main stack holds 172.28.0-2.0/24.
        - subnet: 172.28.3.0/24

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  victoriametrics_data:
  alertmanager_data:

services:
  # One-shot: hands each named volume to its service's uid (pkg/uids). A
  # fresh volume inherits the image's owner (nobody, 472, 10001), and a volume
  # from before 2026-10-20 is owned by those; chown only when it differs.
  volume-init:
    image: alpine:3.24
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    volumes:
      - prometheus_data:/volumes/prometheus
      - grafana_data:/volumes/grafana
      - loki_data:/volumes/loki
      - victoriametrics_data:/volumes/victoriametrics
      - alertmanager_data:/volumes/alertmanager
    command:
      - sh
      - -ec
      - |
        own() { [ "$$(stat -c %u:%g "$$2")" = "$$1" ] || chown -R "$$1" "$$2"; }
        own 16700:16700 /volumes/prometheus
        own 16701:16701 /volumes/grafana
        own 16702:16702 /volumes/loki
        own 16703:16703 /volumes/victoriametrics
        own 16709:16709 /volumes/alertmanager

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: unheaded-prometheus
    restart: unless-stopped
    user: "16700:16700"
    read_only: true
    cap_drop: [ALL]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      # No --web.enable-admin-api / --web.enable-lifecycle: 9090 is published
      # and those APIs have no auth (delete series, snapshots, /-/quit). Reload
      # rules with `docker kill -s HUP unheaded-prometheus`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:10.4.0
    container_name: unheaded-grafana
    restart: unless-stopped
    user: "16701:16701"
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /var/log/grafana:uid=16701,gid=16701,size=16M
    cap_drop: [ALL]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env - credentials are not stored in this repo}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.0.0
    container_name: unheaded-loki
    restart: unless-stopped
    user: "16702:16702"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    cap_drop: [ALL]
    ports:
      - "3100:3100"
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/var/lib/loki
    command: -config.file=/etc/loki/loki.yaml
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.108.1
    container_name: unheaded-victoriametrics
    restart: unless-stopped
    user: "16703:16703"
    read_only: true
    cap_drop: [ALL]
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/storage
    command:
      - '--storageDataPath=/storage'
      - '--retentionPeriod=12'
      - '--dedup.minScrapeInterval=15s'
      - '--httpListenAddr=:8428'
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: unheaded-alertmanager
    restart: unless-stopped
    user: "16709:16709"
    read_only: true
    cap_drop: [ALL]
    ports:
      # Loopback only: Prometheus reaches it over the compose network, and
      # its API takes silences from anyone (no auth), which would mute every
      # alert. The UI: ssh -L 9093:127.0.0.1:9093 west.
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
      # FND-001: the SMTP password file (scripts/monitoring/render-alertmanager.sh).
      # Default is an empty directory: the stock config sends nothing.
      - ${ALERTMANAGER_SECRETS_DIR:-./alertmanager/no-secrets}:/etc/alertmanager-secrets:ro
    command:
      # rendered/alertmanager.yml once render-alertmanager.sh has run
      - '--config.file=/etc/alertmanager/${ALERTMANAGER_CONFIG_FILE:-alertmanager.yml}'
      - '--storage.path=/alertmanager'
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: unheaded-node-exporter
    restart: unless-stopped
    user: "16705:16705"
    read_only: true
    cap_drop: [ALL]
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    security_opt:
      - no-new-privileges:true
