# Unheaded Kingdom: the alert path (rule evaluator, Alertmanager, alert-mailer).
# Usage: docker compose -f monitoring/docker-compose.yml up -d
#
# ADR-117 (2026-11-11): the second Grafana, Loki and the second VictoriaMetrics
# that lived here are retired. Dashboards and the metrics store are the main
# stack's (docker-compose.yml: grafana, victoria); logs are ClickHouse's.
# Prometheus stays only to evaluate monitoring/prometheus/rules and hand
# alerts to Alertmanager, until a native evaluator replaces it (ADR-116).
# Cut-over on a host that still runs the old three:
# docs/runbooks/one-grafana-cutover.md.
#
# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (c) 2024-2026 Stevie Bellis.

version: "3.9"

networks:
  monitoring:
    driver: bridge
    # IPv6 on: every host target and the remote_write are overlay addresses
    # (fd00:dead:beef::/48 on wg0); an IPv4-only network cannot reach them.
    enable_ipv6: true
    ipam:
      config:
        # 172.20.0.0/16 overlapped kind and netbox-docker on west (2026-10-20);
        # the main stack holds 172.28.0-2.0/24.
        - subnet: 172.28.3.0/24
        # Outside the overlay's /48 and next to the daemon's fixed-cidr-v6
        # (fd00:d0c0:e700::/48), so it can never shadow an overlay route.
        - subnet: fd00:d0c0:e703::/64

volumes:
  prometheus_data:
  alertmanager_data:
  alert_mailer_data:

services:
  # One-shot: hands each named volume to its service's uid (pkg/uids). A
  # fresh volume inherits the image's owner (nobody), and a volume
  # from before 2026-10-20 is owned by those; chown only when it differs.
  volume-init:
    image: alpine:3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    volumes:
      - prometheus_data:/volumes/prometheus
      - alertmanager_data:/volumes/alertmanager
      - alert_mailer_data:/volumes/alert-mailer
    command:
      - sh
      - -ec
      - |
        own() { [ "$$(stat -c %u:%g "$$2")" = "$$1" ] || chown -R "$$1" "$$2"; }
        own 16700:16700 /volumes/prometheus
        own 16709:16709 /volumes/alertmanager
        own 16710:16710 /volumes/alert-mailer

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: unheaded-prometheus
    restart: unless-stopped
    user: "16700:16700"
    read_only: true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:9090:9090"   # loopback only: the Prometheus API has no auth (S24, 2026-10-27)
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
      # The dev CA, for the https scrape targets (west's TLS services). Not
      # under /etc/prometheus: that mount is read-only.
      - ../configs/certs/dev/ca.pem:/etc/prometheus-tls/ca.pem:ro
      - /run/unheaded/modules:/etc/unheaded-modules:ro   # modules' rules and scrape jobs while their switch is on (ADR-149)
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 30d: the SLOs' error budgets are over 28 days (observability/alerting/policy.yaml).
      # Of only the series the rules read (prometheus.yml's rule-series keep,
      # scripts/gen-prom-keep-list.py); everything else is VictoriaMetrics'
      # alone (ADR-147 decisions 9, 10).
      - '--storage.tsdb.retention.time=30d'
      # No --web.enable-admin-api / --web.enable-lifecycle: 9090 is published
      # and those APIs have no auth (delete series, snapshots, /-/quit). Reload
      # rules with `docker kill -s HUP unheaded-prometheus`; module files are
      # picked up within 30 s on their own (ADR-149: the config and every file
      # it names, globs included, are re-read when their checksum changes).
      - '--config.auto-reload'
      - '--config.auto-reload-interval=30s'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    container_name: unheaded-alertmanager
    restart: unless-stopped
    user: "16709:16709"
    read_only: true
    cap_drop: [ALL]
    ports:
      # Loopback only: Prometheus reaches it over the compose network, and
      # its API takes silences from anyone (no auth), which would mute every
      # alert. The UI: ssh -L 9093:127.0.0.1:9093 west.
      - "127.0.0.1:9093:9093"
    volumes:
      # Generated by go run ./cmd/alert-policy (observability/alerting/policy.yaml).
      # No secrets: it routes page and ticket alerts to alert-mailer, the rest nowhere.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      alert-mailer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # The only thing that sends alert mail (ADR-100): pages at once, tickets in
  # one daily digest, never more than mailer.max_per_day a day, and nothing at
  # all while mailer.mode is dry-run (observability/alerting/policy.yaml).
  # Relay settings in monitoring/.env (none secret); the password file in
  # ALERT_MAILER_SECRETS_DIR (smtp-password, 0400, uid 16710). What it sent
  # or would have: curl -s 127.0.0.1:19130/v1/outbox
  #
  # Dead-man's switch (ADR-100, heartbeat.go): off unless HEARTBEAT_HOSTS
  # (monitoring/.env, e.g. "east") names hosts; then the token file
  # heartbeat-token (0400, uid 16710) must sit beside smtp-password and the
  # heartbeat listener (19131, heartbeat only: no webhook, no outbox) answers.
  # It stays on loopback until HEARTBEAT_LISTEN=192.168.13.2 publishes it on
  # the P2P link; set that only while the link is configured at boot, since
  # docker will not start a container whose published address is missing.
  #
  # alerts.critical on Wotan (ADR-147 Phase 8): off unless
  # ALERT_MAILER_WOTAN_ADDR is set; the keys it needs sit in the same
  # directory (see environment below).
  alert-mailer:
    build:
      context: ..
      dockerfile: docker/alert-mailer/Dockerfile
    image: unheaded/alert-mailer:dev
    container_name: unheaded-alert-mailer
    restart: unless-stopped
    user: "16710:16710"
    read_only: true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:19130:19130"
      - "${HEARTBEAT_LISTEN:-127.0.0.1}:19131:19131"
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD_FILE: /run/secrets/alert-mailer/smtp-password
      ALERT_MAIL_FROM: ${ALERT_MAIL_FROM:-}
      ALERT_MAIL_TO: ${ALERT_MAIL_TO:-}
      HEARTBEAT_HOSTS: ${HEARTBEAT_HOSTS:-}
      HEARTBEAT_TOKEN_FILE: /run/secrets/alert-mailer/heartbeat-token
      # alerts.critical on Wotan (ADR-147 Phase 8): off until
      # monitoring/.env sets ALERT_MAILER_WOTAN_ADDR, the host address Wotan's
      # HTTP port is published on for this network (the overlay bind on
      # wotan in docker-compose.yml), e.g. https://[fd00:dead:beef::1]:18000;
      # gRPC is the same host on 18001 unless ALERT_MAILER_WOTAN_GRPC_ADDR
      # says otherwise. The steps: wiki/Wotan-Topic-Signing.md.
      WOTAN_ADDR: ${ALERT_MAILER_WOTAN_ADDR:-}
      WOTAN_GRPC_ADDR: ${ALERT_MAILER_WOTAN_GRPC_ADDR:-}
      # The two keys sit beside smtp-password in ALERT_MAILER_SECRETS_DIR,
      # each 0400 and owned by uid 16710: alert-mailer.key is the Ed25519
      # service key of identity alert-mailer (unheaded-keygen; its .pub goes
      # in Wotan's trust directory), alerts-critical.key the ML-DSA-65 seed
      # (unheaded-keygen -algo mldsa65; its public half is enrolled under
      # alerts.critical. in Wotan's topic config). Without the first Wotan
      # answers 401; without the second alerts.critical is refused, never
      # sent unsigned. Neither is read while ALERT_MAILER_WOTAN_ADDR is unset.
      AUTH_KEY_FILE: /run/secrets/alert-mailer/alert-mailer.key
      ALERTS_SIGNING_KEY_FILE: /run/secrets/alert-mailer/alerts-critical.key
      # TLS for the Wotan client only (this container's own listeners are
      # plain HTTP whatever this says: it has no certificate). Wotan's ports
      # are TLS 1.3 and a plaintext client withholds its token off loopback,
      # so it is on unless ALERT_MAILER_WOTAN_TLS says otherwise. The CA is
      # the read-only file mount below (ALERT_MAILER_WOTAN_CA_FILE, default
      # the dev CA Prometheus also mounts). Wotan's certificate does not
      # name the host address dialled, so it is verified against
      # ALERT_MAILER_WOTAN_TLS_SERVER_NAME, a name it does carry (default
      # wotan, the compose service name every Wotan certificate has).
      UNHEADED_TLS_ENABLED: ${ALERT_MAILER_WOTAN_TLS:-true}
      UNHEADED_TLS_CA_CERT: /run/host/tls/wotan-ca.pem
      WOTAN_TLS_SERVER_NAME: ${ALERT_MAILER_WOTAN_TLS_SERVER_NAME:-wotan}
      # A boot of the host in the digest (cmd/alert-mailer/boot.go, decision
      # pack 2026-11-18 row 22): the record unheaded-boot-event.service keeps
      # and host_state.prom, both read through the two read-only mounts
      # below. Off until monitoring/.env names the host's directories:
      #   ALERT_MAILER_BOOT_DIR=/var/lib/unheaded/boot-event
      #   ALERT_MAILER_TEXTFILE_DIR=/var/lib/unheaded/textfile
      # Unset, both mounts are an empty directory of this repository and the
      # digest carries no boot line.
      BOOT_EVENTS_FILE: /run/host/boot-event/boots.jsonl
      HOST_STATE_FILE: /run/host/textfile/host_state.prom
      GOMEMLIMIT: "54MiB"
    volumes:
      - ../observability/alerting/policy.yaml:/etc/alert-mailer/policy.yaml:ro
      - alert_mailer_data:/var/lib/alert-mailer
      - ${ALERT_MAILER_SECRETS_DIR:-./alert-mailer/no-secrets}:/run/secrets/alert-mailer:ro
      - ${ALERT_MAILER_BOOT_DIR:-./alert-mailer/no-host-files}:/run/host/boot-event:ro
      - ${ALERT_MAILER_TEXTFILE_DIR:-./alert-mailer/no-host-files}:/run/host/textfile:ro
      # The CA that signed Wotan's certificate (public; UNHEADED_TLS_CA_CERT
      # above). One file, so a replaced CA is seen after the container is
      # recreated.
      - ${ALERT_MAILER_WOTAN_CA_FILE:-../configs/certs/dev/ca.pem}:/run/host/tls/wotan-ca.pem:ro
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:19130/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    security_opt:
      - no-new-privileges:true

  # No node-exporter container: each host runs deploy/systemd/node-exporter.service
  # on :9100 (so a container could not bind it), and the node_exporter job in
  # prometheus/prometheus.yml scrapes those units over the overlay.
