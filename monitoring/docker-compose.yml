# Unheaded Kingdom — Monitoring Stack
# Deploy on host-a alongside existing services
# Usage: docker compose -f monitoring/docker-compose.yml up -d
#
# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (c) 2024-2026 Stevie Bellis.

version: "3.9"

networks:
  monitoring:
    driver: bridge
    # IPv6 on: every host target and the remote_write are overlay addresses
    # (fd00:dead:beef::/48 on wg0); an IPv4-only network cannot reach them.
    enable_ipv6: true
    ipam:
      config:
        # 172.20.0.0/16 overlapped kind and netbox-docker on west (2026-10-20);
        # the main stack holds 172.28.0-2.0/24.
        - subnet: 172.28.3.0/24
        # Outside the overlay's /48 and next to the daemon's fixed-cidr-v6
        # (fd00:d0c0:e700::/48), so it can never shadow an overlay route.
        - subnet: fd00:d0c0:e703::/64

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  victoriametrics_data:
  alertmanager_data:
  alert_mailer_data:

services:
  # One-shot: hands each named volume to its service's uid (pkg/uids). A
  # fresh volume inherits the image's owner (nobody, 472, 10001), and a volume
  # from before 2026-10-20 is owned by those; chown only when it differs.
  volume-init:
    image: alpine:3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    volumes:
      - prometheus_data:/volumes/prometheus
      - grafana_data:/volumes/grafana
      - loki_data:/volumes/loki
      - victoriametrics_data:/volumes/victoriametrics
      - alertmanager_data:/volumes/alertmanager
      - alert_mailer_data:/volumes/alert-mailer
    command:
      - sh
      - -ec
      - |
        own() { [ "$$(stat -c %u:%g "$$2")" = "$$1" ] || chown -R "$$1" "$$2"; }
        own 16700:16700 /volumes/prometheus
        own 16701:16701 /volumes/grafana
        own 16702:16702 /volumes/loki
        own 16703:16703 /volumes/victoriametrics
        own 16709:16709 /volumes/alertmanager
        own 16710:16710 /volumes/alert-mailer

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: unheaded-prometheus
    restart: unless-stopped
    user: "16700:16700"
    read_only: true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:9090:9090"   # loopback only: the Prometheus API has no auth (S24, 2026-10-27)
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
      # The dev CA, for the https scrape targets (west's TLS services). Not
      # under /etc/prometheus: that mount is read-only.
      - ../configs/certs/dev/ca.pem:/etc/prometheus-tls/ca.pem:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 30d: the SLOs' error budgets are over 28 days (observability/alerting/policy.yaml).
      - '--storage.tsdb.retention.time=30d'
      # No --web.enable-admin-api / --web.enable-lifecycle: 9090 is published
      # and those APIs have no auth (delete series, snapshots, /-/quit). Reload
      # rules with `docker kill -s HUP unheaded-prometheus`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:10.4.0@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
    # Not unheaded-grafana: docker-compose.yml's Grafana has that name, and
    # the two stacks run on the same host.
    container_name: unheaded-monitoring-grafana
    restart: unless-stopped
    user: "16701:16701"
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /var/log/grafana:uid=16701,gid=16701,size=16M
    cap_drop: [ALL]
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env - credentials are not stored in this repo}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.0.1@sha256:ac6eb6be00ce34eb6584de508766974da66241cd073c51187f33251f97b4edd5
    container_name: unheaded-loki
    restart: unless-stopped
    user: "16702:16702"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:3100:3100"   # loopback only: no auth, and the push API would take injected logs
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/var/lib/loki
    command: -config.file=/etc/loki/loki.yaml
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    container_name: unheaded-victoriametrics
    restart: unless-stopped
    user: "16703:16703"
    read_only: true
    cap_drop: [ALL]
    # No host port: docker-compose.yml's VictoriaMetrics owns 8428 on the
    # host, and Prometheus here remote-writes to that one.
    volumes:
      - victoriametrics_data:/storage
    command:
      - '--storageDataPath=/storage'
      - '--retentionPeriod=12'
      - '--dedup.minScrapeInterval=15s'
      - '--httpListenAddr=:8428'
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: unheaded-alertmanager
    restart: unless-stopped
    user: "16709:16709"
    read_only: true
    cap_drop: [ALL]
    ports:
      # Loopback only: Prometheus reaches it over the compose network, and
      # its API takes silences from anyone (no auth), which would mute every
      # alert. The UI: ssh -L 9093:127.0.0.1:9093 west.
      - "127.0.0.1:9093:9093"
    volumes:
      # Generated by go run ./cmd/alert-policy (observability/alerting/policy.yaml).
      # No secrets: it routes page and ticket alerts to alert-mailer, the rest nowhere.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      alert-mailer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # The only thing that sends alert mail (ADR-100): pages at once, tickets in
  # one daily digest, never more than mailer.max_per_day a day, and nothing at
  # all while mailer.mode is dry-run (observability/alerting/policy.yaml).
  # Relay settings in monitoring/.env (none secret); the password file in
  # ALERT_MAILER_SECRETS_DIR (smtp-password, 0400, uid 16710). What it sent
  # or would have: curl -s 127.0.0.1:19130/v1/outbox
  #
  # Dead-man's switch (ADR-100, heartbeat.go): off unless HEARTBEAT_HOSTS
  # (monitoring/.env, e.g. "east") names hosts; then the token file
  # heartbeat-token (0400, uid 16710) must sit beside smtp-password and the
  # heartbeat listener (19131, heartbeat only: no webhook, no outbox) answers.
  # It stays on loopback until HEARTBEAT_LISTEN=192.168.13.2 publishes it on
  # the P2P link; set that only while the link is configured at boot, since
  # docker will not start a container whose published address is missing.
  alert-mailer:
    build:
      context: ..
      dockerfile: docker/alert-mailer/Dockerfile
    image: unheaded/alert-mailer:dev
    container_name: unheaded-alert-mailer
    restart: unless-stopped
    user: "16710:16710"
    read_only: true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:19130:19130"
      - "${HEARTBEAT_LISTEN:-127.0.0.1}:19131:19131"
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD_FILE: /run/secrets/alert-mailer/smtp-password
      ALERT_MAIL_FROM: ${ALERT_MAIL_FROM:-}
      ALERT_MAIL_TO: ${ALERT_MAIL_TO:-}
      HEARTBEAT_HOSTS: ${HEARTBEAT_HOSTS:-}
      HEARTBEAT_TOKEN_FILE: /run/secrets/alert-mailer/heartbeat-token
    volumes:
      - ../observability/alerting/policy.yaml:/etc/alert-mailer/policy.yaml:ro
      - alert_mailer_data:/var/lib/alert-mailer
      - ${ALERT_MAILER_SECRETS_DIR:-./alert-mailer/no-secrets}:/run/secrets/alert-mailer:ro
    networks: [monitoring]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:19130/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    security_opt:
      - no-new-privileges:true

  # No node-exporter container: each host runs deploy/systemd/node-exporter.service
  # on :9100 (so a container could not bind it), and the node_exporter job in
  # prometheus/prometheus.yml scrapes those units over the overlay.
