! FRR MPLS LDP — Unheaded Kingdom — Alternate Routing Option C
! SPDX-License-Identifier: MIT
! CRITICAL: MPLS label stack is outer; IPv6+HbH (Monad) is inner — survives push/pop.
! This is defined behavior per RFC 3031 section 3.9 and RFC 6232.
! The MPLS forwarding plane looks at the label stack only — never at inner IPv6 headers.
!
! LDP targeted session to host-b loopback
! SR-MPLS as alternative (see frr-isis-ha.conf for SR config)
! Label range: 100-999 (local, non-SR)

frr version 10.0
hostname unheaded-forge
log syslog informational
service integrated-vtysh-config
!
mpls enable
!
interface wg0
 mpls enable
!
interface lo
 mpls enable
!
! LDP — Label Distribution Protocol
mpls ldp
 router-id 10.20.255.1
 !
 address-family ipv4
  discovery transport-address 10.20.255.1
  !
  interface wg0
   label-base 100
  !
 !
 address-family ipv6
  discovery transport-address fd00:dead:beef::1
  !
  interface wg0
  !
 !
!
! Static segment list for host-b loopback (SR path)
segment-routing
 traffic-eng
  segment-list host-b-loopback
   index 10 mpls label 16002
  !
  policy host-b
   binding-sid 4016002
   color 100 endpoint fd00:dead:beef:ff::2
   candidate-path preference 100 name primary explicit segment-list host-b-loopback
  !
 !
!
end
