! FRR IS-IS + Segment Routing MPLS — host-a (Forge)
! Alternate Routing Option B — IS-IS underlay + SR-MPLS data plane
! SPDX-License-Identifier: MIT
! CRITICAL: MPLS label stack is outer; IPv6+HbH (Monad) is inner — survives push/pop

frr version 10.0
hostname unheaded-forge
log syslog informational
service integrated-vtysh-config
!
mpls enable
!
interface lo
 ip address 10.20.255.1/32
 ipv6 address fd00:dead:beef:ff::1/128
 isis enable isis-unheaded
 isis circuit-type level-2-only
 isis passive
!
interface wg0
 ip address 10.20.255.1/30
 ipv6 address fd00:dead:beef::1/48
 isis enable isis-unheaded
 isis circuit-type level-2-only
 isis hello-interval 3
 isis holddown 12
 ! RFC 5308 IPv6 TLV 236 — IS-IS native IPv6 support
 isis ipv6 enable
 isis metric 10
 ! MPLS on WireGuard interface
 mpls enable
 ! BFD for fast failover
 isis bfd
!
interface br-unheaded
 ip address 10.20.0.254/16
 ipv6 address fd00:dead:beef:1::1/64
 isis enable isis-unheaded
 isis circuit-type level-2-only
 isis passive
 isis metric 1
!
router isis isis-unheaded
 net 49.0001.1020.0255.0001.00
 is-type level-2-only
 metric-style wide
 ! RFC 5308 — IS-IS IPv6 routing (TLV 236)
 redistribute ipv6 connected
 redistribute ipv6 static
 !
 ! Segment Routing MPLS
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing local-block 15000 15999
 ! Prefix-SID for host-a loopback (absolute label 16001)
 segment-routing prefix fd00:dead:beef:ff::1/128 index 1
 !
 ! ECMP
 maximum-paths 4
!
bfd
 peer fd00:dead:beef::2 interface wg0
  receive-interval 300
  transmit-interval 300
  detect-multiplier 3
 !
!
end
