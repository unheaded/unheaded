# BIRD OSPFv3 Configuration — Unheaded Kingdom — host-b (Outpost)
# Alternate Routing Option A: OSPFv3 (simple L3, no EVPN, no AS numbers)
# SPDX-License-Identifier: MIT
# Copyright (c) 2024-2026 Steven Bellis. All rights reserved.
#
# CRITICAL: BIRD routing is transparent to IPv6 HbH extension headers.
# Monad HbH (HOPOPT) passes through unmodified.

router id 10.20.255.2;
log syslog all;

protocol device { }

protocol direct {
    ipv6;
    interface "wg0", "br-unheaded", "lo";
}

protocol kernel {
    ipv6 {
        export filter {
            if source = RTS_OSPF then accept;
            if source = RTS_STATIC then accept;
            reject;
        };
    };
}

protocol bfd {
    interface "wg0" {
        min rx interval 300ms;
        min tx interval 300ms;
        multiplier 3;
    };
}

protocol ospf v3 OSPF {
    ecmp yes;
    merge external yes;
    
    area 0.0.0.0 {
        interface "wg0" {
            type pointopoint;
            cost 10;
            hello 5;
            dead 20;
            retransmit 5;
            tx delay 1;
            # MTU mismatch on WireGuard — essential for adjacency
            check link yes;
            bfd yes;
        };
        
        interface "br-unheaded" {
            # Passive — advertise prefix, no hellos to containers
            type bcast;
            cost 1;
            stub;
        };
        
        interface "lo" {
            type stub;
            cost 0;
        };
    };
    
    export filter {
        if net ~ [fd00:dead:beef::/48+, 10.20.0.0/16+] then accept;
        if source = RTS_DEVICE then accept;
        reject;
    };
    
    import all;
}
