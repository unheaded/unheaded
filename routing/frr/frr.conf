! SPDX-License-Identifier: MIT
! Unheaded Kingdom — FRR Configuration (host-a Forge)
! OPNsense + FRR: BGP EVPN-VXLAN fabric, IS-IS underlay
! Protocol stack: IS-IS underlay → iBGP EVPN overlay → VXLAN data plane
!
! CRITICAL: IPv6 HbH extension headers (Monad 20-byte register) must pass
! through all routing decisions without modification. FRR does not strip HbH
! headers — but all ACLs and route-maps must explicitly permit ip6 nexthdr 0
!

frr version 10.0
frr defaults datacenter
hostname forge
log syslog informational
log facility daemon
service integrated-vtysh-config

!
! === LOOPBACK (BGP/VTEP anchor) ===
!
interface lo
 ip address 10.20.255.1/32
 ipv6 address fd00:dead:beef:ff::1/128
!

!
! === WAN interface ===
!
interface eno1
 description WAN — upstream router
 ip address dhcp
 ipv6 address autoconfig
!

!
! === LAN bridge (service containers) ===
!
interface br-unheaded
 description LAN — service container bridge
 ip address 10.20.0.254/16
 ipv6 address fd00:dead:beef:1::fe/64
!

!
! === WireGuard east-west (to host-b) ===
!
interface wg0
 description WireGuard east-west to host-b
 ip address fd00:dead:beef::1/48
 ipv6 nd ra-interval 10
!

!
! =============================================
! IS-IS UNDERLAY (RFC 5308 — IPv6 capable)
! =============================================
!

router isis UNHEADED
 net 49.0001.1020.0255.0001.00
 is-type level-2-only
 metric-style wide
 advertise-high-metrics
 log-adjacency-changes
 !
 ! Redistribute connected routes into IS-IS (loopback + WireGuard)
 redistribute ipv4 connected level-2
 redistribute ipv6 connected level-2
 !
 ! Segment Routing (future MPLS/SRv6 capability)
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
!

interface lo
 ip router isis UNHEADED
 ipv6 router isis UNHEADED
 isis passive
!

interface wg0
 ip router isis UNHEADED
 ipv6 router isis UNHEADED
 isis circuit-type level-2-only
 isis metric 10
 isis network point-to-point
!

!
! =============================================
! BGP EVPN OVERLAY
! =============================================
!

router bgp 65001
 bgp router-id 10.20.255.1
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 !
 ! iBGP peer: host-b over WireGuard
 neighbor fd00:dead:beef::2 remote-as 65002
 neighbor fd00:dead:beef::2 description host-b-outpost
 neighbor fd00:dead:beef::2 update-source lo
 neighbor fd00:dead:beef::2 bfd
 neighbor fd00:dead:beef::2 graceful-restart
 !
 ! IPv4 unicast (service subnet reachability)
 address-family ipv4 unicast
  network 10.20.0.0/16
  neighbor fd00:dead:beef::2 activate
  neighbor fd00:dead:beef::2 soft-reconfiguration inbound
  maximum-paths 4
 exit-address-family
 !
 ! IPv6 unicast
 address-family ipv6 unicast
  network fd00:dead:beef:1::/64
  neighbor fd00:dead:beef::2 activate
  neighbor fd00:dead:beef::2 soft-reconfiguration inbound
 exit-address-family
 !
 ! L2VPN EVPN (VXLAN overlay)
 address-family l2vpn evpn
  neighbor fd00:dead:beef::2 activate
  neighbor fd00:dead:beef::2 attribute-unchanged next-hop
  advertise-all-vni
  advertise-default-gw
  advertise-svi-ip
  !
  ! VXLAN VNI-to-VRF mapping for service isolation
  vni 10001
   rd 65001:10001
   route-target import 65001:10001
   route-target export 65001:10001
   advertise-default-gw
  !
  vni 10002
   rd 65001:10002
   route-target import 65001:10002
   route-target export 65001:10002
  !
  vni 10100
   rd 65001:10100
   route-target import 65001:10100
   route-target export 65001:10100
   description "Telemetry VNI"
 exit-address-family
!

!
! =============================================
! BFD (fast failure detection — pairs with BGP)
! =============================================
!

bfd
 peer fd00:dead:beef::2 interface wg0
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
!

!
! =============================================
! ROUTE MAPS (Monad HbH-aware filtering)
! =============================================
!

!
! Allow all — HbH headers are L3 transport metadata,
! not inspected by BGP. Route policies operate on prefixes only.
!
route-map PERMIT-ALL permit 10
 description "Permit all routes (HbH passthrough guaranteed at L3)"
!

! Prefix lists for service subnets
ip prefix-list UNHEADED-SERVICES seq 5 permit 10.20.0.0/16 le 32
ip prefix-list UNHEADED-LOOPBACKS seq 5 permit 10.20.255.0/24 le 32
!

ipv6 prefix-list UNHEADED-V6 seq 5 permit fd00:dead:beef::/32 le 128
!

!
! =============================================
! VXLAN VTEP configuration (kernel/zebra)
! =============================================
!

!
! Zebra controls VXLAN VTEPs via netlink
! VTEPs are created at the OS level:
!   ip link add vxlan10001 type vxlan id 10001 local 10.20.255.1 dstport 4789
!   ip link set vxlan10001 master br-vxlan10001 up
!
! FRR zebra picks up the VTEP and advertises via EVPN BGP automatically
!

end
