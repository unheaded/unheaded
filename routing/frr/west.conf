! SPDX-License-Identifier: GPL-3.0-or-later
! west (FRR, AS 65001): the config deployed at /etc/frr/frr.conf. See wiki/Overlay-Network.md.
! frr.conf in this directory is the host-a design reference, not what runs.
! BFD: BIRD sends multihop BFD with hop limit 64 (FRR expects 255 - hops), so the
! peer sets minimum-ttl 64; without it FRR drops every packet and the session stays down.
!
frr version 10.4.1
frr defaults datacenter
hostname west
log syslog informational
service integrated-vtysh-config
!
ipv6 prefix-list UNHEADED-V6 seq 5 permit fd00:dead:beef::/48 le 128
!
route-map PERMIT-ALL permit 10
exit
!
ipv6 route fd00:dead:beef:1::/64 blackhole
!
interface lo
 ip address 10.20.255.1/32
 ipv6 address fd00:dead:beef:ff::1/128
exit
!
interface wg0
 description WireGuard east-west tunnel
exit
!
router bgp 65001
 bgp router-id 10.20.255.1
 bgp bestpath as-path multipath-relax
 neighbor fd00:dead:beef::2 remote-as 65002
 neighbor fd00:dead:beef::2 description east-bird
 neighbor fd00:dead:beef::2 bfd
 neighbor fd00:dead:beef::2 ebgp-multihop 2
 neighbor fd00:dead:beef::2 update-source fd00:dead:beef::1
 neighbor fd00:dead:beef::2 graceful-restart
 !
 address-family ipv4 unicast
  no neighbor fd00:dead:beef::2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network fd00:dead:beef:1::/64
  neighbor fd00:dead:beef::2 activate
  neighbor fd00:dead:beef::2 soft-reconfiguration inbound
  neighbor fd00:dead:beef::2 route-map PERMIT-ALL in
  neighbor fd00:dead:beef::2 route-map PERMIT-ALL out
 exit-address-family
exit
!
bfd
 peer fd00:dead:beef::2 multihop local-address fd00:dead:beef::1
  minimum-ttl 64
 exit
 !
exit
!
