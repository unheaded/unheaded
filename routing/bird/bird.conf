# SPDX-License-Identifier: MIT
# Unheaded Kingdom — BIRD Configuration (host-b Outpost)
# IPFire + BIRD: lightweight BGP peer to host-a FRR
# Protocols: BGP (EVPN peer), BFD, OSPF (local), radv (IPv6 RA)
#
# BIRD does not modify IPv6 extension headers — Monad HbH headers
# pass through the kernel routing table transparently.

log syslog { debug, trace, info, remote, warning, error, auth, fatal, bug };
log stderr all;
router id 10.20.255.2;

#
# =============================================
# DEVICE & DIRECT PROTOCOLS
# =============================================
#

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    ipv6;
    interface "br-unheaded", "wg0", "lo";
}

#
# =============================================
# KERNEL PROTOCOL (sync routes to kernel)
# =============================================
#

protocol kernel {
    ipv4 {
        export all;
        import all;
    };
    learn;
    merge paths on;
}

protocol kernel kernel6 {
    ipv6 {
        export all;
        import all;
    };
    learn;
    merge paths on;
}

#
# =============================================
# BFD (fast failure detection — 300ms)
# =============================================
#

protocol bfd {
    interface "wg0" {
        min rx interval 300ms;
        min tx interval 300ms;
        multiplier 3;
    };
}

#
# =============================================
# STATIC ROUTES
# =============================================
#

protocol static {
    ipv4;
    route 10.20.0.0/16 via "br-unheaded";
    route 10.20.255.2/32 via "lo";
}

protocol static static6 {
    ipv6;
    route fd00:dead:beef:2::/64 via "br-unheaded";
    route fd00:dead:beef:ff::2/128 via "lo";
}

#
# =============================================
# BGP — iBGP peer to host-a (FRR/OPNsense)
# =============================================
#

protocol bgp forge {
    description "host-a Forge — FRR BGP EVPN";
    local fd00:dead:beef::2 as 65002;
    neighbor fd00:dead:beef::1 as 65001;
    
    bfd graceful;
    hold time 90;
    keepalive time 30;
    
    ipv4 {
        import all;
        export filter {
            if net ~ 10.20.0.0/16 then accept;
            if net ~ 10.20.255.0/24 then accept;
            reject;
        };
        next hop self;
        add paths rx;
    };
    
    ipv6 {
        import all;
        export filter {
            if net ~ fd00:dead:beef::/32 then accept;
            reject;
        };
        next hop self;
        add paths rx;
    };
    
    # L2VPN EVPN (VXLAN overlay routes from host-a)
    l2vpn evpn {
        import all;
        export all;
        # Monad: EVPN type-5 routes carry IPv6 prefixes with HbH headers
        # BIRD passes these transparently — no HbH modification
    };
}

#
# =============================================
# OSPF (local — intra-host routing if needed)
# =============================================
#

protocol ospf v3 {
    area 0.0.0.0 {
        interface "br-unheaded" {
            type broadcast;
            cost 10;
        };
        interface "lo" {
            stub;
        };
    };
    ipv6 {
        import all;
        export filter {
            if net ~ fd00:dead:beef::/32 then accept;
            reject;
        };
    };
}

#
# =============================================
# ROUTER ADVERTISEMENT (IPv6 RA for containers)
# Advertises fd00:dead:beef:2::/64 to containers
# This prefix carries Monad-capable IPv6 addresses
# =============================================
#

protocol radv {
    interface "br-unheaded" {
        managed no;
        other config yes;
        min ra interval 10;
        max ra interval 30;
        lifetime 3600;
        
        prefix fd00:dead:beef:2::/64 {
            autonomous yes;
            on link yes;
            valid lifetime 3600;
            preferred lifetime 1800;
        };
        
        # RDNSS — point to OPNsense/IPFire DNS
        rdnss fd00:dead:beef:2::1;
        
        # DNSSL
        dnssl "unheaded.internal";
    };
}
