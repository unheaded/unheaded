# SPDX-License-Identifier: MIT
# Unheaded Kingdom — BIRD Configuration (host-b Outpost)
# IPFire + BIRD: lightweight BGP peer to host-a FRR
# Protocols: BGP (EVPN peer), BFD, OSPF (local), radv (IPv6 RA)
#
# BIRD does not modify IPv6 extension headers — Monad HbH headers
# pass through the kernel routing table transparently.

log syslog { debug, trace, info, remote, warning, error, auth, fatal, bug };
log stderr all;
router id 10.20.255.2;

#
# =============================================
# DEVICE & DIRECT PROTOCOLS
# =============================================
#

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    ipv6;
    interface "wg0", "lo";
}

#
# =============================================
# KERNEL PROTOCOL (sync routes to kernel)
# =============================================
#

protocol kernel {
    ipv4 {
        export all;
        import all;
    };
    learn;
    merge paths on;
}

protocol kernel kernel6 {
    ipv6 {
        export all;
        import all;
    };
    learn;
    merge paths on;
}

#
# =============================================
# BFD (fast failure detection — 300ms)
# =============================================
#

protocol bfd {
    interface "wg0" {
        min rx interval 300ms;
        min tx interval 300ms;
        multiplier 3;
    };
}

#
# =============================================
# STATIC ROUTES
# =============================================
#

protocol static {
    ipv4;
    route 10.20.255.2/32 via "lo";
}

protocol static static6 {
    ipv6;
    route fd00:dead:beef:ff::2/128 via "lo";
}

#
# =============================================
# BGP — iBGP peer to host-a (FRR/OPNsense)
# =============================================
#

protocol bgp forge {
    description "host-a Forge — FRR BGP EVPN";
    local fd00:dead:beef::2 as 65002;
    neighbor fd00:dead:beef::1 as 65001;
    
    bfd graceful;
    hold time 90;
    keepalive time 30;
    
    ipv4 {
        import all;
        export filter {
            if net ~ 10.20.0.0/16 then accept;
            if net ~ 10.20.255.0/24 then accept;
            reject;
        };
        next hop self;
        add paths rx;
    };
    
    ipv6 {
        import all;
        export filter {
            if net ~ fd00:dead:beef::/48 then accept;
            reject;
        };
        next hop self;
        add paths rx;
    };
    
    # L2VPN EVPN deferred — BIRD 2.17 does not support l2vpn evpn channel
    # EVPN routes from FRR will be handled when BIRD EVPN support lands
}

#
# =============================================
# OSPF (local — intra-host routing if needed)
# =============================================
#

# OSPFv3 and radv disabled — br-unheaded not yet created on EAST
# Will be enabled when LXD bridge is provisioned
# protocol ospf v3 { ... }
# protocol radv { ... }
