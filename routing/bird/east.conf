# east (BIRD, AS 65002): the config deployed at /etc/bird/bird.conf. See wiki/Overlay-Network.md.
# bird.conf in this directory is the host-b design reference, not what runs.

log syslog all;
router id 192.168.13.1;

#
# =============================================
# DEVICE & DIRECT PROTOCOLS
# =============================================
#

protocol device {
    scan time 10;
}

protocol direct {
    ipv6;
    interface "wg0", "lo";
}

#
# =============================================
# KERNEL PROTOCOL (sync routes to kernel)
# =============================================
#

protocol kernel kernel6 {
    ipv6 {
        export all;
        import all;
    };
    learn;
    merge paths on;
}

#
# =============================================
# BFD (fast failure detection)
# =============================================
#

protocol bfd {
    interface "wg0" {
        min rx interval 300ms;
        min tx interval 300ms;
        multiplier 3;
    };
    # BGP to west runs multihop (/128 addresses on a point-to-point wg0),
    # so its BFD session is multihop too (UDP 4784), matching FRR.
    multihop {
        min rx interval 300ms;
        min tx interval 300ms;
        multiplier 3;
    };
}

#
# =============================================
# STATIC ROUTES (service subnet announcement)
# =============================================
#

protocol static static6 {
    ipv6;
    route fd00:dead:beef:2::/64 blackhole;
}

#
# =============================================
# BGP — eBGP peer to WEST (FRR, AS 65001)
# =============================================
#

protocol bgp west {
    description "WEST — FRR BGP peer";
    local fd00:dead:beef::2 as 65002;
    neighbor fd00:dead:beef::1 as 65001;
    multihop 2;
    bfd on;

    hold time 90;
    keepalive time 30;
    graceful restart on;

    ipv6 {
        import all;
        export filter {
            if net = fd00:dead:beef:2::/64 then accept;
            if net ~ fd00:dead:beef::/48 then accept;
            reject;
        };
        next hop self;
    };
}
