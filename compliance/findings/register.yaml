  - id: FND-035
    title: >-
      One missing or expired flow-0 entry drops every Shield-born packet on an enforcing hop
    verify: >-
      Shield-born packets carry resolved service ids, or `unheaded hop rules apply` refuses or warns on a require_hmac
      or require_retry validator with no live flow-0 entry on its namespace
    severity: low
    class: app
    opened: 2026-11-04
    exposure: >-
      Shield leaves both service ids at 0 and stamps ring 1, so all its packets share flow 0, namespace 1 (ADR-125 says
      so). No remote packet can trigger it: rules need root on the pins, `unheaded hop mode` refuses enforce while
      this entry is open, and the packaged hop_xdp (built without `hop-enforce`) runs enforce as observe since
      2026-11-09. The risk once enforce is allowed is a
      ttl lapsing unattended, since nothing renews an entry and `hop rules apply` cannot see the mode. Nothing loads
      hop-ebpf in production.
    lockout: none
    step: 7
    plan: >-
      Not fixed in S-WIRE-HONEST: which of the two answers is a design call for Stevie. pkg/hoprules' comment now
      states the lever and its example names ring 1. Way back while it stands: set CONFIG key 4 to 0. Found by Step
      125's security read.

