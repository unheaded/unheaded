# Findings register (ADR-098). Triage only: which findings are open is decided
# by evidence (var/compliance/evidence.json), never by this file. A finding
# whose source passes is reported "resolved: remove entry"; a failing source
# with no entry here still counts, as untriaged.
#
#   source:   "<kind>:<ref>" of a catalog evidence source, or
#   id:       FND-NNN for a finding no collector sees yet (needs title + verify)
#   severity: critical | high | medium | low (exposure x impact; no inflation)
#   class:    sysctl | sshd | firewall | service | kmod | fileperm | mount | package | sudo | boot | mac | account | shell | app | container | ci | backup | process
#   lockout:  none | low | high (can fixing it lock Stevie out of the host?)
#   step:     remediation order, ADR-098 section 4 (safe first, lockout risk last)
#   accepted: {reason, compensating, accepted_on, until} <= 90 days; still counted
#
# Exposure assumed below: west and east are reachable from the home LAN and
# the west-east P2P link only, not from the internet. Unverified (ADR-098
# open question 4); if it is wrong, several severities rise. West holds a
# public ISP-assigned IPv6 address (SLAAC) with ip6tables INPUT ACCEPT; Stevie
# confirmed 2026-09-30 that the ISP edge firewall drops unsolicited inbound
# (FND-004, closed on his statement). (Addresses are deliberately not written here.)

