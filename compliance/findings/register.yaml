  - id: FND-015
    title: >-
      The Well's TLS key exchange is classical P-256: PostgreSQL 16's ssl_ecdh_curve takes one curve, so no client
      can negotiate a hybrid ML-KEM group with it (proved in throwaway containers; PG 18 with ssl_groups negotiates
      X25519MLKEM768 with every client we run)
    verify: >-
      scripts/well/test-pq-groups.sh passes, and on the live port scripts/probe-tls-groups.sh --starttls postgres
      (or openssl s_client -starttls postgres -groups X25519MLKEM768) negotiates X25519MLKEM768; the
      docker-compose.yml and the-well statefulset postgres-pre18 lines are gone from docs/policy/pq-kex-baseline.txt
    host: west
    severity: medium
    class: app
    opened: 2026-10-23
    exposure: >-
      Well traffic on loopback, the Docker bridge and the P2P link (backups to east): recordable by anyone on that
      path today and decryptable later by a quantum adversary (harvest now, decrypt later); lab host, not
      internet-facing
    lockout: none
    step: 7
    plan: >-
      E1: runbooks/data/well-pg18-upgrade.yaml (dump/restore into a new volume with restore-drill.sh --into-volume,
      PG 16 volume kept as the rollback, db/postgresql.pg18.conf.d/10-pq-groups.conf with
      ssl_groups=X25519MLKEM768:X25519:prime256v1). Clients need no change (libpq 16/18 and lib/pq offer the hybrid)
    decision: E1, when to take the Well to PostgreSQL 18 (downtime, data-bearing major upgrade)

