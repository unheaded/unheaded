  - id: FND-007
    title: pkg/database falls back to the Well superuser with a built-in password when WELL_USER/WELL_PASSWORD are unset
    verify: go test ./pkg/database/... includes a test that Connect fails loudly with no WELL_USER/WELL_PASSWORD, and no Go file sets a password default
    host: west
    severity: medium
    class: app
    opened: 2026-10-01
    exposure: >-
      Any service started without the variables authenticates as the PostgreSQL superuser with a password written in the repo.
      The Well logged 4674 failed superuser logins from 2026-09-24 to 2026-09-30 (3213 on 2026-09-29), consistent with a process
      using that default against a volume initialised with another password; nothing alerted (ADR-100)
    lockout: none
    step: 5
    plan: >-
      COMPLIANCE-WELL battle plan step 22: no default for WELL_USER/WELL_PASSWORD, Connect returns errMissingConnStr, test first.
      Callers that relied on the default fail loudly and are listed for a scoped user
    resolved:
      on: 2026-10-01
      evidence: >-
        pkg/database TestConfig_NoCredentialDefaults (default user is the scoped role ops_writer/app_kanban, no default
        password) and TestConnect_MissingCredentialsFailsLoudly (ErrMissingCredentials before any connection attempt);
        DSN values are now quoted (TestDSN_QuotesEveryValue). Both callers already degrade (dashboard in-memory,
        kanban to SQLite). Running processes keep the old binary until restarted

  - id: FND-008
    title: kanban-app connects to The Well as the superuser (docker-compose WELL_USER "unheaded") instead of its scoped user app_kanban
    verify: docker-compose.yml gives kanban-app WELL_USER app_kanban with its password from the environment, and the Kanban board still loads its cards from The Well
    host: west
    severity: medium
    class: app
    opened: 2026-10-01
    exposure: a compromise of kanban-app reaches all four databases with superuser rights; the per-service users of ADR-016/ADR-091 exist precisely to prevent this
    lockout: none
    step: 5
    plan: >-
      Switch kanban-app to app_kanban (grants already exist in 003/007), with the password from an env var that has no default.
      Check the other compose services for the same pattern at the same time
    resolved:
      on: 2026-10-15
      evidence: >-
        docker-compose.yml gives kanban-app WELL_USER app_kanban and WELL_PASSWORD ${APP_KANBAN_PASSWORD:?...} (no default;
        compose refuses to start without it). Live: app_kanban's password rotated off the repo's kanban_dev into the
        gitignored .env (0600); the rebuilt kanban-app connects as app_kanban (pg_stat_activity shows no superuser session)
        and serves all 73 cards from unheaded_app. Startup DDL replaced by KanbanStore.CheckSchema (SELECT-only; a non-owner
        cannot ALTER, which the old EnsureSchema did). No other compose service passes Well credentials

