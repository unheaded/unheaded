    verify: from a vantage point outside the home network, west's global IPv6 address answers on no port (or the router's IPv6 inbound firewall is shown to be on); then this entry closes with that evidence
    host: west
    severity: high
    class: firewall
    opened: 2026-09-30
    exposure: if reachable, every west listener is on the internet, including the services running with no auth (check-service-auth) and sshd with keyboard-interactive login
    lockout: none
    step: 1
    plan: >-
