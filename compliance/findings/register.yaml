      hourly and silences its own warning; tested end to end against an SMTP sink (CI). 2026-10-20: Prometheus had no
      alerting block, so no alert ever reached Alertmanager; fixed (d5e39b31) and the same test now proves a firing rule
      arrives. The monitoring stack can now start on west (its subnet overlapped kind/netbox) and needs
