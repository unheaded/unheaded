# Remediation as code (ADR-099): every fix once, as data. Authored here
# because fixes run as root and must change only by signed commit; mirrored
# into The Well (unheaded_config.compliance_fixes) by sha256 for display and
# query. Actions come from a closed set (file, setting, mode, service,
# package, absent, run, validate); `run`/`validate`/`precheck` values come
# from a fixed allowlist in pkg/compliance/remediation.
#
# A file's content is an ordered list of parts. A part may name the hosts it
# is for, or a fact under which it is left out; or the whole content comes
# from a named generator. Rendering is checked against what
# scripts/host/remediate.sh writes (TestModelMatchesRemediateScript), and
# the script stays authoritative until the native executor replaces it.

fixes:
  - id: sysctl-cis
    title: Kernel network and core-dump settings (CIS 1.5.3, 3.3.x)
    controls: [UH-HOST-01]
    closes:
      - "host-sysctl:*:fs.suid_dumpable=0"
      - "host-sysctl:*:net.ipv4.conf.all.send_redirects=0"
      - "host-sysctl:*:net.ipv4.conf.all.accept_redirects=0"
      - "host-sysctl:*:net.ipv6.conf.all.accept_redirects=0"
      - "host-sysctl:*:net.ipv4.conf.all.secure_redirects=0"
      - "host-sysctl:*:net.ipv4.conf.all.log_martians=1"
      - "host-sysctl:east:net.ipv6.conf.all.accept_ra=0"
    risk: none
    class: sysctl
    note: >-
      west keeps router advertisements (its ISP IPv6 address comes from them) and forwarding (it routes by design);
      accept_ra=0 is written for east only
    actions:
      - file:
          path: /etc/sysctl.d/60-unheaded-cis.conf
          mode: "0644"
          parts:
            - text: |
                # ADR-098 / CIS Ubuntu 24.04 1.5.3, 3.3.2, 3.3.5, 3.3.6, 3.3.9. Managed by
                # scripts/host/remediate.sh (sysctl-cis); edit there, not here.
                fs.suid_dumpable = 0
                net.ipv4.conf.all.send_redirects = 0
                net.ipv4.conf.default.send_redirects = 0
                net.ipv4.conf.all.accept_redirects = 0
                net.ipv4.conf.default.accept_redirects = 0
                net.ipv6.conf.all.accept_redirects = 0
                net.ipv6.conf.default.accept_redirects = 0
                net.ipv4.conf.all.secure_redirects = 0
                net.ipv4.conf.default.secure_redirects = 0
                net.ipv4.conf.all.log_martians = 1
                net.ipv4.conf.default.log_martians = 1
            - hosts: [east]
              text: |
                net.ipv6.conf.all.accept_ra = 0
                net.ipv6.conf.default.accept_ra = 0
      - run: "sysctl --system"

  - id: apport-off
    title: Automatic error reporting off (apport resets fs.suid_dumpable when it starts)
    controls: [UH-HOST-01]
    closes: ["host-probe:*:svc-apport-not-in-use"]
    risk: none
    class: service
    actions:
      - setting: {path: /etc/default/apport, key: enabled, value: "0"}
      - service: {name: apport.service, enabled: false, active: false, masked: true}

  - id: kmod-cis
    title: Unused filesystem kernel modules cannot load (CIS 1.1.1.x)
    controls: [UH-HOST-02]
    closes:
      - "host-probe:*:kmod-cramfs-disabled"
      - "host-probe:*:kmod-freevxfs-disabled"
      - "host-probe:*:kmod-hfs-disabled"
      - "host-probe:*:kmod-hfsplus-disabled"
      - "host-probe:*:kmod-jffs2-disabled"
      - "host-probe:*:kmod-udf-disabled"
    risk: none
    class: kmod
    note: usb-storage stays loadable until Stevie decides (register decision)
    actions:
      - file:
          path: /etc/modprobe.d/unheaded-cis.conf
          mode: "0644"
          parts:
            - text: |
                # ADR-098 / CIS Ubuntu 24.04 1.1.1.x. Managed by scripts/host/remediate.sh (kmod-cis).
                install cramfs /bin/false
                blacklist cramfs
                install freevxfs /bin/false
                blacklist freevxfs
                install hfs /bin/false
                blacklist hfs
                install hfsplus /bin/false
                blacklist hfsplus
                install jffs2 /bin/false
                blacklist jffs2
                install udf /bin/false
                blacklist udf

  - id: cron-perms
    title: Scheduled-job files root-only; cron.allow lists root and the sudo group
    controls: [UH-CRON-01]
    closes:
      - "host-probe:*:perm-etc-crontab"
      - "host-probe:*:perm-etc-cron-hourly"
      - "host-probe:*:perm-etc-cron-daily"
      - "host-probe:*:perm-etc-cron-weekly"
      - "host-probe:*:perm-etc-cron-monthly"
      - "host-probe:*:perm-etc-cron-d"
      - "host-probe:*:cron-allow-restricted"
    risk: low
    class: fileperm
    actions:
      - mode: {paths: [/etc/crontab], mode: "0600", owner: root, group: root}
      - mode: {paths: [/etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, /etc/cron.monthly, /etc/cron.d], mode: "0700", owner: root, group: root}
      - file:
          path: /etc/cron.allow
          mode: "0640"
          owner: root
          group: crontab
          # root, then the members of group sudo, deduplicated, at apply
          # time: restricting crontab must not take it from the operators.
          generator: root-and-group-members
          generator_group: sudo
      - absent: /etc/cron.deny

  - id: banner-cis
    title: Login banners carry the notice and no OS details (CIS 1.6.2, 1.6.3)
    controls: [UH-BANNER-01]
    closes: ["host-probe:*:banner-issue", "host-probe:*:banner-issue-net"]
    risk: none
    class: account
    actions:
      - file:
          path: /etc/issue
          mode: "0644"
          parts:
            - text: |
                Authorized users only. All activity may be monitored and reported.
      - file:
          path: /etc/issue.net
          mode: "0644"
          parts:
            - text: |
                Authorized users only. All activity may be monitored and reported.

  - id: apparmor-utils
    title: AppArmor utilities installed (CIS 1.3.1.1)
    controls: [UH-MAC-01]
    closes: ["host-probe:*:apparmor-installed"]
    risk: none
    class: package
    actions:
      - package: {name: apparmor-utils}

  - id: auditd
    title: auditd installed with Ubuntu's never-halt defaults
    controls: [UH-AUDIT-01]
    closes: ["host-probe:*:auditd-running"]
    risk: low
    class: package
    note: Ubuntu 1:4.0.5 defaults suspend auditing on a full or failing disk and never halt; a halting auditd.conf is refused
    actions:
      - package: {name: auditd}
      - validate: "auditd-never-halts"

  - id: sudo-cis
    title: sudo re-authentication timeout explicit (CIS 5.2.6); sudo log file where sudo supports it (5.2.3)
    controls: [UH-SUDO-01]
    closes: ["host-probe:*:sudo-timeout"]
    risk: high
    class: sudo
    note: sudo-rs (Ubuntu 25.10) rejects `Defaults logfile` and logs every command to auth.log instead, so that line is left out under sudo-rs
    actions:
      - file:
          path: /etc/sudoers.d/00-unheaded
          mode: "0440"
          precheck: "visudo -cf"
          parts:
            - text: |
                # ADR-098 / CIS Ubuntu 24.04 5.2.3, 5.2.6. Managed by scripts/host/remediate.sh (sudo-cis).
            - unless_fact: sudo-rs
              text: |
                Defaults logfile="/var/log/sudo.log"
            - text: |
                Defaults timestamp_timeout=15
      - validate: "visudo -c"

  - id: shell-tmout
    title: Idle interactive shells end after 15 minutes (CIS 5.4.3.2)
    controls: [UH-SESS-01]
    closes: ["host-probe:*:shell-tmout"]
    risk: low
    class: shell
    note: not in the lab profile; it would end Stevie's idle shells
    actions:
      - file:
          path: /etc/profile.d/00-unheaded-tmout.sh
          mode: "0644"
          parts:
            - text: |
                # ADR-098 / CIS Ubuntu 24.04 5.4.3.2. Managed by scripts/host/remediate.sh (shell-tmout).
                readonly TMOUT=900
                export TMOUT

  - id: sshd-safe
    title: sshd settings that do not change how anyone authenticates (CIS 5.1.x)
    controls: [UH-SSH-01]
    closes:
      - "host-sshd:east:x11forwarding=no"
      - "host-sshd:east:maxauthtries<=4"
      - "host-sshd:east:clientaliveinterval>=1"
      - "host-sshd:east:clientaliveinterval<=300"
      - "host-sshd:*:logingracetime<=60"
      - "host-probe:*:sshd-macs"
      - "host-probe:*:sshd-maxstartups"
      - "host-probe:*:perm-sshd-config"
    risk: high
    class: sshd
    note: >-
      Not in the lab profile (Stevie 2026-10-01: SSH stays as it is); applied on east 2026-10-12 on Stevie's say-so after
      the east security audit, with agent forwarding off there too. sshd uses the first value it reads and 00- sorts
      first; west's 99-unheaded.conf already sets X11Forwarding, MaxAuthTries 3 and ClientAlive* more strictly, so
      those lines are written for east only
    actions:
      - file:
          path: /etc/ssh/sshd_config.d/00-unheaded.conf
          mode: "0600"
          parts:
            - text: |
                # ADR-098 step 4 / CIS Ubuntu 24.04 5.1.x. Managed by scripts/host/remediate.sh
                # (sshd-safe). Nothing here changes how anyone authenticates.
            - hosts: [east]
              text: |
                X11Forwarding no
                AllowAgentForwarding no
                MaxAuthTries 4
                ClientAliveInterval 300
                ClientAliveCountMax 3
            - text: |
                LoginGraceTime 60
                MaxStartups 10:30:60
                MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
      - mode: {paths: [/etc/ssh/sshd_config], mode: "0600", owner: root, group: root}
      - mode: {glob: "/etc/ssh/sshd_config.d/*", mode: "0600", owner: root, group: root}
      - validate: "sshd -t"
      - run: "systemctl reload ssh.service"

  - id: auditd-rules
    title: auditd records sudoers, privilege use, time, network-config, access-denied, identity, mount, session, MAC-policy, account and kernel-module events (CIS 6.2.3, lab subset)
    controls: [UH-AUDIT-01]
    closes: []
    risk: low
    class: service
    note: >-
      Not immutable (-e 2 would make undo need a reboot) and without the per-call delete and chmod/chown rules (6.2.3.13,
      6.2.3.9), which builds on these hosts would flood. Watches name only paths that exist on Ubuntu 25.10. Needs the
      auditd fix first: remediate.sh refuses without /etc/audit; the native executor has no such precheck yet and
      relies on augenrules failing, then restores. Applied on east 2026-10-12 on Stevie's say-so after the east security audit.
    actions:
      - file:
          path: /etc/audit/rules.d/50-unheaded-cis.rules
          mode: "0640"
          parts:
            - text: |
                ## ADR-098 / CIS Ubuntu 24.04 6.2.3 (lab subset). Managed by scripts/host/remediate.sh (auditd-rules).
                ## sudoers and privilege use (6.2.3.1, 6.2.3.2)
                -w /etc/sudoers -p wa -k scope
                -w /etc/sudoers.d -p wa -k scope
                -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation
                -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation
                ## time (6.2.3.4)
                -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change
                -a always,exit -F arch=b32 -S adjtimex,settimeofday -k time-change
                -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change
                -a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k time-change
                -w /etc/localtime -p wa -k time-change
                ## network environment (6.2.3.5)
                -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
                -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
                -w /etc/issue -p wa -k system-locale
                -w /etc/issue.net -p wa -k system-locale
                -w /etc/hosts -p wa -k system-locale
                -w /etc/hostname -p wa -k system-locale
                -w /etc/networks -p wa -k system-locale
                -w /etc/network -p wa -k system-locale
                -w /etc/netplan -p wa -k system-locale
                ## access denied (6.2.3.7)
                -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
                -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access
                -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
                -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access
                ## identity (6.2.3.8)
                -w /etc/group -p wa -k identity
                -w /etc/passwd -p wa -k identity
                -w /etc/gshadow -p wa -k identity
                -w /etc/shadow -p wa -k identity
                -w /etc/security/opasswd -p wa -k identity
                -w /etc/nsswitch.conf -p wa -k identity
                -w /etc/pam.conf -p wa -k identity
                -w /etc/pam.d -p wa -k identity
                ## mounts (6.2.3.10)
                -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mounts
                -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k mounts
                ## sessions and logins (6.2.3.11, 6.2.3.12)
                -w /var/log/wtmp -p wa -k session
                -w /var/log/btmp -p wa -k session
                -w /var/log/lastlog -p wa -k logins
                ## MAC policy (6.2.3.14)
                -w /etc/apparmor -p wa -k MAC-policy
                -w /etc/apparmor.d -p wa -k MAC-policy
                ## account changes and kernel modules (6.2.3.18, 6.2.3.19)
                -a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k usermod
                -a always,exit -F arch=b64 -S init_module,finit_module,delete_module -F auid>=1000 -F auid!=unset -k kernel_modules
                -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules
                ## sshd configuration (not in CIS 6.2.3; ADR-098 tracks it)
                -w /etc/ssh/sshd_config -p wa -k sshd
                -w /etc/ssh/sshd_config.d -p wa -k sshd
      - run: "augenrules --load"

  - id: journald-caps
    title: journald disk use capped explicitly (ADR-092 section 5, CIS 6.1.1.3)
    controls: [UH-LOG-02]
    closes: ["host-probe:*:journald-rotation"]
    risk: low
    class: service
    note: >-
      Stevie approved the caps 2026-10-13 ("we can cap journal", noting all logs should also ship to long-term storage,
      ADR-092). Applied with remediate.sh 2026-10-13 on east (4.0G -> 973M) then west (3.4G -> 971M), after archiving
      each host's full journal to /var/backups/unheaded-journal-20261013/journal.tar.zst. Nothing ships the journal
      off-host yet, so what the cap vacuums is gone unless archived first.
    actions:
      - file:
          path: /etc/systemd/journald.conf.d/60-unheaded.conf
          mode: "0644"
          parts:
            - text: |
                # ADR-092 section 5 / CIS Ubuntu 24.04 6.1.1.3. Managed by scripts/host/remediate.sh (journald-caps).
                [Journal]
                SystemMaxUse=1G
                RuntimeMaxUse=200M
      - run: "systemctl restart systemd-journald.service"

  - id: time-p2p
    title: West serves time to east over the point-to-point link
    controls: [UH-TIME-01]
    closes: []
    risk: low
    class: service
    note: >-
      East reaches the internet only through west, so when west is down east loses every NTP source (2026-10-13). West
      answers only east (allow), binds its NTP server socket to the P2P address so no new listener appears on the LAN or
      the public IPv6 address, and serves its own clock at stratum 10 when its uplink is out. East keeps its NTS pools
      and adds west. Stevie 2026-10-13: "local time mirror never hurts". Apply on west first. Applied with
      remediate.sh 2026-10-13: west 13:41Z, east 13:42Z; east lists west as a source (stratum 3, reachable).
    actions:
      - file:
          path: /etc/chrony/conf.d/60-unheaded-p2p.conf
          mode: "0644"
          parts:
            - text: |
                # West serves time to east over the point-to-point link, also while west's
                # own uplink is out (east reaches the internet only through west). Managed
                # by scripts/host/remediate.sh (time-p2p).
            - hosts: [west]
              text: |
                allow 192.168.13.1
                bindaddress 192.168.13.2
                local stratum 10
            - hosts: [east]
              text: |
                server 192.168.13.2 iburst
      - run: "systemctl restart chrony.service"
