      - {kind: host-sysctl, ref: "east:net.ipv4.ip_forward=0"}
      - {kind: host-sysctl, ref: "east:net.ipv6.conf.all.forwarding=0"}
      - {kind: host-sysctl, ref: "east:net.ipv4.icmp_ignore_bogus_error_responses=1"}
      - {kind: host-sysctl, ref: "east:net.ipv4.icmp_echo_ignore_broadcasts=1"}
      - {kind: host-sysctl, ref: "east:net.ipv4.conf.all.secure_redirects=0"}
