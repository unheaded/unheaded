      iso27001-2022: [A.8.20]
      cis-ubuntu2404: ["3.3.2", "3.3.5", "3.3.7", "3.3.10", "3.3.1", "3.3.3", "3.3.4", "3.3.6", "3.3.8", "3.3.9", "3.3.11"]

  - id: UH-SSH-01
    title: Remote login to the hosts is key-only and hardened
    statement: >-
      On west and east, the effective sshd configuration (sshd -T, with
      Include and Match resolved) refuses passwords and keyboard-interactive
      login, root login and empty passwords, disables X11 forwarding, allows
      at most 4 authentication attempts per connection, and times out idle
      sessions within 5 minutes. Read with passwordless sudo, locally or over
      ssh; each record names its host.
      Also (CIS 5.1): no host-based or rhosts authentication, login grace 60s or less, INFO logging, at most 10 sessions, no user environment, PAM on, forwarding off, no GSSAPI.
    rationale: >-
      Remote access restricted to strong authentication (AC-17; IA-2
      identification and authentication by key, not password; 800-171
      03.01.12), limited unsuccessful attempts (AC-7; 03.01.08) and idle
      termination, as enforced configuration (CM-6); CSF PR.AA-03 users and
      services authenticated; ISO A.8.5 secure authentication; SOC 2 CC6.1.
      Values follow the CIS benchmark's SSH server section.
      CIS Ubuntu 24.04 sshd: ClientAliveInterval (5.1.7), MaxAuthTries (5.1.16), PermitEmptyPasswords (5.1.19), PermitRootLogin (5.1.20); password and keyboard-interactive login are stricter than the benchmark asks.
      CIS Ubuntu 24.04 5.1.8-5.1.11, 5.1.13, 5.1.14, 5.1.17, 5.1.21, 5.1.22 added 2026-09-30 (5.1.8 and 5.1.9 are Level 2). 5.1.14 accepts VERBOSE or INFO; the check requires INFO, so VERBOSE would read as a false failure. 5.1.18 MaxStartups is not checked (a three-part value the check cannot compare).
    freshness_days: 1
    evidence:
      - {kind: host-sshd, ref: "west:passwordauthentication=no"}
      - {kind: host-sshd, ref: "west:kbdinteractiveauthentication=no"}
      - {kind: host-sshd, ref: "west:permitemptypasswords=no"}
      - {kind: host-sshd, ref: "west:permitrootlogin=no"}
      - {kind: host-sshd, ref: "west:x11forwarding=no"}
      - {kind: host-sshd, ref: "west:maxauthtries<=4"}
