      - {kind: host-probe, ref: "west:perm-etc-gshadow"}
      - {kind: host-probe, ref: "west:perm-etc-gshadow-backup"}
      - {kind: host-probe, ref: "west:perm-etc-shells"}
      - {kind: host-probe, ref: "west:perm-etc-security-opasswd"}
      - {kind: host-probe, ref: "west:perm-sshd-config"}
      - {kind: host-probe, ref: "west:perm-ssh-host-private-keys"}
      - {kind: host-probe, ref: "west:perm-ssh-host-public-keys"}
      - {kind: host-probe, ref: "east:perm-etc-passwd"}
      - {kind: host-probe, ref: "east:perm-etc-passwd-backup"}
      - {kind: host-probe, ref: "east:perm-etc-group"}
      - {kind: host-probe, ref: "east:perm-etc-group-backup"}
