    statement: >-
      A written information security policy exists, is approved by the
      accountable owner, and is reviewed at least yearly. Evidence is a
      signed, expiring attestation.
    rationale: >-
      Policy and procedures (PL-1, PM-1; 800-171 03.15.01; CSF GV.PO-01;
      ISO A.5.1 policies for information security; SOC 2 CC5.3 policies
      and procedures).
