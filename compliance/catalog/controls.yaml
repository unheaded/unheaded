  - id: UH-CTR-01
    title: Containers run least-privilege, with exceptions only shrinking
    statement: >-
      Every compose service declares a read-only root filesystem, drops all
      Linux capabilities, sets no-new-privileges and is never privileged,
      except the services listed in docs/security/compose-hardening-baseline.txt
      (seven third-party images as of 2026-09-30: clickhouse, coredns,
      grafana, postgres, traefik, vector, victoria). That list may only
      shrink; the gate fails on a new unhardened service and on a stale
      exception. It does NOT say the listed services are hardened.
    rationale: >-
      Least privilege and least functionality for workloads (AC-6, CM-7),
      process isolation (SC-39), as declared configuration (CM-6); 800-171
      03.01.05 and 03.04.06; CSF PR.PS-01; ISO A.8.9.
    freshness_days: 7
    evidence:
      - {kind: gate-script, ref: scripts/check-compose-hardening.sh}
    mappings:
      nist-800-53r5: [AC-6, CM-7, SC-39, CM-6]
      nist-800-171r3: ["03.01.05", "03.04.06"]
      nist-csf-2: [PR.PS-01]
      iso27001-2022: [A.8.9]

  - id: UH-FW-01
    title: Hosts deny inbound traffic by default
    statement: >-
      On west and east the kernel's INPUT policy is DROP for IPv4 and IPv6
      (iptables/ip6tables, which also reflect nftables' iptables tables), so
      only traffic an explicit rule admits reaches a listener. Read from the
      live ruleset, not from a firewall service's status.
    rationale: >-
      Boundary protection with deny by default, allow by exception (SC-7,
      SC-7(5); 800-171 03.13.01, 03.13.06); CSF PR.IR-01; ISO A.8.20
      network security; SOC 2 CC6.6 protection against threats from outside
      the system boundary.
      CIS Ubuntu 24.04: default-deny policy by iptables and ip6tables (4.4.2.1, 4.4.3.1) or by nftables (4.3.8, the package-owned inet unheaded table of ADR-098); the probe accepts either, so a pass supports whichever mechanism is in place, not both.
    freshness_days: 1
    evidence:
      - {kind: host-probe, ref: "west:firewall-inbound-deny"}
      - {kind: host-probe, ref: "east:firewall-inbound-deny"}
    mappings:
      nist-800-53r5: [SC-7, SC-7(5)]
      nist-800-171r3: ["03.13.01", "03.13.06"]
      nist-csf-2: [PR.IR-01]
      soc2-security: [CC6.6]
      iso27001-2022: [A.8.20]
      cis-ubuntu2404: ["4.3.8", "4.4.2.1", "4.4.3.1"]

  - id: UH-AUDIT-01
    title: Hosts record security-relevant events with auditd
    statement: >-
      auditd is running on west and east, so the kernel audit subsystem
      records security-relevant system calls and authentication events.
    rationale: >-
      Event logging and audit record generation (AU-2, AU-12; 800-171
      03.03.01); CSF PR.PS-04 log records generated; ISO A.8.15 logging;
      SOC 2 CC7.2 monitoring for anomalies.
      CIS Ubuntu 24.04 (Level 2): auditd enabled and active (6.2.1.2). 6.2.2.3 (disable the system when audit logs are full) is deliberately not adopted: ADR-098 forbids a halt on audit-log exhaustion (lockout).
    freshness_days: 1
    evidence:
      - {kind: host-probe, ref: "west:auditd-running"}
      - {kind: host-probe, ref: "east:auditd-running"}
    mappings:
      nist-800-53r5: [AU-2, AU-12]
      nist-800-171r3: ["03.03.01"]
      nist-csf-2: [PR.PS-04]
      soc2-security: [CC7.2]
      iso27001-2022: [A.8.15]
      cis-ubuntu2404: ["6.2.1.2"]

  - id: UH-PATCH-01
    title: Hosts install security updates automatically
    statement: >-
      On west and east, apt's periodic unattended upgrade is enabled
      (APT::Periodic::Unattended-Upgrade "1"), so security updates install
      without waiting for a person.
    rationale: >-
      Flaw remediation with automated installation (SI-2, SI-2(2) automated
      flaw remediation status; 800-171 03.14.01); CSF PR.PS-02 software
      maintained; ISO A.8.8 technical vulnerability management.
      CIS Ubuntu 24.04: updates and patches installed (1.2.2.1, manual); automatic security updates are the mechanism evidenced.
    freshness_days: 1
    evidence:
      - {kind: host-probe, ref: "west:unattended-upgrades-enabled"}
      - {kind: host-probe, ref: "east:unattended-upgrades-enabled"}
    mappings:
      nist-800-53r5: [SI-2, SI-2(2)]
      nist-800-171r3: ["03.14.01"]
      nist-csf-2: [PR.PS-02]
      iso27001-2022: [A.8.8]
      cis-ubuntu2404: ["1.2.2.1"]

  - id: UH-TIME-01
    title: Host clocks are synchronized
    statement: >-
      On west and east the system clock is NTP-synchronized (timedatectl
      NTPSynchronized=yes), so log and audit timestamps line up across hosts.
    rationale: >-
      Time stamps from a synchronized source (AU-8; 800-171 03.03.07); ISO
      A.8.17 clock synchronization. No CSF mapping: NIST's references for
      PR.PS-04 do not list AU-8.
    freshness_days: 1
    evidence:
      - {kind: host-probe, ref: "west:ntp-synchronized"}
      - {kind: host-probe, ref: "east:ntp-synchronized"}
    mappings:
      nist-800-53r5: [AU-8]
      nist-800-171r3: ["03.03.07"]
      iso27001-2022: [A.8.17]

  - id: UH-TLS-01
    title: The edge enforces TLS 1.3 and never serves plain HTTP
    statement: >-
      The edge proxy (traefik) redirects its plain-HTTP entrypoint to HTTPS,
      applies a TLS policy with a TLS 1.3 minimum, and does not serve its
      API/dashboard insecurely. Checked from the declared compose
      configuration by scripts/compliance/check-edge-tls.sh (a compliance
      check, not a CI gate: it fails today).
    rationale: >-
      Transmission confidentiality and integrity with cryptographic
      protection (SC-8, SC-8(1), SC-13; 800-171 03.13.08); CSF PR.DS-02
      data in transit protected; ISO A.8.24 use of cryptography; SOC 2 CC6.7
      restricted transmission. CLAUDE.md: TLS 1.3 minimum for external
      traffic.
    freshness_days: 7
    evidence:
      - {kind: gate-script, ref: scripts/compliance/check-edge-tls.sh}
    mappings:
      nist-800-53r5: [SC-8, SC-8(1), SC-13]
      nist-800-171r3: ["03.13.08"]
      nist-csf-2: [PR.DS-02]
      soc2-security: [CC6.7]
      iso27001-2022: [A.8.24]

  - id: UH-AUTHN-01
    title: Service APIs require authentication
    statement: >-
      Every first-party service in the compose stack runs with
      AUTH_ENABLED=true, so pkg/auth installs a real authenticator (API key
      or JWT) instead of the Noop one that admits every request. Checked from
      the declared compose configuration by
      scripts/compliance/check-service-auth.sh (a compliance check, not a CI
      gate: it fails today).
    rationale: >-
      Access enforcement (AC-3) with identification and authentication of
      users and services (IA-2, IA-9); 800-171 03.01.02 access enforcement,
      03.05.02 device identification and authentication; CSF PR.AA-03; ISO
      A.8.5 secure authentication; SOC 2 CC6.1.
    freshness_days: 7
    evidence:
      - {kind: gate-script, ref: scripts/compliance/check-service-auth.sh}
    mappings:
      nist-800-53r5: [AC-3, IA-2, IA-9]
      nist-800-171r3: ["03.01.02", "03.05.02"]
      nist-csf-2: [PR.AA-03]
      soc2-security: [CC6.1]
      iso27001-2022: [A.8.5]

  - id: UH-BACKUP-01
    title: The database is backed up at least weekly
    statement: >-
      A compressed dump of The Well (PostgreSQL) under ~/backups/unheaded on
      west is at most 7 days old. Checks that a recent backup exists, not
      that it restores.
    rationale: >-
      System backup of user- and system-level information (CP-9); CSF
      PR.DS-11 backups created and maintained; ISO A.8.13 information
      backup. Restore testing is a separate, still-unevidenced part of each.
    freshness_days: 1
    evidence:
      - {kind: host-probe, ref: "west:db-backup-recent"}
    mappings:
      nist-800-53r5: [CP-9]
      nist-csf-2: [PR.DS-11]
      iso27001-2022: [A.8.13]

