# Control profiles (ADR-099): which fixes a host gets. Profiles switch
# remediation only; every check still runs and every failure is reported.
# Source of truth is The Well (unheaded_config.compliance_profiles); this
# file is the Genesis seed and the read-only fallback when The Well is down.
profiles:
  - name: none
    description: Detection and reporting only; no fix is applied.
    fixes: []
  - name: lab
    description: >-
      West and east today (Stevie 2026-10-01): low-hanging fixes that break
      nothing. SSH and passwords stay as they are; idle shells stay open.
      time-p2p and journald-caps added 2026-10-13 (west serves time to east;
      journald capped at 1G/200M after the old journals were archived).
    fixes: [sysctl-cis, apport-off, kmod-cis, cron-perms, banner-cis, apparmor-utils, auditd, sudo-cis, time-p2p, journald-caps]
  - name: lab-hardened
    description: >-
      East since 2026-10-12 (Stevie, after the east security audit): the lab
      fixes plus CIS audit rules and the sshd settings that leave
      authentication alone (no X11 or agent forwarding, MaxAuthTries 4).
      2026-10-27 (S-WELL-SPRING Step 270, ADR-098 steps 2-6): also the ROCm
      log modes, AIDE with a weekly check, and AppArmor's complain-mode
      profiles in enforce; applied in the E-D host window (east first),
      after which west moves here too.
    fixes: [sysctl-cis, apport-off, kmod-cis, cron-perms, banner-cis, apparmor-utils, auditd, sudo-cis, auditd-rules, sshd-safe, time-p2p, journald-caps, rocm-log-perms, aide-install, apparmor-enforce]
  - name: cis-l1-server
    description: Every fix that serves a CIS Ubuntu 24.04 Level 1 Server recommendation.
    fixes: [sysctl-cis, apport-off, kmod-cis, cron-perms, banner-cis, apparmor-utils, sudo-cis, shell-tmout, sshd-safe]
  - name: all
    description: Every fix in the model.
    all: true
