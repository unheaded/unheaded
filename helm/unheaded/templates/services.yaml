{{/*
Template for standard Unheaded services. Each service gets a Deployment + Service.
Uses the same hardened security context and health probes.
*/}}

{{- $services := dict
  "timeguru" .Values.timeguru
  "architect" .Values.architect
  "captain" .Values.captain
  "micromanager" .Values.micromanager
  "monad" .Values.monad
  "sophia" .Values.sophia
  "dashboard-backend" .Values.dashboardBackend
  "kanban-app" .Values.kanbanApp
}}

{{- range $name, $svc := $services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "unheaded.serviceLabels" (dict "ctx" $ "service" $name "component" "service") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "unheaded.selectorLabels" (dict "ctx" $ "service" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "unheaded.selectorLabels" (dict "ctx" $ "service" $name) | nindent 8 }}
    spec:
      # K8s auto-injects <SERVICENAME>_PORT, <SERVICENAME>_SERVICE_HOST etc.
      # env vars for every service in the namespace. These clash with our
      # services' own <SERVICENAME>_PORT-style flags (notably monad reads
      # MONAD_PORT as a port-number; K8s injects MONAD_PORT=tcp://10.x.x.x:N
      # which breaks listen-address parsing). Disable service-link env vars
      # cluster-wide; services discover peers via stable DNS names instead.
      enableServiceLinks: false
      {{- include "unheaded.podSecurityContext" (dict "ctx" $ "uid" $svc.uid) | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: {{ include "unheaded.image" (dict "ctx" $ "image" $svc.image) }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.ports.http }}
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: {{ $name }}
            - name: WOTAN_ADDR
              value: "wotan.{{ $.Values.global.namespace }}.svc.cluster.local:{{ $.Values.wotan.ports.grpc }}"
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- include "unheaded.securityContext" (dict "ctx" $ "uid" $svc.uid) | nindent 10 }}
          {{- include "unheaded.probes" $ | nindent 10 }}
          {{- with $svc.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $svc.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "unheaded.serviceLabels" (dict "ctx" $ "service" $name "component" "service") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.ports.http }}
      targetPort: http
  selector:
    {{- include "unheaded.selectorLabels" (dict "ctx" $ "service" $name) | nindent 4 }}
{{- end }}
{{- end }}
