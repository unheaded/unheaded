{{- if .Values.wotan.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wotan
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "unheaded.serviceLabels" (dict "ctx" . "service" "wotan" "component" "infrastructure") | nindent 4 }}
spec:
  replicas: {{ .Values.wotan.replicas }}
  selector:
    matchLabels:
      {{- include "unheaded.selectorLabels" (dict "ctx" . "service" "wotan") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "unheaded.selectorLabels" (dict "ctx" . "service" "wotan") | nindent 8 }}
    spec:
      containers:
        - name: wotan
          image: {{ include "unheaded.image" (dict "ctx" . "image" .Values.wotan.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.wotan.ports.http }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.wotan.ports.grpc }}
              protocol: TCP
          env:
            - name: WOTAN_HTTP_PORT
              value: "{{ .Values.wotan.ports.http }}"
            - name: WOTAN_GRPC_PORT
              value: "{{ .Values.wotan.ports.grpc }}"
            {{- range $key, $value := .Values.wotan.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          resources:
            {{- toYaml .Values.wotan.resources | nindent 12 }}
          {{- include "unheaded.securityContext" . | nindent 10 }}
          {{- include "unheaded.probes" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: wotan
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "unheaded.serviceLabels" (dict "ctx" . "service" "wotan" "component" "infrastructure") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.wotan.ports.http }}
      targetPort: http
    - name: grpc
      port: {{ .Values.wotan.ports.grpc }}
      targetPort: grpc
  selector:
    {{- include "unheaded.selectorLabels" (dict "ctx" . "service" "wotan") | nindent 4 }}
{{- end }}
