# Development environment overrides.
# Usage: helm install unheaded ./helm/unheaded -f helm/unheaded/values-dev.yaml

global:
  image:
    pullPolicy: Always
    tag: "dev"

# Single replica for all services in dev
timeguru:
  replicas: 1
architect:
  replicas: 1
captain:
  replicas: 1
micromanager:
  replicas: 1
monad:
  replicas: 1
sophia:
  replicas: 1

# Relaxed resource limits for dev
wotan:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

networkPolicy:
  defaultDeny: false
