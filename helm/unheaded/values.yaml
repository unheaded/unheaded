# Default values for unheaded Helm chart.
# Override per-environment with values-dev.yaml, values-prod.yaml, etc.

global:
  namespace: unheaded
  image:
    registry: ghcr.io/unheaded
    pullPolicy: IfNotPresent
    tag: "0.1.0-alpha"
  # Security hardening defaults (matches CLAUDE.md baseline)
  security:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    # FALLBACK ONLY. Every service sets its own `uid:` below, from pkg/uids.
    # A single shared runAsUser across all services means a compromise of any
    # one can read and rewrite every other's state, and makes file ownership
    # useless for attributing writes. 1000 was also the worst possible choice:
    # it is the first normal-user UID on most Linux systems, so it collides
    # with a real human account under userns mapping or a hostPath.
    runAsUser: 16799
    runAsGroup: 16799
    allowPrivilegeEscalation: false
    dropAllCapabilities: true
    seccompProfile: RuntimeDefault

# --- Infrastructure Services ---

wotan:
  enabled: true
  # Dedicated run-as identity — see pkg/uids (single source of truth).
  uid: 16720
  replicas: 1
  image:
    repository: unheaded/wotan
  ports:
    http: 18000
    grpc: 18001
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    LOG_LEVEL: info
    LOG_FORMAT: json

unheadedDaemon:
  enabled: true
  # Dedicated run-as identity — see pkg/uids (single source of truth).
  uid: 16721
  replicas: 1
  image:
    repository: unheaded/unheaded-daemon
  ports:
    http: 17000
    grpc: 17001
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

