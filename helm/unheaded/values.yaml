# Default values for unheaded Helm chart.
# Override per-environment with values-dev.yaml, values-prod.yaml, etc.

global:
  namespace: unheaded
  image:
    registry: ghcr.io/unheaded
    pullPolicy: IfNotPresent
    tag: "0.1.0-alpha"
  # Security hardening defaults (matches CLAUDE.md baseline)
  security:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    dropAllCapabilities: true
    seccompProfile: RuntimeDefault

# --- Infrastructure Services ---

wotan:
  enabled: true
  replicas: 1
  image:
    repository: unheaded/wotan
  ports:
    http: 18000
    grpc: 18001
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    LOG_LEVEL: info
    LOG_FORMAT: json

unheadedDaemon:
  enabled: true
  replicas: 1
  image:
    repository: unheaded/unheaded-daemon
  ports:
    http: 17000
    grpc: 17001
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

