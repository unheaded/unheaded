# Production environment overrides.
# Usage: helm install unheaded ./helm/unheaded -f helm/unheaded/values-prod.yaml

global:
  image:
    pullPolicy: IfNotPresent

# HA replicas for critical services
wotan:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: "1Gi"

timeguru:
  replicas: 3

captain:
  replicas: 2

dashboardBackend:
  replicas: 2

gateway:
  replicas: 2

networkPolicy:
  enabled: true
  defaultDeny: true
