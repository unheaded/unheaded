# =============================================================================
# Cargo.toml — LICH Fuzz Crate (The Automated Adversary)
# =============================================================================
# WHAT: Fuzzing harness crate for Unheaded eBPF programs + wire format
# WHY:  S25 ran 28M executions with zero crashes — LICH needs a proper home
# WHO:  Developer + BlackMage (offensive security)
# WHERE: ebpf/fuzz/Cargo.toml
# WIRE: Seeds in ebpf/fuzz/seeds/, harnesses at the crate ROOT (lich_*.rs)
# =============================================================================

[package]
name = "lich-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Lich — Automated adversary fuzzing for Unheaded protocol and eBPF programs"
license = "UNLICENSED"

# =============================================================================
# FUZZ TARGETS
# =============================================================================
# Each [[bin]] is a separate fuzzing campaign target.
# Run with: cargo +nightly fuzz -C ebpf/fuzz run <target_name>
#
# These MUST match the files that exist. Until 2026-09-09 this section declared
# five targets — fuzz_monad_wire, fuzz_sophia_dict, fuzz_crc16,
# fuzz_exponent_encoding, fuzz_packet_parse — at fuzz_targets/*.rs. None of
# those files was ever committed; the header above still said "move this file
# there", so the manifest was a template that never got reconciled with the
# harnesses actually written alongside it in 94d7ebad (2026-02-25).
#
# The effect was that the four REAL harnesses were declared as nothing, so the
# exact command in README.md — `cargo +nightly fuzz -C ebpf/fuzz run
# lich_007_mbc` — could not resolve a target, and `cargo build` failed outright
# with "can't find bin". The S21 LICH campaign was undeployable for 6 months.
#
# test/bench = false is REQUIRED, not tidiness: these are `#![no_main]`
# libFuzzer targets, so a test or bench harness cannot link. scripts/check-clippy.sh
# lints this workspace with --all-targets and would fail without them.

[[bin]]
name = "lich_007_mbc"
path = "lich_007_mbc.rs"
test = false
bench = false
doc = false

[[bin]]
name = "lich_008_wotan_cache"
path = "lich_008_wotan_cache.rs"
test = false
bench = false
doc = false

[[bin]]
name = "lich_009_flow_collision"
path = "lich_009_flow_collision.rs"
test = false
bench = false
doc = false

[[bin]]
name = "lich_010_wal_integrity"
path = "lich_010_wal_integrity.rs"
test = false
bench = false
doc = false

# =============================================================================
# DEPENDENCIES
# =============================================================================
[dependencies]
# libFuzzer integration — THE standard for Rust fuzzing
libfuzzer-sys = "0.4"

# Arbitrary trait for structured fuzzing (not just byte slices)
arbitrary = { version = "1", features = ["derive"] }

# =============================================================================
# WORKSPACE DEPENDENCIES (relative paths to sibling crates)
# Uncomment and adjust paths based on actual crate layout
# =============================================================================
# monad-common = { path = "../monad-common" }
# sophia-types = { path = "../sophia-types" }
# shield-ebpf-common = { path = "../shield-ebpf-common" }

# =============================================================================
# PROFILE: FUZZ (optimized for fuzzing speed)
# =============================================================================
[profile.release]
opt-level = 3
debug = true          # Keep debug info for crash analysis
overflow-checks = true # KEEP — we want to catch overflows

# Fuzz profile — balance speed with crash reproducibility
[profile.fuzz]
inherits = "release"
opt-level = 3
debug = true
overflow-checks = true
# LTO disabled for faster compilation during fuzzing
lto = false
# Single codegen unit for better coverage
codegen-units = 1

# =============================================================================
# CARGO-FUZZ CONFIGURATION
# =============================================================================
# This section is used by `cargo fuzz` command
[workspace]
members = ["."]
