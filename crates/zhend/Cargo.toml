[package]
name = "zhend"
version = "0.1.0"
edition = "2021"
authors = ["Muck <muck@bellis.tech>"]
license = "GPL-3.0-only"
description = "Zhen Layer 0 — Anti-fragile knowledge substrate for the Unheaded Protocol"
repository = "https://github.com/unheaded/zhend"
keywords = ["unheaded", "zhen", "knowledge", "gossip", "ebpf"]
categories = ["network-programming", "database"]

[dependencies]
# Content addressing
blake3 = "1"
hex = "0.4"

# Storage
sled = "0.34"
memmap2 = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"

# QUIC / HTTP3
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
ring = "0.17"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Embedding inference (ONNX Runtime)
# ort = "2"  # uncomment when ONNX models are ready

# ANN similarity search
# usearch = "2"  # uncomment when embedding pipeline is ready

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random (gossip peer selection)
rand = "0.8"

# Post-Quantum Cryptography (MANDATORY for fragment encryption + peer auth)
# "That which remembers forever must be armored against forever."
# 2026-05-08 (Wave B / FIPS 205+203): pqcrypto-kyber → pqcrypto-mlkem (ML-KEM-768),
# pqcrypto-dilithium → pqcrypto-mldsa (ML-DSA-65). Closes RUSTSEC-2024-0380/0381.
pqcrypto-mlkem = { version = "0.1", optional = true }      # ML-KEM (FIPS 203) key encapsulation
pqcrypto-mldsa = { version = "0.1", optional = true }      # ML-DSA (FIPS 205) signatures
pqcrypto-traits = { version = "0.3", optional = true }      # Common PQ traits

# Classical crypto (hybrid KEM partner — belt and suspenders)
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
aes-gcm = { version = "0.10", optional = true }             # AES-256-GCM symmetric
hkdf = { version = "0.12", optional = true }                # Key derivation
sha2 = { version = "0.10", optional = true }                # HKDF-SHA256

# Zeroize secrets in memory
zeroize = { version = "1", features = ["derive"] }

[features]
default = ["pq"]
pq = [
    "pqcrypto-mlkem",
    "pqcrypto-mldsa",
    "pqcrypto-traits",
    "x25519-dalek",
    "aes-gcm",
    "hkdf",
    "sha2",
]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "fragment_ops"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
