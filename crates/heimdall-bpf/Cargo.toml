[package]
name = "heimdall-bpf"
version = "0.1.0"
edition = "2021"

# Only programs whose source exists may be declared. A [[bin]] pointing at a
# missing file is not a placeholder — cargo refuses to resolve targets at all,
# so the whole crate fails to build and nothing here can be linted or tested.
[[bin]]
name = "heimdall-vfs-write"
path = "src/vfs_write.rs"

[[bin]]
name = "heimdall-execve"
path = "src/execve.rs"

[[bin]]
name = "heimdall-gjallarhorn-xdp"
path = "src/gjallarhorn_xdp.rs"

[dependencies]
aya-ebpf = "0.1"

# [profile.dev] must exist and must set lto = true.
#
# .cargo/config.toml passes `-C lto=true` in rustflags for the BPF target. When
# a profile leaves lto unset (the default for dev), cargo also passes
# `-C embed-bitcode=no`, and the two are mutually exclusive:
#     error: options `-C embed-bitcode=no` and `-C lto` are incompatible
#     error: could not compile `core`
# That is why a plain `cargo build` / `cargo clippy` failed here while the same
# settings worked under ebpf/ — ebpf/Cargo.toml defines this profile and this
# crate did not. scripts/check-clippy.sh lints in dev, so it needs this.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = true
