[package]
name = "doom-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Doom-over-IPv6 runtime — Aya-based BPF program loader and memory manager"

[dependencies]
aya = "0.13"
aya-log = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.5", features = ["fs"] }
futures-util = "0.3"
goblin = "0.9"
byteorder = "1"
# Epic 1.2.3 (ADR-080): the shared UPC guest-load contract. doom-runner builds a
# Workload and routes ROM_MAP/RV2MBC_MAP population through upc_api::load, the
# same shared path upc-bootctl uses for xv6/ASCEND-LINUX guests.
upc-api = { path = "../upc-api" }
