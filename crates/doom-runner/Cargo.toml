[package]
name = "doom-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Doom-over-IPv6 runtime — Aya-based BPF program loader and memory manager"

[dependencies]
aya = "0.13"
aya-log = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
goblin = "0.9"
byteorder = "1"
