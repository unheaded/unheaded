# =============================================================================
# .golangci.yml — Unheaded Kingdom Critical-Only Lint Strategy
# =============================================================================
# DECISION: S26 Round Table — Critical-only enforcement for Age 1
# RATIONALE: 11K warnings mostly style (varnamelen, mnd, lll). Ship Alpha first.
# OWNER: Developer
# REVIEW: Age 2 will expand to full enforcement with codegen compliance
# =============================================================================

run:
  # Go version matching project target
  go: "1.24"
  # Timeout — generous for 465K LOC codebase
  timeout: 10m
  # Skip generated/vendor
  skip-dirs:
    - vendor
    - third_party
    - ".git"
  skip-files:
    - ".*_generated\\.go$"
    - ".*\\.pb\\.go$"
    - ".*_test\\.go$"  # Remove this line when ready for test linting
  # Concurrency — use all available cores
  concurrency: 0
  # Allow parallel runners
  allow-parallel-runners: true

# =============================================================================
# CRITICAL-ONLY LINTERS (S26 Decision #4)
# These catch REAL bugs, not style preferences
# =============================================================================
linters:
  disable-all: true
  enable:
    # --- TIER 1: BUG CATCHERS (MUST FIX) ---
    - errcheck      # Unchecked errors = silent failures = production outages
    - govet         # Compiler-level suspicious constructs
    - staticcheck   # Advanced static analysis (nil derefs, dead code, etc.)
    - unused        # Dead code = attack surface + confusion

    # --- TIER 2: SAFETY NETS (SHOULD FIX) ---
    - gosec         # Security issues (hardcoded creds, weak crypto, SQL injection)
    - bodyclose     # Unclosed HTTP response bodies = connection leaks
    - exportloopref # Loop variable capture bugs (pre-Go 1.22 patterns)

  # --- EXPLICITLY DISABLED (S26 Decision) ---
  # These generate noise, not signal. Enable in Age 2.
  # - varnamelen   # Variable name length — style preference
  # - mnd          # Magic number detector — too aggressive
  # - lll          # Line length limit — formatting tool's job
  # - revive       # Opinionated style rules — defer to gofmt
  # - err113       # Error wrapping style — address in Age 2
  # - funlen       # Function length — some handlers are legitimately long
  # - cyclop       # Cyclomatic complexity — address in Age 2
  # - gocognit     # Cognitive complexity — address in Age 2
  # - wrapcheck    # Error wrapping — defer to err113 decision

# =============================================================================
# LINTER-SPECIFIC SETTINGS
# =============================================================================
linters-settings:
  errcheck:
    # Check type assertions
    check-type-assertions: true
    # Check blank identifier assignments
    check-blank: false
    # Exclude common intentionally-ignored errors
    exclude-functions:
      - "(*bytes.Buffer).WriteString"
      - "(*bytes.Buffer).Write"
      - "(*strings.Builder).WriteString"
      - "(*strings.Builder).Write"
      - "fmt.Fprint"
      - "fmt.Fprintf"
      - "fmt.Fprintln"

  govet:
    # Enable all analyzers
    enable-all: true
    disable:
      - fieldalignment  # Noisy, handle in Age 2 performance pass

  staticcheck:
    # Use latest checks
    checks:
      - "all"
      - "-ST1000"  # Package comments — handle in Age 2 docs pass
      - "-ST1003"  # Naming conventions — defer to style pass
      - "-ST1016"  # Method receiver names — style preference
      - "-ST1020"  # Comment style — docs pass
      - "-ST1021"  # Comment style — docs pass
      - "-ST1022"  # Comment style — docs pass

  gosec:
    # Exclude rules that conflict with our architecture
    excludes:
      - G104  # Audit errors not checked — covered by errcheck
      - G304  # File path from variable — we validate paths architecturally
    severity: medium
    confidence: medium

  bodyclose:
    # No special config needed — catches all unclosed bodies

# =============================================================================
# ISSUE SETTINGS
# =============================================================================
issues:
  # Show all issues (don't cap)
  max-issues-per-linter: 0
  max-same-issues: 0

  # Don't skip any directories for critical linters
  exclude-use-default: false

  # Exclude patterns for known-safe code
  exclude-rules:
    # Test files get relaxed errcheck
    - path: "_test\\.go"
      linters:
        - errcheck
        - gosec

    # Generated protobuf files
    - path: "\\.pb\\.go"
      linters:
        - all

    # Main packages often have simple error handling
    - path: "cmd/"
      linters:
        - errcheck
      text: "Error return value of .*(Close|Flush|Sync)"

# =============================================================================
# OUTPUT FORMAT
# =============================================================================
output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
  sort-order:
    - linter
    - severity
    - file

# =============================================================================
# SEVERITY MAPPING (for CI integration)
# =============================================================================
severity:
  default-severity: warning
  rules:
    - linters:
        - errcheck
        - govet
      severity: error
    - linters:
        - staticcheck
        - gosec
      severity: error
    - linters:
        - unused
        - bodyclose
      severity: warning
