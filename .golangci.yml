# =============================================================================
# .golangci.yml — Unheaded Kingdom Critical-Only Lint Strategy (v2 schema)
# =============================================================================
# DECISION: S26 Round Table — Critical-only enforcement for Age 1
# RATIONALE: 11K warnings mostly style (varnamelen, mnd, lll). Ship Alpha first.
# OWNER: Developer
# REVIEW: Age 2 will expand to full enforcement with codegen compliance
# MIGRATED: 2026-05-08 — v1 → v2 schema (preserves the S26 policy verbatim).
# =============================================================================

version: "2"

run:
  # Go version matching project target
  go: "1.24"
  # Timeout — generous for 465K LOC codebase
  timeout: 10m
  # Concurrency — use all available cores
  concurrency: 0
  # Allow parallel runners
  allow-parallel-runners: true

# =============================================================================
# CRITICAL-ONLY LINTERS (S26 Decision #4)
# These catch REAL bugs, not style preferences
# =============================================================================
linters:
  default: none
  enable:
    # --- TIER 1: BUG CATCHERS (MUST FIX) ---
    - errcheck      # Unchecked errors = silent failures = production outages
    - govet         # Compiler-level suspicious constructs
    - staticcheck   # Advanced static analysis (nil derefs, dead code, etc.)
    - unused        # Dead code = attack surface + confusion

    # --- TIER 2: SAFETY NETS (SHOULD FIX) ---
    - gosec         # Security issues (hardcoded creds, weak crypto, SQL injection)
    - bodyclose     # Unclosed HTTP response bodies = connection leaks
    # Note: exportloopref was retired in golangci-lint v2 (Go 1.22+ closed the
    # loop-variable-capture footgun at the language level; the linter is no
    # longer needed).

  # --- LINTER-SPECIFIC SETTINGS ---
  settings:
    errcheck:
      # Check type assertions
      check-type-assertions: true
      # Check blank identifier assignments
      check-blank: false
      # Exclude common intentionally-ignored errors
      exclude-functions:
        - "(*bytes.Buffer).WriteString"
        - "(*bytes.Buffer).Write"
        - "(*strings.Builder).WriteString"
        - "(*strings.Builder).Write"
        - "fmt.Fprint"
        - "fmt.Fprintf"
        - "fmt.Fprintln"
        # Idiomatic resource cleanup — error from Close() is rarely actionable,
        # commonly used as `defer rows.Close()` without check.
        - "(*database/sql.Rows).Close"
        - "(*database/sql.Stmt).Close"
        - "(*database/sql.DB).Close"
        - "(io.Closer).Close"
        # JSON encode to an HTTP response writer — error means client disconnected
        # mid-write; headers already flushed, no recovery path.
        - "(*encoding/json.Encoder).Encode"

    govet:
      # Enable all analyzers
      enable-all: true
      disable:
        - fieldalignment  # Noisy, handle in Age 2 performance pass
        - shadow          # Flags the idiomatic `if err := f(); err != nil`
                          # pattern — too noisy for the kingdom's err-scoped
                          # convention. Re-enable in Age 2 if Developer
                          # decides to standardize on outer-err-only style.

    staticcheck:
      # Use latest checks
      checks:
        - "all"
        - "-ST1000"  # Package comments — handle in Age 2 docs pass
        - "-ST1003"  # Naming conventions — defer to style pass
        - "-ST1016"  # Method receiver names — style preference
        - "-ST1020"  # Comment style — docs pass
        - "-ST1021"  # Comment style — docs pass
        - "-ST1022"  # Comment style — docs pass

    gosec:
      # Exclude rules that conflict with our architecture
      excludes:
        - G104  # Audit errors not checked — covered by errcheck
        - G304  # File path from variable — we validate paths architecturally
        - G117  # Exported struct field named "Password" matches secret pattern
                # — false positive on Config.Password type fields
                # (legitimate naming for credentials struct in
                # pkg/database/config.go and similar).
        - G115  # Integer overflow conversion (int -> uint32, etc.) —
                # heuristic produces ~410 false positives on protocol-field
                # marshalling, ELF/CPIO header writes, and len()→uint
                # idioms. Real overflow risks are caught by govet `unusedwrite`
                # and bounds checks at protocol boundaries. Re-enable in Age 4
                # if/when we add per-conversion `//nosec G115 -- justification`
                # comments at the protocol marshal sites.
        - G404  # Weak random number generator — math/rand is intentionally
                # used for load-balancer algorithms (round-robin jitter) and
                # service-discovery TTL randomization, where crypto/rand would
                # be both slow and unnecessary. Real crypto paths use
                # crypto/rand directly (verified by code review).
      severity: medium
      confidence: medium

  # --- EXCLUSION RULES ---
  exclusions:
    generated: lax
    # Exclude patterns for known-safe code (v2 schema: under linters.exclusions.rules)
    rules:
      # Test files get relaxed errcheck + gosec
      - path: _test\.go
        linters:
          - errcheck
          - gosec

      # Generated protobuf files
      - path: \.pb\.go
        linters:
          - errcheck
          - govet
          - staticcheck
          - unused
          - gosec
          - bodyclose

      # Main packages often have simple error handling
      - path: cmd/
        linters:
          - errcheck
        text: "Error return value of .*(Close|Flush|Sync)"

# =============================================================================
# ISSUE SETTINGS
# =============================================================================
issues:
  # Show all issues (don't cap)
  max-issues-per-linter: 0
  max-same-issues: 0

  # Don't skip any directories for critical linters
  # (v2 schema: exclude-dirs / exclude-files moved here from run.skip-*)
  uniq-by-line: false

# =============================================================================
# OUTPUT FORMAT (v2 schema: map keyed by format name)
# =============================================================================
output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
      colors: true
  sort-order:
    - linter
    - severity
    - file

# =============================================================================
# SEVERITY MAPPING (for CI integration)
# =============================================================================
severity:
  default: warning
  rules:
    - linters:
        - errcheck
        - govet
      severity: error
    - linters:
        - staticcheck
        - gosec
      severity: error
    - linters:
        - unused
        - bodyclose
      severity: warning
