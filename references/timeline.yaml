    description: '**The Meta Moment had never worked in compose (2026-09-21).** Five independent defects: no `references/` mount for timeguru; timeguru''s Wotan display name not on the auto-approve list so every publish failed; `WOTAN_GRPC_ADDR` unset on seven services (defaults to `localhost:18001`, no HTTP fallback); kanban''s message streams started on a 10 s init context that `main` cancelled on return — **kanban had never received a Wotan message**; and the `timeline.updates` notification carries no content while nothing fetched. All fixed with tests provoked to red. Proven live: edit `timeline.md` → board updates, no restarts.'
