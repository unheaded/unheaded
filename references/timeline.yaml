  - id: phase-3-item-190fbe93
    name: CI green sweep + run-as identity audit
    status: completed
    progress: 100
    description: '**CI green sweep + run-as identity audit (2026-07-29).** Four red workflows on `main` @ `0f443de` diagnosed and fixed on WEST. **govulncheck:** 7 vulns cleared — grpc 1.79.3→1.82.1, x/text 0.36→0.39, x/crypto 0.50→0.52, goldmark 1.7.16→1.7.17, plus `toolchain go1.25.10→go1.25.12` to pin the 3 stdlib advisories (GO-2026-5856 / GO-2026-5039 / GO-2026-5037) to a deterministic floor; now reports 0 affecting our code. **GPL Boundary:** the section-3 deep scan was flagging our OWN crates as contamination (project is GPL-3.0 by choice) and misreading dual licenses with a permissive branch (`r-efi` = `Apache-2.0 OR LGPL-2.1-or-later OR MIT`); rewritten with a first-party skip list + an SPDX expression classifier (AGPL fails, LGPL-only warns, GPL informs), backed by 14 negative tests in `scripts/test-gpl-boundary-classifier.sh` so the gate can''t be "fixed" by making it always pass. **gosec:** root cause was NOT the 1186-finding unfiltered invocation alone — every existing annotation used `//nolint:gosec // G703: …`, which gosec ignores, because it only honors a comment *leading* with `#nosec`. All ~20 sites converted to `// #nosec Gxxx -- rationale`; workflow now runs `-severity high -confidence high` per `docs/security/gosec-sweep-2026-05-08.md`. Gate goes from 1186 → **0**. **SBOM:** `cmd/akira/akira`, an 18 MB ELF committed since May, was injecting its frozen build-info (grpc v1.65.0, stdlib go1.24.0) into every syft scan — untracked + gitignored; quinn-proto 0.11.14→0.11.15 in both Cargo workspaces. SARIF uploads made `continue-on-error` (GHAS 403 on a private repo was reddening otherwise-clean jobs).'
  - id: phase-3-item-8e22cdf9
    name: Per-service run-as identity baseline
    status: completed
    progress: 100
    description: '**Per-service run-as identity baseline (2026-07-29, ADR pending).** The whole telemetry tier — grafana, prometheus, loki, victoriametrics, node-exporter — shared UID **65534 (nobody)**, and promtail set no `runAsUser` at all while hostPath-mounting `/var/log/pods` and `/var/lib/docker/containers` (i.e. root with every container''s logs). A shared account means compromise of any one workload can rewrite all the others'' on-disk state and makes file ownership useless for audit. New `pkg/uids` is the single source of truth (mirroring `pkg/ports`), reserving 16600-16799 with 16700-16719 for telemetry; `Validate()` rejects root, out-of-range, and — the regression that matters — any UID shared between services. `TestManifestsMatchRegistry` parses the applied YAML so the registry can''t drift from reality. Also removed a blanket `lxc.cgroup2.devices.allow = a` from `lxd/profiles/unheaded-ebpf.yaml`; that profile''s remaining cap_sys_admin + `raw.idmap "both 0 0"` + unconfined AppArmor + empty seccomp are documented as host-root-equivalent and gated on a WEST boot test before tightening.'
  - id: phase-3-item-25e38793
    name: Security remediation program + staging promotion ladder
