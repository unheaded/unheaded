    description: '**The recurring defect, named and gated (2026-09-09).** Six consecutive batches each shipped a check that passed while structurally unable to fail (unreachable ratchet guards, a count compared to itself, a test matching filenames that do not exist, a gate blind to workspaces that did not build, a build exit code computed and never read, a guard test whose assertion no case could reach). `scripts/check-gates-can-fail.sh` now plants a violation in every gate a workflow, Jenkinsfile, runbook or smoke script invokes and requires it to go red; an unclassified gate fails the build. Nine gates proven.'
