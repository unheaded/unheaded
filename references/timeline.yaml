    description: '**dashboard-backend OOM, two causes (2026-09-21).** (1) `go listener(event)` per event on the `ebpf.*` firehose plus a console warn per dropped broadcast on a 0.5-CPU container: goroutine id past 8 million at three minutes. (2) The metrics scraper preallocated `MaxSamples` (72 KB) per series before the first sample; ~3,000 series from Grafana + VictoriaMetrics pinned ~380 MB at t+5s. Fixed; live heap 400 MB → 26 MB; `GOMEMLIMIT` set; env-gated loopback pprof added so the next diagnosis does not need a SIGQUIT.'
