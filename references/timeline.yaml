    description: '**The Well: kanban schema and pointer (2026-09-21).** `kanban-app` pointed at the maintenance database, where the ADR-091 initdb bug had also misfiled `kanban_tasks` — the board worked because two errors cancelled. `003_app_schema.sql` defined a `kanban_tasks` nothing had ever executed against (BIGSERIAL id, priority/tags) while the code writes TEXT ids with type/owner/progress. Migration rewritten to mirror `EnsureSchema`, proven on a clean volume both ways; 73 live tasks reconciled into `unheaded_app`; `well-reconcile-kanban.sh` refuses to merge two boards.'
