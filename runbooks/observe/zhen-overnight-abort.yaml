apiVersion: runbook/v1
kind: Runbook
metadata:
  name: zhen-overnight-abort
  description: Stop Zhen's unattended overnight worker, softly (after the card in flight) or now
  owner: zhenai
  estimated_duration: 5m
  risk: low
  requires_sudo: false
  status: draft
  authored_by: claude
  reviewed_by: ""
  approved_by: ""
  dry_run_test: tests/runbooks/test_zhen_overnight_abort.py

notes: |
  S-CHAMPION-HARDENING Phase 13 (ADR-106 Q2). The operator's user unit
  deploy/systemd/user/zhen-agentd-overnight.service (S-TWO-BRAINS) runs
  `zhen-agentd -worker -overnight` from its timer at 01:00 inside -window
  01:00-07:00: Kanban cards into local zhen/<card> branches, never pushed,
  with its own spend ledger and cap and a memory floor. It runs as the
  operator, so it shares the GPU lease with switch-model.sh.

  Two ways to stop it. The stop file is soft: the card in flight finishes its
  check and commits nothing, then the night ends and the morning report is
  written. Stopping the unit is immediate: a branch may be left half-worked
  (it is a local zhen/* branch; nothing is pushed or merged). Use the stop
  file first; stop the unit if the night must end now (spend, memory, a card
  doing something unexpected).

parameters:
  - name: STATE_DIR
    default: "${HOME}/.local/state/unheaded"
    description: zhen-agentd's state dir (XDG_STATE_HOME/unheaded); the stop file and zhen-reports/ live here

steps:
  - name: is-it-running
    action: shell
    command: |
      set -euo pipefail
      systemctl --user is-active zhen-agentd-overnight.service || true
      systemctl --user list-timers zhen-agentd-overnight.timer --no-pager | head -3
    description: "Is a night running now, and when is the next one"

  - name: soft-stop
    action: manual
    command: "touch ${STATE_DIR}/zhen-agentd.stop"
    description: "Ask the worker to stop after the card in flight (it checks the file between cards and before committing)"

  - name: hard-stop
    action: manual
    irreversible: true
    command: "systemctl --user stop zhen-agentd-overnight.service"
    description: "Only if the night must end now: stops the worker mid-card (local zhen/* branch may be half-worked; nothing is pushed)"

  - name: no-more-nights
    action: manual
    command: "systemctl --user disable --now zhen-agentd-overnight.timer"
    description: "Keep tonight's stop from being undone by tomorrow's timer, until the cause is understood"

  - name: read-the-report
    action: shell
    command: "scripts/zhen-morning-report.sh --dir ${STATE_DIR}/zhen-reports"
    description: "What the night did: runs, spend, cards, branches to review"

verification:
  - name: worker-stopped
    command: |
      set -euo pipefail
      ! systemctl --user is-active --quiet zhen-agentd-overnight.service
    description: "The overnight unit is not running"

rollback:
  - name: re-enable-nights
    action: manual
    command: "rm -f ${STATE_DIR}/zhen-agentd.stop && systemctl --user enable zhen-agentd-overnight.timer"
    description: "Remove the stop file (or the next night stops at once) and re-enable the timer"
