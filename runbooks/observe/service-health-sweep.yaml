apiVersion: runbook/v1
kind: Runbook
metadata:
  name: service-health-sweep
  description: Health check the HTTP services this host runs (targets file) and report status
  owner: micromanager
  estimated_duration: 2m
  risk: low
  requires_sudo: false

steps:
  - name: sweep-all-services
    action: shell
    command: |
      echo "=============================================="
      echo "KINGDOM SERVICE HEALTH SWEEP — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "=============================================="
      HEALTHY=0
      UNHEALTHY=0
      TOTAL=0

      # What this host runs comes from a file, one "name port scheme" per
      # line (configs/health-sweep-<host>.targets, installed as
      # /etc/unheaded/health-sweep.targets). First-party listeners are TLS
      # under UNHEADED_TLS_ENABLED, so the scheme is per target and https
      # is verified against the deployment CA. No module is listed here:
      # a module's health is its own alert (ADR-149).
      TARGETS="${SWEEP_TARGETS_FILE:-/etc/unheaded/health-sweep.targets}"
      CA="${UNHEADED_TLS_CA_CERT:-/etc/unheaded/tls/ca.pem}"
      [ -r "$TARGETS" ] || { echo "no targets file: $TARGETS"; exit 1; }
      while read -r NAME PORT SCHEME _; do
        case "$NAME" in ''|'#'*) continue ;; esac
        TOTAL=$((TOTAL + 1))
        case "$SCHEME" in
          http|https) ;;
          *) echo "  [FAIL] $NAME: scheme '$SCHEME' is not http or https"; UNHEALTHY=$((UNHEALTHY + 1)); continue ;;
        esac
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 --cacert "$CA" "$SCHEME://localhost:$PORT/health" 2>/dev/null)
        if [ "$STATUS" = "200" ]; then
          echo "  [OK]   $NAME (:$PORT)"
          HEALTHY=$((HEALTHY + 1))
        else
          echo "  [FAIL] $NAME (:$PORT): HTTP $STATUS"
          UNHEALTHY=$((UNHEALTHY + 1))
        fi
      done < "$TARGETS"

      echo ""
      echo "=============================================="
      echo "RESULT: $HEALTHY/$TOTAL healthy, $UNHEALTHY unhealthy"
      echo "=============================================="
      [ "$UNHEALTHY" -eq 0 ]

  - name: check-system-resources
    action: shell
    command: |
      echo "=== Memory ==="
      free -h | head -3
      echo "=== Disk ==="
      df -h / /var /tmp 2>/dev/null | grep -v tmpfs
      echo "=== Load ==="
      uptime
      echo "=== GPU ==="
      rocm-smi 2>/dev/null | grep -E "Device|0       1" || echo "No GPU data"
