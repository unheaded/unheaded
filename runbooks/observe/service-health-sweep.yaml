apiVersion: runbook/v1
kind: Runbook
metadata:
  name: service-health-sweep
  description: Health check every Kingdom HTTP service and report status
  owner: micromanager
  estimated_duration: 2m
  risk: low
  requires_sudo: false

steps:
  - name: sweep-all-services
    action: shell
    command: |
      echo "=============================================="
      echo "KINGDOM SERVICE HEALTH SWEEP — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "=============================================="
      HEALTHY=0
      UNHEALTHY=0
      TOTAL=0

      # HTTP /health ports from pkg/ports/ports.go. gRPC ports (17001,
      # 18001) and TLS ports cannot answer a plain-HTTP /health and are not
      # listed. trace-collector-go --unified serves /health on 16671.
      SERVICES="
        trace-collector:16671
        unheaded-daemon:17000
        protocol-api:17100
        wotan:18000
        timeguru:19000
        architect:19001
        captain:19002
        micromanager:19003
        monad:19004
        sophia:19005
        cuirass:19006
        akira:19100
        kev-poller:19120
        dashboard-backend:20000
        kanban-app:20001
        zhen-inference:20100
        zhen-web-ui:20103
        gateway-http:21000
      "

      for entry in $SERVICES; do
        NAME=$(echo $entry | cut -d: -f1)
        PORT=$(echo $entry | cut -d: -f2)
        TOTAL=$((TOTAL + 1))
        STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 2 http://localhost:$PORT/health 2>/dev/null)
        if [ "$STATUS" = "200" ]; then
          LATENCY=$(curl -sf -o /dev/null -w "%{time_total}" --max-time 2 http://localhost:$PORT/health 2>/dev/null)
          echo "  [OK]   $NAME (:$PORT) — ${LATENCY}s"
          HEALTHY=$((HEALTHY + 1))
        else
          echo "  [FAIL] $NAME (:$PORT) — HTTP $STATUS"
          UNHEALTHY=$((UNHEALTHY + 1))
        fi
      done

      echo ""
      echo "=============================================="
      echo "RESULT: $HEALTHY/$TOTAL healthy, $UNHEALTHY unhealthy"
      echo "=============================================="

  - name: check-system-resources
    action: shell
    command: |
      echo "=== Memory ==="
      free -h | head -3
      echo "=== Disk ==="
      df -h / /var /tmp 2>/dev/null | grep -v tmpfs
      echo "=== Load ==="
      uptime
      echo "=== GPU ==="
      rocm-smi 2>/dev/null | grep -E "Device|0       1" || echo "No GPU data"
