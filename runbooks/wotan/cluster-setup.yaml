apiVersion: runbook/v1
kind: Runbook
metadata:
  name: wotan-cluster-setup
  description: Set up Wotan active-passive cluster between WEST (primary) and EAST (standby)
  owner: architect
  estimated_duration: 15m
  risk: high
  requires_sudo: true

notes: |
  Configures Wotan for active-passive replication (ADR-035).
  WEST is always the configured primary. EAST is standby.
  Persistence and replication are the local WAL store only (--store-type=wal,
  under the unit's StateDirectory); Wotan has no PostgreSQL store since
  2026-11-09 (ADR-035 amendment). Memory stays Wotan's default; a wal store
  that cannot open stops startup.
  Requires mTLS certs (run generate-kingdom-certs first).
  The wotan binary refuses to start with --cluster-mode=cluster until the
  cluster wiring lands (services/wotan/cmd/wotan/main.go).

steps:
  - name: verify-prerequisites
    action: shell
    command: |
      echo "=== WEST ==="
      curl -sf http://localhost:18000/health && echo "Wotan: OK" || echo "Wotan: DOWN"
      echo ""
      echo "=== EAST ==="
      ssh govan@east 'curl -sf http://localhost:18000/health && echo "Wotan: OK" || echo "Wotan: DOWN"'
    verify: "curl -sf http://localhost:18000/health"

  - name: start-west-primary
    action: shell
    command: |
      sudo systemctl stop unheaded-wotan 2>/dev/null
      sudo tee /etc/systemd/system/unheaded-wotan.service << 'EOF'
      [Unit]
      Description=Wotan Message Bus (Primary)
      After=network.target

      [Service]
      Type=simple
      User=unheaded-wotan
      Group=unheaded-wotan
      StateDirectory=unheaded/wotan
      StateDirectoryMode=0700
      ExecStart=/opt/unheaded/bin/wotan \
        --cluster-mode=cluster \
        --cluster-role=primary \
        --cluster-node-id=west \
        --cluster-peer=east:18002 \
        --store-type=wal \
        --store-data-dir=/var/lib/unheaded/wotan/wal
      Restart=always
      RestartSec=5
      WorkingDirectory=/var/lib/unheaded/wotan

      [Install]
      WantedBy=multi-user.target
      EOF
      sudo systemctl daemon-reload
      sudo systemctl start unheaded-wotan
    verify: "curl -sf http://localhost:18000/health"

  - name: start-east-standby
    action: shell
    command: |
      ssh govan@east "sudo tee /etc/systemd/system/unheaded-wotan.service << 'SVCEOF'
      [Unit]
      Description=Wotan Message Bus (Standby)
      After=network.target

      [Service]
      Type=simple
      User=unheaded-wotan
      Group=unheaded-wotan
      StateDirectory=unheaded/wotan
      StateDirectoryMode=0700
      ExecStart=/opt/unheaded/bin/wotan \
        --cluster-mode=cluster \
        --cluster-role=standby \
        --cluster-node-id=east \
        --cluster-peer=west:18002 \
        --store-type=wal \
        --store-data-dir=/var/lib/unheaded/wotan/wal
      Restart=always
      RestartSec=5
      WorkingDirectory=/var/lib/unheaded/wotan

      [Install]
      WantedBy=multi-user.target
      SVCEOF
      sudo systemctl daemon-reload && sudo systemctl restart unheaded-wotan"
    verify: "ssh govan@east 'curl -sf http://localhost:18000/health'"

  - name: verify-replication
    action: shell
    command: |
      echo "Publishing test message to WEST..."
      curl -sf -X POST http://localhost:18000/api/v1/topics/test.replication/publish \
        -H "Content-Type: application/json" \
        -d '{"sender_id":"test","payload":"replication-test"}'
      sleep 2
      echo "Checking EAST received it..."
      ssh govan@east 'curl -sf http://localhost:18000/api/v1/topics/test.replication/messages'
