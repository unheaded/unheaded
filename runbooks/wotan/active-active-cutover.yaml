apiVersion: runbook/v1
kind: Runbook
metadata:
  name: wotan-active-active-cutover
  description: Drain traffic from WEST+EAST bare-metal active-passive Wotan to a 3-node K8s active-active cluster
  owner: warmonger
  estimated_duration: 30m
  risk: high
  requires_sudo: true
  status: stub
  related_adr: docs/adr/ADR-064-wotan-active-active-cluster-k8s-native.md
  supersedes_runbooks: [cluster-failover.yaml, cluster-setup.yaml]
  cs_sources: [wotan/cluster, infra/k8s]

notes: |
  STUB — ADR-064 Phase 4 cutover runbook. Steps below are scaffolding; each
  one needs concrete commands once Phase 1-3 land (StatefulSet, Raft
  membership, quorum-acked publish). Do NOT run this runbook before all
  three of those phases are merged + green.

  Strategy: rolling cutover with explicit rollback. Bare-metal WEST+EAST
  keep accepting traffic until the K8s cluster has a quorum and a Raft
  leader. Then DNS / load-balancer entries are flipped, K8s drains the
  traffic, WEST+EAST go read-only, and finally decommission. Rollback at
  any point: re-enable WEST+EAST DNS records, drain K8s.

  No data loss in this migration — historical messages stay in WEST+EAST's
  WAL/PG until Phase 5 decommission. The K8s cluster picks up new traffic
  from the cutover instant forward.

