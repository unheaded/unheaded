apiVersion: runbook/v1
kind: Runbook
metadata:
  name: git-history-secret-purge
  description: Remove secrets from git history and tags
  owner: blackmage
  estimated_duration: 2h
  risk: critical
  requires_sudo: false
  status: draft
  authored_by: claude
  reviewed_by: claude-opus-5-5
  approved_by: ""
  dry_run_test: tests/runbooks/test_git_history_purge.py
notes: |
  This runbook is for removing secrets from git history and tags. It involves rotating or revoking the leaked credential, rewriting the git history, and pushing the changes. git-filter-repo is installed into the Zhen venv by a step below; gitleaks is used at ~/.local/bin/gitleaks, always with --redact. Rotation, not the rewrite, makes a leaked secret safe.
parameters:
  - name: ORIGIN
    description: The origin URL of the git repository (no default)
  - name: PATTERNS
    description: Patterns file (one literal secret per line), outside the repo (no default)
  - name: MIRROR
    default: "$HOME/purge/repo.git"
    description: The path to the mirror clone of the git repository
  - name: REPLACEMENTS
    default: "$HOME/purge/replacements.txt"
    description: The path to the replacements file containing the secrets to be removed
  - name: BRANCH
    default: "develop"
    description: The branch to be rewritten
preconditions:
  - check: ": \"${ORIGIN:?set ORIGIN}\""
    description: ORIGIN must be set
steps:
  - name: rotate-credential
    action: manual
    irreversible: true
    command: |
      Rotate or revoke the leaked credential at its issuer.
    description: "MANUAL. Rotate or revoke the leaked credential at its issuer."

  - name: verify-credential-revoked
    action: manual
    command: |
      Confirm at the issuer that the old credential is rejected.
    description: "MANUAL. Verify the old credential no longer works."

  - name: clone-mirror
    action: shell
    command: |
      set -euo pipefail
      : "${ORIGIN:?set ORIGIN}"
      mkdir -p "$(dirname "$MIRROR")"
      test ! -e "$MIRROR"
      git clone --mirror "$ORIGIN" "$MIRROR"
    verify: "test -d \"$MIRROR\""
    description: Clone the repository as a fresh mirror

  - name: record-tips
    action: shell
    command: |
      set -euo pipefail
      git -C "$MIRROR" for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags > "$MIRROR.tips"
    verify: "test -s \"$MIRROR.tips\""
    description: Record the current remote tips

  - name: scan-before
    action: shell
    command: |
      set -euo pipefail
      # Every occurrence over all refs and tags, redacted. Findings expected
      # here (exit 1): they are what the replacements file must cover.
      ~/.local/bin/gitleaks git --redact --no-banner --log-opts="--all" "$MIRROR" || echo "gitleaks: findings above (expected before the rewrite)"
    description: Find every occurrence with gitleaks over all refs (redacted)

  - name: install-git-filter-repo
    action: shell
    command: |
      set -euo pipefail
      test -x ~/.venv/zhen/bin/git-filter-repo || ~/.venv/zhen/bin/pip install git-filter-repo
      test -x ~/.venv/zhen/bin/git-filter-repo
    verify: "test -x ~/.venv/zhen/bin/git-filter-repo"
    description: Install git-filter-repo into the Zhen venv

  - name: check-replacements-file
    action: shell
    command: |
      set -euo pipefail
      for f in "$REPLACEMENTS" "${PATTERNS:?set PATTERNS}"; do
        test -f "$f"
        if git -C "$(dirname "$f")" rev-parse --git-dir >/dev/null 2>&1; then
          echo "$f is inside a git repository: move it out" >&2
          exit 1
        fi
        test "$(stat -c %a "$f")" = 600
      done
    description: The replacements and patterns files exist outside any repo with mode 0600

  - name: rewrite-history
    action: shell
    command: |
      set -euo pipefail
      : "${ORIGIN:?set ORIGIN}"
      export PATH="$HOME/.venv/zhen/bin:$PATH"   # git finds git-filter-repo on PATH
      git -C "$MIRROR" filter-repo --replace-text "$REPLACEMENTS"
      git -C "$MIRROR" remote add origin "$ORIGIN"
      git -C "$MIRROR" remote get-url origin
    verify: "git -C \"$MIRROR\" remote get-url origin"
    description: Rewrite the git history to remove secrets and re-add the origin remote

  - name: verify-rewrite
    action: shell
    command: |
      set -euo pipefail
      count=$(git -C "$MIRROR" log --all -p | grep -c -F -f "${PATTERNS:?set PATTERNS}" || true)
      test "$count" -eq 0
    description: Verify that no secret pattern remains in any ref or tag

  - name: check-gitleaks
    action: shell
    command: |
      set -euo pipefail
      # exit 0 = no findings; exit 1 = findings remain
      ~/.local/bin/gitleaks git --redact --no-banner --log-opts="--all" "$MIRROR"
    description: gitleaks finds 0 over all refs and tags

  - name: check-secrets-baseline
    action: shell
    command: |
      set -euo pipefail
      # .gitleaksignore may only shrink; never baseline the leaked secret
      scripts/check-secrets-baseline.sh
    description: The gitleaks baseline did not grow (leaked secret not baselined)

  - name: cleanup-mirror
    action: manual
    irreversible: true
    command: |
      Delete refs/original and any refs/backup/* in the mirror.
      Run git reflog expire --expire=now --all && git gc --prune=now --aggressive in the mirror.
    description: "MANUAL. Cleanup the mirror after verification."

  - name: push-changes
    action: manual
    irreversible: true
    command: |
      For each branch, run git -C "$MIRROR" push --force-with-lease="$BRANCH:<old sha>" origin "$BRANCH" with the old sha from the tips file.
      For each tag: git -C "$MIRROR" push --force-with-lease=refs/tags/<tag>:<old sha> origin refs/tags/<tag>  (old sha from "$MIRROR.tips").
      A refused push means the remote moved; stop and investigate.
    description: "MANUAL. Stevie only. Push the changes to the origin repository."

  - name: purge-github
    action: manual
    irreversible: true
    command: |
      Ask GitHub Support to purge cached views of the old commits.
    description: "MANUAL. Stevie. Ask GitHub Support to purge cached views of the old commits."

  - name: reclone-clones
    action: manual
    irreversible: true
    command: |
      Reclone every clone of the repository, including the wiki mirror.
    description: "MANUAL. Reclone every clone of the repository, including the wiki mirror."

  - name: check-reclones
    action: manual
    command: |
      List every clone (including the wiki mirror); in each, confirm the branch and tag tips match the rewritten mirror, not "$MIRROR.tips".
    description: "MANUAL. Confirm every clone was re-cloned and has the new tips."

  - name: purge-east
    action: manual
    irreversible: true
    command: |
      Purge the old history from east's git mirror.
    description: "MANUAL. Purge the old history from east's git mirror."

  - name: shred-replacements-file
    action: manual
    irreversible: true
    command: |
      shred -u "$REPLACEMENTS"
      shred -u "$PATTERNS"
    description: "MANUAL. Shred the replacements and patterns files."
rollback:
  - name: delete-mirror
    action: manual
    irreversible: true
    command: |
      Before the push nothing changed except the mirror: delete the mirror directory "$MIRROR" and "$MIRROR.tips".
      After the push the old history is gone from GitHub; the old tips are in "$MIRROR.tips" and in east's git mirror (which is also why east must be purged).
    description: "MANUAL. Delete the mirror (pre-push); post-push see the note."
