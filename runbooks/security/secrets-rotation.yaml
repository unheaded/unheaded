apiVersion: runbook/v1
kind: Runbook
metadata:
  name: secrets-rotation
  description: Rotate API keys, database passwords, and service tokens
  owner: blackmage
  estimated_duration: 20m
  risk: high
  requires_sudo: true
  cs_sources: [security/vault]

notes: |
  Secrets are never stored in code, env vars visible to ps, or logs.
  Rotation order: generate new → update consumers → verify → revoke old.

steps:
  - name: rotate-well-role-password
    action: shell
    command: |
      echo "1. Put a new value (openssl rand -base64 32) for the role's variable in"
      echo "   ~/tmp/unheaded/.env (0600, gitignored): APP_KANBAN_PASSWORD, OPS_WRITER_PASSWORD, ..."
      echo "   or POSTGRES_PASSWORD for the superuser."
      echo "2. cd ~/tmp/unheaded && (set -a; . ./.env; set +a; scripts/well/set-role-passwords.sh)"
      echo "   (values reach psql through the environment, never SQL text or a command line)"
      echo "3. Recreate the consumers: sudo docker compose up -d <service>; Huginn: PGPASSWORD in"
      echo "   /etc/huginn.env, then systemctl restart huginn."
    description: "MANUAL: one role at a time; verify each consumer reconnects"

  - name: generate-new-api-key
    action: shell
    command: |
      NEW_KEY=$(openssl rand -hex 32)
      echo "New API key: $NEW_KEY"
      echo "$NEW_KEY" > /tmp/new_api_key
      chmod 600 /tmp/new_api_key

  - name: rotate-jwt-signing-key
    action: shell
    command: |
      openssl ecparam -genkey -name prime256v1 -noout -out /tmp/jwt_signing_key.pem
      openssl ec -in /tmp/jwt_signing_key.pem -pubout -out /tmp/jwt_signing_key.pub
      chmod 600 /tmp/jwt_signing_key.pem
    description: "Generate new EC P-256 key pair for JWT signing"

  - name: restart-services
    action: shell
    command: |
      sudo docker compose -f ~/tmp/unheaded/docker-compose.yml restart kanban-app dashboard-backend
    description: "Restart services to pick up new credentials"

  - name: verify-services-healthy
    action: shell
    command: |
      sleep 10
      for port in 16668 20000; do
        curl -sf http://localhost:$port/health && echo " Port $port: OK" || echo " Port $port: FAIL"
      done

  - name: cleanup-temp-secrets
    action: shell
    command: "shred -u /tmp/new_pw /tmp/new_api_key 2>/dev/null; echo 'Temp secrets destroyed'"
    description: "Securely delete temporary secret files"

  - name: log-rotation-event
    action: shell
    command: "echo \"$(date -u +%Y-%m-%dT%H:%M:%SZ) SECRET_ROTATION db_password api_key jwt_key\" >> /var/log/unheaded-audit.log"
    description: "Audit log entry for rotation event"
