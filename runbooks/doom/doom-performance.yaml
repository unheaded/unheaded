apiVersion: runbook/v1
kind: Runbook
metadata:
  name: doom-performance
  description: Measure DOOM rendering FPS and CPU throughput
  owner: computermancer
  estimated_duration: 5m
  risk: low
  requires_sudo: true

env:
  MAP: "/sys/fs/bpf/unheaded/doom-ring/maps"
  PROJECT_ROOT: "~/tmp/unheaded"

preconditions:
  - check: "test -d ${MAP}"
    description: "Doom ring must be set up"

steps:
  # `doom-loader cpu` has no --status flag (it exits 2 on it) and, without
  # one, it RESETS the CPU. The read-only reader is cmd/doom-cpu-dump.
  - name: build-cpu-dump
    action: shell
    command: "cd ${PROJECT_ROOT} && go build -o bin/doom-cpu-dump ./cmd/doom-cpu-dump/"
    verify: "test -x ${PROJECT_ROOT}/bin/doom-cpu-dump"

  - name: check-cpu-state
    action: shell
    command: |
      sudo ${PROJECT_ROOT}/bin/doom-cpu-dump dump --instance DE --map ${MAP}/CPU_MAP 2>/dev/null

  - name: measure-throughput
    action: shell
    command: |
      echo "Measuring MBC instructions/sec over 5 seconds..."
      COUNT1=$(sudo ${PROJECT_ROOT}/bin/doom-cpu-dump dump --instance DE --map ${MAP}/CPU_MAP 2>/dev/null | awk '/Instruction Count:/{print $3}')
      sleep 5
      COUNT2=$(sudo ${PROJECT_ROOT}/bin/doom-cpu-dump dump --instance DE --map ${MAP}/CPU_MAP 2>/dev/null | awk '/Instruction Count:/{print $3}')
      RATE=$(( (COUNT2 - COUNT1) / 5 ))
      FPS=$(( RATE / 4000000 ))
      echo "  Instructions/sec: $RATE"
      echo "  Estimated FPS: $FPS (assumes ~4M insns/frame)"
      echo "  Target: 35 FPS = 140M insns/sec"

  - name: check-bridge
    action: shell
    command: |
      PID=$(pgrep -f doom-bridge)
      if [ -n "$PID" ]; then
        echo "Bridge running (PID $PID)"
        curl -sf http://localhost:16666/ -o /dev/null -w "HTTP %{http_code}, latency %{time_total}s\n"
      else
        echo "Bridge NOT running"
      fi

  - name: check-screen-map
    action: shell
    command: |
      NONZERO=$(sudo bpftool map dump name SCREEN_MAP 2>/dev/null | grep -c "value:" || echo "0")
      echo "SCREEN_MAP entries with data: $NONZERO (expect ~64000 for 320x200)"
