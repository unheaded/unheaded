apiVersion: runbook/v1
kind: Runbook
metadata:
  name: postgresql-backup-restore
  description: The Well (PostgreSQL) backup, restore drill, and restore
  owner: micromanager
  estimated_duration: 15m
  risk: medium
  requires_sudo: true
  cs_sources: [databases/postgresql]

notes: |
  Backups are systemd units on west, not ad-hoc dumps (ADR-016, RPO 24 h):
  unheaded-well-backup.timer (nightly, Persistent=) runs scripts/db-backup.sh
  as the read-only role well_backup into /srv/backups/unheaded-well (NVMe;
  the data volume is on sdb, and WELL_BACKUP_OTHER_DISK=1 refuses a shared
  disk). The newest 14 sets are kept there and 14 on east
  (/var/backups/unheaded-well-west/sets). Sets carry no password hashes.
  Every automated step below is safe to run unattended; restoring is manual.
  Locations and schedule: wiki/Well-Backups.md.

env:
  SETS: "/srv/backups/unheaded-well"

steps:
  - name: backup
    action: shell
    command: "sudo systemctl start unheaded-well-backup.service"
    verify: "systemctl show -p Result --value unheaded-well-backup.service | grep -qx success"
    timeout: 1800
    description: "A full set now: globals + every database + row counts + SHA256SUMS; copied to east on success"
    on_fail: "journalctl -u unheaded-well-backup -n 50. A refusal naming a shared disk means WELL_BACKUP_DIR moved onto the data disk."

  - name: latest
    action: shell
    command: "cat ${SETS}/LATEST && sudo ls -l ${SETS}/$(cat ${SETS}/LATEST)"

  - name: offsite
    action: shell
    command: "systemctl show -p Result --value unheaded-well-offsite.service"
    verify: "systemctl show -p Result --value unheaded-well-offsite.service | grep -qx success"
    description: "The copy to east ran after the backup"
    on_fail: "journalctl -u unheaded-well-offsite -n 50"

  - name: drill
    action: shell
    command: "sudo systemctl start unheaded-well-drill.service"
    verify: "systemctl show -p Result --value unheaded-well-drill.service | grep -qx success"
    timeout: 1800
    description: "Restore the newest set into a throwaway container and compare every row count; never touches The Well"
    on_fail: "journalctl -u unheaded-well-drill -n 50"

  - name: restore
    action: manual
    command: |
      # Only after the drill passed on the set you mean to restore.
      SET=${SETS}/<YYYY-MM-DD>/well-<HHMMSS>Z   # from east if west's disk is gone
      sudo /usr/local/lib/unheaded/well/restore-drill.sh "$SET"
      # Then into a server bootstrapped with the superuser in $SET/cluster.env:
      #   psql -f globals.sql, then pg_restore -d <db> each <db>.dump
      scripts/well/set-role-passwords.sh   # sets carry no passwords
    description: "MANUAL. Never pg_restore --clean into the live Well."

  - name: verify-after-restore
    action: manual
    command: |
      cd ~/tmp/unheaded && set -a && . ./.env && set +a
      WELL_MIGRATE_PASSWORD=$POSTGRES_PASSWORD go run ./cmd/well-migrate status
    description: "Ledger status clean; compare row counts with the set's rowcounts.tsv"
