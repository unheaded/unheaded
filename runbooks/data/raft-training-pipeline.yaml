apiVersion: runbook/v1
kind: Runbook
metadata:
  name: raft-training-pipeline
  description: Full RAFT pipeline — QA gen → train QLoRA → quantize → deploy
  owner: computermancer
  estimated_duration: 180m
  risk: medium
  requires_sudo: false

env:
  HSA_OVERRIDE_GFX_VERSION: "11.0.0"
  PYTHONUNBUFFERED: "1"
  VENV_ROCM: "~/.venv/zhen-rocm"
  VENV_ZHEN: "~/.venv/zhen"

notes: |
  CRITICAL: Stop Zhen + llama-server before running (14GB RAM constraint).
  HSA_OVERRIDE_GFX_VERSION=11.0.0 needed for PyTorch (gfx1100 wheels on gfx1101 GPU).
  Do NOT set HSA_OVERRIDE for llama-server (compiled for gfx1101 natively).

preconditions:
  - check: "test -f ~/tmp/unheaded/raft/corpus/ring1.jsonl"
    description: "Ring 1 corpus exists"
  - check: "test -d ${VENV_ROCM}"
    description: "ROCm Python 3.12 venv exists"
  - check: "! pgrep -f zhen_app.py"
    description: "Zhen is NOT running (frees RAM for training)"

steps:
  # --- Phase 1: QA Generation ---
  - name: stop-zhen
    action: shell
    command: "pkill -f zhen_app.py 2>/dev/null; pkill -f llama-server 2>/dev/null; sleep 3"
    description: "Free RAM for training"

  - name: generate-qa-pairs
    action: shell
    command: |
      cd ~/tmp/unheaded/raft
      source ${VENV_ZHEN}/bin/activate
      PYTHONUNBUFFERED=1 python3 scripts/05_generate_qa.py --count 2500
    timeout: 7200
    verify: "wc -l ~/tmp/unheaded/raft/raft_dataset.jsonl | awk '{print ($1 >= 2000) ? \"OK\" : \"FAIL\"}' | grep -q OK"
    on_fail: "Check /tmp/raft-qa-gen.log. Common issue: Mistral truncating JSON (increase MAX_TOKENS in script)"

  - name: validate-qa-quality
    action: shell
    command: |
      source ${VENV_ZHEN}/bin/activate
      python3 -c "
      import json
      with open('raft_dataset.jsonl') as f:
        pairs = [json.loads(l) for l in f if l.strip()]
      print(f'Total: {len(pairs)}')
      print(f'With question: {sum(1 for p in pairs if p.get(\"question\"))}')
      print(f'With answer: {sum(1 for p in pairs if p.get(\"answer\"))}')
      print(f'Avg answer len: {sum(len(p.get(\"answer\",\"\")) for p in pairs)/len(pairs):.0f} chars')
      "

  # --- Phase 2: Training ---
  - name: install-training-deps
    action: shell
    command: |
      source ${VENV_ROCM}/bin/activate
      pip install peft trl datasets 2>/dev/null || true

  - name: run-qlora-training
    action: shell
    command: |
      cd ~/tmp/unheaded/raft
      source ${VENV_ROCM}/bin/activate
      HSA_OVERRIDE_GFX_VERSION=11.0.0 PYTHONUNBUFFERED=1 \
        python3 scripts/08_train_qlora.py 2>&1 | tee /tmp/raft-train.log
    timeout: 14400
    verify: "test -d ~/tmp/unheaded/raft/output/checkpoint-*"
    on_fail: "Check /tmp/raft-train.log for OOM or CUDA errors"

  # --- Phase 3: Merge + Quantize ---
  - name: merge-adapters
    action: shell
    command: |
      source ${VENV_ROCM}/bin/activate
      HSA_OVERRIDE_GFX_VERSION=11.0.0 python3 scripts/merge_lora.py 2>&1 || echo "Check merge script"
    description: "Merge LoRA adapters into base model"

  - name: quantize-to-gguf
    action: shell
    command: |
      python3 ~/tmp/unheaded/llama.cpp/convert_hf_to_gguf.py \
        --outfile /var/zhen/models/mistral-7b-kingdom-q5.gguf \
        --outtype q5_k_m \
        ~/tmp/unheaded/raft/output/merged/
    verify: "test -f /var/zhen/models/mistral-7b-kingdom-q5.gguf"
    timeout: 600

  # --- Phase 4: Validate + Deploy ---
  - name: start-inference-new-model
    action: shell
    command: |
      cd ~/tmp/unheaded/llama.cpp/build
      export LD_LIBRARY_PATH="$(pwd)/bin:$LD_LIBRARY_PATH"
      nohup ./bin/llama-server \
        -m /var/zhen/models/mistral-7b-kingdom-q5.gguf \
        -ngl 40 -c 16384 --port 20100 > /tmp/llama-server.log 2>&1 &
      sleep 10
    verify: "curl -sf http://localhost:20100/health | grep -q ok"

  - name: ab-test
    action: shell
    command: |
      echo "Run A/B test comparing original vs fine-tuned model"
      echo "Test with 20+ Kingdom-specific questions"
      echo "Compare answer quality, relevance, accuracy"
    description: "MANUAL — evaluate quality before permanent deployment"

  - name: deploy-if-better
    action: shell
    command: |
      ln -sf mistral-7b-kingdom-q5.gguf /var/zhen/models/active.gguf
      echo "Fine-tuned model deployed as active"

  - name: restart-zhen
    action: shell
    command: |
      cd ~/tmp/unheaded/raft
      source ${VENV_ZHEN}/bin/activate
      nohup python3 zhen_app.py > /tmp/zhen.log 2>&1 &
      sleep 30
    verify: "curl -sf http://localhost:20103/health | grep -q ok"
