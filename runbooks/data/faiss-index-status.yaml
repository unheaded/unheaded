apiVersion: runbook/v1
kind: Runbook
metadata:
  name: faiss-index-status
  description: Check FAISS index health and vector counts
  owner: zhenai
  estimated_duration: 2m
  risk: low
  requires_sudo: false

steps:
  - name: check-index-files
    action: shell
    command: |
      echo "=== FAISS index files ==="
      ls -lh /var/zhen/index/*.index /var/zhen/index/*.json 2>/dev/null
      echo "=== Active index ==="
      readlink /var/zhen/index/active.index 2>/dev/null || echo "No active index"
      readlink /var/zhen/index/active_ids.json 2>/dev/null

  - name: check-corpus
    action: shell
    command: |
      echo "=== Corpus files ==="
      wc -l /var/zhen/corpus/*.jsonl 2>/dev/null
      echo "=== Corpus size ==="
      du -sh /var/zhen/corpus/ 2>/dev/null

  - name: check-model-files
    action: shell
    command: |
      echo "=== Model files ==="
      ls -lh /var/zhen/models/*.gguf /var/zhen/models/*.zlora 2>/dev/null

  - name: check-zhenai-stats
    action: shell
    command: |
      # https with hybrid key exchange only (ADR-138): curl on OpenSSL 3.5+, and the CA that issued the front's certificate
      curl -sf --cacert "${ZHEN_UI_CA:-$HOME/tmp/unheaded/configs/certs/dev/ca.pem}" https://localhost:20103/health 2>/dev/null | python3 -m json.tool 2>/dev/null || echo "Zhenai not running"
