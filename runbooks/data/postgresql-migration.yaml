apiVersion: runbook/v1
kind: Runbook
metadata:
  name: postgresql-migration
  description: Apply schema migrations to The Well through the ledger (ADR-101)
  owner: developer
  estimated_duration: 10m
  risk: high
  requires_sudo: true
  cs_sources: [databases/postgresql]

notes: |
  Migrations are files in db/migrations, routed by db/migrations/MANIFEST and
  recorded per database in well_schema_migrations. Never pipe a file into
  psql by hand: the ledger would not know, and the next apply would run it
  again. A transactional migration that fails changes nothing and records
  nothing. A change to an applied file is drift; write a new file instead.
  WELL_MIGRATE_PASSWORD is the superuser's (POSTGRES_PASSWORD in .env).

env:
  REPO: "~/tmp/unheaded"

steps:
  - name: backup-before-migration
    action: shell
    command: "sudo systemctl start unheaded-well-backup.service && cat /srv/backups/unheaded-well/LATEST"
    verify: "systemctl show -p Result --value unheaded-well-backup.service | grep -qx success"
    description: "ALWAYS take a backup set (every database + globals) first"

  - name: check-manifest
    action: shell
    command: "cd ${REPO} && go run ./cmd/well-migrate check"
    description: "Offline: every file routed, no psql meta-commands"

  - name: status
    action: shell
    command: "cd ${REPO} && set -a && . ./.env && set +a && WELL_MIGRATE_PASSWORD=$POSTGRES_PASSWORD go run ./cmd/well-migrate status"
    description: "Exit 3 = pending, 1 = drift (stop and read it)"

  - name: plan
    action: shell
    command: "cd ${REPO} && set -a && . ./.env && set +a && WELL_MIGRATE_PASSWORD=$POSTGRES_PASSWORD go run ./cmd/well-migrate apply"
    description: "Prints what would run; changes nothing"

  - name: apply
    action: shell
    command: "cd ${REPO} && set -a && . ./.env && set +a && WELL_MIGRATE_PASSWORD=$POSTGRES_PASSWORD go run ./cmd/well-migrate apply -yes"
    description: "MANUAL: review the plan step first"
    on_fail: "Read the error. Nothing was recorded for the failed file; fix forward with a new file."

  - name: verify
    action: shell
    command: "cd ${REPO} && set -a && . ./.env && set +a && WELL_MIGRATE_PASSWORD=$POSTGRES_PASSWORD go run ./cmd/well-migrate status && scripts/well/test-converge-live-app.sh --live"
    description: "Status clean; live unheaded_app schema equals a fresh bootstrap"

rollback:
  - name: restore-plan
    action: shell
    command: |
      echo "A failed transactional migration already rolled back: nothing to undo."
      echo "To undo an applied one: write a new migration that reverses it, or restore"
      echo "the pre-migration set (prove it first: scripts/well/restore-drill.sh <set>)."
    description: "MANUAL: never DROP DATABASE from a runbook"
