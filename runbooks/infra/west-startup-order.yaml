apiVersion: runbook/v1
kind: Runbook
metadata:
  name: west-startup-order
  description: Canonical startup sequence for all Unheaded services on WEST host
  owner: architect
  estimated_duration: 8m
  risk: low
  requires_sudo: true
  last_verified: "2026-07-24"

preconditions:
  - check: "test -d ~/tmp/unheaded"
    description: "Unheaded repo present"
  - check: "docker compose -f ~/tmp/unheaded/docker-compose.yml ps 2>/dev/null | grep -q . || true"
    description: "Docker daemon reachable"
  - check: "test -f /var/zhen/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
    description: "Qwen-Coder-7B GGUF present for llama-server"
  - check: "which cs"
    description: "vor (cs) binary present"

env:
  PROJECT_ROOT: "~/tmp/unheaded"
  LLAMA_BIN: "~/tmp/unheaded/llama.cpp/build/bin/llama-server"
  MODEL: "/var/zhen/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"

# ─── TIER 0: Data persistence ─────────────────────────────────────────────────
# Must come first. Everything else depends on postgres for state.
#
# ─── TIER 1: Message bus + routing ────────────────────────────────────────────
# wotan, victoria, traefik, coredns.
#
# ─── TIER 2: Observability ────────────────────────────────────────────────────
# clickhouse, grafana. Grafana runs migrations on first boot (~2m).
#
# ─── TIER 3: Core services ────────────────────────────────────────────────────
# timeguru, captain, architect, micromanager, monad, sophia, cuirass.
# All depend on wotan + postgres.
#
# ─── TIER 4: Applications ─────────────────────────────────────────────────────
# dashboard, kanban. Depend on core services + postgres.
#
# Tiers 0-4 all start via a single `docker compose up -d`.
# ──────────────────────────────────────────────────────────────────────────────

steps:
  # ── Tiers 0-4: Docker stack ────────────────────────────────────────────────

  - name: docker-stack-up
    action: shell
    command: |
      cd ~/tmp/unheaded
      sudo docker compose up -d
    verify: |
      sudo docker ps --format '{{.Names}}\t{{.Status}}' | grep unheaded | grep -v Exited
    description: "Start all Docker containers (postgres → wotan → services → dashboard)"
    on_fail: "Check logs: sudo docker compose logs <service>"

  - name: wait-postgres-healthy
    action: shell
    command: |
      for i in $(seq 1 20); do
        sudo docker inspect unheaded-postgres --format '{{.State.Health.Status}}' 2>/dev/null | grep -q healthy && break
        sleep 2
      done
    verify: "sudo docker inspect unheaded-postgres --format '{{.State.Health.Status}}' | grep -q healthy"
    description: "Wait for postgres to be healthy before proceeding"

  - name: fix-kanban-if-exited
    action: shell
    command: |
      STATUS=$(sudo docker inspect unheaded-kanban --format '{{.State.Status}}' 2>/dev/null)
      if [[ "$STATUS" == "exited" ]]; then
        sudo docker start unheaded-kanban
        echo "kanban restarted"
      else
        echo "kanban already running: $STATUS"
      fi
    description: "kanban sometimes exits 0 on first compose up — restart if needed"

  - name: check-core-health
    action: shell
    command: |
      echo "=== Core container status ==="
      sudo docker ps --format 'table {{.Names}}\t{{.Status}}' | grep unheaded | sort
    description: "Visual health check — grafana/clickhouse may show 'unhealthy' while initializing; that clears in ~2m"

  # ── Tier 5a: Inference (required before zhenai) ────────────────────────────

  - name: start-llama-server
    action: shell
    command: |
      if ss -lnt | grep -q ':8081'; then
        echo "llama-server already on :8081"
      else
        nohup ~/tmp/unheaded/llama.cpp/build/bin/llama-server \
          -m /var/zhen/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf \
          --host 127.0.0.1 --port 8081 \
          --n-gpu-layers 999 --ctx-size 16384 \
          --threads 6 \
          &> "$(~/tmp/unheaded/scripts/lib/logpath.sh llama-server)" &
        echo "llama-server PID: $!"
        # Wait for model load (~20s first time, includes GPU offload fit)
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8081/health > /dev/null 2>&1 && break
          sleep 2
        done
      fi
    verify: "curl -sf http://127.0.0.1:8081/health > /dev/null"
    description: "Start llama-server with Qwen-Coder-7B on GPU (ROCm). First load takes ~20s for GPU fit."
    on_fail: "tail -20 $(~/tmp/unheaded/scripts/lib/logpath.sh llama-server)"

  # ── Tier 5b: Retrieval (required before zhenai) ────────────────────────────

  - name: start-vor
    action: shell
    command: |
      if ss -lnt | grep -q ':20110'; then
        echo "vor already on :20110"
      else
        nohup cs serve 20110 &> "$(~/tmp/unheaded/scripts/lib/logpath.sh vor)" &
        echo "vor PID: $!"
        for i in $(seq 1 15); do
          curl -sf http://127.0.0.1:20110/api/health > /dev/null 2>&1 && break
          sleep 1
        done
      fi
    verify: "curl -sf http://127.0.0.1:20110/api/health > /dev/null"
    description: "Start vor (cs serve) corpus server on :20110"
    on_fail: "tail -10 $(~/tmp/unheaded/scripts/lib/logpath.sh vor)"

  # ── Tier 5c: Wiki ──────────────────────────────────────────────────────────

  - name: start-wiki
    action: shell
    command: |
      if ss -lnt | grep -q ':20002'; then
        echo "wiki-server already on :20002"
      else
        # wiki-server binary lives in the repo bin/ or is a system install
        cd ~/tmp/unheaded
        nohup wiki-server &> "$(~/tmp/unheaded/scripts/lib/logpath.sh wiki-server)" &
        echo "wiki-server PID: $!"
      fi
    description: "Start wiki-server on :20002 (optional — skip if not installed)"

  # ── Tier 5d: Zhenai web UI (depends on llama-server + vor + postgres) ──────

  - name: start-zhenai
    action: shell
    command: |
      if ss -lnt | grep -q ':20103'; then
        echo "zhenai already on :20103"
      else
        cd ~/tmp/unheaded/raft
        ./start-zhen.sh
      fi
    verify: "curl -sf http://127.0.0.1:20112/ready > /dev/null"
    description: "Start Zhen web UI: the app on its socket and zhen-ui-front on :20103, https only (UI only; add -gated for mutation mode)"
    on_fail: "tail -20 $(~/tmp/unheaded/scripts/lib/logpath.sh zhen zhen-webapp.log)"

  # ── Tier 6: Observability agents ───────────────────────────────────────────

  - name: start-huginn
    action: shell
    command: |
      if ss -lnt | grep -q ':9110'; then
        echo "huginn already on :9110"
      else
        # ADR-084: huginn runs under systemd as its own nologin account,
        # never from a shell. Install: make binaries && sudo make install,
        # then deploy/systemd/huginn.service (wiki/Service-Huginn.md).
        sudo systemctl start huginn.service
      fi
    verify: "curl -sf http://localhost:9110/health > /dev/null"
    description: "Start Huginn host metrics agent (huginn.service) on :9110"
    on_fail: "sudo journalctl -u huginn.service -n 20 --no-pager"

  - name: build-and-start-demo-trace-injector
    action: shell
    command: |
      cd ~/tmp/unheaded
      go build -o bin/demo-trace-injector ./cmd/demo-trace-injector/
      nohup ./bin/demo-trace-injector &> "$(~/tmp/unheaded/scripts/lib/logpath.sh demo-trace-injector)" &
      echo "demo-trace-injector PID: $!"
    description: "Build and start demo-trace-injector (publishes eBPF flow/latency/packet events to wotan)"
    on_fail: "tail -10 $(~/tmp/unheaded/scripts/lib/logpath.sh demo-trace-injector)"

verification:
  - name: full-status
    action: shell
    command: |
      echo "=== Docker containers ==="
      sudo docker ps --format 'table {{.Names}}\t{{.Status}}' | grep unheaded | sort
      echo ""
      echo "=== Native services ==="
      ss -lnt | grep -E ':(8081|20110|9110|20002|20103|20111)' | awk '{print $4}'
    description: "Full service status sweep"

notes: |
  STARTUP ORDER RATIONALE
  ========================
  Tier 0 (postgres) → Tier 1 (wotan, victoria, traefik, coredns) → Tier 2 (clickhouse, grafana)
  → Tier 3 (timeguru, captain, architect, micromanager, monad, sophia, cuirass)
  → Tier 4 (dashboard, kanban) → Tier 5 (llama-server → vor → wiki → zhenai)
  → Tier 6 (huginn, demo-trace-injector)

  Tiers 0-4 = docker compose up -d (single command, compose handles internal deps).
  Tier 5 must be ordered: llama-server first, vor second, then zhenai (start-zhen.sh
  pre-flight checks both).

  KNOWN ISSUES
  ============
  1. kanban exits 0 after compose up: safe to restart with `docker start unheaded-kanban`.

  2. grafana + clickhouse show 'unhealthy' for ~2m after start while running migrations.
     They self-clear. Do not restart them during this window.

  3. timeguru SQLite needs /data (not /app/data). tmpfs in compose is mounted at /data
     with uid=1000,gid=1000. Fixed in docker-compose.yml 2026-07-24.

  MEMORY LIMITS (tuned 2026-07-24)
  ==================================
  grafana:    512M (was 256M, was hitting 94%)
  clickhouse: 2G   (was 1G, was hitting 95%)

  STOPPING ALL SERVICES
  ======================
  Native:  pkill -f zhen_app.py; pkill -f llama-server; pkill -f 'cs serve'
           pkill -f wiki-server; sudo systemctl stop huginn; pkill -f demo-trace-injector
  Docker:  cd ~/tmp/unheaded && sudo docker compose down
