apiVersion: runbook/v1
kind: Runbook
metadata:
  name: rolling-upgrade
  description: Rolling upgrade of Kingdom services with zero downtime
  owner: micromanager
  estimated_duration: 20m
  risk: high
  requires_sudo: true
notes: |
  East takes the signed repo; west takes the debs this run built, from
  dist/debs, since it has no apt source. Both are the bytes compare-repo-with-build
  just read. --only-upgrade keeps a package that sorts above what is published
  and reports success, and apt will not install a lower version from a file, so
  this runbook refuses to start while either host holds one, and checks each host
  reached the published version before going on. The first move off 1.0.0 is
  that case: 1.0.0 sorts above the 0.2.0 line, and unheaded-unheaded-daemon is
  renamed. East's move is runbooks/deploy/apt-repo-publish.yaml; west's is its
  one downgrade at S-E1-LIVE. A host ahead of this checkout needs a newer commit
  built.
  A failed run can be started again at the same commit: the debs built for it
  are kept, because the repo refuses one version with other bytes and a rebuild
  has other bytes. A run on a newer commit is a new version.
  The rollback restores the packages each host held, from the debs record-previous
  kept in dist/debs/rollback-<commit>, and removes those it did not hold, as
  unheaded-keygen may be on west. A host holding a version with no deb in
  the repo's pool or under dist/debs stops the run before anything moves.
  record-previous also records what a health sweep finds up on each host, and
  verify-east-health and verify-west-health fail if any of that is down. A service
  already down then is not held against the build; a host where nothing is up
  stops the run before anything moves. West's sweep reads configs/akira-west.yaml.

env:
  # What apt-repo-publish's install-east installs, under the names
  # scripts/lib/deb-packages.sh gives them. `apt upgrade` would upgrade every
  # package on the host, not these. --only-upgrade skips any a host lacks.
  UNHEADED_PKGS: "unheaded-keygen unheaded-configs unheaded-wotan unheaded-daemon unheaded-dashboard-backend unheaded-kanban-app unheaded-akira unheaded-timeguru unheaded-captain unheaded-architect unheaded-micromanager unheaded-auth"

parameters:
  - name: REPO
    default: "$HOME/tmp/unheaded"
    description: The repository checkout on west
  - name: GNUPGHOME
    default: ""
    description: The GNUPGHOME that holds the repo signing key (E4)
  - name: APT_REPO_BASE
    default: "/srv/unheaded-apt"
    description: The repo directory on west

preconditions:
  - check: "test -n \"${GNUPGHOME}\""
    description: E4 answered (the GNUPGHOME that holds the repo signing key)
  - check: "test -z \"$(git -C \"${REPO}\" status --porcelain)\""
    description: The checkout is clean (the version names its commit)
  - check: "command -v reprepro"
    description: reprepro installed on west
  - check: "test -f \"${APT_REPO_BASE}/conf/distributions\""
    description: The signed repo is initialised (deploy/apt-repo-publish)
  - check: "ssh govan@east 'test -x /opt/unheaded/bin/akira && test -r /opt/unheaded/etc/akira.yaml'"
    description: East has the akira binary and config verify-east-health runs, before east is upgraded
  - check: |
      set -euo pipefail
      rows="$(dpkg --version >/dev/null && { dpkg -l ${UNHEADED_PKGS} 2>/dev/null || true; })"
      while read -r state _; do
        case "$state" in [uihrp][iUFHWt]*) exit 0 ;; esac
      done <<<"$rows"
      echo "west holds none of these packages" >&2
      exit 1
    description: West holds one of these packages, or upgrade-west would stop with east already moved
  - check: |
      set -euo pipefail
      want="$(cd "${REPO}" && scripts/build-all-debs.sh --print-version)"
      west="$(dpkg --version >/dev/null && { dpkg -l 'unheaded-*' 2>/dev/null || true; })"
      east="$(ssh govan@east "dpkg --version >/dev/null && { dpkg -l 'unheaded-*' 2>/dev/null || true; }")"
      held=""
      while read -r state pkg version _; do
        case "$state" in [uihrp][iUFHWt]*) ;; *) continue ;; esac
        if [ "${pkg%%:*}" = unheaded-unheaded-daemon ] || dpkg --compare-versions "$version" gt "$want"; then
          held="$held ${pkg%%:*}=$version"
        fi
      done <<<"$west"$'\n'"$east"
      if [ -n "$held" ]; then
        echo "Would stay as they are:$held. 1.0.x: east runbooks/deploy/apt-repo-publish.yaml, west S-E1-LIVE. Otherwise build a newer commit." >&2
        exit 1
      fi
    description: Neither host holds a package this run would keep (the first move off 1.0.0 is deploy/apt-repo-publish on east, S-E1-LIVE on west)

steps:
  - name: pre-flight-check
    action: shell
    command: |
      echo "=== Pre-flight ==="
      for svc in wotan daemon timeguru captain architect micromanager dashboard-backend kanban-app akira; do
        dpkg -l "unheaded-${svc}" 2>/dev/null | grep "^ii" | awk '{print $2, $3}'
      done
    description: "Show current package versions"

  - name: backup-state
    action: shell
    # The nightly backup unit, run now: every database as well_backup, with
    # globals, row counts and SHA256SUMS, then the offsite copy to east
    # (scripts/db-backup.sh, wiki/Well-Backups.md). Type=oneshot, so start
    # returns when the set is written and fails if it was not.
    command: "sudo systemctl start unheaded-well-backup.service"
    timeout: 1800
    description: "Backup The Well before upgrade (a full backup set)"
    verify: "test \"$(systemctl show -p Result --value unheaded-well-backup.service)\" = success && cat /srv/backups/unheaded-well/LATEST"

  - name: build-new-packages
    action: shell
    command: |
      set -euo pipefail
      cd "${REPO}"
      debs="dist/debs/rolling-$(git rev-parse --short=8 HEAD)"
      if [ -d "$debs" ]; then
        echo "keeping the debs already built for this commit: $debs"
        exit 0
      fi
      rm -rf "$debs.part"
      DEB_OUTPUT_DIR="$debs.part" scripts/build-all-debs.sh
      mv "$debs.part" "$debs"
    timeout: 1200
    description: "Build all .deb packages from the current commit into their own directory, once per commit"

  - name: record-previous
    action: shell
    # Before the publish: the repo keeps one version of a package, so including
    # this build drops the debs a rollback needs.
    command: |
      set -euo pipefail
      cd "${REPO}"
      scripts/rolling-previous.sh record "dist/debs/rollback-$(git rev-parse --short=8 HEAD)" "${APT_REPO_BASE}" ${UNHEADED_PKGS}
    timeout: 600
    description: "Record what each host holds and has up, and keep the debs to put it back, or stop with nothing moved"

  - name: publish-to-repo
    action: shell
    command: |
      set -euo pipefail
      cd "${REPO}"
      debs="dist/debs/rolling-$(git rev-parse --short=8 HEAD)"
      sudo GNUPGHOME="${GNUPGHOME}" APT_REPO_BASE="${APT_REPO_BASE}" scripts/apt-repo.sh include "$debs"/*.deb
      APT_REPO_BASE="${APT_REPO_BASE}" scripts/apt-repo.sh check
    description: "Publish the new packages to the signed APT repo (re-signs Release) and check it"

  - name: compare-repo-with-build
    action: shell
    # reprepro skips a deb older than the one it holds and exits 0, so publish
    # passes for an older checkout and east would be given the newer build.
    command: |
      set -euo pipefail
      cd "${REPO}"
      debs="dist/debs/rolling-$(git rev-parse --short=8 HEAD)"
      APT_REPO_BASE="${APT_REPO_BASE}" scripts/apt-repo.sh compare "$debs"/*.deb
    description: "Stop before any host moves unless the repo serves this build, in version and in bytes"

  - name: upgrade-east-first
    action: shell
    command: |
      ssh govan@east 'set -o pipefail; sudo apt-get update -qq && sudo apt-get install --only-upgrade -y ${UNHEADED_PKGS} 2>&1 | tail -10'
    timeout: 900
    description: "Upgrade EAST's Unheaded packages first (canary)"
    # `|| echo not-running` made this verify pass whether Wotan was up or not.
    verify: |
      set -euo pipefail
      ssh govan@east 'systemctl is-active --quiet unheaded-wotan'
      want="$(cd "${REPO}" && scripts/build-all-debs.sh --print-version)"
      ssh govan@east "dpkg -l ${UNHEADED_PKGS} 2>/dev/null || true" \
        | awk -v want="$want" '$1 ~ /^[uihrp][iUFHWt]/ {n++; if ($3 != want) {print $2 "=" $3 " is not " want > "/dev/stderr"; behind = 1}} END {exit behind || !n}'

  - name: verify-east-health
    action: shell
    command: |
      set -euo pipefail
      cd "${REPO}"
      scripts/rolling-previous.sh health east "dist/debs/rollback-$(git rev-parse --short=8 HEAD)"
    description: "Akira sweep on EAST: everything up before the upgrade is up after it"
    timeout: 180

  - name: upgrade-west
    action: shell
    # What west holds, as --only-upgrade does for east, and unheaded-keygen,
    # which every key-holding package depends on at this exact version.
    command: |
      set -euo pipefail
      cd "${REPO}"
      debs="$PWD/dist/debs/rolling-$(git rev-parse --short=8 HEAD)"
      want="$(scripts/build-all-debs.sh --print-version)"
      held="$({ dpkg -l ${UNHEADED_PKGS} 2>/dev/null || true; } | awk '$1 ~ /^[uihrp][iUFHWt]/ {sub(/:.*/, "", $2); print $2}')"
      test -n "$held"
      install=()
      for p in $(printf '%s\n' unheaded-keygen $held | LC_ALL=C sort -u); do
        install+=("$debs/$p"_"$want"_*.deb)
        test -e "${install[-1]}" || { echo "this run built no $p" >&2; exit 1; }
      done
      sudo apt-get install -y "${install[@]}" 2>&1 | tail -10
    timeout: 900
    description: "Upgrade WEST's Unheaded packages from the debs this run built (primary)"
    verify: |
      set -euo pipefail
      want="$(cd "${REPO}" && scripts/build-all-debs.sh --print-version)"
      { dpkg -l ${UNHEADED_PKGS} 2>/dev/null || true; } \
        | awk -v want="$want" '$1 ~ /^[uihrp][iUFHWt]/ {n++; if ($3 != want) {print $2 "=" $3 " is not " want > "/dev/stderr"; behind = 1}} END {exit behind || !n}'

  - name: verify-west-health
    action: shell
    command: |
      set -euo pipefail
      cd "${REPO}"
      scripts/rolling-previous.sh health west "dist/debs/rollback-$(git rev-parse --short=8 HEAD)"
    description: "Akira sweep on WEST: everything up before the upgrade is up after it"
    timeout: 180

  - name: post-upgrade-check
    action: shell
    command: |
      echo "=== Post-upgrade versions ==="
      for svc in wotan daemon timeguru captain architect micromanager dashboard-backend kanban-app akira; do
        dpkg -l "unheaded-${svc}" 2>/dev/null | grep "^ii" | awk '{print $2, $3}'
      done

rollback:
  - name: restore-west
    action: shell
    timeout: 900
    command: |
      set -euo pipefail
      cd "${REPO}"
      scripts/rolling-previous.sh restore west "dist/debs/rollback-$(git rev-parse --short=8 HEAD)"
    description: "Put WEST back at the versions it held; fails unless it got there and what was up is up"
    when: "step.upgrade-west.failed || step.verify-west-health.failed"

  - name: restore-east
    action: shell
    timeout: 900
    command: |
      set -euo pipefail
      cd "${REPO}"
      scripts/rolling-previous.sh restore east "dist/debs/rollback-$(git rev-parse --short=8 HEAD)"
    description: "Put EAST back at the versions it held; fails unless it got there and what was up is up"
    when: "step.upgrade-east-first.failed || step.verify-east-health.failed || step.upgrade-west.failed || step.verify-west-health.failed"

  - name: restore-data
    action: manual
    command: |
      Only if the upgrade damaged data: restore the set named in
      /srv/backups/unheaded-well/LATEST (wiki/Well-Backups.md#restore).
      The repo still serves the failed build: an apt-get upgrade on east moves
      it forward again until a fixed commit is published.
    description: "What the package rollback does not cover"
    when: "step.upgrade-east-first.failed || step.verify-east-health.failed || step.upgrade-west.failed || step.verify-west-health.failed"
