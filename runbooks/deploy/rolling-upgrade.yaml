apiVersion: runbook/v1
kind: Runbook
metadata:
  name: rolling-upgrade
  description: Rolling upgrade of Kingdom services with zero downtime
  owner: micromanager
  estimated_duration: 20m
  risk: high
  requires_sudo: true

env:
  # The packages scripts/build-all-debs.sh builds (unheaded-<binary>).
  # `apt upgrade` would upgrade every package on the host, not these.
  UNHEADED_PKGS: "unheaded-wotan unheaded-unheaded-daemon unheaded-dashboard-backend unheaded-kanban-app unheaded-akira unheaded-timeguru unheaded-captain unheaded-architect unheaded-micromanager"

steps:
  - name: pre-flight-check
    action: shell
    command: |
      echo "=== Pre-flight ==="
      for svc in wotan timeguru captain architect micromanager dashboard-backend kanban-app akira; do
        dpkg -l "unheaded-${svc}" 2>/dev/null | grep "^ii" | awk '{print $2, $3}'
      done
    description: "Show current package versions"

  - name: backup-state
    action: shell
    # The nightly backup unit, run now: every database as well_backup, with
    # globals, row counts and SHA256SUMS, then the offsite copy to east
    # (scripts/db-backup.sh, wiki/Well-Backups.md). Type=oneshot, so start
    # returns when the set is written and fails if it was not.
    command: "sudo systemctl start unheaded-well-backup.service"
    timeout: 1800
    description: "Backup The Well before upgrade (a full backup set)"
    verify: "test \"$(systemctl show -p Result --value unheaded-well-backup.service)\" = success && cat /srv/backups/unheaded-well/LATEST"

  - name: build-new-packages
    action: shell
    command: "bash ~/tmp/unheaded/scripts/build-all-debs.sh"
    timeout: 300
    description: "Build all .deb packages from current code"

  - name: publish-to-repo
    action: shell
    command: |
      for deb in ~/tmp/unheaded/dist/debs/*.deb; do
        reprepro -b /var/lib/apt-repo includedeb noble "$deb" 2>/dev/null
      done
    description: "Publish new packages to APT repo"

  - name: upgrade-east-first
    action: shell
    command: |
      ssh govan@east 'sudo apt-get update -qq && sudo apt-get install --only-upgrade -y ${UNHEADED_PKGS} 2>&1 | tail -10'
    description: "Upgrade EAST's Unheaded packages first (canary)"
    # `|| echo not-running` made this verify pass whether Wotan was up or not.
    verify: "ssh govan@east 'systemctl is-active --quiet unheaded-wotan'"

  - name: verify-east-health
    action: shell
    command: |
      ssh govan@east '/opt/unheaded/bin/akira --once --config /opt/unheaded/etc/akira.yaml 2>&1 | tail -5'
    description: "Run Akira health sweep on EAST after upgrade"
    timeout: 30

  - name: upgrade-west
    action: shell
    command: "sudo apt-get update -qq && sudo apt-get install --only-upgrade -y ${UNHEADED_PKGS} 2>&1 | tail -10"
    description: "Upgrade WEST's Unheaded packages (primary)"

  - name: verify-west-health
    action: shell
    command: "cd ~/tmp/unheaded && go run ./cmd/akira --once 2>&1 | tail -5"

  - name: post-upgrade-check
    action: shell
    command: |
      echo "=== Post-upgrade versions ==="
      for svc in wotan timeguru captain architect micromanager dashboard-backend kanban-app akira; do
        dpkg -l "unheaded-${svc}" 2>/dev/null | grep "^ii" | awk '{print $2, $3}'
      done

rollback:
  - name: restore-previous-version
    action: shell
    command: |
      echo "To rollback: sudo apt install unheaded-wotan=<previous_version>"
      echo "Then, only if the upgrade damaged data: restore the set named in"
      echo "/srv/backups/unheaded-well/LATEST (wiki/Well-Backups.md#restore)"
    when: "step.verify-east-health.failed"
