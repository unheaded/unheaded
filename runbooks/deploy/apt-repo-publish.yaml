apiVersion: runbook/v1
kind: Runbook
metadata:
  name: apt-repo-publish
  description: Build the debs from a tagged commit, publish them to west's signed apt repo, install them on east
  owner: architect
  estimated_duration: 45m
  risk: high
  requires_sudo: true
  status: draft
  authored_by: claude
  reviewed_by: ""
  approved_by: ""
  dry_run_test: tests/apt/apt_repo_test.sh
notes: |
  S-IRON-GATE Phase 14 (ADR-026). The repo is /srv/unheaded-apt on west,
  kept by scripts/apt-repo.sh (reprepro, Codename unheaded) and served by
  nginx on 127.0.0.1:18888 and 192.168.13.2:18888 (deploy/nginx/unheaded-apt.conf),
  only dists/, pool/ and the public key. Its signed InRelease is the trust
  anchor: east pins the key with signed-by=, never [trusted=yes].
  Needs E4 (the signing key: which key, in which GNUPGHOME, who may run
  include) before init-repo, and an E3 host window for everything that
  changes west or east. The old unsigned repo (/var/lib/apt-repo, codename
  noble, served on 0.0.0.0:18888 with /conf and /db readable) is replaced:
  its nginx site goes when this one is enabled.
  Before installing on a host, its TLS material (/etc/unheaded/tls/<identity>/,
  deploy/systemd/README.md#tls) must be in place: postinst does not restart a
  service whose TLS files are missing, so a running service keeps its old binary
  until they are. Service keys and trust.d need nothing: postinst's keygen
  creates both on first install. The upgrade renames three units on
  east (unheaded-dashboard-backend -> unheaded-dashboard, unheaded-kanban-app
  -> unheaded-kanban, unheaded-unheaded-daemon -> unheaded-daemon) and the
  package unheaded-unheaded-daemon -> unheaded-daemon.
  East still runs the 1.0.0 packages, and three things about them need
  install-east's handling: 1.0.0 sorts above the 0.2.0 line, so apt keeps it
  unless the version is named and downgrades allowed; the 1.0.0 prerm of
  wotan, akira, dashboard-backend, kanban-app and unheaded-daemon stops and
  disables the service before any new maintainer script runs (timeguru,
  captain, architect and micromanager have no prerm), so no package can carry
  that state over and install-east enables the services itself; and they ship
  /etc/unheaded/wotan.yaml as a plain file, which dpkg takes for a local edit
  of the new conffile, prompts about, and fails on with no terminal. install-east
  moves that file to wotan.yaml.pre-conffile and nothing moves it back: a hand
  edit stays in that copy. east-source moves east's old unheaded.sources, which
  trusts the unsigned repo, to /var/backups, because that repo still offers
  1.0.0 and 1.0.0 sorts above this line.
  The first move off 1.0.0 has no rollback. unheaded-auth, -configs, -keygen and
  -daemon have no 1.0.0 build, so the rollback step finds that, says which, and
  changes nothing; a failed first move is fixed forward by re-running install-east.
  Each step is tested by scripts/test-deb-maintscripts.sh.
parameters:
  - name: REPO
    default: "$HOME/tmp/unheaded"
    description: The repository checkout on west
  - name: TAG
    default: "v0.2.0-alpha"
    description: The release tag to build from (the checkout must be at it, clean)
  - name: KEYID
    default: ""
    description: Fingerprint of the repo signing key (E4)
  - name: GNUPGHOME
    default: ""
    description: The GNUPGHOME that holds that key (E4)
  - name: APT_REPO_BASE
    default: "/srv/unheaded-apt"
    description: The repo directory on west
  - name: PREVIOUS
    default: ""
    description: The version to roll back to (apt-cache policy shows what the repo holds)
preconditions:
  - check: "test -n \"${KEYID}\" && test -n \"${GNUPGHOME}\""
    description: E4 answered (key fingerprint and its GNUPGHOME given)
  - check: "test -z \"$(git -C \"${REPO}\" status --porcelain)\""
    description: The checkout is clean
  - check: "test \"$(git -C \"${REPO}\" describe --exact-match --tags HEAD)\" = \"${TAG}\""
    description: The checkout is at the release tag
  - check: "command -v reprepro && command -v nginx"
    description: reprepro and nginx installed on west
steps:
  - name: build-debs
    action: shell
    command: |
      set -euo pipefail
      cd "${REPO}"
      v="${TAG#v}"
      DEB_OUTPUT_DIR="dist/debs/${TAG}" DEB_SIGN_KEY="${KEYID}" GNUPGHOME="${GNUPGHOME}" scripts/build-all-debs.sh "${v/-/\~}"
    timeout: 1200
    description: Build every deb at the tag into dist/debs/<tag>/, with a signed SHA256SUMS
    verify: "cd ${REPO}/dist/debs/${TAG} && GNUPGHOME=${GNUPGHOME} gpg --batch --verify SHA256SUMS.gpg SHA256SUMS && sha256sum -c --quiet SHA256SUMS"

  - name: init-repo
    action: shell
    command: |
      set -euo pipefail
      cd "${REPO}"
      sudo GNUPGHOME="${GNUPGHOME}" APT_REPO_BASE="${APT_REPO_BASE}" scripts/apt-repo.sh init --keyid "${KEYID}"
      sudo install -m 0644 deploy/nginx/unheaded-apt.conf /etc/nginx/sites-enabled/unheaded-apt.conf
      sudo rm -f /etc/nginx/sites-enabled/apt-repo
      sudo nginx -t
      sudo systemctl reload nginx
    description: Initialise the repo (idempotent; refuses a key switch) and serve it
    verify: "test \"$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18888/conf/distributions)\" = 403 && curl -fsS http://127.0.0.1:18888/unheaded-apt.gpg | gpg --show-keys --with-colons | grep -q \"${KEYID}\""

  - name: publish
    action: shell
    command: |
      set -euo pipefail
      cd "${REPO}"
      sudo GNUPGHOME="${GNUPGHOME}" APT_REPO_BASE="${APT_REPO_BASE}" scripts/apt-repo.sh include "dist/debs/${TAG}"/*.deb
      APT_REPO_BASE="${APT_REPO_BASE}" scripts/apt-repo.sh check
    description: Include the debs (re-signs Release) and check the repo
    verify: "curl -fsS http://127.0.0.1:18888/dists/unheaded/InRelease | head -n 1 | grep -q 'BEGIN PGP SIGNED MESSAGE' && curl -fsS http://127.0.0.1:18888/dists/unheaded/Release | grep -q '^Codename: unheaded$'"

  - name: east-source
    action: shell
    host: east
    command: |
      set -euo pipefail
      sudo install -d -m 0755 /etc/apt/keyrings
      curl -fsS http://192.168.13.2:18888/unheaded-apt.gpg | sudo tee /etc/apt/keyrings/unheaded.gpg >/dev/null
      gpg --show-keys --with-colons /etc/apt/keyrings/unheaded.gpg | grep -q "${KEYID}"
      if [ -e /etc/apt/sources.list.d/unheaded.sources ]; then
        sudo mv /etc/apt/sources.list.d/unheaded.sources /var/backups/unheaded.sources.bak-e1
      fi
      echo "deb [signed-by=/etc/apt/keyrings/unheaded.gpg] http://192.168.13.2:18888 unheaded main" | sudo tee /etc/apt/sources.list.d/unheaded.list >/dev/null
      sudo apt-get update
    description: Pin the repo key on east (fingerprint checked), retire the unsigned source and add the signed one
    verify: "ssh govan@east 'apt-cache policy unheaded-wotan | grep -q 192.168.13.2:18888'"

  - name: install-east
    action: shell
    host: east
    command: |
      set -euo pipefail
      for id in wotan timeguru akira captain architect micromanager unheaded-daemon dashboard-backend kanban-app; do
        for f in ca.pem "$id.pem" "$id-key.pem"; do
          sudo test -e "/etc/unheaded/tls/$id/$f" || { echo "no /etc/unheaded/tls/$id/$f (deploy/systemd/README.md#tls): nothing installed" >&2; exit 1; }
        done
      done
      if [ -e /etc/unheaded/wotan.yaml ] && ! dpkg-query --control-show unheaded-wotan conffiles >/dev/null 2>&1; then
        sudo mv /etc/unheaded/wotan.yaml /etc/unheaded/wotan.yaml.pre-conffile
      fi
      tag="${TAG}"
      v="${tag#v}"
      v="${v/-/\~}"
      pkgs=()
      for p in unheaded-keygen unheaded-configs unheaded-wotan unheaded-daemon \
        unheaded-dashboard-backend unheaded-kanban-app unheaded-akira unheaded-timeguru \
        unheaded-captain unheaded-architect unheaded-micromanager unheaded-auth; do
        pkgs+=("$p=$v")
      done
      sudo apt-get install -y --allow-downgrades "${pkgs[@]}"
      sudo systemctl enable --now unheaded-wotan unheaded-timeguru unheaded-akira unheaded-captain \
        unheaded-architect unheaded-micromanager unheaded-daemon unheaded-dashboard unheaded-kanban
    timeout: 900
    description: Install this release's packages on east, add the issuer (its unit is installed, not enabled), and start the services east ran
    on_fail: "Read the postinst warnings. Roll back (below), unless this was the first move off 1.0.0, which has none (notes)"

  - name: verify-east
    action: shell
    host: east
    command: |
      set -euo pipefail
      systemctl is-enabled unheaded-wotan unheaded-timeguru unheaded-daemon unheaded-dashboard unheaded-kanban
      systemctl list-units 'unheaded-*' --no-pager
      curl -sk -o /dev/null -w 'wotan=%{http_code}\n' https://127.0.0.1:18000/health
    description: The services are enabled and running under their new unit names, every unit active, Wotan healthy over TLS
    verify: "ssh govan@east 'systemctl is-active --quiet unheaded-wotan unheaded-timeguru unheaded-daemon unheaded-dashboard unheaded-kanban && ! systemctl --failed --no-legend | grep -q unheaded-'"

rollback:
  - name: east-previous-version
    action: shell
    host: east
    command: |
      set -euo pipefail
      test -n "${PREVIOUS}"
      pkgs=()
      missing=()
      for p in $(dpkg -l 'unheaded-*' | awk '$1 == "ii" {print $2}'); do
        if apt-cache madison "$p" | awk -v v="${PREVIOUS}" '$3 == v {found = 1} END {exit !found}'; then
          pkgs+=("$p=${PREVIOUS}")
        else
          missing+=("$p")
        fi
      done
      if [ "${#missing[@]}" -gt 0 ]; then
        echo "no ${PREVIOUS} build of: ${missing[*]}: nothing rolled back (notes: the first move off 1.0.0 has no rollback)" >&2
        exit 1
      fi
      sudo apt-get install -y --allow-downgrades "${pkgs[@]}"
    description: Install the previous version of every unheaded package from the repo in one apt run, or change nothing if any package has no such version
    when: "step.install-east.failed || step.verify-east.failed"
