apiVersion: runbook/v1
kind: Runbook
metadata:
  name: full-stack-deploy
  description: Deploy entire Unheaded Kingdom to bare metal (WEST primary)
  owner: micromanager
  estimated_duration: 30m
  risk: high
  requires_sudo: true
  cs_sources: [config-mgmt/ansible, ci-cd/github-actions]

env:
  PROJECT_ROOT: "~/tmp/unheaded"

preconditions:
  - check: "test -d ${PROJECT_ROOT}/.git"
    description: "Unheaded repo present"
  - check: "go version"
    description: "Go toolchain available"

steps:
  # --- Phase 1: Build ---
  - name: pull-latest
    action: shell
    command: "cd ${PROJECT_ROOT} && git pull --ff-only"
    on_fail: "git stash && git pull && git stash pop"

  - name: run-tests
    action: shell
    # pipefail: the step's status is go test's, not tail's. (The old verify ran
    # the suite a second time and passed on any FAIL count containing a 0.)
    command: "set -o pipefail; cd ${PROJECT_ROOT} && go test ./... -count=1 -race 2>&1 | tail -5"
    on_fail: "DO NOT DEPLOY — tests are failing. Fix first."

  - name: build-all-services
    action: shell
    command: "cd ${PROJECT_ROOT} && go build ./..."
    timeout: 300
    verify: "echo $?"

  - name: build-ebpf
    action: shell
    command: "set -o pipefail; cd ${PROJECT_ROOT}/ebpf && cargo build --release 2>&1 | tail -5"
    timeout: 300

  # --- Phase 2: Stop existing ---
  - name: stop-existing-services
    action: shell
    command: |
      pkill -f zhen_app.py 2>/dev/null
      pkill -f llama-server 2>/dev/null
      sudo docker compose -f ${PROJECT_ROOT}/docker-compose.yml down 2>/dev/null
      sleep 3
    description: "Clean stop of all services"

  # --- Phase 3: Start infrastructure ---
  - name: start-postgresql
    action: shell
    command: "sudo docker compose -f ${PROJECT_ROOT}/docker-compose.yml up -d postgres"
    verify: "sleep 10 && sudo docker exec unheaded-postgres pg_isready -U unheaded"

  - name: start-wotan
    action: shell
    command: |
      cd ${PROJECT_ROOT}
      # `go build ./...` above writes no binaries; build the one started here.
      go build -o services/wotan/cmd/wotan/wotan ./services/wotan/cmd/wotan/ || exit 1
      nohup services/wotan/cmd/wotan/wotan --topic-config configs/wotan.yaml > "$(~/tmp/unheaded/scripts/lib/logpath.sh wotan)" 2>&1 &
      sleep 3
    verify: "curl -sf http://localhost:18000/health"

  # --- Phase 4: Start services ---
  - name: start-core-services
    action: shell
    command: |
      cd ${PROJECT_ROOT}
      for svc in timeguru captain architect micromanager; do
        go build -o services/$svc/cmd/$svc/$svc ./services/$svc/cmd/$svc/ 2>/dev/null
        nohup services/$svc/cmd/$svc/$svc > /tmp/$svc.log 2>&1 &
        sleep 1
      done
    description: "Start all 4 core services"

  - name: start-dashboard
    action: shell
    command: |
      cd ${PROJECT_ROOT}
      go build -o cmd/dashboard-backend/dashboard-backend ./cmd/dashboard-backend/
      nohup cmd/dashboard-backend/dashboard-backend > "$(~/tmp/unheaded/scripts/lib/logpath.sh dashboard-backend)" 2>&1 &
    verify: "sleep 3 && curl -sf http://localhost:20000/health"

  - name: start-kanban
    action: shell
    command: |
      cd ${PROJECT_ROOT}
      go build -o cmd/kanban-app/kanban-app ./cmd/kanban-app/
      nohup cmd/kanban-app/kanban-app > "$(~/tmp/unheaded/scripts/lib/logpath.sh kanban-app)" 2>&1 &
    verify: "sleep 3 && curl -sf http://localhost:20001/health"

  # --- Phase 5: Start AI ---
  - name: start-inference
    action: shell
    command: |
      cd ${PROJECT_ROOT}/llama.cpp/build
      export LD_LIBRARY_PATH="$(pwd)/bin:$LD_LIBRARY_PATH"
      nohup ./bin/llama-server \
        -m ${PROJECT_ROOT}/raft/models/mistral-7b-instruct-q5_k_m.gguf \
        -ngl 40 -c 16384 --port 20100 > "$(~/tmp/unheaded/scripts/lib/logpath.sh llama-server)" 2>&1 &
      sleep 10
    verify: "curl -sf http://localhost:20100/health"

  - name: start-zhen
    action: shell
    command: |
      # The app on its Unix socket, then zhen-ui-front on :20103 (ADR-138).
      cd ${PROJECT_ROOT}/raft
      source ~/.venv/zhen/bin/activate
      ./start-zhen.sh
    verify: "curl -sf http://127.0.0.1:20112/ready"

  # --- Phase 6: Verify ---
  - name: health-sweep
    action: shell
    command: |
      echo "=== Full Health Sweep ==="
      for entry in wotan:18000 timeguru:19000 captain:19002 dashboard:20000 kanban:20001 zhen-ui-front:20112 inference:20100; do
        NAME=$(echo $entry | cut -d: -f1)
        PORT=$(echo $entry | cut -d: -f2)
        curl -sf http://localhost:$PORT/health > /dev/null && echo "  $NAME: OK" || echo "  $NAME: FAIL"
      done

  - name: test-zhen-query
    action: shell
    command: |
      code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "${ZHEN_UI_CA:-$HOME/tmp/unheaded/configs/certs/dev/ca.pem}" \
        -X POST https://localhost:20103/api/v1/query \
        -H "Content-Type: application/json" \
        -d '{"question": "What is Unheaded?"}')
      echo "Zhen chat without a login: HTTP $code (want 401)"
      test "$code" = 401
    description: "Zhen answers and chat takes a login; asking a question needs an operator's browser session"

rollback:
  - name: emergency-stop
    action: shell
    command: |
      pkill -f zhen_app.py; pkill -f llama-server
      pkill -f dashboard-backend; pkill -f kanban-app
      pkill -f wotan; pkill -f timeguru; pkill -f captain
      sudo docker compose -f ${PROJECT_ROOT}/docker-compose.yml down
      echo "All services stopped. Logs: $(dirname "$(dirname "$(~/tmp/unheaded/scripts/lib/logpath.sh wotan)")")/<service>/"
    when: "any critical step fails"
