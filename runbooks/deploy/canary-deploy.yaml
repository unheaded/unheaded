apiVersion: runbook/v1
kind: Runbook
metadata:
  name: canary-deploy
  description: Deploy a single service update to EAST (canary) before WEST
  owner: micromanager
  estimated_duration: 10m
  risk: medium
  requires_sudo: true

parameters:
  - name: SERVICE
    description: "Service to deploy (e.g., wotan, timeguru)"
    required: true
  - name: VERSION
    description: "Version to deploy (default: latest from APT repo)"
    default: "latest"

steps:
  - name: verify-current-version
    action: shell
    command: |
      echo "WEST: $(dpkg -l unheaded-${SERVICE} 2>/dev/null | grep ii | awk '{print $3}')"
      echo "EAST: $(ssh govan@east 'dpkg -l unheaded-'${SERVICE}' 2>/dev/null | grep ii' | awk '{print $3}')"

  - name: deploy-to-east
    action: shell
    command: "ssh govan@east 'sudo apt update -qq && sudo apt install -y unheaded-${SERVICE}'"
    verify: "ssh govan@east 'systemctl is-active --quiet unheaded-${SERVICE}'"

  - name: health-check-east
    action: shell
    command: |
      # pkg/ports/ports.go names are CamelCase (WotanHTTP, DashboardBackend),
      # so grepping it for the package name found nothing and curled
      # localhost:/health. Ports from pkg/ports/ports.go:
      case "${SERVICE}" in
        wotan) PORT=18000 ;; unheaded-daemon) PORT=17000 ;;
        timeguru) PORT=19000 ;; architect) PORT=19001 ;; captain) PORT=19002 ;;
        micromanager) PORT=19003 ;; akira) PORT=19100 ;;
        dashboard-backend) PORT=20000 ;; kanban-app) PORT=20001 ;;
        *) echo "no port known for ${SERVICE}"; exit 1 ;;
      esac
      ssh govan@east "curl -sf http://localhost:${PORT}/health" || { echo "Health check failed"; exit 1; }
    timeout: 10

  - name: wait-and-monitor
    action: shell
    command: "echo 'Monitor EAST for 5 minutes before promoting to WEST'"
    description: "MANUAL — watch logs, check metrics, verify no errors"

  - name: promote-to-west
    action: shell
    command: "sudo apt update -qq && sudo apt install -y unheaded-${SERVICE}"
    verify: "systemctl is-active --quiet unheaded-${SERVICE}"

rollback:
  - name: rollback-east
    # manual: <previous_version> is a placeholder, and as a shell command
    # bash reads it as a redirect from a file named previous_version.
    action: manual
    command: "ssh govan@east 'sudo apt install -y unheaded-${SERVICE}=<previous_version>'"
    when: "step.health-check-east.failed"
