apiVersion: runbook/v1
kind: Runbook
metadata:
  name: emergency-rollback
  description: Emergency rollback — restore previous package versions + database state
  owner: micromanager
  estimated_duration: 10m
  risk: critical
  requires_sudo: true

steps:
  - name: stop-all-services
    action: shell
    command: |
      for svc in wotan unheaded-daemon timeguru captain architect micromanager dashboard-backend kanban-app akira; do
        sudo systemctl stop "unheaded-${svc}" 2>/dev/null
      done
      echo "All services stopped"

  - name: restore-database
    action: shell
    command: |
      SET=$(cat /srv/backups/unheaded-well/LATEST 2>/dev/null)
      echo "Newest backup set: ${SET:-none}"
      echo "Prove it restores first: sudo /usr/local/lib/unheaded/well/restore-drill.sh /srv/backups/unheaded-well/$SET"
      echo "Then restore only the affected database by hand (pg_restore --clean into it),"
      echo "re-set role passwords with scripts/well/set-role-passwords.sh, and run well-migrate status."
    description: "MANUAL: a runbook never drops a database of The Well"

  - name: downgrade-packages
    action: shell
    command: |
      echo "To downgrade to specific version:"
      echo "  sudo apt install unheaded-wotan=<version>"
      echo ""
      echo "Available versions:"
      apt list -a unheaded-wotan 2>/dev/null
    description: "MANUAL — specify the version to rollback to"

  - name: restart-services
    action: shell
    command: |
      for svc in wotan unheaded-daemon timeguru captain architect micromanager dashboard-backend kanban-app akira; do
        sudo systemctl start "unheaded-${svc}" 2>/dev/null
      done

  - name: verify-health
    action: shell
    # cmd/akira/akira is a gitignored build product; build-and-run instead.
    command: "cd ~/tmp/unheaded && go run ./cmd/akira --once 2>&1 | tail -5"
