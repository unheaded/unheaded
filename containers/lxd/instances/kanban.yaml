# =============================================================================
# LXD Instance: Kanban App (The Meta Moment)
# =============================================================================
# Unheaded building Unheaded. Kanban board displaying timeline from timeguru.
#
# IP:    10.10.10.200
# Ports: 20001 (HTTP), 9100 (metrics)
# Role:  Application (public via gateway)
# =============================================================================

#cloud-config
hostname: kanban

network:
  version: 2
  ethernets:
    eth0:
      addresses:
        - 10.10.10.200/24
      gateway4: 10.10.10.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

packages:
  - ca-certificates
  - wget
  - curl
  - jq

users:
  - name: unheaded
    uid: "1000"
    shell: /bin/bash
    lock_passwd: true
    home: /var/lib/unheaded

write_files:
  - path: /etc/systemd/system/kanban.service
    content: |
      [Unit]
      Description=Kanban App - The Meta Moment
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=unheaded
      Group=unheaded
      ExecStart=/opt/unheaded/bin/kanban-app
      WorkingDirectory=/var/lib/unheaded/kanban
      Environment=SERVICE_NAME=kanban-app
      Environment=KANBAN_ADDR=0.0.0.0:20001
      Environment=KANBAN_TIMEGURU_URL=http://10.10.10.20:19000
      Environment=KANBAN_PUBLIC=true
      Environment=WOTAN_ADDR=10.10.10.10:18001
      Environment=WOTAN_HTTP_ADDR=http://10.10.10.10:18000
      Environment=LOG_LEVEL=info
      Environment=METRICS_ADDR=0.0.0.0:9100
      Environment=GOGC=100
      Environment=GOMAXPROCS=2
      Restart=always
      RestartSec=5s
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      RestrictRealtime=true
      ReadWritePaths=/var/lib/unheaded/kanban /var/log/unheaded/kanban
      MemoryMax=512M
      CPUQuota=100%
      TasksMax=512
      KillSignal=SIGTERM
      TimeoutStopSec=10s

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

  - path: /etc/unheaded/health-check.sh
    content: |
      #!/bin/bash
      set -euo pipefail
      curl -sf --connect-timeout 2 --max-time 5 http://127.0.0.1:20001/health > /dev/null 2>&1
    permissions: "0755"

runcmd:
  - mkdir -p /opt/unheaded/bin
  - mkdir -p /var/lib/unheaded/kanban
  - mkdir -p /var/log/unheaded/kanban
  - chown -R unheaded:unheaded /var/lib/unheaded /var/log/unheaded
  - |
    ufw --force reset
    ufw default deny incoming
    ufw default allow outgoing
    ufw allow from 10.10.10.0/24 to any port 20001 proto tcp
    ufw allow from 10.10.10.0/24 to any port 9100 proto tcp
    ufw --force enable
  - systemctl daemon-reload
  - systemctl enable kanban.service
  - systemctl start kanban.service || true
