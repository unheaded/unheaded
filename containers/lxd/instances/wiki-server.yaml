# =============================================================================
# LXD Instance: Wiki Server (Documentation)
# =============================================================================
# Documentation server for the Unheaded kingdom.
#
# IP:    10.10.10.29
# Ports: 8007 (HTTP), 9100 (metrics)
# Role:  Application service
# =============================================================================

#cloud-config
hostname: wiki-server

network:
  version: 2
  ethernets:
    eth0:
      addresses:
        - 10.10.10.29/24
      gateway4: 10.10.10.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

packages:
  - ca-certificates
  - wget
  - curl
  - jq

users:
  - name: unheaded
    uid: "1000"
    shell: /bin/bash
    lock_passwd: true
    home: /var/lib/unheaded

write_files:
  - path: /etc/systemd/system/wiki-server.service
    content: |
      [Unit]
      Description=Wiki Server - Documentation Service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=unheaded
      Group=unheaded
      ExecStart=/opt/unheaded/bin/wiki-server
      WorkingDirectory=/var/lib/unheaded/wiki-server
      Environment=SERVICE_NAME=wiki-server
      Environment=WIKI_ADDR=0.0.0.0:8007
      Environment=WOTAN_ADDR=10.10.10.10:9090
      Environment=WOTAN_HTTP_ADDR=http://10.10.10.10:8080
      Environment=LOG_LEVEL=info
      Environment=METRICS_ADDR=0.0.0.0:9100
      Environment=GOGC=100
      Environment=GOMAXPROCS=2
      Restart=always
      RestartSec=5s
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      RestrictRealtime=true
      ReadWritePaths=/var/lib/unheaded/wiki-server /var/log/unheaded/wiki-server
      MemoryMax=256M
      CPUQuota=100%
      TasksMax=512
      KillSignal=SIGTERM
      TimeoutStopSec=10s

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

  - path: /etc/unheaded/health-check.sh
    content: |
      #!/bin/bash
      set -euo pipefail
      curl -sf --connect-timeout 2 --max-time 5 http://127.0.0.1:8007/health > /dev/null 2>&1
    permissions: "0755"

runcmd:
  - mkdir -p /opt/unheaded/bin
  - mkdir -p /var/lib/unheaded/wiki-server
  - mkdir -p /var/log/unheaded/wiki-server
  - chown -R unheaded:unheaded /var/lib/unheaded /var/log/unheaded
  - |
    ufw --force reset
    ufw default deny incoming
    ufw default allow outgoing
    ufw allow from 10.10.10.0/24 to any port 8007 proto tcp
    ufw allow from 10.10.10.0/24 to any port 9100 proto tcp
    ufw --force enable
  - systemctl daemon-reload
  - systemctl enable wiki-server.service
  - systemctl start wiki-server.service || true
