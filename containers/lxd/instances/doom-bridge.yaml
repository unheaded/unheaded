# =============================================================================
# LXD Instance: Doom Bridge (Fenrir's Eye)
# =============================================================================
# Doom-over-IPv6 WebSocket bridge for browser visualization.
#
# IP:    10.10.10.28
# Ports: 6660 (HTTP + WebSocket), 9100 (metrics)
# Role:  Application service
# =============================================================================

#cloud-config
hostname: doom-bridge

network:
  version: 2
  ethernets:
    eth0:
      addresses:
        - 10.10.10.28/24
      gateway4: 10.10.10.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

packages:
  - ca-certificates
  - wget
  - curl
  - jq

users:
  - name: unheaded
    uid: "1000"
    shell: /bin/bash
    lock_passwd: true
    home: /var/lib/unheaded

write_files:
  - path: /etc/systemd/system/doom-bridge.service
    content: |
      [Unit]
      Description=Doom Bridge - Fenrir's Eye (Doom-over-IPv6 WebSocket)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=unheaded
      Group=unheaded
      ExecStart=/opt/unheaded/bin/doom-bridge
      WorkingDirectory=/var/lib/unheaded/doom-bridge
      Environment=SERVICE_NAME=doom-bridge
      Environment=DOOM_BRIDGE_ADDR=0.0.0.0:6660
      Environment=WOTAN_ADDR=10.10.10.10:9090
      Environment=WOTAN_HTTP_ADDR=http://10.10.10.10:8080
      Environment=LOG_LEVEL=info
      Environment=METRICS_ADDR=0.0.0.0:9100
      Environment=GOGC=100
      Environment=GOMAXPROCS=2
      Restart=always
      RestartSec=5s
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      RestrictRealtime=true
      ReadWritePaths=/var/lib/unheaded/doom-bridge /var/log/unheaded/doom-bridge
      MemoryMax=256M
      CPUQuota=100%
      TasksMax=512
      KillSignal=SIGTERM
      TimeoutStopSec=10s

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

  - path: /etc/unheaded/health-check.sh
    content: |
      #!/bin/bash
      set -euo pipefail
      curl -sf --connect-timeout 2 --max-time 5 http://127.0.0.1:6660/health > /dev/null 2>&1
    permissions: "0755"

runcmd:
  - mkdir -p /opt/unheaded/bin
  - mkdir -p /var/lib/unheaded/doom-bridge
  - mkdir -p /var/log/unheaded/doom-bridge
  - chown -R unheaded:unheaded /var/lib/unheaded /var/log/unheaded
  - |
    ufw --force reset
    ufw default deny incoming
    ufw default allow outgoing
    ufw allow from 10.10.10.0/24 to any port 6660 proto tcp
    ufw allow from 10.10.10.0/24 to any port 9100 proto tcp
    ufw --force enable
  - systemctl daemon-reload
  - systemctl enable doom-bridge.service
  - systemctl start doom-bridge.service || true
