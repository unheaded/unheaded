# =============================================================================
# LXD Instance: Micromanager Execution Service
# =============================================================================
# Execution tracking and task management service.
#
# IP:    10.10.10.22
# Ports: 8002 (HTTP), 9100 (metrics)
# Role:  Application service
# =============================================================================

#cloud-config
hostname: micromanager

network:
  version: 2
  ethernets:
    eth0:
      addresses:
        - 10.10.10.22/24
      gateway4: 10.10.10.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

packages:
  - ca-certificates
  - wget
  - curl
  - jq

users:
  - name: unheaded
    uid: "1000"
    shell: /bin/bash
    lock_passwd: true
    home: /var/lib/unheaded

write_files:
  - path: /etc/systemd/system/micromanager.service
    content: |
      [Unit]
      Description=Micromanager Execution Service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=unheaded
      Group=unheaded
      ExecStart=/opt/unheaded/bin/micromanager
      WorkingDirectory=/opt/unheaded/references
      Environment=SERVICE_NAME=micromanager
      Environment=MICROMANAGER_ADDR=0.0.0.0:8002
      Environment=WOTAN_ADDR=10.10.10.10:9090
      Environment=WOTAN_HTTP_ADDR=http://10.10.10.10:8080
      Environment=LOG_LEVEL=info
      Environment=METRICS_ADDR=0.0.0.0:9100
      Environment=GOGC=100
      Environment=GOMAXPROCS=2
      Restart=always
      RestartSec=5s
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      RestrictRealtime=true
      ReadWritePaths=/var/lib/unheaded/micromanager /var/log/unheaded/micromanager /opt/unheaded/references
      MemoryMax=256M
      CPUQuota=100%
      TasksMax=512
      KillSignal=SIGTERM
      TimeoutStopSec=10s

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

  - path: /etc/unheaded/health-check.sh
    content: |
      #!/bin/bash
      set -euo pipefail
      curl -sf --connect-timeout 2 --max-time 5 http://127.0.0.1:8002/health > /dev/null 2>&1
    permissions: "0755"

runcmd:
  - mkdir -p /opt/unheaded/bin /opt/unheaded/references
  - mkdir -p /var/lib/unheaded/micromanager
  - mkdir -p /var/log/unheaded/micromanager
  - chown -R unheaded:unheaded /var/lib/unheaded /var/log/unheaded /opt/unheaded
  - |
    ufw --force reset
    ufw default deny incoming
    ufw default allow outgoing
    ufw allow from 10.10.10.0/24 to any port 8002 proto tcp
    ufw allow from 10.10.10.0/24 to any port 9100 proto tcp
    ufw --force enable
  - systemctl daemon-reload
  - systemctl enable micromanager.service
  - systemctl start micromanager.service || true
