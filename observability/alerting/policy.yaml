#
# Alerting policy (ADR-100): the one file that decides what reaches a human.
#
#   Only an SLO burning its error budget notifies. Every other alert rule is
#   urgency "none": evaluated, visible in Prometheus/Alertmanager/Grafana,
#   never sent. Stevie, 2026-10-20: "I'm not going to read 500 alerts, I
#   might read 5 if something is worth checking out."
#
# After editing: go run ./cmd/alert-policy   (regenerates the files below)
#   monitoring/prometheus/rules/slo.yml        SLIs, burn-rate alerts
#   monitoring/alertmanager/alertmanager.yml   routing by urgency
# CI fails if they are out of date (go run ./cmd/alert-policy --check).
#
# Urgency (the label every alert carries):
#   page    budget burning fast enough to matter today: mailed right away
#   ticket  budget burning slowly: one digest a day, at mailer.digest_at
#   none    recorded only (causes, symptoms of causes, compliance)
#
# Runtime controls, no edit needed:
#   scripts/monitoring/maintenance.sh 30m "reboot west"   silence while you work
#   http://<west>:9093                                    Alertmanager: what is firing
#   curl -s localhost:19130/v1/outbox                     what the mailer sent / would send

mailer:
  # dry-run: decide and log every mail, send none.
  # 2026-11-10 (Stevie): dry-run while the kingdom ran as a test cut on west.
  # 2026-11-15 (Stevie, ADR-147 decision 2): mail on. A stopped container and
  # a memory kill each mail (promote: below). S-SEE-AND-SURVIVE Phase 15.
  mode: send
  # delivery: what is mailed.
  #   digest     the daily digest and nothing else: at most one mail a day. A
  #              page is recorded (outbox outcome "digest") and leads the
  #              digest; a silent alert path is the digest's first line.
  #   immediate  pages are mailed at once, tickets wait for the digest; the
  #              caps below bound the day.
  # 2026-11-17 (Stevie): "cap it to 1 digest email per day ... it's a lab, my
  # email doesn't need the noise". To get pages by mail again: immediate.
  delivery: digest
  # Mailed at once whatever delivery says: an intrusion or an indicator of
  # compromise from an IDS or IPS (Stevie, 2026-11-17). None exists yet. An
  # entry must be promoted below with urgency: page; it counts against the
  # caps like any mail.
  immediate: []
  # Hard cap across everything, per calendar day in timezone. The last
  # allowed mail says so; past it nothing is sent until midnight, and the
  # next digest counts what was held back.
  max_per_day: 6
  # DP-710: outbound mail is closely watched. Past this in one hour, mail is
  # held and counted, like the daily cap.
  max_per_hour: 3
  digest_at: "09:00"
  timezone: America/Chicago
  # Run days (ADR-147 decision 2): the caps above are raised on these dates
  # (YYYY-MM-DD in timezone) so a stop mark that fires late in a load run is
  # still mailed. Add a date before the run; delete it after.
  run_days:
    max_per_day: 24
    max_per_hour: 6
    dates: ["2026-11-22"]

# Alertmanager timing for urgency=page. Alertmanager passes every change in
# the set of firing pages to the mailer within group_interval; the mailer
# mails only news (an SLO starting to burn, or all clear) and a reminder
# after repeat_interval. So one incident is two mails, however it flaps.
page:
  group_wait: 2m
  group_interval: 5m
  repeat_interval: 12h

# The alert path's own receipt (ADR-116 R4, ADR-147 stage 1): Alertmanager
# hands AlertPipelineHeartbeat to the mailer every 5 minutes. When none has
# arrived for silent_after, the mailer mails once that Prometheus,
# Alertmanager or the route is down, and once more when receipts return.
pipeline:
  silent_after: 20m

# A boot of the host in the digest (decision pack 2026-11-18 row 22, ADR-150
# choice 15). The stack does not start at boot, so nothing can alert then:
# unheaded-boot-event.service writes each boot down on the host, and the
# mailer gives each boot it has not reported one plain line in the next
# digest ("west booted 2026-11-21 01:44Z; stack down; previous shutdown: not
# clean"). Never a mail of its own. state_max_age is how old host_state.prom
# (unheaded-host-state.timer, every 30 s) may be and still give that line the
# stack's state now; past it the line says what the boot recorded. The mailer
# alone reads this block; no regeneration.
boot:
  state_max_age: 5m

# A planned stop in the alert-route compliance probe (Stevie, 2026-11-22). The
# probe asks each link of the alert path (Prometheus, Alertmanager, the
# mailer, the Well) directly. A link that is down under a planned-stop mark
# (scripts/monitoring/planned-stop.sh) for its container or "all" passes only
# when the mark ends within probe_max of the probe; a longer mark still fails,
# since a stack stopped for days is what the probe exists to catch.
# kingdom-shutdown.sh marks "all" for 2h. <n>m or <n>h, 1m to 24h; absent: no
# mark counts. compliance-evidence alone reads this block; no regeneration.
planned_stop:
  probe_max: 2h

# Snooze (Stevie, 2026-11-22): any entry under promote: or slos: may carry
#     snooze_until: "12-01-2026"       # MM-DD-YYYY, quoted
#     snooze_reason: why it is quiet   # required with a date
# Its alerts are muted in Alertmanager through the end of that day in
# mailer.timezone: they still fire and show (Prometheus, and Alertmanager as
# muted) but reach no receiver, so none is mailed or digested. Absent: no
# snooze. A past date is inactive and may stay; at most 90 days ahead. A
# manual override: after editing, go run ./cmd/alert-policy and reload
# Alertmanager (curl -X POST localhost:9093/-/reload).

# Cause alerts that should notify anyway. Keep this short: every entry is
# noise the SLOs should already catch. Form:
#   - alert: WellBackupMissing
#     urgency: ticket
#     reason: why the SLOs miss it
#     snooze_until: "12-01-2026"        # optional, with snooze_reason (above)
promote:
  - alert: HeartbeatMissing
    urgency: page
    reason: >-
      Dead-man's switch: a host that stops reporting stops every SLI on it
      too, so no SLO can burn for it. The only alert allowed to page on an
      absence. Fires only where alert-mailer runs with HEARTBEAT_HOSTS set.
  - alert: TraceCollectorDown
    urgency: ticket
    reason: >-
      No SLO covers the eBPF trace collector; when it dies the dashboard's
      flow and latency views go empty while everything else stays healthy.
      A ticket, not a page: nothing user-facing breaks.
  - alert: SSHLoginNewSource
    urgency: ticket
    reason: >-
      A login from an address no host has seen in 30 days is the one
      intrusion sign no SLO can show: an attacker with a key keeps every
      service healthy. Rare by construction (operators log in from a few
      fixed LAN/P2P addresses), so a daily digest line costs nothing.
      Fires once per known source right after rollout (detection.yml).
  - alert: IOCAuditNotSucceeding
    urgency: ticket
    reason: >-
      Stevie, 2026-11-12: "alarm if fails for n+ days". The daily audit of
      SSH logins and authentication failures fails its run when it finds an
      indicator and when it cannot see. One failed day is a card in Review;
      three days with no success means nobody read the card or the audit is
      blind, and no SLO shows either.
  - alert: ZhenBackupStale
    urgency: ticket
    reason: >-
      Zhen is a production application with its own data and backup scope
      (ADR-147 decision 15 (b)); a day without a set is a ticket.
  - alert: ModuleListenerPublic
    urgency: page
    reason: >-
      ADR-147 decision 15 (c): a module is never reachable from the public
      side; the guard saw it happen.
  - alert: ModuleListenerGuardNotRunning
    urgency: ticket
    reason: >-
      The guard above is the only live check of that rule.
  - alert: HealthSweepNotSucceeding
    urgency: ticket
    reason: >-
      The platform's own sweep of this host's services, every 6 hours. A day
      with no success means a service is down and stayed down, or the timer
      stopped: with restart `no` (ADR-147 decision 1) nothing brings either
      back.
  - alert: WotanTopicPermissionRefused
    urgency: ticket
    reason: >-
      Under unlisted: deny a missing topic is silent: Sophia was refused 314
      times in 2.5 h on 2026-11-12 and nothing showed it but Wotan's log. No
      SLO sees a service that is up and starved.
  - alert: AIDEChangeDetected
    urgency: ticket
    reason: >-
      DE1 (Stevie, 2026-11-13): no spam. The weekly AIDE check reports a
      diff once, on the run that first saw it; this is that one digest line.
      No SLO sees a changed binary.
  - alert: AIDECheckStale
    urgency: ticket
    reason: >-
      A file integrity check that has stopped running looks the same as a
      host with no changes. No SLO sees a timer that does not fire.
  - alert: AlertMailVolumeHigh
    urgency: ticket
    reason: >-
      DP-710: outbound mail is watched. No SLO sees the mailer's own volume.
  # ADR-147 (S-SEE-AND-SURVIVE, SS1 A taken on the plan's recommendation,
  # 2026-11-15, Stevie to confirm): page only on what stays broken or stalls
  # the host; the rest is a digest line.
  - alert: ContainerStopped
    urgency: page
    reason: >-
      ADR-147 decision 1: restart stays no on west, so a container that stops
      stays down until a person starts it; decision 2: it mails. No SLO
      covers 16 of the containers.
  - alert: MemoryKill
    urgency: page
    reason: >-
      Decision 2. A killed container stays down; a killed child leaves its
      container up and broken. No SLO sees either.
  - alert: HostMemoryPressure
    urgency: page
    reason: >-
      Decision 12. A host stalled on memory stalls every service at once,
      and on west the next swap is the database disk.
  - alert: HostSwapping
    urgency: ticket
    reason: >-
      Decision 12: swap use alerts.
  - alert: HostSwapNearFull
    urgency: ticket
    reason: >-
      Decision 12: swap use alerts.
  - alert: SliceTasksNearMax
    urgency: ticket
    reason: >-
      M-210.4 (decision pack row 41): a slice at its task cap refuses every
      fork; four refused forks in the user slice went unseen after the
      2026-11-21 boot.
  - alert: HostIOPressure
    urgency: ticket
    reason: >-
      West's databases share one 7,200 rpm disk; a sustained stall slows
      every store, and no SLO reads latency yet.
  - alert: HostTemperatureNearCritical
    urgency: ticket
    reason: >-
      East has read 68 C against a 70 C mark; no SLO sees heat.
  - alert: UnitFailed
    urgency: page
    reason: >-
      SS3: a unit that has given up stays down like a stopped container.
  - alert: UnitRestartLoop
    urgency: ticket
    reason: >-
      A unit restarting for ever is a failure nobody is told about.
  - alert: VictoriaMetricsDown
    urgency: ticket
    reason: >-
      The SLO data and the stop-mark series come through these; without
      them the SLOs cannot burn.
  - alert: HuginnDown
    urgency: ticket
    reason: >-
      The SLO data and the stop-mark series come through these; without
      them the SLOs cannot burn.
  - alert: HostStateStale
    urgency: ticket
    reason: >-
      The SLO data and the stop-mark series come through these; without
      them the SLOs cannot burn.
  - alert: PrometheusRemoteWriteFailing
    urgency: ticket
    reason: >-
      The SLO data and the stop-mark series come through these; without
      them the SLOs cannot burn.
  - alert: HostDiskFull
    urgency: page
    reason: >-
      A full /var stops the Well, ClickHouse and Prometheus together; the
      SLOs burn only afterwards.
  - alert: HostDiskAlmostFull
    urgency: ticket
    reason: >-
      Ten per cent left is days of warning, worth a digest line before
      HostDiskFull pages.
  - alert: NodeExporterDown
    urgency: ticket
    reason: >-
      Every resource alert reads node_exporter; a host it cannot scrape has
      no pressure, swap or heat alerts.
  - alert: HostSettingsDrift
    urgency: ticket
    reason: >-
      S-WEST-GROUND (ADR-147): a host that differs from its files in the
      repository cannot be rebuilt from them, and every service stays healthy
      while it drifts. Checked once a day, so a daily digest line is the most
      it costs.
  - alert: HostSettingsCheckStale
    urgency: ticket
    reason: >-
      A drift check that has stopped running looks the same as a host with no
      drift. No SLO sees a timer that does not fire.

# Burn-rate tiers (Google SRE Workbook ch. 5, table 5-8). An alert fires
# when both windows exceed burn x (1 - objective). page: false SLOs send the
# fast tiers as tickets too.
#   fast    1h and 5m    at 14.4  (2% of a 30-day budget in an hour)   page
#   medium  6h and 30m   at 6     (5% in six hours)                     page
#   slow    1d and 2h    at 3     (10% in a day)                        ticket
#   steady  3d and 6h    at 1     (10% in three days)                   ticket
#
# Every SLI is time-based: "good" is a PromQL expression that is 1 when the
# service is good this minute and 0 when not. A missing result counts as
# bad, so a scrape target that disappears does not look healthy.
window: 28d
slos:
  # East's Wotan is off until S-E1-LIVE Evening 10B; plan 6 adds its target and says "both hosts" again.
  - name: wotan
    service: wotan
    description: The message bus answers on west
    objective: 99.5
    page: true
    good: avg(up{job="wotan"})
    checks: >-
      up{job="wotan"} in Prometheus says which host; docker ps / systemctl
      status unheaded-wotan there; its log ends with the reason it stopped.

  - name: dashboard
    service: dashboard-backend
    description: The dashboard answers on both hosts
    objective: 99.5
    page: true
    good: avg(up{job="dashboard-backend"})
    checks: >-
      up{job="dashboard-backend"} says which host; curl :20000/health there;
      it needs Wotan, so check the wotan SLO first.

  # ADR-147 SS4 (A, pack row 14): T = 0.005 s, the smallest bucket bound at or
  # above 3x the idle p99 over 24 h (S-SEE-AND-SURVIVE Phase 17). No traffic
  # counts as good; a missing 5xx series counts as none.
  - name: wotan-latency
    service: wotan
    description: Wotan answers 99% of requests in under 0.005 s (ADR-147 SS4, 3x idle p99)
    objective: 99.0
    page: false
    good: >-
      (sum(rate(unheaded_http_request_duration_seconds_bucket{job="wotan",le="0.005"}[5m]))
       / (sum(rate(unheaded_http_request_duration_seconds_count{job="wotan"}[5m])) > 0))
      or on() (sum(rate(unheaded_http_request_duration_seconds_count{job="wotan"}[5m])) == bool 0)
    checks: >-
      histogram_quantile(0.99, sum by (le, path) (rate(unheaded_http_request_duration_seconds_bucket{job="wotan"}[5m]))) names the path.

  - name: wotan-errors
    service: wotan
    description: Wotan answers 99.9% of requests without a 5xx
    objective: 99.9
    page: false
    good: >-
      (1 - (sum(rate(unheaded_http_requests_total{job="wotan",status=~"5.."}[5m])) or on() vector(0))
           / (sum(rate(unheaded_http_requests_total{job="wotan"}[5m])) > 0))
      or on() (sum(rate(unheaded_http_requests_total{job="wotan"}[5m])) == bool 0)
    checks: >-
      sum by (path, status) (rate(unheaded_http_requests_total{job="wotan",status=~"5.."}[5m])); docker logs unheaded-wotan --since 15m.

  # ADR-147 SS4 (A, pack row 14): T = 0.005 s, the smallest bucket bound at or
  # above 3x the idle p99 over 24 h (S-SEE-AND-SURVIVE Phase 17). No traffic
  # counts as good; a missing 5xx series counts as none.
  - name: dashboard-latency
    service: dashboard-backend
    description: The dashboard on west answers 99% of requests in under 0.005 s (ADR-147 SS4, 3x idle p99)
    objective: 99.0
    page: false
    good: >-
      (sum(rate(unheaded_http_request_duration_seconds_bucket{job="dashboard-backend",instance="[fd00:dead:beef::1]:20000",le="0.005"}[5m]))
       / (sum(rate(unheaded_http_request_duration_seconds_count{job="dashboard-backend",instance="[fd00:dead:beef::1]:20000"}[5m])) > 0))
      or on() (sum(rate(unheaded_http_request_duration_seconds_count{job="dashboard-backend",instance="[fd00:dead:beef::1]:20000"}[5m])) == bool 0)
    checks: >-
      histogram_quantile(0.99, sum by (le, path) (rate(unheaded_http_request_duration_seconds_bucket{job="dashboard-backend",instance="[fd00:dead:beef::1]:20000"}[5m]))) names the path.

  - name: dashboard-errors
    service: dashboard-backend
    description: The dashboard on west answers 99.9% of requests without a 5xx
    objective: 99.9
    page: false
    good: >-
      (1 - (sum(rate(unheaded_http_requests_total{job="dashboard-backend",instance="[fd00:dead:beef::1]:20000",status=~"5.."}[5m])) or on() vector(0))
           / (sum(rate(unheaded_http_requests_total{job="dashboard-backend",instance="[fd00:dead:beef::1]:20000"}[5m])) > 0))
      or on() (sum(rate(unheaded_http_requests_total{job="dashboard-backend",instance="[fd00:dead:beef::1]:20000"}[5m])) == bool 0)
    checks: >-
      sum by (path, status) (rate(unheaded_http_requests_total{job="dashboard-backend",instance="[fd00:dead:beef::1]:20000",status=~"5.."}[5m])); docker logs unheaded-dashboard --since 15m.

  - name: well
    service: postgres
    description: The Well accepts connections for every database
    objective: 99.5
    page: true
    good: min(huginn_pg_up)
    checks: >-
      huginn_pg_up by db; docker ps -a | grep postgres; docker logs
      unheaded-postgres | tail. Kanban and compliance fall back while it is down.

  - name: well-backups
    service: postgres
    description: A restorable copy of The Well is under a day old, on west and on east
    objective: 99.0
    page: false
    good: >-
      (time() - max(unheaded_well_backup_last_success_timestamp_seconds) < bool 26 * 3600)
      * (time() - max(unheaded_well_offsite_last_success_timestamp_seconds) < bool 26 * 3600)
      * (time() - max(unheaded_well_drill_last_success_timestamp_seconds) < bool 8 * 86400)
    checks: >-
      journalctl -u unheaded-well-backup / -offsite / -drill on west; the
      backup fails loudly while postgres is down (see the well SLO).

  - name: overlay
    service: wireguard
    description: West reaches east over the WireGuard overlay
    objective: 99.0
    page: false
    good: max(up{job="node_exporter",instance="[fd00:dead:beef::2]:9100"})
    checks: >-
      ping -c3 fd00:dead:beef::2; sudo wg show; sudo vtysh -c 'show bfd peers
      brief'; wiki/Overlay-Network.md.

  - name: log-shipping
    service: vector
    description: Journal lines reach ClickHouse
    objective: 99.0
    page: false
    good: sum(increase(vector_component_sent_events_total{job="vector",component_id="clickhouse"}[30m])) > bool 0
    checks: >-
      docker logs unheaded-vector | tail; vector_component_errors_total by
      component; is unheaded-clickhouse up.

  - name: kev-feed
    service: kev-poller
    description: The CISA KEV catalog is under six hours old on at least one host
    objective: 99.0
    page: false
    good: time() - max(unheaded_kev_last_success_timestamp_seconds) < bool 6 * 3600
    checks: >-
      systemctl status unheaded-kev-poller on each host; curl :19120/health;
      CISA's feed itself may be down.

  # ADR-100 Phase 4: the clippy job was red on develop for nine days in
  # September and nobody was told (docs/incidents/2026-09-21-ci-clippy-red-on-develop.md).
  # unheaded-ci-status.timer on west writes the SLI from the public Actions
  # API every 10 minutes; data over 2 h old counts as red.
  # ADR-147 decision 4 (Stevie, 2026-11-15): out of the alert set until CI is fixed. Recorded, not notified.
  - name: ci-develop
    service: github-actions
    description: Every workflow's latest finished run on develop is green
    objective: 99.0
    page: false
    notify: false
    good: >-
      min(unheaded_ci_run_success)
      * (time() - max(unheaded_ci_run_checked_timestamp_seconds) < bool 7200)
    checks: >-
      unheaded_ci_run_success == 0 names the workflow; the Actions API lists
      its failing run and step; reproduce the job in a clean clone.
    runbook: runbooks/observe/ci-red.yaml

  # ADR-147 decision 6: ClickHouse (audit logs, 455 days) and VictoriaMetrics
  # get nightly sets and a weekly restore drill, like the Well.
  - name: store-backups
    service: backups
    description: A restorable copy of ClickHouse and of VictoriaMetrics is under a day old
    objective: 99.0
    page: false
    good: >-
      (time() - max(unheaded_store_backup_last_success_timestamp_seconds{store="clickhouse"}) < bool 26 * 3600)
      * (time() - max(unheaded_store_backup_last_success_timestamp_seconds{store="victoria"}) < bool 26 * 3600)
      * (time() - max(unheaded_store_drill_last_success_timestamp_seconds{store="clickhouse"}) < bool 8 * 86400)
      * (time() - max(unheaded_store_drill_last_success_timestamp_seconds{store="victoria"}) < bool 8 * 86400)
    checks: >-
      journalctl -u unheaded-clickhouse-backup -u unheaded-victoria-backup -u unheaded-store-drill
      on west; cat /srv/backups/unheaded-{clickhouse,victoria}/LATEST.
    runbook: runbooks/data/store-backup-late.yaml
