# Wotan service configuration
# Controls topic pub/sub behavior including subscriber auto-approval.
#
# Usage:
#   wotan --topic-config configs/wotan.yaml
#   WOTAN_TOPIC_CONFIG=configs/wotan.yaml wotan

topics:
  # Callers approved at once on subscribe and on an unnamed publish.
  #
  # With AUTH_ENABLED=true (S-IRON-GATE Phase 7, ADR-103 §6) these are
  # service identities: the verified sub of the caller's EdDSA service token,
  # the name its key is filed under (unheaded-keygen <name>; Cuirass is
  # unheaded-daemon). The display_name a client sends is a label only. Every
  # caller must also be in Wotan's AUTH_ALLOW_CALLERS (docker-compose.yml,
  # deploy/systemd/unheaded-wotan.service) or it gets 403 before this list
  # is read. Any other authenticated caller's subscription stays "pending"
  # until approved through the admin API (POST /api/v1/admin/approve, off
  # unless Wotan runs with --admin).
  #
  # With auth off, the self-reported display_name is matched against this
  # list and legacy_display_names below.
  #
  # Use "*" to auto-approve all callers (not recommended for production).
  auto_approve:
    - "akira"                # system.health.* consensus (cmd/akira)
    - "alert-mailer"         # alerts.critical, signed (ALERTS_SIGNING_KEY_FILE; ADR-147 Phase 8)
    - "anomaly"              # anomaly.* consumer and anomaly.scores bridge (cmd/anomaly, ADR-108)
    - "chaos-controller"     # chaos.* events and the chaos.abort path (ADR-107)
    - "dashboard-backend"
    - "ebpf-collector"       # ebpf.packet.events / ebpf.latency.events (cmd/ebpf-collector, Rust; no unit or compose service yet)
    - "gateway"              # gateway.requests and the alerts.critical subscription every service keeps (services/gateway)
    - "heimdall"             # drift.detected.<node> (signed; drift. keys decide what is taken)
    - "kanban-app"
    - "kev-poller"           # threats.cisa-kev.{updates,delta} (ADR-055)
    - "loadbalancer"         # services/loadbalancer xdpsync: lb.* topics (library; no binary yet)
    - "perf-benchmark"       # cmd/perf-benchmark -scenario e2e-trace: bench.perf.packet only (S-WELL-SPRING Phase 10)
    - "sword"                # deploy.{started,progress,succeeded,failed,rolled_back} (S-REAL-STEEL)
    - "timeguru"
    - "trace-collector"
    - "unheaded-baseline"    # compliance.deviation.<host> from the host baseline agent (ADR-098)
    - "unheaded-cli"
    - "unheaded-daemon"      # Cuirass: cuirass.drift / cuirass.metrics / cuirass.chaos
    - "upc-cartridgectl"     # upc.cart.weights.<model>: signed int8 weights for the anomaly cartridge (weights publish|fetch, ADR-108)
    - "zhen-agentd"          # zhen.llm.requests / zhen.audit.toolcalls / zhen.confirm.pending (S-TWO-BRAINS)
    - "zhen-claude"          # same topics, the Claude side

  # Display names approved ONLY while AUTH_ENABLED is off: the names clients
  # sent before Phase 7, kept so turning Wotan's auth off (Appendix A3 of the
  # S-IRON-GATE plan) restores the old behaviour. A verified identity never
  # matches them. Delete once auth is on everywhere (west and east).
  legacy_display_names:
    - "service"              # the default display_name of an unnamed caller
    - "dashboard"
    - "kanban"
    - "kanban-app-timeline"
    - "daemon"
    - "cuirass"
    - "anomaly-service"
    - "wiki"
    - "zhenai"
    - "zhen-eval"
    - "runbook-runner"       # scripts/run-runbook.py's display_name; with auth on it presents zhen-agentd's key (Champion runs) or unheaded-cli's (by hand)

  # ML-DSA-65 public keys (base64) trusted to sign config.* messages
  # (ADR-043 #2). config.* is published only over gRPC, signed by one of
  # these; the key a publisher sends is checked against this list, never
  # trusted on its own. Empty: every config.* publish is refused.
  signing_keys: []

  # Further signed topic prefixes, each with the ML-DSA-65 public keys
  # (base64) trusted for that prefix only (ADR-105). A key here signs
  # nothing outside its prefix, and config.* keys stay in signing_keys.
  # drift.* (Heimdall drift alerts, drift.detected.<node_id>) is signed
  # whether or not it is listed; with no keys every drift.* publish is
  # refused. Enrolling a Heimdall node's drift key is Stevie's call
  # (S-QUANTUM-ARMOR E5): its public key goes in drift.'s keys, e.g.
  #   - prefix: "drift."
  #     keys: ["<base64 ML-DSA-65 public key of heimdall on east>"]
  # Prefixes end in "."; the longest matching prefix decides. A prefix also
  # covers its stem: "alerts.critical." signs the topic alerts.critical.
  #
  # S-IRON-GATE Phase 9 (M-053): audit.*, Akira's two health outputs and
  # alerts.critical are signed too. keys: [] means every publish there is
  # refused: enrol per deployment (E2 pattern), never in this file's
  # checked-in copy. Generate the key on the producer's host
  # (unheaded-keygen -algo mldsa65 -owner <account> <name>), paste the
  # base64 public key it prints into that prefix's keys, restart Wotan
  # (runbooks/security/heimdall-enrol-drift-key.yaml shows the steps for
  # drift.). Producers read their key from AUDIT_SIGNING_KEY_FILE /
  # HEALTH_SIGNING_KEY_FILE (0400) and refuse to publish these topics
  # without one, never sending them unsigned. alerts.* as a whole is not
  # signed (unsigned service alerts live there); system.health.reports is
  # not signed: every service votes there, and Akira takes the reporter from
  # the verified_sender Wotan stamps on the message (pkg/healthreport.Admit).
  signed_prefixes:
    - prefix: "drift."
      keys: []
    - prefix: "audit."                     # no first-party producer yet
      keys: []
    - prefix: "alerts.critical."           # alert-mailer publishes (ALERTS_SIGNING_KEY_FILE); every service on the bus subscribes
      keys: []
    - prefix: "system.health.consensus."   # Akira's band changes (HEALTH_SIGNING_KEY_FILE)
      keys: []
    - prefix: "system.health.remediate."   # Akira's remediation suggestions (HEALTH_SIGNING_KEY_FILE)
      keys: []

  # Per-identity topic access (FND-043, 2026-11-11). Without this section
  # any approved caller could stream every topic, "#" included, and read
  # any topic's messages over HTTP. With it a verified service identity may
  # subscribe to, stream and read only the patterns under its subscribe list
  # and publish only to its publish list (a service may always read what it
  # may publish). An identity this section does not name gets what unlisted
  # says. It applies to EdDSA service tokens only; with auth off there is no
  # identity and the section does not apply. Reloaded on SIGHUP.
  #
  # Entries are topic patterns: a topic, "a.*" (one segment), "a.#" (one or
  # more segments), "#" (everything). A subscription pattern is allowed only
  # when an entry covers every topic it could match: "tasks.#" is not
  # allowed by "tasks.*".
  #
  # mode: audit lets every call through and logs and counts what enforce
  # would refuse (topic_permission_refused_audit_only,
  # unheaded_wotan_topic_permission_refusals_total{outcome="audited"}).
  # Run a new list in audit first, read the log, then set enforce.
  #
  # The lists below were taken from the code on 2026-11-11 (every
  # Subscribe/Publish call per binary, plus pkg/discovery, pkg/healthreport
  # and pkg/logagg, which every service that uses them joins). Two common
  # sets: "D+H" is system.discovery and system.health.reports; "logs" is
  # logs.<identity>.<level>.
  permissions:
    unlisted: deny
    mode: enforce
    services:
      akira:
        subscribe: ["alerts.critical"]
        publish: ["system.health.reports", "system.health.consensus", "system.health.remediate"]
      alert-mailer:
        publish: ["alerts.critical"]
      anomaly:
        subscribe: ["anomaly.baseline", "alerts.critical"]
        publish: ["anomaly.alerts", "anomaly.scores"]
      chaos-controller:
        subscribe: ["chaos.abort", "alerts.critical"]
        publish: ["chaos.experiment.started", "chaos.experiment.completed", "chaos.refused", "chaos.revert_failed", "chaos.schedules", "system.discovery", "system.health.reports"]
      dashboard-backend:
        # The human-facing aggregator, on its one Wotan client (ADR-147
        # Phase 7): the event streamer reads timeline.*, tasks.*,
        # system.health.consensus and traces.*; the eBPF ingestor
        # ebpf.*.events, compute.*, anamnesis.* and bench.perf.packet; the
        # health persister system.health.reports. metrics.*, health.*,
        # alerts.*, decisions.*, state.* and architecture.* went (no
        # running publisher), and with them "#".
        subscribe: ["alerts.critical", "timeline.*", "tasks.*", "system.health.consensus", "system.health.reports", "traces.*", "ebpf.*.events", "compute.*", "anamnesis.*", "bench.perf.packet"]
        publish: ["system.discovery", "system.health.reports", "logs.dashboard-backend.*"]
      ebpf-collector:
        publish: ["ebpf.packet.events", "ebpf.latency.events"]
      gateway:
        # On auto_approve since 2026-11-12 (Stevie); before that its
        # subscriptions stayed pending.
        subscribe: ["alerts.critical"]
        publish: ["gateway.requests"]
      heimdall:
        publish: ["drift.detected.*"]
      kanban-app:
        subscribe: ["tasks.*", "timeline.updates", "runbooks.progress", "alerts.critical"]
        publish: ["tasks.created", "tasks.updated", "tasks.deleted", "system.discovery", "system.health.reports", "logs.kanban-app.*"]
      kev-poller:
        subscribe: ["alerts.critical"]
        publish: ["threats.cisa-kev.updates", "threats.cisa-kev.delta"]
      perf-benchmark:
        publish: ["bench.perf.packet"]
      sword:
        subscribe: ["alerts.critical"]
        publish: ["deploy.started", "deploy.progress", "deploy.succeeded", "deploy.failed", "deploy.rolled_back", "system.discovery", "system.health.reports"]
      timeguru:
        subscribe: ["alerts.critical"]
        publish: ["timeline.updates", "system.discovery", "system.health.reports", "logs.timeguru.*"]
      trace-collector:
        subscribe: ["alerts.critical"]
        publish: ["traces.*", "ebpf.*.events", "anamnesis.*", "system.discovery", "system.health.reports", "logs.trace-collector.*"]
      unheaded-baseline:
        publish: ["compliance.deviation.*"]
      unheaded-cli:
        # The operator's key: the demo trace injector, scripts/run-runbook.py
        # by hand, and the chaos abort nothing in the repo publishes yet.
        publish: ["ebpf.*.events", "runbooks.progress", "chaos.abort"]
      unheaded-daemon:
        subscribe: ["alerts.critical"]
        publish: ["cuirass.drift", "cuirass.metrics", "cuirass.chaos", "system.discovery", "system.health.reports", "logs.unheaded-daemon.*"]
      upc-cartridgectl:
        # weights subcommand only: publish writes a model's topic and fetch
        # reads it back (a service may read what it may publish). On
        # auto_approve and AUTH_ALLOW_CALLERS since 2026-11-12 (Stevie).
        publish: ["upc.cart.weights.*"]
      zhen-agentd:
        publish: ["zhen.llm.requests", "zhen.audit.toolcalls", "zhen.confirm.pending", "zhen.agent.report", "zhen.agent.runs", "zhen.scheduler.heartbeat", "runbooks.progress"]
      zhen-claude:
        publish: ["zhen.llm.requests", "zhen.audit.toolcalls", "zhen.confirm.pending"]

# Message store. Wotan is an in-memory store (ADR-005): memory is the default
# and what production runs. wal is an opt-in write-ahead log on local disk,
# for debugging or a deliberate need to survive restarts; a wal store that
# cannot open stops startup. There is no PostgreSQL or hybrid store
# (removed 2026-11-09, ADR-035 amendment).
# The binary takes these from --store-type and --store-data-dir; this
# section records the deployment's choice and is not read by Wotan.
store:
  type: memory       # or "wal" (opt-in)
  # data_dir: /var/lib/unheaded/wotan/wal    # WAL directory (wal only)

# Cluster configuration (Wave 9 — The Twin Ravens)
# Options: standalone (default), cluster
cluster:
  mode: standalone   # Change to "cluster" for active-passive replication
  # role: primary    # primary (WEST) or standby (EAST)
  # node_id: west
  # peer_addr: east:18002
  # replication_port: 18002
  # pki_dir: /var/lib/unheaded/pki
