# Wotan service configuration
# Controls topic pub/sub behavior including subscriber auto-approval.
#
# Usage:
#   wotan --topic-config configs/wotan.yaml
#   WOTAN_TOPIC_CONFIG=configs/wotan.yaml wotan

topics:
  # Callers approved at once on subscribe and on an unnamed publish.
  #
  # With AUTH_ENABLED=true (S-IRON-GATE Phase 7, ADR-103 §6) these are
  # service identities: the verified sub of the caller's EdDSA service token,
  # the name its key is filed under (unheaded-keygen <name>; Cuirass is
  # unheaded-daemon). The display_name a client sends is a label only. Every
  # caller must also be in Wotan's AUTH_ALLOW_CALLERS (docker-compose.yml,
  # deploy/systemd/unheaded-wotan.service) or it gets 403 before this list
  # is read. Any other authenticated caller's subscription stays "pending"
  # until approved through the admin API (POST /api/v1/admin/approve, off
  # unless Wotan runs with --admin).
  #
  # With auth off, the self-reported display_name is matched against this
  # list and legacy_display_names below.
  #
  # Use "*" to auto-approve all callers (not recommended for production).
  auto_approve:
    - "akira"                # system.health.* consensus (cmd/akira)
    - "anomaly"              # anomaly.* consumer and anomaly.scores bridge (cmd/anomaly, ADR-108)
    - "architect"
    - "captain"
    - "chaos-controller"     # chaos.* events and the chaos.abort path (ADR-107)
    - "dashboard-backend"
    - "ebpf-collector"       # ebpf.packet.events / ebpf.latency.events (cmd/ebpf-collector, Rust; no unit or compose service yet)
    - "heimdall"             # drift.detected.<node> (signed; drift. keys decide what is taken)
    - "kanban-app"
    - "kev-poller"           # threats.cisa-kev.{updates,delta} (ADR-055)
    - "loadbalancer"         # services/loadbalancer xdpsync: lb.* topics (library; no binary yet)
    - "micromanager"
    - "monad"
    - "perf-benchmark"       # cmd/perf-benchmark -scenario e2e-trace: bench.perf.packet only (S-WELL-SPRING Phase 10)
    - "sophia"
    - "sword"                # deploy.{started,progress,succeeded,failed,rolled_back} (S-REAL-STEEL)
    - "timeguru"
    - "trace-collector"
    - "unheaded-baseline"    # compliance.deviation.<host> from the host baseline agent (ADR-098)
    - "unheaded-cli"
    - "unheaded-daemon"      # Cuirass: cuirass.drift / cuirass.metrics / cuirass.chaos
    - "zhen-agentd"          # zhen.llm.requests / zhen.audit.toolcalls / zhen.confirm.pending (S-TWO-BRAINS)
    - "zhen-claude"          # same topics, the Claude side

  # Display names approved ONLY while AUTH_ENABLED is off: the names clients
  # sent before Phase 7, kept so turning Wotan's auth off (Appendix A3 of the
  # S-IRON-GATE plan) restores the old behaviour. A verified identity never
  # matches them. Delete once auth is on everywhere (west and east).
  legacy_display_names:
    - "service"              # the default display_name of an unnamed caller
    - "architect-service"
    - "micromanager-service"
    - "monad-service"
    - "sophia-service"
    - "dashboard"
    - "kanban"
    - "kanban-app-timeline"
    - "daemon"
    - "cuirass"
    - "anomaly-service"
    - "anomaly-bridge"
    - "wiki"
    - "zhenai"
    - "zhen-eval"
    - "runbook-runner"       # scripts/run-runbook.py (Python; mints no token, so refused with auth on)

  # ML-DSA-65 public keys (base64) trusted to sign config.* messages
  # (ADR-043 #2). config.* is published only over gRPC, signed by one of
  # these; the key a publisher sends is checked against this list, never
  # trusted on its own. Empty: every config.* publish is refused.
  signing_keys: []

  # Further signed topic prefixes, each with the ML-DSA-65 public keys
  # (base64) trusted for that prefix only (ADR-105). A key here signs
  # nothing outside its prefix, and config.* keys stay in signing_keys.
  # drift.* (Heimdall drift alerts, drift.detected.<node_id>) is signed
  # whether or not it is listed; with no keys every drift.* publish is
  # refused. Enrolling a Heimdall node's drift key is Stevie's call
  # (S-QUANTUM-ARMOR E5): its public key goes in drift.'s keys, e.g.
  #   - prefix: "drift."
  #     keys: ["<base64 ML-DSA-65 public key of heimdall on east>"]
  # Prefixes end in "."; the longest matching prefix decides.
  signed_prefixes:
    - prefix: "drift."
      keys: []

# Persistent store configuration (Wave 9)
# Options: memory (default), wal, postgres, hybrid
# Hybrid = WAL write-ahead + PostgreSQL durable (recommended for production)
store:
  type: memory       # Change to "hybrid" for production persistence
  # data_dir: /var/lib/unheaded/wotan/wal    # WAL directory (wal/hybrid)
  # conn_str: postgres://<role>:<password>@localhost:5432/<db>?sslmode=require  (never commit a real one)

# Cluster configuration (Wave 9 — The Twin Ravens)
# Options: standalone (default), cluster
cluster:
  mode: standalone   # Change to "cluster" for active-passive replication
  # role: primary    # primary (WEST) or standby (EAST)
  # node_id: west
  # peer_addr: east:18002
  # replication_port: 18002
  # pki_dir: /var/lib/unheaded/pki
