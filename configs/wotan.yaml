# Wotan service configuration
# Controls topic pub/sub behavior including subscriber auto-approval.
#
# Usage:
#   wotan --topic-config configs/wotan.yaml
#   WOTAN_TOPIC_CONFIG=configs/wotan.yaml wotan

topics:
  # Subscribers with these display_name values are auto-approved on subscribe.
  # All other subscribers remain in "pending" status until manually approved
  # via the admin API (POST /api/v1/admin/approve).
  #
  # Use "*" to auto-approve all subscribers (not recommended for production).
  auto_approve:
    - "service"          # default display_name for internal services
    - "timeguru"
    - "captain"
    - "architect"
    - "architect-service"    # architect's alerts.critical / architecture.updates subscriptions
    - "micromanager"
    - "micromanager-service" # micromanager's alerts.critical subscription
    - "monad"
    - "sophia"
    - "dashboard"
    - "dashboard-backend"
    - "kanban"
    - "kanban-app"        # logagg display name
    - "daemon"
    - "unheaded-daemon"   # logagg display name
    - "cuirass"           # unheaded-daemon's cuirass.drift / cuirass.metrics publisher
    - "trace-collector"
    - "chaos-controller"      # service discovery display name (system.discovery)
    - "kev-poller"            # threats.cisa-kev.{updates,delta} (ADR-055)
    - "sword"                 # deploy.{started,progress,succeeded,failed,rolled_back} (S-REAL-STEEL)
    - "sophia-service"        # sophia's own gRPC display name (not "sophia")
    - "monad-service"         # monad's own gRPC display name (not "monad")
    - "kanban-app-timeline"   # kanban's timeline subscription
    - "wiki"
    - "akira"
    - "zhenai"
    - "zhen-claude"          # zhen.llm.requests / zhen.audit.toolcalls / zhen.confirm.pending (S-TWO-BRAINS)
    - "zhen-agentd"          # same topics, the local brain
    - "zhen-eval"            # zhen.llm.requests from the two-brains eval

  # ML-DSA-65 public keys (base64) trusted to sign config.* messages
  # (ADR-043 #2). config.* is published only over gRPC, signed by one of
  # these; the key a publisher sends is checked against this list, never
  # trusted on its own. Empty: every config.* publish is refused.
  signing_keys: []

  # Further signed topic prefixes, each with the ML-DSA-65 public keys
  # (base64) trusted for that prefix only (ADR-105). A key here signs
  # nothing outside its prefix, and config.* keys stay in signing_keys.
  # drift.* (Heimdall drift alerts, drift.detected.<node_id>) is signed
  # whether or not it is listed; with no keys every drift.* publish is
  # refused. Enrolling a Heimdall node's drift key is Stevie's call
  # (S-QUANTUM-ARMOR E5): its public key goes in drift.'s keys, e.g.
  #   - prefix: "drift."
  #     keys: ["<base64 ML-DSA-65 public key of heimdall on east>"]
  # Prefixes end in "."; the longest matching prefix decides.
  signed_prefixes:
    - prefix: "drift."
      keys: []

# Persistent store configuration (Wave 9)
# Options: memory (default), wal, postgres, hybrid
# Hybrid = WAL write-ahead + PostgreSQL durable (recommended for production)
store:
  type: memory       # Change to "hybrid" for production persistence
  # data_dir: /var/lib/unheaded/wotan/wal    # WAL directory (wal/hybrid)
  # conn_str: postgres://<role>:<password>@localhost:5432/<db>?sslmode=require  (never commit a real one)

# Cluster configuration (Wave 9 — The Twin Ravens)
# Options: standalone (default), cluster
cluster:
  mode: standalone   # Change to "cluster" for active-passive replication
  # role: primary    # primary (WEST) or standby (EAST)
  # node_id: west
  # peer_addr: east:18002
  # replication_port: 18002
  # pki_dir: /var/lib/unheaded/pki
