# Doom-over-IPv6 Configuration
# All tunables for the BPF-based DOOM compute ring.

[bridge]
# WebSocket server port for doom-bridge
port = 16666
# BPF map base path
map_base = "/sys/fs/bpf/unheaded/doom-ring/maps"
# Screen read interval (framebuffer polling)
screen_fps = 60
# CPU/stats polling interval
stats_fps = 2
# Enable dry-run mode (synthetic frames, no BPF maps required)
dry_run = false
# Static file directory for doom viewer HTML
static_dir = "dashboard"

[maps]
# Pinned BPF map paths (relative to map_base)
screen = "SCREEN_MAP"
cpu = "CPU_MAP"
kbd = "KBD_MAP"
stats = "STATS"
rom = "ROM_MAP"
ram = "RAM_MAP"
rv2mbc = "RV2MBC_MAP"

[screen]
# Framebuffer dimensions (VGA mode 13h)
width = 320
height = 200
# Palette: 256-color VGA (built into doom-bridge)

[cpu]
# Default CPU instance ID
instance = 0xDE
# Initial stack pointer (must fit in 16M entry array)
initial_sp = 0x3F00000
# CPU state size (must match bpf.CpuStateSize)
state_size = 104

[keyboard]
# Bitmap size (256-bit = 32 bytes)
bitmap_size = 32
# Sequence counter size (8 bytes)
sequence_size = 8
# Total KBD_MAP value size (bitmap + sequence)
value_size = 40
# Write slot (single-slot keyboard map)
slot = 0

[loader]
# Batch size for bulk BPF map writes
batch_size = 10000
# ROM file path
rom_file = "doom/doom.mbc"
# WAD file path
wad_file = "doom/doom1.wad"
# RV2MBC translation table
rv2mbc_file = "doom/doom.rv2mbc"

[injector]
# Doom ring packet injection interface
interface = "eth0"
# Injection mode: "steady", "burst", "fast"
mode = "steady"
# Steady-mode delay between packets (microseconds)
steady_delay_us = 16667
# Burst-mode batch size
burst_size = 100

[performance]
# Target: 60 FPS sustained
target_fps = 60
# Maximum BPF map write throughput (entries/sec)
max_write_rate = 500000
# Screen buffer: 64000 entries (320x200)
screen_entries = 64000
