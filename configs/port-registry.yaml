# Unheaded Port Registry — "The Doom Range" (16666-26666)
# Source of truth: pkg/ports/ports.go
# This YAML is for container configs and non-Go consumers.

infrastructure:
  doom-bridge:           { port: 16666, proto: websocket, lore_name: bifrost }
  doom-go-injector:      { port: 16667, proto: tcp,       lore_name: mjolnir }
  trace-collector-http:  { port: 16670, proto: http,      lore_name: vambraces }
  trace-collector-metrics: { port: 16671, proto: http,    lore_name: vambraces }
control-plane:
  unheaded-daemon-http:  { port: 17000, proto: http,      lore_name: aegis }
  unheaded-daemon-grpc:  { port: 17001, proto: grpc,      lore_name: aegis }
  unheaded-cli:          { port: 17010, proto: http,      lore_name: crown }
wotan:
  wotan-http:            { port: 18000, proto: http,      lore_name: wotan }
  wotan-grpc:            { port: 18001, proto: grpc,      lore_name: wotan }
services:
  # 19001-19005 retired 2026-11 (ADR-147 decision 7). Not reused.
  timeguru:              { port: 19000, proto: http,      lore_name: hourglass }
  cuirass:               { port: 19006, proto: http,      lore_name: cuirass }
applications:
  dashboard-backend:     { port: 20000, proto: http,      lore_name: visor }
  kanban-app:            { port: 20001, proto: http,      lore_name: herald }
  wiki-server:           { port: 20002, proto: http,      lore_name: codex }
gateway:
  gateway-http:          { port: 21000, proto: http,      lore_name: portcullis }
  gateway-https:         { port: 21443, proto: https,     lore_name: portcullis }
utilities:
  cert-gen:              { port: 22000, proto: http,      lore_name: sigil }
user:
  reserved:              { range: "26000-26666" }
