# Prometheus telemetry aggregator for Unheaded Kingdom
# Static IP: 10.20.1.50, Port: 9090

name: unheaded-prometheus
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "2"
  limits.memory: "4GB"
  
  # Static network configuration
  cloud-init.network-config: |
    version: 2
    ethernets:
      eth0:
        dhcp4: false
        addresses:
          - 10.20.1.50/24
        gateway4: 10.20.1.1
        nameservers:
          addresses: [8.8.8.8, 8.8.4.4]

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 20GB
    type: disk

  # Prometheus config bind mount from host
  prometheus-config:
    type: disk
    source: /etc/unheaded/prometheus
    path: /etc/prometheus
    readonly: false

# Cloud-init to install and configure Prometheus
cloud-init.user-data: |
  #cloud-config
  package_update: true
  packages:
    - curl
    - wget
    - net-tools

  runcmd:
    - apt-get update
    - apt-get install -y prometheus
    - systemctl enable prometheus
    - systemctl start prometheus

