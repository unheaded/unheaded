# SPDX-License-Identifier: MIT
# Loki distributed log aggregation
# Static IP: 10.20.1.52, Port: 3100
# 4GB memory, 20GB storage, 90d retention

name: unheaded-loki
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "2"
  limits.memory: "4GB"
  
  # Static network configuration
  cloud-init.network-config: |
    version: 2
    ethernets:
      eth0:
        dhcp4: false
        addresses:
          - 10.20.1.52/24
        gateway4: 10.20.1.1
        nameservers:
          addresses: [8.8.8.8, 8.8.4.4]

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 20GB
    type: disk

cloud-init.user-data: |
  #cloud-config
  package_update: true
  packages:
    - curl
    - wget
    - net-tools
    - ca-certificates

  runcmd:
    - mkdir -p /opt/loki /var/lib/loki /etc/loki
    - |
      curl -L https://github.com/grafana/loki/releases/download/v2.9.5/loki-linux-amd64.zip \
        -o /tmp/loki.zip
    - cd /tmp && unzip loki.zip && mv loki-linux-amd64 /opt/loki/loki && chmod +x /opt/loki/loki
    - |
      cat > /etc/loki/loki.yml << 'LOKI'
      auth_enabled: false

      ingester:
        chunk_idle_period: 3m
        chunk_retain_period: 1m
        max_chunk_age: 1h
        chunk_size_bytes: 1048576
        max_concurrent_pushes: 10
        rate_limit_bytes: 16777216
        limits_config:
          ingestion_burst_size_mb: 20
          ingestion_rate_mb: 16

      limits_config:
        retention_period: 2160h
        split_queries_by_interval: 24h
        max_streams_per_user: 10000
        max_global_streams_per_user: 10000

      schema_config:
        configs:
          - from: 2023-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096
        log_level: info

      storage_config:
        filesystem:
          directory: /var/lib/loki
        tsdb_shipper:
          active_index_directory: /var/lib/loki/tsdb-shipper-active
          shared_store: filesystem
          cache_location: /var/lib/loki/tsdb-shipper-cache
      LOKI
    - |
      cat > /etc/systemd/system/loki.service << 'SYSCTL'
      [Unit]
      Description=Loki
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/opt/loki/loki -config.file=/etc/loki/loki.yml
      Restart=on-failure
      RestartSec=5s
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=loki

      [Install]
      WantedBy=multi-user.target
      SYSCTL
    - systemctl daemon-reload
    - systemctl enable loki
    - systemctl start loki
