# SPDX-License-Identifier: MIT
# vLLM + ROCm container for DeepSeek-R1-7B on RX 7700 XT
# 8 CPU cores, 16GB RAM, 80GB storage
# Port: 20100

name: unheaded-vllm-deepseek
image: ubuntu:22.04

profiles:
  - unheaded-base
  - unheaded-gpu

config:
  limits.cpu: "8"
  limits.memory: "16GB"
  limits.memory.swap: "false"

  # ROCm environment variables
  environment.HSA_OVERRIDE_GFX_VERSION: "11.0.1"
  environment.PYTORCH_ROCM_ARCH: "gfx1101"
  environment.HIP_VISIBLE_DEVICES: "0"
  environment.VLLM_MODEL: "deepseek-ai/DeepSeek-R1-Distill-Llama-7B"
  environment.VLLM_QUANTIZATION: "awq"
  environment.VLLM_PORT: "20100"
  environment.VLLM_HOST: "0.0.0.0"
  environment.VLLM_MAX_MODEL_LEN: "8192"
  environment.VLLM_GPU_MEMORY_UTILIZATION: "0.85"
  environment.ROCM_VERSION: "6.1.3"

  # Static network configuration
  cloud-init.network-config: |
    version: 2
    ethernets:
      eth0:
        dhcp4: false
        addresses:
          - 10.20.1.99/24
        gateway4: 10.20.1.1
        nameservers:
          addresses: [8.8.8.8, 8.8.4.4]

  # Autostart after 30 seconds with priority 5
  boot.autostart: "true"
  boot.autostart.delay: "30"
  boot.autostart.priority: "5"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 80GB
    type: disk

  # GPU passthrough (RX 7700 XT)
  gpu:
    type: gpu
    uid: "10001"
    gid: "44"

  # AMD KFD (Kernel Fusion Driver)
  kfd:
    type: unix-char
    source: /dev/kfd
    path: /dev/kfd
    uid: "10001"
    gid: "44"
    mode: "0660"

  # DRI render device for AMD GPU
  renderD128:
    type: unix-char
    source: /dev/dri/renderD128
    path: /dev/dri/renderD128
    uid: "10001"
    gid: "44"
    mode: "0660"

  # Shared memory for model inference
  shm:
    type: disk
    source: tmpfs
    path: /dev/shm
    size: 4GB

  # Model weights storage (HDD — large capacity, slow OK for model load)
  models:
    type: disk
    source: /data/unheaded/models
    path: /models
    readonly: false

cloud-init.user-data: |
  #cloud-config
  package_update: true
  packages:
    - curl
    - wget
    - git
    - python3
    - python3-pip
    - build-essential
    - libhip-dev
    - hipcc

  runcmd:
    # Install ROCm
    - wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key | apt-key add -
    - apt-get update
    - apt-get install -y rocm-core rocm-dkms
    - usermod -a -G render,video ubuntu

    # Create vllm user for service
    - useradd -m -s /bin/bash vllm 2>/dev/null || true
    - usermod -a -G render,video vllm

    # Install PyTorch with ROCm
    - pip3 install --upgrade pip
    - |
      pip3 install torch torchvision torchaudio \
        --index-url https://download.pytorch.org/whl/rocm6.1 \
        --no-cache-dir

    # Install vLLM
    - pip3 install vllm[rocm] xformers

    # Create vLLM systemd service
    - |
      cat > /etc/systemd/system/vllm.service << 'SYSCTL'
      [Unit]
      Description=vLLM DeepSeek-R1 Inference Server
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=vllm
      Group=vllm
      Environment="PATH=/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin"
      Environment="HSA_OVERRIDE_GFX_VERSION=11.0.1"
      Environment="PYTORCH_ROCM_ARCH=gfx1101"
      Environment="HIP_VISIBLE_DEVICES=0"
      ExecStart=/usr/local/bin/python3 -m vllm.entrypoints.openai.api_server \
        --model deepseek-ai/DeepSeek-R1-Distill-Llama-7B \
        --quantization awq \
        --host 0.0.0.0 \
        --port 20100 \
        --max-model-len 8192 \
        --gpu-memory-utilization 0.85 \
        --tensor-parallel-size 1 \
        --pipeline-parallel-size 1
      Restart=on-failure
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=vllm

      [Install]
      WantedBy=multi-user.target
      SYSCTL

    - systemctl daemon-reload
    - systemctl enable vllm
    - systemctl start vllm
