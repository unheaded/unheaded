# lxd/containers/lore.yaml
# Lore knowledge management container definition

name: unheaded-lore
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "1"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.LORE_PORT: "50063"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "lore"
  user.tier: "knowledge"
  user.port: "50063"
  user.description: "Lore knowledge management service"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "35"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-lore:
    type: disk
    source: /opt/unheaded/bin/lore
    path: /opt/unheaded/bin/lore
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/lore
    path: /var/lib/unheaded/lore
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded Lore — knowledge management service"
