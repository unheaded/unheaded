# lxd/containers/unheaded-daemon.yaml
# Unheaded daemon container definition

name: unheaded-daemon
image: ubuntu:24.04

profiles:
  - unheaded-base
  - unheaded-ebpf

config:
  limits.cpu: "4"
  limits.memory: "1GB"
  limits.memory.swap: "false"
  
  environment.UNHEADED_DAEMON_PORT: "9100"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "unheaded-daemon"
  user.tier: "control"
  user.port: "9100"
  user.description: "Unheaded daemon control and metrics"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "84"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 10GB
    type: disk
  bin-unheaded-daemon:
    type: disk
    source: /opt/unheaded/bin/unheaded-daemon
    path: /opt/unheaded/bin/unheaded-daemon
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/daemon
    path: /var/lib/unheaded/daemon
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded daemon — control plane and metrics service"
