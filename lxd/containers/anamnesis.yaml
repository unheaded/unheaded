# lxd/containers/anamnesis.yaml
# Anamnesis memory service container definition

name: unheaded-anamnesis
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "2"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.ANAMNESIS_PORT: "50054"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "anamnesis"
  user.tier: "protocol"
  user.port: "50054"
  user.description: "Anamnesis memory and state service"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "88"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-anamnesis:
    type: disk
    source: /opt/unheaded/bin/anamnesis
    path: /opt/unheaded/bin/anamnesis
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/anamnesis
    path: /var/lib/unheaded/anamnesis
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded Anamnesis — memory and state service"
