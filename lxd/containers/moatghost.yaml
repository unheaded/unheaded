# lxd/containers/moatghost.yaml
# MoatGhost compliance container definition

name: unheaded-moatghost
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "2"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.MOATGHOST_PORT: "50067"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "moatghost"
  user.tier: "compliance"
  user.port: "50067"
  user.description: "MoatGhost compliance auditing service"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "30"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-moatghost:
    type: disk
    source: /opt/unheaded/bin/moatghost
    path: /opt/unheaded/bin/moatghost
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/moatghost
    path: /var/lib/unheaded/moatghost
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded MoatGhost — compliance auditing service"
