# Unheaded Kingdom — Promtail Container
# Log shipping and forwarding agent
# License: MIT, Copyright (c) 2024-2026 Stevie Bellis

name: promtail
description: "Unheaded Promtail log shipping container"
profiles:
  - default
  - unheaded-base
  - unheaded-observability
source:
  type: image
  protocol: simplestreams
  server: https://images.linuxcontainers.org
  alias: ubuntu/noble/amd64
config:
  boot.autostart: "true"
  boot.autostart.priority: "181"
  user.service: "promtail"
  user.description: "Unheaded Promtail log shipping service"
devices: {}
