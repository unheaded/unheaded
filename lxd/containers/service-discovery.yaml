# lxd/containers/service-discovery.yaml
# Service discovery container definition

name: unheaded-service-discovery
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "2"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.SERVICE_DISCOVERY_GRPC_PORT: "50057"
  environment.SERVICE_DISCOVERY_HTTP_PORT: "8500"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "service-discovery"
  user.tier: "infrastructure"
  user.port: "50057,8500"
  user.description: "Service discovery and health checking"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "80"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-service-discovery:
    type: disk
    source: /opt/unheaded/bin/service-discovery
    path: /opt/unheaded/bin/service-discovery
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/service-discovery
    path: /var/lib/unheaded/service-discovery
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded service discovery — infrastructure service"
