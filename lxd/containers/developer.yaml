# lxd/containers/developer.yaml
# Developer royal court service container definition

name: unheaded-developer
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "1"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.DEVELOPER_PORT: "50062"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "developer"
  user.tier: "royal-court"
  user.port: "50062"
  user.description: "Developer royal court service"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "40"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-developer:
    type: disk
    source: /opt/unheaded/bin/developer
    path: /opt/unheaded/bin/developer
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/developer
    path: /var/lib/unheaded/developer
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded Developer — royal court service"
