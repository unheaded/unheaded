# lxd/containers/micromanager.yaml
# Micromanager royal court service container definition

name: unheaded-micromanager
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "1"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.MICROMANAGER_PORT: "50059"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "micromanager"
  user.tier: "royal-court"
  user.port: "50059"
  user.description: "Micromanager royal court service"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "40"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-micromanager:
    type: disk
    source: /opt/unheaded/bin/micromanager
    path: /opt/unheaded/bin/micromanager
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/micromanager
    path: /var/lib/unheaded/micromanager
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded Micromanager — royal court service"
