# lxd/containers/sophia.yaml
# Sophia consensus service container definition

name: unheaded-sophia
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "2"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.SOPHIA_PORT: "50052"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "sophia"
  user.tier: "protocol"
  user.port: "50052"
  user.description: "Sophia consensus service"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "89"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-sophia:
    type: disk
    source: /opt/unheaded/bin/sophia
    path: /opt/unheaded/bin/sophia
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/sophia
    path: /var/lib/unheaded/sophia
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded Sophia — consensus service"
