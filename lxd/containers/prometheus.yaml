# lxd/containers/prometheus.yaml
# Prometheus metrics collection container definition

name: unheaded-prometheus
image: ubuntu:24.04

profiles:
  - unheaded-base
  - unheaded-telemetry

config:
  limits.cpu: "4"
  limits.memory: "4GB"
  limits.memory.swap: "false"
  
  environment.PROMETHEUS_PORT: "9090"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "prometheus"
  user.tier: "telemetry"
  user.port: "9090"
  user.description: "Prometheus metrics collection and storage"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "20"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 20GB
    type: disk
  bin-prometheus:
    type: disk
    source: /opt/unheaded/bin/prometheus
    path: /opt/unheaded/bin/prometheus
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/prometheus
    path: /var/lib/unheaded/prometheus
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded Prometheus — metrics collection and storage"
