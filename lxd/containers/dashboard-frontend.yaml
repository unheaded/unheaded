# lxd/containers/dashboard-frontend.yaml
# Dashboard frontend container definition

name: unheaded-dashboard-frontend
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "1"
  limits.memory: "256MB"
  limits.memory.swap: "false"
  
  environment.DASHBOARD_FRONTEND_PORT: "3001"
  environment.BACKEND_ADDR: "10.20.1.7:8080"
  environment.LOG_LEVEL: "info"
  
  user.service: "dashboard-frontend"
  user.tier: "presentation"
  user.port: "3001"
  user.description: "Dashboard frontend web UI"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "55"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-dashboard-frontend:
    type: disk
    source: /opt/unheaded/bin/dashboard-frontend
    path: /opt/unheaded/bin/dashboard-frontend
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/dashboard-frontend
    path: /var/lib/unheaded/dashboard-frontend
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded dashboard frontend — web UI service"
