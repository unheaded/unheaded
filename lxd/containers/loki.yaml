name: loki
description: "Unheaded Loki log aggregation container"
profiles:
  - default
  - unheaded-base
  - unheaded-observability
source:
  type: image
  protocol: simplestreams
  server: https://images.linuxcontainers.org
  alias: ubuntu/noble/amd64
config:
  boot.autostart: "true"
  boot.autostart.priority: "182"
  user.service: "loki"
  user.description: "Unheaded Loki log aggregation service"
devices: {}
