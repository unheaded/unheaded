# lxd/containers/victoriametrics.yaml
# VictoriaMetrics time-series storage container definition

name: unheaded-victoriametrics
image: ubuntu:24.04

profiles:
  - unheaded-base
  - unheaded-telemetry

config:
  limits.cpu: "4"
  limits.memory: "8GB"
  limits.memory.swap: "false"
  
  environment.VICTORIAMETRICS_PORT: "8428"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "victoriametrics"
  user.tier: "telemetry"
  user.port: "8428"
  user.description: "VictoriaMetrics time-series storage"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "20"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 30GB
    type: disk
  bin-victoriametrics:
    type: disk
    source: /opt/unheaded/bin/victoriametrics
    path: /opt/unheaded/bin/victoriametrics
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/victoriametrics
    path: /var/lib/unheaded/victoriametrics
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded VictoriaMetrics — time-series storage"
