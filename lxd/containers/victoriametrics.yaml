name: victoriametrics
description: "Unheaded VictoriaMetrics metrics container"
profiles:
  - default
  - unheaded-base
  - unheaded-observability
source:
  type: image
  protocol: simplestreams
  server: https://images.linuxcontainers.org
  alias: ubuntu/noble/amd64
config:
  boot.autostart: "true"
  boot.autostart.priority: "184"
  user.service: "victoriametrics"
  user.description: "Unheaded VictoriaMetrics metrics storage service"
devices: {}
