# lxd/containers/kingdom.yaml
# Kingdom coordination container definition

name: unheaded-kingdom
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "1"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.KINGDOM_PORT: "50065"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "kingdom"
  user.tier: "coordination"
  user.port: "50065"
  user.description: "Kingdom realm coordination service"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "35"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-kingdom:
    type: disk
    source: /opt/unheaded/bin/kingdom
    path: /opt/unheaded/bin/kingdom
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/kingdom
    path: /var/lib/unheaded/kingdom
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded Kingdom — realm coordination service"
