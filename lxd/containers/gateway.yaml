# lxd/containers/gateway.yaml
# Gateway container definition

name: unheaded-gateway
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "2"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.GATEWAY_PORT: "8443"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "gateway"
  user.tier: "infrastructure"
  user.port: "8443"
  user.description: "API gateway with TLS termination"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "65"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-gateway:
    type: disk
    source: /opt/unheaded/bin/gateway
    path: /opt/unheaded/bin/gateway
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/gateway
    path: /var/lib/unheaded/gateway
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded gateway — API gateway with TLS termination"
