# lxd/containers/ebpf-exporter.yaml
# eBPF exporter container definition

name: unheaded-ebpf-exporter
image: ubuntu:24.04

profiles:
  - unheaded-base
  - unheaded-ebpf

config:
  limits.cpu: "2"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.EBPF_EXPORTER_PORT: "9435"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "ebpf-exporter"
  user.tier: "observability"
  user.port: "9435"
  user.description: "eBPF metrics exporter"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "75"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 10GB
    type: disk
  bin-ebpf-exporter:
    type: disk
    source: /opt/unheaded/bin/ebpf-exporter
    path: /opt/unheaded/bin/ebpf-exporter
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/ebpf-exporter
    path: /var/lib/unheaded/ebpf-exporter
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded eBPF exporter — kernel metrics exporter"
