# lxd/containers/protocol-api.yaml
# Protocol API container definition

name: unheaded-protocol-api
image: ubuntu:24.04

profiles:
  - unheaded-base

config:
  limits.cpu: "2"
  limits.memory: "512MB"
  limits.memory.swap: "false"
  
  environment.PROTOCOL_API_PORT: "50056"
  environment.WOTAN_ADDR: "10.20.1.1:50053"
  environment.LOG_LEVEL: "info"
  
  user.service: "protocol-api"
  user.tier: "protocol"
  user.port: "50056"
  user.description: "Protocol API service"
  
  boot.autostart: "true"
  boot.autostart.delay: "5"
  boot.autostart.priority: "70"

devices:
  root:
    path: /
    pool: unheaded-ssd
    size: 8GB
    type: disk
  bin-protocol-api:
    type: disk
    source: /opt/unheaded/bin/protocol-api
    path: /opt/unheaded/bin/protocol-api
    readonly: "true"
  state:
    type: disk
    source: /var/lib/unheaded/protocol-api
    path: /var/lib/unheaded/protocol-api
    readonly: "false"
  logs:
    type: disk
    source: /var/log/unheaded
    path: /var/log/unheaded

description: "Unheaded protocol API — protocol layer service"
