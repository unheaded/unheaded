name: grafana
description: "Unheaded Grafana visualization container"
profiles:
  - default
  - unheaded-base
  - unheaded-observability
source:
  type: image
  protocol: simplestreams
  server: https://images.linuxcontainers.org
  alias: ubuntu/noble/amd64
config:
  boot.autostart: "true"
  boot.autostart.priority: "183"
  user.service: "grafana"
  user.description: "Unheaded Grafana dashboarding service"
devices: {}
