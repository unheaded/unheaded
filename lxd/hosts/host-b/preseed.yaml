# lxd/hosts/host-b/preseed.yaml
# LXD host-b (Outpost) initialization preseed - minimal configuration
# Usage: sudo lxd init --preseed < preseed.yaml

config:
  core.https_address: "[::]:8443"
  core.trust_password: ""
  images.auto_update_interval: "24"
  images.remote_cache_expiry: "5"

networks:
  - config:
      ipv4.address: 10.21.0.1/16
      ipv4.dhcp: "true"
      ipv4.dhcp.ranges: "10.21.1.1-10.21.1.100"
      ipv4.firewall: "true"
      ipv4.nat: "true"
      ipv6.address: "fd00:dead:beef:2::1/64"
      ipv6.dhcp: "true"
      ipv6.dhcp.stateful: "true"
      ipv6.firewall: "true"
      ipv6.nat: "false"
      dns.domain: unheaded.internal
      dns.mode: managed
    description: "Unheaded Kingdom Outpost bridge (host-b)"
    name: unheaded-outpost
    type: bridge

storage_pools:
  - config:
      size: 50GB
    description: "Unheaded Kingdom minimal storage (ZFS)"
    driver: zfs
    name: unheaded-minimal

profiles:
  - config:
      security.privileged: "false"
      security.nesting: "false"
      limits.cpu: "1"
      limits.memory: "256MB"
      limits.memory.swap: "false"
      boot.autostart: "true"
      boot.autostart.delay: "3"
    description: "Default Unheaded Outpost container profile"
    devices:
      eth0:
        name: eth0
        network: unheaded-outpost
        type: nic
      root:
        path: /
        pool: unheaded-minimal
        size: 4GB
        type: disk
    name: default

cluster: null
