    runtime:
      binary: helm-runtime
      args: ["--config=/opt/unheaded/helm-runtime/config.yaml"]
      env:
        LOG_LEVEL: info
        CONTAINER_RUNTIME: "containerd"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: armory
      armor_piece: helm

  - service:
      name: gauntlets
      display_name: "Gauntlets"
      description: "Workload scheduling and resource allocation across infrastructure"
      version: "0.2.0"
    network:
      port: 18013
      http_port: 18113
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: gauntlets
      args: ["--config=/opt/unheaded/gauntlets/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 15s
      timeout: 10s
      retries: 3
    labels:
      kingdom_tier: royal-court
      armor_piece: gauntlets

  - service:
      name: greaves
      display_name: "Greaves"
      description: "DNS and network name resolution service"
      version: "0.1.0"
    network:
      port: 18014
      http_port: 18114
      protocol: both
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 3
      restart_policy: always
      depends_on: []
    runtime:
      binary: greaves
      args: ["--config=/opt/unheaded/greaves/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 5s
      timeout: 2s
      retries: 2
    labels:
      kingdom_tier: gnostic
      armor_piece: greaves

  - service:
      name: vambraces
      display_name: "Vambraces"
      description: "Configuration management and secret handling"
      version: "0.3.0"
    network:
      port: 18015
      http_port: 18115
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 2
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: vambraces
      args: ["--config=/opt/unheaded/vambraces/config.yaml"]
      env:
        LOG_LEVEL: info
        VAMBRACES_ENCRYPTION: "enabled"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: vambraces

  - service:
      name: gorget
      display_name: "Gorget"
      description: "Secrets management and encryption service"
      version: "0.2.0"
    network:
      port: 18016
      http_port: 18116
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: []
    runtime:
      binary: gorget
      args: ["--config=/opt/unheaded/gorget/config.yaml"]
      env:
        LOG_LEVEL: warn
        GORGET_ENCRYPTION: "aes-256-gcm"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 2
    labels:
      kingdom_tier: gnostic
      armor_piece: gorget

  - service:
      name: sabatons
      display_name: "Sabatons"
      description: "Health checking, readiness probes, and liveness verification"
      version: "0.1.0"
    network:
      port: 18017
      http_port: 18117
      protocol: http
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 2
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: sabatons
      args: ["--config=/opt/unheaded/sabatons/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 5s
      timeout: 3s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: sabatons

  - service:
      name: pleroma
      display_name: "Pleroma"
      description: "Desired state management and configuration reconciliation"
      version: "0.1.0"
    network:
      port: 18018
      http_port: 18118
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: pleroma
      args: ["--config=/opt/unheaded/pleroma/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 15s
      timeout: 10s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: pleroma

  - service:
      name: kenoma
      display_name: "Kenoma"
      description: "Actual state tracking and real-time cluster state synchronization"
      version: "0.1.0"
    network:
      port: 18019
      http_port: 18119
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 2
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: kenoma
      args: ["--config=/opt/unheaded/kenoma/config.yaml"]
      env:
        LOG_LEVEL: info
        KENOMA_BUFFER_SIZE: "10000"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: kenoma

  - service:
      name: anamnesis
      display_name: "Anamnesis"
      description: "Event history and audit log storage for all platform events"
      version: "0.2.0"
    network:
      port: 18020
      http_port: 18120
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 2
      restart_policy: always
      depends_on: [log-aggregator]
    runtime:
      binary: anamnesis
      args: ["--config=/opt/unheaded/anamnesis/config.yaml"]
      env:
        LOG_LEVEL: info
        ANAMNESIS_RETENTION: "90d"
    health:
      check_interval: 15s
      timeout: 10s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: anamnesis

  - service:
      name: yaldabaoth
      display_name: "Yaldabaoth"
      description: "Chaos engineering and failure injection for resilience testing"
      version: "0.1.0"
    network:
      port: 18021
      http_port: 18121
      protocol: http
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: yaldabaoth
      args: ["--config=/opt/unheaded/yaldabaoth/config.yaml"]
      env:
        LOG_LEVEL: info
        CHAOS_ENABLED: "true"
    health:
      check_interval: 30s
      timeout: 15s
      retries: 2
    labels:
      kingdom_tier: royal-court
      armor_piece: yaldabaoth

  # Presentation Layer Services (tier: presentation, ports 19000-19999)

  - service:
      name: shield-waf
      display_name: "Shield WAF"
      description: "Web Application Firewall protecting ingress traffic with ModSecurity"
      version: "0.5.0"
    network:
      port: 19001
      http_port: 19101
      protocol: both
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: presentation
      replicas: 3
      restart_policy: always
      depends_on: [service-discovery, log-aggregator]
    runtime:
      binary: shield-waf
      args: ["--config=/opt/unheaded/shield-waf/config.yaml"]
      env:
        LOG_LEVEL: warn
        SHIELD_BACKEND: "pauldrons:19100"
        SHIELD_TIMEOUT: "30s"
        GOMAXPROCS: "8"
    health:
      check_interval: 15s
      timeout: 10s
      retries: 3
    labels:
      kingdom_tier: presentation
      armor_piece: shield

  - service:
      name: pauldrons
      display_name: "Pauldrons"
      description: "Load balancer and reverse proxy for ingress traffic distribution"
      version: "0.4.0"
    network:
      port: 19100
      http_port: 19100
      protocol: http
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: presentation
      replicas: 3
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: pauldrons
      args: ["--config=/opt/unheaded/pauldrons/config.yaml"]
      env:
        LOG_LEVEL: info
        PAULDRONS_REPLICAS: "3"
        GOMAXPROCS: "8"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: presentation
      armor_piece: pauldrons

  - service:
      name: kanban-app
      display_name: "Kanban App"
      description: "Web UI dashboard for managing Unheaded services and deployments"
      version: "1.0.0"
    network:
      port: 19200
      http_port: 19200
      protocol: http
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: presentation
      replicas: 2
      restart_policy: always
      depends_on: [dashboard-backend]
    runtime:
      binary: kanban-app
      args: ["--port=19200"]
      env:
        LOG_LEVEL: info
        BACKEND_URL: "http://dashboard-backend:17200"
        ENABLE_DEBUG: "false"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: presentation
      armor_piece: kanban-app

  - service:
      name: port-authority
      display_name: "Port Authority"
      description: "Port management and allocation tracking for all services"
      version: "0.1.0"
    network:
      port: 19300
      http_port: 19300
      protocol: http
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: presentation
      replicas: 1
      restart_policy: always
      depends_on: []
    runtime:
      binary: port-authority
      args: ["--config=/opt/unheaded/port-authority/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: presentation
      armor_piece: port-authority
