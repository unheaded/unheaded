# Unheaded Services Manifest
# This is the bundled fallback manifest containing all 25 Unheaded services.
# Used when /opt/unheaded/ is not accessible (development mode, containers).
# Format: list of ServiceConfig YAML objects as per SERVICE_CONFIG_SCHEMA.md

services:
  # Control Plane Services (tier: control, ports 17000-17999)

  - service:
      name: dashboard-backend
      display_name: "Dashboard Backend"
      description: "REST API serving Unheaded dashboard UI with service discovery and status monitoring"
      version: "1.0.0"
    network:
      port: 17200
      http_port: 17200
      protocol: http
      health_endpoint: /api/v1/health
      metrics_endpoint: /metrics
    deployment:
      tier: control
      replicas: 1
      restart_policy: always
      depends_on: [service-discovery, log-aggregator]
    runtime:
      binary: dashboard-backend
      args: ["--config=/opt/unheaded/dashboard-backend/config.yaml"]
      env:
        LOG_LEVEL: info
        DISCOVERY_DIR: "/opt/unheaded"
        ENABLE_CORS: "true"
    health:
      check_interval: 5s
      timeout: 3s
      retries: 2
    labels:
      kingdom_tier: royal-court
      armor_piece: dashboard-backend

  - service:
      name: metrics-server
      display_name: "Metrics Server"
      description: "Prometheus-compatible metrics aggregation and storage"
      version: "0.8.0"
    network:
      port: 17300
      http_port: 17300
      protocol: http
      health_endpoint: /-/healthy
      metrics_endpoint: /metrics
    deployment:
      tier: control
      replicas: 1
      restart_policy: always
      depends_on: []
    runtime:
      binary: prometheus
      args: ["--config.file=/opt/unheaded/metrics-server/prometheus.yml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: metrics

  # Infrastructure Services (tier: infrastructure, ports 18000-18999)

  - service:
      name: wotan
      display_name: "Wotan"
      description: "Per-flow memory model and ephemeral ring buffer for stateful processing"
      version: "0.2.1"
    network:
      port: 18001
      http_port: 18101
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 2
      restart_policy: always
      depends_on: [service-discovery, log-aggregator]
    runtime:
      binary: wotan
      args: ["--config=/opt/unheaded/wotan/config.yaml"]
      env:
        LOG_LEVEL: info
        WOTAN_RING_SIZE: "1024"
        GOMAXPROCS: "4"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: wotan

  - service:
      name: captain
      display_name: "Captain"
      description: "Service mesh control plane and traffic orchestration"
      version: "0.5.0"
    network:
      port: 18002
      http_port: 18102
      protocol: both
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: captain
      args: ["--config=/opt/unheaded/captain/config.yaml"]
      env:
        LOG_LEVEL: info
        CAPTAIN_REPLICAS: "1"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: royal-court
      armor_piece: captain

  - service:
      name: micromanager
      display_name: "Micromanager"
      description: "Orchestration engine for managing service lifecycle and deployments"
      version: "0.3.0"
    network:
      port: 18003
      http_port: 18103
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: [service-discovery, log-aggregator]
    runtime:
      binary: micromanager
      args: ["--config=/opt/unheaded/micromanager/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 15s
      timeout: 10s
      retries: 3
    labels:
      kingdom_tier: royal-court
      armor_piece: micromanager

  - service:
      name: architect
      display_name: "Architect"
      description: "Infrastructure planning and resource allocation engine"
      version: "0.2.0"
    network:
      port: 18004
      http_port: 18104
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: [service-discovery]
    runtime:
      binary: architect
      args: ["--config=/opt/unheaded/architect/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 20s
      timeout: 10s
      retries: 2
    labels:
      kingdom_tier: royal-court
      armor_piece: architect

  - service:
      name: developer
      display_name: "Developer"
      description: "SDK and development tools for building services on Unheaded"
      version: "0.1.0"
    network:
      port: 18005
      http_port: 18105
      protocol: http
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: []
    runtime:
      binary: developer
      args: ["--config=/opt/unheaded/developer/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: armory
      armor_piece: developer

  - service:
      name: timeguru
      display_name: "TimeGuru"
      description: "Distributed time synchronization and scheduling service"
      version: "0.1.0"
    network:
      port: 18006
      http_port: 18106
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: []
    runtime:
      binary: timeguru
      args: ["--config=/opt/unheaded/timeguru/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 5s
      timeout: 2s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: timeguru

  - service:
      name: service-discovery
      display_name: "Service Discovery"
      description: "Distributed service registry and DNS resolution"
      version: "1.0.0"
    network:
      port: 18008
      http_port: 18108
      protocol: both
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 3
      restart_policy: always
      depends_on: []
    runtime:
      binary: service-discovery
      args: ["--config=/opt/unheaded/service-discovery/config.yaml"]
      env:
        LOG_LEVEL: info
        DISCOVERY_REPLICAS: "3"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: service-discovery

  - service:
      name: log-aggregator
      display_name: "Log Aggregator"
      description: "Centralized logging, aggregation, and analysis platform"
      version: "0.6.0"
    network:
      port: 18009
      http_port: 18109
      protocol: both
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 2
      restart_policy: always
      depends_on: []
    runtime:
      binary: log-aggregator
      args: ["--config=/opt/unheaded/log-aggregator/config.yaml"]
      env:
        LOG_LEVEL: warn
        LOG_RETENTION: "30d"
    health:
      check_interval: 15s
      timeout: 10s
      retries: 3
    labels:
      kingdom_tier: gnostic
      armor_piece: log-aggregator

  - service:
      name: hauberk
      display_name: "Hauberk"
      description: "Service mesh layer providing mTLS, traffic management, and observability"
      version: "0.4.0"
    network:
      port: 18010
      http_port: 18110
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 2
      restart_policy: always
      depends_on: [service-discovery, log-aggregator]
    runtime:
      binary: hauberk
      args: ["--config=/opt/unheaded/hauberk/config.yaml"]
      env:
        LOG_LEVEL: info
        HAUBERK_MODE: "ambient"
    health:
      check_interval: 10s
      timeout: 5s
      retries: 3
    labels:
      kingdom_tier: royal-court
      armor_piece: hauberk

  - service:
      name: sword
      display_name: "Sword"
      description: "Deployment pipeline orchestration and GitOps integration"
      version: "0.3.0"
    network:
      port: 18011
      http_port: 18111
      protocol: http
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
      depends_on: [service-discovery, log-aggregator]
    runtime:
      binary: sword
      args: ["--config=/opt/unheaded/sword/config.yaml"]
      env:
        LOG_LEVEL: info
    health:
      check_interval: 20s
      timeout: 15s
      retries: 2
    labels:
      kingdom_tier: armory
      armor_piece: sword

  - service:
      name: helm-runtime
      display_name: "Helm Runtime"
      description: "Container runtime integration for Docker, containerd, and OCI"
      version: "0.5.0"
    network:
      port: 18012
      http_port: 18112
      protocol: grpc
      health_endpoint: /health
      metrics_endpoint: /metrics
    deployment:
      tier: infrastructure
      replicas: 1
      restart_policy: always
