apiVersion: runbook/v1
kind: Runbook
metadata:
  name: kev-poller-stale
  description: Diagnose a stale KEV poller, restart it, confirm it is ready
  owner: sentinel
  estimated_duration: 3m
  risk: low
  requires_sudo: true
  status: draft
  authored_by: claude
  reviewed_by: ""
  approved_by: ""
steps:
  - name: readiness
    action: shell
    command: "curl -s --max-time 5 -w ' (HTTP %{http_code})\\n' http://127.0.0.1:19120/ready || true"
  - name: last-error
    action: shell
    command: |
      set -euo pipefail
      curl -sf --max-time 5 http://127.0.0.1:19120/api/v1/kev |
        python3 -c 'import json,sys; d=json.load(sys.stdin); print("last_error:", d.get("last_error") or "-"); print("next_pull:", d.get("next_pull"))'
  - name: journal
    action: shell
    command: "journalctl -u unheaded-kev-poller -n 100 --no-pager"
  - name: restart
    action: shell
    command: "sudo systemctl restart unheaded-kev-poller"
verification:
  - name: ready-again
    description: /ready answers 200
    command: |
      set -euo pipefail
      for _ in $(seq 1 30); do
        if curl -sf --max-time 2 http://127.0.0.1:19120/ready; then exit 0; fi
        sleep 2
      done
      exit 1
