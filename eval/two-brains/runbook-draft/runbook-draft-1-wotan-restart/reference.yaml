apiVersion: runbook/v1
kind: Runbook
metadata:
  name: wotan-restart
  description: Restart the Wotan unit on west and confirm it answers again
  owner: zhenai
  estimated_duration: 3m
  risk: medium
  requires_sudo: true
  status: draft
  authored_by: claude
  reviewed_by: ""
  approved_by: ""
preconditions:
  - description: the unheaded-wotan unit exists
    check: "systemctl cat unheaded-wotan >/dev/null"
steps:
  - name: health-before
    action: shell
    host: west
    command: "curl -s --max-time 5 http://127.0.0.1:18000/health || echo 'wotan: no health answer before restart'"
  - name: journal-before
    action: shell
    host: west
    command: "journalctl -u unheaded-wotan -n 50 --no-pager"
  - name: restart
    action: shell
    host: west
    command: "sudo systemctl restart unheaded-wotan"
verification:
  - name: unit-active
    description: the unit came back
    command: "systemctl is-active --quiet unheaded-wotan"
  - name: health-after
    description: Wotan answers its health endpoint
    command: |
      set -euo pipefail
      for _ in $(seq 1 15); do
        if curl -sf --max-time 2 http://127.0.0.1:18000/health; then exit 0; fi
        sleep 1
      done
      exit 1
