# The Well's client authentication on Kubernetes (ERDA 4.2). db/pg_hba.conf
# is compose's: it names the compose network (172.28.1.0/24), which means
# nothing in a cluster. Same rules otherwise: TLS only, SCRAM only, and the
# superuser `unheaded` never over the network (in the pod, over the local
# socket, for init.sh and operator `kubectl exec`). Which pods may connect at
# all is the NetworkPolicy's job; this file decides how. Rendered into the
# the-well-config ConfigMap by scripts/well/render-k8s-initdb.py.
#
# TYPE   DATABASE  USER      ADDRESS          METHOD
local    all       all                        trust
host     all       unheaded  all              reject
hostssl  all       all       0.0.0.0/0        scram-sha-256
hostssl  all       all       ::/0             scram-sha-256
host     all       all       all              reject
