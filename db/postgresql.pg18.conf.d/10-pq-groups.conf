# The Well on PostgreSQL 18: hybrid post-quantum TLS key exchange (ADR-105).
#
# PostgreSQL 18 only. ssl_groups is new in 18; PostgreSQL 16 refuses to
# start on an unknown parameter, so nothing loads this file until the
# PG 16 -> 18 upgrade (runbooks/data/well-pg18-upgrade.yaml, ESCALATE E1).
# That upgrade mounts this directory at /etc/postgresql/conf.d and appends
#   include_dir = '/etc/postgresql/conf.d'
# to db/postgresql.conf.
#
# Order is the server's preference. X25519MLKEM768 first: any client whose
# OpenSSL offers it (3.5+, which every libpq on Alpine 3.22+ and Debian
# trixie links) negotiates the hybrid. X25519 and P-256 stay as fallbacks on
# purpose, for older libpq builds; removing them is a lockout decision, not
# a config tweak. PostgreSQL 16's ssl_ecdh_curve (one curve, default
# prime256v1) is what the Well uses until then.
#
# Proven by scripts/well/test-pq-groups.sh (throwaway containers).
ssl_groups = 'X25519MLKEM768:X25519:prime256v1'
