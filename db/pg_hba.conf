# The Well — client authentication (ERDA 4.2). Mounted read-only at
# /etc/postgresql/pg_hba.conf (hba_file in db/postgresql.conf). First
# match wins.
#
# Which database a role may use is decided by CONNECT grants (025), not
# here: this file decides only how and from where.
#
# 172.28.1.0/24 is the compose `data` network (docker-compose.yml); its
# gateway 172.28.1.1 is the host itself, which is where connections to the
# published 127.0.0.1:5432 arrive from.

# TYPE   DATABASE  USER      ADDRESS          METHOD

# The socket is reachable only inside the container, i.e. through
# `docker exec`, which is already root on the host: backups, drills and
# set-role-passwords.sh use it.
local    all       all                        trust

# The superuser over TCP: from the host only (well-migrate), with TLS.
hostssl  all       unheaded  172.28.1.1/32    scram-sha-256
host     all       unheaded  all              reject

# Service roles: TLS from the data network.
hostssl  all       all       172.28.1.0/24    scram-sha-256

# Everything else, including any connection without TLS.
host     all       all       all              reject
