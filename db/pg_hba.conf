# TYPE  DATABASE        USER            ADDRESS         METHOD

# Superuser — local only
local   all             postgres                        peer

# Legacy monolith user (backward compat)
local   all             unheaded                        scram-sha-256
host    all             unheaded        172.0.0.0/8     scram-sha-256
host    all             unheaded        10.0.0.0/8      scram-sha-256

# ═══ unheaded_app — service-scoped users ═══
host    unheaded_app    app_kanban      172.0.0.0/8     scram-sha-256
host    unheaded_app    app_kanban      10.0.0.0/8      scram-sha-256
host    unheaded_app    app_timeguru    172.0.0.0/8     scram-sha-256
host    unheaded_app    app_timeguru    10.0.0.0/8      scram-sha-256
host    unheaded_app    app_zhen        172.0.0.0/8     scram-sha-256
host    unheaded_app    app_zhen        10.0.0.0/8      scram-sha-256

# ═══ unheaded_ops — operations users ═══
host    unheaded_ops    ops_writer      172.0.0.0/8     scram-sha-256
host    unheaded_ops    ops_writer      10.0.0.0/8      scram-sha-256
host    unheaded_ops    ops_reader      172.0.0.0/8     scram-sha-256
host    unheaded_ops    ops_reader      10.0.0.0/8      scram-sha-256

# ═══ unheaded_config — config users ═══
host    unheaded_config config_admin    172.0.0.0/8     scram-sha-256
host    unheaded_config config_admin    10.0.0.0/8      scram-sha-256
host    unheaded_config config_reader   172.0.0.0/8     scram-sha-256
host    unheaded_config config_reader   10.0.0.0/8      scram-sha-256

# ═══ Cross-database access ═══
# app_* users can read config
host    unheaded_config app_kanban      172.0.0.0/8     scram-sha-256
host    unheaded_config app_kanban      10.0.0.0/8      scram-sha-256
host    unheaded_config app_timeguru    172.0.0.0/8     scram-sha-256
host    unheaded_config app_timeguru    10.0.0.0/8      scram-sha-256
host    unheaded_config app_zhen        172.0.0.0/8     scram-sha-256
host    unheaded_config app_zhen        10.0.0.0/8      scram-sha-256
# ops_reader can read app data (dashboard)
host    unheaded_app    ops_reader      172.0.0.0/8     scram-sha-256
host    unheaded_app    ops_reader      10.0.0.0/8      scram-sha-256

# Reject everything else
host    all             all             0.0.0.0/0       reject
