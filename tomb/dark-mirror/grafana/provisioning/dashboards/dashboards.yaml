# Grafana dashboard provisioning for the Dark Mirror.
#
# Without this provider Grafana never reads /var/lib/grafana/dashboards — the
# JSON files mounted there are just files on a disk. GF_DASHBOARDS_DEFAULT_HOME_
# DASHBOARD_PATH can render one of them as the home page, but that does not
# register it as a dashboard, so nothing is browsable or linkable.

apiVersion: 1

providers:
  - name: 'Dark Mirror'
    orgId: 1
    folder: 'Dark Mirror'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
