# tomb/ansible/playbook-cerydwyn.yml -- Deploy Cerydwyn LLM (Layer 4)
#
# Installs Ollama, transfers Mistral-7B model, deploys RAG pipeline
# scripts, configures systemd services for ollama and cerydwyn-daemon.
# All binaries and model files pre-staged -- no internet access.
---
- name: "Tomb of Knowledge -- Layer 4: The Cerydwyn"
  hosts: tomb
  become: true
  gather_facts: false

  vars:
    cerydwyn_root: "{{ tomb_root }}/cerydwyn"
    ollama_bin: "/usr/local/bin/ollama"
    ollama_listen: "127.0.0.1:{{ ollama_port }}"
    ollama_model_dir: "{{ cerydwyn_root }}/ollama/models"
    llm_model: "mistral"

  roles:
    - role: cerydwyn

  tasks:
    - name: "Transfer Ollama binary"
      ansible.builtin.copy:
        src: "{{ packages_src }}/cerydwyn/ollama"
        dest: "{{ ollama_bin }}"
        owner: root
        group: root
        mode: "0755"
      failed_when: false

    - name: "Verify Ollama binary exists"
      ansible.builtin.stat:
        path: "{{ ollama_bin }}"
      register: ollama_stat

    - name: "Warn if Ollama binary missing"
      ansible.builtin.debug:
        msg: "WARNING: Ollama binary not found at {{ ollama_bin }}. Stage it in packages/cerydwyn/ollama"
      when: not ollama_stat.stat.exists

    - name: "Transfer Mistral-7B model files"
      ansible.builtin.copy:
        src: "{{ packages_src }}/cerydwyn/models/"
        dest: "{{ ollama_model_dir }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0700"
      failed_when: false

    - name: "Deploy RAG configuration"
      ansible.builtin.copy:
        content: |
          {
            "embedding_model": "all-MiniLM-L6-v2",
            "llm_model": "{{ llm_model }}",
            "llm_endpoint": "http://{{ ollama_listen }}",
            "top_k": 5,
            "chunk_size": 512,
            "chunk_overlap": 50,
            "chroma_dir": "{{ tomb_root }}/grimoire/rag/chroma.db",
            "collection_name": "grimoire",
            "temperature": 0.3,
            "max_tokens": 2048,
            "system_prompt": "You are the BlackMage Cerydwyn, advisor to a kingdom's security team. Respond with tactical, actionable guidance grounded in the Kingdom's architecture and threat landscape. Reference specific documents when applicable."
          }
        dest: "{{ cerydwyn_root }}/rag-config.json"
        owner: root
        group: root
        mode: "0640"

    - name: "Deploy rag-cerydwyn.py"
      ansible.builtin.copy:
        src: "files/rag-cerydwyn.py"
        dest: "{{ cerydwyn_root }}/rag-cerydwyn.py"
        owner: root
        group: root
        mode: "0755"
      failed_when: false

    - name: "Deploy cerydwyn-daemon.py"
      ansible.builtin.copy:
        src: "files/cerydwyn-daemon.py"
        dest: "{{ cerydwyn_root }}/cerydwyn-daemon.py"
        owner: root
        group: root
        mode: "0755"
      failed_when: false

    - name: "Deploy Ollama systemd service"
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Ollama LLM Service (The Cerydwyn)
          After=network.target

          [Service]
          Type=simple
          User=root
          ExecStart={{ ollama_bin }} serve
          Environment=OLLAMA_MODELS={{ ollama_model_dir }}
          Environment=OLLAMA_HOST={{ ollama_listen }}
          Restart=on-failure
          RestartSec=10s
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/ollama.service
        mode: "0644"
      notify: Reload systemd
      when: ollama_stat.stat.exists

    - name: "Deploy cerydwyn-daemon systemd service"
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Cerydwyn Daemon (continuous threat monitoring)
          After=ollama.service
          Wants=ollama.service

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/bin/python3 {{ cerydwyn_root }}/cerydwyn-daemon.py --config {{ cerydwyn_root }}/rag-config.json
          Restart=on-failure
          RestartSec=30s
          Environment=PYTHONUNBUFFERED=1

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/cerydwyn-daemon.service
        mode: "0644"
      notify: Reload systemd

    - name: "Reload systemd and start services"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Enable and start Ollama"
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
      when: ollama_stat.stat.exists
      failed_when: false

    - name: "Wait for Ollama to become ready"
      ansible.builtin.uri:
        url: "http://{{ ollama_listen }}/api/tags"
        method: GET
        timeout: 5
      register: ollama_health
      retries: 10
      delay: 3
      until: ollama_health.status == 200
      when: ollama_stat.stat.exists
      failed_when: false

    - name: "Report Ollama status"
      ansible.builtin.debug:
        msg: "Ollama: {{ 'READY' if (ollama_health.status | default(0)) == 200 else 'NOT READY' }}"

    - name: "Enable cerydwyn-daemon (starts after Ollama)"
      ansible.builtin.systemd:
        name: cerydwyn-daemon
        enabled: true
      failed_when: false

  handlers:
    - name: "Reload systemd"
      ansible.builtin.systemd:
        daemon_reload: true
