# roles/grimoire/tasks/main.yml -- Grimoire knowledge base role
---
- name: "Ensure Grimoire directories exist"
  ansible.builtin.file:
    path: "{{ tomb_root }}/grimoire/{{ item }}"
    state: directory
    owner: "{{ tomb_user }}"
    group: "{{ tomb_user }}"
    mode: "0750"
  loop:
    - kingdom-docs
    - mitre-attck
    - nvd-cves
    - cwe
    - threat-models
    - history
    - bin
    - index
