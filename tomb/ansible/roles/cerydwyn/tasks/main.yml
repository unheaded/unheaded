# roles/cerydwyn/tasks/main.yml -- Cerydwyn LLM role
---
- name: "Ensure Cerydwyn directories exist"
  ansible.builtin.file:
    path: "{{ tomb_root }}/cerydwyn/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - ollama
    - ollama/models
    - logs
    - suggestions

- name: "Check available memory for LLM"
  ansible.builtin.command:
    cmd: "free -m"
  register: mem_check
  changed_when: false

- name: "Report memory availability"
  ansible.builtin.debug:
    msg: |
      Memory for Cerydwyn LLM (Mistral-7B Q4 needs ~4GB):
      {{ mem_check.stdout_lines | join('\n') }}
