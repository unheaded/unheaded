# tomb/ansible/playbook-grimoire.yml -- Deploy Grimoire knowledge base (Layer 3)
#
# Transfers Kingdom docs, MITRE ATT&CK, NVD CVEs, CWE mappings.
# Builds the corpus index with zhen-codeindex (word search; no Python, no model).
# All data pre-staged on host -- no internet access.
---
- name: "Tomb of Knowledge -- Layer 3: The Grimoire"
  hosts: tomb
  become: true
  gather_facts: false

  vars:
    grimoire_root: "{{ tomb_root }}/grimoire"
    grimoire_sources:
      - { name: "kingdom-docs", desc: "Kingdom architecture and config documentation" }
      - { name: "mitre-attck", desc: "MITRE ATT&CK framework (JSON datasets)" }
      - { name: "nvd-cves", desc: "NVD CVE records" }
      - { name: "cwe", desc: "CWE mappings" }
      - { name: "threat-models", desc: "Kingdom threat models" }

  roles:
    - role: grimoire

  tasks:
    - name: "Transfer knowledge base sources"
      ansible.builtin.copy:
        src: "{{ packages_src }}/grimoire/{{ item.name }}/"
        dest: "{{ grimoire_root }}/{{ item.name }}/"
        owner: "{{ tomb_user }}"
        group: "{{ tomb_user }}"
        mode: "0640"
        directory_mode: "0750"
      loop: "{{ grimoire_sources }}"
      loop_control:
        label: "{{ item.name }}"
      failed_when: false

    - name: "Deploy grimoire-search.sh"
      ansible.builtin.copy:
        src: "files/grimoire-search.sh"
        dest: "{{ grimoire_root }}/grimoire-search.sh"
        owner: "{{ tomb_user }}"
        group: "{{ tomb_user }}"
        mode: "0755"
      failed_when: false

    - name: "Deploy zhen-codeindex"
      ansible.builtin.copy:
        src: "{{ packages_src }}/grimoire/bin/zhen-codeindex"
        dest: "{{ grimoire_root }}/bin/zhen-codeindex"
        owner: "{{ tomb_user }}"
        group: "{{ tomb_user }}"
        mode: "0755"

    - name: "Build the corpus index"
      ansible.builtin.command:
        argv:
          - "{{ grimoire_root }}/bin/zhen-codeindex"
          - "--corpus"
          - "{{ grimoire_root }}"
          - "--out"
          - "{{ grimoire_root }}/index"
      become_user: "{{ tomb_user }}"
      changed_when: true

    - name: "Count indexed documents per source"
      ansible.builtin.find:
        paths: "{{ grimoire_root }}/{{ item.name }}"
        recurse: true
        file_type: file
      register: doc_counts
      loop: "{{ grimoire_sources }}"
      loop_control:
        label: "{{ item.name }}"
      failed_when: false

    - name: "Report document counts"
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ item.matched | default(0) }} files"
      loop: "{{ doc_counts.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: doc_counts is defined
