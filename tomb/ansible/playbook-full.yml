# tomb/ansible/playbook-full.yml -- Full Tomb of Knowledge deployment
#
# Imports all layer playbooks in dependency order:
#   1. Base system (directories, packages, users)
#   2. Lich adversary framework (Layer 2)
#   3. Grimoire knowledge base (Layer 3)
#   4. Oracle LLM (Layer 4)
#   5. Dark Mirror observability (Layer 5)
#   6. Security hardening (Phase 13)
#
# Usage:
#   ansible-playbook -i inventory.yml playbook-full.yml
#   ansible-playbook -i inventory.yml playbook-full.yml --tags lich
#   ansible-playbook -i inventory.yml playbook-full.yml --skip-tags hardening
---
- name: "Tomb of Knowledge -- Full Deployment"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Display deployment banner"
      ansible.builtin.debug:
        msg: |
          +---------------------------------------------------------+
          |   THE TOMB OF KNOWLEDGE                                 |
          |   Full Deployment -- All 5 Layers + Hardening           |
          |   Target: {{ hostvars['tomb-vm']['ansible_host'] | default('192.168.13.6') }}
          +---------------------------------------------------------+

- name: "Phase 1: Base System Setup"
  ansible.builtin.import_playbook: playbook-base.yml
  tags: [base, setup]

- name: "Phase 2: The Lich (Adversary Framework)"
  ansible.builtin.import_playbook: playbook-lich.yml
  tags: [lich, layer2]

- name: "Phase 3: The Grimoire (Knowledge Base)"
  ansible.builtin.import_playbook: playbook-grimoire.yml
  tags: [grimoire, layer3]

- name: "Phase 4: The Oracle (LLM + RAG)"
  ansible.builtin.import_playbook: playbook-oracle.yml
  tags: [oracle, layer4]

- name: "Phase 5: The Dark Mirror (Observability)"
  ansible.builtin.import_playbook: playbook-dark-mirror.yml
  tags: [dark-mirror, layer5]

- name: "Phase 13: Security Hardening"
  ansible.builtin.import_playbook: playbook-hardening.yml
  tags: [hardening, security]

- name: "Final Verification"
  hosts: tomb
  become: true
  gather_facts: false
  tags: [verify]

  tasks:
    - name: "Verify all Tomb layers"
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: layer_checks
      loop:
        - { path: "{{ tomb_root }}/lich/campaigns/LICH-001", layer: "Lich" }
        - { path: "{{ tomb_root }}/grimoire/kingdom-docs", layer: "Grimoire" }
        - { path: "{{ tomb_root }}/oracle/rag-config.json", layer: "Oracle" }
        - { path: "{{ tomb_root }}/dark-mirror/prometheus/prometheus.yml", layer: "Dark Mirror" }
      loop_control:
        label: "{{ item.layer }}"

    - name: "Verify air-gap integrity"
      ansible.builtin.command:
        cmd: "ping -c 1 -W 2 8.8.8.8"
      register: final_airgap
      failed_when: final_airgap.rc == 0
      changed_when: false

    - name: "Display deployment summary"
      ansible.builtin.debug:
        msg: |
          ================================================================
            TOMB OF KNOWLEDGE -- DEPLOYMENT COMPLETE
          ================================================================

          Layer 1 (Arsenal):      Kali Linux base tools
          Layer 2 (Lich):         {{ 'DEPLOYED' if layer_checks.results[0].stat.exists else 'MISSING' }}
          Layer 3 (Grimoire):     {{ 'DEPLOYED' if layer_checks.results[1].stat.exists else 'MISSING' }}
          Layer 4 (Oracle):       {{ 'DEPLOYED' if layer_checks.results[2].stat.exists else 'MISSING' }}
          Layer 5 (Dark Mirror):  {{ 'DEPLOYED' if layer_checks.results[3].stat.exists else 'MISSING' }}
          Air-gap:                ENFORCED

          ================================================================
