# Yggdrasil Debian preseed — autoinstall for hardened reference image
# Per OS-FORK-DISCIPLINE.md anchor (currently Debian 12 bookworm).
# Free to use. Free to share.

# ── Localization ──────────────────────────────────────────────────────────
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# ── Network ───────────────────────────────────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string yggdrasil
d-i netcfg/get_domain string unheaded.dev
d-i netcfg/wireless_wep string

# ── Mirror ────────────────────────────────────────────────────────────────
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ── Time / NTP ────────────────────────────────────────────────────────────
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# ── Account setup ─────────────────────────────────────────────────────────
# Root login disabled — must use yggdrasil user + sudo.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Yggdrasil Operator
d-i passwd/username string yggdrasil
# Initial password "yggdrasil" — replaced by SSH key + sudo lockdown in
# provisioner 01-ssh-and-sudo.sh. NEVER ships in the final image.
d-i passwd/user-password password yggdrasil
d-i passwd/user-password-again password yggdrasil
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# ── Partitioning ──────────────────────────────────────────────────────────
# LVM with separate /var, /var/log, /tmp, /home for CIS compliance.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

d-i partman-auto/expert_recipe string                         \
      yggdrasil ::                                            \
              512 512 512 ext4                                \
                      $primary{ } $bootable{ }                \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /boot }                     \
              .                                               \
              2048 2048 2048 ext4                             \
                      $lvmok{ }                               \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / }                         \
              .                                               \
              2048 2048 8192 ext4                             \
                      $lvmok{ }                               \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      options/nodev{ nodev }                  \
                      options/nosuid{ nosuid }                \
                      mountpoint{ /var }                      \
              .                                               \
              512 512 2048 ext4                               \
                      $lvmok{ }                               \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      options/nodev{ nodev }                  \
                      options/nosuid{ nosuid }                \
                      options/noexec{ noexec }                \
                      mountpoint{ /var/log }                  \
              .                                               \
              512 512 2048 ext4                               \
                      $lvmok{ }                               \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      options/nodev{ nodev }                  \
                      options/nosuid{ nosuid }                \
                      options/noexec{ noexec }                \
                      mountpoint{ /tmp }                      \
              .                                               \
              512 512 -1 ext4                                 \
                      $lvmok{ }                               \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      options/nodev{ nodev }                  \
                      options/nosuid{ nosuid }                \
                      mountpoint{ /home }                     \
              .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── Base system ───────────────────────────────────────────────────────────
d-i base-installer/install-recommends boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/non-free boolean false
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/services-select multiselect security, updates

# ── Package selection (minimal — provisioners install the rest) ───────────
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo curl ca-certificates gnupg python3 systemd-timesyncd auditd apparmor apparmor-utils unattended-upgrades
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades

# Telemetry off
popularity-contest popularity-contest/participate boolean false

# ── Bootloader ────────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda

# ── Finish ────────────────────────────────────────────────────────────────
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string \
    in-target sh -c 'echo "yggdrasil ALL=(ALL) NOPASSWD: /sbin/shutdown" > /etc/sudoers.d/packer-shutdown'; \
    in-target chmod 0440 /etc/sudoers.d/packer-shutdown
