name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  security-events: write


jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run security scan before release
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/wotan-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./wotan/cmd/wotan
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/wotan-cli-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./wotan/cmd/wotan-cli

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Generate SBOM for release
        # Pinned syft (sha256-checked). `go install github.com/anchore/syft@latest`
        # floated, and could not build anyway: the binary is at ./cmd/syft.
        run: |
          ./scripts/ci-install-sbom-tools.sh "$RUNNER_TEMP/bin" syft
          "$RUNNER_TEMP/bin/syft" dir:. -o cyclonedx-json=dist/sbom.json

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

      - name: SLSA provenance placeholder
        run: |
          echo "# SLSA Provenance" > dist/provenance.json
          echo "TODO: Integrate slsa-framework/slsa-github-generator for production"
          echo "Version: ${{ github.ref_name }}" >> dist/provenance.json

      - name: Signing placeholder (cosign)
        run: |
          echo "TODO: Integrate sigstore/cosign for artifact signing"
          echo "Use: cosign sign-blob --key cosign.key dist/* > dist/signatures.txt"
