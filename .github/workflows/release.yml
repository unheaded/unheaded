name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  security-events: write

env:
  GO_VERSION: '1.24'

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run security scan before release
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/wotan-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./wotan/cmd/wotan
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/wotan-cli-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./wotan/cmd/wotan-cli

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Generate SBOM for release
        run: |
          go install github.com/anchore/syft@latest
          syft dir:. -o cyclonedx-json=dist/sbom.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

      - name: SLSA provenance placeholder
        run: |
          echo "# SLSA Provenance" > dist/provenance.json
          echo "TODO: Integrate slsa-framework/slsa-github-generator for production"
          echo "Version: ${{ github.ref_name }}" >> dist/provenance.json

      - name: Signing placeholder (cosign)
        run: |
          echo "TODO: Integrate sigstore/cosign for artifact signing"
          echo "Use: cosign sign-blob --key cosign.key dist/* > dist/signatures.txt"
