#
# Python tests for raft/ — the WAVE15-rewired Zhenai web UI.
# Runs the unit-tier pytest suite (test_action_manager.py uses MagicMock
# and runs fully offline). The integration-tier test_memory_poison.py
# is gated behind a WELL_DSN env variable so it skips cleanly in CI
# without a live PostgreSQL + sentence-transformers stack.

name: raft (Python)

on:
  push:
    paths:
      - 'raft/**'
      - 'pkg/zhenrag/testdata/**'
      - '.github/workflows/raft-python.yml'
  pull_request:
    paths:
      - 'raft/**'
      - 'pkg/zhenrag/testdata/**'
      - '.github/workflows/raft-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: raft pytest (unit tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install minimal deps
        # Pinned versions match what raft/zhen_app.py imports at runtime
        # on Stevie's dev box. sentence-transformers + torch are
        # NOT installed here — they're only required by the integration
        # tier (test_memory_poison.py), which we skip in this job.
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.* flask==3.* flask-cors==4.* pyyaml==6.* pygments==2.* requests==2.*

      - name: Run unit tier (offline, no DB, no embedder)
        run: |
          # test_action_manager.py is fully MagicMock-based.
          # test_memory_poison.py imports zhen_rag → sentence-transformers,
          # so it's excluded from this job. Run it locally with the
          # webapp + Well online, or via a future integration workflow.
          # test_zhen_rag_retrieve.py stubs sentence-transformers and fakes vor.
          # test_zhen_prompt.py pins the direct chat path's prompt bytes to
          # pkg/zhenrag's pre-move goldens (same stub, no network).
          pytest raft/tests/test_action_manager.py raft/tests/test_zhen_highlight.py raft/tests/test_zhen_rag_retrieve.py raft/tests/test_zhen_prompt.py raft/tests/test_zhen_embedder_pin.py raft/tests/test_zhen_scheduler_client.py raft/tests/test_zhen_rag_strip.py -v --tb=short

      - name: Confirm test_memory_poison.py imports cleanly (syntax only)
        # We don't execute the integration test in CI, but we DO want
        # CI to fail if its file becomes syntactically broken or its
        # import surface drifts. py_compile catches both without
        # pulling in the heavyweight deps the test runs against.
        run: |
          python -m py_compile raft/tests/test_memory_poison.py
          echo "  ✓ raft/tests/test_memory_poison.py compiles cleanly"

  lint:
    name: raft lint (syntax + imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: py_compile every Python file under raft/
        # Catches accidental syntax errors before they hit production.
        # Faster than pylint; doesn't need a venv with deps installed.
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
              if ! python -m py_compile "$f" 2>/tmp/pyc.err; then
                  echo "  ✗ $f"
                  cat /tmp/pyc.err
                  fail=1
              fi
          done < <(find raft -name "*.py" -not -path "*/__pycache__/*" -not -path "*/.venv/*")
          if [ "$fail" = "1" ]; then
              echo "Python syntax errors above blocking the build."
              exit 1
          fi
          echo "  ✓ all raft/**/*.py compile cleanly"
