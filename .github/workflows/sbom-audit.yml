name: Weekly SBOM Audit

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sbom-generate:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fetch doomgeneric (go.mod replace target)
        run: ./scripts/ci-fetch-doomgeneric.sh

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      # grype-scan below reads sbom-results/sbom-cyclonedx.json. This step
      # used to run scripts/generate-sbom.sh, which writes sbom/*.json (the
      # committed human-facing SBOM) and never produced sbom-results/ at all:
      # grype scanned a missing file, `|| true` hid that, and the SARIF upload
      # failed on an empty file.
      - name: Generate SBOM
        run: |
          mkdir -p sbom-results
          syft dir:. \
            -o cyclonedx-json=sbom-results/sbom-cyclonedx.json \
            -o spdx-json=sbom-results/sbom-spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v5
        with:
          name: sbom-artifacts
          if-no-files-found: error
          path: |
            sbom-results/sbom-cyclonedx.json
            sbom-results/sbom-spdx.json
          retention-days: 30

  grype-scan:
    name: Vulnerability Scan (Grype)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sbom-generate
    steps:
      - uses: actions/checkout@v5

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v5
        with:
          name: sbom-artifacts
          path: sbom-results

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype scan on CycloneDX SBOM
        run: |
          grype sbom:sbom-results/sbom-cyclonedx.json \
            -o sarif \
            --file grype-results.sarif

      - name: Parse Grype results for HIGH/CRITICAL
        id: grype-check
        run: |
          if [ -f grype-results.sarif ]; then
            CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' grype-results.sarif)
            HIGH=$(jq '[.runs[].results[] | select(.level == "warning")] | length' grype-results.sarif)
            echo "critical=${CRITICAL}" >> $GITHUB_OUTPUT
            echo "high=${HIGH}" >> $GITHUB_OUTPUT
            echo "Vulnerabilities found - Critical: ${CRITICAL}, High: ${HIGH}"
            if [ "${CRITICAL}" -gt 0 ]; then
              echo "::error::Found CRITICAL vulnerabilities in dependencies"
              exit 1
            fi
          fi

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fetch doomgeneric (go.mod replace target)
        run: ./scripts/ci-fetch-doomgeneric.sh

      - name: Check Go licenses
        run: |
          go install github.com/google/go-licenses@latest
          # Ignored, each checked by hand (2026-09-30):
          #   unheaded: this module (GPL-3.0); the allow-list is for dependencies.
          #   github.com/unheaded/doomgeneric: first-party, SPDX MIT in every
          #     pkg/doom file, but its module dir (unheaded/) has no LICENSE
          #     file of its own for go-licenses to find.
          #   modernc.org/mathutil: LICENSE is BSD-3-Clause ("names of the
          #     authors" wording) that the classifier does not match.
          go-licenses check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC \
            --ignore unheaded \
            --ignore github.com/unheaded/doomgeneric \
            --ignore modernc.org/mathutil

  report:
    name: Generate Weekly Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [sbom-generate, grype-scan, license-compliance]
    if: always()
    steps:
      - uses: actions/checkout@v5

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v5
        with:
          name: sbom-artifacts
          path: sbom-results

      - name: Create audit report
        run: |
          cat > sbom-results/AUDIT-REPORT.md << 'EOF'
          # Weekly SBOM Audit Report

          **Date:** $(date -u +%Y-%m-%d)
          **Run ID:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}

          ## Status

          - SBOM Generation: ${{ needs.sbom-generate.result }}
          - Vulnerability Scan: ${{ needs.grype-scan.result }}
          - License Compliance: ${{ needs.license-compliance.result }}

          ## Artifacts

          See uploaded artifacts for detailed SBOM files and scan results.
          EOF

      - name: Upload audit report
        uses: actions/upload-artifact@v5
        with:
          name: sbom-audit-report
          path: sbom-results/AUDIT-REPORT.md
          retention-days: 90

      - name: Slack notification (optional)
        if: failure()
        run: |
          echo "SBOM audit failed - check GitHub Actions for details"
