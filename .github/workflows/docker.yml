#
# Builds the Wotan and Kanban images from the root Dockerfile's stages, amd64
# only. The image is built into the runner's Docker first, so Trivy reads the
# bytes that would ship; a push event then sends them to GHCR from the build
# cache. Trivy here reports and does not gate: a finding reaches the Security
# tab and the push still goes. A pull request builds and scans, and pushes
# nothing. check-ci-verdicts.sh holds that order, and these stages to the
# Dockerfile.
name: Docker

on:
  push:
    branches: [main, develop, staging]
    tags: ['v*']
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-wotan:
    name: Build Wotan Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/wotan
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Trivy pin (scripts/lib/tool-pins.sh)
        run: |
          source scripts/lib/tool-pins.sh
          echo "TRIVY_PIN=v${TRIVY_VERSION}" >> "$GITHUB_ENV"

      - name: Build into the runner's Docker
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          target: wotan
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/wotan:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wotan
          cache-to: type=gha,scope=wotan,mode=max
          platforms: linux/amd64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master, 2026-10-21 (trivy v0.76.1)
        with:
          version: ${{ env.TRIVY_PIN }}
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/wotan:${{ github.sha }}
          format: sarif
          output: trivy-wotan.sarif
          severity: CRITICAL,HIGH

      # Pull requests skip this: a fork's token may not write security events.
      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-wotan.sarif

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          target: wotan
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wotan
          platforms: linux/amd64

  build-kanban:
    name: Build Kanban Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/kanban
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Trivy pin (scripts/lib/tool-pins.sh)
        run: |
          source scripts/lib/tool-pins.sh
          echo "TRIVY_PIN=v${TRIVY_VERSION}" >> "$GITHUB_ENV"

      - name: Build into the runner's Docker
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          target: kanban-app
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/kanban:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kanban
          cache-to: type=gha,scope=kanban,mode=max
          platforms: linux/amd64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master, 2026-10-21 (trivy v0.76.1)
        with:
          version: ${{ env.TRIVY_PIN }}
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/kanban:${{ github.sha }}
          format: sarif
          output: trivy-kanban.sarif
          severity: CRITICAL,HIGH

      # Pull requests skip this: a fork's token may not write security events.
      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-kanban.sarif

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          target: kanban-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kanban
          platforms: linux/amd64
