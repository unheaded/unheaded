name: "Terraform Plan + Policy"
on:
  pull_request:
    paths:
    - "deploy/tofu/**"
    - "deploy/k8s/**"

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        layer: [networking, compute, identity, observability, ebpf]
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
    - uses: gruntwork-io/terragrunt-action@9559e51d05873b0ea467c42bbabcb5c067642ccc # v2

    - name: Format Check
      run: tofu fmt -check -recursive deploy/tofu/

    - name: Validate
      run: |
        cd deploy/tofu/environments/dev/${{ matrix.layer }}
        terragrunt validate

    - name: Policy Check (OPA)
      run: |
        cd deploy/tofu/environments/dev/${{ matrix.layer }}
        terragrunt plan -out=tfplan
        terragrunt show -json tfplan > plan.json
        conftest test plan.json -p ../../../policies/

    - name: Plan
      run: |
        cd deploy/tofu/environments/dev/${{ matrix.layer }}
        terragrunt plan -no-color
