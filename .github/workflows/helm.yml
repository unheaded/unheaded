name: Helm Chart Validation

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'helm/**'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'helm/**'

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint helm/unheaded/

      - name: Lint with values-dev
        run: helm lint helm/unheaded/ -f helm/unheaded/values-dev.yaml

      - name: Lint with values-prod
        run: helm lint helm/unheaded/ -f helm/unheaded/values-prod.yaml

  template:
    name: Helm Template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Template default values
        run: helm template unheaded helm/unheaded/ > /tmp/default.yaml

      - name: Template dev values
        run: helm template unheaded helm/unheaded/ -f helm/unheaded/values-dev.yaml > /tmp/dev.yaml

      - name: Template prod values
        run: helm template unheaded helm/unheaded/ -f helm/unheaded/values-prod.yaml > /tmp/prod.yaml

      - name: Verify YAML validity
        run: |
          python3 -c "import yaml; yaml.safe_load_all(open('/tmp/default.yaml'))"
          python3 -c "import yaml; yaml.safe_load_all(open('/tmp/dev.yaml'))"
          python3 -c "import yaml; yaml.safe_load_all(open('/tmp/prod.yaml'))"

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin

      - name: Validate schemas with kubeconform
        run: |
          kubeconform -summary -output json /tmp/default.yaml
          kubeconform -summary -output json /tmp/dev.yaml
          kubeconform -summary -output json /tmp/prod.yaml

  security:
    name: Chart Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Template chart
        run: helm template unheaded helm/unheaded/ > /tmp/manifests.yaml

      - name: Verify security context
        run: |
          # All deployments must have readOnlyRootFilesystem: true
          if grep -c "readOnlyRootFilesystem: true" /tmp/manifests.yaml | grep -q "0"; then
            echo "::error::Missing readOnlyRootFilesystem in security context"
            exit 1
          fi
          # Must have allowPrivilegeEscalation: false
          if grep -c "allowPrivilegeEscalation: false" /tmp/manifests.yaml | grep -q "0"; then
            echo "::error::Missing allowPrivilegeEscalation: false"
            exit 1
          fi
          # Must not have hostNetwork: true
          if grep -c "hostNetwork: true" /tmp/manifests.yaml | grep -v "0"; then
            echo "::error::hostNetwork: true is not permitted"
            exit 1
          fi
          # Must not have privileged: true
          if grep -c "privileged: true" /tmp/manifests.yaml | grep -v "0"; then
            echo "::error::privileged: true is not permitted"
            exit 1
          fi
          echo "✓ Security context checks passed"

      - name: OPA policy validation (placeholder)
        run: |
          echo "TODO: Integrate OPA/Gatekeeper for policy enforcement"
          echo "Example policies: no-host-network, no-privileged, require-security-context"
