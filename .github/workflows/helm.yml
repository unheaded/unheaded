name: Helm Chart Validation

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'helm/**'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'helm/**'

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Helm
        # Pinned Helm + sha256 (lib/tool-pins.sh); was setup-helm at 3.14.0.
        run: |
          ./scripts/ci-install-tools.sh "$RUNNER_TEMP/bin" helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint chart
        run: helm lint helm/unheaded/

      - name: Lint with values-dev
        run: helm lint helm/unheaded/ -f helm/unheaded/values-dev.yaml

      - name: Lint with values-prod
        run: helm lint helm/unheaded/ -f helm/unheaded/values-prod.yaml

  template:
    name: Helm Template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Helm
        # Pinned Helm + sha256 (lib/tool-pins.sh); was setup-helm at 3.14.0.
        run: |
          ./scripts/ci-install-tools.sh "$RUNNER_TEMP/bin" helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Template default values
        run: helm template unheaded helm/unheaded/ > /tmp/default.yaml

      - name: Template dev values
        run: helm template unheaded helm/unheaded/ -f helm/unheaded/values-dev.yaml > /tmp/dev.yaml

      - name: Template prod values
        run: helm template unheaded helm/unheaded/ -f helm/unheaded/values-prod.yaml > /tmp/prod.yaml

      - name: Verify YAML validity
        run: |
          python3 -c "import yaml; yaml.safe_load_all(open('/tmp/default.yaml'))"
          python3 -c "import yaml; yaml.safe_load_all(open('/tmp/dev.yaml'))"
          python3 -c "import yaml; yaml.safe_load_all(open('/tmp/prod.yaml'))"

      - name: Install kubeconform
        # Pinned + sha256; was releases/latest with no checksum.
        run: ./scripts/ci-install-tools.sh "$RUNNER_TEMP/bin" kubeconform

      - name: Validate schemas with kubeconform
        run: |
          kubeconform -summary -output json /tmp/default.yaml
          kubeconform -summary -output json /tmp/dev.yaml
          kubeconform -summary -output json /tmp/prod.yaml

  security:
    name: Chart Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Per container, for default/dev/prod values. The greps this replaces
      # passed if the string appeared once anywhere, and failed falsely at a
      # count of 10 (grep -q "0").
      - name: Every container is locked down
        run: ./scripts/check-helm-security.sh

      - name: OPA policy validation (placeholder)
        run: |
          echo "TODO: Integrate OPA/Gatekeeper for policy enforcement"
          echo "Example policies: no-host-network, no-privileged, require-security-context"
