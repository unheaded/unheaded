name: eBPF & Rust

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'ebpf/**'
      - 'crates/svc-token/**'
      - 'crates/objtrust/**'
      - 'cmd/ebpf-collector/**'
      - 'cmd/ebpf-load-check/**'
      - 'cmd/ebpf-loader/**'
      - 'cmd/upc-bootctl/**'
      - 'deploy/systemd/unheaded-upc-bootctl@.service'
      - 'crates/heimdall-bpf/**'
      # Go packages whose tests skip unless root: the ebpf-load-gate job runs
      # them (scripts/test-go-root.sh; tests/scripts/test_go_root_ci.py).
      - 'pkg/ebpf/**'
      - 'pkg/cartridge/**'
      - 'tests/hopchecks/**'
      - 'cmd/heimdall-daemon/**'
      - 'cmd/compliance-evidence/**'
      - 'cmd/protocol-api/**'
      - 'scripts/check-ebpf-loads.sh'
      - 'scripts/test-go-root.sh'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'ebpf/**'
      - 'crates/svc-token/**'
      - 'crates/objtrust/**'
      - 'cmd/ebpf-collector/**'
      - 'cmd/ebpf-load-check/**'
      - 'cmd/ebpf-loader/**'
      - 'cmd/upc-bootctl/**'
      - 'deploy/systemd/unheaded-upc-bootctl@.service'
      - 'crates/heimdall-bpf/**'
      # Go packages whose tests skip unless root: the ebpf-load-gate job runs
      # them (scripts/test-go-root.sh; tests/scripts/test_go_root_ci.py).
      - 'pkg/ebpf/**'
      - 'pkg/cartridge/**'
      - 'tests/hopchecks/**'
      - 'cmd/heimdall-daemon/**'
      - 'cmd/compliance-evidence/**'
      - 'cmd/protocol-api/**'
      - 'scripts/check-ebpf-loads.sh'
      - 'scripts/test-go-root.sh'

jobs:
  svc-token:
    name: svc-token (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt

      # The Wotan service-token crate ebpf-collector uses (ADR-103 §6). Its
      # Go cross-check is tests/svctoken (Go CI job).
      - name: svc-token (clippy, format, test)
        working-directory: crates/svc-token
        run: cargo clippy --locked --all-targets -- -D warnings && cargo fmt -- --check && cargo test --locked

      # What every Rust loader asks before it reads an object. Its Go twin is
      # pkg/ebpf/objtrust.
      - name: objtrust (clippy, format, test)
        working-directory: crates/objtrust
        run: cargo clippy --locked --all-targets -- -D warnings && cargo fmt -- --check && cargo test --locked

      # The [lib] crates the BPF programs and their loaders share (common,
      # monad-common, pqc-common: 163 tests on 2026-11-07). ebpf/'s own
      # .cargo/config.toml forces the BPF target, so the Makefile runs them
      # from the repo root with a separate target dir. No job ran them before.
      - name: ebpf common crates (host tests)
        run: make test-rust-ebpf-common

  # Each loader's tests/object_trust.rs: the loader refuses an object a non-root
  # user could write before it reads one, and upc-bootctl's unit does not point
  # at a directory its own account owns. objtrust's own tests above cannot see a
  # loader that stopped asking. Held to these four by tests/scripts/test_loader_ci.py.
  loader-object-trust:
    name: Rust loaders refuse an untrusted object
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        loader: [cmd/ebpf-collector, cmd/ebpf-load-check, cmd/ebpf-loader, cmd/upc-bootctl]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      # tonic-build in cmd/ebpf-collector runs protoc (see static-analysis.yml).
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Object trust tests
        working-directory: ${{ matrix.loader }}
        run: cargo test --locked

  ebpf-programs:
    name: eBPF Programs (Rust/Aya)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: nightly
          components: clippy, rustfmt, rust-src

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ebpf/target
          key: ${{ runner.os }}-cargo-ebpf-${{ hashFiles('ebpf/Cargo.lock') }}

      - name: Check eBPF programs
        working-directory: ebpf
        run: cargo check --target=bpfel-unknown-none

      - name: Format check
        working-directory: ebpf
        run: cargo fmt -- --check

  # Loads every program through the kernel verifier (scripts/check-ebpf-loads.sh).
  # Building proves nothing about the verifier; until this gate, 16 of 31
  # programs had never loaded, and nothing noticed. GitHub's runners have
  # passwordless sudo, so this really loads. The known-failing list was
  # measured on kernel 6.17; if the runner's kernel judges differently, the
  # gate says so, and that difference is worth knowing.
  ebpf-load-gate:
    name: eBPF programs pass the verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: nightly
          components: rust-src

      # Pinned as in static-analysis.yml, which says why this version.
      - name: Install bpf-linker
        run: cargo install bpf-linker@0.10.2 --locked

      - name: Kernel
        run: uname -r

      - name: Load every eBPF program
        env:
          EBPF_INSNS_OUT: ${{ runner.temp }}/ebpf-insns.tsv
        run: ./scripts/check-ebpf-loads.sh

      # The Go tests that skip unless root load the objects the step above
      # built: hop_xdp's checks, heimdall's objects, pinned maps. Before
      # 2026-11-08 only pkg/cartridge's ran anywhere (west's upc-regression).
      - name: Go tests that need root
        run: ./scripts/test-go-root.sh

      # Informational, not a gate. The verified-instruction ratchet
      # (scripts/check-ebpf-insns.sh, ADR-012) compares against a baseline
      # measured on west's kernel; this runner has another kernel, so its
      # counts are not comparable and the ratchet would refuse (exit 2). It gates on
      # west (scripts/ci-local.sh, check-gates-can-fail.sh); the meta-gate job
      # proves its logic on the recorded numbers only. The runner's numbers go
      # to the job summary, where a large drift is still visible.
      - name: Verified instruction counts (informational)
        if: always()
        run: |
          { echo "### Verified instructions on $(uname -r) (baseline: west, $(awk -F'\t' 'NR==2 {print $4}' docs/policy/ebpf-insns-baseline.tsv))"
            echo '| program | variant | here | baseline |'; echo '|---|---|---|---|'
            join -t $'\t' -a1 <(awk -F'\t' '{print $1 "|" $2 "\t" $3}' "${{ runner.temp }}/ebpf-insns.tsv" | sort) \
              <(awk -F'\t' 'NR>1 {print $1 "|" $2 "\t" $3}' docs/policy/ebpf-insns-baseline.tsv | sort) |
              awk -F'\t' '{split($1,k,"|"); printf "| %s | %s | %s | %s |\n", k[1], k[2], $2, ($3==""?"-":$3)}'
          } >> "$GITHUB_STEP_SUMMARY"
