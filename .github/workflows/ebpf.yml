name: eBPF & Rust

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'ebpf/**'
      - 'cmd/trace-collector/**'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'ebpf/**'
      - 'cmd/trace-collector/**'

jobs:
  trace-collector:
    name: Trace Collector (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-15
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/trace-collector/target
          key: ${{ runner.os }}-cargo-trace-${{ hashFiles('cmd/trace-collector/Cargo.lock') }}

      - name: Check
        working-directory: cmd/trace-collector
        run: cargo check

      - name: Clippy
        working-directory: cmd/trace-collector
        run: cargo clippy -- -D warnings

      - name: Format check
        working-directory: cmd/trace-collector
        run: cargo fmt -- --check

      - name: Test
        working-directory: cmd/trace-collector
        run: cargo test

  ebpf-programs:
    name: eBPF Programs (Rust/Aya)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly branch, 2026-10-15
        with:
          components: clippy, rustfmt, rust-src
          targets: bpfel-unknown-none

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ebpf/target
          key: ${{ runner.os }}-cargo-ebpf-${{ hashFiles('ebpf/Cargo.lock') }}

      - name: Check eBPF programs
        working-directory: ebpf
        run: cargo check --target=bpfel-unknown-none

      - name: Format check
        working-directory: ebpf
        run: cargo fmt -- --check

  # Loads every program through the kernel verifier (scripts/check-ebpf-loads.sh).
  # Building proves nothing about the verifier; until this gate, 16 of 31
  # programs had never loaded, and nothing noticed. GitHub's runners have
  # passwordless sudo, so this really loads. The known-failing list was
  # measured on kernel 6.17; if the runner's kernel judges differently, the
  # gate says so, and that difference is worth knowing.
  ebpf-load-gate:
    name: eBPF programs pass the verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly branch, 2026-10-15
        with:
          components: rust-src

      - name: Install bpf-linker
        run: cargo install bpf-linker --no-default-features  # as ci-protocol.yml

      - name: Kernel
        run: uname -r

      - name: Load every eBPF program
        run: ./scripts/check-ebpf-loads.sh
