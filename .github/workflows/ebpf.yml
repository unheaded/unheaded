name: eBPF & Rust

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'ebpf/**'
      - 'cmd/trace-collector/**'
      - 'crates/svc-token/**'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'ebpf/**'
      - 'cmd/trace-collector/**'
      - 'crates/svc-token/**'

jobs:
  trace-collector:
    name: Trace Collector (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/trace-collector/target
          key: ${{ runner.os }}-cargo-trace-${{ hashFiles('cmd/trace-collector/Cargo.lock') }}

      - name: Check
        working-directory: cmd/trace-collector
        run: cargo check

      - name: Clippy
        working-directory: cmd/trace-collector
        run: cargo clippy -- -D warnings

      - name: Format check
        working-directory: cmd/trace-collector
        run: cargo fmt -- --check

      - name: Test
        working-directory: cmd/trace-collector
        run: cargo test

      # The Wotan service-token crate trace-collector and ebpf-collector use
      # (ADR-103 §6). Its Go cross-check is tests/svctoken (Go CI job).
      - name: svc-token (clippy, format, test)
        working-directory: crates/svc-token
        run: cargo clippy --all-targets -- -D warnings && cargo fmt -- --check && cargo test

  ebpf-programs:
    name: eBPF Programs (Rust/Aya)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: nightly
          components: clippy, rustfmt, rust-src
          targets: bpfel-unknown-none

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ebpf/target
          key: ${{ runner.os }}-cargo-ebpf-${{ hashFiles('ebpf/Cargo.lock') }}

      - name: Check eBPF programs
        working-directory: ebpf
        run: cargo check --target=bpfel-unknown-none

      - name: Format check
        working-directory: ebpf
        run: cargo fmt -- --check

  # Loads every program through the kernel verifier (scripts/check-ebpf-loads.sh).
  # Building proves nothing about the verifier; until this gate, 16 of 31
  # programs had never loaded, and nothing noticed. GitHub's runners have
  # passwordless sudo, so this really loads. The known-failing list was
  # measured on kernel 6.17; if the runner's kernel judges differently, the
  # gate says so, and that difference is worth knowing.
  ebpf-load-gate:
    name: eBPF programs pass the verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: nightly
          components: rust-src

      - name: Install bpf-linker
        run: cargo install bpf-linker --no-default-features

      - name: Kernel
        run: uname -r

      - name: Load every eBPF program
        env:
          EBPF_INSNS_OUT: ${{ runner.temp }}/ebpf-insns.tsv
        run: ./scripts/check-ebpf-loads.sh

      # Informational, not a gate. The verified-instruction ratchet
      # (scripts/check-ebpf-insns.sh, ADR-012) compares against a baseline
      # measured on west's kernel with bpf-linker 0.10.2; this runner has
      # another kernel and installs bpf-linker unpinned, so its counts are
      # not comparable and the ratchet would refuse (exit 2). It gates on
      # west (scripts/ci-local.sh, check-gates-can-fail.sh). The runner's
      # numbers go to the job summary, where a large drift is still visible.
      - name: Verified instruction counts (informational)
        if: always()
        run: |
          { echo "### Verified instructions on $(uname -r) (baseline: west, $(awk -F'\t' 'NR==2 {print $4}' docs/policy/ebpf-insns-baseline.tsv))"
            echo '| program | variant | here | baseline |'; echo '|---|---|---|---|'
            join -t $'\t' -a1 <(awk -F'\t' '{print $1 "|" $2 "\t" $3}' "${{ runner.temp }}/ebpf-insns.tsv" | sort) \
              <(awk -F'\t' 'NR>1 {print $1 "|" $2 "\t" $3}' docs/policy/ebpf-insns-baseline.tsv | sort) |
              awk -F'\t' '{split($1,k,"|"); printf "| %s | %s | %s | %s |\n", k[1], k[2], $2, ($3==""?"-":$3)}'
          } >> "$GITHUB_STEP_SUMMARY"
