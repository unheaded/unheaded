name: OpenSSF Scorecard

# Supply-chain posture score (branch protection, pinned actions, token
# permissions, signed releases, ...), published to the OpenSSF API and
# uploaded as code-scanning results. S-IRON-GATE Step 313 (M-065).

on:
  push:
    branches: [develop]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # upload the SARIF
      id-token: write         # publish_results
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
