name: "Terraform Apply"
# Off since 2026-11-06 (S-ANSWERED). No event starts it, and a manual dispatch
# runs nothing. check-ci-verdicts.sh holds both.
on:
  workflow_dispatch:

jobs:
  apply:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        layer: [networking, compute, identity, observability, ebpf]
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
    - uses: gruntwork-io/terragrunt-action@9559e51d05873b0ea467c42bbabcb5c067642ccc # v2

    - name: Apply
      run: |
        cd deploy/tofu/environments/dev/${{ matrix.layer }}
        terragrunt apply -auto-approve -no-color
