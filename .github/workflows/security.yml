name: Daily Security Scan

on:
  schedule:
    # Every day at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run gosec
        uses: securego/gosec@v2.21.0
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

  cargo-audit:
    name: Rust Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit ebpf workspace
        working-directory: ebpf
        run: cargo audit --format json > audit-report.json || true

      - name: Audit cmd/trace-collector
        if: always()
        working-directory: cmd/trace-collector
        run: cargo audit --format json >> audit-report.json || true

      - name: Audit crates/monad-mbc
        if: always()
        working-directory: crates/monad-mbc
        run: cargo audit --format json >> audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
          retention-days: 30

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [govulncheck, gosec, cargo-audit, trivy-fs]
    if: always()
    steps:
      - name: Check all security scans passed
        run: |
          if [ "${{ needs.govulncheck.result }}" != "success" ]; then
            echo "::error::govulncheck failed"
            exit 1
          fi
          if [ "${{ needs.gosec.result }}" != "success" ]; then
            echo "::error::gosec failed"
            exit 1
          fi
          echo "✅ All security scans passed"
