name: Security Scan (Daily + PR)

on:
  schedule:
    # Every day at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: '1.25'

jobs:
  # ============================================================================
  # Go Security
  # ============================================================================
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # RATCHET — see docs/security/findings-remediation-2026-07-29.md
      #
      # Every rule below currently has outstanding findings and is excluded by
      # NAME. Rules NOT listed here are enforced at all severities, so any rule
      # already driven to zero (G402, G703, G704, …) stays enforced and cannot
      # regress. As each category is remediated, delete its ID from this list —
      # the exclusion set only ever shrinks, and the diff records the progress.
      #
      # Deliberately NOT a -severity/-confidence filter: that hides WHICH
      # findings were accepted, never shrinks as work lands, and silently
      # absorbs newly-added gosec rules.
      - name: Run gosec
        uses: securego/gosec@f184e33def921b62b2e6d7b36c3c2d4eb39619a8 # v2.21.0
        with:
          args: '-exclude=G101,G102,G103,G104,G112,G114,G115,G118,G124,G201,G203,G204,G301,G302,G304,G305,G306,G401,G402,G404,G501,G505,G602,G705,G706,G710 -fmt sarif -out gosec-results.sarif ./...'

      # The exclusion list above is a suppression mechanism, and suppression
      # mechanisms grow unless something stops them. This asserts the ratchet
      # is one-way: the list may shrink as findings are fixed, never grow.
      - name: Verify gosec ratchet only shrinks
        run: ./scripts/check-gosec-ratchet.sh

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@9792ccaef0455e446c567163589397e8c3ac2e0d # v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

  # ============================================================================
  # Secret Scanning
  # ============================================================================
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # full history — see note below

      # trivy's secret scanner covers the working tree. It does NOT cover git
      # HISTORY, and a credential committed then deleted is still public the
      # moment the repo is. A history scan on 2026-07-29 found 76 findings
      # across 2149 commits (2026-02-23 -> 2026-05-12), including what appear
      # to be real firewall admin credentials, a grafana admin password and a
      # grafana secret_key.
      #
      # .gitleaksignore holds fingerprints for those PRE-EXISTING findings so
      # this gate protects against NEW leaks today. It may only SHRINK: a new
      # leak is never added to it — rotate the credential and remove the line.
      #
      # HARD PRE-PUBLIC BLOCKER: the baselined findings must be triaged,
      # rotated, and (if real) excised from history before this repo goes
      # public. See docs/security/PRE-PUBLIC-BLOCKERS.md.
      - name: gitleaks (working tree — GATING)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir --no-banner --redact --exit-code 1 .

      - name: gitleaks (full history — reporting until history is remediated)
        continue-on-error: true
        run: /tmp/gitleaks git --no-banner --redact --exit-code 1 .

  # ============================================================================
  # Rust Security
  # ============================================================================
  cargo-audit:
    name: Rust Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # No `|| true`. These steps previously swallowed the exit code, so the
      # job reported success over a live advisory — RUSTSEC-2026-0204
      # (crossbeam-epoch) sat green in CI from 2026-07-06 until 2026-07-29.
      # A scanner that cannot fail is not a gate.
      - name: Audit ebpf workspace
        working-directory: ebpf
        run: cargo audit --format json > /tmp/audit-ebpf.json

      - name: Audit cmd/trace-collector
        if: always()
        working-directory: cmd/trace-collector
        run: cargo audit --format json > /tmp/audit-trace.json

      - name: Audit crates/monad-mbc
        if: always()
        working-directory: crates/monad-mbc
        run: cargo audit --format json > /tmp/audit-mbc.json

      - name: Upload audit reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-reports
          path: /tmp/audit-*.json
          retention-days: 30

  # ============================================================================
  # Filesystem Vulnerability Scan
  # ============================================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Secret scanning gates at ALL severities: the tree is clean (0 findings
      # as of 2026-07-29), so this is a real gate from day one — any committed
      # credential fails the build immediately.
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: secret
          exit-code: '1'

      # Dependency vulnerabilities.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      # IaC misconfiguration — was never enabled. Reports 522 findings
      # (2 CRITICAL / 36 HIGH / 81 MEDIUM / 403 LOW) across K8s manifests,
      # Helm templates and Dockerfiles, including root-running images
      # (DS-0002) and default security contexts (KSV-0118). Non-gating for
      # now while that backlog is worked; ratchet the severity down as
      # categories close. Tracked in the remediation doc.
      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: misconfig
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@9792ccaef0455e446c567163589397e8c3ac2e0d # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================================
  # Lich Security: Fuzzing Harnesses + Doom Security Tests
  # ============================================================================
  lich-fuzz:
    name: Lich Fuzz Harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go fuzz tests (short)
        run: |
          # Run each fuzz target for 30 seconds
          FUZZ_TIME=30s
          failed=0
          for pkg in $(go list ./... | head -50); do
            fuzz_targets=$(go test -list 'Fuzz.*' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
            for target in $fuzz_targets; do
              echo "Fuzzing $pkg :: $target (${FUZZ_TIME})"
              if ! go test -fuzz="^${target}$" -fuzztime="${FUZZ_TIME}" -timeout 60s "$pkg"; then
                echo "::warning::Fuzz failure in $pkg :: $target"
                failed=1
              fi
            done
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more fuzz targets found issues"
            exit 1
          fi
          echo "All fuzz targets passed"

  doom-security:
    name: Doom Range Port Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Doom Range port compliance
        run: |
          # Ensure no service binds outside the Doom Range (16666-26666)
          # Scan Go source for hardcoded port bindings outside range
          violations=$(grep -rn ':\(80\|443\|8080\|8443\|3000\|5000\|9090\)' \
            --include='*.go' \
            --exclude-dir=vendor \
            --exclude-dir=.git \
            --exclude='*_test.go' \
            --exclude='pkg/ports/*' \
            . | grep -v '//' | grep -v 'example' | grep -v 'TODO' | head -20 || true)
          if [ -n "$violations" ]; then
            echo "::warning::Potential port bindings outside Doom Range (16666-26666):"
            echo "$violations"
          fi
          echo "Doom Range compliance check complete"

      - name: Verify auth middleware integration
        run: |
          # Ensure all HTTP server setups reference auth middleware
          servers=$(grep -rn 'http\.ListenAndServe\|http\.Server{' \
            --include='*.go' \
            --exclude-dir=vendor \
            --exclude-dir=.git \
            --exclude='*_test.go' \
            . | head -30 || true)
          echo "HTTP server instances found:"
          echo "$servers"
          echo "Manual review: ensure all production servers use auth.Middleware()"

  # ============================================================================
  # Security Gate
  # ============================================================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [govulncheck, gosec, gitleaks, cargo-audit, trivy-fs]
    if: always()
    steps:
      - name: Check all security scans passed
        run: |
          echo "govulncheck: ${{ needs.govulncheck.result }}"
          echo "gosec: ${{ needs.gosec.result }}"
          echo "cargo-audit: ${{ needs.cargo-audit.result }}"
          echo "trivy-fs: ${{ needs.trivy-fs.result }}"
          if [ "${{ needs.govulncheck.result }}" != "success" ]; then
            echo "::error::govulncheck failed"
            exit 1
          fi
          if [ "${{ needs.gosec.result }}" != "success" ]; then
            echo "::error::gosec failed"
            exit 1
          fi
          echo "All required security scans passed"
