name: Security Scan (Daily + PR)

on:
  schedule:
    # Every day at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read
  security-events: write


jobs:
  # ============================================================================
  # Go Security
  # ============================================================================
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      # ADR-101: every migration is routed by db/migrations/MANIFEST (or
      # skipped on purpose) and free of psql meta-commands. Here because this
      # job already has Go; it needs no database.
      - name: The Well's migrations are all routed
        run: ./scripts/check-well-migrations.sh

      - name: The Well lint ratchet (ERDA 3.5)
        run: ./scripts/check-well-lint.sh

  gosec:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # RATCHET — see docs/security/findings-remediation-2026-07-29.md
      #
      # Every rule below currently has outstanding findings and is excluded by
      # NAME. Rules NOT listed here are enforced at all severities, so any rule
      # already driven to zero (G402, G703, G704, …) stays enforced and cannot
      # regress. As each category is remediated, delete its ID from this list —
      # the exclusion set only ever shrinks, and the diff records the progress.
      #
      # Deliberately NOT a -severity/-confidence filter: that hides WHICH
      # findings were accepted, never shrinks as work lands, and silently
      # absorbs newly-added gosec rules.
      #
      # Installed with the repo's own toolchain, not the securego/gosec action:
      # that action's image carried Go 1.22 with GOTOOLCHAIN=local, so against
      # this module every package failed to load and gosec scanned 0 files.
      # Pinned: a new gosec release adds rules, and that should be a deliberate
      # bump, not a red build out of nowhere.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Built from tools/gosec (gosec v2.29.0 + x/tools v0.52.0, go.sum-pinned):
      # `go install gosec@v2.29.0` brings an x/tools that cannot read Go 1.27
      # export data, so it type-checked nothing and failed on load errors.
      - name: Run gosec
        run: |
          go -C tools/gosec build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
          "$RUNNER_TEMP/gosec" -fmt sarif -out gosec-results.sarif -stdout -verbose=text ./...

      # The exclusion list above is a suppression mechanism, and suppression
      # mechanisms grow unless something stops them. This asserts the ratchet
      # is one-way: the list may shrink as findings are fixed, never grow.
      - name: Verify gosec ratchet only shrinks
        run: ./scripts/check-gosec-ratchet.sh

      # The rule list is empty, so annotations are the only way past gosec.
      # This holds their number, per file. Provoked red by adding one.
      - name: gosec suppressions may only shrink
        run: ./scripts/check-nosec-ratchet.sh

      - name: The suppression ratchet refuses each form it names
        run: ./scripts/test-check-nosec-ratchet.sh

      # An Encoder on a ResponseWriter leaves an empty 200 when a value will
      # not marshal; httputil.WriteJSON answers 500. Provoked red by putting
      # one back in Wotan's topic publish.
      - name: No handler encodes JSON to its ResponseWriter
        run: ./scripts/check-json-responses.sh

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: gosec-results.sarif

  # ============================================================================
  # Secret Scanning
  # ============================================================================
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # full history — see note below

      # trivy's secret scanner covers the working tree. It does NOT cover git
      # HISTORY, and a credential committed then deleted is still public the
      # moment the repo is. A history scan on 2026-07-29 found 76 findings
      # across 2149 commits (2026-02-23 -> 2026-05-12), including what appear
      # to be real firewall admin credentials, a grafana admin password and a
      # grafana secret_key.
      #
      # .gitleaksignore holds fingerprints for those PRE-EXISTING findings so
      # this gate protects against NEW leaks today. It may only SHRINK: a new
      # leak is never added to it — rotate the credential and remove the line.
      #
      # The repository is public: every value in history counts as burned, and
      # each one still in use is rotated at S-E1-LIVE. History is not rewritten.
      # See docs/security/PRE-PUBLIC-BLOCKERS.md.
      - name: gitleaks (working tree — GATING)
        # Version + sha256 pinned in the script and checked every run (it was
        # curl'd with no checksum); check-tool-freshness.sh keeps it current.
        run: ./scripts/check-gitleaks.sh

      # The baseline may only shrink. Without this, a gitleaks failure can be
      # silenced by appending the new fingerprint — turning the gate into
      # decoration, which is how the other three broken gates in this repo got
      # that way.
      - name: Secret baseline may only shrink
        run: ./scripts/check-secrets-baseline.sh

      # ADR-092. Reads the compose file, not the running containers: inspecting
      # live containers passes on any host whose daemon.json sets a default,
      # which is exactly how the missing caps went unnoticed.
      - name: Compose services declare their own log caps
        run: ./scripts/check-compose-log-caps.sh

      # S-LOG-HARVEST Phase 2: every unit file, compose service and host has
      # a row in config/logging/sources.yaml (pkg/logsources is the gate).
      - name: Every log source is inventoried
        run: ./scripts/check-log-sources.sh

      # S-CLEAN-SLATE M-035: both haproxy configs parse under the image the
      # load-balancer compose file pins (they did not, unnoticed, for months).
      - name: haproxy configs parse (haproxy -c)
        run: ./scripts/check-haproxy-cfg.sh

      # S-TWO-BRAINS Phase 13: the Kanban Genesis cards are reviewed in
      # db/seed/kanban-genesis.json and reach the Well through migration
      # 034, rendered from it; neither may drift from the other.
      - name: Kanban Genesis migration matches its JSON
        run: ./scripts/check-kanban-genesis.sh

      # ADR-095: a moved tag runs new code with this repo's token. Every
      # action is pinned to a commit SHA, with the tag in a comment.
      - name: GitHub Actions pinned to commit SHAs
        run: ./scripts/check-actions-pinned.sh

      # ADR-091: the initdb bug was a bind mount nested inside another's
      # mountpoint. Fixed in B7; this keeps it fixed. Provoked red by
      # recreating the original nesting.
      - name: No nested bind mounts in compose
        run: ./scripts/check-compose-bind-nesting.sh

      # Docker's NAT rules go around a host firewall, so a publish with no
      # address is open whatever the firewall says. Provoked red by dropping
      # the address from victoria's publish.
      - name: Every compose publish names an internal address
        run: ./scripts/check-compose-publish-bind.sh

      - name: The publish gate refuses each form it names
        run: ./scripts/test-check-compose-publish-bind.sh

      # A scrape at host.docker.internal needs a publish on docker0's gateway:
      # loopback is refused there, and nothing but missing series shows it.
      # Provoked red by dropping wotan's gateway publish.
      - name: Every gateway scrape target has a publish
        run: ./scripts/check-scrape-publish.sh

      # ADR-094: prometheus/client_golang was replaced by pkg/metrics and
      # removed from go.mod. This keeps it out. Provoked red by planting an
      # import in a new file.
      - name: No prometheus/client_golang
        run: ./scripts/check-no-client-golang.sh

      # ADR-092: /tmp is world-writable, cleared on reboot and unrotated.
      # 31 call sites remain; the migration is per-service, so this holds the
      # line rather than demanding it all at once. Compares the path SET, not
      # a count — check-secrets-baseline.sh learned that one the hard way.
      - name: /tmp log paths may only shrink
        run: ./scripts/check-tmp-log-baseline.sh

      # ADR-096 §3: a package the build pulls in that nobody recorded (go.sum,
      # Cargo.lock, requirements, package.json) fails here.
      - name: Third-party packages may only shrink
        run: ./scripts/check-dependency-baseline.sh

      # ADR-085: a unit must not run a /usr/local/bin binary nothing builds.
      - name: Every unit's binary is built by scripts/build-binaries.sh
        run: ./scripts/check-unit-binaries.sh

      # ADR-102: no new latest / major-only image tag anywhere.
      - name: Floating image tags may only shrink
        run: ./scripts/check-image-tags.sh

      # L23: a compose image keeps the digest it was pinned to.
      - name: Compose images keep their digests
        run: ./scripts/check-image-digests.sh

      # A finding with a row in docs/policy/gitleaks-history-baseline.txt
      # warns; a new one, or a scan that could not run, fails the job, so no
      # continue-on-error here.
      - name: gitleaks (full history — known findings warn, new ones fail)
        run: ./scripts/check-gitleaks.sh --history

      - name: The history scan's verdicts hold
        run: ./scripts/test-check-gitleaks-history.sh

  # ============================================================================
  # Post-quantum key exchange (ADR-105)
  # ============================================================================
  # Its own job, next to the image-tag ratchet above, because it needs Go
  # (cmd/crypto-inventory) and Python jsonschema (the CycloneDX schema check),
  # which the gitleaks job does not set up.
  crypto-inventory:
    name: Crypto inventory (CBOM) is fresh and schema-valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install jsonschema (hashed lock)
        run: "pip install --quiet --require-hashes --no-deps --only-binary=:all: -r .github/ci-python/requirements.txt"

      # ADR-105: compliance/crypto/cbom.cdx.json must equal a regeneration
      # from the tree, and validate against the CycloneDX 1.6 schema.
      - name: Crypto inventory matches the tree
        run: ./scripts/check-crypto-inventory.sh --schema

      # ADR-105: no new classical-only key exchange; the baseline
      # (docs/policy/pq-kex-baseline.txt) may only shrink.
      - name: No new classical-only key exchange
        run: ./scripts/check-pq-kex.sh

  # ============================================================================
  # Rust Security
  # ============================================================================
  cargo-audit:
    name: Rust Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked

      # Discover workspaces rather than listing them. The previous version
      # hardcoded ebpf, cmd/trace-collector and crates/monad-mbc — so
      # crates/zhend and cmd/upc-bootctl were NEVER audited. crates/zhend was
      # carrying RUSTSEC-2026-0204 (crossbeam-epoch) unnoticed as a result.
      #
      # No `|| true`: these steps previously swallowed the exit code, so the
      # job reported success over live advisories. A scanner that cannot fail
      # is not a gate.
      - name: Audit all Rust workspaces
        run: |
          fail=0
          for d in $(git ls-files '*/Cargo.lock' | xargs -n1 dirname | sort -u); do
            echo "::group::cargo audit $d"
            (cd "$d" && cargo audit --format json > "/tmp/audit-$(echo "$d" | tr / -).json") || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Upload audit reports
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cargo-audit-reports
          path: /tmp/audit-*.json
          retention-days: 30

  # ============================================================================
  # Python: known vulnerabilities in pinned requirements (ADR-096 §3)
  # ============================================================================
  # Go has govulncheck and Rust cargo audit above; Python had nothing.
  # Accepted findings live in docs/policy/python-audit-accepted.txt, which
  # may only shrink.
  # Release-pinned tools (oxlint today) stay current: fails once a newer
  # release has been out 7 days. Younger ones wait out the window in which
  # hijacked releases are usually pulled. Reads the releases API only.
  tool-freshness:
    name: Pinned tools are current (7-day cooldown)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check pinned tool releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-tool-freshness.sh

  python-audit:
    name: Python Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: "pip install --quiet --require-hashes --no-deps --only-binary=:all: -r .github/ci-python/requirements.txt"

      - name: Pinned requirements have no unaccepted advisories
        run: ./scripts/check-python-audit.sh

  # ============================================================================
  # Filesystem Vulnerability Scan
  # ============================================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Secret scanning gates at ALL severities: the tree is clean (0 findings
      # as of 2026-07-29), so this is a real gate from day one — any committed
      # credential fails the build immediately.
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master, 2026-10-21 (trivy v0.76.1)
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: secret
          exit-code: '1'

      # Dependency vulnerabilities, every severity, for code scanning. This
      # step only reports; "Trivy vulnerability gate" below is the verdict.
      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master, 2026-10-21 (trivy v0.76.1)
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: vuln
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      # IaC misconfiguration — was never enabled. Reports 522 findings
      # (2 CRITICAL / 36 HIGH / 81 MEDIUM / 403 LOW) across K8s manifests,
      # Helm templates and Dockerfiles, including root-running images
      # (DS-0002) and default security contexts (KSV-0118). Those counts are
      # from the first enablement; tracked in the remediation doc.
      # trivyignores is REQUIRED here: trivy does not auto-discover
      # .trivyignore.yaml in this mode. Verified — without the flag the file is
      # decorative and every documented exception is silently ignored.
      #
      # GATING since 2026-10-28 (S-TRUE-WIRE Step 364) through a shrink-only
      # ratchet: the scan writes JSON and scripts/check-trivy-misconfig.sh
      # compares every (rule, file) count with
      # docs/policy/trivy-misconfig-baseline.tsv (364 failed checks at seed).
      # A new finding, one more of a known one, or a fixed one still listed
      # fails. The trivy version and the checks bundle come from
      # scripts/lib/tool-pins.sh, the same pins the baseline was seeded with:
      # without the bundle pin trivy fetches the newest checks every run.
      - name: Trivy pins (scripts/lib/tool-pins.sh)
        run: |
          source scripts/lib/tool-pins.sh
          echo "TRIVY_PIN=v${TRIVY_VERSION}" >> "$GITHUB_ENV"
          echo "TRIVY_CHECKS_BUNDLE_REPOSITORY=${TRIVY_CHECKS_BUNDLE}" >> "$GITHUB_ENV"

      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master, 2026-10-21 (trivy v0.76.1)
        with:
          version: ${{ env.TRIVY_PIN }}
          scan-type: fs
          scan-ref: '.'
          scanners: misconfig
          trivyignores: .trivyignore.yaml
          exit-code: '0'
          format: json
          output: trivy-misconfig.json

      - name: Trivy misconfig ratchet (GATING)
        run: scripts/check-trivy-misconfig.sh trivy-misconfig.json

      # Any CRITICAL or HIGH fails, whether or not a fixed release exists: a
      # package with no fix still has to be answered for, by replacing it or
      # taking it out. Table, not sarif: the action drops `severity` for
      # sarif, and this would fail on every LOW.
      - name: Trivy vulnerability gate (GATING)
        if: always()
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master, 2026-10-21 (trivy v0.76.1)
        with:
          version: ${{ env.TRIVY_PIN }}
          scan-type: fs
          scan-ref: '.'
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================================
  # Lich Security: Fuzzing Harnesses + Doom Security Tests
  # ============================================================================
  lich-fuzz:
    name: Lich Fuzz Harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Every package with a Fuzz function, each target for FUZZ_TIME. This
      # was `go list ./... | head -50`: 3 of the 12 packages with fuzz
      # targets were in the first 50 of 298, so the rest were never fuzzed
      # here (their seed corpora still ran as plain tests). 99 targets at
      # 10 s took about 19 minutes on west.
      - name: Run Go fuzz tests (short)
        run: |
          FUZZ_TIME=10s
          failed=0
          n=0
          for dir in $(git ls-files '*_test.go' | xargs grep -l '^func Fuzz' | xargs -n1 dirname | sort -u); do
            pkg="./$dir"
            # A package that fails to build lists nothing: without these
            # checks its targets would drop out of the job silently.
            if ! list=$(go test -list '^Fuzz' "$pkg"); then
              echo "::error::go test -list failed for $pkg"
              failed=1
              continue
            fi
            targets=$(printf '%s\n' "$list" | grep '^Fuzz' || true)
            if [ -z "$targets" ]; then
              echo "::error::$pkg has func Fuzz* in its tests but go test -list found none"
              failed=1
              continue
            fi
            for target in $targets; do
              n=$((n + 1))
              echo "Fuzzing $pkg :: $target (${FUZZ_TIME})"
              if ! go test -run '^$' -fuzz="^${target}\$" -fuzztime="${FUZZ_TIME}" -timeout 120s "$pkg"; then
                echo "::error::Fuzz failure in $pkg :: $target"
                failed=1
              fi
            done
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::no fuzz targets found; refusing to pass vacuously"
            exit 1
          fi
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more fuzz targets found issues"
            exit 1
          fi
          echo "All $n fuzz targets passed"

  doom-security:
    name: Doom Range Port Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Doom Range port compliance
        run: |
          # Ensure no service binds outside the Doom Range (16666-26666)
          # Scan Go source for hardcoded port bindings outside range
          violations=$(grep -rn ':\(80\|443\|8080\|8443\|3000\|5000\|9090\)' \
            --include='*.go' \
            --exclude-dir=vendor \
            --exclude-dir=.git \
            --exclude='*_test.go' \
            --exclude='pkg/ports/*' \
            . | grep -v '//' | grep -v 'example' | grep -v 'TODO' | head -20 || true)
          if [ -n "$violations" ]; then
            echo "::warning::Potential port bindings outside Doom Range (16666-26666):"
            echo "$violations"
          fi
          echo "Doom Range compliance check complete"

      - name: HTTP listeners use pkg/auth or are recorded
        run: ./scripts/check-http-auth.sh

  # ============================================================================
  # Security Gate
  # ============================================================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [govulncheck, gosec, gitleaks, cargo-audit, trivy-fs]
    if: always()
    steps:
      # Reads whatever `needs` lists, so a job added above is covered with no
      # second list to keep. Anything but success fails, skipped included.
      # scripts/check-ci-verdicts.sh runs this body against fixture results.
      - name: Check all security scans passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          results="$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS_JSON")"
          if [ -z "$results" ]; then
            echo "::error::Security Gate read no job results"
            exit 1
          fi
          fail=0
          while read -r job result; do
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "::error::$job: $result"
              fail=1
            fi
          done <<<"$results"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All required security scans passed"

  # ============================================================================
  # The Well: schema, migrations, backups, on throwaway servers (ADR-101)
  # ============================================================================
  # Each script starts its own postgres:16.15-alpine container, never a real
  # Well: fresh bootstrap through db/init.sh, constraint and append-only
  # refusals (013-019), the migration runner (apply, drift, lock timeout,
  # baseline of a pre-ledger Well, which needs history: fetch-depth 0), and
  # a backup set restored by the drill. ERDA plan step 3.5.
  well-schema:
    name: The Well (throwaway Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Schema constraints and Go integration tests
        run: ./scripts/well/test-compliance-schema.sh --go

      - name: Migration runner and ledger
        env:
          GOTOOLCHAIN: local
        run: ./scripts/well/test-migrate.sh

      # S-WELL-SPRING Phase 1 (M-070): the live batch, rehearsed. A Well at
      # 029 gets batch-apply's dry run, a part-way failure rolled back
      # (Appendix A1), the real batch, its rollback and a re-apply.
      - name: Migration batch apply and rollback
        env:
          GOTOOLCHAIN: local
        run: ./scripts/well/test-batch-apply.sh

      # S-IRON-GATE Phase 3: api_keys (036) and pkg/auth's Well store.
      - name: API keys table and the Well key store
        run: ./scripts/well/test-api-keys.sh --with-go

      # S-WELL-SPRING Phase 3: slo_definitions (040), alert-policy
      # -sync-well and the -check drift leg against this throwaway Well.
      - name: SLO definitions table and the alert-policy Well leg
        run: ./scripts/well/test-slo-definitions.sh

      # S-WELL-SPRING Phase 4: retention_runner (042), retention_runs and
      # retention_archive (043), and cmd/well-retention end to end.
      - name: Retention job, its role and its records
        run: ./scripts/well/test-retention.sh

      # S-E1-LIVE Step 279: log_events (048), its partitions, and
      # log_writer's insert-only grants.
      - name: Log store table, its partitions and its role
        run: ./scripts/well/test-log-events.sh --go

      - name: Backup set and restore drill
        run: ./scripts/well/test-backup-restore.sh

      - name: Deployed config, pg_hba and TLS
        run: ./scripts/well/test-config.sh

      # FND-005: the repository mirror to east keeps refs west deleted or
      # rewrote. Local throwaway repos only; no network.
      - name: Repository mirror keeps what west drops
        run: ./scripts/backup/test-git-mirror.sh

      # ERDA 1.2: east's check of the offsite copies. A copy cut short is
      # BAD, and pruning never lets broken copies push good sets out.
      - name: Offsite check fails short copies, prunes by good sets
        run: ./scripts/well/test-offsite-check.sh

      # ADR-085 Phase 2: the .deb maintainer scripts, as dpkg calls them.
      # An upgrade must never stop or disable the service.
      - name: Package maintainer scripts keep services across upgrades
        run: ./scripts/test-deb-maintscripts.sh

      # S-IRON-GATE Phase 14: the signed apt repo (scripts/apt-repo.sh) with a
      # throwaway key: apt accepts it with the exported key, refuses any other.
      - name: Signed apt repo accepts its key, refuses others
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq reprepro
          ./tests/apt/apt_repo_test.sh

      # M-089: the perf baseline gate itself (fixtures; the live run is
      # west-only, scripts/ci-local.sh CI_LOCAL_PERF=1).
      - name: Perf regression gate passes faster, fails slower
        run: ./scripts/test-check-perf-regression.sh

  # ============================================================================
  # Alert rules: every Prometheus rule parses and its promtool tests pass
  # ============================================================================
  # Runs in the image monitoring/docker-compose.yml deploys and a current one.
  # A rule file that fails to parse silences every alert in it; a threshold
  # edited wrong fires on nothing. Here rather than ci.yml, which is disabled.
  prometheus-rules:
    name: Prometheus alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # ADR-100: slo.yml and alertmanager.yml are generated from
      # observability/alerting/policy.yaml, and every hand-written rule is
      # urgency none (only SLOs notify). YAML only here: WELL_DB is unset, so
      # the Well drift leg (slo_definitions vs the policy, S-WELL-SPRING
      # Phase 3) is skipped. It is proved against a throwaway server in the
      # well-schema job (test-slo-definitions.sh) and runs against the live
      # Well on west from scripts/ci-local.sh when WELL_DB is set.
      - name: Alert policy generated files are current
        run: go run ./cmd/alert-policy --check

      - name: Rules parse and rule tests pass
        run: ./scripts/check-prometheus-rules.sh

      # ADR-100 Phase 3: the log-volume and auth-failure SLIs that logs.yml
      # alerts on are built in Vector; its config validates and its unit
      # tests (config/vector/tests) pass in the deployed image.
      - name: Vector config and its tests
        run: ./scripts/test-vector-config.sh

      # S-LOG-HARVEST Steps 164a-164f: the Pi-hole history import loses no
      # line and loads none twice, on made-up data, in containers with the
      # network off.
      - name: Pi-hole history import
        run: ./scripts/test-pihole-history.sh

      # ADR-100 / FND-001: Prometheus -> Alertmanager -> alert-mailer -> SMTP
      # sink on throwaway containers; urgency none mails no one; the cap holds.
      - name: Alert path end to end
        run: ./scripts/monitoring/test-alert-path.sh
