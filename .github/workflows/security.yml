name: Security Scan (Daily + PR)

on:
  schedule:
    # Every day at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read
  security-events: write


jobs:
  # ============================================================================
  # Go Security
  # ============================================================================
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch doomgeneric (go.mod replace target)
        run: ./scripts/ci-fetch-doomgeneric.sh

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # ADR-101: every migration is routed by db/migrations/MANIFEST (or
      # skipped on purpose) and free of psql meta-commands. Here because this
      # job already has Go; it needs no database.
      - name: The Well's migrations are all routed
        run: ./scripts/check-well-migrations.sh

      - name: The Well lint ratchet (ERDA 3.5)
        run: ./scripts/check-well-lint.sh

  gosec:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # RATCHET — see docs/security/findings-remediation-2026-07-29.md
      #
      # Every rule below currently has outstanding findings and is excluded by
      # NAME. Rules NOT listed here are enforced at all severities, so any rule
      # already driven to zero (G402, G703, G704, …) stays enforced and cannot
      # regress. As each category is remediated, delete its ID from this list —
      # the exclusion set only ever shrinks, and the diff records the progress.
      #
      # Deliberately NOT a -severity/-confidence filter: that hides WHICH
      # findings were accepted, never shrinks as work lands, and silently
      # absorbs newly-added gosec rules.
      #
      # Installed with the repo's own toolchain, not the securego/gosec action:
      # that action's image carried Go 1.22 with GOTOOLCHAIN=local, so against
      # this module every package failed to load and gosec scanned 0 files.
      # Pinned: a new gosec release adds rules, and that should be a deliberate
      # bump, not a red build out of nowhere.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch doomgeneric (go.mod replace target)
        run: ./scripts/ci-fetch-doomgeneric.sh

      # Built from tools/gosec (gosec v2.29.0 + x/tools v0.52.0, go.sum-pinned):
      # `go install gosec@v2.29.0` brings an x/tools that cannot read Go 1.27
      # export data, so it type-checked nothing and failed on load errors.
      - name: Run gosec
        run: |
          go -C tools/gosec build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
          "$RUNNER_TEMP/gosec" -fmt sarif -out gosec-results.sarif -stdout -verbose=text ./...

      # The exclusion list above is a suppression mechanism, and suppression
      # mechanisms grow unless something stops them. This asserts the ratchet
      # is one-way: the list may shrink as findings are fixed, never grow.
      - name: Verify gosec ratchet only shrinks
        run: ./scripts/check-gosec-ratchet.sh

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: gosec-results.sarif

  # ============================================================================
  # Secret Scanning
  # ============================================================================
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # full history — see note below

      # trivy's secret scanner covers the working tree. It does NOT cover git
      # HISTORY, and a credential committed then deleted is still public the
      # moment the repo is. A history scan on 2026-07-29 found 76 findings
      # across 2149 commits (2026-02-23 -> 2026-05-12), including what appear
      # to be real firewall admin credentials, a grafana admin password and a
      # grafana secret_key.
      #
      # .gitleaksignore holds fingerprints for those PRE-EXISTING findings so
      # this gate protects against NEW leaks today. It may only SHRINK: a new
      # leak is never added to it — rotate the credential and remove the line.
      #
      # HARD PRE-PUBLIC BLOCKER: the baselined findings must be triaged,
      # rotated, and (if real) excised from history before this repo goes
      # public. See docs/security/PRE-PUBLIC-BLOCKERS.md.
      - name: gitleaks (working tree — GATING)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir --no-banner --redact --exit-code 1 .

      # The baseline may only shrink. Without this, a gitleaks failure can be
      # silenced by appending the new fingerprint — turning the gate into
      # decoration, which is how the other three broken gates in this repo got
      # that way.
      - name: Secret baseline may only shrink
        run: ./scripts/check-secrets-baseline.sh

      # ADR-092. Reads the compose file, not the running containers: inspecting
      # live containers passes on any host whose daemon.json sets a default,
      # which is exactly how the missing caps went unnoticed.
      - name: Compose services declare their own log caps
        run: ./scripts/check-compose-log-caps.sh

      # ADR-101: the Kubernetes Well's initdb ConfigMap is rendered from db/,
      # so a migration added for compose reaches Kubernetes too.
      - name: Kubernetes Well initdb matches db/
        run: ./scripts/check-k8s-well-initdb.sh

      # ADR-095: a moved tag runs new code with this repo's token. Every
      # action is pinned to a commit SHA, with the tag in a comment.
      - name: GitHub Actions pinned to commit SHAs
        run: ./scripts/check-actions-pinned.sh

      # ADR-091: the initdb bug was a bind mount nested inside another's
      # mountpoint. Fixed in B7; this keeps it fixed. Provoked red by
      # recreating the original nesting.
      - name: No nested bind mounts in compose
        run: ./scripts/check-compose-bind-nesting.sh

      # ADR-094: prometheus/client_golang was replaced by pkg/metrics and
      # removed from go.mod. This keeps it out. Provoked red by planting an
      # import in a new file.
      - name: No prometheus/client_golang
        run: ./scripts/check-no-client-golang.sh

      # ADR-092: /tmp is world-writable, cleared on reboot and unrotated.
      # 31 call sites remain; the migration is per-service, so this holds the
      # line rather than demanding it all at once. Compares the path SET, not
      # a count — check-secrets-baseline.sh learned that one the hard way.
      - name: /tmp log paths may only shrink
        run: ./scripts/check-tmp-log-baseline.sh

      - name: gitleaks (full history — reporting only, see PRE-PUBLIC-BLOCKERS.md)
        continue-on-error: true
        run: /tmp/gitleaks git --no-banner --redact --exit-code 1 .

  # ============================================================================
  # Rust Security
  # ============================================================================
  cargo-audit:
    name: Rust Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-15

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Discover workspaces rather than listing them. The previous version
      # hardcoded ebpf, cmd/trace-collector and crates/monad-mbc — so
      # crates/zhend and cmd/upc-bootctl were NEVER audited. crates/zhend was
      # carrying RUSTSEC-2026-0204 (crossbeam-epoch) unnoticed as a result.
      #
      # No `|| true`: these steps previously swallowed the exit code, so the
      # job reported success over live advisories. A scanner that cannot fail
      # is not a gate.
      - name: Audit all Rust workspaces
        run: |
          fail=0
          for d in $(git ls-files '*/Cargo.lock' | xargs -n1 dirname | sort -u); do
            echo "::group::cargo audit $d"
            (cd "$d" && cargo audit --format json > "/tmp/audit-$(echo "$d" | tr / -).json") || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Upload audit reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-reports
          path: /tmp/audit-*.json
          retention-days: 30

  # ============================================================================
  # Filesystem Vulnerability Scan
  # ============================================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Secret scanning gates at ALL severities: the tree is clean (0 findings
      # as of 2026-07-29), so this is a real gate from day one — any committed
      # credential fails the build immediately.
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master branch, 2026-10-15
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: secret
          exit-code: '1'

      # Dependency vulnerabilities.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master branch, 2026-10-15
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      # IaC misconfiguration — was never enabled. Reports 522 findings
      # (2 CRITICAL / 36 HIGH / 81 MEDIUM / 403 LOW) across K8s manifests,
      # Helm templates and Dockerfiles, including root-running images
      # (DS-0002) and default security contexts (KSV-0118). Non-gating for
      # now while that backlog is worked; ratchet the severity down as
      # categories close. Tracked in the remediation doc.
      # trivyignores is REQUIRED here: trivy does not auto-discover
      # .trivyignore.yaml in this mode. Verified — without the flag the file is
      # decorative and every documented exception is silently ignored.
      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master branch, 2026-10-15
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: misconfig
          trivyignores: .trivyignore.yaml
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================================
  # Lich Security: Fuzzing Harnesses + Doom Security Tests
  # ============================================================================
  lich-fuzz:
    name: Lich Fuzz Harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch doomgeneric (go.mod replace target)
        run: ./scripts/ci-fetch-doomgeneric.sh

      - name: Run Go fuzz tests (short)
        run: |
          # Run each fuzz target for 30 seconds
          FUZZ_TIME=30s
          failed=0
          for pkg in $(go list ./... | head -50); do
            fuzz_targets=$(go test -list 'Fuzz.*' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
            for target in $fuzz_targets; do
              echo "Fuzzing $pkg :: $target (${FUZZ_TIME})"
              if ! go test -fuzz="^${target}$" -fuzztime="${FUZZ_TIME}" -timeout 60s "$pkg"; then
                echo "::warning::Fuzz failure in $pkg :: $target"
                failed=1
              fi
            done
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more fuzz targets found issues"
            exit 1
          fi
          echo "All fuzz targets passed"

  doom-security:
    name: Doom Range Port Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Doom Range port compliance
        run: |
          # Ensure no service binds outside the Doom Range (16666-26666)
          # Scan Go source for hardcoded port bindings outside range
          violations=$(grep -rn ':\(80\|443\|8080\|8443\|3000\|5000\|9090\)' \
            --include='*.go' \
            --exclude-dir=vendor \
            --exclude-dir=.git \
            --exclude='*_test.go' \
            --exclude='pkg/ports/*' \
            . | grep -v '//' | grep -v 'example' | grep -v 'TODO' | head -20 || true)
          if [ -n "$violations" ]; then
            echo "::warning::Potential port bindings outside Doom Range (16666-26666):"
            echo "$violations"
          fi
          echo "Doom Range compliance check complete"

      - name: Verify auth middleware integration
        run: |
          # Ensure all HTTP server setups reference auth middleware
          servers=$(grep -rn 'http\.ListenAndServe\|http\.Server{' \
            --include='*.go' \
            --exclude-dir=vendor \
            --exclude-dir=.git \
            --exclude='*_test.go' \
            . | head -30 || true)
          echo "HTTP server instances found:"
          echo "$servers"
          echo "Manual review: ensure all production servers use auth.Middleware()"

  # ============================================================================
  # Security Gate
  # ============================================================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [govulncheck, gosec, gitleaks, cargo-audit, trivy-fs]
    if: always()
    steps:
      - name: Check all security scans passed
        run: |
          echo "govulncheck: ${{ needs.govulncheck.result }}"
          echo "gosec: ${{ needs.gosec.result }}"
          echo "cargo-audit: ${{ needs.cargo-audit.result }}"
          echo "trivy-fs: ${{ needs.trivy-fs.result }}"
          if [ "${{ needs.govulncheck.result }}" != "success" ]; then
            echo "::error::govulncheck failed"
            exit 1
          fi
          if [ "${{ needs.gosec.result }}" != "success" ]; then
            echo "::error::gosec failed"
            exit 1
          fi
          echo "All required security scans passed"

  # ============================================================================
  # IDS rules: the Monad Suricata rules load and fire on the right packets
  # ============================================================================
  # Until 2026-09-25 no rule had ever loaded (`ipv6-exthdr` is not a Suricata
  # keyword). Replays generated packets through the DaemonSet's Suricata image
  # and Suricata 8 (what nixpkgs ships), and checks the K8s and Nix copies.
  suricata-rules:
    name: Suricata Monad rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: PyYAML
        run: python3 -c 'import yaml' || pip install pyyaml

      - name: Rules load and fire as expected
        run: ./scripts/check-suricata-rules.sh

  # ============================================================================
  # The Well: schema, migrations, backups, on throwaway servers (ADR-101)
  # ============================================================================
  # Each script starts its own postgres:16.15-alpine container, never a real
  # Well: fresh bootstrap through db/init.sh, constraint and append-only
  # refusals (013-019), the migration runner (apply, drift, lock timeout,
  # baseline of a pre-ledger Well, which needs history: fetch-depth 0), and
  # a backup set restored by the drill. ERDA plan step 3.5.
  well-schema:
    name: The Well (throwaway Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch doomgeneric (go.mod replace target)
        run: ./scripts/ci-fetch-doomgeneric.sh

      - name: Schema constraints and Go integration tests
        run: ./scripts/well/test-compliance-schema.sh --go

      - name: Migration runner and ledger
        env:
          GOTOOLCHAIN: local
        run: ./scripts/well/test-migrate.sh

      - name: Backup set and restore drill
        run: ./scripts/well/test-backup-restore.sh

      - name: Deployed config, pg_hba and TLS
        run: ./scripts/well/test-config.sh

  # ============================================================================
  # Alert rules: every Prometheus rule parses and its promtool tests pass
  # ============================================================================
  # Runs in the image monitoring/docker-compose.yml deploys and a current one.
  # A rule file that fails to parse silences every alert in it; a threshold
  # edited wrong fires on nothing. Here rather than ci.yml, which is disabled.
  prometheus-rules:
    name: Prometheus alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Rules parse and rule tests pass
        run: ./scripts/check-prometheus-rules.sh
