name: GPL Boundary Check

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read

jobs:
  gpl-boundary:
    name: GPL/AGPL Boundary Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch doomgeneric (go.mod replace target)
        run: ./scripts/ci-fetch-doomgeneric.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install license tools
        run: |
          go install github.com/google/go-licenses@latest
          cargo install cargo-license || true

      - name: Run GPL boundary verification
        run: |
          chmod +x scripts/verify-gpl-boundary.sh
          scripts/verify-gpl-boundary.sh

      - name: Upload GPL boundary report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: gpl-boundary-report
          path: sbom-results/gpl-boundary-report.txt
          retention-days: 30
