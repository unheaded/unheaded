name: CI (Protocol Foundation)

on:
  push:
    branches: [main, develop, "theory/protocol-foundation"]
  pull_request:
    branches: [main, develop, "theory/protocol-foundation"]

permissions:
  contents: read
  security-events: write
  packages: write

env:
  GO_VERSION: '1.24'
  RUST_STABLE: 'stable'
  RUST_NIGHTLY: 'nightly-2025-06-01'
  # bpfel-unknown-none requires nightly + build-std=core
  BPF_TARGET: 'bpfel-unknown-none'

jobs:
  # ============================================================================
  # Go Jobs
  # ============================================================================
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go Cache (modules)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  go-test:
    name: Go Test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go Cache (modules)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run tests with race detection
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: go
          fail_ci_if_error: false

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [go-lint, go-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go Cache (modules)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build all binaries
        run: |
          mkdir -p bin
          # Core platform
          [ -d wotan/cmd/wotan ]         && go build -o bin/wotan         ./wotan/cmd/wotan
          [ -d wotan/cmd/wotan-cli ]     && go build -o bin/wotan-cli     ./wotan/cmd/wotan-cli
          # Unheaded apps
          [ -d cmd/kanban-app ]            && go build -o bin/kanban-app     ./cmd/kanban-app
          [ -d cmd/unheaded-daemon ]       && go build -o bin/unheaded-daemon ./cmd/unheaded-daemon
          [ -d cmd/dashboard-backend ]     && go build -o bin/dashboard-backend ./cmd/dashboard-backend

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: bin/
          retention-days: 7

  # ============================================================================
  # Rust Jobs — Host-testable crates (stable)
  # ============================================================================
  rust-check:
    name: Rust Check + Clippy (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy

      - name: Cache cargo (ebpf workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ebpf -> target
            crates/monad-mbc -> target
          key: ${{ runner.os }}-cargo-${{ env.RUST_STABLE }}

      - name: Check formatting — ebpf workspace
        working-directory: ebpf
        run: cargo fmt --check

      - name: Check formatting — monad-mbc
        working-directory: crates/monad-mbc
        run: cargo fmt --check

      - name: Clippy — monad-common (host target)
        working-directory: ebpf
        run: cargo clippy -p monad-common -- -D warnings

      - name: Clippy — monad-mbc
        working-directory: crates/monad-mbc
        run: cargo clippy -- -D warnings

  rust-test:
    name: Rust Test (stable, host-testable crates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ebpf -> target
            crates/monad-mbc -> target
          key: ${{ runner.os }}-cargo-${{ env.RUST_STABLE }}

      - name: Test monad-common (host, with race-equivalent --test-threads=1 for determinism)
        working-directory: ebpf
        run: cargo test -p monad-common -- --nocapture

      - name: Test monad-mbc (assembler, disasm, translator)
        working-directory: crates/monad-mbc
        run: cargo test -- --nocapture

      - name: Test monad-mbc (integration tests)
        working-directory: crates/monad-mbc
        run: cargo test --test '*' -- --nocapture
        continue-on-error: true  # integration tests may need fixtures; non-blocking

  # ============================================================================
  # Rust Jobs — eBPF programs (nightly + bpfel-unknown-none)
  # ============================================================================
  ebpf-build:
    name: eBPF Build (nightly, bpfel-unknown-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          # rust-src needed for -Z build-std=core
          components: rust-src

      - name: Cache cargo (nightly)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ebpf -> target"
          # Key on nightly date so stale caches don't cause verifier issues
          key: ${{ env.RUST_NIGHTLY }}-bpf

      - name: Install bpf-linker
        run: cargo install bpf-linker --no-default-features

      - name: Build shield-ebpf (XDP ingress + TC egress)
        working-directory: ebpf
        run: |
          cargo build -p shield-ebpf \
            --target ${{ env.BPF_TARGET }} \
            -Z build-std=core \
            --release

      - name: Build hop-ebpf (per-hop XDP processor)
        working-directory: ebpf
        run: |
          cargo build -p hop-ebpf \
            --target ${{ env.BPF_TARGET }} \
            -Z build-std=core \
            --release

      - name: Build yaldabaoth-ebpf (chaos injection TC)
        working-directory: ebpf
        run: |
          cargo build -p yaldabaoth-ebpf \
            --target ${{ env.BPF_TARGET }} \
            -Z build-std=core \
            --release

      - name: Build monad-cpu-ebpf (MBC fetch-decode-execute)
        working-directory: ebpf
        run: |
          cargo build -p monad-cpu-ebpf \
            --target ${{ env.BPF_TARGET }} \
            -Z build-std=core \
            --release

      - name: Upload eBPF objects
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-objects
          path: |
            ebpf/target/${{ env.BPF_TARGET }}/release/shield-ebpf
            ebpf/target/${{ env.BPF_TARGET }}/release/hop-ebpf
            ebpf/target/${{ env.BPF_TARGET }}/release/yaldabaoth-ebpf
            ebpf/target/${{ env.BPF_TARGET }}/release/monad-cpu-ebpf
          retention-days: 14

  # ============================================================================
  # Rust Security
  # ============================================================================
  rust-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit ebpf workspace
        working-directory: ebpf
        run: cargo audit
        continue-on-error: true  # advisory — do not block on RUSTSEC-* that have no fix

      - name: Audit monad-mbc
        working-directory: crates/monad-mbc
        run: cargo audit
        continue-on-error: true

  # ============================================================================
  # Go Security Scanning
  # ============================================================================
  security-scan:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run gosec
        uses: securego/gosec@v2.21.0
        with:
          args: '-fmt sarif -out gosec.sarif ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
        if: always()

  # ============================================================================
  # Proto Validation
  # ============================================================================
  proto-lint:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protos
        run: buf lint
        if: hashFiles('buf.yaml') != ''

      - name: Check breaking changes
        run: buf breaking --against '.git#branch=main'
        if: hashFiles('buf.yaml') != '' && github.event_name == 'pull_request'

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [go-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: go test -v -tags=integration ./...
        env:
          INTEGRATION_TEST: "true"

  # ============================================================================
  # Benchmarks (PR only)
  # ============================================================================
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go benchmarks
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark.txt

      - name: Compare benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: benchmark.txt
          fail-on-alert: false
          comment-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust benchmarks — monad-mbc
        working-directory: crates/monad-mbc
        run: cargo bench 2>&1 | tee /tmp/rust-bench.txt || true

  # ============================================================================
  # Gate: all required jobs pass
  # ============================================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - go-lint
      - go-test
      - go-build
      - rust-check
      - rust-test
      - ebpf-build
    steps:
      - name: All required checks passed
        run: echo "✅ All CI checks passed — ready to merge"
