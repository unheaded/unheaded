name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read
  security-events: write

# Builds may not edit go.mod/go.sum, every module hash is checked against the
# public checksum database, and the toolchain is exactly go.mod's toolchain line
# (S-LOW-FRUIT Phase 10; the Makefile exports the same three).
env:
  GOFLAGS: -mod=readonly
  GOSUMDB: sum.golang.org
  GOTOOLCHAIN: go1.27.3

jobs:
  go-build:
    name: Go Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Cache (modules)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      # No gofmt gate existed, only the local pre-commit hook — which is why
      # six files had drifted. The tree is gofmt-clean as of 2026-09-22, so
      # this holds the line rather than asking for a cleanup. tomb/ was added
      # 2026-09-23 after nine harnesses there turned out to have drifted
      # precisely because the gate did not reach them.
      - name: Gofmt
        run: |
          unformatted="$(gofmt -l cmd pkg services tomb)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift in:"
            echo "$unformatted"
            echo "run: gofmt -w $unformatted"
            exit 1
          fi
          echo "gofmt clean"

      # ADR-093 rule 5. Reads the repository, never the running host: asking
      # docker what is up would pass on whichever machine has the stack
      # running, which is the mistake rule 4 names.
      - name: Live-path inventory is current
        run: ./scripts/live-path-inventory.sh --check

      - name: Vet
        run: go vet ./...

      # The stdio handshake Claude Code performs against Zhen's MCP server
      # (.mcp.json -> scripts/zhen-mcp.sh -> cmd/zhen-mcp): read-only tool
      # list, refusals are isError. No model, no network; a few seconds.
      - name: Zhen MCP handshake
        run: ./scripts/check-zhen-mcp.sh

      - name: Test with race detector and coverage
        run: |
          go test -race -count=1 -timeout 120s -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 60" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 7

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # v9: v6 runs golangci-lint v1 only, and .golangci.yml is the v2 schema.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: "latest" moved under the gate. v2.15.0 reads go1.27 export
          # data (2.10.1 cannot) and reports 0 issues on develop (2026-10-28).
          version: v2.15.0
          args: --timeout=10m

  # gosec, govulncheck and the SBOM scan run in security.yml and sbom.yml,
  # correctly configured (gosec go-installed at the module's Go, grype at a
  # medium cutoff). The copies here could not work:
  # the gosec action ran Go 1.22 and scanned 0 files, and the SBOM job piped unpinned install scripts
  # and ended in `|| true`. Removed 2026-10-13 when this workflow was
  # re-enabled.

  rust-check:
    name: Rust Check (monad-mbc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/monad-mbc/target
          key: ${{ runner.os }}-cargo-monad-mbc-${{ hashFiles('crates/monad-mbc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-monad-mbc-

      - name: Check
        run: cargo check --manifest-path crates/monad-mbc/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path crates/monad-mbc/Cargo.toml -- -D warnings

      - name: Format check
        run: cargo fmt --manifest-path crates/monad-mbc/Cargo.toml -- --check

      - name: Test
        run: cargo test --locked --manifest-path crates/monad-mbc/Cargo.toml

  # Rust crates whose tests no other job ran until 2026-11-07: CI tested only
  # monad-mbc, and ebpf.yml the loaders, svc-token and objtrust. upc-api is
  # the loader both UPC loaders share (71 tests). Held to the full list by
  # tests/scripts/test_rust_ci.py.
  rust-crates:
    name: Rust tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [crates/upc-api, crates/upc-bootstub, crates/upc-cartridge, crates/xv6-mbc, crates/zhend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      # zhend's tonic-build runs protoc.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Test
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked

  spdx-check:
    name: SPDX License Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Go and Rust are gated; .py/.sh still have Doom scripts without a
      # header (S-TRUE-WIRE Step 325), so they join once that count is 0.
      - name: Verify Go and Rust files have SPDX headers (no MIT headers)
        run: ./scripts/check-spdx.sh --langs go,rs --forbid MIT

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Same reviewed ignore list as the weekly SBOM audit (sbom-audit.yml):
      #   unheaded: this module (GPL-3.0); the allow-list is for dependencies.
      #   modernc.org/mathutil: BSD-3-Clause the classifier does not match.
      - name: License check
        run: |
          go install github.com/google/go-licenses@v1.6.0  # pinned: @latest moves under the gate
          go-licenses check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC \
            --ignore unheaded \
            --ignore modernc.org/mathutil

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [go-build, go-lint, rust-check, rust-crates, spdx-check, license-check]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "go-build: ${{ needs.go-build.result }}"
          echo "go-lint: ${{ needs.go-lint.result }}"
          echo "rust-check: ${{ needs.rust-check.result }}"
          echo "rust-crates: ${{ needs.rust-crates.result }}"
          echo "spdx-check: ${{ needs.spdx-check.result }}"
          echo "license-check: ${{ needs.license-check.result }}"
          failed=0
          for result in \
            "${{ needs.go-build.result }}" \
            "${{ needs.go-lint.result }}" \
            "${{ needs.rust-check.result }}" \
            "${{ needs.rust-crates.result }}" \
            "${{ needs.spdx-check.result }}" \
            "${{ needs.license-check.result }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
