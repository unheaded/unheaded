name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  go-build:
    name: Go Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go Cache (modules)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: |
          go test -race -count=1 -timeout 120s -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 60" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 7

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: latest
          args: --timeout=5m

  sbom:
    name: SBOM Generation & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: syft dir:. -o cyclonedx-json=sbom-cyclonedx.json --quiet

      - name: Generate SPDX SBOM
        run: syft dir:. -o spdx-json=sbom-spdx.json --quiet

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan with Grype
        run: grype sbom:sbom-cyclonedx.json -o sarif --file grype-results.sarif || true

      - name: Check for critical vulnerabilities
        run: |
          if [ -f grype-results.sarif ]; then
            CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' grype-results.sarif)
            if [ "${CRITICAL}" -gt 0 ]; then
              echo "::warning::Found CRITICAL vulnerabilities in dependencies"
            fi
          fi

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
            grype-results.sarif

      - name: Upload Grype SARIF to security tab
        uses: github/codeql-action/upload-sarif@9792ccaef0455e446c567163589397e8c3ac2e0d # v3
        if: always()
        with:
          sarif_file: grype-results.sarif

      - name: Generate SBOM attestation placeholder
        run: |
          echo "# SBOM Attestation (SLSA Provenance)" > sbom-attestation.txt
          echo "Attestation would be signed and verified here" >> sbom-attestation.txt
          echo "TODO: Integrate with sigstore/cosign for production" >> sbom-attestation.txt

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run gosec
        uses: securego/gosec@f184e33def921b62b2e6d7b36c3c2d4eb39619a8 # v2.21.0
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@9792ccaef0455e446c567163589397e8c3ac2e0d # v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

  rust-check:
    name: Rust Check (monad-mbc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/monad-mbc/target
          key: ${{ runner.os }}-cargo-monad-mbc-${{ hashFiles('crates/monad-mbc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-monad-mbc-

      - name: Check
        run: cargo check --manifest-path crates/monad-mbc/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path crates/monad-mbc/Cargo.toml -- -D warnings

      - name: Format check
        run: cargo fmt --manifest-path crates/monad-mbc/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path crates/monad-mbc/Cargo.toml

  spdx-check:
    name: SPDX License Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify all Go files have SPDX headers
        run: |
          missing=$(find . -name "*.go" -not -path "./.git/*" -not -path "./vendor/*" \
            -exec grep -L "SPDX-License-Identifier" {} + 2>/dev/null | head -20)
          if [ -n "$missing" ]; then
            echo "::error::Files missing SPDX-License-Identifier header:"
            echo "$missing"
            count=$(echo "$missing" | wc -l)
            echo "::error::Total files missing headers: $count"
            exit 1
          fi
          echo "All Go files have SPDX headers"

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true

      - name: License check
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [go-build, go-lint, rust-check, spdx-check, gosec, govulncheck, license-check]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "go-build: ${{ needs.go-build.result }}"
          echo "go-lint: ${{ needs.go-lint.result }}"
          echo "rust-check: ${{ needs.rust-check.result }}"
          echo "spdx-check: ${{ needs.spdx-check.result }}"
          echo "gosec: ${{ needs.gosec.result }}"
          echo "govulncheck: ${{ needs.govulncheck.result }}"
          echo "license-check: ${{ needs.license-check.result }}"
          failed=0
          for result in \
            "${{ needs.go-build.result }}" \
            "${{ needs.go-lint.result }}" \
            "${{ needs.rust-check.result }}" \
            "${{ needs.spdx-check.result }}" \
            "${{ needs.gosec.result }}" \
            "${{ needs.govulncheck.result }}" \
            "${{ needs.license-check.result }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
