# Dependabot (free on GitHub; this repo is public, so the CI its PRs start
# costs nothing either). Actions only for now: every workflow pins actions
# to a commit SHA with the tag in a comment (ADR-095, check-actions-pinned),
# and Dependabot bumps both together. One grouped PR a week, not one per
# action. Container images: ADR-102 (exact tags; revisit digests + bot).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
