# Dependabot (free on GitHub; this repo is public, so the CI its PRs start
# costs nothing either). Actions only for now: every workflow pins actions
# to a commit SHA with the tag in a comment (ADR-095, check-actions-pinned),
# and Dependabot bumps both together. One grouped PR a week per ecosystem,
# not one per update. Container base images and Go modules too (S-IRON-GATE
# Step 323), Cargo since S-LOW-FRUIT. Actions and images wait out the 7-day
# cooldown the gates enforce (ADR-096); Go and Rust code waits 14. Nothing
# auto-merges: a bump of a module marked STALE or handover in
# docs/policy/dependency-watch.md is merged only after scripts/dep-diff.sh
# output has been read.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories: ["/", "/docker/**", "/deploy/**"]
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      images:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(images)

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      go:
        patterns: ["*"]
    # 14 days for code dependencies (S-LOW-FRUIT Phase 10): a poisoned
    # release is usually pulled within days, so the ecosystem finds it first.
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: cargo
    directories: ["/ebpf", "/ebpf/af-xdp", "/crates/*", "/cmd/upc-bootctl", "/cmd/waf", "/cmd/trace-collector", "/cmd/ebpf-collector", "/cmd/ebpf-loader", "/cmd/ebpf-load-check"]
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      rust:
        patterns: ["*"]
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
