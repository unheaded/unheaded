# Trivy ignore file — per-finding rationale, NOT a blanket suppression.
#
# Same ratchet policy as the gosec exclusion list
# (docs/security/findings-remediation-2026-07-29.md): this file may only
# SHRINK. A new finding is never added here to make a build pass — it gets
# fixed, or it gets an entry that explains why the check does not apply, with
# enough detail that a reviewer can disagree.
#
# Every entry below states WHY the container needs the privilege, not merely
# that it currently has it.

misconfigurations:
  # ── DS-0002: "Image user should not be 'root'" ────────────────────────────
  #
  # These are routing and firewall daemons. They need CAP_NET_ADMIN to program
  # the kernel routing table / netfilter, and the ones that can drop privileges
  # already do so internally after binding — which is the upstream-recommended
  # pattern for each, not an oversight:
  #
  #   bird  — Dockerfile creates bird:153 and bird drops to it via its config
  #   frr   — built with --enable-user=frr --enable-group=frr, so the daemons
  #           run as frr; only the supervisor starts as root
  #   ospf  — same FRR-family pattern
  #
  # Forcing USER at the image level would break privilege-dropping daemons,
  # which need to start privileged in order to drop. The correct control here
  # is capability scoping at the runtime (cap_drop: ALL + cap_add: NET_ADMIN),
  # tracked separately.
  - id: DS-0002
    paths:
      - "docker/firewall/bird/Dockerfile"
      - "docker/firewall/frr/Dockerfile"
      - "docker/routing/ospf/Dockerfile"
      - "routing/bird/Dockerfile"
      - "routing/frr/Dockerfile"
    statement: >-
      Routing daemon requiring CAP_NET_ADMIN; drops to a dedicated unprivileged
      user internally after start (bird:153 / frr via --enable-user). Runtime
      capability scoping is the applicable control, not image-level USER.

  # ipfire and opnsense are full firewall appliance images that manage
  # interfaces, netfilter and their own service supervision. They have no
  # privilege-dropping story today and genuinely run as root.
  #
  # NOT a false positive — a real accepted risk, and the weakest entry in this
  # file. Tracked in docs/security/findings-remediation-2026-07-29.md; these
  # should either gain a dedicated user or be confined by runtime capability
  # scoping before anything outside the lab depends on them.
  - id: DS-0002
    paths:
      - "docker/firewall/ipfire/Dockerfile"
      - "docker/firewall/opnsense/Dockerfile"
    statement: >-
      Firewall appliance image with no privilege-dropping path today. ACCEPTED
      RISK, not a false positive — needs a dedicated user or runtime capability
      confinement before production exposure.

  # ── Host access that is inherent to the workload ──────────────────────────
  #
  # These are not hardening gaps; the capability IS the function. Each was
  # checked against what the workload actually does, not waved through:
  #
  #   suricata       an IDS that reads raw packets off the wire. hostNetwork +
  #                  NET_RAW is the entire point; without it there is nothing
  #                  to inspect.
  #   wireguard      a VPN. SYS_MODULE loads the kernel module, NET_ADMIN
  #                  configures the interface, hostNetwork carries the tunnel.
  #   void-collector the eBPF collector. Already the best-scoped of the three:
  #                  privileged:false with only BPF, PERFMON and NET_ADMIN.
  #   node-exporter  host metrics. hostPID and the /proc,/sys mounts ARE the
  #                  data source; without them it exports nothing.
  #
  # The applicable control for all four is capability scoping (which they
  # already do — none uses privileged:true) plus the dedicated UIDs now
  # assigned in pkg/uids. Removing the access would remove the service.
  - id: KSV-0009
    paths:
      - "kubernetes/manifests/base/suricata/daemonset.yaml"
      - "kubernetes/manifests/overlays/wireguard/wireguard.yaml"
      - "deploy/k8s/ebpf/void-collector-daemonset.yaml"
      - "kubernetes/manifests/base/telemetry/node-exporter-daemonset.yaml"
    statement: >-
      hostNetwork is inherent: packet-capture IDS, VPN tunnel, eBPF collector
      and host metrics respectively. Capability-scoped, none privileged:true.

  - id: KSV-0119
    paths:
      - "kubernetes/manifests/base/suricata/daemonset.yaml"
    statement: >-
      NET_RAW is what lets Suricata read raw packets. Without it the IDS has
      no input.

  - id: KSV-0120
    paths:
      - "kubernetes/manifests/overlays/wireguard/wireguard.yaml"
    statement: >-
      SYS_MODULE loads the WireGuard kernel module. Removing it removes the VPN.

  - id: KSV-0010
    paths:
      - "kubernetes/manifests/base/telemetry/node-exporter-daemonset.yaml"
    statement: >-
      hostPID is node-exporter's data source for process metrics.

  - id: KSV-0024
    paths:
      - "kubernetes/manifests/base/telemetry/node-exporter-daemonset.yaml"
      - "kubernetes/manifests/overlays/wireguard/wireguard.yaml"
    statement: >-
      Host ports: node-exporter is scraped per-node; WireGuard needs a stable
      UDP listener reachable from outside the cluster.

  - id: KSV-0121
    paths:
      - "kubernetes/manifests/base/telemetry/node-exporter-daemonset.yaml"
    statement: >-
      The /proc and /sys hostPath mounts ARE the metric source. Both read-only.

  # ── Kustomize strategic-merge patch, scanned standalone ───────────────────
  #
  # Not a real finding. This file is a PATCH that adds a CSI secret mount; it
  # is merged onto cuirass-deployment.yaml, which carries the full security
  # context (runAsNonRoot, runAsUser 16740, readOnlyRootFilesystem: true,
  # capabilities drop ALL). trivy scans the patch in isolation and therefore
  # sees a bare pod spec.
  - id: KSV-0118
    paths:
      - "deploy/k8s/armory/cuirass-deployment-with-secrets.yaml"
    statement: >-
      Kustomize strategic-merge patch; the base carries the full security
      context. trivy scans the patch standalone.

  - id: KSV-0014
    paths:
      - "deploy/k8s/armory/cuirass-deployment-with-secrets.yaml"
    statement: >-
      Kustomize strategic-merge patch; the base sets
      readOnlyRootFilesystem: true.

  # ── KSV-0125: "image from an untrusted registry" ──────────────────────────
  #
  # trivy checks against its OWN built-in list of well-known registries. It has
  # no way to know ghcr.io/unheaded is ours, so every first-party image trips
  # this regardless of which registry we choose — the count does not move when
  # the image reference is corrected.
  #
  # Registry trust IS enforced here, by an admission policy rather than by the
  # scanner: deploy/k8s/policies/enforce-trusted-registries.yaml. That
  # allowlist was tightened alongside this entry — bare "unheaded/" was removed
  # because Docker resolves an unqualified namespace to docker.io/unheaded, an
  # org this project does not demonstrably control, so a squatted or mistyped
  # namespace could have satisfied the policy. All first-party manifests now
  # use ghcr.io/unheaded, which follows the GitHub org.
  - id: KSV-0125
    statement: >-
      Registry trust is enforced by deploy/k8s/policies/enforce-trusted-registries.yaml,
      not by trivy's built-in registry list, which cannot know ghcr.io/unheaded
      is first-party.

  # ── MEDIUM triage (2026-07-29) ───────────────────────────────────────────

  # Pattern-match false positives. Neither value is a secret; trivy matched on
  # the KEY NAME, not the content:
  #   UNHEADED_NETWORK_MTU: "1380"   — an MTU
  #   ssl-redirect-port:    "21443"  — a port number
  - id: KSV-01010
    paths:
      - "kubernetes/manifests/base/config/configmap-shared.yaml"
      - "kubernetes/manifests/base/haproxy-ingress/configmap.yaml"
    statement: >-
      Values are an MTU (1380) and a port (21443). trivy matched the key names,
      not sensitive content.

  # The armory control plane reconciles Deployments, so it needs to see and
  # patch them. Checked the actual verbs rather than the rule title: read-only
  # on pods/services/endpoints/configmaps/pods-log, update+patch on
  # deployments/replicasets, NO create or delete on pods, and NO access to
  # secrets at all — which is the verb that would make this dangerous.
  - id: KSV-0048
    paths:
      - "deploy/k8s/rbac/armory-role.yaml"
    statement: >-
      Control plane reconciling Deployments. Read-only except update/patch on
      deployments/replicasets; no pod create/delete and no secrets access.

  # Same inherent-access set already documented above for KSV-0009/0119/0120:
  # a packet-capture IDS, a VPN loading a kernel module, an eBPF collector and
  # host metrics. The capability and the hostPath ARE the function.
  - id: KSV-0022
    paths:
      - "deploy/k8s/ebpf/void-collector-daemonset.yaml"
      - "kubernetes/manifests/base/suricata/daemonset.yaml"
      - "kubernetes/manifests/overlays/wireguard/wireguard.yaml"
      - "kubernetes/manifests/overlays/gpu-vllm/vllm.yaml"
    statement: >-
      Capabilities are scoped and additive over drop:ALL — BPF/PERFMON for the
      collector, NET_RAW for the IDS, SYS_MODULE for the VPN, SYS_PTRACE for
      the ROCm runtime.

  - id: KSV-0023
    paths:
      - "deploy/k8s/ebpf/void-collector-daemonset.yaml"
      - "kubernetes/manifests/base/telemetry/node-exporter-daemonset.yaml"
      - "kubernetes/manifests/base/telemetry/promtail-daemonset.yaml"
      - "kubernetes/manifests/overlays/wireguard/wireguard.yaml"
      - "kubernetes/manifests/overlays/gpu-vllm/vllm.yaml"
    statement: >-
      hostPath IS the data source: bpffs, /proc and /sys, container logs, and
      the ROCm device nodes /dev/kfd and /dev/dri.

  # Kustomize strategic-merge patch, scanned standalone — see the KSV-0118
  # entry above. The base sets allowPrivilegeEscalation:false and
  # seccompProfile: RuntimeDefault.
  - id: KSV-0001
    paths:
      - "deploy/k8s/armory/cuirass-deployment-with-secrets.yaml"
    statement: >-
      Kustomize patch; base sets allowPrivilegeEscalation: false.

  - id: KSV-0104
    paths:
      - "deploy/k8s/armory/cuirass-deployment-with-secrets.yaml"
    statement: >-
      Kustomize patch; base sets seccompProfile: RuntimeDefault.

  # SSH into a firewall appliance image is how these are administered. Same
  # ACCEPTED RISK as their DS-0002 entry above, not a false positive.
  - id: DS-0004
    paths:
      - "docker/firewall/ipfire/Dockerfile"
      - "docker/firewall/opnsense/Dockerfile"
    statement: >-
      Firewall appliance management interface. ACCEPTED RISK, tracked with the
      DS-0002 entry for the same images.

