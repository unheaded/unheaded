<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unheaded Alpha - Built by Unheaded 🔄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kanban.css">
    <meta name="description" content="Unheaded Alpha Kanban Dashboard - Tracking our own development with our own tools">
    <meta name="theme-color" content="#0a0a0f">
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <header>
        <h1>🔄 Unheaded Alpha - Built by Unheaded</h1>
        <div class="live-indicator">
            <span>Live</span>
        </div>
    </header>

    <main>
        <div id="kanban-board">
            <div class="column" id="todo">
                <h2>TODO</h2>
                <div class="cards"></div>
            </div>
            <div class="column" id="in-progress">
                <h2>IN PROGRESS</h2>
                <div class="cards"></div>
            </div>
            <div class="column" id="done">
                <h2>DONE</h2>
                <div class="cards"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>The meta moment: tracking Unheaded's progress with Unheaded</p>
        <p class="version">v0.1.0-alpha • Phase 1</p>
    </footer>

    <script src="/js/particles.js"></script>
    <script src="/js/board-viz.js"></script>
    <script src="/js/timeline-reader.js"></script>
</body>
</html>
