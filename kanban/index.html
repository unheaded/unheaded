<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unheaded Alpha - Built by Unheaded</title>
    <link rel="stylesheet" href="/css/kanban.css">
    <meta name="description" content="Unheaded Alpha Kanban Dashboard - Tracking our own development with our own tools">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="ws-reconnect-banner" id="ws-reconnect-banner" role="alert" aria-live="assertive" aria-atomic="true">
        <span class="reconnect-spinner" aria-hidden="true"></span>
        <span class="reconnect-text">Reconnecting to server...</span>
        <button class="reconnect-retry-btn" id="reconnect-retry-btn" aria-label="Retry connection now">Retry</button>
    </div>

    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <header role="banner">
        <h1><span aria-hidden="true">🔄</span> Unheaded Alpha - Built by Unheaded</h1>
        <div class="live-indicator" role="status" aria-label="Live connection status">
            <span>Live</span>
        </div>
    </header>

    <main id="main-content" role="main">
        <div id="kanban-board" role="region" aria-label="Kanban task board">
            <div class="column" id="todo" role="region" aria-label="Todo tasks">
                <h2>TODO</h2>
                <div class="cards" role="list" aria-label="Todo task cards"></div>
            </div>
            <div class="column" id="in-progress" role="region" aria-label="In progress tasks">
                <h2>IN PROGRESS</h2>
                <div class="cards" role="list" aria-label="In progress task cards"></div>
            </div>
            <div class="column" id="done" role="region" aria-label="Done tasks">
                <h2>DONE</h2>
                <div class="cards" role="list" aria-label="Done task cards"></div>
            </div>
        </div>
    </main>

    <footer role="contentinfo">
        <p>The meta moment: tracking Unheaded's progress with Unheaded</p>
        <p class="version">v0.1.0-alpha &bull; Phase 1</p>
    </footer>

    <!-- Task Detail Modal -->
    <div id="task-modal-overlay" class="modal-overlay" aria-hidden="true">
        <div class="modal-container" role="dialog" aria-labelledby="modal-title" aria-modal="true">
            <div class="modal-header">
                <h3 id="modal-title" class="modal-task-title">Task Title</h3>
                <button class="modal-close-btn" id="modal-close-btn" aria-label="Close modal">&times;</button>
            </div>

            <div class="modal-body">
                <!-- View Mode -->
                <div id="modal-view-mode">
                    <div class="modal-field">
                        <label class="modal-label">Description</label>
                        <p id="modal-description" class="modal-value">-</p>
                    </div>
                    <div class="modal-field-row">
                        <div class="modal-field">
                            <label class="modal-label">Status</label>
                            <span id="modal-status" class="modal-badge">-</span>
                        </div>
                        <div class="modal-field">
                            <label class="modal-label">Priority</label>
                            <span id="modal-priority" class="modal-badge">-</span>
                        </div>
                    </div>
                    <div class="modal-field-row">
                        <div class="modal-field">
                            <label class="modal-label">Type</label>
                            <span id="modal-type" class="modal-badge">-</span>
                        </div>
                        <div class="modal-field">
                            <label class="modal-label">Owner</label>
                            <span id="modal-owner" class="modal-value">-</span>
                        </div>
                    </div>
                    <div class="modal-field" id="modal-progress-field" style="display:none;">
                        <label class="modal-label">Progress</label>
                        <div class="modal-progress-bar">
                            <div id="modal-progress-fill" class="modal-progress-fill"></div>
                        </div>
                        <span id="modal-progress-text" class="modal-value-small">0%</span>
                    </div>
                </div>

                <!-- Edit Mode -->
                <div id="modal-edit-mode" style="display:none;">
                    <div class="modal-field">
                        <label class="modal-label" for="edit-title">Title</label>
                        <input type="text" id="edit-title" class="modal-input" placeholder="Task title">
                    </div>
                    <div class="modal-field">
                        <label class="modal-label" for="edit-description">Description</label>
                        <textarea id="edit-description" class="modal-textarea" rows="3" placeholder="Task description"></textarea>
                    </div>
                    <div class="modal-field-row">
                        <div class="modal-field">
                            <label class="modal-label" for="edit-status">Status</label>
                            <select id="edit-status" class="modal-select">
                                <option value="todo">TODO</option>
                                <option value="in-progress">IN PROGRESS</option>
                                <option value="done">DONE</option>
                            </select>
                        </div>
                        <div class="modal-field">
                            <label class="modal-label" for="edit-priority">Priority</label>
                            <select id="edit-priority" class="modal-select">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-field-row">
                        <div class="modal-field">
                            <label class="modal-label" for="edit-type">Type</label>
                            <select id="edit-type" class="modal-select">
                                <option value="task">Task</option>
                                <option value="feature">Feature</option>
                                <option value="milestone">Milestone</option>
                                <option value="bug">Bug</option>
                                <option value="debt">Debt</option>
                            </select>
                        </div>
                        <div class="modal-field">
                            <label class="modal-label" for="edit-owner">Owner</label>
                            <input type="text" id="edit-owner" class="modal-input" placeholder="Owner name">
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <!-- View mode buttons -->
                <div id="modal-view-actions" class="modal-actions">
                    <button id="modal-edit-btn" class="modal-btn modal-btn-primary">Edit</button>
                    <button id="modal-delete-btn" class="modal-btn modal-btn-danger">Delete</button>
                </div>
                <!-- Edit mode buttons -->
                <div id="modal-edit-actions" class="modal-actions" style="display:none;">
                    <button id="modal-save-btn" class="modal-btn modal-btn-save">Save</button>
                    <button id="modal-cancel-btn" class="modal-btn modal-btn-cancel">Cancel</button>
                </div>
            </div>

            <!-- Delete confirmation overlay -->
            <div id="modal-delete-confirm" class="modal-delete-confirm" style="display:none;">
                <p>Are you sure you want to delete this task?</p>
                <p class="modal-delete-task-name"></p>
                <div class="modal-actions">
                    <button id="modal-confirm-delete-btn" class="modal-btn modal-btn-danger">Yes, Delete</button>
                    <button id="modal-cancel-delete-btn" class="modal-btn modal-btn-cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/particles.js"></script>
    <script src="/js/board-viz.js"></script>
    <script src="/js/task-modal.js"></script>
    <script src="/js/timeline-reader.js"></script>
</body>
</html>
